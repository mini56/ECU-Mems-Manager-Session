name: REPORT AKM6348 CH86 SOURCE PASS
on:
  push:
    branches: [RAPPORT]
    paths:
      - '.github/workflows/report-akm6348-ch86-source-pass.yml'
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Record verified AKM6348 CH86 binary source
        shell: bash
        run: |
          git pull --rebase origin RAPPORT
          printf '\n## 2026-08-29 - AKM6348 FR - CHAPITRE 86 BINAIRE REPRODUCTIBLE TROUVE\n\n' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          printf '%s\n' '- Source historique retrouvee via AutoPassion: le manuel Rover AKM6348 chapitre 86 etait distribue a http://virgyl.f.free.fr/Download/Manuel/CH86.pdf.' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          printf '%s\n' '- Workflow TEMP AKM6348 FR CH86 VERIFY, run 33260257940, job 99120858948: SUCCESS complet.' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          printf '%s\n' '- Le serveur virgyl.f.free.fr repond encore et fournit un vrai PDF 1.4: 7 626 962 octets, 53 pages, SHA-256 14fcb88e3f450cab47129b2acc8df948e1d4002418deef63a95ce45157be0594.' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          printf '%s\n' '- Le PDF est un scan image sans couche texte exploitable: PyMuPDF renvoie du texte vide sur les pages testees; aucun numero 86.xx ne doit donc etre deduit par OCR approximatif ou offset.' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          printf '%s\n' '- Le binaire complet n est pas conserve dans le depot. Seuls son URL, son hash et les futures pages utiles selectionnees/capturees seront traces.' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          printf '%s\n' '- Prochaine action exacte: rendre une planche-contact basse resolution des 53 pages hors depot, identifier visuellement les etiquettes/pages utiles puis ne conserver que les vues necessaires a la base avec leur index physique exact.' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          printf '%s\n' '- MEMSX64 reste BUILD #101 inchange; la base/documentation reste consultative.' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git rm .github/workflows/report-akm6348-ch86-source-pass.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git commit -m 'Record verified AKM6348 CH86 source binary'
          git push origin RAPPORT
