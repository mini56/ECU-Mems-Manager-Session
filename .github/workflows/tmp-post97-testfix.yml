name: TEMP POST97 TESTFIX

on:
  push:
    branches: [tmp-ia-post97-audit-fix]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'TEMP fix QStringList test compatibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-ia-post97-audit-fix
      - name: Fix MSVC Qt5 QStringList comparison in self-test
        shell: python
        run: |
          from pathlib import Path
          p=Path('expert/IaResponseLogicTest.cpp')
          s=p.read_text(encoding='utf-8')
          old='''    ok &= require(IaMemsConversationRouting::inductionEvidenceProbes(\n                      QStringLiteral("Broche MAP Mini"), true, QStringLiteral("AANMP002"))\n                      == QStringList{QStringLiteral("AANMP002")},\n                  "connected firmware is strong SPi/MPi evidence");'''
          new='''    const QStringList connectedProbes = IaMemsConversationRouting::inductionEvidenceProbes(\n        QStringLiteral("Broche MAP Mini"), true, QStringLiteral("AANMP002"));\n    ok &= require(connectedProbes.size() == 1\n                      && connectedProbes.at(0) == QStringLiteral("AANMP002"),\n                  "connected firmware is strong SPi/MPi evidence");'''
          if old not in s:
              raise SystemExit('target comparison not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add expert/IaResponseLogicTest.cpp
          git commit -m "TEMP fix QStringList test compatibility"
          git push origin HEAD:tmp-ia-post97-audit-fix
