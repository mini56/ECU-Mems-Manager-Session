          '@
          $iss | Set-Content setup-session-182.iss -Encoding utf8
          & $compiler.FullName setup-session-182.iss
          if($LASTEXITCODE -ne 0){throw 'INNO_BUILD_FAILED'}
          $setup=Get-ChildItem setup-session-182 -File -Filter '*.exe' | Select-Object -First 1
          if(-not $setup -or $setup.Length -lt 100MB){throw 'SETUP_TOO_SMALL_OR_MISSING'}
          Write-Host "SESSION_182_SETUP_SHA256=$((Get-FileHash $setup.FullName -Algorithm SHA256).Hash)"
      - name: Installer et demarrer reellement sous Windows sans base RAVE
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $setup=Get-ChildItem setup-session-182 -File -Filter '*.exe' | Select-Object -First 1
          $folder=Join-Path $env:RUNNER_TEMP 'SESSION_182_INSTALLED'
          if(Test-Path $folder){Remove-Item $folder -Recurse -Force}
          $install=Start-Process -FilePath $setup.FullName -ArgumentList '/LANG=french','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$folder" -Wait -PassThru
          if($install.ExitCode -ne 0){throw "SETUP_INSTALL_EXIT_$($install.ExitCode)"}
          if(-not(Test-Path "$folder/ecu_mems_manager.exe")){throw 'INSTALLED_EXE_MISSING'}
          foreach($lang in @('fr','en','es','it','pt','de')){
            $catalog=Join-Path $folder "translations/$lang/${lang}_session162.json"
            $origin=Join-Path (Resolve-Path build-session-182/Release).Path "translations/$lang/${lang}_session162.json"
            if(-not(Test-Path $catalog)){throw "INSTALLED_TRANSLATION_MISSING_$lang"}
            if((Get-FileHash $origin -Algorithm SHA256).Hash -ne (Get-FileHash $catalog -Algorithm SHA256).Hash){throw "INSTALLED_TRANSLATION_SHA_MISMATCH_$lang"}
          }
          Write-Host 'SESSION_182_SIX_LANGUAGE_INSTALLED_SETUP_CATALOGUES_VERIFIED'
          if(Test-Path "$folder/database/documentary"){throw 'DOCUMENTARY_SQLITE_INSIDE_SETUP'}
          if(Test-Path "$folder/database/ecu_mems_manager.sqlite"){throw 'USER_DATABASE_IN_SETUP'}
          foreach($file in @('MEMSLibrary.dll','MEMSLibrary_Pack_001/knowledge.sqlite','database/reference/runtime_visual_catalog.json','mems_manager_x64.dll')){
            if(-not(Test-Path (Join-Path $folder $file))){throw "INSTALLED_DIAGNOSTIC_FILE_MISSING $file"}
          }
          $ini=Get-Content "$folder/session-install-language.ini" -Raw
          if($ini -notmatch '(?m)^Language=fr\s*$'){throw 'SETUP_LANGUAGE_MISSING'}
          $instance=Start-Process -FilePath "$folder/ecu_mems_manager.exe" -WorkingDirectory $folder -PassThru
          Start-Sleep -Seconds 12
          $instance.Refresh()
          if($instance.HasExited){throw "INSTALLED_APP_EARLY_EXIT_$($instance.ExitCode)"}
          Stop-Process -Id $instance.Id -Force
          Write-Host 'SESSION_182_REAL_WINDOWS_INSTALL_START_AND_NO_DOCUMENTARY_DB_OK'
      - name: Tester les 15 pages et le bouton de MAJ du Setup installe sans ecran
        shell: pwsh
        timeout-minutes: 9
        run: |
          $ErrorActionPreference='Stop'
          $folder=Join-Path $env:RUNNER_TEMP 'SESSION_182_INSTALLED'
          $exe=Join-Path $folder 'ecu_mems_manager.exe'
          if(-not(Test-Path $exe)){throw 'INSTALLED_UI_SMOKE_EXE_MISSING'}
          $env:QT_QPA_PLATFORM='offscreen'
          $env:QT_OPENGL='software'
          $env:QT_PLUGIN_PATH=$folder
          $env:QT_QPA_PLATFORM_PLUGIN_PATH=Join-Path $folder 'platforms'
          $env:PATH="$folder;$env:PATH"
          if(-not(Test-Path (Join-Path $env:QT_QPA_PLATFORM_PLUGIN_PATH 'qoffscreen.dll'))){throw 'INSTALLED_QT_OFFSCREEN_PLUGIN_MISSING'}
          $stderr=Join-Path $folder 'session_ui_smoke_stderr.log'
          $stdout=Join-Path $folder 'session_ui_smoke_stdout.log'
          $log=Join-Path $folder 'session_ui_smoke_trace.log'
          foreach($file in @($stderr,$stdout,$log)){if(Test-Path $file){Remove-Item $file -Force}}
          $process=Start-Process -FilePath $exe -WorkingDirectory $folder -ArgumentList '--session-ui-smoke-test' -RedirectStandardError $stderr -RedirectStandardOutput $stdout -PassThru
          $finished=$process.WaitForExit(300000)
          foreach($file in @($log,$stderr,$stdout)){
            Write-Host "UI_SMOKE_DIAGNOSTIC=$file"
            if(Test-Path $file){Get-Content $file | Select-Object -Last 120}
            else{Write-Host 'FILE_NOT_CREATED'}
          }
          if(-not $finished){
            Get-Process -Id $process.Id -ErrorAction SilentlyContinue |
              Format-List Id,ProcessName,Responding,MainWindowTitle,CPU,Threads
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'INSTALLED_UI_SMOKE_TIMEOUT_300S'
          }
          if($process.ExitCode -ne 0){throw "INSTALLED_UI_SMOKE_FAILED_$($process.ExitCode)"}
          Write-Host 'SESSION_182_INSTALLED_UI_SIDEBAR_DATABASE_MENU_SMOKE_PASS'
      - name: Verifier les deux corrections de regression SESSION 182
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $logger=Get-Content logger.cpp -Raw
          $actuators=Get-Content memsinterface_dispatch.cpp -Raw
          $analysis=Get-Content analysistab_impl_part3.inc -Raw
          if($logger -notmatch 'QStandardPaths::DocumentsLocation' -or $logger -notmatch 'QDir\(\)\.mkpath\(m_logDir\)'){throw 'LOGGER_NOT_WRITABLE_USER_DOCUMENTS'}
          if($analysis -notmatch 'ECU MEMS Manager/logs'){throw 'ANALYSIS_LOG_DIRECTORY_MISMATCH'}
          $actuatorBlock=$actuators -split 'bool MEMSInterface::guardedMemsTestActuator\('
          if($actuatorBlock.Count -ne 2){throw 'ACTUATOR_FUNCTION_NOT_FOUND'}
          $actuatorBlock=$actuatorBlock[1] -split 'bool MEMSInterface::guardedMemsMoveIac\('
          if($actuatorBlock.Count -ne 2 -or $actuatorBlock[0] -match 'allowsMutation\(' -or $actuatorBlock[0] -notmatch 'mems_is_connected'){throw 'ACTUATOR_CONNECTION_REGRESSION'}
          Write-Host 'SESSION_182_LOGGING_AND_ACTUATOR_SOURCE_NON_REGRESSION_PASS'
