name: "SESSION 182 - Analyse boutons centrés et bulles aide orange blanc - Setup Windows"
run-name: SESSION 182 - BOUTONS COURBES COLONNES ET AIDE ORANGE BLANC - ${{ github.sha }}
on:
  workflow_dispatch:
  # Build and publish only when this dedicated workflow is committed.
  # Preserve old versions and run existing non-regression checks.
  # Verify new MEMS 2J module and keep the BUILD 177 K-Line/ROSCO non-regression.
  push:
    branches: [fix-documentary-additive-session-161-20261118]
    paths:
      - '.github/workflows/session-182-analysis-toolbar-help-icon-setup.yml'
permissions:
  contents: write
concurrency:
  group: session-documentary-182-update-test
  cancel-in-progress: true
env:
  MEMS_BUILD_NUMBER: '182'
  ORT_GENAI_VERSION: '0.14.0'
  ORT_GENAI_WIN_X64_SHA256: '8a303e52dc7be8fb2a5331929af451a25ac59774102d7fd09ef673adc85c5ebf'
  BASE_RELEASE_TAG: 'mems-build117-candidate-39395038798'
  BASE_ARCHIVE_NAME: 'ECU-MEMS-Manager-x64-BUILD117-CLEAN-V2.tar.gz'
  BASE_ARCHIVE_SHA256: '4f187bae49bfc134329b53eb4e455c2d125403fe510f2da08a8272b2dcb3cd3b'

jobs:
  build-and-install-test:
    name: Compiler et installer sans Rover, verifier le bouton et le diagnostic
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Charger les sources SESSION
        uses: actions/checkout@v4
      - name: Controler les sources sans patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python tools/validate_source_architecture.py
          if($LASTEXITCODE -ne 0){throw 'SOURCE_ARCHITECTURE_NOT_CLEAN'}
          python tools/audit_session_ui_i18n.py
          if($LASTEXITCODE -ne 0){throw 'SESSION_182_SIX_LANGUAGE_UI_AUDIT_FAILED'}
          Write-Host 'SESSION_182_SIX_LANGUAGE_KEYS_AND_GUIDES_VALIDATED'
          # Validate six guides and actual screenshot filenames before compilation.
          @'
          import re
          from pathlib import Path
          expected={896,897,898,899,900,901,905,907,910,911,912,914,915}
          filenames={f"Capture d’écran ({n}).png" for n in expected}
          files={p.name for p in Path('docs/aide/images').glob('*.png')}
          assert filenames <= files, filenames-files
          for lang in ('fr','en','es','it','pt','de'):
              name='help.html.in' if lang=='fr' else 'help_'+lang+'.html.in'
              page=Path(name).read_text(encoding='utf-8')
              pics=re.findall(r'<img\s+src=":/help/images/([^"]+)"',page)
              chapters=re.findall(r'<h2 id="([^"]+)"',page)
              assert len(pics)==13 and set(pics)==filenames, (lang,pics)
              assert len(chapters)==len(set(chapters))==29, lang
              assert all(x in chapters for x in ('chapter-usb','chapter-ecu19','chapter-mems2j','chapter-program-update')), lang
              updates=__import__('json').loads(Path('translations',lang,lang+'_program_update.json').read_text(encoding='utf-8'))
              assert all(isinstance(updates.get(str(n)),str) and updates[str(n)].strip() for n in range(17900,17912)), lang
          # Additional SESSION 182 source preflight: credits, custom DLL and
          # visually distinct light dials must be present in the actual build.
          credited=('Leopold Gunther','James Portman','Colin Bourassa','Andrew Revill','haro78')
          about=Path('aboutbox.cpp').read_text(encoding='utf-8')
          assert all(person in about for person in credited)
          assert 'Rover MEMS 1.9 (' in about and 'I18n::text(6206)' in about
          for lang in ('fr','en','es','it','pt','de'):
              guide=Path('help.html.in' if lang=='fr' else 'help_'+lang+'.html.in').read_text(encoding='utf-8')
              assert all(person in guide for person in credited), lang
              assert 'mems_manager_x64.dll' in guide, lang
              translations=__import__('json').loads(Path('translations',lang,lang+'_about.json').read_text(encoding='utf-8'))
              assert all(translations.get(str(n)) for n in (6204,6205,6206)),lang
          for file in ('overviewpage.cpp','settingspage.cpp','mappedinjection_runtime_part1.inc'):
              code=Path(file).read_text(encoding='utf-8')
              assert 'ecuDarkTheme' in code and 'darkTheme' in code and 'QColor("#ffffff")' in code, file
          for file in ('ecupages.cpp','analysistab_impl_part1.inc','analysistab_impl_part2.inc'):
              code=Path(file).read_text(encoding='utf-8')
              assert 'ecuDarkTheme' in code and 'QColor("#ffffff")' in code, file
          about=Path('aboutbox.cpp').read_text(encoding='utf-8')
          viewer=Path('helpviewer.cpp').read_text(encoding='utf-8')
          shell=Path('uishell.cpp').read_text(encoding='utf-8')
          updates=Path('sessionprogramupdate.cpp').read_text(encoding='utf-8')
          smoke=Path('uishellsmoketest.cpp').read_text(encoding='utf-8')
          assert 'Rover MEMS 2J (' in about
          assert 'memsHelpImageZoomSlider' in viewer and 'qrc:' in viewer
          assert 'uiProgramUpdateButton' in shell and 'new SessionProgramUpdate(window)' in shell
          assert 'MemsDocumentaryWindowsTransport::get' in updates and 'QThread::create' in updates
          assert 'QVersionNumber::compare' in updates and 'officialSetup(url)' in updates
          assert 'programUpdateCheckAction' in updates
          assert 'onAnchorClicked' in smoke and 'memsHelpImageZoomSlider' in smoke
          print('SESSION_182_UPDATE_HELP_ZOOM_NON_REGRESSION_SOURCE_PASS')
          # Analysis left display and existing right channel selector.
          main=Path('analysistab_impl_part3.inc').read_text(encoding='utf-8')
          curve=Path('analysistab_impl_part4.inc').read_text(encoding='utf-8')
          model=Path('analysistab_impl_part2.inc').read_text(encoding='utf-8')
          smoke=Path('uishellsmoketest.cpp').read_text(encoding='utf-8')
          assert 'analysisRightPanel' in main and 'analysisChannelsScroll' in main
          assert 'analysisValuesTable' in main and 'analysisViewModeButton' in model
          assert 'analysisCsvSeparator' in main and 'analysisCsvFields' in main
          assert 'setToolTip' in main and 'setAccessibleName' in main
          assert 'syncTableColumns()' in curve and 'onViewModeToggled' in curve
          assert 'AnalysisValuesTableModel' in model and 'headerData' in model
          assert 'm_selected==selected' not in model and 'm_selected.size()==selected.size()' in model
          assert 'Semicolon CSV must display both complete right-side names' in smoke
          assert 'Original curves lost after reading a standard CSV' in smoke
          for lang in ('fr','en','es','it','pt','de'):
              guide=Path('help.html.in' if lang=='fr' else 'help_'+lang+'.html.in').read_text(encoding='utf-8')
              chapter=guide.split('<h2 id="chapter-11">',1)[1].split('<h2 id="chapter-12">',1)[0]
              assert any(word in chapter.lower() for word in ('colon','column','colunas','spalten')), lang
              translate=__import__('json').loads(Path('translations',lang,lang+'_analysis_table.json').read_text(encoding='utf-8'))
              assert all(isinstance(translate.get(str(k)),str) and translate[str(k)].strip() for k in range(18020,18026)),lang
          print('SESSION_182_ANALYSIS_LEFT_SWITCH_CSV_RIGHT_NAMES_6_HELP_PASS')
          # Dark tooltips and release badge must be legible at all supported resolutions.
          tooltips=Path('tooltipbubblemanager.cpp').read_text(encoding='utf-8')
          theme=Path('styles.h').read_text(encoding='utf-8')
          shell=Path('uishell.cpp').read_text(encoding='utf-8')
          update=Path('sessionprogramupdate.cpp').read_text(encoding='utf-8')
          smoke=Path('uishellsmoketest.cpp').read_text(encoding='utf-8')
          assert 'uiProgramUpdateButton' in tooltips and 'if (bubble) bubble->hide()' in tooltips
          assert 'QToolTip{background-color:#1b2731;color:#f4f7fa;' in shell
          assert 'background-color: #1b2731;' in theme and 'color: #f4f7fa;' in theme
          assert 'background-color: #fff9f1;' in theme and 'color: #202936;' in theme
          assert 'horizontalAdvance(m_indicator->text())+30' in update
          assert 'Update button version obscured by tooltip bubble or clipped' in smoke
          assert 'Tooltips must have legible contrasting colors in both themes' in smoke
          print('SESSION_182_DARK_LIGHT_TOOLTIP_AND_BADGE_GEOMETRY_PASS')
          # UI-only change: toolbar buttons share the same CSV-load row.
          toolbar=Path('analysistab_impl_part2.inc').read_text(encoding='utf-8')
          panels=Path('analysistab_impl_part3.inc').read_text(encoding='utf-8')
          themeStyle=Path('analysistab_impl_part1.inc').read_text(encoding='utf-8')
          bubble=Path('tooltipbubblemanager.cpp').read_text(encoding='utf-8')
          checkUI=Path('uishellsmoketest.cpp').read_text(encoding='utf-8')
          assert all(t in toolbar for t in ('analysisFileToolbar','analysisViewModeControls','analysisCurvesModeButton','analysisViewModeButton','analysisViewModeHelp'))
          assert 'right->addWidget(m_loadButton)' not in panels and 'right->addWidget(m_diagnosticLiveButton)' in panels
          assert 'QButtonGroup *modeGroup' in toolbar and 'modeGroup->setExclusive(true)' in toolbar
          assert 'topRow->setColumnMinimumWidth(2,fileControls->sizeHint().width())' in toolbar
          assert 'TooltipBubbleManager::helpBubblePixmap' in toolbar and 'TooltipBubbleManager::helpBubblePixmap' in themeStyle
          assert 'QColor(QStringLiteral("#ff8a1c"))' in bubble and 'painter.setPen(Qt::white)' in bubble
          assert 'painter.setPen(QPen(Qt::white,1.6))' in bubble
          assert 'button->setFixedHeight(36)' in toolbar
          assert 'analysisViewModeHelp' in bubble and 'QEvent::StyleChange' in bubble
          assert 'Two centred Analysis display buttons' in checkUI and 'Light Help bubble must be orange with white text' in checkUI
          print('SESSION_182_CENTRED_TWO_BUTTONS_ORANGE_WHITE_HELP_SIX_LANGUAGES_PASS')
          print('SESSION_182_LIGHT_THEME_AND_CREDITS_PREFLIGHT_PASS')
          print('SESSION_182_HELP_6_LANGUAGES_29_CHAPTERS_13_IMAGES_PASS')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'SESSION_182_HELP_PRECHECK_FAILED'}
          $analysis=Get-Content analysistab_impl_part3.inc -Raw
          $analysisDynamic=Get-Content analysistab_impl_part4.inc -Raw
          $smoke=Get-Content uishellsmoketest.cpp -Raw
          if($analysis -notmatch 'analysisChannelsScroll' -or $analysis -notmatch 'SetMinAndMaxSize'){throw 'ANALYSIS_CHANNEL_SCROLL_SOURCE_MISSING'}
          if($analysisDynamic -notmatch 'm_checkboxContainer->updateGeometry\(\)'){throw 'ANALYSIS_CHANNEL_LIST_GEOMETRY_NOT_REFRESHED'}
          if($smoke -notmatch 'Mandatory Analysis vertical scrollbar not visible' -or $smoke -notmatch 'Analysis content exceeds viewport but cannot scroll' -or $smoke -notmatch 'QSize\(1920,1080\)'){throw 'ANALYSIS_TWO_SCROLL_REAL_UI_TEST_MISSING'}
          $srcStyle=Get-Content analysistab_impl_part1.inc -Raw
          $srcPlots=Get-Content analysistab_impl_part2.inc -Raw
          if($srcStyle -notmatch 'configureAnalysisVisibleScroll' -or $srcPlots -notmatch 'configureAnalysisVisibleScroll\(m_stackScrollArea\)' -or $srcStyle -notmatch 'area->setVerticalScrollBarPolicy\(Qt::ScrollBarAlwaysOn\)'){throw 'VISIBLE_PLOT_SCROLL_MISSING'}
          Write-Host 'SESSION_182_BOTH_SCROLLS_SOURCE_TEST_READY'
          if((Get-Content database/MemsDatabaseExplorerV2.cpp -Raw) -notmatch 'documentaryUpdateButton'){throw 'DOCUMENTARY_UPDATE_BUTTON_MISSING'}
          if((Get-Content database/MemsDocumentaryRepository.cpp -Raw) -match 'QStringLiteral\("database/documentary/rover_482.sqlite"\)'){throw 'ROVER_STILL_HARDCODED_IN_RUNTIME'}
          if((Get-Content CMakeLists.txt -Raw) -notmatch 'MemsDocumentaryUpdateDialog.cpp'){throw 'UPDATE_DIALOG_NOT_COMPILED'}
          if((Get-Content CMakeLists.txt -Raw) -notmatch 'MemsDocumentaryImageViewer.cpp'){throw 'IMAGE_VIEWER_NOT_COMPILED'}
          $ia=Get-Content iamemstab.cpp -Raw
          if($ia -notmatch 'iaMemsLastDocumentaryImagePaths' -or $ia -notmatch 'MemsDocumentaryImageViewer::show'){throw 'IA_IMAGES_NOT_WIRED'}
          $service=Get-Content expert/IaMemsLibraryIntegration.cpp -Raw
          if($service -notmatch 'iaMemsLastDocumentaryImagePath'){throw 'IA_IMAGE_PROVENANCE_NOT_CONNECTED'}
          $reader=Get-Content database/MemsDocumentaryRepository.cpp -Raw
          $catalog=Get-Content database/MemsDocumentaryPackCatalog.cpp -Raw
          $installer=Get-Content database/MemsDocumentaryLocalInstaller.cpp -Raw
          if($reader -notmatch 'SELECT relative_path,asset_sha256,asset_bytes' -or $reader -notmatch 'installedDatabasePaths' -or $catalog -notmatch 'installedDatabasePaths' -or $installer -notmatch 'documentIds'){throw 'MULTIBASE_CODE_MISSING'}
          $years=Get-Content database/MemsDatabaseExplorerV2.cpp -Raw
          if($years -notmatch 'SELECT vehicle_years FROM documentary_model_years' -or $years -notmatch 'restoreDocumentaryYears\(&fetched\)' -or $years -notmatch 'row.value\(QStringLiteral\("model_years"\)\)'){throw 'VERIFIED_DOCUMENTARY_YEARS_DISPLAY_MISSING'}
          Write-Host 'SESSION_182_VERIFIED_DOCUMENTARY_YEARS_READER_PASS'
          Write-Host 'SESSION_182_MULTIBASE_SOURCE_PASS'
          Write-Host 'SESSION_SOURCE_DOCUMENTARY_UPDATE_ISOLATION_PASS'
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer Qt 5.15.2 MSVC x64
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check 'aqtinstall==3.3.0' pefile
          if($LASTEXITCODE -ne 0){throw 'QT_INSTALL_PREP_FAILED'}
          $sevenZip=(Get-Command 7z.exe -ErrorAction Stop).Source
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtcharts -O C:\Qt --external $sevenZip
          if($LASTEXITCODE -ne 0){throw 'QT_INSTALL_FAILED'}
      - name: Recuperer le SDK ONNX GenAI 0.14.0 sans changer l'IA
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $name="onnxruntime-genai-$env:ORT_GENAI_VERSION-win-x64.zip"
          $archive=Join-Path $env:RUNNER_TEMP $name
          $folder=Join-Path $env:RUNNER_TEMP 'onnx-genai'
          $url="https://github.com/microsoft/onnxruntime-genai/releases/download/v$env:ORT_GENAI_VERSION/$name"
          curl.exe -L --fail --retry 1 --retry-delay 1 -o $archive $url
          if($LASTEXITCODE -eq 0){
            if((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:ORT_GENAI_WIN_X64_SHA256){throw 'ONNX_GITHUB_SHA256_MISMATCH'}
            Expand-Archive $archive $folder -Force
            Write-Host 'ONNX_OFFICIAL_0140_VERIFIED'
          }else{
            if(Test-Path $archive){Remove-Item $archive -Force}
            $stem="microsoft.ml.onnxruntimegenai.$env:ORT_GENAI_VERSION"
            $root="https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntimegenai/$env:ORT_GENAI_VERSION"
            $package=Join-Path $env:RUNNER_TEMP "$stem.nupkg"
            curl.exe -L --fail --retry 2 --retry-delay 2 -o $package "$root/$stem.nupkg"
            if($LASTEXITCODE -ne 0){throw 'ONNX_NUGET_DOWNLOAD_FAILED'}
            dotnet nuget verify "$package" --all --verbosity normal
            if($LASTEXITCODE -ne 0){throw 'ONNX_NUGET_SIGNATURE_CHECK_FAILED'}
            # Verify Microsoft-signed package instead of the nonexistent NuGet .sha512 endpoint.
            Write-Host 'ONNX_NUGET_SIGNATURE_VERIFIED'
            $zip=Join-Path $env:RUNNER_TEMP 'onnx-genai-nuget-0140.zip'
            Copy-Item $package $zip -Force
            Expand-Archive $zip $folder -Force
            Write-Host 'ONNX_NUGET_0140_VERIFIED'
          }
          $header=Get-ChildItem $folder -Recurse -File -Filter ort_genai_c.h | Select-Object -First 1
          # Require x64 import library: the signed NuGet also contains ARM64.
          $lib=Get-ChildItem $folder -Recurse -File -Filter onnxruntime-genai.lib |
            Where-Object {$_.FullName.Contains('win-x64') -and -not $_.FullName.Contains('win-arm64')} |
            Select-Object -First 1
          if(-not $lib){throw 'ONNX_WIN_X64_IMPORT_LIBRARY_NOT_FOUND'}
          Write-Host "ONNX_GENAI_X64_LIBRARY=$($lib.FullName)"
          if(-not $header -or -not $lib){
            Get-ChildItem $folder -Recurse -File | Where-Object {$_.Name -match '(genai|ort_genai)'} | Select-Object -First 35 FullName | Format-Table
            throw 'ONNX_CPP_HEADER_OR_LIB_MISSING_DO_NOT_DISABLE_AI'
          }
          "ORT_GENAI_INCLUDE_DIR=$($header.Directory.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ORT_GENAI_LIBRARY=$($lib.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Controler la communication K-Line 1.9 et le chemin ROSCO historique
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dispatcher=Get-Content memsinterface_dispatch.cpp -Raw
          $interface=Get-Content memsinterface.cpp -Raw
          $protocol=Get-Content librosco-x64/protocol.c -Raw
          $exports=Get-Content librosco-x64/mems_manager_x64.def -Raw
          $appHeader=Get-Content rosco.h -Raw
          if($appHeader -notmatch 'mems_init_link_kline19' -or
             $appHeader -notmatch 'mems_read_kline19'){throw 'MEMS19_APP_HEADER_KLINE_DECLARATIONS_MISSING'}
          if($dispatcher -notmatch 'mems_init_link_kline19' -or
             $dispatcher -notmatch 'mems_connect' -or
             $interface -notmatch 'mems_read_kline19' -or
             $interface -notmatch 'mems_read' -or
             $protocol -notmatch 'mems19_packet' -or
             $exports -notmatch 'mems_read_kline19'){throw 'MEMS19_KLINE_SOURCE_INCOMPLETE'}
          Write-Host 'SESSION_182_KLINE_SOURCE_AND_LEGACY_ROSCO_PRESERVED_PASS'
      - name: Verifier le contrat source MEMS 2J sans toucher a ROSCO
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p=Get-Content mems2jprotocol.h -Raw -Encoding utf8
          $d=Get-Content memsinterface_dispatch.cpp -Raw -Encoding utf8
          $reader=Get-Content memsinterface.cpp -Raw -Encoding utf8
          $source=Get-Content CMakeLists.txt -Raw
          $ui=Get-Content mainwindow.cpp -Raw
          if($p -notmatch 'generateKey' -or $p -notmatch 'decodeFaults' -or $p -notmatch 'setBreakEnabled' -or $p -notmatch '10400' -or $p -notmatch 'unpack'){
            throw 'MEMS2J_PROTOCOL_CORE_MISSING'
          }
          if($d -notmatch 'connectMems2J' -or $d -notmatch 'connectMems19' -or $d -notmatch 'connectRosco' -or
             $reader -notmatch 'Mems2J' -or $source -notmatch 'mems2j_protocol_selftest' -or
             $ui -notmatch 'update2JData'){throw 'MEMS2J_AUTO_CONNECT_UI_OR_TEST_MISSING'}
          Write-Host 'SESSION_182_MEMS2J_PROTOCOL_AND_EXISTING_CONNECTION_CONTRACT_PASS'
      - name: Compiler SESSION et tests de mise a jour
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake -S . -B build-session-182 -A x64 -DCMAKE_PREFIX_PATH='C:/Qt/5.15.2/msvc2019_64' -DMEMS_USE_BUNDLED_LIBROSCO_X64=ON -DMEMS_RUN_REFERENCE_SELFTEST_POST_BUILD=OFF -DMEMS_USE_ONNX_GENAI=ON "-DORT_GENAI_INCLUDE_DIR=$env:ORT_GENAI_INCLUDE_DIR" "-DORT_GENAI_LIBRARY=$env:ORT_GENAI_LIBRARY"
          if($LASTEXITCODE -ne 0){throw 'CMAKE_SESSION_CONFIG_FAILED'}
          $helpQrc=Get-Content 'build-session-182/mems-help-illustrations.qrc' -Raw -Encoding utf8
          if(([regex]::Matches($helpQrc,'<file alias=')).Count -ne 13){throw 'SESSION_182_HELP_QRC_MISSING_IMAGES'}
          Write-Host 'SESSION_182_HELP_IMAGES_EMBEDDED_PASS'
          # mems19_protocol_selftest runs in the executable's CMake POST_BUILD.
          # Qt DLLs must already be resolvable at this stage on Windows.
          $env:PATH="C:\Qt\5.15.2\msvc2019_64\bin;$env:PATH"
          cmake --build build-session-182 --config Release --target ecu_mems_manager ecu_mems_uninstaller mems_documentary_update_selftest mems_documentary_selftest mems_documentary_multilingual_selftest mems_documentary_native_intent_selftest mems_documentary_encrypted_selftest mems_documentary_encrypted_install_selftest mems_ecu_reference_routing_selftest --parallel
          if($LASTEXITCODE -ne 0){throw 'CMAKE_SESSION_COMPILATION_FAILED'}
          if(-not(Test-Path build-session-182/Release/ecu_mems_manager.exe)){throw 'SESSION_EXE_MISSING'}
          $bin=(Resolve-Path build-session-182/Release).Path
          $env:PATH="C:\Qt\5.15.2\msvc2019_64\bin;$bin;$env:PATH"
          & "$bin/mems_ecu_reference_routing_selftest.exe"
          if($LASTEXITCODE -ne 0){throw 'ECU_REFERENCE_ROUTING_NON_REGRESSION_FAILED'}
          & "$bin/mems19_protocol_selftest.exe"
          if($LASTEXITCODE -ne 0){throw 'MEMS19_PROTOCOL_SELFTEST_FAILED'}
          Write-Host 'SESSION_182_MEMS19_PROTOCOL_SELFTEST_PASS'
          & "$bin/mems2j_protocol_selftest.exe"
          if($LASTEXITCODE -ne 0){throw 'MEMS2J_PROTOCOL_SELFTEST_FAILED'}
          Write-Host 'SESSION_182_MEMS2J_PROTOCOL_SELFTEST_PASS'
          Write-Host 'SESSION_182_ECU_ROUTING_AND_EXISTING_IA_INTENT_NON_REGRESSION_PASS'
          Write-Host 'SESSION_182_COMPILE_PASS'
      - name: Tester le catalogue de mises a jour sans connexion ni base Rover
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $qt='C:\Qt\5.15.2\msvc2019_64'
          $bin=(Resolve-Path build-session-182/Release).Path
          & "$qt/bin/windeployqt.exe" --release --compiler-runtime --no-translations --dir $bin "$bin/mems_documentary_update_selftest.exe"
          if($LASTEXITCODE -ne 0){throw 'UPDATE_QT_DEPLOY_FAILED'}
          & "$bin/mems_documentary_update_selftest.exe"
          if($LASTEXITCODE -ne 0){throw 'UPDATE_CATALOG_SELFTEST_FAILED'}
      - name: Tester les bases ajoutées dans SESSION (vrai installateur, 2 PDF différents)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check 'cryptography>=42,<47' pymupdf
          if($LASTEXITCODE -ne 0){throw 'DOCUMENTARY_PDF_AES_DEPS_FAILED'}
          $qt='C:\Qt\5.15.2\msvc2019_64'
          $bin=(Resolve-Path build-session-182/Release).Path
          python tools/test_documentary_encrypted_fixture.py --output "$bin"
          if($LASTEXITCODE -ne 0){throw 'ENCRYPTED_TEST_FIXTURE_FAILED'}
          & "$qt/bin/windeployqt.exe" --release --compiler-runtime --no-translations --dir $bin "$bin/mems_documentary_encrypted_selftest.exe"
          if($LASTEXITCODE -ne 0){throw 'ENCRYPTED_QT_DEPLOY_FAILED'}
          & "$bin/mems_documentary_encrypted_selftest.exe" "$bin/test_plain.encrypted" "$bin/test_plain.zip"
          if($LASTEXITCODE -ne 0){throw 'NATIVE_AES_GCM_DECRYPTION_TEST_FAILED'}
          New-Item -ItemType Directory -Force output/documentary-install-test | Out-Null
          @'
          import sys
          from pathlib import Path
          import fitz
          sys.path.insert(0,"tools")
          from add_documentary_pdf import append_pdf
          root=Path("output/documentary-install-test")
          pdf1=root/"first_unrelated_manual.pdf"
          pdf2=root/"second_unrelated_manual.pdf"
          for file,text in [(pdf1,"Manual one source"),(pdf2,"Manual two source")]:
              with fitz.open() as pdf:
                  page=pdf.new_page()
                  page.insert_text((72,72),text)
                  pdf.save(file)
          first=root/"one.zip"
          second=root/"two.zip"
          report1=append_pdf(None,pdf1,"fr",first)
          report2=append_pdf(first,pdf2,"fr",second)
          assert report1["document_count"]==1
          assert report2["document_count"]==2
          print("SESSION_182_TWO_PDF_CUMULATIVE_LANGUAGE_DB_READY")
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'TWO_DOCUMENTARY_PDF_IMPORTS_FAILED'}
          @'
          from pathlib import Path
          import zipfile
          root=Path("output/documentary-install-test")
          with zipfile.ZipFile(root/"two.zip") as z:
              z.extractall(root/"two")
