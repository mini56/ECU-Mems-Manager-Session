          $hash=(Get-FileHash -LiteralPath $final -Algorithm SHA256).Hash.ToLowerInvariant()
          $hashFile=Join-Path $setup.DirectoryName 'SESSION-182-Setup.sha256'
          "$hash  $asset" | Set-Content -LiteralPath $hashFile -Encoding ascii
          $notes=@'
          ECU MEMS Manager SESSION 182 — Analyse : barre d'outils simplifiée et Aide orange/blanc

          - Deux boutons distincts « Courbes » et « Colonnes » centrés sur la même ligne que le chargement CSV / TXT.
          - Les boutons ne masquent aucun texte, et le bouton actif reste orange.
          - Une icône d'aide indépendante est placée APRÈS les deux boutons.
          - En thème clair, toutes les bulles d'aide de SESSION utilisent une bulle orange avec l'inscription HELP blanche, sans fond noir.
          - Le thème sombre conserve son icône actuelle. Les infobulles restent disponibles au survol.
          - Traductions et aide actualisées en six langues.
          - La partie droite Analyse, la sélection des voies, la lecture CSV, les graphiques et les mesures restent inchangées.
          - Même dépôt, même branche ; compilation Windows, installation et tests de non-régression UI.

          ---

          ### English

          ECU MEMS Manager SESSION 182 — Centered Analysis mode buttons and orange/white Help icons

          - Separate Curves and Columns buttons are centered on the same line as Load CSV/TXT.
          - The Help bubble is placed after both buttons, never overlapping text.
          - In the light theme, Help bubbles are orange with white lettering; dark icons remain unchanged.
          - Updated six-language translations and Help instructions.
          - Existing right-side Analysis controls, CSV imports, graphs and ECU protocols are unchanged.
          - Windows installed Setup and UI regression checks included.
          '@
          # This workflow is the sole publisher; never fall back to the GitHub Actions
          # artifact service, whose storage quota blocked the previous successful build.
          gh release view $tag --json id --jq .id 1>$null 2>$null
          if($LASTEXITCODE -eq 0){throw 'SESSION_182_RELEASE_ALREADY_EXISTS_NO_OVERWRITE'}
          gh release create $tag $final $hashFile --target $env:GITHUB_SHA --title 'ECU-Mems-Manager-Session - Version 182' --notes $notes --latest
          if($LASTEXITCODE -ne 0){throw 'SESSION_182_RELEASE_CREATE_OR_ASSET_UPLOAD_FAILED'}
          $assets=gh release view $tag --json assets --jq '.assets[].name'
          if($LASTEXITCODE -ne 0 -or -not ($assets -contains $asset) -or -not ($assets -contains 'SESSION-182-Setup.sha256')){
            throw 'SESSION_182_RELEASE_ASSET_VERIFICATION_FAILED'
          }
          Write-Host "SESSION_182_SETUP_RELEASE_PUBLISHED SHA256=$hash"
