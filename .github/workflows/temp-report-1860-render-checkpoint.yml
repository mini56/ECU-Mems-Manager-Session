name: TEMP REPORT 1860 RENDER CHECKPOINT

on:
  push:
    branches: [ RAPPORT ]
    paths:
      - '.github/workflows/temp-report-1860-render-checkpoint.yml'

permissions:
  contents: write

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Append checkpoint to master report
        shell: bash
        run: |
          python -c "import base64,pathlib; p=pathlib.Path('RAPPORT_SUIVI_ECU_MEMS_MANAGER.md'); p.write_bytes(p.read_bytes()+base64.b64decode(''))"
      - name: Commit checkpoint and remove helper
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-report-1860-render-checkpoint.yml
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git diff --cached --name-only | sort > /tmp/changed.txt
          printf '%s\n' '.github/workflows/temp-report-1860-render-checkpoint.yml' 'RAPPORT_SUIVI_ECU_MEMS_MANAGER.md' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'Record 1860 render reproduction checkpoint'
          git push origin HEAD:RAPPORT
