name: TEMP RAVEMEMS additive audit journal
on:
  push:
    branches:
      - RAPPORT
permissions:
  contents: write
jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 1
      - name: Append journal
        shell: bash
        run: |
          set -e
          printf '%s\n' '' '## 2026-09-01 - RAVEMEMS - AVANT AUDIT DE FUSION ADDITIVE' '' 'Regle utilisateur prioritaire : RAVEMEMS est ajoute a une copie de la base BUILD #103 et ne remplace aucune donnee historique. Import additif seulement, puis audit des doublons sans suppression automatique.' '' 'Sources verrouillees : BUILD #103 artefact 9738640151 run 33334306835 commit 1d6316bd1746d6f2b4cfb751cab88d18e27ef730 ; RAVEMEMS artefact 9791187684 run 33484362718 SQLite 8f2cb17525efb2c1b296bc675c781740a9db3e7de84f2e4150f3a3ebbe49a87b.' '' 'Action suivante : auditer la base #103 AVANT, creer une copie, appliquer le socle documentaire V1, importer les 47 documents et 1359 pages RAVEMEMS dans mems_doc_*, verifier que toutes les tables historiques restent identiques, puis produire les candidats doublons sans en supprimer aucun. Aucun QZ64 final, aucun MEMSX64.' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          rm .github/workflows/tmp-ravemems-journal-additive-audit-execution.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md .github/workflows/tmp-ravemems-journal-additive-audit-execution.yml
          git commit -m 'Record RAVEMEMS additive audit execution'
          git push origin HEAD:RAPPORT
