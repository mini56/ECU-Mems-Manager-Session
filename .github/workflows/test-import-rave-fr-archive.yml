name: RAVE FR - verified original PDF import into SESSION documentary language pack
on:
  push:
    branches: [fix-ia-documentary-single-source-20261114]
    paths:
      - 'tools/import_rave_fr_archive.py'
      - 'tools/test_import_rave_fr_archive.py'
      - 'tools/add_documentary_pdf.py'
      - 'tools/documentary_common.py'
      - 'tools/pack_mems_documentary.py'
      - 'tools/source_manifests/rave_fr_20261112.csv'
      - '.github/workflows/test-import-rave-fr-archive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF processing and authenticated ZIP packaging
        run: python -m pip install --disable-pip-version-check pymupdf cryptography
      - name: Check source contract, preserve old FR docs, reject unreadable sources
        run: |
          python -m compileall -q tools/import_rave_fr_archive.py tools/add_documentary_pdf.py tools/documentary_common.py tools/pack_mems_documentary.py
          python -m unittest discover -s tools -p test_import_rave_fr_archive.py -v
      - name: Source manifest must describe 11 distinct originals and 1309 pages
        run: |
          python - <<'PY'
          import csv,re
          p='tools/source_manifests/rave_fr_20261112.csv'
          with open(p,encoding='utf-8') as f: rows=list(csv.DictReader(f))
          assert len(rows)==11
          assert len({row['fichier'].lower() for row in rows})==11
          assert sum(int(row['objets_page_detectes']) for row in rows)==1309
          assert all(re.fullmatch(r'[a-f0-9]{64}',row['sha256']) for row in rows)
          print("RAVE_FR_11_ORIGINAL_MANUALS_SHA256_INVENTORY_READY")
          PY
