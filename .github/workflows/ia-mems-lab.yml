name: IA MEMS laboratory build

on:
  push:
    branches: ["lab-expert-engine"]
    paths:
      - "iamemstab.cpp"
      - "iamemstab.h"
      - "expert/**"
      - "database/MemsReferenceDatabase.cpp"
      - "database/MemsReferenceDatabase.h"
      - "CMakeLists.txt"
      - ".github/workflows/ia-mems-lab.yml"

permissions:
  contents: write

concurrency:
  group: ia-mems-lab
  cancel-in-progress: true

jobs:
  build-windows:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt and MinGW
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pip install aqtinstall
          aqt install-qt windows desktop 5.15.2 win32_mingw81 -m qtcharts -O C:\Qt
          if ($LASTEXITCODE -ne 0) { throw "Qt installation failed" }
          aqt install-tool windows desktop tools_mingw qt.tools.win32_mingw810 -O C:\Qt
          if ($LASTEXITCODE -ne 0) { throw "MinGW installation failed" }
          "C:\Qt\Tools\mingw810_32\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Qt\5.15.2\mingw81_32\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate librosco import library
        shell: pwsh
        run: |
          Set-Location prebuilt-librosco
          gendef librosco.dll
          if ($LASTEXITCODE -ne 0) { throw "gendef failed" }
          dlltool -d librosco.def -l librosco.dll.a
          if ($LASTEXITCODE -ne 0) { throw "dlltool failed" }

      - name: Configure application
        shell: pwsh
        run: |
          cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/mingw81_32;${{ github.workspace }}/prebuilt-librosco"
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }

      - name: Build application with IA MEMS
        id: appbuild
        continue-on-error: true
        shell: pwsh
        run: |
          cmake --build build --target ecu_mems_manager
          if ($LASTEXITCODE -ne 0) {
            "IA MEMS application build: FAILED`nsource_commit=${{ github.sha }}`nrun=${{ github.run_id }}" | Set-Content -Encoding UTF8 iamems_build_status.txt
            exit 1
          }
          if (-not (Test-Path "build\ecu_mems_manager.exe")) {
            "IA MEMS application build: FAILED - executable missing`nsource_commit=${{ github.sha }}`nrun=${{ github.run_id }}" | Set-Content -Encoding UTF8 iamems_build_status.txt
            exit 1
          }
          "IA MEMS application build: OK`nsource_commit=${{ github.sha }}`nrun=${{ github.run_id }}" | Set-Content -Encoding UTF8 iamems_build_status.txt

      - name: Record laboratory build result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f iamems_build_status.txt ]; then
            printf 'IA MEMS application build: FAILED before compile\nsource_commit=%s\nrun=%s\n' "${GITHUB_SHA}" "${GITHUB_RUN_ID}" > iamems_build_status.txt
          fi
          git add -- iamems_build_status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record IA MEMS laboratory build [skip ci]"
            git push origin HEAD:lab-expert-engine
          fi

      - name: Fail workflow if application did not build
        if: steps.appbuild.outcome != 'success'
        shell: bash
        run: exit 1
