name: Recherche instruments - sorties et commandes alternatives
on:
  push:
    branches: [research/mems-firmwares-20261126]
    paths: ['.github/workflows/research-instruments-reverse.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remonter des variables et sorties vers tous les handlers
        run: python3 research/instruments-integral-20261127/audit_reverse.py
      - uses: actions/upload-artifact@v4
        with:
          name: comparaison-recherche-inverse-483
          path: research/instruments-integral-20261127/results/*recherche_inverse*
      - name: Enregistrer les preuves et la comparaison
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/instruments-integral-20261127/results/*recherche_inverse*
          if ! git diff --cached --quiet; then
            git commit -m "Recherche instruments : comparaison inverse et preuves [skip ci]"
            git push origin HEAD:research/mems-firmwares-20261126
          fi
