name: TEMP RAVEMEMS V2 RCL0193ENG generic rules regression

on:
  push:
    branches: [tmp-ravemems-v2-foundation]
    paths:
      - '.github/workflows/tmp-ravemems-v2-rcl0193eng-generic-regression.yml'

permissions:
  contents: read

jobs:
  rcl0193eng-generic-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_SHA: 'a9e47832a2fbd3bf365a32e00d374ed7c70fba5c'
      PROTECTED_MEMSX64: '1d6316bd1746d6f2b4cfb751cab88d18e27ef730'
      SOURCE_MAIN_COMMIT: '643de091b474f4e27917a065bdf46d5a0c764276'
      SOURCE_PATH: 'rave/xn/wmxn990e.pdf'
      SOURCE_BLOB: '82263eb36bb194dfa969d0471d10ef11078ce521'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 0

      - name: Guard generic code and production
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TEST_SHA"
          test "$(git ls-remote origin refs/heads/MEMSX64 | awk '{print $1}')" = "$PROTECTED_MEMSX64"
          test -f ravemems/v2/generic_document_rules.py
          test -f .github/pass2/ravemems_generic_precise_extract.py
          test -f .github/pass2/rcl0193eng_visual_replay_validate.py
          echo "RCL0193ENG_GENERIC_REGRESSION_SHA_PASS $TEST_SHA"
          echo "PROTECTED_BUILD103_PASS $PROTECTED_MEMSX64"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and install pinned renderer
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="ravemems/v2:.github/pass2" python -m py_compile \
            ravemems/v2/generic_document_rules.py \
            ravemems/v2/prototype_extract.py \
            .github/pass2/rcl0193eng_zero_defect_pass2.py \
            .github/pass2/rcl0193eng_precise_visual_extract.py \
            .github/pass2/ravemems_generic_precise_extract.py \
            .github/pass2/rcl0193eng_visual_replay_validate.py
          python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.4'

      - name: Fetch exact RCL0193ENG source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_MAIN_COMMIT"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_MAIN_COMMIT"
          test "$(git rev-parse "$SOURCE_MAIN_COMMIT:$SOURCE_PATH")" = "$SOURCE_BLOB"
          mkdir -p "$RUNNER_TEMP/ravemems-source"
          git show "$SOURCE_MAIN_COMMIT:$SOURCE_PATH" > "$RUNNER_TEMP/ravemems-source/wmxn990e.pdf"
          test -s "$RUNNER_TEMP/ravemems-source/wmxn990e.pdf"

      - name: Extract complete RCL0193ENG with generic rules
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rcl0193eng-generic"
          rm -rf "$out"
          PYTHONPATH="ravemems/v2:.github/pass2" python .github/pass2/ravemems_generic_precise_extract.py \
            --pdf "$RUNNER_TEMP/ravemems-source/wmxn990e.pdf" \
            --schema ravemems/v2/schema.sql \
            --profile ravemems/v2/profiles/rcl0193eng.json \
            --out "$out" \
            --source-relative-path "$SOURCE_PATH" \
            --source-commit "$SOURCE_MAIN_COMMIT" \
            --source-blob-sha "$SOURCE_BLOB" \
            | tee "$RUNNER_TEMP/rcl0193eng-generic-extract.log"

      - name: Require exact semantic regression counts
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rcl0193eng-generic"
          python - "$out" <<'PY'
          import json, sqlite3, sys
          from pathlib import Path
          out = Path(sys.argv[1])
          m = json.loads((out / 'manifest.json').read_text(encoding='utf-8'))
          db = sqlite3.connect(out / 'ravemems_v2_rcl0193eng.sqlite')
          assert m['document_kind'] == 'workshop_manual', m['document_kind']
          counts = m['counts']
          assert counts['ravemems_operation'] == 201, counts
          assert counts['ravemems_phase'] == 397, counts
          assert counts['ravemems_step'] == 3104, counts
          assert counts['ravemems_visual'] == 738, counts
          assert counts['ravemems_visual_link'] == 401, counts
          assert m['numeric_phase_defect_count'] == 0
          assert db.execute("SELECT COUNT(*) FROM ravemems_review_flag WHERE status='open'").fetchone()[0] == 0
          assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          assert db.execute('PRAGMA foreign_key_check').fetchall() == []
          print('RCL0193ENG_GENERIC_DOCUMENT_KIND_PASS workshop_manual')
          print('RCL0193ENG_GENERIC_OPERATIONS_PASS 201')
          print('RCL0193ENG_GENERIC_PHASES_PASS 397')
          print('RCL0193ENG_GENERIC_STEPS_PASS 3104')
          db.close()
          PY

      - name: Replay all 738 visuals exactly
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rcl0193eng-generic"
          PYTHONPATH="ravemems/v2:.github/pass2" python - "$RUNNER_TEMP/ravemems-source/wmxn990e.pdf" "$out" <<'PY'
          import json, sys
          from pathlib import Path
          import rcl0193eng_visual_replay_validate as replay
          pdf = Path(sys.argv[1]); out = Path(sys.argv[2])
          replay.replay_visuals(pdf, out)
          result = json.loads((out / 'visual_replay_validation.json').read_text(encoding='utf-8'))
          assert result['db_visual_count'] == 738
          assert result['replayed_visual_count'] == 738
          assert result['visual_fidelity_verified_count'] == 738
          assert result['visual_fidelity_failed_count'] == 0
          assert result['visual_link_verified_count'] == 401
          assert result['visual_link_failed_count'] == 0
          assert result['missing_replay_count'] == 0
          assert result['unexpected_replay_count'] == 0
          assert result['sqlite_integrity'] == 'ok'
          assert result['foreign_key_issue_count'] == 0
          assert result['audit_issue_count_after_validation'] == 0
          print('RCL0193ENG_GENERIC_VISUALS_PASS 738')
          print('RCL0193ENG_GENERIC_LINKS_PASS 401')
          print('RCL0193ENG_GENERIC_AUDIT_ZERO_PASS')
          PY
          test "$(git ls-remote origin refs/heads/MEMSX64 | awk '{print $1}')" = "$PROTECTED_MEMSX64"

      - name: Upload generic regression artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RAVEMEMS-V2-RCL0193ENG-GENERIC-RULES-REGRESSION
          path: ${{ runner.temp }}/rcl0193eng-generic
          if-no-files-found: warn
          retention-days: 14
