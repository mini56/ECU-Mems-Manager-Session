name: TEMP RCL0193 MAP 1660 V3

on:
  push:
    branches: [tmp-rave-visual-backfill]
    paths:
      - .github/workflows/temp-rcl0193-map-1660-v3.yml

permissions:
  contents: write

jobs:
  map_sources_v3:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-rave-visual-backfill
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PDF renderer
        run: python -m pip install PyMuPDF==1.26.4
      - name: Verify immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          PROD=$(git ls-remote origin refs/heads/MEMSX64 | awk '{print $1}')
          test "$PROD" = "22dbe75ed14e0a61e694159d505ef72245116b48"
          echo '5d56f198a6f5ccaf36d7f94646e3b9af4efd465e7f80da0ebea3d74f3d894093  database/reference/research_enrichment_1660.qz64' | sha256sum -c -
          curl --fail --location --retry 3 --output /tmp/RCL0193ENG.pdf 'https://www.uscars.biz/uscars/mini-documents/Rave_CD_wmxn990e.pdf'
          echo 'c050a3eebe50c5a85bf8a69b7722bd2052079944e09d58578a498984ecf06715  /tmp/RCL0193ENG.pdf' | sha256sum -c -
      - name: Parse all 31 facts and ALL page references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, re, zlib
          from pathlib import Path
          import fitz

          raw=base64.b64decode(''.join(Path('database/reference/research_enrichment_1660.qz64').read_text('ascii').split()))
          sqlb=zlib.decompress(raw[4:])
          assert int.from_bytes(raw[:4],'big')==len(sqlb)==41443
          assert hashlib.sha256(sqlb).hexdigest()=='b978f7e73487c6243c8a6c355b4e5dedd90cf449bee223e9c1eb81e08eb0a7cd'
          sql=sqlb.decode('utf-8')

          marker='INSERT OR REPLACE INTO mems_rave_fact'
          def iter_exprs():
              pos=0
              while True:
                  s=sql.find(marker,pos)
                  if s<0:return
                  v=sql.find('VALUES',s); lp=sql.find('(',v)
                  if v<0 or lp<0:raise SystemExit('malformed VALUES')
                  i=lp+1; q=False
                  while i<len(sql)-1:
                      if sql[i]=="'":
                          if q and i+1<len(sql) and sql[i+1]=="'":i+=2;continue
                          q=not q;i+=1;continue
                      if not q and sql[i:i+2]==');':
                          yield sql[lp+1:i];pos=i+2;break
                      i+=1
                  else:raise SystemExit('unterminated insert')
          def split_fields(expr):
              out=[];buf=[];q=False;i=0
              while i<len(expr):
                  c=expr[i]
                  if c=="'":
                      if q and i+1<len(expr) and expr[i+1]=="'":buf.append("'");i+=2;continue
                      q=not q;i+=1;continue
                  if c==',' and not q:out.append(''.join(buf).strip());buf=[];i+=1;continue
                  buf.append(c);i+=1
              out.append(''.join(buf).strip());return out

          names=['fact_key','source_key','document','variant','topic','statement','source_section','verification_level','image_ref','notes']
          rows=[]
          for expr in iter_exprs():
              f=split_fields(expr)
              if len(f)!=10:raise SystemExit(f'field count={len(f)} key={f[:1]}')
              r=dict(zip(names,f))
              if 'RCL0193ENG' in r['document']:rows.append(r)
          assert len(rows)==31 and len({r['fact_key'] for r in rows})==31
          assert all(r['verification_level']=='verifie_constructeur' for r in rows)
          assert all(r['image_ref']=='' for r in rows)

          # Collect every p.N or p.N-M occurrence, not only the first one.
          page_ref=re.compile(r'p\.(\d+)(?:-(\d+))?',re.I)
          all_pages=[]
          for r in rows:
              pages=[]
              for m in page_ref.finditer(r['source_section']):
                  a=int(m.group(1)); b=int(m.group(2) or a)
                  if b<a:raise SystemExit(f'reverse page range {r["fact_key"]}: {a}-{b}')
                  pages.extend(range(a,b+1))
              r['pages']=sorted(set(pages))
              if not r['pages']:raise SystemExit(f'no page refs {r["fact_key"]}: {r["source_section"]}')
              all_pages.extend(r['pages'])

          by_key={r['fact_key']:r for r in rows}
          assert by_key['RAVE-CAUTION-THROTTLE-STOP-001']['pages']==[114,118],by_key['RAVE-CAUTION-THROTTLE-STOP-001']['pages']
          assert by_key['RAVE-REP-INJECTORS-001']['pages']==[135,170],by_key['RAVE-REP-INJECTORS-001']['pages']
          expected=[38,39,40,98,101,107,108,109,112,113,114,117,118,120,121,122,123,125,126,127,128,129,130,131,135,170]
          pages=sorted(set(all_pages)); assert pages==expected,(pages,expected)

          doc=fitz.open('/tmp/RCL0193ENG.pdf');assert doc.page_count==372
          hard={
            38:['engine tuning data','fuel pressure','lost motion gap'],
            40:['engine tuning data','mpi','fuel pressure'],
            98:['emission control','evaporative'],
            107:['engine management system'],
            108:['crankshaft position sensor'],
            109:['manifold absolute pressure sensor'],
            112:['intake air temperature sensor','injectors'],
            114:['idle air control valve'],
            117:['heated oxygen sensor','fuel cut-off'],
            118:['throttle cable'],
            120:['throttle cable'],
            121:['throttle pedal'],
            122:['throttle housing'],
            127:['ecm'],
            128:['intake air temperature'],
            129:['ect sensor'],
            130:['ckp sensor'],
            131:['map sensor'],
            135:['injectors'],
            170:['inlet manifold'],
          }
          for p,tokens in hard.items():
              txt=' '.join(doc[p].get_text('text').lower().split())
              miss=[x for x in tokens if x not in txt]
              if miss:raise SystemExit(f'physical page {p} mismatch: {miss}')

          # Page presence + content metadata for all 26 assets.
          meta={}
          for p in pages:
              pg=doc[p];txt=' '.join(pg.get_text('text').split())
              if len(txt)<80:raise SystemExit(f'page {p} has too little extracted text')
              meta[p]=(len(pg.get_images(full=True)),len(pg.get_drawings()),len(txt),txt[:180].replace('|','/'))

          stop={'pdf','engine','management','system','mems','repairs','repair','adjustments','adjustment','description','operation','sensor','model','data','page','and','fuel','inlet'}
          def anchors(sec):
              tail=sec.split('/',1)[1] if '/' in sec else sec
              return [w for w in re.findall(r'[A-Za-z][A-Za-z0-9]+',tail.lower()) if len(w)>=3 and w not in stop and not w.isdigit()]
          unresolved=[]
          for r in rows:
              text=' '.join(' '.join(doc[p].get_text('text').lower().split()) for p in r['pages'])
              a=anchors(r['source_section']);hits=sorted({x for x in a if x in text});r['hits']=hits
              if a and not hits:unresolved.append((r['fact_key'],r['source_section'],a,r['pages']))
          doc.close()
          if unresolved:
              print('UNRESOLVED')
              for x in unresolved:print(x)
              raise SystemExit(f'{len(unresolved)} unresolved page/source mappings')

          def kind(r):
              s=r['source_section'].lower()
              if 'tuning data' in s:return 'table_page'
              if any(x in s for x in ['repairs','adjustments','18.','19.']):return 'procedure_page'
              return 'technical_description_page'

          L=['# RCL0193ENG — mapping V3 vérifié des 31 faits historiques 1660','',
             'Date: 2026-08-29','',
             'Audit V3 uniquement : aucun fait historique ni asset visuel n’est réécrit.','',
             '- faits correctement parsés: **31/31**; clés uniques: **31/31**; `image_ref` historique vide: **31/31**',
             '- toutes les occurrences `p.N` et plages `p.N-M` sont collectées, y compris les références non contiguës.',
             '- pages physiques uniques vérifiées: **26**',
             '- cas dur `RAVE-CAUTION-THROTTLE-STOP-001`: **p.114 + p.118**',
             '- cas dur `RAVE-REP-INJECTORS-001`: **p.135 + p.170**',
             '- qz64 1660 SHA-256 `5d56f198a6f5ccaf36d7f94646e3b9af4efd465e7f80da0ebea3d74f3d894093`',
             '- PDF constructeur 372 pages SHA-256 `c050a3eebe50c5a85bf8a69b7722bd2052079944e09d58578a498984ecf06715`','',
             '## Mapping final 31/31','',
             '| Fact key | Variante | Source historique | Pages physiques | Type | Ancres confirmées |','|---|---|---|---|---|---|']
          for r in rows:
              L.append(f"| `{r['fact_key']}` | `{r['variant']}` | {r['source_section'].replace('|','/')} | `{','.join(map(str,r['pages']))}` | `{kind(r)}` | {', '.join(r['hits']).replace('|','/')} |")
          L+=['','## 26 pages physiques requises','','`'+','.join(map(str,pages))+'`','',
              '| Index | Images | Dessins | Texte | Aperçu |','|---:|---:|---:|---:|---|']
          for p in pages:
              im,dr,ch,pr=meta[p];L.append(f'| {p} | {im} | {dr} | {ch} | {pr} |')
          L+=['','## Conclusion','',
              'Le mapping V3 couvre les 31 faits historiques avec les 26 pages réellement citées, y compris les références secondaires non contiguës. Ce fichier remplace fonctionnellement le mapping V2 incomplet tout en conservant V2 pour la chronologie d’audit.','',
              'Prochaine action: préparer le lot visuel additif RCL0193 à partir de ces 26 pages, sans modifier les faits historiques.','',
              'La base/IA/RAVE reste consultative et ne prend jamais la main sur la communication ECU.','']
          Path('database/reference/audits/rcl0193_1660_source_map_v3.md').write_text('\n'.join(L),encoding='utf-8')
          print('RCL0193_MAP_V3_PASS facts=31 pages=26')
          print('CAUTION_PAGES='+','.join(map(str,by_key['RAVE-CAUTION-THROTTLE-STOP-001']['pages'])))
          print('INJECTOR_PAGES='+','.join(map(str,by_key['RAVE-REP-INJECTORS-001']['pages'])))
          PY
      - name: Guard audit-only scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed={'.github/workflows/temp-rcl0193-map-1660-v3.yml','database/reference/audits/rcl0193_1660_source_map_v3.md'}
          paths=[]
          for line in subprocess.check_output(['git','status','--porcelain'],text=True).splitlines():
              p=line[3:].strip().split(' -> ',1)[-1];paths.append(p)
          bad=[p for p in paths if p not in allowed]
          if bad:raise SystemExit('Unexpected paths: '+','.join(bad))
          assert 'database/reference/audits/rcl0193_1660_source_map_v3.md' in paths
          print('RCL0193_V3_SCOPE_PASS')
          PY
      - name: Commit V3 audit and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-rcl0193-map-1660-v3.yml
          git add database/reference/audits/rcl0193_1660_source_map_v3.md
          git commit -m "Verify complete RCL0193 31-fact multi-page mapping V3"
          git push origin tmp-rave-visual-backfill
