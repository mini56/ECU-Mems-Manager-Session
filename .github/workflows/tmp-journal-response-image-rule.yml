name: TEMP journal response image rule
on:
  push:
    branches: [RAPPORT]
    paths: ['.github/workflows/tmp-journal-response-image-rule.yml']
permissions:
  contents: write
jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Append journal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('RAPPORT_SUIVI_ECU_MEMS_MANAGER.md')
          text='''\n\n## 2026-09-02 — REGLE VISUELLE GENERALE MULTILINGUE AVANT CORRECTION DIRECTE\n\nPrecision utilisateur obligatoire : ne pas utiliser de texte en dur dependant d une langue pour decider si une image doit etre proposee. L utilisateur peut poser sa question dans une autre langue.\n\nRegle generale validee : **quand la reponse IA contient/possede une reference vers une image ou illustration locale reellement disponible et declaree, IA MEMS doit proposer automatiquement le bouton `Voir le schéma`**. La decision doit provenir de la reference visuelle structuree de la reponse et du catalogue runtime, pas d une liste de mots francais/anglais/espagnols/etc.\n\nArchitecture de correction : conserver les demandes explicites de schema existantes, mais ajouter une resolution directe depuis le texte final de la reponse vers `runtime_visual_catalog.json` via les identifiants documentaires/images. Dans `onServiceResponse`, apres reception du texte final, mettre a jour la suggestion visuelle a partir de cette reponse. Aucun dictionnaire de langue pour cette fonction.\n\nPROCHAINE ACTION EXACTE : modifier directement les fichiers source necessaires sur `tmp-ravemems-ia-visual-integration`, sans script de patch et sans rustine ; ajouter le self-test de resolution par reference ; verifier le diff avant compilation. `MEMSX64` reste BUILD #103.\n'''
          p.write_text(p.read_text(encoding='utf-8')+text, encoding='utf-8')
          PY
      - name: Commit journal
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git rm .github/workflows/tmp-journal-response-image-rule.yml
          git commit -m 'Journal response image rule before direct code fix'
          git push origin HEAD:RAPPORT
