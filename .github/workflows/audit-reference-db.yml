name: Audit MEMS Reference Accessibility and Languages

on:
  push:
    branches: ["main", "master", "ui-rebuild"]
  pull_request:
    branches: ["main", "master", "ui-rebuild"]

permissions:
  contents: read

jobs:
  audit-reference-database:
    name: Audit all MEMS reference content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Strict audit SQLite, XML, assets and six-language coverage
        shell: bash
        run: python tools/audit_reference_database_strict.py

      - name: Report language debt details
        if: always()
        shell: bash
        run: python tools/report_reference_language_debt.py
