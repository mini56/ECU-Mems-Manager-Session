name: TEMP journal implicit visual prebuild
on:
  push:
    branches: [RAPPORT]
    paths:
      - '.github/workflows/tmp-journal-implicit-visual-prebuild.yml'
permissions:
  contents: write
jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Append prebuild journal
        shell: bash
        run: |
          {
            printf '%s\n' '' '## 2026-09-02 — AVANT BUILD TEST — CORRECTION PROPOSITION VISUELLE IMPLICITE'
            printf '%s\n' '' 'Branche `tmp-ravemems-ia-visual-integration` corrigee au commit `944d55aad1fdccdcc5d7ae15c4c13fcf2ea11d65` (`Fix implicit IA visual suggestions for relevant knowledge`). Comparaison avec le package teste precedent `edb13ed27f746a055e3824f0ebc66973ac1ec1ba` : exactement deux fichiers applicatifs modifies : `expert/IaMemsDiagramCatalog.cpp` (+32/-8) et `expert/IaMemsDiagramSelfTest.cpp` (+21). Aucun autre fichier applicatif ne differe.'
            printf '%s\n' '' 'Correction : les demandes explicites de schema conservent le seuil historique. Pour une question sans mot graphique explicite, seul `runtime_visual_catalog.json` peut maintenant proposer un visuel, avec seuil renforce score >=16 ET au moins 2 termes techniques correspondants. Le matcher elimine davantage de mots grammaticaux. Aucun fallback implicite vers les schemas generiques du manifeste.'
            printf '%s\n' '' 'Self-test ajoute : `Quel est le couple de serrage de la culasse ?` doit proposer `RAVE RCL0193FRE PDF 042 Couples de serrage généraux moteur`; `Mon moteur chauffe-t-il trop au ralenti ?` doit continuer a ne proposer aucun visuel. Les tests existants de schema explicite, chemins absents, traversal, visuels caches/remplaces restent conserves.'
            printf '%s\n' '' 'MEMSX64 reste BUILD #103 commit 1d6316bd1746d6f2b4cfb751cab88d18e27ef730. PROCHAINE ACTION EXACTE : relancer le workflow complet RAVEMEMS VISUAL TEST from BUILD 103 sur ce commit corrige, exiger compilation/self-tests/package/smoke tous verts, puis tester la meme question sur le PC utilisateur.'
          } >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
      - name: Commit journal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-journal-implicit-visual-prebuild.yml
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git commit -m "Journal implicit visual fix before test build"
          git push origin HEAD:RAPPORT
