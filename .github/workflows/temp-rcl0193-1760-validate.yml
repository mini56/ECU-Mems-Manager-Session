name: TEMP RCL0193 COMMIT VALIDATED 1760

on:
  push:
    branches: [tmp-rave-visual-backfill]
    paths:
      - .github/workflows/temp-rcl0193-1760-validate.yml

permissions:
  contents: write

jobs:
  commit_and_postvalidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-rave-visual-backfill
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PDF renderer
        run: python -m pip install PyMuPDF==1.26.4
      - name: Verify production remains exact BUILD 101
        shell: bash
        run: |
          set -euo pipefail
          PROD=$(git ls-remote origin refs/heads/MEMSX64 | awk '{print $1}')
          test "$PROD" = "22dbe75ed14e0a61e694159d505ef72245116b48"
          echo "PRODUCTION_BUILD_101_UNCHANGED=$PROD"
      - name: Download exact RCL0193 factory PDF
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/RCL0193ENG.pdf 'https://www.uscars.biz/uscars/mini-documents/Rave_CD_wmxn990e.pdf'
          echo 'c050a3eebe50c5a85bf8a69b7722bd2052079944e09d58578a498984ecf06715  /tmp/RCL0193ENG.pdf' | sha256sum -c -
      - name: Regenerate exact validated candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-rcl0193-1760
          python tools/build_rcl0193_visual_backfill_1760.py --root . --pdf /tmp/RCL0193ENG.pdf --work .tmp-rcl0193-1760 | tee /tmp/precommit.txt
          grep -F 'RCL0193_1760_CANDIDATE_PASS' /tmp/precommit.txt
          grep -F 'rcl0193_assets=26' /tmp/precommit.txt
          grep -F 'rcl0193_fact_coverage=31' /tmp/precommit.txt
          grep -F 'rcl0193_links=43' /tmp/precommit.txt
          grep -F 'rcl0194_assets_preserved=8' /tmp/precommit.txt
      - name: Require exact validated hashes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/RCL0193_1760_EXPECTED <<'EOF'
          d3c3580d9f32d92e42db6eeb81e92a3e0be591b007ec1071d1a95baf6057ebc8  database/reference/research_enrichment_1760.qz64
          59c9e212d9a656668969ac71dde1c8159f51c4ff44b0d4785d4dcce7749f23cd  database/reference/manifest.json
          9a148d1706252b312ed2e1e524314e7ca7fe6e79be76436cf9064ecf085d32b0  database/reference/audits/rcl0193_visual_backfill_1760_audit.md
          a390767a247972909140568093539c1c3370edad63cdd010b1f8ce2a5cfb8d98  database/reference/images/rave/RCL0193ENG_PDF_038.png
