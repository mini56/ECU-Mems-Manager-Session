          EOF
          sha256sum -c /tmp/RCL0193_1760_EXPECTED
      - name: Guard generated scope before staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-rcl0193-1760
          python - <<'PY'
          import subprocess
          exact={'database/reference/research_enrichment_1760.qz64','database/reference/manifest.json','database/reference/audits/rcl0193_visual_backfill_1760_audit.md'}
          prefix='database/reference/images/rave/RCL0193ENG_PDF_'
          paths=[]
          for line in subprocess.check_output(['git','status','--porcelain'],text=True).splitlines():
              p=line[3:].strip().split(' -> ',1)[-1];paths.append(p)
          bad=[p for p in paths if p not in exact and not (p.startswith(prefix) and p.endswith('.png'))]
          if bad:raise SystemExit('Unexpected generated paths: '+', '.join(bad))
          if len([p for p in paths if p.startswith(prefix) and p.endswith('.png')])!=26:raise SystemExit('PNG scope mismatch')
          print('PRECOMMIT_SCOPE_PASS')
          PY
      - name: Stage exact documentary lot and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-rcl0193-1760-validate.yml
          git add database/reference/research_enrichment_1760.qz64
          git add database/reference/manifest.json
          git add database/reference/audits/rcl0193_visual_backfill_1760_audit.md
          git add database/reference/images/rave/RCL0193ENG_PDF_*.png
          python - <<'PY'
          import subprocess
          allowed_exact={'database/reference/research_enrichment_1760.qz64','database/reference/manifest.json','database/reference/audits/rcl0193_visual_backfill_1760_audit.md','.github/workflows/temp-rcl0193-1760-validate.yml'}
          prefix='database/reference/images/rave/RCL0193ENG_PDF_'
          staged=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          bad=[p for p in staged if p not in allowed_exact and not (p.startswith(prefix) and p.endswith('.png'))]
          if bad:raise SystemExit('Unexpected staged paths: '+', '.join(bad))
          if len([p for p in staged if p.startswith(prefix) and p.endswith('.png')])!=26:raise SystemExit('Expected 26 staged PNG')
          print('STAGED_SCOPE_PASS')
          PY
      - name: Commit and push validated 1760 lot
        id: push
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "Add deterministic RCL0193 visual backfill 1760"
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          git push origin HEAD:tmp-rave-visual-backfill
          echo "PUSHED_SHA=$SHA"
      - name: Re-read exact remote commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin tmp-rave-visual-backfill
          REMOTE=$(git rev-parse origin/tmp-rave-visual-backfill)
          test "$REMOTE" = "${{ steps.push.outputs.sha }}"
          git checkout --detach "$REMOTE"
          echo "REMOTE_SHA=$REMOTE"
      - name: Validate committed bytes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c /tmp/RCL0193_1760_EXPECTED
          test "$(find database/reference/images/rave -maxdepth 1 -name 'RCL0193ENG_PDF_*.png' | wc -l)" = 26
          grep -F 'research_enrichment_1760.qz64' database/reference/manifest.json
          test ! -e .github/workflows/temp-rcl0193-1760-validate.yml
          echo 'REMOTE_BYTES_PASS'
      - name: Reproduce from exact remote commit and require zero diff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-rcl0193-1760
          python tools/build_rcl0193_visual_backfill_1760.py --root . --pdf /tmp/RCL0193ENG.pdf --work .tmp-rcl0193-1760 | tee /tmp/postcommit.txt
          grep -F 'RCL0193_1760_CANDIDATE_PASS' /tmp/postcommit.txt
          grep -F 'rcl0193_fact_coverage=31' /tmp/postcommit.txt
          grep -F 'rcl0193_links=43' /tmp/postcommit.txt
          sha256sum -c /tmp/RCL0193_1760_EXPECTED
          rm -rf .tmp-rcl0193-1760
          git diff --exit-code -- database/reference/research_enrichment_1760.qz64 database/reference/manifest.json database/reference/audits/rcl0193_visual_backfill_1760_audit.md database/reference/images/rave/
          test -z "$(git status --porcelain)"
          echo 'RCL0193_1760_REMOTE_ZERO_DIFF_PASS'
