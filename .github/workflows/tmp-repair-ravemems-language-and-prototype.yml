name: TEMP repair RAVEMEMS language and prototype journal

on:
  push:
    branches: [RAPPORT]
    paths:
      - '.github/workflows/tmp-repair-ravemems-language-and-prototype.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0

      - name: Update cahier and report
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          cahier = Path('docs/CAHIER_DES_CHARGES_RAVEMEMS_BROUILLON_2026-09-02.md')
          text = cahier.read_text(encoding='utf-8')

          start = text.index('## 37. TRADUCTIONS FUTURES')
          end = text.index('\n---\n\n## 38. VISUELS ET TRADUCTION', start)
          section37 = '''## 37. TRADUCTIONS FUTURES

Les traductions doivent se rattacher à la connaissance structurée.

La **langue source originale du document est toujours conservée** et reste la référence canonique. RAVEMEMS doit ensuite permettre les traductions correspondant aux six langues de MEMS Manager : **français (FR), anglais (EN), espagnol (ES), italien (IT), portugais (PT) et allemand (DE)**.

La traduction ne crée jamais une nouvelle connaissance : toutes les langues restent rattachées au **même identifiant sémantique stable**. Si la langue source est déjà l’une des six langues, cette version source n’est pas retraduite vers elle-même.

La **validation des traductions se fait en priorité en français**, puis dans les autres langues. Cet ordre de validation ne modifie pas l’architecture ni le statut de la langue source.

On traduit ce que l’utilisateur doit lire : titres, procédures, étapes, avertissements, descriptions, légendes textuelles utiles et contenu de tableaux si nécessaire.

On évite de traduire identifiants internes, numéros de broche, numéros de connecteur, références, valeurs numériques, unités universelles et numéros d’opération.
'''
          text = text[:start] + section37 + text[end:]

          text = text.replace('- langues de traduction prioritaires ;\n', '')
          text = text.replace('- manuel à choisir pour le premier prototype ;\n', '')

          anchor = 'Commencer par un **prototype sur un seul manuel représentatif** afin de valider la méthode avant de multiplier le travail.'
          replacement = anchor + '\n\n**Premier manuel prototype retenu par l’utilisateur : `RCL0193ENG`.** Ce manuel est choisi parce qu’il permet de valider notamment les procédures multi-pages, Dépose/Repose, renvois, illustrations mécaniques, visuels actuellement tournés à 90°, visuels actuellement blanc sur noir, tableaux, valeurs techniques et relations procédure/illustration.'
          if anchor not in text:
              raise SystemExit('prototype anchor not found')
          text = text.replace(anchor, replacement, 1)
          cahier.write_text(text, encoding='utf-8')

          report = Path('RAPPORT_SUIVI_ECU_MEMS_MANAGER.md')
          with report.open('a', encoding='utf-8') as f:
              f.write('''

## 2026-09-02 — RELECTURE CAHIER RAVEMEMS — LANGUES ET MANUEL PROTOTYPE

Décisions utilisateur validées :
- conserver systématiquement la langue source originale comme référence canonique ;
- langues MEMS Manager : FR, EN, ES, IT, PT, DE ;
- aucune duplication de connaissance par langue : les traductions restent rattachées au même identifiant sémantique ;
- priorité de validation des traductions : français d’abord, puis les autres langues ;
- premier manuel prototype retenu : `RCL0193ENG`.

Le précédent workflow temporaire de journalisation des langues a échoué avant exécution de job. Cette étape répare uniquement la journalisation et enregistre les décisions validées. Aucun code applicatif, aucune extraction et aucun BUILD de production ne sont lancés.

PROCHAINE ACTION EXACTE : poursuivre la relecture du cahier des charges RAVEMEMS question par question avec l’utilisateur. Ne lancer aucune nouvelle extraction avant validation explicite du cahier.
''')
          PY

      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/tmp-update-ravemems-language-priority.yml
          git rm .github/workflows/tmp-repair-ravemems-language-and-prototype.yml
          git add docs/CAHIER_DES_CHARGES_RAVEMEMS_BROUILLON_2026-09-02.md RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git diff --cached --check
          git commit -m "Record RAVEMEMS language policy and prototype manual"
          git push origin HEAD:RAPPORT
