name: ECU MEMS Manager SESSION - BUILD 136
run-name: SESSION BUILD 136 - affichage local des images RAVE - ${{ github.sha }}
on:
  push:
    branches:
      - cleanup-session-source-consolidation-20261109
    paths:
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.inc'
      - 'CMakeLists.txt'
      - 'mainwindow.ui'
      - 'tools/verify_ui_style_baseline.py'
      - 'tools/ui_style_baseline.json'
      - '.github/workflows/session-cleanup-source-validation.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: session-cleanup-source-validation
  cancel-in-progress: true
env:
  MEMS_BUILD_NUMBER: '136'
  ORT_GENAI_VERSION: '0.14.0'
  ORT_GENAI_WIN_X64_SHA256: '8a303e52dc7be8fb2a5331929af451a25ac59774102d7fd09ef673adc85c5ebf'
jobs:
  compiler-sources:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Recuperer les sources de la branche de nettoyage
        uses: actions/checkout@v4
      - name: Verifier source unique, nom officiel et menu 14 pages
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $cmake=Get-Content CMakeLists.txt -Raw
          $main=Get-Content main.cpp -Raw
          $s=Get-Content settingspage.cpp -Raw
          $nav=Get-Content uishell.cpp -Raw
          if(Test-Path splashtextfix.cpp){throw 'SPLASH_OLD_PATCH_STILL_PRESENT'}
          if(Test-Path settingsvisualpatch.cpp){throw 'SETTINGS_OLD_PATCH_STILL_PRESENT'}
          if(Test-Path taborderpatch.cpp){throw 'UNBUILT_TAB_ORDER_PATCH_STILL_PRESENT'}
          if(Test-Path strictvisualrebuild.cpp){throw 'STRICT_VISUAL_OVERLAY_REINTRODUCED'}
          if(Test-Path darkfixes.cpp){throw 'DARK_FIXES_LATE_PATCH_REINTRODUCED'}
          if(Test-Path visualcompletion.cpp){throw 'VISUAL_COMPLETION_LATE_PATCH_REINTRODUCED'}
          foreach($old in @('sidebarbubblecleaner.cpp','readabilityfix.cpp')){
            if(Test-Path $old){throw "DEFERRED_VISUAL_PATCH_REINTRODUCED: $old"}
            if($cmake -match [regex]::Escape($old)){throw "DEFERRED_VISUAL_PATCH_COMPILED: $old"}
          }
          $analysis=Get-Content analysistab_impl_part1.inc -Raw
          $summary=Get-Content summarytab.cpp -Raw
          $diagnostic=Get-Content diagnosticpanel.cpp -Raw
          $raw=Get-Content rawpage.cpp -Raw
          if($analysis -notmatch 'paintAnalysisChart\(this\)' -or
             $summary -notmatch 'void SummaryTab::resizeEvent' -or
             $summary -notmatch 'whiteRule' -or
             $diagnostic -notmatch 'Qt::ForegroundRole' -or
             $raw -notmatch 'color:#ffffff;background:transparent'){throw 'NATIVE_SOURCE_CONSOLIDATION_MISSING'}
          if($cmake -match 'splashtextfix.cpp|settingsvisualpatch.cpp'){throw 'OBSOLETE_PATCH_STILL_COMPILED'}
          # The two LEDs and their labels are now owned by the States panel
          # from initial construction; reparenting them caused duplicate text.
          if($s -notmatch 'settingsLayoutIntegrated' -or
             $s -notmatch 'states->show\(\)' -or
             $s -match 'moveIndicatorsToStates\(' -or
             $s -match 'header->addWidget\((loopLed|idleLed)\)'){
            throw 'SETTINGS_SOURCE_NOT_CONSOLIDATED'
          }
          if($main -notmatch 'buildIdentityLabel' -or
             $main -notmatch 'progressPalette.setColor\(QPalette::HighlightedText,Qt::white\)'){throw 'SPLASH_SOURCE_NOT_CONSOLIDATED'}
          if($cmake -notmatch 'APP_NAME="ECU MEMS Manager SESSION"'){throw 'OFFICIAL_NAME_CHANGED'}
          if($nav -notmatch 'kFinalTabCount = 14'){throw 'FULL_MENU_CHANGED'}
          foreach($obsolete in @(
            'systemstateconnectionfix.cpp',
            'singleinstanceforce.cpp',
            'mainwindowtitlebarfix.cpp',
            'navigationorderpatch.cpp',
            'navigationorderpatch.h',
            'database/IaDocumentaryLockPatch.cpp',
            'overviewrebuild.cpp',
            'majorpagesrebuild.cpp',
            'settingstabdark.cpp',
            'uirebuild.cpp',
            'dedicatedpagesrebuild.cpp',
            'database/MemsDatabaseDiagramSearchPatch.cpp',
            'database/MemsSearchCompletenessPatch.cpp'
          )){
            if(Test-Path $obsolete){throw "OLD_LAYERED_MODULE_REINTRODUCED: $obsolete"}
            if($cmake.Contains($obsolete)){throw "OLD_LAYERED_MODULE_STILL_COMPILED: $obsolete"}
          }
          $window=Get-Content mainwindow.cpp -Raw
          $overview=Get-Content overviewpage.cpp -Raw
          $errors=Get-Content ecupages.cpp -Raw
          $explorer=Get-Content database/MemsDatabaseExplorerV2.cpp -Raw
          $xml=Get-Content database/MemsReferenceSheetRenderer.h -Raw
          $instance=Get-Content singleinstance.cpp -Raw
          $mainWindow=Get-Content mainwindow.cpp -Raw
          if($window -notmatch 'void MainWindow::refreshConnectionHeader\(' -or
             $window -notmatch 'bool MainWindow::isEcuDisconnected\(' -or
             $overview -notmatch 'isEcuDisconnected\(\)' -or
             $errors -notmatch 'isEcuDisconnected\(\)'){throw 'NATIVE_ECU_CONNECTION_STATUS_MISSING'}
          if($instance -notmatch 'CreateMutexW' -or
             $instance -notmatch 'processReplacementRequest' -or
             $mainWindow -notmatch 'confirmMainWindowClose\(this\)' -or
             $mainWindow -notmatch 'void MainWindow::showEvent\('){throw 'NATIVE_WINDOW_LIFECYCLE_MISSING'}
          if($explorer -notmatch 'MemsReferenceSheetRenderer::renderFile' -or
             $explorer -notmatch 'diagramHtml\(generation\)' -or
             $xml -notmatch 'textColorSwatches\(content.text\)'){throw 'NATIVE_MEMS_DOCUMENTATION_MISSING'}
          $ia=Get-Content iamemstab.cpp -Raw
          $pipeline=Get-Content expert/IaMemsDocumentaryPipeline.cpp -Raw
          if($ia -notmatch 'connectIaMemsDocumentaryPipeline\(this, m_question, m_sendButton, m_transcript\)' -or
             $pipeline -notmatch 'class DocumentaryPackReader' -or
             $pipeline -notmatch 'sendResolved\(' -or
             $pipeline -match 'installEventFilter|Q_COREAPP_STARTUP_FUNCTION|QObject::disconnect\(m_send'){
             throw 'NATIVE_DOCUMENTARY_PIPELINE_MISSING_OR_LAYERED'
          }
          $overviewNative=Get-Content overviewpage.cpp -Raw
          if($overviewNative -notmatch 'void buildOverviewPage\(' -or
             $overviewNative -notmatch 'void fitOverviewPage\(' -or
             $overviewNative -match 'Q_COREAPP_STARTUP_FUNCTION|installEventFilter' -or
             $nav -notmatch 'buildOverviewPage\(window\)'){
             throw 'NATIVE_OVERVIEW_BUILDER_MISSING'
          }
          if($errors -notmatch 'void buildEcuControlPages\(' -or
             $errors -notmatch 'composeErrors\(window\)' -or
             $errors -notmatch 'composeActuators\(window\)' -or
             $errors -notmatch 'applyErrorsVisualPhaseOne\(window\)' -or
             $errors -match 'Q_COREAPP_STARTUP_FUNCTION|installEventFilter' -or
             $nav -notmatch 'buildEcuControlPages\(window\)'){
             throw 'NATIVE_ECU_CONTROL_PAGES_MISSING'
          }
          if($s -notmatch 'void buildSettingsPage\(' -or
             $s -notmatch 'void fitSettingsPage\(' -or
             $s -match 'Q_COREAPP_STARTUP_FUNCTION|installEventFilter' -or
             $nav -notmatch 'buildSettingsPage\(window\)' -or
             $nav -notmatch 'fitSettingsPage\(window\)'){
             throw 'NATIVE_SETTINGS_PAGE_MISSING'
          }
          if($nav -notmatch 'void buildUiShell\(' -or
             $nav -notmatch 'void resizeUiShell\(' -or
             $nav -notmatch 'void retranslateUiShell\(' -or
             $nav -match 'Q_COREAPP_STARTUP_FUNCTION|installEventFilter' -or
             $mainWindow -notmatch 'buildUiShell\(this\)' -or
             $mainWindow -notmatch 'resizeUiShell\(this\)'){
             throw 'NATIVE_UI_SHELL_LIFECYCLE_MISSING'
          }
          if($raw -notmatch 'void fitRawDataPage\(' -or
             $nav -notmatch 'fitRawDataPage\(window->findChild<QWidget\*>' -or
             $nav -match 'rebuildInteractive\(tabs\)' -or
             $cmake -match 'dedicatedpagesrebuild.cpp'){
             throw 'RAW_PAGE_OWNER_OR_NAVIGATION_REGRESSION'
          }
          $dark=Get-Content darkstyle.cpp -Raw
          if($dark -notmatch 'void applyApplicationVisualStyle\(' -or
             $dark -match 'Q_COREAPP_STARTUP_FUNCTION|installEventFilter|styleNavigation\(' -or
             $nav -notmatch 'applyApplicationVisualStyle\(window\)' -or
             $nav -notmatch 'resizeApplicationVisualStyle\(window\)'){
             throw 'DARK_STYLE_GLOBAL_LAYER_NOT_REMOVED'
          }
          $transport=Get-Content memsinterface.cpp -Raw
          $protocol=Get-Content memsinterface_dispatch.cpp -Raw
          if($protocol -match '#include\s+"memsinterface\.cpp"' -or
             $protocol -match '#define\s+(mems_test_actuator|mems_move_iac|mems_clear_faults|mems_reset_adjustments|mems_reset_ECU|connectToECU|onStartPollingRequest|onProtocolCommandRequested)' -or
             $transport -notmatch 'guardedMemsTestActuator\(' -or
             $transport -notmatch 'guardedMemsMoveIac\(' -or
             $transport -notmatch 'guardedClearFaults\(' -or
             $transport -notmatch 'guardedResetAdjustments\(' -or
             $transport -notmatch 'guardedResetEcu\(' -or
             $cmake -notmatch 'memsinterface\.cpp memsinterface_dispatch\.cpp'){
             throw 'ECU_PROTOCOL_GUARDS_MUST_BE_IN_NATIVE_SOURCE'
          }
          $universal=Get-Content database/MemsDatabaseUniversalAccess.cpp -Raw
          $explorer=Get-Content database/MemsDatabaseExplorerV2.cpp -Raw
          if($universal -match 'Q_COREAPP_STARTUP_FUNCTION|installEventFilter|UniversalDatabaseAccessController|setInterval\(280\)' -or
             $universal -notmatch 'namespace MemsDatabaseContent' -or
             $explorer -notmatch 'MemsDatabaseContent::renderResultHtml\(' -or
             $explorer -notmatch 'MemsDatabaseContent::localizedTitle\('){
             throw 'DATABASE_CONTENT_RENDERING_MUST_BE_NATIVE'
          }
          if(Test-Path database/MemsXmlRowIndexer.cpp){throw 'DISABLED_SCROLL_INSTALLER_MUST_NOT_RETURN'}
          foreach($dead in @('database/MemsDatabaseGlobalUi.cpp','database/MemsDatabaseUsability.cpp')){
            if(Test-Path $dead){throw "UNBUILT_OLD_GLOBAL_INSTALLER_REMAINS: $dead"}
          }
          $overviewLive=Get-Content overviewramlive.cpp -Raw
          if($overviewLive -match 'Q_COREAPP_STARTUP_FUNCTION|installEventFilter|OverviewLiveInstaller' -or
             $overviewLive -notmatch 'void initializeOverviewLive\(' -or
             $window -notmatch 'initializeOverviewLive\(this\)' -or
             $main -notmatch 'injectorGauge->setProperty\("maximum", 5\.0\)'){
             throw 'NATIVE_OVERVIEW_INJECTION_RANGE_MISSING'
          }
          $ramUi=Get-Content injectionramtest.cpp -Raw
          if($ramUi -match 'Q_COREAPP_STARTUP_FUNCTION|installEventFilter|class InjectionRamTestInstaller' -or
             $ramUi -notmatch 'void initializeInjectionRamTestUi\(' -or
             $window -notmatch 'initializeInjectionRamTestUi\(this\)' -or
             $ramUi -notmatch 'injectionRamTestButton'){
             throw 'NATIVE_INJECTION_RAM_TEST_BUTTON_MISSING'
          }
          $nativeBrowser=Get-Content database/MemsDatabaseBrowser.cpp -Raw
          $nativeExplorer=Get-Content database/MemsDatabaseExplorerV2.cpp -Raw
          if($nativeExplorer -match 'disconnectLegacyUi|QObject::disconnect\(m_sheetButton|QObject::disconnect\(m_pdfButton' -or
             $nativeExplorer -notmatch 'bool initializeMemsDatabaseExplorer\(' -or
             $nativeBrowser -notmatch 'm_indexedExplorerActive=initializeMemsDatabaseExplorer\(this\)' -or
             $nativeBrowser -notmatch 'if\(!m_indexedExplorerActive\)' -or
             $nativeBrowser -notmatch 'void MemsDatabaseBrowser::activateLegacyBrowser\('){
             throw 'MEMS_DATABASE_DOUBLE_UI_BINDING_REINTRODUCED'
          }
          $transport=Get-Content memsinterface.cpp -Raw
          $protocol=Get-Content memsinterface_dispatch.cpp -Raw
          $memsApi=Get-Content memsinterface.h -Raw
          foreach($legacyName in @('onStartPollingRequestLegacy','connectToECULegacy','onProtocolCommandRequestedLegacy')){
            foreach($source in @($transport,$protocol,$memsApi)){
              if($source.Contains($legacyName)){throw "ECU_DUPLICATED_LEGACY_ROUTINE: $legacyName"}
            }
          }
          if($transport -notmatch 'bool MEMSInterface::openRoscoTransport\(' -or
             $transport -notmatch 'void MEMSInterface::sendRoscoReadCommand\(' -or
             $protocol -notmatch 'openRoscoTransport\(\)' -or
             $protocol -notmatch 'sendRoscoReadCommand\(command\)'){
            throw 'ECU_NATIVE_TRANSPORT_ROUTING_MISSING'
          }
          $ramLogger=Get-Content injectionramtestlogger.cpp -Raw
          $ramTest=Get-Content injectionramtest.cpp -Raw
          if($ramLogger -match 'Q_COREAPP_STARTUP_FUNCTION|installEventFilter|scanDialogs|setInterval\(50\)' -or
             $ramLogger -notmatch 'void saveFinishedPhase\(' -or
             $ramLogger -notmatch 'void addFolderButton\(' -or
             $ramTest -notmatch 'InjectionRamTestLog::saveFinishedPhase\(output\)' -or
             $ramTest -notmatch 'InjectionRamTestLog::beginPhase\(output\)' -or
             $ramTest -notmatch 'InjectionRamTestLog::addFolderButton\(session,grid\)'){
             throw 'AANMP002_JOURNAL_MUST_USE_NATIVE_TEST_EVENTS'
          }
          # Audit only the C++ modules owned by the Windows application.
          # Process-wide startup fixes and textual .cpp includes are forbidden.
          $start=$cmake.IndexOf('set(SOURCES')
          $end=$cmake.IndexOf('add_executable(${PNAME}', $start)
          if($start -lt 0 -or $end -le $start){
             throw 'CMAKE_NATIVE_SOURCE_LIST_NOT_FOUND'
          }
          $applicationSources=$cmake.Substring($start,$end-$start)
          $nativeCpp=[regex]::Matches($applicationSources,'[A-Za-z0-9_./-]+\.cpp') |
             ForEach-Object { $_.Value } | Sort-Object -Unique
          if($nativeCpp.Count -lt 50){throw 'NATIVE_SOURCE_AUDIT_TOO_SMALL'}
          foreach($nativeFile in $nativeCpp){
             if(-not(Test-Path $nativeFile)){throw "MISSING_COMPILED_SOURCE: $nativeFile"}
             $contents=Get-Content $nativeFile -Raw
             if($contents -match '(?m)^\s*Q_COREAPP_STARTUP_FUNCTION\s*\('){
                 throw "LATE_GLOBAL_STARTUP_INSTALLER_IN_NATIVE_SOURCE: $nativeFile"
             }
             if($contents -match '(?m)^\s*#include\s+"[^"]+\.cpp"'){
                 throw "TEXTUAL_CPP_COMPOSITION_IN_NATIVE_SOURCE: $nativeFile"
             }
          }
          foreach($obsolete in @('main_keyed.cpp','scrollarea.cpp')){
             if(Test-Path $obsolete){throw "UNBUILT_DUPLICATE_SOURCE_REINTRODUCED: $obsolete"}
          }
          Write-Host "SESSION_NATIVE_CPP_SOURCES_AUDITED=$($nativeCpp.Count)"
          $transport=Get-Content memsinterface.cpp -Raw
          $protocol=Get-Content memsinterface_dispatch.cpp -Raw
          if($protocol -match 'protocolContextTrackingBound' -or
             $protocol -notmatch 'void MEMSInterface::bindProtocolContextTracking\(' -or
             $transport -notmatch 'bindProtocolContextTracking\(\);'){
             throw 'ECU_PROTOCOL_TRACKING_MUST_BIND_IN_CONSTRUCTOR'
          }
          $settings=Get-Content settingspage.cpp -Raw
          if($settings -match 'QTimer::singleShot\(0,page' -or
             $settings -match 'moveNoteBelowRpm\(' -or
             $settings -notmatch 'embedNoteInRpmGauge\(page,metrics,adjust\)' -or
             $settings -notmatch 'layout->addWidget\(note\)'){
             throw 'SETTINGS_RPM_NOTE_MUST_USE_NATIVE_LAYOUT'
          }
          if(Test-Path qrc_resources.cpp){
             throw 'GENERATED_QT_RCC_SOURCE_SHOULD_NOT_BE_VERSIONED'
          }
          # A widget may only have one native object identity in the Qt .ui
          # file. uic used to silently rename the second label_51 to label_511.
          [xml]$uiDefinition=Get-Content mainwindow.ui -Raw
          $duplicateNames=@($uiDefinition.SelectNodes('//widget') |
            ForEach-Object { $_.GetAttribute('name') } |
            Group-Object | Where-Object { $_.Count -gt 1 })
          if($duplicateNames.Count -gt 0){
            throw "DUPLICATE_NATIVE_UI_WIDGET: $(($duplicateNames | ForEach-Object {$_.Name}) -join ', ')"
          }
          Write-Host 'SESSION_CLEAN_SOURCE_PREFLIGHT_PASS'
      - name: Bloquer les regressions du style des pages validees
        shell: pwsh
        run: |
          python tools/verify_ui_style_baseline.py
          if($LASTEXITCODE -ne 0){throw 'APPROVED_UI_STYLE_CHANGED_BUILD_BLOCKED'}
      - name: Preparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer Qt 5.15.2 MSVC x64 et outils de validation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0" pefile
          if($LASTEXITCODE -ne 0){throw 'pip install failed'}
          $sevenZip=(Get-Command 7z.exe -ErrorAction Stop).Source
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtcharts -O C:\Qt --external "$sevenZip"
          if($LASTEXITCODE -ne 0){throw 'Qt install failed'}
      - name: Recuperer les fichiers ONNX pour compilation de IA reelle
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $archive=Join-Path $env:RUNNER_TEMP "onnxruntime-genai-$env:ORT_GENAI_VERSION-win-x64.zip"
          $folder=Join-Path $env:RUNNER_TEMP 'onnx-genai'
          curl.exe -L --fail --retry 3 --retry-all-errors --retry-delay 2 -o $archive "https://github.com/microsoft/onnxruntime-genai/releases/download/v$env:ORT_GENAI_VERSION/onnxruntime-genai-$env:ORT_GENAI_VERSION-win-x64.zip"
          if($LASTEXITCODE -ne 0){throw 'ONNX download failed'}
          if((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:ORT_GENAI_WIN_X64_SHA256){throw 'ONNX archive SHA256 mismatch'}
          Expand-Archive $archive $folder -Force
          $header=Get-ChildItem $folder -Recurse -File -Filter ort_genai_c.h | Select-Object -First 1
          $lib=Get-ChildItem $folder -Recurse -File -Filter onnxruntime-genai.lib | Select-Object -First 1
          if(-not $header -or -not $lib){throw 'ONNX import files missing'}
          "ORT_GENAI_INCLUDE_DIR=$($header.Directory.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ORT_GENAI_LIBRARY=$($lib.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'SESSION_ONNX_SOURCE_VERIFIED'
      - name: Compiler le programme avec IA ONNX active et protocoles ROSCO
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake -S . -B build-session-136 -A x64 `
            -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/msvc2019_64" `
            -DMEMS_USE_BUNDLED_LIBROSCO_X64=ON `
            -DMEMS_RUN_REFERENCE_SELFTEST_POST_BUILD=OFF `
            -DMEMS_USE_ONNX_GENAI=ON `
            "-DORT_GENAI_INCLUDE_DIR=$env:ORT_GENAI_INCLUDE_DIR" `
            "-DORT_GENAI_LIBRARY=$env:ORT_GENAI_LIBRARY"
          if($LASTEXITCODE -ne 0){throw 'CMake configuration failed'}
          cmake --build build-session-136 --config Release --target ecu_mems_manager ecu_mems_uninstaller --parallel
          if($LASTEXITCODE -ne 0){throw 'SESSION source compilation failed'}
          if(-not(Test-Path 'build-session-136\Release\ecu_mems_manager.exe')){throw 'SESSION exe missing'}
          if(-not(Test-Path 'build-session-136\librosco-x64\Release\mems_manager_x64.dll')){throw 'ROSCO dll missing'}
          Write-Host 'SESSION_BUILD136_SOURCE_AND_ONNX_COMPILE_PASS'

      - name: Preparer la distribution Windows complete pour le test de demarrage
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          # A bare executable is not a deployment. Exercise Qt, ROSCO, ONNX and MEMSLibrary in the real distribution.
          $tag='mems-build117-candidate-39395038798'
          $name='ECU-MEMS-Manager-x64-BUILD117-CLEAN-V2.tar.gz'
          $sha='4f187bae49bfc134329b53eb4e455c2d125403fe510f2da08a8272b2dcb3cd3b'
          New-Item -ItemType Directory -Force download-117,dist-session-smoke | Out-Null
          gh release download $tag --pattern $name --dir download-117 --clobber
          if($LASTEXITCODE -ne 0){throw 'BASE117_RUNTIME_DOWNLOAD_FAILED'}
          $archive=Join-Path download-117 $name
          if((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sha){
            throw 'BASE117_RUNTIME_ARCHIVE_HASH_MISMATCH'
          }
          tar.exe -xzf $archive -C dist-session-smoke
          if($LASTEXITCODE -ne 0){throw 'BASE117_RUNTIME_UNPACK_FAILED'}
          $dist=(Resolve-Path dist-session-smoke).Path
          # BUILD117 is the preserved verified runtime baseline, but its
          # archive predates several RAVE reference images. Merge ALL current
          # source-controlled reference files without deleting historical
          # assets. The installed SQLite search cache is regenerated from
          # the resulting real reference corpus.
          $referenceSource=(Resolve-Path 'database/reference').Path
          $referenceTarget=Join-Path $dist 'database/reference'
          New-Item -ItemType Directory -Path $referenceTarget -Force | Out-Null
          & robocopy.exe $referenceSource $referenceTarget /E /R:2 /W:2 /NFL /NDL /NJH /NJS /NP
          if($LASTEXITCODE -ge 8){throw "RAVE_REFERENCE_ASSET_COPY_FAILED=$LASTEXITCODE"}
          $sourceFiles=@(Get-ChildItem $referenceSource -Recurse -File)
          if($sourceFiles.Count -lt 500){throw "RAVE_REFERENCE_SOURCE_INCOMPLETE=$($sourceFiles.Count)"}
          $imageCount=0
          foreach($file in $sourceFiles){
            $relative=$file.FullName.Substring($referenceSource.Length+1)
            $installed=Join-Path $referenceTarget $relative
            if(-not(Test-Path -LiteralPath $installed)){
              throw "RAVE_REFERENCE_ASSET_NOT_PACKAGED=$relative"
            }
            if((Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash -ne
               (Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash){
              throw "RAVE_REFERENCE_ASSET_HASH_MISMATCH=$relative"
            }
            if($relative -like 'images\\*'){$imageCount++}
          }
          if($imageCount -lt 400){throw "RAVE_REFERENCE_IMAGE_COUNT_TOO_LOW=$imageCount"}
          Write-Host "RAVE_REFERENCE_CORPUS_PACKAGED=$($sourceFiles.Count) resources, $imageCount images; hashes verified"
          foreach($pair in @(
            @('build-session-136\Release\ecu_mems_manager.exe','ecu_mems_manager.exe'),
            @('build-session-136\Release\ecu_mems_uninstaller.exe','ecu_mems_uninstaller.exe'),
            @('build-session-136\librosco-x64\Release\mems_manager_x64.dll','mems_manager_x64.dll')
          )){
            Copy-Item $pair[0] (Join-Path $dist $pair[1]) -Force
          }
          $runtime=Join-Path $env:RUNNER_TEMP 'onnx-genai'
          $dlls=Get-ChildItem $runtime -Recurse -File -Filter '*onnxruntime*.dll'
          foreach($dll in $dlls){
            Copy-Item $dll.FullName (Join-Path $dist $dll.Name) -Force
          }
          if(-not(Test-Path (Join-Path $dist 'database/reference/images/rave/RCL0193FRE_PDF_346.png'))){
            throw 'RAVE_REFERENCE_IMAGE_346_MISSING_FROM_DISTRIBUTION'
          }
          if(-not(Test-Path (Join-Path $dist 'onnxruntime-genai.dll'))){
            throw 'ONNX_GENAI_RUNTIME_NOT_DEPLOYED'
          }
          $qt='C:\Qt\5.15.2\msvc2019_64'
          & "$qt\bin\windeployqt.exe" --release --compiler-runtime --no-translations --dir $dist (Join-Path $dist 'ecu_mems_manager.exe')
          if($LASTEXITCODE -ne 0){throw 'QT_RUNTIME_DEPLOY_FAILED'}
          # The test runs without a monitor: deploy the genuine Qt offscreen
          # platform plugin so both directory and installed smoke use the same
          # self-contained Qt runtime instead of a build-machine plugin.
          $platforms=Join-Path $dist 'platforms'
          New-Item -ItemType Directory -Force $platforms | Out-Null
          $offscreen=Join-Path $platforms 'qoffscreen.dll'
          if(-not(Test-Path $offscreen)){
            Copy-Item (Join-Path $qt 'plugins\platforms\qoffscreen.dll') $offscreen -Force
          }
          if(-not(Test-Path $offscreen)){throw 'DEPLOYED_QT_OFFSCREEN_PLUGIN_MISSING'}
          foreach($file in @('Qt5Core.dll','Qt5Widgets.dll','mems_manager_x64.dll','MEMSLibrary.dll')){
            if(-not(Test-Path (Join-Path $dist $file))){throw "MISSING_DEPLOYMENT_DLL: $file"}
          }
          if(Test-Path (Join-Path $dist 'database\ecu_mems_manager.sqlite')){
            throw 'PERSONAL_SQLITE_MUST_NOT_BE_BUNDLED'
          }
          Write-Host 'SESSION_COMPLETE_RUNTIME_READY_FOR_GUI_TEST'
      - name: Tester le programme Windows et ses 14 pages sans ECU
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference='Stop'
          $env:PATH="C:\Qt\5.15.2\msvc2019_64\bin;$env:PATH"
          $env:QT_QPA_PLATFORM='offscreen'
          $env:QT_OPENGL='software'
          $executable=Join-Path $PWD 'dist-session-smoke\ecu_mems_manager.exe'
          if(-not(Test-Path $executable)){throw 'SESSION_NATIVE_UI_EXE_MISSING'}
          # The compiled GUI links both ROSCO and ONNX import libraries.
          $env:PATH="$PWD\build-session-136\librosco-x64\Release;$env:PATH"
          $onnxDir=Join-Path $env:RUNNER_TEMP 'onnx-genai'
          $runtimeDlls=Get-ChildItem $onnxDir -Recurse -File -Filter '*onnxruntime*.dll'
          foreach($directory in @($runtimeDlls | ForEach-Object {$_.DirectoryName} | Sort-Object -Unique)){
            $env:PATH="$directory;$env:PATH"
          }
          $env:QT_PLUGIN_PATH=(Resolve-Path dist-session-smoke).Path
          $env:QT_QPA_PLATFORM_PLUGIN_PATH=Join-Path $env:QT_PLUGIN_PATH 'platforms'
          if(-not(Test-Path (Join-Path $env:QT_QPA_PLATFORM_PLUGIN_PATH 'qoffscreen.dll'))){throw 'QT_PLUGIN_NOT_DEPLOYED_IN_DIST'}
          # Wait only for the GUI process, not for any unrelated child process.
          $trace=Join-Path (Split-Path $executable) 'session_ui_smoke_trace.log'
          $stderr=Join-Path $PWD 'session_ui_stderr.log'
          $stdout=Join-Path $PWD 'session_ui_stdout.log'
          foreach($file in @($trace,$stderr,$stdout)){if(Test-Path $file){Remove-Item $file -Force}}
          $uiProcess=Start-Process -FilePath $executable -WorkingDirectory (Split-Path $executable) -ArgumentList "--session-ui-smoke-test" -RedirectStandardError $stderr -RedirectStandardOutput $stdout -PassThru
          $finished=$uiProcess.WaitForExit(300000)
          foreach($file in @($trace,$stderr,$stdout)){
            Write-Host "SESSION_DIAGNOSTIC_FILE=$file"
            if(Test-Path $file){Get-Content $file}
            else{Write-Host 'FILE_NOT_CREATED'}
          }
          if(-not $finished){
            Write-Host "SESSION_SMOKE_STUCK_PID=$($uiProcess.Id)"
            Get-Process -Id $uiProcess.Id | Format-List Id,ProcessName,Responding,MainWindowTitle,CPU,Threads
            Stop-Process -Id $uiProcess.Id -Force -ErrorAction SilentlyContinue
            throw 'SESSION_UI_SMOKE_TIMEOUT_300S'
          }
          if($uiProcess.ExitCode -ne 0){throw "SESSION_UI_SMOKE_FAILED exit=$($uiProcess.ExitCode)"}
          Write-Host 'SESSION_NATIVE_UI_14_PAGES_PASS'

      - name: Tester les reponses IA multilingues et les diagrammes MEMS
