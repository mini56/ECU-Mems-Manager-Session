        run: |
          $ErrorActionPreference='Stop'
          $env:PATH="C:\Qt\5.15.2\msvc2019_64\bin;$env:PATH"
          foreach($test in @('ia_response_selftest','ia_mems_diagram_selftest','mems_database_content_selftest','injection_ram_log_selftest')){
