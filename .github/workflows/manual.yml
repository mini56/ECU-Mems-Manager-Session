name: Build ECU Mems Manager (Windows)

on:
  push:
    branches: ["main", "master", "ui-rebuild"]
  pull_request:
    branches: ["main", "master", "ui-rebuild"]

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows (MinGW)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer aqtinstall
        run: pip install aqtinstall

      - name: Installer Qt 5.15.2 MinGW 32 bits
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ok = $false
          for ($i=1; $i -le 3; $i++) {
            if (Test-Path "C:\Qt\5.15.2") {
              Remove-Item "C:\Qt\5.15.2" -Recurse -Force -ErrorAction SilentlyContinue
            }
            Write-Host "Tentative Qt $i/3"
            & aqt install-qt windows desktop 5.15.2 win32_mingw81 -m qtcharts -O C:\Qt
            if ($LASTEXITCODE -eq 0 -and (Test-Path "C:\Qt\5.15.2\mingw81_32\lib\cmake\Qt5\Qt5Config.cmake")) {
              $ok = $true
              break
            }
            Write-Warning "Installation Qt incomplete, nouvelle tentative..."
            Start-Sleep -Seconds 8
          }
          if (-not $ok) { throw "Impossible d'installer Qt 5.15.2 correctement apres 3 tentatives." }
          & aqt install-tool windows desktop tools_mingw qt.tools.win32_mingw810 -O C:\Qt
          if ($LASTEXITCODE -ne 0) { throw "Echec installation MinGW 8.1" }

      - name: Ajouter MinGW et Qt au PATH
        run: |
          echo "C:\Qt\Tools\mingw810_32\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Qt\5.15.2\mingw81_32\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generer l'import lib librosco
        run: |
          cd prebuilt-librosco
          gendef librosco.dll
          dlltool -d librosco.def -l librosco.dll.a

      - name: Configure CMake
        run: cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/mingw81_32;${{ github.workspace }}/prebuilt-librosco"

      - name: Build Application
        run: cmake --build build

      - name: Create verified self-contained Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $qtRoot = "C:\Qt\5.15.2\mingw81_32"
          $qtBin = "$qtRoot\bin"
          $qtPlugins = "$qtRoot\plugins"
          $mingwBin = "C:\Qt\Tools\mingw810_32\bin"
          $build = "${{ github.workspace }}\build"
          $dist = "${{ github.workspace }}\dist"

          if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
          New-Item -ItemType Directory -Path $dist | Out-Null
          New-Item -ItemType Directory -Path "$dist\platforms" | Out-Null
          New-Item -ItemType Directory -Path "$dist\sqldrivers" | Out-Null
          New-Item -ItemType Directory -Path "$dist\imageformats" | Out-Null
          New-Item -ItemType Directory -Path "$dist\iconengines" | Out-Null
          New-Item -ItemType Directory -Path "$dist\styles" | Out-Null

          Copy-Item "$build\ecu_mems_manager.exe" "$dist\ecu_mems_manager.exe" -Force
          Copy-Item "$build\ecu_mems_uninstaller.exe" "$dist\uninstall_ecu_mems_manager.exe" -Force
          Copy-Item "${{ github.workspace }}\prebuilt-librosco\librosco.dll" "$dist\librosco.dll" -Force

          # Les traductions sont generees/copied par CMake dans build/translations.
          # Elles sont obligatoires : sans elles l'I18n affiche [0101], [3001], etc.
          if (-not (Test-Path "$build\translations")) {
            throw "Dossier de traductions absent du build"
          }
          Copy-Item "$build\translations" "$dist\translations" -Recurse -Force

          # La base MEMS hors ligne est generee/copied par CMake dans build/database.
          # Elle doit imperativement voyager avec l'application.
          if (-not (Test-Path "$build\database\reference")) {
            throw "Base MEMS hors ligne absente du build"
          }
          Copy-Item "$build\database" "$dist\database" -Recurse -Force

          $rootDlls = @(
            "$qtBin\Qt5Core.dll",
            "$qtBin\Qt5Gui.dll",
            "$qtBin\Qt5Widgets.dll",
            "$qtBin\Qt5Sql.dll",
            "$qtBin\Qt5Svg.dll",
            "$mingwBin\libgcc_s_dw2-1.dll",
            "$mingwBin\libstdc++-6.dll",
            "$mingwBin\libwinpthread-1.dll"
          )
          foreach ($dll in $rootDlls) {
            if (-not (Test-Path $dll)) { throw "DLL source introuvable: $dll" }
            Copy-Item $dll $dist -Force
          }

          foreach ($name in @("libEGL.dll","libGLESv2.dll","D3Dcompiler_47.dll","opengl32sw.dll")) {
            $src = Join-Path $qtBin $name
            if (Test-Path $src) { Copy-Item $src $dist -Force }
          }

          Copy-Item "$qtPlugins\platforms\qwindows.dll" "$dist\platforms\qwindows.dll" -Force
          Copy-Item "$qtPlugins\sqldrivers\qsqlite.dll" "$dist\sqldrivers\qsqlite.dll" -Force
          if (Test-Path "$qtPlugins\imageformats") { Copy-Item "$qtPlugins\imageformats\*.dll" "$dist\imageformats\" -Force }
          if (Test-Path "$qtPlugins\iconengines") { Copy-Item "$qtPlugins\iconengines\*.dll" "$dist\iconengines\" -Force }
          if (Test-Path "$qtPlugins\styles") { Copy-Item "$qtPlugins\styles\*.dll" "$dist\styles\" -Force }

          # Manifeste de desinstallation : liste uniquement les fichiers que le package installe.
          # Le desinstalleur se base exclusivement sur cette liste et ne supprime jamais
          # arbitrairement tout le contenu du dossier utilisateur.
          $manifestPath = Join-Path $dist "install_manifest.txt"
          $relativeFiles = Get-ChildItem $dist -Recurse -File | ForEach-Object {
            [IO.Path]::GetRelativePath($dist, $_.FullName)
          } | Sort-Object -Unique
          $relativeFiles += "install_manifest.txt"
          $relativeFiles | Sort-Object -Unique | Set-Content -Path $manifestPath -Encoding UTF8

          $required = @(
            "ecu_mems_manager.exe",
            "uninstall_ecu_mems_manager.exe",
            "install_manifest.txt",
            "Qt5Core.dll",
            "Qt5Gui.dll",
            "Qt5Widgets.dll",
            "Qt5Sql.dll",
            "Qt5Svg.dll",
            "libgcc_s_dw2-1.dll",
            "libstdc++-6.dll",
            "libwinpthread-1.dll",
            "librosco.dll",
            "platforms\qwindows.dll",
            "sqldrivers\qsqlite.dll",
            "imageformats\qsvg.dll",
            "translations\fr\fr.json",
            "translations\fr\fr_uninstall.json",
            "translations\en\en.json",
            "translations\en\en_uninstall.json",
            "translations\es\es.json",
            "translations\es\es_uninstall.json",
            "translations\it\it.json",
            "translations\it\it_uninstall.json",
            "translations\pt\pt.json",
            "translations\pt\pt_uninstall.json",
            "translations\de\de.json",
            "translations\de\de_uninstall.json",
            "database\reference\manifest.json",
            "database\reference\mems_reference_seed_1.qz64",
            "database\reference\mems_reference_seed_2.qz64",
            "database\reference\mems_reference_seed_3.qz64",
            "database\reference\mems_reference_seed_4.qz64",
            "database\reference\fiches\mems_1_2.xml.qz64",
            "database\reference\fiches\mems_1_3.xml.qz64",
            "database\reference\fiches\mems_1_6.xml.qz64",
            "database\reference\fiches\mems_1_9.xml.qz64",
            "database\reference\images\mems_1_2_ecu_connector.svg",
            "database\reference\images\mems_1_3_ecu_connectors.svg",
            "database\reference\images\mems_1_6_ecu_connector.svg",
            "database\reference\images\mems_1_9_ecu_connector.svg",
            "database\reference\images\rover_rosco_3pin_black.svg",
            "database\reference\images\mems_1_9_obd_16pin.svg"
          )
          foreach ($file in $required) {
            $full = Join-Path $dist $file
            if (-not (Test-Path $full)) { throw "Fichier obligatoire manquant dans le package: $file" }
            if ((Get-Item $full).Length -le 0) { throw "Fichier obligatoire vide: $file" }
            Write-Host "OK: $file - $((Get-Item $full).Length) octets"
          }

          # Validation du manifeste de desinstallation : chaque entree doit etre relative
          # et correspondre a un fichier reel du package.
          $manifestLines = Get-Content $manifestPath | Where-Object { $_ -and $_.Trim() }
          foreach ($entry in $manifestLines) {
            if ([IO.Path]::IsPathRooted($entry) -or $entry -match '(^|[\\/])\.\.([\\/]|$)') {
              throw "Entree dangereuse dans install_manifest.txt: $entry"
            }
            if ($entry -ne "install_manifest.txt" -and -not (Test-Path (Join-Path $dist $entry))) {
              throw "Entree du manifeste absente du package: $entry"
            }
          }

          # Validation du contenu de la base embarquee avant publication de l'artefact.
          # Le format qz64 correspond a qCompress Qt : taille big-endian sur 4 octets + flux zlib.
          $env:MEMS_REFERENCE_DIR = "$dist\database\reference"
          @'
          import base64
          import os
          import pathlib
          import sqlite3
          import tempfile
          import zlib

          root = pathlib.Path(os.environ["MEMS_REFERENCE_DIR"])
          encoded = b"".join(
              (root / f"mems_reference_seed_{i}.qz64").read_bytes().strip()
              for i in range(1, 5)
          )
          packed = base64.b64decode(encoded)
          if len(packed) < 5:
              raise SystemExit("Seed MEMS invalide: contenu compresse trop court")
          expected = int.from_bytes(packed[:4], "big")
          sql_bytes = zlib.decompress(packed[4:])
          if len(sql_bytes) != expected:
              raise SystemExit(f"Seed MEMS invalide: {len(sql_bytes)} octets reconstruits, {expected} attendus")

          smoke = pathlib.Path(tempfile.gettempdir()) / "ecu_mems_reference_smoke.sqlite"
          if smoke.exists():
              smoke.unlink()
          con = sqlite3.connect(smoke)
          try:
              for statement in sql_bytes.decode("utf-8").splitlines():
                  statement = statement.strip()
                  if statement:
                      con.execute(statement)
              con.commit()
              ecu_count = con.execute("SELECT COUNT(*) FROM ecu_target").fetchone()[0]
              fitment_count = con.execute("SELECT COUNT(*) FROM ecu_fitment_target").fetchone()[0]
              command_count = con.execute("SELECT COUNT(*) FROM protocol_commands").fetchone()[0]
              if ecu_count <= 0 or fitment_count <= 0 or command_count <= 0:
                  raise SystemExit("Base MEMS reconstruite mais vide")
              print(f"OK base MEMS: {ecu_count} ECU, {fitment_count} affectations, {command_count} commandes")
          finally:
              con.close()
              if smoke.exists():
                  smoke.unlink()
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Echec validation de la base MEMS hors ligne" }

          # Test de demarrage reel : si une DLL/plugin manque, le processus quitte immediatement.
          $proc = Start-Process "$dist\ecu_mems_manager.exe" -WorkingDirectory $dist -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            throw "L'application a quitte pendant le smoke test (code $($proc.ExitCode))"
          }
          Stop-Process -Id $proc.Id -Force
          Write-Host "OK: l'application reste lancee pendant le smoke test Windows"

          Write-Host "Package Windows verifie:"
          Get-ChildItem $dist -Recurse | Select-Object FullName,Length

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECU-Mems-Manager-Windows
          path: dist/
