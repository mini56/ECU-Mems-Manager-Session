name: TEMP update RAVEMEMS conditional steps

on:
  push:
    branches: [RAPPORT]
    paths:
      - '.github/workflows/tmp-update-ravemems-conditional-steps.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0

      - name: Update cahier and report
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          cahier = Path('docs/CAHIER_DES_CHARGES_RAVEMEMS_BROUILLON_2026-09-02.md')
          text = cahier.read_text(encoding='utf-8')
          anchor = "Il ne faut jamais transformer artificiellement `Repose 1` en étape 9, 15 ou 22 simplement parce qu’une phase Dépose la précède."
          addition = anchor + "\n\nLes **étapes conditionnelles** doivent rester rattachées à leur condition d’applicabilité. Exemple : si le manuel indique qu’une opération supplémentaire est nécessaire uniquement avec climatisation, cette condition fait partie de la procédure et ne doit pas être perdue. Si l’équipement ou la variante du véhicule est déjà connu, l’IA suit directement la branche applicable. Si cette information n’est pas connue et qu’elle change réellement la procédure, l’IA demande uniquement le discriminant nécessaire, par exemple : « Le véhicule est-il équipé de la climatisation ? »"
          if anchor not in text:
              raise SystemExit('conditional-step anchor not found')
          text = text.replace(anchor, addition, 1)
          cahier.write_text(text, encoding='utf-8')
          report = Path('RAPPORT_SUIVI_ECU_MEMS_MANAGER.md')
          lines = ["", "", "## 2026-09-02 — RELECTURE CAHIER RAVEMEMS — ÉTAPES CONDITIONNELLES", "", "Décision utilisateur validée : les étapes conditionnelles restent attachées à leur condition d’applicabilité. Si le contexte véhicule/équipement est connu, l’IA suit directement la branche applicable. Si le contexte manque et change réellement la procédure, l’IA demande uniquement le discriminant nécessaire (par exemple présence de climatisation).", "", "Aucun code applicatif, aucune extraction et aucun BUILD de production ne sont lancés.", "", "PROCHAINE ACTION EXACTE : poursuivre la relecture du cahier des charges RAVEMEMS question par question avec l’utilisateur. Ne lancer aucune nouvelle extraction avant validation explicite du cahier."]
          with report.open('a', encoding='utf-8') as f:
              f.write('\n'.join(lines))
          PY

      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-update-ravemems-conditional-steps.yml
          git add docs/CAHIER_DES_CHARGES_RAVEMEMS_BROUILLON_2026-09-02.md RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git diff --cached --check
          git commit -m "Record RAVEMEMS conditional step policy"
          git push origin HEAD:RAPPORT
