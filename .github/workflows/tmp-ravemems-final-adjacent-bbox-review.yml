name: TEMP RAVEMEMS final adjacent bbox review

on:
  push:
    paths:
      - .github/workflows/tmp-ravemems-final-adjacent-bbox-review.yml

permissions:
  contents: read
  actions: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-rave-new-extraction-pilot
          fetch-depth: 1
      - name: Download exact merged audit database
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/additive"
          gh run download 33493009341 --repo "$GITHUB_REPOSITORY" --name ravemems-additive-merge-audit --dir "$RUNNER_TEMP/additive"
          gzip -dc "$RUNNER_TEMP/additive/ia_mems_reference_r20_plus_ravemems_AUDIT.sqlite.gz" > "$RUNNER_TEMP/additive/merged.sqlite"
      - name: Print adjacent manual pages and diagram geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/additive/merged.sqlite" <<'PY'
          import json, re, sqlite3, sys, math
          db=sqlite3.connect(f'file:{sys.argv[1]}?mode=ro',uri=True)
          db.row_factory=sqlite3.Row
          assert db.execute('PRAGMA integrity_check').fetchone()[0].lower()=='ok'
          assert not db.execute('PRAGMA foreign_key_check').fetchall()

          def doc(pub):
            r=db.execute('SELECT document_key,file_name FROM mems_doc_document WHERE publication_code=?',(pub,)).fetchone()
            assert r is not None
            return r

          def lines(pub,p):
            d=doc(pub)
            return db.execute('''SELECT e.sort_order,t.text_value,e.notes
                                 FROM mems_doc_entity e JOIN mems_doc_unit u ON u.unit_key=e.unit_key
                                 JOIN mems_doc_text t ON t.entity_key=e.entity_key AND t.locale='en' AND t.field_key='source_exact'
                                 WHERE e.document_key=? AND u.physical_page=? AND e.entity_kind='source_line'
                                 ORDER BY e.sort_order''',(d['document_key'],p)).fetchall()

          print('===== RCL0193 ADJACENT PAGES =====')
          for p in [119,124,136,171]:
            rr=lines('RCL0193ENG',p)
            print(f'----- RCL0193ENG PHYSICAL_PAGE {p} LINE_COUNT {len(rr)} -----')
            for r in rr: print(f'{r["sort_order"]:04d} {r["text_value"] or ""}')
            print(f'----- END RCL0193ENG PHYSICAL_PAGE {p} -----')

          def bbox_from_notes(note):
            try:
              n=json.loads(note or '{}')
              b=n.get('bbox_json')
              if isinstance(b,str): b=json.loads(b)
              if isinstance(b,dict):
                vals=[b.get(k) for k in ('x0','y0','x1','y1')]
                if all(isinstance(x,(int,float)) for x in vals): return vals
              if isinstance(b,list) and len(b)>=4 and all(isinstance(x,(int,float)) for x in b[:4]): return b[:4]
            except Exception: pass
            return None

          color_re=re.compile(r'^(?:B|N|K|R|G|U|W|Y|O|P|S|L){1,3}$')
          targets={
            17:['C152-1','C152-2','C158-17','C159-13','C174-1','C174-2','C169-1','C169-2','C175-1','C175-2','C175-3','C186-1','C186-2','C186-3','SJ5','SENSOR EARTH','MAP','INLET AIR TEMP','COOLANT TEMP'],
            19:['C159-30','C174-1','C174-2','C159-16','C165-1','C165-2','C175-1','C175-2','C175-3','SJ5','SENSOR EARTH','INLET AIR TEMP','COOLANT TEMP','THROTTLE POSITION']
          }
          for p, wanted in targets.items():
            rr=lines('RCL0194ENG',p)
            parsed=[]
            for r in rr:
              text=(r['text_value'] or '').strip(); b=bbox_from_notes(r['notes'])
              if b:
                cx=(b[0]+b[2])/2; cy=(b[1]+b[3])/2
              else: cx=cy=None
              parsed.append({'order':r['sort_order'],'text':text,'bbox':b,'cx':cx,'cy':cy})
            colors=[x for x in parsed if color_re.fullmatch(x['text']) and x['bbox']]
            print(f'===== RCL0194ENG GEOMETRY PAGE {p} =====')
            for x in parsed:
              if any(w.casefold() in x['text'].casefold() for w in wanted):
                print('TARGET_GEOM '+json.dumps(x,ensure_ascii=False))
                if x['bbox']:
                  near=[]
                  for c in colors:
                    dx=(c['cx']-x['cx']); dy=(c['cy']-x['cy'])
                    # Same-row proximity is more informative for circuit labels.
                    score=abs(dy)*4+abs(dx)
                    near.append((score,abs(dy),abs(dx),c))
                  near.sort(key=lambda z:(z[0],z[1],z[2]))
                  print('NEAREST_COLORS '+json.dumps([{'score':round(a,2),'dy':round(b,2),'dx':round(c,2),'order':d['order'],'text':d['text'],'bbox':d['bbox']} for a,b,c,d in near[:8]],ensure_ascii=False))
            print('ALL_COLOR_GEOM '+json.dumps(colors,ensure_ascii=False))
          print('FINAL_ADJACENT_BBOX_REVIEW_COMPLETE')
          db.close()
          PY
