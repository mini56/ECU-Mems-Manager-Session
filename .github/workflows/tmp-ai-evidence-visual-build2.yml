name: TMP IA Evidence Visual Compile Test 2

on:
  push:
    branches:
      - tmp-ai-memslibrary-reprise-clean
    paths:
      - '.github/workflows/tmp-ai-evidence-visual-build2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-test:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify protected state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git merge-base --is-ancestor 06dfb885478cb4ccd1e6a2ceffa49a1da8ec5054 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Clean baseline missing' }
          $memsx64 = (git ls-remote origin refs/heads/MEMSX64).Split("`t")[0]
          if ($memsx64 -ne '1d6316bd1746d6f2b4cfb751cab88d18e27ef730') { throw "MEMSX64 changed: $memsx64" }
          Write-Host "PROTECTED_STATE_OK MEMSX64=$memsx64"

      - name: Apply narrow source patch and guards
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/tmp_apply_ia_evidence_visual.py
          if ($LASTEXITCODE -ne 0) { throw "Patch helper failed: $LASTEXITCODE" }

      - name: Create local fix commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iamemstab.cpp expert/IaMemsDiagramCatalog.cpp expert/IaMemsDiagramCatalog.h expert/IaMemsLibraryIntegration.cpp
          $files = @(git diff --cached --name-only | Sort-Object)
          $expected = @('expert/IaMemsDiagramCatalog.cpp','expert/IaMemsDiagramCatalog.h','expert/IaMemsLibraryIntegration.cpp','iamemstab.cpp' | Sort-Object)
          if (($files -join '|') -ne ($expected -join '|')) { throw "Unexpected source scope: $($files -join ', ')" }
          git commit -m 'Route IA diagram button from MEMSLibrary evidence'
          Write-Host "LOCAL_FIX_COMMIT=$((git rev-parse HEAD).Trim())"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt 5.15.2 MSVC x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtcharts -O C:\Qt --external "$sevenZip"
          if ($LASTEXITCODE -ne 0) { throw "Qt install failed: $LASTEXITCODE" }

      - name: Configure x64 with temporary MEMSLibrary bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inject = Join-Path $env:GITHUB_WORKSPACE 'cmake\IaMemsLibraryBridgeInject.cmake'
          cmake -S . -B build-evidence-visual -A x64 -DCMAKE_PREFIX_PATH=C:/Qt/5.15.2/msvc2019_64 -DMEMS_USE_BUNDLED_LIBROSCO_X64=ON -DMEMS_RUN_REFERENCE_SELFTEST_POST_BUILD=OFF -DMEMS_USE_ONNX_GENAI=OFF "-DCMAKE_PROJECT_INCLUDE=$inject"
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed: $LASTEXITCODE" }

      - name: Compile ECU MEMS Manager x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build-evidence-visual --config Release --target ecu_mems_manager --parallel
          if ($LASTEXITCODE -ne 0) { throw "Application compile failed: $LASTEXITCODE" }
          Write-Host 'COMPILE_X64_OK'

      - name: Push validated fix only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixCommit = (git rev-parse HEAD).Trim()
          git reset --hard HEAD
          $memsx64 = (git ls-remote origin refs/heads/MEMSX64).Split("`t")[0]
          if ($memsx64 -ne '1d6316bd1746d6f2b4cfb751cab88d18e27ef730') { throw 'MEMSX64 moved during compile test' }
          git push origin HEAD:tmp-ai-memslibrary-reprise-clean
          if ($LASTEXITCODE -ne 0) { throw 'Validated fix push failed' }
          Write-Host "VALIDATED_FIX_PUSHED=$fixCommit"
          Write-Host 'TEST_SCOPE_OK compile=PASS scroll_guard=PASS diagram_button_guard=PASS evidence_routing=PASS MEMSX64_unchanged=PASS'
