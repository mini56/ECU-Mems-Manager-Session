name: TEMP Journal RAVEMEMS V2 RCL0193ENG result 1

on:
  push:
    branches: [RAPPORT]
    paths:
      - '.github/workflows/tmp-journal-ravemems-v2-rcl0193-result1.yml'

permissions:
  contents: write

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0

      - name: Verify state and append prototype verdict
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/MEMSX64 | awk '{print $1}')" = '1d6316bd1746d6f2b4cfb751cab88d18e27ef730'
          test "$(git ls-remote origin refs/heads/tmp-ravemems-v2-foundation | awk '{print $1}')" = 'b3d4c1a5591148140f17257c695564abd5e382c3'
          python3 - <<'PY'
          from pathlib import Path
          report = Path('RAPPORT_SUIVI_ECU_MEMS_MANAGER.md')
          raw = report.read_bytes()
          marker = '## 2026-09-03 — RCL0193ENG V2 PROTOTYPE 1 — MECANIQUE VERTE, SEMANTIQUE A CORRIGER'.encode('utf-8')
          if marker not in raw:
              entry = '''\n\n## 2026-09-03 — RCL0193ENG V2 PROTOTYPE 1 — MECANIQUE VERTE, SEMANTIQUE A CORRIGER\n\nBranche `tmp-ravemems-v2-foundation`, commit technique `b3d4c1a5591148140f17257c695564abd5e382c3` (`Add RCL0193ENG RAVEMEMS V2 prototype extractor`). Run GitHub Actions `33721636279` : **SUCCESS** pour les gardes et l’exécution du prototype. `MEMSX64` est restée exactement BUILD #103.\n\nSource strictement figée : `main@643de091b474f4e27917a065bdf46d5a0c764276`, `rave/xn/wmxn990e.pdf`, blob `82263eb36bb194dfa969d0471d10ef11078ce521`, SHA-256 PDF `c050a3eebe50c5a85bf8a69b7722bd2052079944e09d58578a498984ecf06715`, taille `4 744 911` octets, `372` pages, publication `RCL0193ENG`, `2nd Edition`.\n\nExtraction produite : `201` opérations, `315` phases, `3 189` étapes, `180` notices, `23` exigences, `738` visuels rendus, `427` liaisons visuelles, `3 885` provenances. SQLite `integrity_check=ok`, `0` FK cassée. Tous les visuels sont produits par `pdf_page_render_crop`; aucun `extract_image()` brut n’est utilisé comme visuel utilisateur et aucun visuel n’est auto-déclaré validé.\n\nArtefact : `RAVEMEMS-V2-RCL0193ENG-PROTOTYPE-AUDIT`, ID `9880443203`, taille ZIP `25 203 259` octets, digest `sha256:caf179f2480ee4fa002295afb7e6816e617fee40263596c596741a119b918c47`, expiration 2026-09-17.\n\nVerdict : le mécanisme et les gardes sont verts, mais **le prototype sémantique n’est pas validé**. L’audit contient `1 797` constats et le garde générique a trouvé `242` phases dont la numérotation constructeur observée ne forme pas une séquence complète `1..N`; les `242` sont toutes correctement marquées incomplètes et accompagnées d’un drapeau de review ouvert. C’est beaucoup trop pour accepter l’extraction telle quelle et cela indique que la reconnaissance générique des lignes d’étapes est encore trop permissive ou manque des débuts d’étapes. Les `738` visuels et `427` liaisons restent volontairement en attente de validation, ce qui contribue également au volume d’audit et est conforme au cahier.\n\nAucune donnée n’est corrigée manuellement et aucun cas `injecteur` ne doit être codé en dur. Le cas connu pages physiques 133–135 reste un test de validation du mécanisme générique seulement. Aucun des 47 PDF supplémentaires n’est autorisé.\n\nPROCHAINE ACTION EXACTE : sur la même branche de test, corriger à la racine la segmentation/reconnaissance des étapes et la continuité multi-pages à partir de la géométrie et des marqueurs structurels du manuel, ajouter des diagnostics structuraux permettant de distinguer vraie séquence incomplète et faux positif de parsing, puis relancer uniquement `RCL0193ENG`. Exiger une chute massive des 242 défauts et vérifier explicitement le cas multi-pages pages 133–135 avant toute validation.\n'''.encode('utf-8')
              with report.open('ab') as f:
                  if raw and not raw.endswith(b'\n'):
                      f.write(b'\n')
                  f.write(entry)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git diff --cached --check
          git commit -m 'Journal first RCL0193ENG V2 prototype verdict'
          git push origin HEAD:RAPPORT
