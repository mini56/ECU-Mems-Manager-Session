name: TEMP RCL0193FRE 1860 LAUNCH EXISTING PACKAGE

on:
  push:
    branches: [ tmp-rave-visual-backfill ]
    paths:
      - '.github/workflows/temp-rcl0193fre-1860-install.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-rave-visual-backfill
          fetch-depth: 0
      - name: Materialize and execute uploaded 1860 workflow steps
        shell: bash
        run: |
          set -euo pipefail
          test -f temp-rcl0193fre-1860-install.yml
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          doc=yaml.safe_load(Path('temp-rcl0193fre-1860-install.yml').read_text(encoding='utf-8'))
          runs=[(s.get('name','run'),s['run']) for s in doc['jobs']['install']['steps'] if 'run' in s]
          assert len(runs) >= 4, len(runs)
          for i,(name,script) in enumerate(runs):
              p=Path(f'/tmp/rcl1860_step_{i:02d}.sh')
              p.write_text('set -euo pipefail\n'+script+'\n',encoding='utf-8')
              print(i,name,p)
          PY
          for f in /tmp/rcl1860_step_*.sh; do
            echo "RUN $f"
            bash "$f"
          done
