name: TEMP RCL0193FRE 1860 FINAL INSTALL

on:
  push:
    branches: [ tmp-rave-visual-backfill ]
    paths:
      - '.github/workflows/temp-rcl0193fre-1860-install.yml'
      - 'tools/install_rcl0193fre_1860.py'
      - '.rcl1860_transport/**'

permissions:
  contents: write

jobs:
  install:
    if: github.event.head_commit.message != 'Add RCL0193FRE electrical instruments batch 1860'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify production remains BUILD 101
        shell: bash
        run: |
          test "$(git ls-remote origin refs/heads/MEMSX64 | cut -f1)" = "22dbe75ed14e0a61e694159d505ef72245116b48"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Install and validate 1860
        run: python tools/install_rcl0193fre_1860.py install .

      - name: Commit complete 1860
        shell: bash
        run: |
          cp tools/install_rcl0193fre_1860.py /tmp/install_rcl0193fre_1860.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/reference/research_enrichment_1860.qz64 \
                  database/reference/manifest.json \
                  database/reference/audits/rcl0193fre_1860_audit.md \
                  database/reference/images/rave/RCL0193FRE_PDF_*.png
          git rm -r .rcl1860_transport tools/install_rcl0193fre_1860.py .github/workflows/temp-rcl0193fre-1860-install.yml
          git commit -m "Add RCL0193FRE electrical instruments batch 1860"
          git push origin HEAD:tmp-rave-visual-backfill

      - name: Verify committed remote state
        shell: bash
        run: |
          git fetch origin tmp-rave-visual-backfill
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/tmp-rave-visual-backfill)"
          python /tmp/install_rcl0193fre_1860.py post .
