name: TEMP RCL0193FRE 1860 LAUNCH EXISTING PACKAGE

on:
  push:
    branches: [ tmp-rave-visual-backfill ]
    paths:
      - '.github/workflows/temp-rcl0193fre-1860-install.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-rave-visual-backfill
          fetch-depth: 0
      - name: Execute already-uploaded 1860 package
        shell: bash
        run: |
          set -euo pipefail
          test -f temp-rcl0193fre-1860-install.yml
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          from pathlib import Path
          import os, subprocess, yaml
          doc=yaml.safe_load(Path('temp-rcl0193fre-1860-install.yml').read_text(encoding='utf-8'))
          steps=doc['jobs']['install']['steps']
          runs=[(s.get('name','run'),s['run']) for s in steps if 'run' in s]
          assert len(runs) >= 4, len(runs)
          for name, script in runs:
              print('RUN_ROOT_STEP:', name, flush=True)
              subprocess.run(script, shell=True, executable='/bin/bash', check=True, env=os.environ.copy())
          PY
