name: TEMP journal RAVEMEMS final page evidence

on:
  push:
    paths:
      - .github/workflows/tmp-ravemems-journal-final-page-evidence.yml

permissions:
  contents: write

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 1
      - name: Append final page evidence and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' '' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          printf '%s\n' '## 2026-09-01 - RAVEMEMS - PREUVES PAGES COMPLETES DES 10 CAS' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          printf '%s\n' '' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          printf '%s\n' 'Workflow read-only run 33508381801, job 99857827972, commit 2064a226eba649db7501bc2b296d78b5a14efb37 = SUCCESS.' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          printf '%s\n' 'RCL0193ENG p.98 contient 0 ligne source ; le contenu EVAP historique attribue a p.98 est confirme exactement p.99 lignes 68-74, y compris commande ECM, seuil 70 C et consequences a froid/ralenti. Classification provisoire : fait CONFIRME, provenance page a corriger p.98 -> p.99.' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          printf '%s\n' 'RAVE-REP-PURGE-001 est confirme sur p.102 : deconnexion multiplug/durite, depose et rejet du joint torique, puis joint neuf lubrifie a la graisse silicone et remontage. La reference historique p.101 est decalee dune page.' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          printf '%s\n' 'RAVE-REP-INJECTORS-001 : p.135 confirme depose rampe et rejet des joints toriques injecteurs ; p.170 confirme depose rampe/injecteurs et rejet des joints. La partie repose/nettoyage/graisse silicone doit encore etre verifiee sur les pages suivantes.' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          printf '%s\n' 'RAVE-ADJ-THROTTLE-CABLE-001 : p.118 est encore Description and Operation et ne contient pas la procedure de reglage ; la section 19.20 est localisee a partir de p.119. Verifier p.119.' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          printf '%s\n' 'RAVE-REP-TP-SENSOR-001 : p.123 contient le debut de THROTTLE HOUSING et pas encore la procedure TP sensor ni 1,5 Nm. Verifier la page suivante p.124 avant de conclure.' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          printf '%s\n' 'RCL0194ENG p.17 et p.19 confirment les sections 20.2 MPi et 20.4 SPi Japan, les connecteurs attendus, SENSOR EARTH, SJ5 et les codes couleur NK/BW/KB/GB. Le texte lineaire seul ne suffit toutefois pas a prouver la correspondance graphique fil par fil entre chaque connecteur et son code couleur ; cette association doit etre verifiee avec bbox/spans avant validation finale.' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          printf '%s\n' '' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          printf '%s\n' 'PROCHAINE ACTION EXACTE : lire en lecture seule RCL0193ENG p.119,124,136,171 pour fermer cable, TP et repose injecteurs ; puis exploiter bbox/spans des lignes RCL0194ENG p.17 et p.19 afin de verifier les associations connecteur-couleur pour les cinq cas partiels. Classer ensuite les 10 faits definitivement et produire le plan non destructif de correction des seules provenances/erreurs prouvees. Aucune modification SQLite et aucun MEMSX64 avant ce verdict.' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          rm .github/workflows/tmp-ravemems-journal-final-page-evidence.yml
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md .github/workflows/tmp-ravemems-journal-final-page-evidence.yml
          git commit -m "Record final RAVEMEMS page evidence"
          git push origin HEAD:RAPPORT
