name: TEMP PATCH RAVEMEMS TEST2 OCR ORDER

on: [push]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-rave-new-extraction-pilot
          fetch-depth: 0
      - name: Apply exact OCR order patch
        run: python tools/temp_patch_ravemems_test2_ocr_order.py
      - name: Commit patch and retrigger TEST2
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'rerun TEST2 after preserving native Tesseract word order' > .ravemems-test2-trigger
          git config user.name github-actions-bot
          git config user.email github-actions@users.noreply.github.com
          git rm .github/workflows/temp-patch-ravemems-test2-ocr-order.yml tools/temp_patch_ravemems_test2_ocr_order.py
          git add tools/ravemems_test2_raster_text.py .ravemems-test2-trigger
          expected="$(printf '%s\n' '.github/workflows/temp-patch-ravemems-test2-ocr-order.yml' '.ravemems-test2-trigger' 'tools/ravemems_test2_raster_text.py' 'tools/temp_patch_ravemems_test2_ocr_order.py' | sort)"
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$expected"
          git commit -m "Preserve Tesseract OCR word order in TEST2"
          git push origin HEAD:tmp-rave-new-extraction-pilot
