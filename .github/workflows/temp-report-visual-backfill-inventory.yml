name: TEMP REPORT VISUAL BACKFILL INVENTORY

on:
  push:
    branches: [RAPPORT]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update_report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0

      - name: Append inventory result
        shell: bash
        env:
          REPORT_APPEND_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('RAPPORT_SUIVI_ECU_MEMS_MANAGER.md')
          append = base64.b64decode(os.environ['REPORT_APPEND_B64']).decode('utf-8')
          text = p.read_text(encoding='utf-8')
          marker = '# CHANTIER RAVE VISUEL — INVENTAIRE DES LOTS EXISTANTS — 29 AOÛT 2026'
          if marker not in text:
              p.write_text(text.rstrip() + '\n\n' + append.rstrip() + '\n', encoding='utf-8')
          PY

      - name: Commit report and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-report-visual-backfill-inventory.yml
          git add -- RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git commit -m "Record RAVE visual backfill inventory"
          git push origin RAPPORT
