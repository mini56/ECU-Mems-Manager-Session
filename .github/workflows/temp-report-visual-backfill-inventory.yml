name: TEMP REPORT VISUAL BACKFILL INVENTORY

on:
  push:
    branches: [RAPPORT]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update_report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
