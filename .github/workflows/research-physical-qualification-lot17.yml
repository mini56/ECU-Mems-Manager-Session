name: MEMS 1.6 NA et 1.9 - qualification des 44 pistes lot 17
on:
  push:
    branches: [research/mems-firmwares-20261126]
    paths: ['.github/workflows/research-physical-qualification-lot17.yml','research/instruments-integral-20261127/qualify_physical_lot17.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Qualifier les 44 candidats et contrôler les ROM et XF
        run: python3 research/instruments-integral-20261127/qualify_physical_lot17.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-sorties-lot17
          path: research/instruments-integral-20261127/results/*qualification_sorties_lot17.json
      - name: Enregistrer les résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/instruments-integral-20261127/results/*qualification_sorties_lot17.json
          if ! git diff --cached --quiet; then
            git commit -m "Recherche instruments : qualification lot 17 [skip ci]"
            git pull --rebase origin research/mems-firmwares-20261126
            git push origin HEAD:research/mems-firmwares-20261126
          fi
