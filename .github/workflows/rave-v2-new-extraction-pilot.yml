name: RAVE V2 new extraction pilot

on:
  workflow_dispatch:
  push:
    branches:
      - tmp-rave-new-extraction-pilot
    paths:
      - .rave-v2-pilot-trigger

permissions:
  contents: read

jobs:
  extract-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-rave-new-extraction-pilot
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install extraction dependencies
        run: python -m pip install --disable-pip-version-check PyMuPDF Pillow

      - name: Repair transferred pilot script and compile it
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/rave_v2_new_extraction.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("zone_rects=[fitz.Rect({['bbox']) for z in zones]", "zone_rects=[fitz.Rect(z['bbox']) for z in zones]")
          s = s.replace("f=getfont(max(13,z.get('source_font_size',8)*scale*.92))", "f=getfont(max(13,min(14,z.get('source_font_size',8)*scale*.92)))")
          s = s.replace("base=max(13,z.get('source_font_size',8)*scale*.92); f=getfont(base)", "base=max(13,min(14,z.get('source_font_size',8)*scale*.92)); f=getfont(base)")
          needle = "    localized=out/f'RCL0193ENG_P{n:03d}_FR_DIRECT_TEXT.png'; canvas.save(localized)"
          replacement = """    if n == 112 and block_translations.get('RCL0193ENG_P112_B08'):
        bx0,by0,bx1,by1=[int(v*scale) for v in (320.5,339.3,551.06,401.07)]
        bx0+=ox; bx1+=ox
        d.rectangle((bx0-3,by0-3,bx1+3,by1+3),fill='white')
        ix0,iy0,ix1,iy1=[int(v*scale) for v in (318.0,337.0,349.0,374.0)]
        icon=img.crop((ix0,iy0,ix1,iy1))
        canvas.paste(icon,(ox+ix0,iy0))
        note=block_translations['RCL0193ENG_P112_B08']
        nx0=int(350.5*scale)+ox; ny0=int(339.3*scale); nx1=int(551.06*scale)+ox; ny1=int(401.07*scale)
        nf,nlines,nlh=fit_text(d,note,(nx0,ny0,nx1,ny1),10*scale*.88,bold=True,min_px=13)
        yy=ny0
        for line in nlines:
            d.text((nx0,yy),line,fill=(0,170,90),font=nf); yy+=nlh
    localized=out/f'RCL0193ENG_P{n:03d}_FR_DIRECT_TEXT.png'; canvas.save(localized)"""
          if needle not in s:
              raise SystemExit('localized render insertion point missing')
          s = s.replace(needle, replacement)
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile tools/rave_v2_new_extraction.py

      - name: Extract real RAVE page 112 with direct translated text
        id: extract
        continue-on-error: true
        run: |
          rm -rf rave_v2_pilot_output
          python tools/rave_v2_new_extraction.py --pdf rave/xn/wmxn990e.pdf --out rave_v2_pilot_output --exclude 193-202 --page 112 --translations .github/rave_v2_pilot_translations_fr.json

      - name: Show completeness manifest
        if: always()
        run: |
          if [ -f rave_v2_pilot_output/manifest.json ]; then
            cat rave_v2_pilot_output/manifest.json
          else
            echo "manifest.json missing"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rave-v2-direct-text-page112
          path: rave_v2_pilot_output
          if-no-files-found: error

      - name: Enforce extraction result
        if: steps.extract.outcome != 'success'
        run: exit 1
