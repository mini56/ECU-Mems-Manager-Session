name: RAVE V2 new extraction pilot

on:
  workflow_dispatch:
  push:
    branches:
      - tmp-rave-new-extraction-pilot
    paths:
      - .rave-v2-pilot-trigger

permissions:
  contents: read

jobs:
  extract-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-rave-new-extraction-pilot
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install extraction dependencies
        run: python -m pip install --disable-pip-version-check PyMuPDF Pillow

      - name: Apply direct-render pilot patches
        run: |
          python tools/rave_v2_apply_direct_render_patch.py
          python tools/rave_v2_preserve_pictograms_patch.py
          python -m py_compile tools/rave_v2_new_extraction.py

      - name: Discover another real technical mixed text and schematic RAVE page
        id: extract
        continue-on-error: true
        run: |
          rm -rf rave_v2_pilot_output
          python tools/rave_v2_new_extraction.py --pdf rave/xn/wmxn990e.pdf --out rave_v2_pilot_output --exclude 1-20,112,193-202 --page auto

      - name: Show discovery manifest
        if: always()
        run: |
          if [ -f rave_v2_pilot_output/manifest.json ]; then
            cat rave_v2_pilot_output/manifest.json
          else
            echo "manifest.json missing"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rave-v2-second-technical-page-discovery
          path: rave_v2_pilot_output
          if-no-files-found: error

      - name: Discovery expected to need translations
        if: always()
        run: exit 0
