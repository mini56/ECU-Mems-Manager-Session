name: TEMP update RAVEMEMS choice pagination
on:
  push:
    branches: [RAPPORT]
    paths: ['.github/workflows/tmp-update-ravemems-choice-pagination.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Update cahier and report
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/CAHIER_DES_CHARGES_RAVEMEMS_BROUILLON_2026-09-02.md')
          s = p.read_text(encoding='utf-8')
          old = "Le premier menu doit rester court et utile : **3 choix maximum**, puis une quatrième option **`4. Autre chose ?`**. L’utilisateur peut donc répondre `1`, `2`, `3` ou `4`. S’il choisit `4`, l’IA lui demande simplement ce qu’il souhaite savoir d’autre afin qu’il puisse formuler librement une autre demande."
          new = "Le menu doit rester court et utile : **3 choix maximum à la fois**, puis une quatrième option **`4. Autre chose ?`**. L’utilisateur peut donc répondre `1`, `2`, `3` ou `4`. S’il choisit `4` et qu’il reste d’autres rubriques pertinentes pour le même sujet, l’IA affiche les **3 choix suivants**, puis repropose **`4. Autre chose ?`** tant qu’il reste des possibilités. Exemple : pour 9 rubriques, l’IA présente 1 à 3, puis 4 à 6 après `Autre chose ?`, puis 7 à 9 après un nouveau `Autre chose ?`. L’option sert donc à parcourir progressivement les choix disponibles sans afficher une longue liste d’un seul coup. Quand toutes les rubriques ont été proposées, l’IA peut alors demander à l’utilisateur de préciser librement une autre demande."
          if old not in s:
              raise SystemExit('target paragraph not found')
          p.write_text(s.replace(old,new,1), encoding='utf-8')
          r = Path('RAPPORT_SUIVI_ECU_MEMS_MANAGER.md')
          with r.open('a', encoding='utf-8') as f:
              f.write("\n\n## 2026-09-02 — RAVEMEMS — pagination des choix IA\n\nDécision utilisateur : pour une question générale, l’IA affiche au maximum 3 choix à la fois, puis `4. Autre chose ?`. Si l’utilisateur choisit 4 et qu’il reste des rubriques pertinentes pour le même sujet, l’IA affiche les 3 suivantes et répète le mécanisme jusqu’à épuisement des choix. Exemple avec 9 possibilités : 1-3, puis 4-6, puis 7-9. `Autre chose ?` sert donc à paginer les possibilités du sujet avant de demander éventuellement une formulation libre. Aucun code ni extraction lancé à ce stade.\n")
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name "mini56"
          git config user.email "48644212+mini56@users.noreply.github.com"
          git rm .github/workflows/tmp-update-ravemems-choice-pagination.yml
          git add docs/CAHIER_DES_CHARGES_RAVEMEMS_BROUILLON_2026-09-02.md RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git commit -m "Refine RAVEMEMS paged IA choices"
          git push origin HEAD:RAPPORT
