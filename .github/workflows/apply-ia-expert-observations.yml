name: Apply IA MEMS expert observation wiring

on:
  workflow_dispatch:
  push:
    branches: ["lab-expert-engine"]
    paths:
      - "tools/patch_ia_expert_observations.py"
      - ".github/workflows/apply-ia-expert-observations.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply deterministic observation patch
        run: python tools/patch_ia_expert_observations.py
      - name: Commit only if source changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- iamemstab.cpp; then
            echo "IA expert observations already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- iamemstab.cpp
          git commit -m "Wire expert observations into IA MEMS [skip ci]"
          git pull --rebase origin lab-expert-engine
          git push origin HEAD:lab-expert-engine
