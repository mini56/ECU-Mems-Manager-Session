name: MEMSX64 IA staged crash isolation v2

on:
  workflow_dispatch:
  push:
    branches: [MEMSX64]
    paths:
      - '.github/workflows/memsx64-ia-stage-isolation-v2.yml'

permissions:
  contents: write

jobs:
  build-ia-stage-v2:
    runs-on: windows-latest

    steps:
      - name: Checkout MEMSX64
        uses: actions/checkout@v4
        with:
          ref: MEMSX64

      - name: Publish diagnostic run id
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @(
            'MEMSX64 IA STAGE DIAG V2: STARTED',
            'run_id=${{ github.run_id }}',
            'run_number=${{ github.run_number }}',
            'workflow_sha=${{ github.sha }}',
            ('utc=' + [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))
          ) | Set-Content -Encoding UTF8 IA_STAGE_DIAG_V2_STARTED.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin MEMSX64
          git add IA_STAGE_DIAG_V2_STARTED.txt
          git commit -m "Record IA stage diagnostic v2 run [skip ci]"
          git push origin HEAD:MEMSX64

      - name: Inject runner-only IA stage switches and trace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          p = Path('iamemstab.cpp')
          s = p.read_text(encoding='utf-8')

          s = s.replace('#include <QEvent>\n', '#include <QEvent>\n#include <QCoreApplication>\n#include <QFile>\n', 1)

          anchor = 'static const int kTabPtrRole = Qt::UserRole + 60;\n\n'
          helper = r'''static const int kTabPtrRole = Qt::UserRole + 60;

QString iaDiagMode()
{
    return qEnvironmentVariable("MEMS_IA_DIAG_MODE").trimmed().toLower();
}

void iaDiagTrace(const QString &message)
{
    QFile file(QCoreApplication::applicationDirPath() + QStringLiteral("/IA_DIAG_TRACE.txt"));
    if (!file.open(QIODevice::WriteOnly | QIODevice::Append | QIODevice::Text))
        return;
    file.write((QDateTime::currentDateTime().toString(QStringLiteral("yyyy-MM-dd HH:mm:ss.zzz"))
                + QStringLiteral(" | ") + message + QLatin1Char('\n')).toUtf8());
    file.flush();
}

'''
          if s.count(anchor) != 1:
              raise SystemExit('diagnostic helper anchor mismatch')
          s = s.replace(anchor, helper, 1)

          old_show = r'''void IaMemsTab::showEvent(QShowEvent *event)
{
    QWidget::showEvent(event);

    // Keep the main ECU program light: the knowledge cache and the local
    // language model are started only when IA MEMS is actually opened.
    QTimer::singleShot(0, this, &IaMemsTab::startKnowledgeLoad);
    if (m_localAi)
        QTimer::singleShot(0, m_localAi, &LocalAiClient::initialize);
}
'''
          new_show = r'''void IaMemsTab::showEvent(QShowEvent *event)
{
    const QString mode = iaDiagMode();
    iaDiagTrace(QStringLiteral("showEvent ENTER mode=%1").arg(mode.isEmpty() ? QStringLiteral("original") : mode));
    QWidget::showEvent(event);
    iaDiagTrace(QStringLiteral("showEvent QWidget returned"));

    if (mode == QStringLiteral("ui_only")) {
        iaDiagTrace(QStringLiteral("UI_ONLY stop before async starts"));
        return;
    }

    if (mode != QStringLiteral("local_only")) {
        iaDiagTrace(QStringLiteral("schedule KNOWLEDGE"));
        QTimer::singleShot(0, this, &IaMemsTab::startKnowledgeLoad);
    }
    if (mode != QStringLiteral("knowledge_only") && m_localAi) {
        iaDiagTrace(QStringLiteral("schedule LOCAL_AI"));
        QTimer::singleShot(0, m_localAi, &LocalAiClient::initialize);
    }
    iaDiagTrace(QStringLiteral("showEvent EXIT"));
}
'''
          if s.count(old_show) != 1:
              raise SystemExit('showEvent block mismatch')
          s = s.replace(old_show, new_show, 1)

          start_anchor = 'void IaMemsTab::startKnowledgeLoad()\n{\n'
          if s.count(start_anchor) != 1:
              raise SystemExit('startKnowledgeLoad anchor mismatch')
          s = s.replace(start_anchor, start_anchor + '    iaDiagTrace(QStringLiteral("startKnowledgeLoad ENTER"));\n', 1)

          thread_anchor = '    QThread *thread = QThread::create([guard]() {\n'
          if s.count(thread_anchor) != 1:
              raise SystemExit('QThread create anchor mismatch')
          s = s.replace(thread_anchor,
                        '    iaDiagTrace(QStringLiteral("before QThread::create"));\n'
                        + thread_anchor
                        + '        iaDiagTrace(QStringLiteral("knowledge worker ENTER"));\n', 1)

          build_anchor = '        const bool ok = reference.buildOrOpen();\n'
          if s.count(build_anchor) != 1:
              raise SystemExit('buildOrOpen anchor mismatch')
          s = s.replace(build_anchor,
                        '        iaDiagTrace(QStringLiteral("before buildOrOpen"));\n'
                        + build_anchor
                        + '        iaDiagTrace(QStringLiteral("after buildOrOpen ok=%1 error=%2").arg(ok).arg(reference.lastError().left(300)));\n', 1)

          start_thread = '    thread->start();\n'
          if s.count(start_thread) != 1:
              raise SystemExit('thread start anchor mismatch')
          s = s.replace(start_thread,
                        '    iaDiagTrace(QStringLiteral("before thread->start"));\n'
                        + start_thread
                        + '    iaDiagTrace(QStringLiteral("after thread->start"));\n', 1)

          finish_anchor = 'void IaMemsTab::finishKnowledgeLoad(bool ok,\n                                    const QString &databasePath,\n                                    const QString &errorText)\n{\n'
          if s.count(finish_anchor) != 1:
              raise SystemExit('finishKnowledgeLoad anchor mismatch')
          s = s.replace(finish_anchor, finish_anchor + '    iaDiagTrace(QStringLiteral("finishKnowledgeLoad ENTER ok=%1 path=%2 error=%3").arg(ok).arg(databasePath).arg(errorText.left(300)));\n', 1)

          p.write_text(s, encoding='utf-8')
          print('IA staged diagnostics v2 injected')
          '@ | python -

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        shell: pwsh
        run: python -m pip install --disable-pip-version-check aqtinstall pefile

      - name: Install Qt x64
        shell: pwsh
        run: python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtcharts -O C:\Qt

      - name: Configure x64
        shell: pwsh
        run: |
          cmake -S . -B build-ia-stage-v2 -A x64 `
            -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/msvc2019_64" `
            -DMEMS_USE_BUNDLED_LIBROSCO_X64=ON `
            -DMEMS_RUN_REFERENCE_SELFTEST_POST_BUILD=OFF

      - name: Build x64
        shell: pwsh
        run: cmake --build build-ia-stage-v2 --config Release --target ecu_mems_manager

      - name: Assemble package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = '${{ github.workspace }}\build-ia-stage-v2'
          $dist = '${{ github.workspace }}\dist-ia-stage-v2'
          if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
          New-Item -ItemType Directory $dist | Out-Null
          Copy-Item (Join-Path $build 'Release\ecu_mems_manager.exe') $dist
          Copy-Item (Join-Path $build 'librosco-x64\Release\mems_manager_x64.dll') $dist
          & 'C:\Qt\5.15.2\msvc2019_64\bin\windeployqt.exe' --release --compiler-runtime --no-translations --dir $dist (Join-Path $dist 'ecu_mems_manager.exe')
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed' }
          Copy-Item (Join-Path $build 'Release\translations') (Join-Path $dist 'translations') -Recurse -Force
          Copy-Item (Join-Path $build 'Release\database') (Join-Path $dist 'database') -Recurse -Force
          if (-not (Test-Path (Join-Path $dist 'sqldrivers\qsqlite.dll'))) {
            New-Item -ItemType Directory -Force (Join-Path $dist 'sqldrivers') | Out-Null
            Copy-Item 'C:\Qt\5.15.2\msvc2019_64\plugins\sqldrivers\qsqlite.dll' (Join-Path $dist 'sqldrivers\qsqlite.dll') -Force
          }
          if (Test-Path (Join-Path $dist 'ai')) { Remove-Item (Join-Path $dist 'ai') -Recurse -Force }

          $tests = @{
            'TEST_1_UI_ONLY.bat'='ui_only'
            'TEST_2_LOCAL_AI_ONLY.bat'='local_only'
            'TEST_3_KNOWLEDGE_ONLY.bat'='knowledge_only'
            'TEST_4_ORIGINAL_BOTH.bat'=''
          }
          foreach ($name in $tests.Keys) {
            @(
              '@echo off',
              'cd /d "%~dp0"',
              'del IA_DIAG_TRACE.txt 2>nul',
              ('set MEMS_IA_DIAG_MODE=' + $tests[$name]),
              'start "" ecu_mems_manager.exe'
            ) | Set-Content -Encoding ASCII (Join-Path $dist $name)
          }
          @(
            'Run TEST_1 then open IA MEMS and wait 15 seconds.',
            'If stable close the app and run TEST_2, then TEST_3, then TEST_4.',
            'After any crash, send IA_DIAG_TRACE.txt.',
            'No llama/model is included: missing local AI runtime is normal.'
          ) | Set-Content -Encoding UTF8 (Join-Path $dist 'README_IA_STAGE_V2.txt')

      - name: Validate package
        shell: pwsh
        run: |
          $dist='${{ github.workspace }}\dist-ia-stage-v2'
          foreach ($f in @('ecu_mems_manager.exe','mems_manager_x64.dll','TEST_1_UI_ONLY.bat','TEST_2_LOCAL_AI_ONLY.bat','TEST_3_KNOWLEDGE_ONLY.bat','TEST_4_ORIGINAL_BOTH.bat','database\reference\manifest.json','sqldrivers\qsqlite.dll')) {
            if (-not (Test-Path (Join-Path $dist $f))) { throw "missing $f" }
          }

      - name: Upload diagnostic package
        uses: actions/upload-artifact@v4
        with:
          name: ECU-MEMS-Manager-x64-IA-STAGE-DIAG-V2
          path: dist-ia-stage-v2/
          if-no-files-found: error
          compression-level: 0

      - name: Persist success marker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git checkout -- iamemstab.cpp
          @(
            'MEMSX64 IA STAGE DIAG V2: SUCCESS',
            'artifact=ECU-MEMS-Manager-x64-IA-STAGE-DIAG-V2',
            'run_id=${{ github.run_id }}',
            'run_number=${{ github.run_number }}',
            'workflow_sha=${{ github.sha }}',
            ('utc=' + [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))
          ) | Set-Content -Encoding UTF8 IA_STAGE_DIAG_V2_RESULT.txt
          git pull --rebase origin MEMSX64
          git rm -f IA_STAGE_DIAG_V2_STARTED.txt
          git add IA_STAGE_DIAG_V2_RESULT.txt
          git commit -m "Record IA stage diagnostic v2 success [skip ci]"
          git push origin HEAD:MEMSX64

      - name: Persist failure marker
        if: failure()
        shell: pwsh
        run: |
          git checkout -- iamemstab.cpp 2>$null
          @(
            'MEMSX64 IA STAGE DIAG V2: FAILED',
            'run_id=${{ github.run_id }}',
            'run_number=${{ github.run_number }}',
            'workflow_sha=${{ github.sha }}',
            ('utc=' + [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))
          ) | Set-Content -Encoding UTF8 IA_STAGE_DIAG_V2_FAILURE.txt
          git pull --rebase origin MEMSX64
          git add IA_STAGE_DIAG_V2_FAILURE.txt
          if (Test-Path IA_STAGE_DIAG_V2_STARTED.txt) { git rm -f IA_STAGE_DIAG_V2_STARTED.txt }
          git commit -m "Record IA stage diagnostic v2 failure [skip ci]"
          git push origin HEAD:MEMSX64
