name: "Samsung - Archiver ECU MEMS (conserver le dernier lot GitHub)"
on:
  push:
    branches: [ops-archive-ecu-artifacts-samsung-20261107]
    paths: ['.github/workflows/samsung-archive-ecu-artifacts.yml']

permissions:
  actions: read
  contents: read

concurrency:
  group: samsung-ecu-archive-sans-suppression
  cancel-in-progress: false

jobs:
  archive:
    name: "Archivage des anciens artefacts ECU sans compilation ni suppression"
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 720
    steps:
      - name: "Inventaire, archivage avec reprise et verification"
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'KALONEO-RUNNERS') { throw 'Refus: runner non Samsung.' }
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw 'Jeton GitHub de lecture indisponible.' }
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $repo = 'mini56/ECU-Mems-Manager-Session'
          $archiveRoot = 'C:\RUNNER_ARCHIVES\ARTIFACTS'
          $root = Join-Path $archiveRoot 'ECU-Mems-Manager-Session'
          $limit = [int64](20GB)
          $headers = @{
            Authorization = 'Bearer ' + $env:GH_TOKEN
            Accept = 'application/vnd.github+json'
            'User-Agent' = 'Samsung-ECU-Archiver'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          Write-Host 'PHASE=INVENTAIRE_GITHUB'
          $all = @()
          for ($page=1; $page -le 300; $page++) {
            $url = "https://api.github.com/repos/$repo/actions/artifacts?per_page=100&page=$page"
            $response = Invoke-RestMethod -Uri $url -Headers $headers -Method Get
            $batch = @($response.artifacts)
            foreach ($a in $batch) {
              if (-not $a.expired) { $all += ,$a }
            }
            if ($batch.Count -lt 100) { break }
            if ($page -eq 300) { throw 'Pagination limite atteinte, inventaire incomplet.' }
          }
          Write-Host ("ARTEFACTS_NON_EXPIRES={0}" -f $all.Count)
          if ($all.Count -lt 1) { Write-Host 'AUCUN_ARTEFACT_A_ARCHIVER'; exit 0 }
          # Conserver sur GitHub tous les artefacts du dernier run ayant produit un artefact.
          $newest = @($all | Sort-Object -Property @{Expression='created_at';Descending=$true}, @{Expression='id';Descending=$true})[0]
          $latestRun = [int64]$newest.workflow_run.id
          $keep = @($all | Where-Object { [int64]$_.workflow_run.id -eq $latestRun })
          $todo = @($all | Where-Object { [int64]$_.workflow_run.id -ne $latestRun } | Sort-Object -Property created_at, id)
          Write-Host ("DERNIER_LOT_CONSERVE_GITHUB run={0} artefacts={1} derniere_creation={2}" -f $latestRun,$keep.Count,$newest.created_at)
          foreach ($k in $keep) { Write-Host ("GARDE_SUR_GITHUB id={0} nom={1}" -f $k.id,$k.name) }
          $incoming = [int64]0
          if (-not (Test-Path -LiteralPath $root)) { New-Item -Path $root -ItemType Directory -Force | Out-Null }
          foreach ($a in $todo) {
            $dest = Join-Path $root ("ECU_MEMS_artifact-{0}.zip" -f $a.id)
            if (-not (Test-Path -LiteralPath $dest -PathType Leaf)) { $incoming += [int64]$a.size_in_bytes }
          }
          $existing = [int64]0
          Get-ChildItem -LiteralPath $archiveRoot -Recurse -File -ErrorAction Stop | ForEach-Object { $existing += [int64]$_.Length }
          $disk = Get-CimInstance Win32_LogicalDisk -Filter 'DeviceID="C:"'
          Write-Host ("ESPACE_CONTROLE archive_existant={0} attente={1} plafond={2} libre={3}" -f $existing,$incoming,$limit,$disk.FreeSpace)
          if (($existing + $incoming) -gt $limit) { throw 'Plafond global de 20 Gio depasse. Aucune suppression.' }
          if (-not $disk -or [int64]$disk.FreeSpace -lt ($incoming + 1GB)) { throw 'Espace disque insuffisant.' }
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $curl = Get-Command curl.exe -ErrorAction SilentlyContinue
          if (-not $curl) { throw 'curl.exe indisponible: sauvegarde abandonnee.' }
          Write-Host ("ARCHIVES_A_ENREGISTRER={0} octets={1}" -f $todo.Count,$incoming)
          $entries = @()
          $ok = 0
          foreach ($a in $todo) {
            $dest = Join-Path $root ("ECU_MEMS_artifact-{0}.zip" -f $a.id)
            $temp = $dest + '.download'
            $expected = [int64]$a.size_in_bytes
            if (Test-Path -LiteralPath $dest -PathType Leaf) {
              if ([int64](Get-Item -LiteralPath $dest).Length -ne $expected) { throw ("Archive locale de mauvaise taille, ID {0}" -f $a.id) }
              Write-Host ("PRESENT_LOCAL id={0}" -f $a.id)
            } else {
              $complete = $false
              for ($try = 1; $try -le 10; $try++) {
                $n = if (Test-Path -LiteralPath $temp) { [int64](Get-Item -LiteralPath $temp).Length } else { [int64]0 }
                if ($n -gt $expected) {
                  Remove-Item -LiteralPath $temp -Force
                  $n = 0
                }
                if ($n -eq $expected) { $complete = $true; break }
                Write-Host ("TELECHARGEMENT id={0} tentative={1}/10 depart={2}/{3}" -f $a.id,$try,$n,$expected)
                & $curl.Source --location --fail --silent --show-error --connect-timeout 45 --max-time 7200 --continue-at - --output $temp --header ("Authorization: Bearer " + $env:GH_TOKEN) --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28' ([string]$a.archive_download_url)
                $exitCode = $LASTEXITCODE
                $n = if (Test-Path -LiteralPath $temp) { [int64](Get-Item -LiteralPath $temp).Length } else { [int64]0 }
                Write-Host ("TENTATIVE_TERMINEE id={0} code={1} octets={2}/{3}" -f $a.id,$exitCode,$n,$expected)
                if ($exitCode -eq 0 -and $n -eq $expected) { $complete = $true; break }
                if ($exitCode -eq 33 -or $exitCode -eq 36) {
                  Write-Host ("SERVEUR_SANS_REPRISE id={0}" -f $a.id)
                  if (Test-Path -LiteralPath $temp) { Remove-Item -LiteralPath $temp -Force }
                }
                if ($try -lt 10) { Start-Sleep -Seconds 10 }
              }
              if (-not $complete) { throw ("Telechargement incomplet pour artefact ID {0}" -f $a.id) }
              if ([int64](Get-Item -LiteralPath $temp).Length -ne $expected) { throw 'Taille telechargee incorrecte.' }
            }
            $verify = if (Test-Path -LiteralPath $dest) { $dest } else { $temp }
            $hash = (Get-FileHash -LiteralPath $verify -Algorithm SHA256).Hash.ToLowerInvariant()
            $digest = [string]$a.digest
            if ($digest -match '^sha256:([0-9a-fA-F]{64})$') {
              if ($hash -ne $Matches[1].ToLowerInvariant()) { throw ("Empreinte SHA256 incorrecte ID {0}" -f $a.id) }
            }
            $z = [System.IO.Compression.ZipFile]::OpenRead($verify)
            try { if ($z.Entries.Count -eq 0) { throw ("ZIP vide ID {0}" -f $a.id) } }
            finally { $z.Dispose() }
            if ($verify -eq $temp) { Move-Item -LiteralPath $temp -Destination $dest -ErrorAction Stop }
            $metadataPath = $dest + '.json'
            [pscustomobject]@{
              repository=$repo; id=[int64]$a.id; name=[string]$a.name
              run_id=[int64]$a.workflow_run.id; bytes=$expected
              created_at=[string]$a.created_at; sha256=$hash
              verified_at=(Get-Date).ToUniversalTime().ToString('o')
            } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $metadataPath -Encoding UTF8
            $ok++
            Write-Host ("ARCHIVE_OK {0}/{1} id={2} bytes={3} sha256={4}" -f $ok,$todo.Count,$a.id,$expected,$hash)
          }
          Write-Host ("ARCHIVAGE_TERMINE={0} DERNIER_LOT_GARDE={1}" -f $ok,$keep.Count)
          Write-Host 'SUPPRESSION_GITHUB=AUCUNE'
          Write-Host ("DOSSIER={0}" -f $root)
