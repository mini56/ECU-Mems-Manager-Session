name: REPORT AKM6348 1770 QZ64 CORRECTION
on:
  push:
    branches: [RAPPORT]
    paths:
      - '.github/workflows/report-akm6348-1770-qz64-correction.yml'
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Correct qz64 pre-push fingerprint
        shell: bash
        run: |
          git pull --rebase origin RAPPORT
          printf '\n### CORRECTION AVANT POUSSE - CONTRAT QZ64 1770\n\n' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          printf '%s\n' '- Verification du generateur projet tools/build_rcl0193_visual_backfill_1760.py: un fichier qz64 final est Base64(4 octets longueur big-endian + zlib SQL) suivi d un saut de ligne.' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          printf '%s\n' '- Le hash d5179a... consigne juste avant correspondait au flux binaire interne de 1177 octets et ne doit PAS etre utilise comme hash du fichier qz64 final.' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          printf '%s\n' '- Empreinte correcte du fichier research_enrichment_1770.qz64 final: 1573 octets, SHA-256 a7411aba56d61627f482297ede3913f2123ca5c832aecdb702aa1b505a10d531.' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          printf '%s\n' '- SQL decompresse inchange: 2907 octets, SHA-256 7b9880ec1c9a18b0ad0c01cf8aab7ed4a243b06ae40e6583d3753294f71cd1e5.' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          printf '%s\n' '- Validation SQLite reste PASS. Aucune donnee technique AKM6348 non verifiee n est ajoutee; le lot enregistre uniquement source/portee/aliases documentaires.' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git rm .github/workflows/report-akm6348-1770-qz64-correction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git commit -m 'Correct AKM6348 1770 qz64 fingerprint'
          git push origin RAPPORT
