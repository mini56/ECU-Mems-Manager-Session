name: MEMS 1.6 NA et 1.9 - recherche depuis les sorties lot 16
on:
  push:
    branches: [research/mems-firmwares-20261126]
    paths: ['.github/workflows/research-physical-first-lot16.yml','research/instruments-integral-20261127/audit_physical_first_lot16.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Analyser exclusivement les 342 ASM 1.6 NA et 1.9
        run: python3 research/instruments-integral-20261127/audit_physical_first_lot16.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preuves-sorties-physiques-lot16
          path: research/instruments-integral-20261127/results/*sorties_physiques_lot16*
      - name: Enregistrer les résultats
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/instruments-integral-20261127/results/*sorties_physiques_lot16* || true
          if ! git diff --cached --quiet; then
            git commit -m "Recherche instruments : résultats lot 16 sorties physiques [skip ci]"
            git pull --rebase origin research/mems-firmwares-20261126
            git push origin HEAD:research/mems-firmwares-20261126
          fi
