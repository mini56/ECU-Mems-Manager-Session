name: REPORT RCL0193ENG P147-160 POSTPUSH

on:
  push:
    branches:
      - RAPPORT
    paths:
      - '.github/workflows/report-rcl0193eng-p147-160-postpush.yml'

permissions:
  contents: write

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Append post-push checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cat .github/report-rcl0193eng-p147-160-postpush.txt >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          rm -f .github/report-rcl0193eng-p147-160-postpush.txt
          rm -f .github/workflows/report-rcl0193eng-p147-160-postpush.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md .github/report-rcl0193eng-p147-160-postpush.txt .github/workflows/report-rcl0193eng-p147-160-postpush.yml
          git commit -m 'Checkpoint RCL0193ENG pages 147-160 final'
          git push origin HEAD:RAPPORT
