name: TEMP RAVEMEMS V2 zero-defect RCL0193ENG pass 2

on:
  push:
    branches: [tmp-ravemems-v2-foundation]
    paths:
      - '.github/workflows/tmp-ravemems-v2-zero-defect-pass2.yml'

permissions:
  contents: read

jobs:
  exact-rcl0193eng-pass2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_SHA: 'dc923499669c51ef17349be16ea6460fb1a1a889'
      PROTECTED_MEMSX64: '1d6316bd1746d6f2b4cfb751cab88d18e27ef730'
      SOURCE_MAIN_COMMIT: '643de091b474f4e27917a065bdf46d5a0c764276'
      RCL0193ENG_BLOB: '82263eb36bb194dfa969d0471d10ef11078ce521'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 0

      - name: Guard exact scope and production
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TEST_SHA"
          test "$(git ls-remote origin refs/heads/MEMSX64 | awk '{print $1}')" = "$PROTECTED_MEMSX64"
          test -f .github/pass2/rcl0193eng_zero_defect_pass2.py
          test -f ravemems/v2/prototype_extract.py
          test -f ravemems/v2/schema.sql
          echo "PASS2_TEST_SHA_PASS $TEST_SHA"
          echo "PROTECTED_BUILD103_PASS $PROTECTED_MEMSX64"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python foundation and pass 2 wrapper
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=ravemems/v2 python -m py_compile \
            ravemems/v2/audit.py \
            ravemems/v2/schema_selftest.py \
            ravemems/v2/reading_order.py \
            ravemems/v2/prototype_extract.py \
            .github/pass2/rcl0193eng_zero_defect_pass2.py
          python ravemems/v2/schema_selftest.py | tee "$RUNNER_TEMP/schema-selftest.log"
          grep -q '^RAVEMEMS_V2_SCHEMA_SELFTEST_PASS$' "$RUNNER_TEMP/schema-selftest.log"
          grep -q '^MULTIPHASE_STEP_NUMBERING_PASS$' "$RUNNER_TEMP/schema-selftest.log"
          grep -q '^POST_EXTRACTION_AUDIT_PASS$' "$RUNNER_TEMP/schema-selftest.log"

      - name: Install pinned PDF renderer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.4'

      - name: Fetch exact RCL0193ENG source only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_MAIN_COMMIT"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_MAIN_COMMIT"
          source_blob="$(git rev-parse "$SOURCE_MAIN_COMMIT:rave/xn/wmxn990e.pdf")"
          test "$source_blob" = "$RCL0193ENG_BLOB"
          mkdir -p "$RUNNER_TEMP/ravemems-source"
          git show "$SOURCE_MAIN_COMMIT:rave/xn/wmxn990e.pdf" > "$RUNNER_TEMP/ravemems-source/wmxn990e.pdf"
          test -s "$RUNNER_TEMP/ravemems-source/wmxn990e.pdf"
          echo "RCL0193ENG_SOURCE_PIN_PASS $source_blob"

      - name: Extract RCL0193ENG pass 2
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rcl0193eng-pass2"
          rm -rf "$out"
          PYTHONPATH=ravemems/v2 python .github/pass2/rcl0193eng_zero_defect_pass2.py \
            --pdf "$RUNNER_TEMP/ravemems-source/wmxn990e.pdf" \
            --schema ravemems/v2/schema.sql \
            --profile ravemems/v2/profiles/rcl0193eng.json \
            --out "$out" \
            --source-relative-path 'rave/xn/wmxn990e.pdf' \
            --source-commit "$SOURCE_MAIN_COMMIT" \
            --source-blob-sha "$RCL0193ENG_BLOB" \
            | tee "$RUNNER_TEMP/rcl0193eng-pass2.log"
          test -s "$out/manifest.json"
          test -s "$out/audit.json"
          test -s "$out/step_sequence_diagnostics.json"
          test -s "$out/pages_131_136_semantic.json"
          test -s "$out/debug_pages_131_136.txt"
          test -s "$out/ravemems_v2_rcl0193eng.sqlite"

      - name: Validate zero sequence and zero text-boundary contamination
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rcl0193eng-pass2"
          python - "$out" <<'PY'
          import collections, hashlib, json, re, sqlite3, sys
          from pathlib import Path
          out = Path(sys.argv[1])
          m = json.loads((out / 'manifest.json').read_text(encoding='utf-8'))
          audit = json.loads((out / 'audit.json').read_text(encoding='utf-8'))
          assert m['prototype'] == 'RCL0193ENG'
          assert m['page_count'] == 372
          assert m['source_commit'] == '643de091b474f4e27917a065bdf46d5a0c764276'
          assert m['source_blob_sha'] == '82263eb36bb194dfa969d0471d10ef11078ce521'
          assert m['sqlite_integrity'] == 'ok'
          assert m['foreign_key_issue_count'] == 0
          db_path = out / 'ravemems_v2_rcl0193eng.sqlite'
          print('PASS2_SQLITE_SHA256', hashlib.sha256(db_path.read_bytes()).hexdigest())
          db = sqlite3.connect(db_path)
          assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          assert db.execute('PRAGMA foreign_key_check').fetchall() == []
          assert db.execute("SELECT COUNT(*) FROM ravemems_step WHERE manufacturer_step_no='0'").fetchone()[0] == 0

          def nums(op_no, phase_kind):
              return [int(r[0]) for r in db.execute(
                  "SELECT s.manufacturer_step_no FROM ravemems_step s JOIN ravemems_phase p ON p.phase_key=s.phase_key JOIN ravemems_operation o ON o.operation_key=p.operation_key WHERE o.manufacturer_operation_no=? AND p.normalized_phase_kind=? ORDER BY p.sequence_no,s.sequence_no",
                  (op_no, phase_kind),
              ) if r[0] and str(r[0]).isdigit()]

          expected = {
              ('12.29.02','remove'): list(range(1,37)),
              ('12.60.38','remove'): list(range(1,35)),
              ('30.15.15','remove'): list(range(1,30)),
              ('57.25.01','remove'): list(range(1,27)),
              ('57.50.01','remove'): list(range(1,22)),
              ('86.65.64','remove'): list(range(1,12)),
          }
          for key, wanted in expected.items():
              got = nums(*key)
              assert got == wanted, (key, got, wanted)
              print('PASS2_SEQUENCE_OK', key[0], key[1], got[0], got[-1], len(got))

          op75 = [int(r[0]) for r in db.execute(
              "SELECT s.manufacturer_step_no FROM ravemems_step s JOIN ravemems_phase p ON p.phase_key=s.phase_key JOIN ravemems_operation o ON o.operation_key=p.operation_key WHERE o.manufacturer_operation_no='33.25.03' ORDER BY p.sequence_no,s.sequence_no"
          ) if r[0] and str(r[0]).isdigit()]
          assert op75 == list(range(1,14)), op75
          print('PASS2_IMPLICIT_PHASE_OK 33.25.03', op75)

          leaked = db.execute(
              "SELECT COUNT(*) FROM ravemems_step s JOIN ravemems_phase p ON p.phase_key=s.phase_key JOIN ravemems_operation o ON o.operation_key=p.operation_key WHERE o.manufacturer_operation_no='12.65.28' AND s.source_page_start>=99"
          ).fetchone()[0]
          assert leaked == 0, leaked
          print('PASS2_STALE_CONTINUATION_OK 12.65.28')

          blocking_seq = db.execute(
              "SELECT COUNT(*) FROM ravemems_review_flag WHERE reason_code='manufacturer_step_sequence_incomplete' AND status='open'"
          ).fetchone()[0]
          assert m['numeric_phase_defect_count'] == 0, m['numeric_phase_defect_count']
          assert blocking_seq == 0, blocking_seq

          step_rows = db.execute(
              "SELECT s.step_key,s.instruction_source,o.manufacturer_operation_no "
              "FROM ravemems_step s JOIN ravemems_phase p ON p.phase_key=s.phase_key "
              "JOIN ravemems_operation o ON o.operation_key=p.operation_key"
          ).fetchall()
          trailing_folios = [r for r in step_rows if re.search(r'\s\d{1,3}$', (r[1] or '').strip())]
          print('PASS2_TRAILING_FOLIO_TEXT_COUNT', len(trailing_folios))
          if trailing_folios:
              print('PASS2_TRAILING_FOLIO_EXAMPLES', trailing_folios[:12])
          assert trailing_folios == [], trailing_folios[:12]

          operations = db.execute(
              "SELECT operation_key,manufacturer_operation_no,title_source FROM ravemems_operation WHERE length(title_source)>=5"
          ).fetchall()
          title_tails = []
          for step_key, instruction, own_code in step_rows:
              text = (instruction or '').strip()
              for _op_key, other_code, title in operations:
                  if other_code == own_code or not title:
                      continue
                  if text.endswith(title):
                      title_tails.append((step_key, own_code, other_code, title, text))
                      break
          print('PASS2_NEXT_OPERATION_TITLE_TAIL_COUNT', len(title_tails))
          if title_tails:
              print('PASS2_NEXT_OPERATION_TITLE_TAIL_EXAMPLES', title_tails[:12])
          assert title_tails == [], title_tails[:12]

          codes = collections.Counter(issue['code'] for issue in audit['issues'])
          print('PASS2_AUDIT_CODES', dict(codes))
          assert set(codes) <= {'visual_fidelity_not_verified', 'visual_link_not_verified'}, codes
          assert codes['visual_fidelity_not_verified'] == m['counts']['ravemems_visual']
          assert codes['visual_link_not_verified'] == m['counts']['ravemems_visual_link']

          print('PASS2_NUMERIC_PHASE_DEFECTS', m['numeric_phase_defect_count'])
          print('PASS2_OPEN_SEQUENCE_FLAGS', blocking_seq)
          print('PASS2_OPERATION_COUNT', m['counts']['ravemems_operation'])
          print('PASS2_PHASE_COUNT', m['counts']['ravemems_phase'])
          print('PASS2_STEP_COUNT', m['counts']['ravemems_step'])
          print('PASS2_AUDIT_ISSUE_COUNT', m['audit_issue_count'])
          db.close()
          print('RAVEMEMS_V2_RCL0193ENG_ZERO_TEXT_BOUNDARY_DEFECT_PASS')
          PY
          grep -q '^PASS2_BOUNDARY_FOLIOS_IGNORED ' "$RUNNER_TEMP/rcl0193eng-pass2.log"
          grep -q '^PASS2_BOUNDARY_TITLES_FLUSHED ' "$RUNNER_TEMP/rcl0193eng-pass2.log"
          test "$(git ls-remote origin refs/heads/MEMSX64 | awk '{print $1}')" = "$PROTECTED_MEMSX64"

      - name: Upload RCL0193ENG pass 2 audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RAVEMEMS-V2-RCL0193ENG-ZERO-DEFECT-PASS2-BOUNDARY
          path: ${{ runner.temp }}/rcl0193eng-pass2
          if-no-files-found: warn
          retention-days: 14
