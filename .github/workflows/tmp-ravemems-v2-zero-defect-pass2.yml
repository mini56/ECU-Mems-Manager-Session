name: TEMP RAVEMEMS V2 zero-defect RCL0193ENG pass 2

on:
  push:
    branches: [tmp-ravemems-v2-foundation]
    paths:
      - '.github/workflows/tmp-ravemems-v2-zero-defect-pass2.yml'

permissions:
  contents: read

jobs:
  exact-rcl0193eng-pass2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_SHA: 'fdec4ae8f0cb3515ee67f982ddec9b6bb934ec97'
      PROTECTED_MEMSX64: '1d6316bd1746d6f2b4cfb751cab88d18e27ef730'
      SOURCE_MAIN_COMMIT: '643de091b474f4e27917a065bdf46d5a0c764276'
      RCL0193ENG_BLOB: '82263eb36bb194dfa969d0471d10ef11078ce521'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 0

      - name: Guard exact scope and production
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TEST_SHA"
          test "$(git ls-remote origin refs/heads/MEMSX64 | awk '{print $1}')" = "$PROTECTED_MEMSX64"
          test -f .github/pass2/rcl0193eng_zero_defect_pass2.py
          test -f .github/pass2/rcl0193eng_precise_visual_extract.py
          test -f .github/pass2/rcl0193eng_visual_validate.py
          test -f ravemems/v2/prototype_extract.py
          test -f ravemems/v2/schema.sql
          echo "PASS2_TEST_SHA_PASS $TEST_SHA"
          echo "PROTECTED_BUILD103_PASS $PROTECTED_MEMSX64"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python foundation and validators
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=ravemems/v2 python -m py_compile \
            ravemems/v2/audit.py \
            ravemems/v2/schema_selftest.py \
            ravemems/v2/reading_order.py \
            ravemems/v2/prototype_extract.py \
            .github/pass2/rcl0193eng_zero_defect_pass2.py \
            .github/pass2/rcl0193eng_precise_visual_extract.py \
            .github/pass2/rcl0193eng_visual_validate.py
          python ravemems/v2/schema_selftest.py | tee "$RUNNER_TEMP/schema-selftest.log"
          grep -q '^RAVEMEMS_V2_SCHEMA_SELFTEST_PASS$' "$RUNNER_TEMP/schema-selftest.log"
          grep -q '^MULTIPHASE_STEP_NUMBERING_PASS$' "$RUNNER_TEMP/schema-selftest.log"
          grep -q '^POST_EXTRACTION_AUDIT_PASS$' "$RUNNER_TEMP/schema-selftest.log"

      - name: Install pinned PDF renderer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.4'

      - name: Fetch exact RCL0193ENG source only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_MAIN_COMMIT"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_MAIN_COMMIT"
          source_blob="$(git rev-parse "$SOURCE_MAIN_COMMIT:rave/xn/wmxn990e.pdf")"
          test "$source_blob" = "$RCL0193ENG_BLOB"
          mkdir -p "$RUNNER_TEMP/ravemems-source"
          git show "$SOURCE_MAIN_COMMIT:rave/xn/wmxn990e.pdf" > "$RUNNER_TEMP/ravemems-source/wmxn990e.pdf"
          test -s "$RUNNER_TEMP/ravemems-source/wmxn990e.pdf"
          echo "RCL0193ENG_SOURCE_PIN_PASS $source_blob"

      - name: Extract RCL0193ENG with exact visual geometry
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rcl0193eng-pass2"
          rm -rf "$out"
          PYTHONPATH=ravemems/v2 python .github/pass2/rcl0193eng_precise_visual_extract.py \
            --pdf "$RUNNER_TEMP/ravemems-source/wmxn990e.pdf" \
            --schema ravemems/v2/schema.sql \
            --profile ravemems/v2/profiles/rcl0193eng.json \
            --out "$out" \
            --source-relative-path 'rave/xn/wmxn990e.pdf' \
            --source-commit "$SOURCE_MAIN_COMMIT" \
            --source-blob-sha "$RCL0193ENG_BLOB" \
            | tee "$RUNNER_TEMP/rcl0193eng-pass2.log"
          test -s "$out/manifest.json"
          test -s "$out/audit.json"
          test -s "$out/step_sequence_diagnostics.json"
          test -s "$out/pages_131_136_semantic.json"
          test -s "$out/debug_pages_131_136.txt"
          test -s "$out/ravemems_v2_rcl0193eng.sqlite"

      - name: Validate zero semantic and text defects before visual validation
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rcl0193eng-pass2"
          python - "$out" <<'PY'
          import collections, json, re, sqlite3, sys
          from pathlib import Path
          out = Path(sys.argv[1])
          m = json.loads((out / 'manifest.json').read_text(encoding='utf-8'))
          audit = json.loads((out / 'audit.json').read_text(encoding='utf-8'))
          diagnostics = json.loads((out / 'step_sequence_diagnostics.json').read_text(encoding='utf-8'))
          assert m['prototype'] == 'RCL0193ENG'
          assert m['page_count'] == 372
          assert m['source_commit'] == '643de091b474f4e27917a065bdf46d5a0c764276'
          assert m['source_blob_sha'] == '82263eb36bb194dfa969d0471d10ef11078ce521'
          assert m['numeric_phase_defect_count'] == 0
          assert diagnostics == []
          assert m['counts']['ravemems_operation'] == 201
          assert m['counts']['ravemems_phase'] == 397
          assert m['counts']['ravemems_step'] == 3104
          assert m['counts']['ravemems_visual'] == 738
          assert m['counts']['ravemems_visual_link'] == 401
          assert m['counts']['ravemems_review_flag'] == 0
          db = sqlite3.connect(out / 'ravemems_v2_rcl0193eng.sqlite')
          assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          assert db.execute('PRAGMA foreign_key_check').fetchall() == []
          assert db.execute("SELECT COUNT(*) FROM ravemems_review_flag WHERE status='open'").fetchone()[0] == 0
          assert db.execute("SELECT COUNT(*) FROM ravemems_step WHERE manufacturer_step_no='0'").fetchone()[0] == 0

          step_rows = db.execute(
              "SELECT s.step_key,s.instruction_source,o.manufacturer_operation_no "
              "FROM ravemems_step s JOIN ravemems_phase p ON p.phase_key=s.phase_key "
              "JOIN ravemems_operation o ON o.operation_key=p.operation_key"
          ).fetchall()
          trailing_folios = [r for r in step_rows if re.search(r'\s\d{1,3}$', (r[1] or '').strip())]
          incomplete_crossrefs = [r for r in step_rows if re.search(r'\bSee$', (r[1] or '').strip(), re.I) or (r[1] or '').strip().endswith(',')]
          operations = db.execute(
              "SELECT manufacturer_operation_no,title_source FROM ravemems_operation WHERE length(title_source)>=5"
          ).fetchall()
          title_tails = []
          for step_key, instruction, own_code in step_rows:
              text = (instruction or '').strip()
              for other_code, title in operations:
                  if other_code != own_code and title and text.endswith(title):
                      title_tails.append((step_key, own_code, other_code, title, text))
                      break
          assert trailing_folios == [], trailing_folios[:12]
          assert incomplete_crossrefs == [], incomplete_crossrefs[:12]
          assert title_tails == [], title_tails[:12]

          codes = collections.Counter(issue['code'] for issue in audit['issues'])
          assert codes == {'visual_fidelity_not_verified': 738, 'visual_link_not_verified': 401}, codes
          print('PRE_VISUAL_NUMERIC_PHASE_DEFECTS 0')
          print('PRE_VISUAL_TRAILING_FOLIOS 0')
          print('PRE_VISUAL_INCOMPLETE_CROSSREFS 0')
          print('PRE_VISUAL_TITLE_TAILS 0')
          print('PRE_VISUAL_AUDIT_ISSUES', audit['issue_count'])
          db.close()
          print('RAVEMEMS_V2_RCL0193ENG_PRE_VISUAL_ZERO_SEMANTIC_DEFECT_PASS')
          PY
          test "$(git ls-remote origin refs/heads/MEMSX64 | awk '{print $1}')" = "$PROTECTED_MEMSX64"

      - name: Validate all RCL0193ENG visuals with independent evidence
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rcl0193eng-pass2"
          PYTHONPATH=ravemems/v2 python .github/pass2/rcl0193eng_visual_validate.py \
            --pdf "$RUNNER_TEMP/ravemems-source/wmxn990e.pdf" \
            --out "$out" \
            | tee "$RUNNER_TEMP/rcl0193eng-visual-validation.log"
          test -s "$out/visual_validation.json"
          grep -q '^RAVEMEMS_V2_RCL0193ENG_VISUAL_VALIDATION_PASS$' "$RUNNER_TEMP/rcl0193eng-visual-validation.log"

      - name: Require global zero audit after visual validation
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rcl0193eng-pass2"
          python - "$out" <<'PY'
          import hashlib, json, sqlite3, sys
          from pathlib import Path
          out = Path(sys.argv[1])
          m = json.loads((out / 'manifest.json').read_text(encoding='utf-8'))
          audit = json.loads((out / 'audit.json').read_text(encoding='utf-8'))
          vv = json.loads((out / 'visual_validation.json').read_text(encoding='utf-8'))
          db_path = out / 'ravemems_v2_rcl0193eng.sqlite'
          db = sqlite3.connect(db_path)
          assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          assert db.execute('PRAGMA foreign_key_check').fetchall() == []
          assert db.execute("SELECT COUNT(*) FROM ravemems_visual WHERE fidelity_status='verified'").fetchone()[0] == 738
          assert db.execute("SELECT COUNT(*) FROM ravemems_visual WHERE fidelity_status<>'verified'").fetchone()[0] == 0
          assert db.execute("SELECT COUNT(*) FROM ravemems_visual_link WHERE verification_status='verified'").fetchone()[0] == 401
          assert db.execute("SELECT COUNT(*) FROM ravemems_visual_link WHERE verification_status<>'verified'").fetchone()[0] == 0
          assert vv['visual_fidelity_verified_count'] == 738
          assert vv['visual_fidelity_failed_count'] == 0
          assert vv['visual_link_verified_count'] == 401
          assert vv['visual_link_failed_count'] == 0
          assert vv['sqlite_integrity'] == 'ok'
          assert vv['foreign_key_issue_count'] == 0
          assert vv['audit_issue_count_after_validation'] == 0
          assert audit['issue_count'] == 0 and audit['issues'] == []
          assert m['audit_issue_count'] == 0
          assert m['numeric_phase_defect_count'] == 0
          assert m['counts']['ravemems_review_flag'] == 0
          print('FINAL_VISUAL_FIDELITY_VERIFIED 738')
          print('FINAL_VISUAL_LINKS_VERIFIED 401')
          print('FINAL_AUDIT_ISSUES 0')
          print('FINAL_SQLITE_SHA256', hashlib.sha256(db_path.read_bytes()).hexdigest())
          db.close()
          print('RAVEMEMS_V2_RCL0193ENG_GLOBAL_ZERO_AUDIT_PASS')
          PY
          test "$(git ls-remote origin refs/heads/MEMSX64 | awk '{print $1}')" = "$PROTECTED_MEMSX64"

      - name: Upload RCL0193ENG zero-defect validated artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RAVEMEMS-V2-RCL0193ENG-ZERO-DEFECT-VISUAL-PRECISION
          path: ${{ runner.temp }}/rcl0193eng-pass2
          if-no-files-found: warn
          retention-days: 14
