name: TEMP journal RAVEMEMS before-after database audit

on:
  push:
    branches: ["RAPPORT"]
    paths: [".github/workflows/tmp-ravemems-journal-before-after-audit.yml"]

permissions:
  contents: write

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 1
      - name: Append audit plan and self-clean
        shell: bash
        run: |
          python3 -c "import base64,pathlib; p=pathlib.Path('RAPPORT_SUIVI_ECU_MEMS_MANAGER.md'); p.write_bytes(p.read_bytes()+base64.b64decode(' ...'))"
          rm .github/workflows/tmp-ravemems-journal-before-after-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md .github/workflows/tmp-ravemems-journal-before-after-audit.yml
          git commit -m "Record RAVEMEMS before-after database audit plan"
          git push origin HEAD:RAPPORT
