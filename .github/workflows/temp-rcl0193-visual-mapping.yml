name: TEMP RCL0193 VISUAL MAPPING

on:
  push:
    branches: [tmp-rave-visual-backfill]
    paths:
      - .github/workflows/temp-rcl0193-visual-mapping.yml

permissions:
  contents: write

jobs:
  map:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-rave-visual-backfill
          fetch-depth: 0

      - name: Install PDF tooling
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.4

      - name: Build exact RCL0193 fact-to-page mapping
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, importlib.util, pathlib, re, sqlite3, struct, urllib.request, zlib
          import fitz

          ROOT = pathlib.Path('.').resolve()
          REF = ROOT / 'database' / 'reference'
          OUT = REF / 'audits' / 'rcl0193_visual_mapping_audit.md'
          PDF = pathlib.Path('/tmp/RCL0193ENG.pdf')
          PDF_URL = 'https://www.uscars.biz/uscars/mini-documents/Rave_CD_wmxn990e.pdf'
          PDF_SHA = 'c050a3eebe50c5a85bf8a69b7722bd2052079944e09d58578a498984ecf06715'
          DOCUMENT = 'Mini Workshop Manual — RCL0193ENG'
          EXPECTED_FACTS = 31

          spec = importlib.util.spec_from_file_location(
              'rcl0194_1750', ROOT / 'tools' / 'build_rcl0194_visual_backfill_1750.py')
          mod = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(mod)
          work = ROOT / '.tmp-rcl0193-map'
          work.mkdir(exist_ok=True)
          db_path = work / 'baseline.sqlite'
          mod.rebuild_reference_database(REF, db_path)

          db = sqlite3.connect(str(db_path)); db.row_factory = sqlite3.Row
          facts = db.execute(
              "SELECT fact_key,source_key,document,variant,topic,statement,source_section,"
              "verification_level,image_ref,notes FROM mems_rave_fact "
              "WHERE document=? ORDER BY fact_key", (DOCUMENT,)).fetchall()
          assert len(facts) == EXPECTED_FACTS, len(facts)
          assert all((r['image_ref'] or '') == '' for r in facts)
          db.close()

          qz = REF / 'research_enrichment_1660.qz64'
          packed = base64.b64decode(qz.read_bytes().strip())
          expected_len = struct.unpack('>I', packed[:4])[0]
          raw = zlib.decompress(packed[4:]); assert len(raw) == expected_len
          buf = ''; complete = []
          for line in raw.decode('utf-8').splitlines(True):
              buf += line
              if sqlite3.complete_statement(buf):
                  complete.append(buf.strip()); buf = ''
          if buf.strip(): raise AssertionError('Trailing incomplete SQL in 1660')
          rave_statements = [s for s in complete if 'mems_rave_fact' in s.lower() and DOCUMENT in s]
          assert len(rave_statements) == EXPECTED_FACTS, len(rave_statements)

          urllib.request.urlretrieve(PDF_URL, PDF)
          got_pdf_sha = hashlib.sha256(PDF.read_bytes()).hexdigest()
          assert got_pdf_sha == PDF_SHA, got_pdf_sha
          doc = fitz.open(str(PDF)); assert doc.page_count == 372

          def pages(text):
              vals = []
              for m in re.finditer(r'PDF\s*p\.\s*(\d+)(?:\s*[-–]\s*(\d+))?', text or '', re.I):
                  a = int(m.group(1)); b = int(m.group(2) or a)
                  if b < a or b-a > 12: raise AssertionError(m.group(0))
                  vals.extend(range(a,b+1))
              return list(dict.fromkeys(vals))

          def compact(text, limit=260):
              return ' '.join((text or '').replace('|','/').split())[:limit]

          rows=[]; unique=set(); unresolved=[]
          for r in facts:
              idxs = pages(' | '.join(str(r[k] or '') for k in ('source_section','notes')))
              if not idxs:
                  unresolved.append((r['fact_key'],r['source_section'],r['notes'])); continue
              for idx in idxs:
                  assert 0 <= idx < doc.page_count
                  unique.add(idx)
              rows.append((r,idxs))
          if unresolved:
              raise AssertionError('Facts without PDF provenance: '+repr(unresolved))

          stop={'engine','system','systems','description','operation','service','repair','data','pdf','mini','rcl0193','mems','the','and','for','with','from','type','models','model','page','fuel','management','section','input','inputs'}
          weak=[]
          for r,idxs in rows:
              st=set(re.findall(r'[a-z0-9]{4,}',(str(r['topic'])+' '+str(r['source_section'])).lower()))-stop
              pt=set()
              for idx in idxs: pt.update(re.findall(r'[a-z0-9]{4,}',doc.load_page(idx).get_text('text').lower()))
              if not (st & pt): weak.append((r['fact_key'],idxs,sorted(st)[:20]))

          OUT.parent.mkdir(parents=True,exist_ok=True)
          with OUT.open('w',encoding='utf-8',newline='\n') as f:
              f.write('# RCL0193ENG visual source mapping audit\n\nDate: 2026-08-29  \n')
              f.write('Working branch: `tmp-rave-visual-backfill`  \n')
              f.write('Production reference: `MEMSX64` BUILD #101 `22dbe75ed14e0a61e694159d505ef72245116b48`\n\n')
              f.write('## Invariants\n\n')
              f.write(f'- historical RCL0193 facts reconstructed from BUILD #101 knowledge set: **{len(facts)}**\n')
              f.write(f'- exact historical document value: `{DOCUMENT}`\n')
              f.write(f'- complete RCL0193 `mems_rave_fact` SQL statements in historical 1660: **{len(rave_statements)}**\n')
              f.write('- historical `image_ref`: **empty for all 31 facts**\n')
              f.write(f'- RCL0193 PDF: **{doc.page_count} pages**, SHA-256 `{got_pdf_sha}`\n')
              f.write('- historical `PDF p.N` is treated as zero-based PDF index N; viewer page is N+1; the actual page excerpts below are retained for verification\n')
              f.write('- no historical fact or qz64 is modified by this audit\n\n')
              f.write('## Exact 31 fact mappings\n\n| Fact key | Topic | Historical source section | PDF index(es) | Viewer page(s) |\n|---|---|---|---:|---:|\n')
              for r,idxs in rows:
                  f.write(f"| `{r['fact_key']}` | {compact(str(r['topic']),100)} | {compact(str(r['source_section']),220)} | {', '.join(map(str,idxs))} | {', '.join(str(x+1) for x in idxs)} |\n")
              f.write('\n## Unique source pages required\n\n')
              for idx in sorted(unique):
                  lines=[compact(x,180) for x in doc.load_page(idx).get_text('text').splitlines() if x.strip()]
                  f.write(f"- PDF index **{idx}** / viewer page **{idx+1}**: {' / '.join(lines[:12])[:1200]}\n")
              f.write('\n## Low lexical-overlap cases retained for explicit review\n\n')
              if weak:
                  for key,idxs,toks in weak: f.write(f'- `{key}` → indexes {idxs}; source tokens not found directly: `{toks}`\n')
              else: f.write('- none\n')
              f.write('\n## Consequence for additive visual backfill\n\n')
              f.write(f'- unique original PDF pages needed to cover all 31 facts: **{len(unique)}**\n')
              f.write('- each page will be retained once and linked to every supported fact\n')
              f.write('- composite/range provenance remains composite; no historical provenance is silently rewritten\n')
              f.write('- next step: verify the page list/content, then generate the additive visual lot with the existing `mems_rave_illustration` + `mems_rave_illustration_link` schema\n')
          print('FACTS_PASS',len(facts)); print('STATEMENTS_PASS',len(rave_statements)); print('UNIQUE_PAGES',len(unique),sorted(unique)); print('WEAK_CASES',len(weak))
          doc.close()
          PY

      - name: Guard audit scope
        shell: bash
        run: |
          test -s database/reference/audits/rcl0193_visual_mapping_audit.md
          grep -F 'historical RCL0193 facts reconstructed from BUILD #101 knowledge set: **31**' database/reference/audits/rcl0193_visual_mapping_audit.md
          grep -F 'complete RCL0193 `mems_rave_fact` SQL statements in historical 1660: **31**' database/reference/audits/rcl0193_visual_mapping_audit.md
          git diff -- database/reference/research_enrichment_1660.qz64 --exit-code
          rm -rf .tmp-rcl0193-map
          test "$(git status --porcelain --untracked-files=all)" = "?? database/reference/audits/rcl0193_visual_mapping_audit.md"

      - name: Commit mapping audit and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-rcl0193-visual-mapping.yml
          git add database/reference/audits/rcl0193_visual_mapping_audit.md
          git commit -m "Map RCL0193 facts to original PDF pages"
          git push origin tmp-rave-visual-backfill
