name: TEMP REPORT DOCUMENT PROCESSING METHOD
on:
  push:
    branches: [RAPPORT]
    paths:
      - '.github/workflows/temp-report-document-processing-method.yml'
permissions:
  contents: write
jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
      - name: Append document processing anti-loop procedure
        shell: bash
        env:
          PAYLOAD_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os, pathlib
          p = pathlib.Path('RAPPORT_SUIVI_ECU_MEMS_MANAGER.md')
          text = base64.b64decode(os.environ['PAYLOAD_B64']).decode('utf-8')
          with p.open('a', encoding='utf-8', newline='\n') as f:
              f.write(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git commit -m 'Document mandatory anti-loop document processing procedure'
          git push
