name: Recherche exclusive MEMS 1.6 NA - sorties physiques
on:
  push:
    branches: [research/mems-firmwares-20261126]
    paths: ['.github/workflows/research-16na-outputs.yml', 'research/instruments-integral-20261127/audit_16na_outputs.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyser exclusivement les 123 firmwares 1.6 NA
        run: python3 research/instruments-integral-20261127/audit_16na_outputs.py
      - uses: actions/upload-artifact@v4
        with:
          name: preuves-16na-sorties-lot02
          path: research/instruments-integral-20261127/results/*16na_sorties_lot02*
      - name: Enregistrer le registre et les preuves sur la branche de recherche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/instruments-integral-20261127/results/*16na_sorties_lot02*
          if ! git diff --cached --quiet; then
            git commit -m "MEMS 1.6 NA : registre sorties et preuves individuelles lot 02 [skip ci]"
            git push origin HEAD:research/mems-firmwares-20261126
          fi
