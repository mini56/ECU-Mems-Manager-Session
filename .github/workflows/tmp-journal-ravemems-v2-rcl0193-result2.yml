name: TEMP Journal RAVEMEMS V2 RCL0193ENG result 2

on:
  push:
    branches: [RAPPORT]
    paths:
      - '.github/workflows/tmp-journal-ravemems-v2-rcl0193-result2.yml'

permissions:
  contents: write

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0

      - name: Verify state and append result 2 verdict
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/MEMSX64 | awk '{print $1}')" = '1d6316bd1746d6f2b4cfb751cab88d18e27ef730'
          test "$(git ls-remote origin refs/heads/tmp-ravemems-v2-foundation | awk '{print $1}')" = 'dee81b207b34cbd12b1f3f6ff58993ac0cc3e67f'
          python3 - <<'PY'
          from pathlib import Path
          report = Path('RAPPORT_SUIVI_ECU_MEMS_MANAGER.md')
          raw = report.read_bytes()
          marker = '## 2026-09-03 — RCL0193ENG V2 PROTOTYPE 2 — DIAGNOSTIC GEOMETRIQUE AJOUTE, SEMANTIQUE ENCORE NON VALIDEE'.encode('utf-8')
          if marker not in raw:
              entry = '''\n\n## 2026-09-03 — RCL0193ENG V2 PROTOTYPE 2 — DIAGNOSTIC GEOMETRIQUE AJOUTE, SEMANTIQUE ENCORE NON VALIDEE\n\nBranche `tmp-ravemems-v2-foundation`, commit technique `dee81b207b34cbd12b1f3f6ff58993ac0cc3e67f` (`Refine RCL0193ENG step parsing diagnostics`). Run GitHub Actions `33764840233` : **SUCCESS**. Tous les gardes ont passe : perimetre, fondation SQLite/Python, contrat C++, porte semantique, source exacte RCL0193ENG, extraction et garde structurel. `MEMSX64` est restee exactement BUILD #103 `1d6316bd1746d6f2b4cfb751cab88d18e27ef730`; aucun BUILD #104.\n\nArtefact `RAVEMEMS-V2-RCL0193ENG-PROTOTYPE-AUDIT` : ID `9897056703`, taille ZIP `25 274 855` octets, digest `sha256:edcc32766d9d62b59c3dcd7cb5dc8176d09f8d6492d71d9f4ea2dddb9b9bc586`, expiration 2026-09-17. Source toujours strictement identique : `main@643de091b474f4e27917a065bdf46d5a0c764276`, PDF SHA-256 `c050a3eebe50c5a85bf8a69b7722bd2052079944e09d58578a498984ecf06715`, 372 pages.\n\nCompteurs produits inchanges par rapport au prototype 1 : `201` operations, `315` phases, `3 189` etapes, `180` notices, `23` exigences, `738` visuels, `427` liens visuels, `3 885` provenances, `242` review flags, `1 797` constats d'audit, SQLite `integrity_check=ok`, `0` FK cassee. Le nouveau diagnostic a trouve seulement `7` candidats numeriques rejetes, mais `242` phases restent numeriquement defectueuses. La base SQLite produite reste semantiquement non validee.\n\nAnalyse directe de `debug_pages_131_136.txt` et `pages_131_136_semantic.json` : la cause racine visible sur ce cas test est l'ordre de lecture geometrique des pages a deux colonnes. L'extracteur trie actuellement les lignes par `(y, x)`, ce qui entrelace les deux colonnes et melange des procedures distinctes : CKP avec TP, TP avec MAP, HO2S avec Fuel rail, puis Fuel rail avec Fuel injectors. Les marqueurs d'etapes sont bien reconnus ; le defaut dominant ici est donc la segmentation/l'ordre de lecture des colonnes, puis la continuite multi-pages.\n\nAucune correction manuelle, aucun cas `injecteur` ou nom d'operation ne doit etre code en dur. Aucun autre PDF n'est autorise.\n\nPROCHAINE ACTION EXACTE : corriger generiquement `read_lines()`/la segmentation de page pour reconstruire l'ordre de lecture par regions/colonnes a partir de la geometrie PDF, conserver les en-tetes/pieds hors flux semantique, puis relancer uniquement RCL0193ENG. Verifier explicitement les pages 131-136 et en particulier la continuite Fuel rail pages 134-136 / Fuel injectors page 136. Exiger une chute massive des 242 defauts avant toute validation ou extension.\n'''.encode('utf-8')
              with report.open('ab') as f:
                  if raw and not raw.endswith(b'\n'):
                      f.write(b'\n')
                  f.write(entry)
          PY
          rm -f .github/workflows/tmp-journal-ravemems-v2-rcl0193-result2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md .github/workflows/tmp-journal-ravemems-v2-rcl0193-result2.yml
          git diff --cached --check
          git commit -m 'Journal RCL0193ENG V2 prototype 2 verdict'
          git push origin HEAD:RAPPORT
