name: CONSOLIDATE MASTER REPORT

on:
  push:
    branches: [RAPPORT]
    paths:
      - '.github/workflows/consolidate-master-report.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0

      - name: Consolidate every historical markdown report into the single master
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          from datetime import date

          master = Path('RAPPORT_SUIVI_ECU_MEMS_MANAGER.md')
          if not master.exists():
              raise SystemExit('MASTER REPORT MISSING')

          old = master.read_text(encoding='utf-8')
          marker = '## REGLE MAITRE PERMANENTE - UN SEUL RAPPORT DE CONTINUITE'
          if marker in old:
              raise SystemExit('Master consolidation marker already present; refusing duplicate consolidation')

          archives = sorted(
              p for p in Path('.').glob('*.md')
              if p.name not in {master.name, 'README.md'}
          )
          if not archives:
              raise SystemExit('No historical markdown documents found to consolidate')

          rule = '''\n## REGLE MAITRE PERMANENTE - UN SEUL RAPPORT DE CONTINUITE\n\n**IMPORTANCE CAPITALE - REGLE DE TRAVAIL PERMANENTE A PARTIR DU 30 AOUT 2026.**\n\n`RAPPORT_SUIVI_ECU_MEMS_MANAGER.md` est desormais **l unique rapport maitre, l unique journal de continuite et l unique point de reprise obligatoire** du projet ECU MEMS Manager.\n\nA partir de cette consolidation :\n- toute progression du programme, recherche, decision, test reel, echec, correction, build, SHA, branche, checkpoint, prochaine action, audit, protocole, RAVE, IA, UI et regle de securite doit etre inscrite dans **ce fichier uniquement** ;\n- **aucun nouveau rapport de suivi separe ne doit etre cree ou complete** pour assurer la continuite ;\n- les anciens fichiers `RAPPORT_*`, `AUDIT_*`, `REPRISE_*`, `RECHERCHE_*`, `ETAPE_*` et autres Markdown historiques restent sur GitHub uniquement comme **archives en lecture seule** ;\n- toute ancienne instruction presente dans l historique demandant de lire un second rapport, audit ou document de reprise est **annulee et remplacee par la presente regle** ;\n- les informations de ces anciens documents sont consolidees integralement plus bas dans ce rapport maitre afin qu une seule lecture permette de retrouver l historique et les informations techniques ;\n- un ancien fichier peut etre consulte comme preuve historique, mais il ne doit plus devenir une dependance necessaire a la reprise ;\n- si une information indispensable est decouverte dans une archive ou une source externe, elle doit etre recopiere/consignee dans le rapport maitre avant de poursuivre ;\n- la regle preexistante `RAPPORT AVANT POUSSE -> POUSSE -> TEST REEL -> RAPPORT IMMEDIAT` continue de s appliquer, mais **RAPPORT signifie exclusivement ce fichier maitre**.\n\n**But de cette regle :** garantir une tracabilite complete et lisible aussi bien pour l utilisateur que pour l assistant, et faire qu une coupure de discussion ne puisse jamais exiger de deviner quels autres rapports doivent etre retrouves.\n\n**Instruction de reprise canonique :** `Lire RAPPORT_SUIVI_ECU_MEMS_MANAGER.md sur la branche RAPPORT, puis reprendre strictement a la PROCHAINE ACTION EXACTE.`\n\n'''

          consolidation = []
          consolidation.append('\n# ARCHIVES HISTORIQUES CONSOLIDEES DANS LE RAPPORT MAITRE - 30 AOUT 2026\n')
          consolidation.append('\nCette section contient une copie integrale des documents Markdown historiques de suivi/audit/reprise presents a la racine de la branche `RAPPORT` au moment de la consolidation. Les fichiers originaux restent sur GitHub en lecture seule. **Leur contenu ci-dessous appartient desormais au rapport maitre ; ils ne doivent plus etre completes separement.**\n')
          consolidation.append(f'\nNombre de documents archives consolides : **{len(archives)}**.\n')
          consolidation.append('\n## MANIFESTE DES ARCHIVES CONSOLIDEES\n')

          snapshots = []
          for p in archives:
              data = p.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              consolidation.append(f'- `{p.name}` — {len(data)} octets — SHA-256 `{sha}`\n')
              text = data.decode('utf-8')
              snapshots.append((p.name, len(data), sha, text))

          consolidation.append('\n## COPIES INTEGRALES DES ARCHIVES\n')
          for name, size, sha, text in snapshots:
              consolidation.append(f'\n<!-- ARCHIVE_SOURCE_BEGIN name={name} size={size} sha256={sha} -->\n')
              consolidation.append(f'\n## ARCHIVE CONSOLIDEE - `{name}`\n')
              consolidation.append(f'\n> Copie historique integrale. Source originale conservee sur GitHub en lecture seule. SHA-256 source : `{sha}`.\n\n')
              consolidation.append(text)
              if not text.endswith('\n'):
                  consolidation.append('\n')
              consolidation.append(f'\n<!-- ARCHIVE_SOURCE_END name={name} -->\n')

          # Insert master rule immediately after the first title line so it overrides historical instructions.
          lines = old.splitlines(keepends=True)
          if lines:
              new = lines[0] + rule + ''.join(lines[1:])
          else:
              new = rule + old

          new += '\n## 2026-08-30 - CONSOLIDATION DU RAPPORT MAITRE\n\n'
          new += f'- **{len(archives)} documents Markdown historiques** ont ete copies integralement dans ce fichier avec taille et SHA-256.\n'
          new += '- Les originaux restent sur GitHub comme archives en lecture seule ; aucune suppression historique n est effectuee.\n'
          new += '- Desormais, toutes les mises a jour de continuite/progression sont faites uniquement dans `RAPPORT_SUIVI_ECU_MEMS_MANAGER.md`.\n'
          new += '- Toute ancienne obligation de lire un rapport annexe est remplacee par la regle maitre placee en tete de ce fichier.\n'
          new += '- **PROCHAINE ACTION EXACTE apres consolidation : reprendre le lot RCL0193FRE 1860 bloque par le transport tronque, a partir du PDF RCL0193FRE fourni par l utilisateur, en appliquant la regle SAFE CHECKPOINT des gros fichiers avant toute nouvelle tentative de pousse.**\n'
          new += ''.join(consolidation)

          master.write_text(new, encoding='utf-8', newline='\n')

          # Independent local checks before commit.
          check = master.read_text(encoding='utf-8')
          assert marker in check
          for name, size, sha, text in snapshots:
              assert f'ARCHIVE_SOURCE_BEGIN name={name} size={size} sha256={sha}' in check
              assert text in check
          print('MASTER=', master)
          print('ARCHIVES=', len(archives))
          print('MASTER_BYTES=', master.stat().st_size)
          print('MASTER_SHA256=', hashlib.sha256(master.read_bytes()).hexdigest())
          PY

      - name: Commit consolidated master and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/consolidate-master-report.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md .github/workflows/consolidate-master-report.yml
          git diff --cached --check
          git commit -m 'Consolidate all continuity reports into single master'
          git push origin HEAD:RAPPORT
