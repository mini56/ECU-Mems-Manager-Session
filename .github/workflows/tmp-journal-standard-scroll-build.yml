name: TEMP journal standard IA scroll build prepush
on:
  push:
    branches: [RAPPORT]
    paths:
      - '.github/workflows/tmp-journal-standard-scroll-build.yml'
permissions:
  contents: write
jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Append journal
        shell: bash
        run: |
          printf '%s\n' '' '## 2026-09-01 — Avant compilation package x64 avec scroll IA standard' '' 'Branche de test verifiee : tmp-ravemems-ia-visual-integration HEAD d936ead712d64c22247953a209755f4efd09b5e1, descendant du commit applicatif 06bb3b8cdf4e0563d020c897dbc8faf22605b644 qui ajoute uniquement le scroll vertical standard dans iamemstab.cpp.' 'MEMSX64 verifie intact : BUILD #103 commit 1d6316bd1746d6f2b4cfb751cab88d18e27ef730.' '' 'PROCHAINE ACTION EXACTE : declencher le workflow RAVEMEMS VISUAL TEST from BUILD 103 sur la branche de test actuelle, sans changer sa logique de build, puis journaliser le verdict avant tout autre correctif.' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
      - name: Commit journal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-journal-standard-scroll-build.yml
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git commit -m "Journal standard IA scroll build prepush"
          git push origin HEAD:RAPPORT
