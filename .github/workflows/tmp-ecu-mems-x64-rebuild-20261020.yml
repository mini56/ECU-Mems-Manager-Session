name: TEMP ECU MEMS Manager Full Windows Setup Rebuild
run-name: PRE-FLIGHT BUILD 116 - Full RAVEMEMS V2, Qwen ONNX and Windows Setup

on:
  push:
    branches: [tmp-ia-clarification-test-1b106ee]
    paths:
      - '.github/workflows/tmp-ecu-mems-x64-rebuild-20261020.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: tmp-ecu-mems-x64-rebuild-20261020
  cancel-in-progress: true

env:
  MEMS_BUILD: '116'
  MEMS_BUILD_NUMBER: '116'
  ORT_GENAI_VERSION: '0.14.0'
  ORT_GENAI_WIN_X64_SHA256: '8a303e52dc7be8fb2a5331929af451a25ac59774102d7fd09ef673adc85c5ebf'
  ORT_VERSION: '1.24.4'
  ORT_WIN_X64_SHA256: 'd2319fddfb6ea4db99ccc4b60c85c517bcd855721f5daa6a06d40d7cb2ee2357'
  BASE_PACKAGE_RUN_ID: '33889068203'
  BASE_PACKAGE_ARTIFACT_ID: '9943343980'
  BASE_PACKAGE_ARTIFACT_NAME: 'TMP-ECU-MEMS-Manager-x64-IA-MEMSLibrary-33889068203'
  BASE_PACKAGE_DIGEST: 'sha256:4cf818b64670a8fb4dc5e6f77b7b30c35a3ab95251046ca24c529194a622f7f5'
  CLEAN_REFERENCE_RUN_ID: '33919306584'
  CLEAN_REFERENCE_ARTIFACT_ID: '9954393075'
  CLEAN_REFERENCE_ARTIFACT_NAME: 'CLEAN-REFERENCE-V2-33919306584'
  CLEAN_REFERENCE_DIGEST: 'sha256:b056ada5b925648824274f6b04cfa95b81fb6ba8bd07c101f3210757f5ef4df8'
  PACK001_RUN_ID: '33847448261'
  PACK001_ARTIFACT_ID: '9927059742'
  PACK001_ARTIFACT_NAME: 'MEMSLibrary-Pack001-33847448261'
  PACK001_DIGEST: 'sha256:ffa9c42783fe443ffc3949cf2166083291adb08505b3fca228b03003a904698a'
  PACK001_SQLITE_SHA256: '827208b703324335828d72093994ec5f7bf9e0a6fd0cd3b0082d033bfa38628b'
  CORRECTED_DLL_RUN_ID: '34135797836'
  CORRECTED_DLL_ARTIFACT_ID: '10023930741'
  CORRECTED_DLL_ARTIFACT_NAME: 'MEMSLibrary-DLL-Provenance-Relevance-34135797836'
  CORRECTED_DLL_DIGEST: 'sha256:596d9e4aaf7ad0e2b11cd011ada09ef58bab93936eab665c8e7a57b85cd3a2fb'
  CORRECTED_DLL_SHA256: 'b16dfe3d4d3ece40557fb5fa5e17088fbe3a48ca085575568d16057d8571dd8b'
  CLEAN_V2_LINEAGE: 'RAVEMEMS_V2_FINAL_33810202288'

jobs:
  source47:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ENGINE_SHA: 5232215f5853241572f580cf1696c9f881b254f4
      SOURCE_MAIN_COMMIT: 643de091b474f4e27917a065bdf46d5a0c764276
      PROTECTED_MEMSX64: 1b106eed05e1fd665b857f73a719f02ee6b6b2ac
      EXPECTED_PDF_COUNT: "47"

    steps:
      - name: Checkout exact neutral generic engine
        uses: actions/checkout@v4
        with:
          ref: 5232215f5853241572f580cf1696c9f881b254f4
          fetch-depth: 0

      - name: Guard exact engine and production
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ENGINE_SHA"
          test "$(git ls-remote origin refs/heads/MEMSX64 | awk '{print $1}')" = "$PROTECTED_MEMSX64"
          echo "ENGINE_SHA=$ENGINE_SHA"
          echo "MEMSX64_PROTECTED=$PROTECTED_MEMSX64"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned renderer and compile generic engine
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "PyMuPDF==1.26.4"
          PYTHONPATH="ravemems/v2:.github/pass2" python -m py_compile \
            ravemems/v2/core_extract.py \
            ravemems/v2/source_input.py \
            ravemems/v2/generic_document_rules.py \
            .github/pass2/generic_semantic_pass2.py \
            .github/pass2/generic_precise_visual_extract.py \
            .github/pass2/ravemems_generic_precise_extract.py \
            .github/pass2/generic_visual_validate.py \
            .github/pass2/ravemems_generic_visual_replay_validate.py \
            .github/pass2/ravemems_extract_source.py
          ! grep -R -n -E 'RCL0193|rcl0193' \
            ravemems/v2/core_extract.py \
            ravemems/v2/source_input.py \
            ravemems/v2/generic_document_rules.py \
            .github/pass2/generic_semantic_pass2.py \
            .github/pass2/generic_precise_visual_extract.py \
            .github/pass2/ravemems_generic_precise_extract.py \
            .github/pass2/generic_visual_validate.py \
            .github/pass2/ravemems_generic_visual_replay_validate.py \
            .github/pass2/ravemems_extract_source.py

      - name: Materialize frozen full RAVE PDF corpus
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_MAIN_COMMIT"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_MAIN_COMMIT"
          mkdir -p "$RUNNER_TEMP/corpus"
          mapfile -t pdfs < <(git ls-tree -r --name-only "$SOURCE_MAIN_COMMIT" rave | grep -Ei '\.pdf$' | sort)
          printf '%s\n' "${pdfs[@]}" > "$RUNNER_TEMP/corpus_pdf_paths.txt"
          echo "FROZEN_CORPUS_PDF_COUNT=${#pdfs[@]}"
          test "${#pdfs[@]}" -eq "$EXPECTED_PDF_COUNT"
          : > "$RUNNER_TEMP/corpus_source_inventory.tsv"
          for path in "${pdfs[@]}"; do
            target="$RUNNER_TEMP/corpus/$path"
            mkdir -p "$(dirname "$target")"
            git show "$SOURCE_MAIN_COMMIT:$path" > "$target"
            blob="$(git rev-parse "$SOURCE_MAIN_COMMIT:$path")"
            size="$(wc -c < "$target")"
            printf '%s\t%s\t%s\n' "$path" "$blob" "$size" >> "$RUNNER_TEMP/corpus_source_inventory.tsv"
          done
          test "$(find "$RUNNER_TEMP/corpus/rave" -type f -iname '*.pdf' | wc -l)" -eq "$EXPECTED_PDF_COUNT"

      - name: Run neutral generic engine on complete corpus
        id: extraction
        shell: bash
        run: |
          set -uo pipefail
          export PYTHONPATH="ravemems/v2:.github/pass2"
          rm -rf "$RUNNER_TEMP/full-out"
          python .github/pass2/ravemems_extract_source.py \
            --source "$RUNNER_TEMP/corpus/rave" \
            --schema ravemems/v2/schema.sql \
            --out "$RUNNER_TEMP/full-out"
          rc=$?
          echo "extract_rc=$rc" >> "$GITHUB_OUTPUT"
          echo "FULL_CORPUS_EXTRACTION_RETURN_CODE=$rc"
          test -f "$RUNNER_TEMP/full-out/source_manifest.json"
          exit 0

      - name: Replay every successful document and build corpus audit summary
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="ravemems/v2:.github/pass2"
          python - "$RUNNER_TEMP" "$EXPECTED_PDF_COUNT" <<'PY'
          import json
          import sqlite3
          import subprocess
          import sys
          from collections import Counter
          from pathlib import Path

          root = Path(sys.argv[1])
          expected_count = int(sys.argv[2])
          out = root / "full-out"
          source_manifest_path = out / "source_manifest.json"
          source = json.loads(source_manifest_path.read_text(encoding="utf-8"))
          results = source.get("results", [])
          replay_script = Path(".github/pass2/ravemems_generic_visual_replay_validate.py").resolve()

          replay_failures = []
          validation = []
          total_pages = 0
          total_visuals = 0
          total_links = 0
          total_operations = 0
          total_phases = 0
          total_steps = 0
          languages = Counter()
          kinds = Counter()

          for index, record in enumerate(results, 1):
              entry = {
                  "index": index,
                  "input_pdf": record.get("input_pdf"),
                  "document_identity": record.get("document_identity"),
                  "publication_code": record.get("publication_code"),
                  "language": record.get("language"),
                  "page_count": record.get("page_count"),
                  "extraction_return_code": record.get("return_code"),
                  "output_directory": record.get("output_directory"),
              }
              total_pages += int(record.get("page_count") or 0)
              languages[str(record.get("language") or "unknown")] += 1
              if int(record.get("return_code") or 0) != 0:
                  entry["replay_return_code"] = None
                  entry["status"] = "extraction_failed"
                  validation.append(entry)
                  continue

              document_out = Path(str(record["output_directory"]))
              manifest_path = document_out / "manifest.json"
              if not manifest_path.exists():
                  entry["status"] = "manifest_missing"
                  replay_failures.append({"index": index, "reason": "manifest_missing", "output": str(document_out)})
                  validation.append(entry)
                  continue

              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              counts = manifest.get("counts", {})
              kind = str(manifest.get("document_kind") or "unknown")
              kinds[kind] += 1
              total_visuals += int(counts.get("ravemems_visual", 0) or 0)
              total_links += int(counts.get("ravemems_visual_link", 0) or 0)
              total_operations += int(counts.get("ravemems_operation", 0) or 0)
              total_phases += int(counts.get("ravemems_phase", 0) or 0)
              total_steps += int(counts.get("ravemems_step", 0) or 0)
              entry["document_kind"] = kind
              entry["counts"] = counts

              completed = subprocess.run([
                  sys.executable,
                  str(replay_script),
                  "--pdf", str(record["input_pdf"]),
                  "--out", str(document_out),
              ], text=True)
              entry["replay_return_code"] = completed.returncode

              replay_path = document_out / "visual_replay_validation.json"
              if replay_path.exists():
                  replay = json.loads(replay_path.read_text(encoding="utf-8"))
                  entry["replay"] = replay
              else:
                  replay = None

              db_path = document_out / "ravemems_v2.sqlite"
              if db_path.exists():
                  db = sqlite3.connect(db_path)
                  entry["sqlite_integrity"] = db.execute("PRAGMA integrity_check").fetchone()[0]
                  entry["foreign_key_issue_count"] = len(db.execute("PRAGMA foreign_key_check").fetchall())
                  entry["open_review_count"] = db.execute("SELECT COUNT(*) FROM ravemems_review_flag WHERE status='open'").fetchone()[0]
                  db.close()
              else:
                  entry["sqlite_integrity"] = "missing"
                  entry["foreign_key_issue_count"] = -1
                  entry["open_review_count"] = -1

              ok = (
                  completed.returncode == 0
                  and replay is not None
                  and int(replay.get("visual_fidelity_failed_count", -1)) == 0
                  and int(replay.get("visual_link_failed_count", -1)) == 0
                  and int(replay.get("missing_replay_count", -1)) == 0
                  and int(replay.get("unexpected_replay_count", -1)) == 0
                  and int(replay.get("audit_issue_count_after_validation", -1)) == 0
                  and str(entry["sqlite_integrity"]).lower() == "ok"
                  and int(entry["foreign_key_issue_count"]) == 0
                  and int(entry["open_review_count"]) == 0
              )
              entry["status"] = "pass" if ok else "replay_or_audit_failed"
              if not ok:
                  replay_failures.append({"index": index, "identity": record.get("document_identity"), "reason": entry["status"]})
              validation.append(entry)

          summary = {
              "engine_sha": "5232215f5853241572f580cf1696c9f881b254f4",
              "source_main_commit": "643de091b474f4e27917a065bdf46d5a0c764276",
              "expected_pdf_count": expected_count,
              "discovered_pdf_count": int(source.get("pdf_count", -1)),
              "extraction_failure_count": int(source.get("failure_count", -1)),
              "replay_failure_count": len(replay_failures),
              "total_pages": total_pages,
              "total_visuals": total_visuals,
              "total_visual_links": total_links,
              "total_operations": total_operations,
              "total_phases": total_phases,
              "total_steps": total_steps,
              "languages": dict(sorted(languages.items())),
              "document_kinds": dict(sorted(kinds.items())),
              "replay_failures": replay_failures,
              "documents": validation,
          }
          (out / "corpus_validation_summary.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({k: v for k, v in summary.items() if k not in {"documents"}}, ensure_ascii=False, indent=2))
          print("FULL_CORPUS_DOCUMENTS_PROCESSED", len(results))
          print("FULL_CORPUS_EXTRACTION_FAILURES", summary["extraction_failure_count"])
          print("FULL_CORPUS_REPLAY_FAILURES", summary["replay_failure_count"])
          PY

      - name: Copy frozen source inventory into result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/full-out/_corpus_metadata"
          cp "$RUNNER_TEMP/corpus_pdf_paths.txt" "$RUNNER_TEMP/full-out/_corpus_metadata/"
          cp "$RUNNER_TEMP/corpus_source_inventory.tsv" "$RUNNER_TEMP/full-out/_corpus_metadata/"

      - name: Publish verified full RAVEMEMS V2 corpus to private prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/full-out/corpus_validation_summary.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding='utf-8'))
          assert x['discovered_pdf_count']==47 and x['total_pages']==1359 and x['total_visuals']==1667
          assert x['extraction_failure_count']==0 and x['replay_failure_count']==0
          print('SOURCE47_STRICT_PASS')
          PY
          tar -czf "$RUNNER_TEMP/source47.tar.gz" -C "$RUNNER_TEMP/full-out" .
          sha256sum "$RUNNER_TEMP/source47.tar.gz"
          gh release create "mems-build116-candidate-$GITHUB_RUN_ID" "$RUNNER_TEMP/source47.tar.gz" --target "$GITHUB_SHA" --title "ECU MEMS Manager BUILD 116 - reconstruction de test" --notes "Préversion privée ; non validée pour utilisation finale." --prerelease
          echo SOURCE47_RELEASE_PUBLISHED


      - name: Strict full corpus verdict
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.extraction.outputs.extract_rc }}" = "0"
          python - "$RUNNER_TEMP/full-out/corpus_validation_summary.json" "$EXPECTED_PDF_COUNT" <<'PY'
          import json, sys
          from pathlib import Path
          summary = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = int(sys.argv[2])
          assert summary["discovered_pdf_count"] == expected, summary
          assert summary["extraction_failure_count"] == 0, summary["replay_failures"]
          assert summary["replay_failure_count"] == 0, summary["replay_failures"]
          assert len(summary["documents"]) == expected, len(summary["documents"])
          assert all(item.get("status") == "pass" for item in summary["documents"]), [item for item in summary["documents"] if item.get("status") != "pass"]
          print("RAVEMEMS_V2_FULL_CORPUS_GENERIC_GLOBAL_ZERO_PASS")
          PY
          test "$(git ls-remote origin refs/heads/MEMSX64 | awk '{print $1}')" = "$PROTECTED_MEMSX64"
  base-runtime:
    needs: source47
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      MEMS_BUILD: '103'
      MEMS_VERSION: '1.0.103'
      MEMS_BUILD_NUMBER: '103'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      ORT_GENAI_VERSION: '0.14.0'
      ORT_GENAI_WIN_X64_SHA256: '8a303e52dc7be8fb2a5331929af451a25ac59774102d7fd09ef673adc85c5ebf'
      ORT_VERSION: '1.24.4'
      ORT_WIN_X64_SHA256: 'd2319fddfb6ea4db99ccc4b60c85c517bcd855721f5daa6a06d40d7cb2ee2357'
      ONNX_MODEL_REPO: 'xiaoyao9184/Qwen3-0.6B-onnx-genai'
      ONNX_MODEL_REVISION: 'e6bf97818c142808967a48cbab4f0aef18b64621'
      ONNX_MODEL_SUBDIR: 'cpu_and_mobile/cpu-int4-rtn-block-32-acc-level-4'
      ONNX_MODEL_ONNX_SHA256: 'b52cfcd91e6ed3caa34c670d4831d96cda3da5eb07ef95bc8ba06547b4f3b86f'
      ONNX_MODEL_DATA_SHA256: '8539cf4fbc3b5b331fd78ca8cd5b025ce537dfc2f993451f5c474b2f9fb7cd6c'
      ONNX_TOKENIZER_SHA256: 'be75606093db2094d7cd20f3c2f385c212750648bd6ea4fb2bf507a6a4c55506'

    steps:
      - name: Checkout isolated IA bridge branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 9da599e697aa96d099982a30f5f5c8a562a7c788

      - name: Verify protected production and Pack001 ancestry
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $protected = '1d6316bd1746d6f2b4cfb751cab88d18e27ef730'
          $pack001 = '9cf3d00840cec1749ef9358f708d3e68a2c8bc4d'
          git merge-base --is-ancestor $protected HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Temporary package branch is not based on protected MEMSX64 BUILD #103' }
          git merge-base --is-ancestor $pack001 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Temporary package branch is not based on validated MEMSLibrary Pack001 checkpoint' }
          Write-Host "TMP_PACKAGE_ANCESTRY_OK protected=$protected pack001=$pack001"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0" pefile "huggingface_hub>=0.34,<1" hf_xet
          if ($LASTEXITCODE -ne 0) { throw "Validation tools install failed: $LASTEXITCODE" }

      - name: Install Qt 5.15.2 MSVC 2019 x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          if (Test-Path 'C:\Qt') { Remove-Item 'C:\Qt' -Recurse -Force -ErrorAction SilentlyContinue }
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtcharts -O C:\Qt --external "$sevenZip"
          if ($LASTEXITCODE -ne 0) { throw "aqtinstall failed: $LASTEXITCODE" }

      - name: Download regenerated RAVEMEMS V2 via private prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag="mems-build116-candidate-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory source47,source47-input -Force | Out-Null
          gh release download $tag --pattern source47.tar.gz --dir source47-input
          if($LASTEXITCODE -ne 0){throw 'RAVEMEMS V2 download failed'}
          tar.exe -xzf source47-input/source47.tar.gz -C source47
          if($LASTEXITCODE -ne 0){throw 'RAVEMEMS V2 archive extraction failed'}
          $dbs=@(Get-ChildItem source47 -Recurse -File -Filter ravemems_v2.sqlite)
          if($dbs.Count -ne 47){throw "Expected 47 SQLite databases, got $($dbs.Count)"}
          Write-Host "SOURCE47_RELEASE_DOWNLOAD_PASS dbs=$($dbs.Count)"


      - name: Rebuild and validate MEMSLibrary Pack001
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/build_memslibrary_pack.py source47 pack001 --pack-id MEMSLibrary_Pack_001
          if ($LASTEXITCODE -ne 0) { throw "Pack001 rebuild failed: $LASTEXITCODE" }
          @'
          import json,sqlite3
          from pathlib import Path
          root=Path('pack001')
          db=root/'knowledge.sqlite'
          manifest=root/'manifest.json'
          cx=sqlite3.connect(db)
          try:
              assert cx.execute('pragma integrity_check').fetchone()[0]=='ok'
              assert cx.execute('pragma foreign_key_check').fetchall()==[]
              assert cx.execute('select count(*) from ravemems_document').fetchone()[0]==47
          finally:
              cx.close()
          data=json.loads(manifest.read_text(encoding='utf-8'))
          assert data.get('pack_id')=='MEMSLibrary_Pack_001'
          assert int(data.get('document_count',0))==47
          print('PACK001_PACKAGE_FIXTURE_OK docs=47')
          '@ | python -

      - name: Build MEMSLibrary ABI2 x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S memslibrary -B build-memslibrary -A x64
          if ($LASTEXITCODE -ne 0) { throw "MEMSLibrary configure failed: $LASTEXITCODE" }
          cmake --build build-memslibrary --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "MEMSLibrary build failed: $LASTEXITCODE" }

      - name: Stage exact BUILD 103 ONNX Runtime and VC++ dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $genaiArchive = Join-Path $env:RUNNER_TEMP "onnxruntime-genai-$env:ORT_GENAI_VERSION-win-x64.zip"
          $ortArchive = Join-Path $env:RUNNER_TEMP "onnxruntime-win-x64-$env:ORT_VERSION.zip"
          $genaiExtract = '${{ github.workspace }}\onnx-genai-package'
          $ortExtract = '${{ github.workspace }}\onnxruntime-package'
          $stage = '${{ github.workspace }}\onnx-runtime-package-stage'
          $genaiUrl = "https://github.com/microsoft/onnxruntime-genai/releases/download/v$env:ORT_GENAI_VERSION/onnxruntime-genai-$env:ORT_GENAI_VERSION-win-x64.zip"
          $ortUrl = "https://github.com/microsoft/onnxruntime/releases/download/v$env:ORT_VERSION/onnxruntime-win-x64-$env:ORT_VERSION.zip"

          foreach ($dir in @($genaiExtract,$ortExtract,$stage)) {
            if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
          }

          & curl.exe -L --fail --retry 3 --retry-delay 3 -o $genaiArchive $genaiUrl
          if ($LASTEXITCODE -ne 0) { throw "ONNX Runtime GenAI download failed: $LASTEXITCODE" }
          $genaiHash = (Get-FileHash $genaiArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($genaiHash -ne $env:ORT_GENAI_WIN_X64_SHA256) { throw "ONNX Runtime GenAI SHA256 mismatch: $genaiHash" }
          Expand-Archive -LiteralPath $genaiArchive -DestinationPath $genaiExtract -Force

          & curl.exe -L --fail --retry 3 --retry-delay 3 -o $ortArchive $ortUrl
          if ($LASTEXITCODE -ne 0) { throw "ONNX Runtime download failed: $LASTEXITCODE" }
          $ortHash = (Get-FileHash $ortArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ortHash -ne $env:ORT_WIN_X64_SHA256) { throw "ONNX Runtime SHA256 mismatch: $ortHash" }
          Expand-Archive -LiteralPath $ortArchive -DestinationPath $ortExtract -Force

          $header = Get-ChildItem $genaiExtract -Recurse -File -Filter 'ort_genai_c.h' | Select-Object -First 1
          $import = Get-ChildItem $genaiExtract -Recurse -File -Filter 'onnxruntime-genai.lib' | Select-Object -First 1
          $genaiDll = Get-ChildItem $genaiExtract -Recurse -File -Filter 'onnxruntime-genai.dll' | Select-Object -First 1
          $ortDll = Get-ChildItem $ortExtract -Recurse -File -Filter 'onnxruntime.dll' | Select-Object -First 1
          if (-not $header -or -not $import -or -not $genaiDll -or -not $ortDll) {
            throw 'Official ONNX Runtime GenAI / ONNX Runtime package layout is incomplete'
          }

          $seen = @{}
          foreach ($root in @($genaiExtract,$ortExtract)) {
            foreach ($dll in Get-ChildItem $root -Recurse -File -Filter '*.dll') {
              $key = $dll.Name.ToLowerInvariant()
