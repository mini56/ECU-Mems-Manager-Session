          ref: 00b630096c5feb8ffa0a5a5abe92c78c5bf21ac6
      - name: Verify and download validated V3 clean reference corrected for 1800 and 1810
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          a=json.loads(subprocess.check_output(['gh','api','repos/mini56/ECU-Mems-Manager-Session/actions/artifacts/10112701782']))
          assert a['name']=='CLEAN-REFERENCE-V3-fix-1800-1810-34373031620'
          assert a['digest']=='sha256:4cba9ab0b6d2d27bc191da13220e3c227c8ecdbcc9e07973621d7c98d422784d'
          assert not a.get('expired'),a
          print('CANONICAL_V3_REFERENCE_ARTIFACT_PIN_PASS')
          PY
          mkdir -p clean-ref-v3
          gh run download 34373031620 --repo "$GITHUB_REPOSITORY" --name CLEAN-REFERENCE-V3-fix-1800-1810-34373031620 --dir clean-ref-v3
          catalog="$(find clean-ref-v3 -name runtime_visual_catalog.json -type f -print -quit)"
          test -n "$catalog"
          refroot="$(dirname "$catalog")"
          echo "CANONICAL_REF_ROOT=$refroot" >> "$GITHUB_ENV"
          for file in research_enrichment_1800.qz64 research_enrichment_1810.qz64 manifest.json; do
            test -f "$refroot/$file"
            test "$(sha256sum "$refroot/$file" | cut -d' ' -f1)" = "$(sha256sum "database/reference/$file" | cut -d' ' -f1)"
          done
          python - "$refroot" <<'PY'
          import json,sys
          from pathlib import Path
          r=Path(sys.argv[1])
          c=json.loads((r/'runtime_visual_catalog.json').read_text(encoding='utf-8'))
          assert c['source_lineage']=='RAVEMEMS_V2_FINAL_33810202288'
          assert c['entry_count']==1667
          assert c['legacy_entries']==0 and c['pre_v2_images_included']==0
          assert not (r/'images'/'rave').exists()
          print('CLEAN_REFERENCE_V3_PROVENANCE_AND_CORRECTED_1800_1810_PASS')
          PY
      - name: Publish verified V3 clean reference to private prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/clean-reference.tar.gz" -C "$CANONICAL_REF_ROOT" .
          gh release upload "mems-build116-candidate-$GITHUB_RUN_ID" "$RUNNER_TEMP/clean-reference.tar.gz"
          echo CLEAN_V3_RELEASE_UPLOAD_PASS

  build-x64:
    needs: [base-runtime, clean-reference]
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: 00b630096c5feb8ffa0a5a5abe92c78c5bf21ac6
          fetch-depth: 0

      - name: Guard direct code and no patch injection
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if (Select-String -Path CMakeLists.txt -Pattern 'CMAKE_PROJECT_INCLUDE' -Quiet) { throw 'Source injection is forbidden' }
          if (-not (Select-String -Path iamemstab.cpp -Pattern 'iaMemsTranscriptScroll' -Quiet)) { throw 'IA vertical scroll source missing' }
          if (-not (Select-String -Path iamemstab.cpp -Pattern 'Voir le schéma' -Quiet)) { throw 'Voir le schema UI source missing' }
          if (-not (Select-String -Path iamemstab.cpp -Pattern 'askWithLibrary' -Quiet)) { throw 'Direct MEMSLibrary call missing' }
          if (-not (Select-String -Path expert/IaMemsDiagramCatalog.cpp -Pattern 'suggestionForEvidence' -Quiet)) { throw 'Evidence visual routing source missing' }
          if (-not (Select-String -Path CMakeLists.txt -Pattern 'IaMemsLibraryBridge.cpp' -Quiet)) { throw 'Direct bridge CMake wiring missing' }
          if (-not (Select-String -Path expert/IaMemsLibraryBridge.cpp -Pattern 'MEMSLibrary_SearchPackFiltered' -Quiet)) { throw 'Filtered MEMSLibrary bridge source missing' }
          if (-not (Select-String -Path memslibrary/include/MEMSLibrary.h -Pattern 'MEMSLibrary_SearchPackFiltered' -Quiet)) { throw 'Filtered MEMSLibrary public contract missing' }
          $files=@('CMakeLists.txt','iamemstab.cpp','expert/IaMemsDiagramCatalog.cpp','expert/IaMemsDiagramCatalog.h','expert/IaMemsService.h','expert/IaMemsLibraryBridge.cpp','expert/IaMemsLibraryBridge.h','expert/IaMemsLibraryIntegration.cpp','expert/IaMemsLibraryBridgeSelfTest.cpp','expert/bridge-selftest/CMakeLists.txt','memslibrary/include/MEMSLibrary.h')
          $hashes=@{}
          foreach($f in $files){ if(-not(Test-Path $f)){throw "Missing source $f"}; $hashes[$f]=(Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant() }
          $hashes | ConvertTo-Json | Set-Content source-hashes-before.json -Encoding UTF8
          Write-Host 'DIRECT_SOURCE_NO_PATCH_PASS'

      - name: Setup Python and Qt tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt 5.15.2 MSVC x64 and validation tools
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0" pefile
          $sevenZip=(Get-Command 7z.exe -ErrorAction Stop).Source
          if(Test-Path C:\Qt){Remove-Item C:\Qt -Recurse -Force -ErrorAction SilentlyContinue}
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtcharts -O C:\Qt --external "$sevenZip"
          if($LASTEXITCODE -ne 0){throw "Qt install failed $LASTEXITCODE"}

      - name: Download pinned ONNX Runtime development files
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $genaiArchive=Join-Path $env:RUNNER_TEMP "onnxruntime-genai-$env:ORT_GENAI_VERSION-win-x64.zip"
          $ortArchive=Join-Path $env:RUNNER_TEMP "onnxruntime-win-x64-$env:ORT_VERSION.zip"
          $genaiExtract=Join-Path $env:RUNNER_TEMP 'genai'
          $ortExtract=Join-Path $env:RUNNER_TEMP 'ort'
          curl.exe -L --fail --retry 3 --retry-all-errors --retry-delay 2 -o $genaiArchive "https://github.com/microsoft/onnxruntime-genai/releases/download/v$env:ORT_GENAI_VERSION/onnxruntime-genai-$env:ORT_GENAI_VERSION-win-x64.zip"
          if($LASTEXITCODE -ne 0){throw 'GenAI download failed'}
          curl.exe -L --fail --retry 3 --retry-all-errors --retry-delay 2 -o $ortArchive "https://github.com/microsoft/onnxruntime/releases/download/v$env:ORT_VERSION/onnxruntime-win-x64-$env:ORT_VERSION.zip"
          if($LASTEXITCODE -ne 0){throw 'ORT download failed'}
          if((Get-FileHash $genaiArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:ORT_GENAI_WIN_X64_SHA256){throw 'GenAI SHA mismatch'}
          if((Get-FileHash $ortArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:ORT_WIN_X64_SHA256){throw 'ORT SHA mismatch'}
          Expand-Archive $genaiArchive $genaiExtract -Force
          Expand-Archive $ortArchive $ortExtract -Force
          $header=Get-ChildItem $genaiExtract -Recurse -File -Filter ort_genai_c.h | Select-Object -First 1
          $lib=Get-ChildItem $genaiExtract -Recurse -File -Filter onnxruntime-genai.lib | Select-Object -First 1
          if(-not $header -or -not $lib){throw 'ONNX development files incomplete'}
          "ORT_GENAI_INCLUDE_DIR=$($header.DirectoryName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ORT_GENAI_LIBRARY=$($lib.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download IA base and clean reference from private prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag="mems-build116-candidate-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory base-package,clean-reference,release-input -Force | Out-Null
          gh release download $tag --pattern base-runtime.tar.gz --dir release-input
          if($LASTEXITCODE -ne 0){throw 'IA base release download failed'}
          tar.exe -xzf release-input/base-runtime.tar.gz -C base-package
          if($LASTEXITCODE -ne 0){throw 'IA base archive extraction failed'}
          gh release download $tag --pattern clean-reference.tar.gz --dir release-input
          if($LASTEXITCODE -ne 0){throw 'Clean reference release download failed'}
          tar.exe -xzf release-input/clean-reference.tar.gz -C clean-reference
          if($LASTEXITCODE -ne 0){throw 'Clean V2 reference archive extraction failed'}
          Write-Host 'REGENERATED_RELEASE_INPUTS_STAGED'


      - name: Stage fresh IA runtime and clean reference plus protected Pack001 and corrected DLL
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $catalog=Get-ChildItem clean-reference -Recurse -File -Filter runtime_visual_catalog.json | Select-Object -First 1
          if(-not $catalog){throw 'Regenerated clean runtime catalog missing'}
          $refRoot=$catalog.Directory.FullName
          if(-not(Test-Path (Join-Path $refRoot 'manifest.json'))){throw 'Clean runtime reference manifest missing'}
          "CLEAN_REFERENCE_ROOT=$refRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $baseExe=Get-ChildItem base-package -Recurse -File -Filter ecu_mems_manager.exe | Select-Object -First 1
          if(-not $baseExe){throw 'Regenerated IA base executable missing'}
          "VALIDATED_BASE_ROOT=$($baseExe.Directory.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          function Assert-Artifact($id,$name,$digest){
            $m=gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$id" | ConvertFrom-Json
            if($LASTEXITCODE -ne 0 -or $m.name -ne $name -or $m.digest -ne $digest -or $m.expired){throw "Pinned artifact invalid or expired: $id"}
          }
          Assert-Artifact $env:PACK001_ARTIFACT_ID $env:PACK001_ARTIFACT_NAME $env:PACK001_DIGEST
          Assert-Artifact $env:CORRECTED_DLL_ARTIFACT_ID $env:CORRECTED_DLL_ARTIFACT_NAME $env:CORRECTED_DLL_DIGEST
          gh run download $env:PACK001_RUN_ID --repo $env:GITHUB_REPOSITORY --name $env:PACK001_ARTIFACT_NAME --dir pack001
          if($LASTEXITCODE -ne 0){throw 'Validated Pack001 download failed'}
          gh run download $env:CORRECTED_DLL_RUN_ID --repo $env:GITHUB_REPOSITORY --name $env:CORRECTED_DLL_ARTIFACT_NAME --dir corrected-dll
          if($LASTEXITCODE -ne 0){throw 'Validated corrected DLL download failed'}
          $dll=Get-ChildItem corrected-dll -Recurse -File -Filter MEMSLibrary.dll | Select-Object -First 1
          $db=Get-ChildItem pack001 -Recurse -File -Filter knowledge.sqlite | Select-Object -First 1
          if(-not $dll -or -not $db){throw 'Canonical Pack001 or corrected DLL missing'}
          if((Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:CORRECTED_DLL_SHA256){throw 'Corrected DLL hash mismatch'}
          if((Get-FileHash $db.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:PACK001_SQLITE_SHA256){throw 'Canonical Pack001 SQLite hash mismatch'}
          "MEMSLIBRARY_DLL_SOURCE=$($dll.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PACK001_SOURCE_ROOT=$($db.Directory.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'PINNED_INPUTS_PASS fresh_ia=1 clean_v2=1 protected_pack001=1 corrected_dll=1'

      - name: Validate clean reference before compilation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:REF=$env:CLEAN_REFERENCE_ROOT
          @'
          import json,os
          from pathlib import Path
          r=Path(os.environ['REF'])
          c=json.loads((r/'runtime_visual_catalog.json').read_text(encoding='utf-8'))
          assert c['source_lineage']=='RAVEMEMS_V2_FINAL_33810202288'
          assert c['source_run_id']==33810202288
          assert c['entry_count']==1667
          assert c['legacy_entries']==0 and c['pre_v2_images_included']==0
          assert not (r/'images'/'rave').exists()
          assert all(e.get('source_lineage')=='RAVEMEMS_V2_FINAL_33810202288' for e in c['entries'])
          assert all(e.get('source_run_id')==33810202288 for e in c['entries'])
          assert all(e.get('source_type')=='ravemems' for e in c['entries'])
          text=(r/'runtime_visual_catalog.json').read_text(encoding='utf-8')
          for bad in ('33510951021','33524210118','ravemems-runtime-migration-simulation','ravemems-visual-bundle-audit'):
              assert bad not in text
          rows=[e for e in c['entries'] if e.get('publication_code')=='RCL0193ENG' and e.get('physical_page')==53]
          keys={e.get('asset_entity_key') for e in rows}
          assert {'VIS_P0053_001','VIS_P0053_002'} <= keys
          print('CLEAN_REFERENCE_V2_PASS visuals=1667 legacy=0 p53_visuals=2')
          '@ | python -

      - name: Validate protocol guards
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python librosco-x64/validate_protocol_guards.py

      - name: Configure and compile current direct source
        shell: pwsh
        env:
          GITHUB_SHA: 00b630096c5feb8ffa0a5a5abe92c78c5bf21ac6
        run: |
          $ErrorActionPreference='Stop'
          cmake -S . -B build-x64 -A x64 `
            -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/msvc2019_64" `
            -DMEMS_USE_BUNDLED_LIBROSCO_X64=ON `
            -DMEMS_RUN_REFERENCE_SELFTEST_POST_BUILD=OFF `
            -DMEMS_USE_ONNX_GENAI=ON `
            "-DORT_GENAI_INCLUDE_DIR=$env:ORT_GENAI_INCLUDE_DIR" `
            "-DORT_GENAI_LIBRARY=$env:ORT_GENAI_LIBRARY"
          if($LASTEXITCODE -ne 0){throw "CMake configure failed $LASTEXITCODE"}
          cmake --build build-x64 --config Release --target ecu_mems_manager ecu_mems_uninstaller rosco_abi_selftest ia_response_selftest ia_mems_diagram_selftest --parallel
          if($LASTEXITCODE -ne 0){throw "Compile failed $LASTEXITCODE"}
          cmake -S expert/bridge-selftest -B build-bridge-test -A x64 -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/msvc2019_64"
          if($LASTEXITCODE -ne 0){throw "Bridge self-test configure failed $LASTEXITCODE"}
          cmake --build build-bridge-test --config Release --parallel
          if($LASTEXITCODE -ne 0){throw "Bridge self-test build failed $LASTEXITCODE"}

      - name: Prove build did not transform source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $before=Get-Content source-hashes-before.json -Raw | ConvertFrom-Json
          foreach($p in $before.PSObject.Properties){
            $now=(Get-FileHash $p.Name -Algorithm SHA256).Hash.ToLowerInvariant()
            if($now -ne [string]$p.Value){throw "Source changed during build: $($p.Name)"}
          }
          Write-Host 'SOURCE_UNCHANGED_AFTER_BUILD_PASS'

      - name: Stage clean runtime inputs for self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $release='${{ github.workspace }}\build-x64\Release'
          $ref=Join-Path $release 'database\reference'
          if(Test-Path $ref){Remove-Item $ref -Recurse -Force}
          New-Item -ItemType Directory -Force -Path (Split-Path $ref -Parent) | Out-Null
          Copy-Item $env:CLEAN_REFERENCE_ROOT $ref -Recurse -Force
          Copy-Item $env:MEMSLIBRARY_DLL_SOURCE (Join-Path $release 'MEMSLibrary.dll') -Force
          $pack=Join-Path $release 'MEMSLibrary_Pack_001'
          if(Test-Path $pack){Remove-Item $pack -Recurse -Force}
          Copy-Item $env:PACK001_SOURCE_ROOT $pack -Recurse -Force

      - name: Run deterministic source self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $qt='C:\Qt\5.15.2\msvc2019_64'
          $env:PATH="$qt\bin;$env:PATH"
          $env:QT_PLUGIN_PATH="$qt\plugins"
          & '${{ github.workspace }}\build-x64\Release\ia_response_selftest.exe'
          if($LASTEXITCODE -ne 0){throw 'IA response self-test failed'}
          & '${{ github.workspace }}\build-x64\Release\ia_mems_diagram_selftest.exe'
          if($LASTEXITCODE -ne 0){throw 'IA diagram self-test failed'}
          & '${{ github.workspace }}\build-bridge-test\Release\ia_memslibrary_bridge_selftest.exe' $env:MEMSLIBRARY_DLL_SOURCE $env:PACK001_SOURCE_ROOT $env:CLEAN_REFERENCE_ROOT
          if($LASTEXITCODE -ne 0){throw 'Filtered MEMSLibrary bridge self-test failed'}
          ctest --test-dir build-x64/librosco-x64 -C Release --output-on-failure -R rosco_abi_selftest
          if($LASTEXITCODE -ne 0){throw 'ROSCO ABI self-test failed'}

      - name: Assemble BUILD package from validated IA runtime plus clean data
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dist='${{ github.workspace }}\dist-x64'
          if(Test-Path $dist){Remove-Item $dist -Recurse -Force}
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "$env:VALIDATED_BASE_ROOT\*" $dist -Recurse -Force
          Copy-Item '${{ github.workspace }}\build-x64\Release\ecu_mems_manager.exe' "$dist\ecu_mems_manager.exe" -Force
          Copy-Item '${{ github.workspace }}\build-x64\Release\ecu_mems_uninstaller.exe' "$dist\ecu_mems_uninstaller.exe" -Force
          Copy-Item '${{ github.workspace }}\build-x64\librosco-x64\Release\mems_manager_x64.dll' "$dist\mems_manager_x64.dll" -Force
          $ref="$dist\database\reference"
          if(Test-Path $ref){Remove-Item $ref -Recurse -Force}
          New-Item -ItemType Directory -Force -Path (Split-Path $ref -Parent) | Out-Null
          Copy-Item $env:CLEAN_REFERENCE_ROOT $ref -Recurse -Force
          Copy-Item $env:MEMSLIBRARY_DLL_SOURCE "$dist\MEMSLibrary.dll" -Force
          $pack="$dist\MEMSLibrary_Pack_001"
          if(Test-Path $pack){Remove-Item $pack -Recurse -Force}
          Copy-Item $env:PACK001_SOURCE_ROOT $pack -Recurse -Force
          $qt='C:\Qt\5.15.2\msvc2019_64'
          & "$qt\bin\windeployqt.exe" --release --compiler-runtime --no-translations --dir $dist "$dist\ecu_mems_manager.exe"
          if($LASTEXITCODE -ne 0){throw 'windeployqt app failed'}
          & "$qt\bin\windeployqt.exe" --release --compiler-runtime --no-translations --dir $dist "$dist\ecu_mems_uninstaller.exe"
          if($LASTEXITCODE -ne 0){throw 'windeployqt uninstaller failed'}
          @(
            "ECU MEMS Manager BUILD #$env:MEMS_BUILD / v1.0.$env:MEMS_BUILD",
            'IA scroll vertical: direct C++ source',
            'Voir le schema: direct C++ source with evidence routing',
            'MEMSLibrary Pack001: canonical run 33847448261 / SQLite unchanged',
            'MEMSLibrary DLL provenance fix: validated run 33953367833',
            'Active manufacturer visual data: final V2 run 33810202288 only',
            'Pre-V2 RAVE images active: 0',
            'ROSCO / Leopold / Haro / ECU analysis reference data preserved by clean-reference audit run 33919306584',
            'No source patch or build-time source injection'
          ) | Set-Content "$dist\README_BUILD$env:MEMS_BUILD.txt" -Encoding UTF8
          "DIST=$dist" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate complete clean BUILD package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:DIST_ROOT=$env:DIST
          @'
          import hashlib,json,os,sqlite3
          from pathlib import Path
          import pefile
          root=Path(os.environ['DIST_ROOT'])
          required=[root/'ecu_mems_manager.exe',root/'mems_manager_x64.dll',root/'MEMSLibrary.dll',root/'MEMSLibrary_Pack_001'/'knowledge.sqlite',root/'MEMSLibrary_Pack_001'/'manifest.json',root/'database'/'reference'/'runtime_visual_catalog.json']
          miss=[str(x) for x in required if not x.is_file()]
          assert not miss,miss
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          assert sha(root/'MEMSLibrary.dll')==os.environ['CORRECTED_DLL_SHA256']
          assert sha(root/'MEMSLibrary_Pack_001'/'knowledge.sqlite')==os.environ['PACK001_SQLITE_SHA256']
          ref=root/'database'/'reference'
          cat=json.loads((ref/'runtime_visual_catalog.json').read_text(encoding='utf-8'))
          assert cat['source_lineage']=='RAVEMEMS_V2_FINAL_33810202288' and cat['entry_count']==1667
          assert cat['legacy_entries']==0 and cat['pre_v2_images_included']==0
          assert not (ref/'images'/'rave').exists()
          db=sqlite3.connect(root/'MEMSLibrary_Pack_001'/'knowledge.sqlite')
          try:
              assert db.execute('pragma integrity_check').fetchone()[0]=='ok'
              assert db.execute('pragma foreign_key_check').fetchall()==[]
              assert db.execute('select count(*) from ravemems_document').fetchone()[0]==47
              assert db.execute('select count(*) from ravemems_page').fetchone()[0]==1359
              assert db.execute('select count(*) from memslibrary_search').fetchone()[0]==5453
          finally: db.close()
          for p in (root/'ecu_mems_manager.exe',root/'mems_manager_x64.dll',root/'MEMSLibrary.dll'):
              pe=pefile.PE(str(p),fast_load=True); assert pe.FILE_HEADER.Machine==0x8664,p; pe.close()
          print('CLEAN_BUILD_PACKAGE_PASS visuals=1667 legacy=0 docs=47 pages=1359 search=5453 corrected_dll=1')
          '@ | python -

      - name: Smoke launch clean BUILD package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p=Start-Process -FilePath "$env:DIST\ecu_mems_manager.exe" -WorkingDirectory $env:DIST -PassThru
          Start-Sleep -Seconds 8
          if($p.HasExited){throw "Application exited during smoke launch: $($p.ExitCode)"}
          $null=$p.CloseMainWindow(); if(-not $p.WaitForExit(5000)){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          Write-Host "BUILD_$env:MEMS_BUILD_SMOKE_PASS"

      - name: Generate package hashes
        shell: pwsh
        run: |
          $hashFile=Join-Path $env:DIST ("BUILD"+$env:MEMS_BUILD+"_SHA256.txt")
          $lines=foreach($f in Get-ChildItem $env:DIST -Recurse -File | Where-Object{$_.FullName-ne$hashFile} | Sort-Object FullName){$r=$f.FullName.Substring($env:DIST.Length+1).Replace('\','/'); "$((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $r"}
          $lines | Set-Content $hashFile -Encoding UTF8

      - name: Publish validated portable ECU MEMS Manager BUILD116
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $archive=Join-Path $env:RUNNER_TEMP 'ECU-MEMS-Manager-x64-BUILD116-CLEAN-V2.tar.gz'
          tar.exe -czf $archive -C dist-x64 .
          if($LASTEXITCODE -ne 0){throw 'Portable x64 archive creation failed'}
          gh release upload "mems-build116-candidate-$env:GITHUB_RUN_ID" $archive
          if($LASTEXITCODE -ne 0){throw 'Portable x64 publishing failed'}
          Write-Host "PORTABLE_X64_PUBLISHED sha256=$((Get-FileHash $archive -Algorithm SHA256).Hash)"


      - name: Create Windows Setup installer from validated x64 package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          choco install innosetup -y --no-progress --limit-output
          if($LASTEXITCODE -ne 0){throw 'Inno Setup installation failed'}
          $compiler=Get-ChildItem "${env:ProgramFiles(x86)}" -Recurse -File -Filter ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $compiler){throw 'Inno Setup compiler missing'}
          $root=$env:DIST.Replace('\','\\')
          $iss=@'
          #define MyAppName "ECU MEMS Manager - TEST 116"
          #define MyAppVersion "1.0.116"
          [Setup]
          AppId={{FDBAA74F-2FD8-4FD1-A1E3-ECF617EBE03B}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher=ECU MEMS Manager
          DefaultDirName={autopf}\ECU MEMS Manager TEST 116
          DefaultGroupName=ECU MEMS Manager TEST 116
          OutputDir=setup-output
          OutputBaseFilename=ECU-MEMS-Manager-Setup-v1.0.116-TEST
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          PrivilegesRequired=admin
          UninstallDisplayIcon={app}\ecu_mems_manager.exe
          [Languages]
          Name: "french"; MessagesFile: "compiler:Languages\French.isl"
          [Files]
          Source: "dist-x64\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\ECU MEMS Manager"; Filename: "{app}\ecu_mems_manager.exe"
          [Run]
          Filename: "{app}\ecu_mems_manager.exe"; Description: "Démarrer ECU MEMS Manager"; Flags: nowait postinstall skipifsilent
          '@
          $iss | Set-Content setup.iss -Encoding UTF8
          & $compiler.FullName setup.iss
          if($LASTEXITCODE -ne 0){throw 'Inno Setup compilation failed'}
          $exe=Get-ChildItem setup-output -File -Filter *.exe | Select-Object -First 1
          if(-not $exe){throw 'Setup executable not generated'}
          Write-Host "SETUP_GENERATED size=$($exe.Length) sha256=$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash)"
      
      - name: Publish tested Windows Setup to private prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $exe=Get-ChildItem setup-output -File -Filter *.exe | Select-Object -First 1
          if(-not $exe){throw 'Windows Setup binary missing'}
          gh release upload "mems-build116-candidate-$env:GITHUB_RUN_ID" $exe.FullName
          if($LASTEXITCODE -ne 0){throw 'Publishing Setup binary failed'}
          Write-Host "WINDOWS_SETUP_PUBLISHED size=$($exe.Length) sha256=$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash)"
