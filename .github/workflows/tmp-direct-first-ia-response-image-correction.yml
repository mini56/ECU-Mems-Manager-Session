              QString referenceText = response;
              referenceText.replace(QStringLiteral("\\\\:"), QStringLiteral(":"));
              referenceText.replace(QLatin1Char('\\\\'), QLatin1Char('/'));
          '''
          replacement = r'''QString canonicalResponseReferenceText(QString text)
          {
              for (const QString &escaped : {
                       QStringLiteral(":"), QStringLiteral("_"), QStringLiteral("*"),
                       QStringLiteral("["), QStringLiteral("]"), QStringLiteral("("),
                       QStringLiteral(")"), QStringLiteral("#"), QStringLiteral("+"),
                       QStringLiteral("-"), QStringLiteral(".")}) {
                  text.replace(QStringLiteral("\\") + escaped, escaped);
              }
              text.replace(QLatin1Char('\\'), QLatin1Char('/'));
              return text;
          }

          QString manifestShaForPath(const QJsonValue &value, const QString &relativePath)
          {
              if (value.isObject()) {
                  const QJsonObject object = value.toObject();
                  if (object.value(QStringLiteral("path")).toString()
                          .compare(relativePath, Qt::CaseInsensitive) == 0) {
                      const QString sha = object.value(QStringLiteral("sha256")).toString().trimmed();
                      if (!sha.isEmpty())
                          return sha;
                  }
                  for (auto it = object.constBegin(); it != object.constEnd(); ++it) {
                      const QString sha = manifestShaForPath(it.value(), relativePath);
                      if (!sha.isEmpty())
                          return sha;
                  }
              } else if (value.isArray()) {
                  const QJsonArray array = value.toArray();
                  for (const QJsonValue &item : array) {
                      const QString sha = manifestShaForPath(item, relativePath);
                      if (!sha.isEmpty())
                          return sha;
                  }
              }
              return QString();
          }

          bool manifestAssetForStructuredKey(const QJsonValue &value,
                                             const QString &structuredKey,
                                             QString *relativePath,
                                             QString *sha256)
          {
              if (!value.isObject() && !value.isArray())
                  return false;
              if (value.isObject()) {
                  const QJsonObject object = value.toObject();
                  for (auto it = object.constBegin(); it != object.constEnd(); ++it) {
                      if (it.key().compare(structuredKey, Qt::CaseInsensitive) == 0
                          && it.value().isObject()) {
                          const QJsonObject asset = it.value().toObject();
                          const QString path = asset.value(QStringLiteral("path")).toString().trimmed();
                          if (!path.isEmpty()) {
                              if (relativePath)
                                  *relativePath = path;
                              if (sha256)
                                  *sha256 = asset.value(QStringLiteral("sha256")).toString().trimmed();
                              return true;
                          }
                      }
                      if (manifestAssetForStructuredKey(it.value(), structuredKey,
                                                        relativePath, sha256))
                          return true;
                  }
              } else {
                  for (const QJsonValue &item : value.toArray()) {
                      if (manifestAssetForStructuredKey(item, structuredKey,
                                                        relativePath, sha256))
                          return true;
                  }
              }
              return false;
          }

          IaMemsDiagramSuggestion manifestSuggestionForResponse(const QString &referenceText,
                                                                 const QString &root)
          {
              QFile manifest(QDir(root).filePath(QStringLiteral("manifest.json")));
              if (!manifest.open(QIODevice::ReadOnly))
                  return IaMemsDiagramSuggestion();

              QJsonParseError parseError;
              const QJsonDocument document = QJsonDocument::fromJson(manifest.readAll(), &parseError);
              if (parseError.error != QJsonParseError::NoError || !document.isObject())
                  return IaMemsDiagramSuggestion();

              const QJsonObject manifestRoot = document.object();
              const QJsonObject diagrams = manifestRoot.value(QStringLiteral("diagrams")).toObject();

              const auto resolveManifestPath = [&](const QString &requestedPath,
                                                   const QString &fallbackKey,
                                                   const QString &declaredSha) {
                  QString key = fallbackKey;
                  QString path;
                  for (auto it = diagrams.constBegin(); it != diagrams.constEnd(); ++it) {
                      if (it.value().toString().compare(requestedPath, Qt::CaseInsensitive) == 0) {
                          key = it.key().trimmed();
                          path = it.value().toString().trimmed();
                          break;
                      }
                  }
                  if (path.isEmpty() && !fallbackKey.isEmpty())
                      path = requestedPath;
                  if (key.trimmed().isEmpty() || path.trimmed().isEmpty())
                      return IaMemsDiagramSuggestion();

                  const IaMemsDiagramSuggestion candidate =
                      resolvePath(root, key, QDir::cleanPath(path), true);
                  if (!candidate.isValid())
                      return IaMemsDiagramSuggestion();

                  QString sha = declaredSha.trimmed();
                  if (sha.isEmpty())
                      sha = manifestShaForPath(QJsonValue(manifestRoot), path);
                  if (!sha.isEmpty() && !fileMatchesSha256(candidate.absolutePath, sha))
                      return IaMemsDiagramSuggestion();
                  return candidate;
              };

              const QRegularExpression structuredRx(
                  QStringLiteral("(?:^|[^A-Za-z0-9_])rave\\s*:\\s*([A-Za-z0-9_-]+)\\s*:\\s*pdf\\s*:\\s*([0-9]+)"),
                  QRegularExpression::CaseInsensitiveOption);
              QRegularExpressionMatchIterator structuredMatches = structuredRx.globalMatch(referenceText);
              while (structuredMatches.hasNext()) {
                  const QRegularExpressionMatch match = structuredMatches.next();
                  const QString structuredKey = QStringLiteral("rave:%1:PDF:%2")
                      .arg(match.captured(1)).arg(match.captured(2).toInt());
                  QString path;
                  QString sha;
                  if (manifestAssetForStructuredKey(QJsonValue(manifestRoot), structuredKey,
                                                    &path, &sha)) {
                      const IaMemsDiagramSuggestion candidate =
                          resolveManifestPath(path, structuredKey, sha);
                      if (candidate.isValid())
                          return candidate;
                  }
              }

              const QRegularExpression pathRx(
                  QStringLiteral("(images/[A-Za-z0-9_./-]+\\.(?:png|svg|jpe?g|webp))"),
                  QRegularExpression::CaseInsensitiveOption);
              QRegularExpressionMatchIterator pathMatches = pathRx.globalMatch(referenceText);
              while (pathMatches.hasNext()) {
                  const QString requestedPath = QDir::cleanPath(pathMatches.next().captured(1));
                  const IaMemsDiagramSuggestion candidate =
                      resolveManifestPath(requestedPath, QString(), QString());
                  if (candidate.isValid())
                      return candidate;
              }
              return IaMemsDiagramSuggestion();
          }

          IaMemsDiagramSuggestion runtimeSuggestionForResponse(const QString &response,
                                                                const QString &root)
          {
              IaMemsDiagramSuggestion none;
              const QString referenceText = canonicalResponseReferenceText(response);
          '''
