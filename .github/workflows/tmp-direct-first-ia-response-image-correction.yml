name: TEMP direct first IA response image correction
on:
  push:
    paths:
      - '.github/workflows/tmp-direct-first-ia-response-image-correction.yml'
jobs:
  edit-source:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-ravemems-ia-visual-integration
          fetch-depth: 0
      - name: Edit source directly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) IA knowledge retrieval: bounded typo tolerance + intent-aware concise excerpts.
          path = 'expert/IaMemsService.cpp'
          old = r'''bool knowledgeTermMatches(const QString &text, const QString &term)
          {
              static const QSet<QString> tokenTerms = {
                  QStringLiteral("ect"), QStringLiteral("iat"), QStringLiteral("map"),
                  QStringLiteral("tps"), QStringLiteral("ckp"), QStringLiteral("cmp"),
                  QStringLiteral("iac"), QStringLiteral("iacv"), QStringLiteral("obd"),
                  QStringLiteral("spi"), QStringLiteral("mpi"), QStringLiteral("rpm"),
                  QStringLiteral("pin")
              };
              if (tokenTerms.contains(term) || term.size() <= 3)
                  return containsWord(text, term);
              return text.contains(term);
          }
          '''
          new = r'''int boundedEditDistance(const QString &left, const QString &right, int maximum)
          {
              if (qAbs(left.size() - right.size()) > maximum)
                  return maximum + 1;

              QVector<int> previous(right.size() + 1);
              QVector<int> current(right.size() + 1);
              for (int j = 0; j <= right.size(); ++j)
                  previous[j] = j;

              for (int i = 1; i <= left.size(); ++i) {
                  current[0] = i;
                  int rowMinimum = current[0];
                  for (int j = 1; j <= right.size(); ++j) {
                      const int substitution = previous[j - 1]
                          + (left.at(i - 1) == right.at(j - 1) ? 0 : 1);
                      current[j] = qMin(qMin(previous[j] + 1, current[j - 1] + 1), substitution);
                      rowMinimum = qMin(rowMinimum, current[j]);
                  }
                  if (rowMinimum > maximum)
                      return maximum + 1;
                  previous.swap(current);
              }
              return previous[right.size()];
          }

          bool fuzzyKnowledgeTokenMatch(const QString &text, const QString &term)
          {
              if (term.size() < 5 || term.contains(QRegularExpression(QStringLiteral("[^a-z]"))))
                  return false;

              const int maximum = term.size() >= 9 ? 2 : 1;
              const QRegularExpression wordRx(QStringLiteral("[a-z]+"));
              QRegularExpressionMatchIterator it = wordRx.globalMatch(text);
              while (it.hasNext()) {
                  const QString candidate = it.next().captured(0);
                  if (qAbs(candidate.size() - term.size()) > maximum)
                      continue;
                  if (boundedEditDistance(candidate, term, maximum) <= maximum)
                      return true;
              }
              return false;
          }

          bool knowledgeTermMatches(const QString &text, const QString &term)
          {
              static const QSet<QString> tokenTerms = {
                  QStringLiteral("ect"), QStringLiteral("iat"), QStringLiteral("map"),
                  QStringLiteral("tps"), QStringLiteral("ckp"), QStringLiteral("cmp"),
                  QStringLiteral("iac"), QStringLiteral("iacv"), QStringLiteral("obd"),
                  QStringLiteral("spi"), QStringLiteral("mpi"), QStringLiteral("rpm"),
                  QStringLiteral("pin")
              };
              if (tokenTerms.contains(term) || term.size() <= 3)
                  return containsWord(text, term);
              if (text.contains(term))
                  return true;
              return fuzzyKnowledgeTokenMatch(text, term);
          }
          '''
          replace_once(path, old, new)

          old = r'''bool hasPinoutEvidence(const QString &text)
          {
              return text.contains(QStringLiteral("wiring"))
          '''
          new = r'''bool hasDirectConnectorEvidence(const QString &text)
