              }
              return QString();
          }

          int focusedSegmentScore(const QString &segment,
                                  const QStringList &specificTerms,
                                  KnowledgeQueryKind kind,
                                  bool asksTorque)
          {
              const QString text = normalized(segment);
              int score = 0;
              for (const QString &term : specificTerms) {
                  if (knowledgeTermMatches(text, term))
                      score += term.size() >= 5 ? 8 : 5;
              }
              if (kind == KnowledgeQueryKind::Pinout) {
                  if (hasDirectConnectorEvidence(segment))
                      score += 28;
                  else if (hasPinoutEvidence(text))
                      score += 4;
              }
              if (asksTorque && IaMemsConversationRouting::hasTorqueEvidence(text))
                  score += 24;
              if (segment.size() <= 260)
                  score += 3;
              else if (segment.size() > 700)
                  score -= 8;
              return score;
          }

          QString focusedKnowledgeStatement(const QString &statement,
                                            const QStringList &specificTerms,
                                            KnowledgeQueryKind kind,
                                            bool asksTorque,
                                            bool procedureIntent)
          {
              const QString trimmed = statement.trimmed();
              if (trimmed.size() <= 420 || procedureIntent)
                  return trimmed;

              QStringList lines;
              const QStringList rawLines = trimmed.split(
                  QRegularExpression(QStringLiteral("[\\r\\n]+")), Qt::SkipEmptyParts);
              for (const QString &rawLine : rawLines) {
                  const QString line = rawLine.trimmed();
                  if (!line.isEmpty())
                      lines.append(line);
              }
              if (lines.isEmpty())
                  return trimmed;

              QString best;
              int bestScore = -100000;
              for (int i = 0; i < lines.size(); ++i) {
                  const QString single = lines.at(i);
                  const int singleScore = focusedSegmentScore(single, specificTerms, kind, asksTorque);
                  if (singleScore > bestScore) {
                      bestScore = singleScore;
                      best = single;
                  }
                  if (i + 1 < lines.size()
                      && single.size() + lines.at(i + 1).size() <= 420) {
                      const QString pair = single + QLatin1Char(' ') + lines.at(i + 1);
                      const int pairScore = focusedSegmentScore(pair, specificTerms, kind, asksTorque);
                      if (pairScore > bestScore) {
                          bestScore = pairScore;
                          best = pair;
                      }
                  }
              }

              if (bestScore < 8 || best.trimmed().isEmpty())
                  return trimmed;

              const QString visual = firstVisualReferenceLine(trimmed);
              if (!visual.isEmpty() && !best.contains(visual))
                  best += QLatin1Char('\n') + visual;
              return best;
          }

