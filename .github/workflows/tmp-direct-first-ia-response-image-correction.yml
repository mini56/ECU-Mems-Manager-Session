                                     KnowledgeQueryKind kind,
                                     bool asksTorque)
          {
              if (kind == KnowledgeQueryKind::Pinout)
                  return hasDirectConnectorEvidence(statement);
              if (asksTorque)
                  return IaMemsConversationRouting::hasTorqueEvidence(normalized(statement));
              return false;
          }

