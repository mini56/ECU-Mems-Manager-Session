          helper = r'''class IaMemsDiagramView final : public QGraphicsView
          {
          public:
              explicit IaMemsDiagramView(QWidget *parent = nullptr)
                  : QGraphicsView(parent), m_scene(new QGraphicsScene(this))
              {
                  setScene(m_scene);
                  setAlignment(Qt::AlignCenter);
                  setDragMode(QGraphicsView::ScrollHandDrag);
                  setTransformationAnchor(QGraphicsView::AnchorUnderMouse);
                  setResizeAnchor(QGraphicsView::AnchorViewCenter);
                  setBackgroundBrush(QColor(QStringLiteral("#0a1015")));
              }

              bool loadDiagram(const QString &path)
              {
                  const QPixmap pixmap(path);
                  if (pixmap.isNull())
                      return false;
                  m_scene->clear();
                  m_item = m_scene->addPixmap(pixmap);
                  m_scene->setSceneRect(m_item->boundingRect());
                  m_autoFit = true;
                  QTimer::singleShot(0, this, [this]() { fitDiagram(); });
                  return true;
              }

          protected:
              void resizeEvent(QResizeEvent *event) override
              {
                  QGraphicsView::resizeEvent(event);
                  if (m_autoFit)
                      fitDiagram();
              }

              void wheelEvent(QWheelEvent *event) override
              {
                  if (event->modifiers().testFlag(Qt::ControlModifier)) {
                      m_autoFit = false;
                      const qreal factor = event->angleDelta().y() > 0 ? 1.15 : (1.0 / 1.15);
                      scale(factor, factor);
                      event->accept();
                      return;
                  }
                  QGraphicsView::wheelEvent(event);
              }

          private:
              void fitDiagram()
              {
                  if (!m_item || m_item->boundingRect().isEmpty())
                      return;
                  resetTransform();
                  fitInView(m_item, Qt::KeepAspectRatio);
              }

              QGraphicsScene *m_scene = nullptr;
              QGraphicsPixmapItem *m_item = nullptr;
              bool m_autoFit = true;
          };

