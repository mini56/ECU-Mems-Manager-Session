          helpers = r'''QString firstVisualReferenceLine(const QString &statement)
          {
              const QStringList lines = statement.split(QRegularExpression(QStringLiteral("[\\r\\n]+")),
                                                        Qt::SkipEmptyParts);
              for (const QString &rawLine : lines) {
                  QString line = rawLine.trimmed();
                  QString probe = line;
                  probe.replace(QStringLiteral("\\:"), QStringLiteral(":"));
                  probe.replace(QStringLiteral("\\_"), QStringLiteral("_"));
                  if (probe.contains(QRegularExpression(QStringLiteral("rave\\s*:"),
