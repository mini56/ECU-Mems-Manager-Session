name: TEMP update RAVEMEMS cahier choice limit
on:
  push:
    branches: [RAPPORT]
    paths:
      - '.github/workflows/tmp-update-ravemems-cahier-review-choice-limit.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Update cahier and report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/CAHIER_DES_CHARGES_RAVEMEMS_BROUILLON_2026-09-02.md')
          s = p.read_text(encoding='utf-8')
          old = "Le premier menu doit rester court et utile : quelques choix principaux, puis navigation progressive, puis suggestions connexes éventuelles après la réponse.\n\nLa base peut contenir beaucoup d’informations sans obliger l’utilisateur à tout voir."
          new = "Le premier menu doit rester court et utile : **3 choix maximum**, puis une quatrième option **`4. Autre chose ?`**. L’utilisateur peut donc répondre `1`, `2`, `3` ou `4`. S’il choisit `4`, l’IA lui demande simplement ce qu’il souhaite savoir d’autre afin qu’il puisse formuler librement une autre demande.\n\nLa base peut contenir beaucoup d’informations sans obliger l’utilisateur à tout voir."
          if old not in s:
              raise SystemExit('target cahier text not found')
          p.write_text(s.replace(old,new,1), encoding='utf-8')
          r = Path('RAPPORT_SUIVI_ECU_MEMS_MANAGER.md')
          with r.open('a', encoding='utf-8') as f:
              f.write("\n\n## 2026-09-02 — RELECTURE CAHIER RAVEMEMS — MENU QUESTION GENERALE\n\nDecision utilisateur : pour une demande generale, l IA doit proposer **3 choix maximum**, puis une quatrieme option **`4. Autre chose ?`**. L utilisateur peut choisir `1`, `2`, `3` ou `4`; le choix `4` permet de formuler librement une autre demande au lieu d etre bloque par les trois propositions. Cette regle remplace la formulation precedente `quelques choix principaux`. Aucun code ni extraction RAVEMEMS n est lance pendant cette relecture.\n")
          PY
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name "mini56"
          git config user.email "48644212+mini56@users.noreply.github.com"
          git rm .github/workflows/tmp-update-ravemems-cahier-review-choice-limit.yml
          git add docs/CAHIER_DES_CHARGES_RAVEMEMS_BROUILLON_2026-09-02.md RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git diff --cached --quiet && exit 1
          git commit -m "Record RAVEMEMS three-choice menu rule"
          git push origin HEAD:RAPPORT
