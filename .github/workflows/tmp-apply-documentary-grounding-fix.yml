name: TMP APPLY documentary grounding fix

on:
  push:
    branches: [tmp-build108-memslibrary-relevance-integration]
    paths:
      - '.github/workflows/tmp-apply-documentary-grounding-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-build108-memslibrary-relevance-integration
          fetch-depth: 0

      - name: Fix digit detection in documentary evidence guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('expert/LocalAiClient.cpp')
          text = path.read_text(encoding='utf-8')
          old = 'const bool hasDigit = term.contains(QRegularExpression(QStringLiteral("\\d")));'
          new = 'const bool hasDigit = term.contains(QRegularExpression(QStringLiteral("[0-9]")));'
          if text.count(old) != 1:
              raise SystemExit('Digit guard anchor mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add expert/LocalAiClient.cpp
          git commit -m 'Fix documentary grounding digit guard'
          git push origin HEAD:tmp-build108-memslibrary-relevance-integration
