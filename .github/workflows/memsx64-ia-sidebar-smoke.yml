name: TEMP MEMSX64 IA sidebar click diagnostic

on:
  push:
    branches: [MEMSX64]
    paths:
      - '.github/workflows/memsx64-ia-sidebar-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ia-sidebar-x64-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout MEMSX64
        uses: actions/checkout@v4
        with:
          ref: MEMSX64

      - name: Publish sidebar diagnostic run id
        shell: pwsh
        run: |
          @(
            'MEMSX64 IA SIDEBAR DIAGNOSTIC: STARTED',
            'run_id=${{ github.run_id }}',
            'run_number=${{ github.run_number }}',
            'workflow_commit=${{ github.sha }}',
            ('utc=' + [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))
          ) | Set-Content -Encoding UTF8 IA_X64_SIDEBAR_WORKFLOW_STARTED.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin MEMSX64
          git add IA_X64_SIDEBAR_WORKFLOW_STARTED.txt
          git commit -m "Record IA x64 sidebar diagnostic run [skip ci]"
          git push origin HEAD:MEMSX64

      - name: Inject test-only sidebar selection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          p = Path('iamemstab.cpp')
          s = p.read_text(encoding='utf-8')
          old = '''    if (tabs->currentWidget() == tab)
              navigation->setCurrentRow(insertRow);
          }'''
          new = '''    if (tabs->currentWidget() == tab)
              navigation->setCurrentRow(insertRow);
          if (qEnvironmentVariableIsSet("MEMS_SMOKE_CLICK_IA")
              && !navigation->property("iaSmokeClickScheduled").toBool()) {
              navigation->setProperty("iaSmokeClickScheduled", true);
              QPointer<QListWidget> navGuard(navigation);
              QTimer::singleShot(8000, navigation, [navGuard]() {
                  if (!navGuard)
                      return;
                  for (int row = 0; row < navGuard->count(); ++row) {
                      if (navGuard->item(row)->text().trimmed() == QStringLiteral("IA MEMS")) {
                          navGuard->setCurrentRow(row);
                          return;
                      }
                  }
              });
          }
          }'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected one IA navigation insertion point, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          '@ | python -

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt installer
        shell: pwsh
        run: python -m pip install --disable-pip-version-check aqtinstall

      - name: Install Qt 5.15.2 MSVC 2019 x64
        shell: pwsh
        run: python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtcharts -O C:\Qt

      - name: Configure diagnostic x64 build
        shell: pwsh
        run: |
          cmake -S . -B build-ia-sidebar-x64 -A x64 `
            -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/msvc2019_64" `
            -DMEMS_USE_BUNDLED_LIBROSCO_X64=ON `
            -DMEMS_RUN_REFERENCE_SELFTEST_POST_BUILD=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build diagnostic x64 application
        shell: pwsh
        run: |
          cmake --build build-ia-sidebar-x64 --config Release --target ecu_mems_manager
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtBin = 'C:\Qt\5.15.2\msvc2019_64\bin'
          $build = '${{ github.workspace }}\build-ia-sidebar-x64'
          $dist = '${{ github.workspace }}\dist-ia-sidebar-x64'
          if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
          New-Item -ItemType Directory -Path $dist | Out-Null
          Copy-Item (Join-Path $build 'Release\ecu_mems_manager.exe') (Join-Path $dist 'ecu_mems_manager.exe') -Force
          Copy-Item (Join-Path $build 'librosco-x64\Release\mems_manager_x64.dll') (Join-Path $dist 'mems_manager_x64.dll') -Force
          & (Join-Path $qtBin 'windeployqt.exe') --release --compiler-runtime --no-translations --dir $dist (Join-Path $dist 'ecu_mems_manager.exe')
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed: $LASTEXITCODE" }
          Copy-Item (Join-Path $build 'Release\translations') (Join-Path $dist 'translations') -Recurse -Force
          Copy-Item (Join-Path $build 'Release\database') (Join-Path $dist 'database') -Recurse -Force

      - name: Click IA through sidebar and capture crash
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $dist = '${{ github.workspace }}\dist-ia-sidebar-x64'
          $exe = Join-Path $dist 'ecu_mems_manager.exe'
          $result = Join-Path $dist 'IA_X64_SIDEBAR_RESULT.txt'
          $events = Join-Path $dist 'IA_X64_SIDEBAR_EVENTS.txt'
          $env:MEMS_SMOKE_CLICK_IA = '1'
          $start = Get-Date
          $proc = Start-Process $exe -WorkingDirectory $dist -PassThru
          Start-Sleep -Seconds 30
          $proc.Refresh()
          if ($proc.HasExited) {
            $hex = ('0x{0:X8}' -f ([uint32]$proc.ExitCode))
            @('IA_X64_SIDEBAR=CRASH',('exit_code=' + $proc.ExitCode),('exit_code_hex=' + $hex)) | Set-Content -Encoding UTF8 $result
          } else {
            @('IA_X64_SIDEBAR=PASS','alive_after_seconds=30') | Set-Content -Encoding UTF8 $result
            Stop-Process -Id $proc.Id -Force
          }
          try {
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$start} -ErrorAction Stop |
              Where-Object { $_.ProviderName -in @('Application Error','Windows Error Reporting','.NET Runtime') -or $_.Message -match 'ecu_mems_manager|llama-server' } |
              Select-Object TimeCreated, ProviderName, Id, LevelDisplayName, Message |
              Format-List | Out-String -Width 240 | Set-Content -Encoding UTF8 $events
          } catch {
            ('Event log read failed: ' + $_.Exception.Message) | Set-Content -Encoding UTF8 $events
          }
          Get-Content $result
          if (Test-Path $events) { Get-Content $events }

      - name: Upload sidebar diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memsx64-ia-sidebar-diagnostic
          path: |
            dist-ia-sidebar-x64/IA_X64_SIDEBAR_RESULT.txt
            dist-ia-sidebar-x64/IA_X64_SIDEBAR_EVENTS.txt
          if-no-files-found: warn
