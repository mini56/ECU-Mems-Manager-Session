name: TEMP update RAVEMEMS vehicle choice
on:
  push:
    branches: [RAPPORT]
    paths:
      - '.github/workflows/tmp-update-ravemems-vehicle-choice.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Update cahier and report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/CAHIER_DES_CHARGES_RAVEMEMS_BROUILLON_2026-09-02.md')
          s=p.read_text(encoding='utf-8')
          old="Si plusieurs réponses incompatibles restent possibles, l’IA doit demander la variante nécessaire avant de répondre."
          new="""Si plusieurs réponses incompatibles restent possibles, l’IA doit demander la variante nécessaire avant de répondre. La question ne doit pas enfermer l’utilisateur dans les seules variantes déjà trouvées. Par exemple, si les données disponibles distinguent Mini SPi et Mini MPi, l’IA peut demander : **« Est-ce pour une Mini SPi, une Mini MPi, ou un autre véhicule ? »**. Si l’utilisateur indique un autre véhicule, l’IA lui demande alors les informations nécessaires pour identifier ce véhicule et sa variante."""
          if old not in s:
              raise SystemExit('target text not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          cat >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md <<'EOF'

          ## 2026-09-02 — CAHIER RAVEMEMS — QUESTION VARIANTE / AUTRE VEHICULE

          Décision utilisateur : lorsqu’une question peut concerner plusieurs variantes connues, l’IA ne doit pas enfermer l’utilisateur dans ces seules variantes. Exemple validé : `Est-ce pour une Mini SPi, une Mini MPi, ou un autre véhicule ?`. Si l’utilisateur répond qu’il s’agit d’un autre véhicule, l’IA demande ensuite les informations nécessaires pour identifier ce véhicule et sa variante.

          Cette règle complète la règle précédente : un véhicule connecté ne doit jamais être supposé comme véhicule concerné sans confirmation explicite de l’utilisateur.

          Aucun code, aucune extraction et aucun BUILD lancés ; cahier toujours en relecture.
          EOF
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name "mini56"
          git config user.email "48644212+mini56@users.noreply.github.com"
          git add docs/CAHIER_DES_CHARGES_RAVEMEMS_BROUILLON_2026-09-02.md RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git rm .github/workflows/tmp-update-ravemems-vehicle-choice.yml
          git commit -m "Refine RAVEMEMS vehicle variant question"
          git push origin HEAD:RAPPORT
