name: Verify documentary publisher secret is configured
on:
  push:
    branches: [rave-fr-source-sqlite-20261112]
    paths:
      - '.github/workflows/check-documentary-publisher-secret.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe-secret-without-disclosure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirmer le secret sans révéler son contenu
        shell: bash
        env:
          ADMIN_SECRET: ${{ secrets.MEMS_DOCUMENTARY_PUBLISH_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          if [[ -z "${ADMIN_SECRET}" ]]; then
            echo "PUBLISHER_PASSWORD_SECRET_NOT_CONFIGURED_IN_THIS_REPOSITORY"
            exit 1
          fi
          if [[ "${#ADMIN_SECRET}" -lt 12 ]]; then
            echo "PUBLISHER_PASSWORD_SECRET_TOO_SHORT"
            exit 1
          fi
          python3 - <<'PY'
          import hashlib, os
          secret=os.environ['ADMIN_SECRET'].encode('utf-8')
          assert len(hashlib.pbkdf2_hmac('sha256',secret,b'local-test-only',210000,32))==32
          del secret
          print('PUBLISHER_PASSWORD_SECRET_CONFIGURED_AND_KDF_PASS')
          PY
