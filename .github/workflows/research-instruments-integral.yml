name: Recherche instruments - corpus integral
on:
  push:
    branches: [research/mems-firmwares-20261126]
    paths: ['.github/workflows/research-instruments-integral.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lire les ROM ASM et XF de chaque firmware
        run: python3 research/instruments-integral-20261127/audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: preuves-instruments-483
          path: research/instruments-integral-20261127/results/
      - name: Enregistrer le registre sur la branche de recherche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/instruments-integral-20261127/results
          if ! git diff --cached --quiet; then
            git commit -m "Recherche instruments - preuves individuelles et candidats [skip ci]"
            git push origin HEAD:research/mems-firmwares-20261126
          fi
