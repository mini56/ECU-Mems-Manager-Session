name: TEMP REPORT RCL0193ENG P161-176 SAFE CHECKPOINT

on:
  push:
    branches: [RAPPORT]
    paths:
      - '.github/workflows/temp-report-rcl0193eng-p161-176-safe-checkpoint.yml'

permissions:
  contents: write

jobs:
  append-report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
      - name: Append safe checkpoint
        shell: bash
        run: |
          printf '%s' '' | base64 -d >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
      - name: Commit report and remove helper
        shell: bash
        run: |
          rm -f .github/workflows/temp-report-rcl0193eng-p161-176-safe-checkpoint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md .github/workflows/temp-report-rcl0193eng-p161-176-safe-checkpoint.yml
          git commit -m 'Journal RCL0193ENG p161-176 safe checkpoint'
          git push origin RAPPORT
