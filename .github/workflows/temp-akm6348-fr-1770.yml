name: TEMP AKM6348 FR 1770
on:
  push:
    branches: [tmp-rave-visual-backfill]
    paths:
      - '.github/workflows/temp-akm6348-fr-1770.yml'
permissions:
  contents: write
jobs:
  build_and_commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-rave-visual-backfill
          fetch-depth: 0
      - name: Verify production remains BUILD 101
        shell: bash
        run: |
          git fetch origin MEMSX64
          test "$(git rev-parse origin/MEMSX64)" = "22dbe75ed14e0a61e694159d505ef72245116b48"
      - name: Generate and validate AKM6348 French batch 1770
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, re, sqlite3, struct, zlib

          reference=Path('database/reference')
          qz=reference/'research_enrichment_1770.qz64'
          audit=reference/'audits/akm6348_fr_1770_source_audit.md'
          manifest_path=reference/'manifest.json'

          sql="""-- AKM 6348 French Mini repair manual - documentary source registration only.
          -- Additive batch 1770. No historical table is modified and no page-level technical fact is promoted without exact physical-page verification.

          BEGIN;

          INSERT INTO mems_applicability_scope
          (scope_key, scope_kind, make, model, engine_family, engine_code, displacement_cc, engine_variant, induction, mems_family, transmission, year_from, year_to, vin_from, vin_to, market, compression_variant, catalyst_state, air_conditioning_state, source_scope_text, notes)
          VALUES
          ('SCOPE-AKM6348-FR-MINI-1976-03-PLUS','vehicle',NULL,'Mini',NULL,NULL,NULL,NULL,NULL,NULL,NULL,1976,NULL,NULL,NULL,NULL,NULL,NULL,NULL,'Mini produites à partir de mars 1976','Portée documentaire issue de l’indexation publique du manuel français AKM 6348. Le mois de début est conservé par contrainte dédiée; aucune variante moteur, alimentation, transmission ou marché n’est déduite.');

          INSERT INTO mems_scope_constraint
          (scope_key, dimension, operator, value_text, value_to_text, value_num, value_to_num, unit, source_text)
          VALUES
          ('SCOPE-AKM6348-FR-MINI-1976-03-PLUS','production_date','gte','1976-03',NULL,NULL,NULL,NULL,'Mini produites à partir de mars 1976');

          INSERT INTO mems_knowledge_item
          (knowledge_key, domain, knowledge_type, topic, component_key, source_key, document, source_section, verification_level, legacy_rave_fact_key, source_text, image_ref, notes)
          VALUES
          ('KNOW-DOC-AKM6348-FR','documentation','fact','Manuel de réparation Mini AKM 6348 français',NULL,'SRC-AKM6348-FR-WEB-20260829','AKM 6348 - FRENCH','Identité et portée documentaire - page physique non encore figée','source_externe',NULL,'Manuel de réparation AKM 6348 en français; la représentation publique consultée annonce 328 pages et une couverture des Mini produites à partir de mars 1976.',NULL,'Enregistrement documentaire initial. Aucun fait technique de page n’est ajouté comme vérifié constructeur tant que le PDF exact n’est pas acquis, hashé et cartographié physiquement.');

          INSERT INTO mems_knowledge_scope (knowledge_key, scope_key, applicability)
          VALUES
          ('KNOW-DOC-AKM6348-FR','SCOPE-AKM6348-FR-MINI-1976-03-PLUS','applies');

          INSERT INTO mems_term_alias (entity_type, entity_key, language, alias, normalized_alias) VALUES
          ('topic','KNOW-DOC-AKM6348-FR','fr','AKM 6348','akm 6348'),
          ('topic','KNOW-DOC-AKM6348-FR','fr','AKM6348','akm6348'),
          ('topic','KNOW-DOC-AKM6348-FR','fr','AKM 6348 français','akm 6348 francais'),
          ('topic','KNOW-DOC-AKM6348-FR','fr','manuel atelier Mini français','manuel atelier mini francais'),
          ('topic','KNOW-DOC-AKM6348-FR','fr','manuel de réparation Mini français','manuel de reparation mini francais');

          COMMIT;
          """
          raw=sql.encode('utf-8')
          packed=struct.pack('>I',len(raw))+zlib.compress(raw,9)
          qz_bytes=base64.b64encode(packed)+b'\n'
          assert len(raw)==2715
          assert hashlib.sha256(raw).hexdigest()=='4222b2c99d7030350a06043fee9c80e927f2db6b3131cb7545fed6f0d81e3336'
          assert len(qz_bytes)==1497
          assert hashlib.sha256(qz_bytes).hexdigest()=='0de7f667adda6e4b4770f3c9426ec3cbc7299a9606eff533e2f015690d6b5ca0'
          qz.write_bytes(qz_bytes)

          manifest=json.loads(manifest_path.read_text(encoding='utf-8-sig'))
          batches=manifest['research_enrichment_batches']
          assert batches[-1]=='research_enrichment_1760.qz64'
          assert 'research_enrichment_1770.qz64' not in batches
          batches.append('research_enrichment_1770.qz64')
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          audit.write_text("""# AKM 6348 FR / batch 1770 — source registration audit

          Date: 2026-08-29

          ## Purpose

          Register the French Mini repair manual `AKM 6348 - FRENCH` in the additive knowledge foundation before page-level extraction. This batch does not rewrite historical tables and does not add unverified technical values from individual pages.

          ## Source state

          - Public indexed representation: `Rover Mini Manuel Atelier FR 1991`, Scribd document 935795924.
          - Indexed page count: 328 pages.
          - Indexed scope: Mini produced from March 1976.
          - Direct public PDF URL identified separately: `Rover-Mini-Manuel-atelier-fr.pdf`; HTTP metadata observed a content length of 13,083,374 bytes.
          - Exact PDF SHA-256 and physical-page mapping are not yet pinned in the repository at this stage.

          Because the exact retained binary has not yet been hashed, this first batch uses `verification_level=source_externe`. No page-specific specification, procedure, torque, wiring value or illustration is promoted to `verifie_constructeur` by batch 1770.

          ## Rows added by 1770

          - 1 `mems_applicability_scope`: Mini, year_from 1976, all unspecified axes kept NULL.
          - 1 `mems_scope_constraint`: production date >= `1976-03`.
          - 1 `mems_knowledge_item`: documentary identity/source record.
          - 1 `mems_knowledge_scope` link.
          - 5 French `mems_term_alias` rows for deterministic retrieval.

          ## Payload fingerprints

          - decoded SQL: 2715 bytes — SHA-256 `4222b2c99d7030350a06043fee9c80e927f2db6b3131cb7545fed6f0d81e3336`;
          - final qz64: 1497 bytes — SHA-256 `0de7f667adda6e4b4770f3c9426ec3cbc7299a9606eff533e2f015690d6b5ca0`.

          ## Safety

          Documentary/database only. No ECU communication, protocol, acquisition, RAM, write/reset, Qwen/ONNX, UI or 32-bit behavior is modified. Production `MEMSX64` remains BUILD #101 `22dbe75ed14e0a61e694159d505ef72245116b48`.

          ## Next extraction action

          Acquire/hash the exact French PDF binary, verify its page count/identity, then map and capture useful original pages. Page-level facts and visuals must be linked to exact physical pages and retain their own evidence level. Do not infer a page index from another edition.
          """.replace('          ','').lstrip(),encoding='utf-8')

          def qt_uncompress(payload:bytes)->bytes:
              expected=struct.unpack('>I',payload[:4])[0]
              raw=zlib.decompress(payload[4:])
              assert len(raw)==expected
              return raw
          def decode_qz64(p:Path)->bytes:
              data=p.read_bytes().strip()
              if data and re.fullmatch(rb'[A-Za-z0-9+/=\r\n\t ]+',data):
                  return qt_uncompress(base64.b64decode(data))
              return qt_uncompress(data)
          def execute(db,rawsql):
              clean='\n'.join(x for x in rawsql.decode('utf-8').splitlines() if not x.strip().startswith('--'))+'\n'
              db.executescript(clean)
          def suffix(p:Path):
              m=re.search(r'_(\d+)\.qz64$',p.name,re.I)
              return int(m.group(1)) if m else 0

          tmp=Path('.tmp-akm6348-1770.sqlite')
          if tmp.exists(): tmp.unlink()
          db=sqlite3.connect(str(tmp))
          seeds=sorted(reference.glob('mems_reference_seed_*.qz64'),key=lambda p:(suffix(p),p.name))
          assert seeds
          seed_encoded=b''.join(p.read_bytes().strip() for p in seeds)
          execute(db,qt_uncompress(base64.b64decode(seed_encoded)))
          for name in manifest['research_enrichment_batches']:
              p=reference/name
              assert p.is_file(),name
              if p.name=='research_enrichment_1600.qz64':
                  continue
              execute(db,decode_qz64(p))
          db.execute('PRAGMA user_version=20')
          db.commit()
          assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert db.execute('PRAGMA user_version').fetchone()[0]==20
          assert db.execute('SELECT COUNT(*) FROM mems_rave_fact').fetchone()[0]==93
          assert db.execute('SELECT COUNT(*) FROM mems_expert_fact_external').fetchone()[0]==105
          assert db.execute("SELECT COUNT(*) FROM mems_applicability_scope WHERE scope_key='SCOPE-AKM6348-FR-MINI-1976-03-PLUS'").fetchone()[0]==1
          assert db.execute("SELECT COUNT(*) FROM mems_scope_constraint WHERE scope_key='SCOPE-AKM6348-FR-MINI-1976-03-PLUS'").fetchone()[0]==1
          assert db.execute("SELECT COUNT(*) FROM mems_knowledge_item WHERE knowledge_key='KNOW-DOC-AKM6348-FR'").fetchone()[0]==1
          assert db.execute("SELECT COUNT(*) FROM mems_knowledge_scope WHERE knowledge_key='KNOW-DOC-AKM6348-FR'").fetchone()[0]==1
          assert db.execute("SELECT COUNT(*) FROM mems_term_alias WHERE entity_key='KNOW-DOC-AKM6348-FR'").fetchone()[0]==5
          db.close(); tmp.unlink()
          print('AKM6348_1770_PASS')
          PY
      - name: Guard exact documentary scope
        shell: bash
        run: |
          mapfile -t actual < <(git status --porcelain --untracked-files=all | sed -E 's/^.. //' | sort)
          expected=(
            'database/reference/audits/akm6348_fr_1770_source_audit.md'
            'database/reference/manifest.json'
            'database/reference/research_enrichment_1770.qz64'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          printf 'Actual:\n%s\n' "${actual[*]}"
          test "$(printf '%s\n' "${actual[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
      - name: Commit validated documentary batch and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/reference/research_enrichment_1770.qz64 database/reference/manifest.json database/reference/audits/akm6348_fr_1770_source_audit.md
          git rm .github/workflows/temp-akm6348-fr-1770.yml
          git commit -m 'Register AKM6348 French manual source batch 1770'
          git push origin HEAD:tmp-rave-visual-backfill
      - name: Verify remote committed bytes
        shell: bash
        run: |
          git fetch origin tmp-rave-visual-backfill
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/tmp-rave-visual-backfill)"
          test "$(sha256sum database/reference/research_enrichment_1770.qz64 | awk '{print $1}')" = '0de7f667adda6e4b4770f3c9426ec3cbc7299a9606eff533e2f015690d6b5ca0'
          grep -q 'research_enrichment_1770.qz64' database/reference/manifest.json
          grep -q 'AKM 6348 FR / batch 1770' database/reference/audits/akm6348_fr_1770_source_audit.md
