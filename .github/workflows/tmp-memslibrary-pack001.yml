name: TMP MEMSLibrary Pack001 Language Isolation

# Isolated validation only. This workflow never updates MEMSX64.
on:
  push:
    branches:
      - tmp-memslibrary-language-isolation
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  pack001-language-isolation-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify protected production base ancestry
        shell: pwsh
        run: |
          $expected = "1d6316bd1746d6f2b4cfb751cab88d18e27ef730"
          git merge-base --is-ancestor $expected HEAD
          if ($LASTEXITCODE -ne 0) { throw "Pack branch is not based on protected MEMSX64 #103 lineage" }
          Write-Host "PROTECTED_BASE_OK $expected"
          Write-Host "PRODUCTION_MEMSX64_NOT_MODIFIED_BY_THIS_WORKFLOW"

      - name: Download validated RAVEMEMS V2 47-PDF artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33810202288 --repo mini56/ECU-Mems-Manager-Session --name RAVEMEMS-V2-FULL-CORPUS-GENERIC-33810202288 --dir source47
          $dbs = Get-ChildItem source47 -Recurse -Filter ravemems_v2.sqlite
          if ($dbs.Count -ne 47) { throw "Expected 47 source SQLite databases, found $($dbs.Count)" }
          Write-Host "SOURCE47_OK databases=$($dbs.Count)"

      - name: Prove RAVEMEMS V2 source languages are already separated
        shell: pwsh
        run: |
          @'
          import glob, sqlite3
          docs=[]
          for p in sorted(glob.glob('source47/**/ravemems_v2.sqlite', recursive=True)):
              cx=sqlite3.connect(p)
              row=cx.execute('select document_key,source_language from ravemems_document').fetchone()
              assert row and row[0] and row[1]
              docs.append(row)
              assert cx.execute('select count(distinct source_language) from ravemems_document').fetchone()[0] == 1
              cx.close()
          langs={}
          for doc,lang in docs: langs[lang]=langs.get(lang,0)+1
          assert 'fr' in langs and 'en' in langs, langs
          print('RAVEMEMS_V2_LANGUAGE_SEPARATION_SOURCE_PASS', sorted(langs.items()))
          '@ | python -

      - name: Build Pack001 schema2 twice and prove reproducibility
        shell: pwsh
        run: |
          python tools/build_memslibrary_pack.py source47 outA --pack-id MEMSLibrary_Pack_001
          python tools/build_memslibrary_pack.py source47 outB --pack-id MEMSLibrary_Pack_001
          $a = (Get-FileHash outA/knowledge.sqlite -Algorithm SHA256).Hash.ToLower()
          $b = (Get-FileHash outB/knowledge.sqlite -Algorithm SHA256).Hash.ToLower()
          if ($a -ne $b) { throw "Pack001 is not reproducible: $a != $b" }
          $manifestA = Get-Content outA/manifest.json -Raw | ConvertFrom-Json
          $manifestB = Get-Content outB/manifest.json -Raw | ConvertFrom-Json
          if ($manifestA.knowledge_sha256 -ne $a) { throw "Manifest A SHA mismatch: $($manifestA.knowledge_sha256) != $a" }
          if ($manifestB.knowledge_sha256 -ne $b) { throw "Manifest B SHA mismatch: $($manifestB.knowledge_sha256) != $b" }
          if ($manifestA.pack_schema_version -ne 2) { throw "Expected Pack schema 2" }
          if (-not $manifestA.language_isolation_required) { throw "Language isolation flag missing" }
          Write-Host "PACK001_SCHEMA2_REPRODUCIBLE sha256=$a manifest_sha_ok=1 language_isolation=1"

      - name: Verify Pack001 language invariants
        shell: pwsh
        run: |
          @'
          import sqlite3
          p='outA/knowledge.sqlite'
          cx=sqlite3.connect(p)
          assert cx.execute('pragma integrity_check').fetchone()[0]=='ok'
          assert cx.execute('pragma foreign_key_check').fetchall()==[]
          assert cx.execute('select pack_schema_version from memslibrary_pack').fetchone()[0]==2
          assert cx.execute('select count(*) from ravemems_document').fetchone()[0]==47
          assert cx.execute('select count(*) from ravemems_page').fetchone()[0]==1359
          assert cx.execute('select count(*) from memslibrary_search').fetchone()[0]==5453
          assert cx.execute("select count(*) from memslibrary_search where source_language is null or trim(source_language)='' ").fetchone()[0]==0
          assert cx.execute("select count(*) from ravemems_review_flag where status is null or lower(status) not in ('resolved','closed')").fetchone()[0]==0
          langs=dict(cx.execute('select source_language,count(*) from memslibrary_search group by source_language'))
          assert langs.get('fr',0)>0 and langs.get('en',0)>0, langs
          assert cx.execute("select count(*) from memslibrary_search where source_language='fr' and document_key like '%ENG%'").fetchone()[0]==0
          assert cx.execute("select count(*) from memslibrary_search where source_language='en' and document_key like '%FRE%'").fetchone()[0]==0
          print('PACK001_LANGUAGE_INVARIANTS_PASS docs=47 pages=1359 search=5453 reviews=0 fk=0 languages=', sorted(langs.items()))
          '@ | python -

      - name: Configure MEMSLibrary ABI3 x64
        shell: pwsh
        run: cmake -S memslibrary -B build-memslibrary -A x64

      - name: Build MEMSLibrary ABI3 x64
        shell: pwsh
        run: cmake --build build-memslibrary --config Release --parallel

      - name: Create corrupt Pack002 fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force corruptPack002 | Out-Null
          Set-Content -Path corruptPack002/manifest.json -Value '{"pack_format":"MEMSLibraryKnowledgePack","pack_id":"CORRUPT_PACK_002"}' -Encoding UTF8
          Set-Content -Path corruptPack002/knowledge.sqlite -Value 'not a sqlite database' -Encoding ASCII

      - name: Load DLL and prove strict language isolation
        shell: pwsh
        run: |
          $exe = Resolve-Path build-memslibrary/Release/MEMSLibrarySmokeTest.exe
          $good = Resolve-Path outA
          $bad = Resolve-Path corruptPack002
          & $exe $good $bad
          if ($LASTEXITCODE -ne 0) { throw "MEMSLibrary ABI3 language isolation smoke test failed: $LASTEXITCODE" }

      - name: Prove no build-time source rewriting
        shell: pwsh
        run: |
          if (-not (git diff --quiet -- memslibrary tools/build_memslibrary_pack.py)) {
            git diff -- memslibrary tools/build_memslibrary_pack.py
            throw "Build or tests modified authoritative source"
          }
          Write-Host "DIRECT_SOURCE_UNCHANGED_AFTER_BUILD_PASS"

      - name: Assemble isolated deliverable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deliverable/MEMSLibrary_Pack_001 | Out-Null
          Copy-Item build-memslibrary/Release/MEMSLibrary.dll deliverable/
          Copy-Item outA/knowledge.sqlite deliverable/MEMSLibrary_Pack_001/
          Copy-Item outA/manifest.json deliverable/MEMSLibrary_Pack_001/
          Get-FileHash deliverable/MEMSLibrary.dll -Algorithm SHA256
          Get-FileHash deliverable/MEMSLibrary_Pack_001/knowledge.sqlite -Algorithm SHA256
          Write-Host "MEMSLIBRARY_PACK001_ABI3_LANGUAGE_ISOLATION_WINDOWS_X64_PASS"

      - name: Upload isolated ABI3 Pack001 artifact
        uses: actions/upload-artifact@v4
        with:
          name: MEMSLibrary-Pack001-ABI3-Language-Isolation-${{ github.run_id }}
          path: deliverable
          if-no-files-found: error
          compression-level: 6
