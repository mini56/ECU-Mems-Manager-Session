name: TEMP journal RAVEMEMS visual transport incident

on:
  push:
    branches: [RAPPORT]
    paths: ['.github/workflows/tmp-journal-ravemems-visual-transport-incident.yml']

permissions:
  contents: write

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 1
      - name: Append incident and self-delete
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '' '## 1 SEPTEMBRE 2026 — INCIDENT TRANSPORT VISUAL BUNDLE — AVANT CORRECTION' '- Le commit technique prepare 57544d144c075ef88e9f476f2d978c451b328876 contenait le script complet + workflow mais n avait pas encore ete attache a tmp-rave-new-extraction-pilot.' '- Une operation de contenu incorrecte a ensuite cree le commit 71659779147aaa5306a3ff49e566887ddf5fb2c4 sur la branche temporaire avec tools/ravemems_visual_bundle_link.py vide.' '- Aucun workflow technique de visual bundle n a ete valide par ce commit incomplet ; aucune base SQLite n a ete modifiee ; MEMSX64 reste strictement BUILD #103.' '- PROCHAINE ACTION EXACTE : restaurer sur tmp-rave-new-extraction-pilot le contenu complet du script et ajouter le workflow ravemems-visual-bundle-audit.yml dans un commit correct, puis executer le test reel avant toute suite.' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          rm -f .github/workflows/tmp-journal-ravemems-visual-transport-incident.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md .github/workflows/tmp-journal-ravemems-visual-transport-incident.yml
          git commit -m 'Journal RAVEMEMS visual transport incident'
          git push origin RAPPORT
