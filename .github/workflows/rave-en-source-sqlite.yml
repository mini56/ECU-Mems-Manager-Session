name: RAVE EN - SQLite source constructeur native
run-name: AKM7169ENG 482p - base anglaise autonome sans Setup
on:
  push:
    branches: [rave-fr-source-sqlite-20261112]
    paths:
      - tools/build_rave_en_documentary.py
      - tools/test_rave_en_cpp_reader.cpp
      - .github/workflows/rave-en-source-sqlite.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-english-original:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruire la SQLite originale depuis les 29 parties controlées
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_rave_en_documentary.py \
            --parts database/documentary/parts \
            --output output/rave-en
      - name: Verifier la base anglaise au format réel du lecteur
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sqlite3,json
          from pathlib import Path
          f=Path('output/rave-en/mems_documentary_en.sqlite')
          c=sqlite3.connect(f)
          assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert c.execute('PRAGMA foreign_key_check').fetchall()==[]
          assert c.execute('SELECT COUNT(*) FROM source_page_discovery').fetchone()[0]==482
          assert c.execute('SELECT COUNT(*) FROM procedures').fetchone()[0]==336
          assert c.execute('SELECT COUNT(*) FROM procedure_steps').fetchone()[0]==5055
          assert c.execute('SELECT COUNT(*) FROM technical_values').fetchone()[0]==630
          assert c.execute('SELECT COUNT(*) FROM illustrations').fetchone()[0]==316
          assert c.execute("SELECT value FROM documentary_language_meta WHERE key='original_language'").fetchone()[0]=='en'
          assert c.execute('SELECT COUNT(*) FROM documentary_translations').fetchone()[0]==0
          print('RAVE_EN_482_PAGES_DOCUMENTARY_CONTENT_PASS')
          PY
      - name: Tester le lecteur C++ de MEMS en anglais
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            g++ pkg-config qtbase5-dev libqt5sql5-sqlite
          g++ -std=c++17 -Wall -Wextra -fPIC \
            -DMEMS_DOCUMENTARY_SELFTEST=1 \
            database/MemsDocumentaryRepository.cpp \
            database/MemsDocumentaryPackCatalog.cpp \
            tools/test_rave_en_cpp_reader.cpp \
            -o /tmp/mems_rave_en_reader \
            $(pkg-config --cflags --libs Qt5Core Qt5Sql)
          /tmp/mems_rave_en_reader output/rave-en/mems_documentary_en.sqlite
      - name: Archiver la base anglaise privée, sans l'installer
        uses: actions/upload-artifact@v4
        with:
          name: RAVE-EN-AKM7169ENG-482P-SQLITE-VERIFIE
          path: output/rave-en/
          if-no-files-found: error
          retention-days: 14
