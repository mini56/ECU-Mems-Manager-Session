name: TEMP RCL0193FRE 1850 FINAL INSTALL
on:
  push:
    branches: [tmp-rave-visual-backfill]
    paths:
      - '.github/workflows/temp-rcl0193fre-1850-install.yml'
      - 'tools/install_rcl0193fre_1850.py'
permissions:
  contents: write
concurrency:
  group: rcl0193fre-1850-final
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-rave-visual-backfill
          fetch-depth: 0
      - name: Verify production remains BUILD 101
        shell: bash
        run: |
          test "$(git ls-remote origin refs/heads/MEMSX64 | cut -f1)" = "22dbe75ed14e0a61e694159d505ef72245116b48"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Fetch exact validated 1850 transport
        shell: bash
        env:
          G4_URL: 'https://tmpfiles.org/dl/1788034375.d96661764175a94b/wuwRBfBI6R8u/rcl0193fre_1850_g4_150.tif.xz'
          QZ_URL: 'https://tmpfiles.org/dl/1788034375.4ada30cf41825187/w6w6BTBTKmAh/research_enrichment_1850.qz64'
        run: |
          mkdir -p .rcl1850_transport
          curl -fL --retry 4 --retry-delay 2 "$G4_URL" -o .rcl1850_transport/rcl0193fre_1850_g4_150.tif.xz
          curl -fL --retry 4 --retry-delay 2 "$QZ_URL" -o .rcl1850_transport/research_enrichment_1850.qz64
          echo 'db9eddacab7a60d1241b3af7771490f406b5de4ea43f27600f574944e2848478  .rcl1850_transport/rcl0193fre_1850_g4_150.tif.xz' | sha256sum -c -
          echo 'f6995365e3d28de5d9c693d87d1399408edaa20c4f95bf839a557a17115b8662  .rcl1850_transport/research_enrichment_1850.qz64' | sha256sum -c -
      - name: Install and validate 1850
        shell: bash
        run: |
          cp tools/install_rcl0193fre_1850.py /tmp/install_rcl0193fre_1850.py
          python /tmp/install_rcl0193fre_1850.py install "$GITHUB_WORKSPACE"
      - name: Commit complete 1850
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/temp-rcl0193fre-1850-install.yml tools/install_rcl0193fre_1850.py
          rm -rf .rcl1850_transport
          git add database/reference/research_enrichment_1850.qz64 database/reference/manifest.json database/reference/audits/rcl0193fre_1850_audit.md database/reference/images/rave/RCL0193FRE_PDF_*.png
          python -c "import re,subprocess; lines=subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).splitlines(); pats=[re.compile(r'^database/reference/research_enrichment_1850\\.qz64$'),re.compile(r'^database/reference/manifest\\.json$'),re.compile(r'^database/reference/audits/rcl0193fre_1850_audit\\.md$'),re.compile(r'^database/reference/images/rave/RCL0193FRE_PDF_\\d{3}\\.png$'),re.compile(r'^\\.github/workflows/temp-rcl0193fre-1850-install\\.yml$'),re.compile(r'^tools/install_rcl0193fre_1850\\.py$')]; bad=[x for x in lines if not any(p.fullmatch(x[3:]) for p in pats)]; assert not bad,bad"
          git commit -m 'Add RCL0193FRE body HVAC wipers batch 1850'
          git push origin HEAD:tmp-rave-visual-backfill
      - name: Verify committed remote state
        shell: bash
        run: |
          git fetch origin tmp-rave-visual-backfill
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/tmp-rave-visual-backfill)"
          python /tmp/install_rcl0193fre_1850.py post "$GITHUB_WORKSPACE"
