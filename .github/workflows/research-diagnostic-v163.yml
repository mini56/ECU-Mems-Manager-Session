name: Recherche V163 - lecteurs 68K et couverture intégrale
on:
  push:
    branches: [research/mems-firmwares-20261126]
    paths: ['research/diagnostic-integral-20261128/audit_v163.py','.github/workflows/research-diagnostic-v163.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 research/diagnostic-integral-20261128/audit_v163.py
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostic-integral-V163
          path: research/diagnostic-integral-20261128/results_v163
      - name: Enregistrer les preuves
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/diagnostic-integral-20261128/results_v163
          if ! git diff --cached --quiet; then
            git commit -m "V163 : matrice lecteurs mémoire 483 firmwares [skip ci]"
            git pull --rebase origin research/mems-firmwares-20261126
            git push origin HEAD:research/mems-firmwares-20261126
          fi
