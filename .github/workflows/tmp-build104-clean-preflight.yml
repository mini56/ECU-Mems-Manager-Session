name: TMP BUILD104 Clean Preflight

on:
  push:
    branches:
      - tmp-build104-clean
    paths:
      - '.github/workflows/tmp-build104-clean-preflight.yml'
      - '.github/workflows/memsx64.yml'
      - 'CMakeLists.txt'
      - 'iamemstab.cpp'
      - 'expert/**'
      - 'memslibrary/include/MEMSLibrary.h'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    uses: ./.github/workflows/memsx64.yml
    with:
      build_number: '104'
