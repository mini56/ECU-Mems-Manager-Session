name: Fix MEMSX64 portable package Release resource paths

on:
  push:
    branches: [MEMSX64]
    paths:
      - '.github/workflows/memsx64-package-release-path-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MEMSX64
        uses: actions/checkout@v4
        with:
          ref: MEMSX64

      - name: Fix only MSVC multi-config resource paths
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/build-ecu-mems-x64-package.yml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "$translations = Join-Path $build 'translations'": "$translations = Join-Path $build 'Release\\translations'",
              "$database = Join-Path $build 'database'": "$database = Join-Path $build 'Release\\database'",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='')
          PY
          git diff --check

      - name: Commit path fix and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/memsx64-package-release-path-fix.yml
          git add -- .github/workflows/build-ecu-mems-x64-package.yml
          git diff --cached --check
          git commit -m "Fix x64 package Release resource paths"
          git push origin HEAD:MEMSX64
