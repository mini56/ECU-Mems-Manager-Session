name: TEMP journal IA language defect

on:
  push:
    branches:
      - RAPPORT
    paths:
      - .github/workflows/tmp-journal-ia-language-defect.yml

permissions:
  contents: write

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RAPPORT
        uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Append journal
        run: echo '' | base64 -d >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
      - name: Commit journal
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git rm .github/workflows/tmp-journal-ia-language-defect.yml
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git commit -m 'Journal IA language defect before direct source correction'
          git push origin HEAD:RAPPORT
