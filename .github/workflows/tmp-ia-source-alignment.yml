name: TMP IA source alignment

on:
  push:
    branches:
      - tmp-ia-architecture-prep

permissions:
  contents: write

jobs:
  align-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align LocalAiClient generation limits with the pinned runtime manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('expert/LocalAiClient.cpp')
          text=p.read_text(encoding='utf-8')
          old=text
          text=text.replace('const int kFastMaxNewTokens = 128;', 'const int kFastMaxNewTokens = 256;')
          text=text.replace('const int kDiagnosticMaxNewTokens = 192;', 'const int kDiagnosticMaxNewTokens = 768;')
          if text == old:
              raise SystemExit('expected LocalAiClient token constants not found')
          if 'const int kFastMaxNewTokens = 256;' not in text or 'const int kDiagnosticMaxNewTokens = 768;' not in text:
              raise SystemExit('token alignment failed')
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name mini56
          git config user.email 48644212+mini56@users.noreply.github.com
          git add expert/LocalAiClient.cpp
          git rm .github/workflows/tmp-ia-source-alignment.yml
          git commit -m "Align IA generation limits with runtime manifest"
          git push origin HEAD:tmp-ia-architecture-prep
