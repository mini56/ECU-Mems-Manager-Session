name: TEMP AKM6348 QZ DIAGNOSE
on:
  push:
    branches: [tmp-rave-visual-backfill]
    paths:
      - '.github/workflows/temp-akm6348-qz-diagnose.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-rave-visual-backfill
      - name: Identify prior enrichment encoding
        shell: bash
        run: |
          python - <<'PY'
          import base64, importlib.util, json
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('m','tools/build_akm6348_ch86_1780.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          ref=Path('database/reference')
          man=json.loads((ref/'manifest.json').read_text(encoding='utf-8-sig'))
          ordered=[];seen=set()
          for name in man.get('research_enrichment_batches',[]):
              p=ref/name
              if p.is_file() and p.name!='research_enrichment_1600.qz64' and m.numeric_suffix(p)<1780:
                  ordered.append(p);seen.add(p.resolve())
          for p in sorted(ref.rglob('research_enrichment*.qz64'),key=lambda p:(m.numeric_suffix(p),str(p))):
              if p.name=='research_enrichment_1600.qz64' or m.numeric_suffix(p)>=1780: continue
              if p.resolve() not in seen: ordered.append(p);seen.add(p.resolve())
          for p in ordered:
              try:
                  raw=p.read_bytes(); compact=b''.join(raw.split()); decoded=base64.b64decode(compact)
                  sql=m.qt_uncompress(decoded)
                  print('PASS',p.as_posix(),'bytes',len(raw),'sql',len(sql))
              except Exception as e:
                  print('FAIL',p.as_posix(),'suffix',m.numeric_suffix(p),'bytes',p.stat().st_size,'head',p.read_bytes()[:32],type(e).__name__,str(e))
                  raise
          PY
