name: TEMP RAVEMEMS V2 random R8411BU zero-defect test

on:
  push:
    branches: [tmp-ravemems-v2-foundation]
    paths:
      - '.github/workflows/tmp-ravemems-v2-r8411bu-random.yml'

permissions:
  contents: read

jobs:
  exact-r8411bu-random:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_SHA: 'b812e9660f0b325abc0764517b3a3e7bf79fc3ba'
      PROTECTED_MEMSX64: '1d6316bd1746d6f2b4cfb751cab88d18e27ef730'
      SOURCE_MAIN_COMMIT: '643de091b474f4e27917a065bdf46d5a0c764276'
      SOURCE_PATH: 'rave/Mini Tech Bulletins/R8411BU.PDF'
      SOURCE_BLOB: '4948dca6152b13a0e19f8acc25362b33547276a3'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 0

      - name: Guard exact validated algorithm and production
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TEST_SHA"
          test "$(git ls-remote origin refs/heads/MEMSX64 | awk '{print $1}')" = "$PROTECTED_MEMSX64"
          test -f .github/pass2/rcl0193eng_zero_defect_pass2.py
          test -f .github/pass2/rcl0193eng_precise_visual_extract.py
          test -f .github/pass2/rcl0193eng_visual_replay_validate.py
          echo "R8411BU_VALIDATED_ALGORITHM_SHA_PASS $TEST_SHA"
          echo "PROTECTED_BUILD103_PASS $PROTECTED_MEMSX64"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate exact Python foundation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="ravemems/v2:.github/pass2" python -m py_compile \
            ravemems/v2/audit.py \
            ravemems/v2/schema_selftest.py \
            ravemems/v2/reading_order.py \
            ravemems/v2/prototype_extract.py \
            .github/pass2/rcl0193eng_zero_defect_pass2.py \
            .github/pass2/rcl0193eng_precise_visual_extract.py \
            .github/pass2/rcl0193eng_visual_validate.py \
            .github/pass2/rcl0193eng_visual_replay_validate.py
          python ravemems/v2/schema_selftest.py | tee "$RUNNER_TEMP/schema-selftest.log"
          grep -q '^RAVEMEMS_V2_SCHEMA_SELFTEST_PASS$' "$RUNNER_TEMP/schema-selftest.log"
          grep -q '^MULTIPHASE_STEP_NUMBERING_PASS$' "$RUNNER_TEMP/schema-selftest.log"
          grep -q '^POST_EXTRACTION_AUDIT_PASS$' "$RUNNER_TEMP/schema-selftest.log"

      - name: Install pinned PDF renderer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.4'

      - name: Fetch exact random PDF source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_MAIN_COMMIT"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_MAIN_COMMIT"
          source_blob="$(git rev-parse "$SOURCE_MAIN_COMMIT:$SOURCE_PATH")"
          test "$source_blob" = "$SOURCE_BLOB"
          mkdir -p "$RUNNER_TEMP/ravemems-source"
          git show "$SOURCE_MAIN_COMMIT:$SOURCE_PATH" > "$RUNNER_TEMP/ravemems-source/R8411BU.PDF"
          test -s "$RUNNER_TEMP/ravemems-source/R8411BU.PDF"
          echo "R8411BU_SOURCE_PIN_PASS $source_blob"

      - name: Build document identity profile only
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/r8411bu-profile.json" <<'PY'
          import json, sys
          from pathlib import Path
          profile = json.loads(Path('ravemems/v2/profiles/rcl0193eng.json').read_text(encoding='utf-8'))
          profile['profile_id'] = 'service_manual_en_v1_random_R8411BU'
          profile['publication_code_regex'] = r'\bR8411BU\b'
          Path(sys.argv[1]).write_text(json.dumps(profile, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Extract R8411BU with unchanged zero-defect algorithm
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/r8411bu-test"
          rm -rf "$out"
          PYTHONPATH="ravemems/v2:.github/pass2" python .github/pass2/rcl0193eng_precise_visual_extract.py \
            --pdf "$RUNNER_TEMP/ravemems-source/R8411BU.PDF" \
            --schema ravemems/v2/schema.sql \
            --profile "$RUNNER_TEMP/r8411bu-profile.json" \
            --out "$out" \
            --source-relative-path "$SOURCE_PATH" \
            --source-commit "$SOURCE_MAIN_COMMIT" \
            --source-blob-sha "$SOURCE_BLOB" \
            | tee "$RUNNER_TEMP/r8411bu-extract.log"
          test -s "$out/manifest.json"
          test -s "$out/audit.json"
          test -s "$out/step_sequence_diagnostics.json"
          test -s "$out/ravemems_v2_rcl0193eng.sqlite"

      - name: Require same semantic and text zero guards
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/r8411bu-test"
          python - "$out" <<'PY'
          import json, re, sqlite3, sys
          from pathlib import Path
          out = Path(sys.argv[1])
          m = json.loads((out / 'manifest.json').read_text(encoding='utf-8'))
          diagnostics = json.loads((out / 'step_sequence_diagnostics.json').read_text(encoding='utf-8'))
          db = sqlite3.connect(out / 'ravemems_v2_rcl0193eng.sqlite')
          assert m['source_commit'] == '643de091b474f4e27917a065bdf46d5a0c764276'
          assert m['source_blob_sha'] == '4948dca6152b13a0e19f8acc25362b33547276a3'
          assert m['page_count'] > 0
          assert m['numeric_phase_defect_count'] == 0, m['numeric_phase_defect_count']
          assert diagnostics == [], diagnostics[:20]
          assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          assert db.execute('PRAGMA foreign_key_check').fetchall() == []
          assert db.execute("SELECT COUNT(*) FROM ravemems_review_flag WHERE status='open'").fetchone()[0] == 0
          step_rows = db.execute(
              "SELECT s.step_key,s.instruction_source,o.manufacturer_operation_no "
              "FROM ravemems_step s JOIN ravemems_phase p ON p.phase_key=s.phase_key "
              "JOIN ravemems_operation o ON o.operation_key=p.operation_key"
          ).fetchall()
          trailing_folios = [r for r in step_rows if re.search(r'\s\d{1,3}$', (r[1] or '').strip())]
          incomplete_crossrefs = [r for r in step_rows if re.search(r'\bSee$', (r[1] or '').strip(), re.I) or (r[1] or '').strip().endswith(',')]
          assert trailing_folios == [], trailing_folios[:12]
          assert incomplete_crossrefs == [], incomplete_crossrefs[:12]
          print('R8411BU_PRE_REPLAY_PAGES', m['page_count'])
          for key, value in m['counts'].items():
              print('R8411BU_COUNT', key, value)
          print('R8411BU_PRE_REPLAY_AUDIT_ISSUES', m['audit_issue_count'])
          print('R8411BU_SEMANTIC_TEXT_ZERO_PASS')
          db.close()
          PY
          test "$(git ls-remote origin refs/heads/MEMSX64 | awk '{print $1}')" = "$PROTECTED_MEMSX64"

      - name: Replay all visuals with same exact extraction order
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/r8411bu-test"
          PYTHONPATH="ravemems/v2:.github/pass2" python - "$RUNNER_TEMP/ravemems-source/R8411BU.PDF" "$out" <<'PY'
          import json, sqlite3, sys
          from pathlib import Path
          import rcl0193eng_visual_replay_validate as replay
          pdf = Path(sys.argv[1]); out = Path(sys.argv[2])
          db_path = out / 'ravemems_v2_rcl0193eng.sqlite'
          db = sqlite3.connect(db_path)
          expected_visuals = db.execute('SELECT COUNT(*) FROM ravemems_visual').fetchone()[0]
          expected_links = db.execute('SELECT COUNT(*) FROM ravemems_visual_link').fetchone()[0]
          db.close()
          verified, failed = replay.replay_visuals(pdf, out)
          result = json.loads((out / 'visual_replay_validation.json').read_text(encoding='utf-8'))
          assert result['db_visual_count'] == expected_visuals
          assert result['replayed_visual_count'] == expected_visuals
          assert result['visual_fidelity_verified_count'] == expected_visuals
          assert result['visual_fidelity_failed_count'] == 0, result['failed'][:3]
          assert result['visual_link_verified_count'] == expected_links
          assert result['visual_link_failed_count'] == 0, result['links_failed'][:3]
          assert result['missing_replay_count'] == 0
          assert result['unexpected_replay_count'] == 0
          assert result['sqlite_integrity'] == 'ok'
          assert result['foreign_key_issue_count'] == 0
          assert result['audit_issue_count_after_validation'] == 0, result['audit_issue_count_after_validation']
          print('R8411BU_FINAL_VISUALS_VERIFIED', expected_visuals)
          print('R8411BU_FINAL_LINKS_VERIFIED', expected_links)
          print('R8411BU_FINAL_AUDIT_ISSUES 0')
          print('R8411BU_RANDOM_ZERO_DEFECT_TEST_PASS')
          PY
          test "$(git ls-remote origin refs/heads/MEMSX64 | awk '{print $1}')" = "$PROTECTED_MEMSX64"

      - name: Upload random R8411BU test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RAVEMEMS-V2-R8411BU-RANDOM-ZERO-DEFECT-TEST
          path: ${{ runner.temp }}/r8411bu-test
          if-no-files-found: warn
          retention-days: 14
