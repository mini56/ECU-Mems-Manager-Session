name: MEMS 1.6 NA - verification des commandes reelles lot 07
on:
  push:
    branches: [research/mems-firmwares-20261126]
    paths: ['.github/workflows/research-16na-real-commands.yml','research/instruments-integral-20261127/audit_16na_real_commands.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Examiner les chemins V2 et tables de commandes sur 123 ROM
        run: python3 research/instruments-integral-20261127/audit_16na_real_commands.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preuves-16na-commandes-reelles-lot07
          path: research/instruments-integral-20261127/results/*16na_commandes_reelles_lot07*
      - name: Sauvegarder les preuves sans écraser les commits concurrents
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/instruments-integral-20261127/results/*16na_commandes_reelles_lot07* || true
          if ! git diff --cached --quiet; then
            git commit -m "MEMS 1.6 NA : verification des commandes reelles lot 07 [skip ci]"
            git pull --rebase origin research/mems-firmwares-20261126
            git push origin HEAD:research/mems-firmwares-20261126
          fi
