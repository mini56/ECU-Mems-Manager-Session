name: Apply IA MEMS lazy start

on:
  workflow_dispatch:
  push:
    branches: ["lab-expert-engine"]
    paths:
      - "tools/patch_ia_lazy_start.py"
      - ".github/workflows/apply-ia-lazy-start.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply IA lazy-start patch
        run: python tools/patch_ia_lazy_start.py
      - name: Commit IA lazy-start behavior
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- iamemstab.cpp iamemstab.h; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iamemstab.cpp iamemstab.h
          git commit -m "Start IA MEMS model only when its tab is opened [skip ci]"
          git pull --rebase origin lab-expert-engine
          git push origin HEAD:lab-expert-engine
