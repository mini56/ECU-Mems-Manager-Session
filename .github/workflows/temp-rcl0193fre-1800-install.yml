name: TEMP RCL0193FRE 1800 FINAL INSTALL
on:
  push:
    branches: [tmp-rave-visual-backfill]
    paths:
      - '.github/workflows/temp-rcl0193fre-1800-install.yml'
      - 'tools/install_rcl0193fre_1800.py'
permissions:
  contents: write
concurrency:
  group: rcl0193fre-1800-final
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-rave-visual-backfill
          fetch-depth: 0
      - name: Verify production remains BUILD 101
        run: test "$(git ls-remote origin refs/heads/MEMSX64 | cut -f1)" = "22dbe75ed14e0a61e694159d505ef72245116b48"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Fetch exact validated 1800 transport
        env:
          G4_URL: 'https://tmpfiles.org/dl/1788031080.0c8a9447606132e8/wDwsBZGIT8AB/rcl0193fre_1800_g4_150.tif.xz'
          QZ_URL: 'https://tmpfiles.org/dl/1788031081.a12c8cf3d9ec8f47/wUwmBhGpTifU/research_enrichment_1800.qz64'
        run: |
          mkdir -p .rcl1800_transport
          curl -fL --retry 4 --retry-delay 2 "$G4_URL" -o .rcl1800_transport/rcl0193fre_1800_g4_150.tif.xz
          curl -fL --retry 4 --retry-delay 2 "$QZ_URL" -o .rcl1800_transport/research_enrichment_1800.qz64
          echo '7dd7ae07169fe969e0877de871cc701fdd5f580fedd528527433602986610035  .rcl1800_transport/rcl0193fre_1800_g4_150.tif.xz' | sha256sum -c -
          echo '743d27910f60760e35f5efb81232a67a8488fc919f998a86e8d0d521128da0af  .rcl1800_transport/research_enrichment_1800.qz64' | sha256sum -c -
      - name: Install and validate 1800
        run: |
          cp tools/install_rcl0193fre_1800.py /tmp/install_rcl0193fre_1800.py
          python /tmp/install_rcl0193fre_1800.py install "$GITHUB_WORKSPACE"
      - name: Commit complete 1800
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/temp-rcl0193fre-1800-install.yml tools/install_rcl0193fre_1800.py
          git rm -r -f --ignore-unmatch .rcl1800_transport
          rm -rf .rcl1800_transport
          git add database/reference/research_enrichment_1800.qz64 database/reference/manifest.json database/reference/audits/rcl0193fre_1800_audit.md database/reference/images/rave/RCL0193FRE_PDF_*.png
          python - <<'PY'
          import subprocess
          bad=[]
          for line in subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).splitlines():
              p=line[3:]
              ok=(p=='database/reference/research_enrichment_1800.qz64' or p=='database/reference/manifest.json' or p=='database/reference/audits/rcl0193fre_1800_audit.md' or p.startswith('database/reference/images/rave/RCL0193FRE_PDF_') or p=='.github/workflows/temp-rcl0193fre-1800-install.yml' or p=='tools/install_rcl0193fre_1800.py' or p.startswith('.rcl1800_transport/'))
              if not ok: bad.append(line)
          assert not bad,bad
          print('COMMIT_SCOPE_PASS')
          PY
          git commit -m 'Add RCL0193FRE motor emissions batch 1800'
          git push origin HEAD:tmp-rave-visual-backfill
      - name: Verify committed remote state
        run: |
          git fetch origin tmp-rave-visual-backfill
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/tmp-rave-visual-backfill)"
          python /tmp/install_rcl0193fre_1800.py post "$GITHUB_WORKSPACE"
