name: TMP BUILD108 MEMSLibrary relevance integration

on:
  push:
    branches: [tmp-build108-memslibrary-relevance-integration]
    paths:
      - '.github/workflows/tmp-build108-memslibrary-relevance-integration.yml'
      - 'expert/relevance-integration-test/**'
      - 'expert/IaMemsLibraryBridge.cpp'
      - 'expert/IaMemsLibraryBridge.h'
      - 'expert/IaMemsLibraryIntegration.cpp'
      - 'expert/IaMemsService.cpp'
      - 'expert/IaMemsService.h'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  actual-app-relevance:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      BUILD108_RUN_ID: '33970147790'
      BUILD108_ARTIFACT_NAME: 'ECU-MEMS-Manager-x64-BUILD-108-v1.0.108-CLEAN-V2'
      RELEVANCE_DLL_RUN_ID: '34135797836'
      RELEVANCE_DLL_ARTIFACT_ID: '10023930741'
      RELEVANCE_DLL_ARTIFACT_NAME: 'MEMSLibrary-DLL-Provenance-Relevance-34135797836'
      RELEVANCE_DLL_DIGEST: 'sha256:596d9e4aaf7ad0e2b11cd011ada09ef58bab93936eab665c8e7a57b85cd3a2fb'
      RELEVANCE_DLL_SHA256: 'b16dfe3d4d3ece40557fb5fa5e17088fbe3a48ca085575568d16057d8571dd8b'
      PACK001_SQLITE_SHA256: '827208b703324335828d72093994ec5f7bf9e0a6fd0cd3b0082d033bfa38628b'

    steps:
      - name: Checkout exact temporary integration source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove protected production baseline is untouched
        shell: pwsh
        run: |
          $expected='1d6316bd1746d6f2b4cfb751cab88d18e27ef730'
          git merge-base --is-ancestor $expected HEAD
          if($LASTEXITCODE -ne 0){throw 'Temporary integration branch is not based on protected #103 lineage'}
          Write-Host "PROTECTED_BASE_OK $expected"
          Write-Host 'PRODUCTION_MEMSX64_NOT_MODIFIED'

      - name: Setup Python and Qt 5.15.2 MSVC x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0"
          $sevenZip=(Get-Command 7z.exe -ErrorAction Stop).Source
          if(Test-Path C:\Qt){Remove-Item C:\Qt -Recurse -Force -ErrorAction SilentlyContinue}
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtcharts -O C:\Qt --external "$sevenZip"
          if($LASTEXITCODE -ne 0){throw "Qt install failed $LASTEXITCODE"}

      - name: Download BUILD108 runtime and corrected relevance DLL
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $artifact=gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:RELEVANCE_DLL_ARTIFACT_ID" | ConvertFrom-Json
          if($artifact.name -ne $env:RELEVANCE_DLL_ARTIFACT_NAME -or $artifact.digest -ne $env:RELEVANCE_DLL_DIGEST -or $artifact.expired){throw 'Relevance DLL artifact pin failed'}
          gh run download $env:BUILD108_RUN_ID --repo $env:GITHUB_REPOSITORY --name $env:BUILD108_ARTIFACT_NAME --dir build108-runtime
          gh run download $env:RELEVANCE_DLL_RUN_ID --repo $env:GITHUB_REPOSITORY --name $env:RELEVANCE_DLL_ARTIFACT_NAME --dir relevance-dll
          $exe=Get-ChildItem build108-runtime -Recurse -File -Filter ecu_mems_manager.exe | Select-Object -First 1
          $dll=Get-ChildItem relevance-dll -Recurse -File -Filter MEMSLibrary.dll | Select-Object -First 1
          $db=Get-ChildItem relevance-dll -Recurse -File -Filter knowledge.sqlite | Select-Object -First 1
          if(-not $exe -or -not $dll -or -not $db){throw 'Runtime or relevance artifact incomplete'}
          if((Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:RELEVANCE_DLL_SHA256){throw 'Relevance DLL SHA mismatch'}
          if((Get-FileHash $db.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:PACK001_SQLITE_SHA256){throw 'Pack001 SHA mismatch'}
          $root=$exe.Directory.FullName
          Copy-Item $dll.FullName (Join-Path $root 'MEMSLibrary.dll') -Force
          $pack=Join-Path $root 'MEMSLibrary_Pack_001'
          if(Test-Path $pack){Remove-Item $pack -Recurse -Force}
          Copy-Item $db.Directory.FullName $pack -Recurse -Force
          "RUNTIME_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "RUNTIME_RELEVANCE_DLL_INJECTED sha256=$env:RELEVANCE_DLL_SHA256"
          Write-Host "PACK001_UNCHANGED sha256=$env:PACK001_SQLITE_SHA256"

      - name: Inject deterministic retrieval probe into actual application
        shell: pwsh
        run: |
          python expert/relevance-integration-test/patch_actual_app.py
          if($LASTEXITCODE -ne 0){throw 'Actual app relevance probe patch failed'}

      - name: Build actual ECU MEMS Manager retrieval path
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake -S . -B build-app-relevance -A x64 `
            -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/msvc2019_64" `
            -DMEMS_USE_BUNDLED_LIBROSCO_X64=ON `
            -DMEMS_RUN_REFERENCE_SELFTEST_POST_BUILD=OFF `
            -DMEMS_USE_ONNX_GENAI=OFF
          if($LASTEXITCODE -ne 0){throw 'Actual app configure failed'}
          cmake --build build-app-relevance --config Release --target ecu_mems_manager --parallel
          if($LASTEXITCODE -ne 0){throw 'Actual app build failed'}
          Copy-Item 'build-app-relevance\Release\ecu_mems_manager.exe' (Join-Path $env:RUNTIME_ROOT 'ecu_mems_manager.exe') -Force
          Write-Host 'ACTUAL_MEMS_MANAGER_RELEVANCE_BUILD_PASS'

      - name: Run natural-language retrieval in actual ECU MEMS Manager
        shell: pwsh
        run: |
          $qt='C:\Qt\5.15.2\msvc2019_64\bin'
          $env:PATH="$env:RUNTIME_ROOT;$qt;$env:PATH"
          $env:QT_QPA_PLATFORM='offscreen'
          $env:MEMS_RELEVANCE_INTEGRATION_TEST='1'
          $out=Join-Path $env:GITHUB_WORKSPACE 'relevance-output.txt'
          & (Join-Path $env:RUNTIME_ROOT 'ecu_mems_manager.exe') *> $out
          $code=$LASTEXITCODE
          "ACTUAL_APP_RELEVANCE_EXIT=$code" | Add-Content $out -Encoding UTF8
          Get-Content $out
          if($code -ne 0){throw "Actual application relevance integration failed: $code"}
          Write-Host 'BUILD108_ACTUAL_APP_MEMSLIBRARY_RELEVANCE_PASS'

      - name: Upload relevance probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BUILD108-MEMSLibrary-Relevance-Probe-${{ github.run_id }}
          path: relevance-output.txt
          if-no-files-found: warn
          retention-days: 7
