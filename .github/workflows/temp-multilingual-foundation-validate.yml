name: TEMP MULTILINGUAL FOUNDATION VALIDATION

on:
  push:
    branches: [tmp-multilingual-knowledge-foundation]
    paths:
      - 'database/reference/prototypes/multilingual_knowledge_foundation_v1.sql'
      - 'database/reference/prototypes/multilingual_knowledge_foundation_v1.qz64'
      - '.github/workflows/temp-multilingual-foundation-validate.yml'

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download BUILD 103
        shell: bash
        run: |
          set -euo pipefail
          mkdir build103
          gh run download 33334306835 -R mini56/ECU-Mems-Manager-Session \
            -n ECU-MEMS-Manager-x64-BUILD-103-v1.0.103 -D build103
      - name: Validate schema and multilingual model
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,sqlite3,struct,zlib
          from pathlib import Path
          qz=Path('database/reference/prototypes/multilingual_knowledge_foundation_v1.qz64')
          sqlp=Path('database/reference/prototypes/multilingual_knowledge_foundation_v1.sql')
          if hashlib.sha256(qz.read_bytes()).hexdigest()!='0df680bd40450ce57be927e5ee3ec0ef40c8a2962d12c939e2f4f00202301487': raise SystemExit('qz64 sha mismatch')
          raw=base64.b64decode(qz.read_bytes()); n=struct.unpack('>I',raw[:4])[0]; sql=zlib.decompress(raw[4:])
          if len(sql)!=n or sql!=sqlp.read_bytes(): raise SystemExit('qz64/sql mismatch')
          dbs=list(Path('build103').rglob('ia_mems_reference_r20.sqlite'))
          if len(dbs)!=1: raise SystemExit(f'unexpected BUILD103 expert DB count: {len(dbs)}')
          Path('test.sqlite').write_bytes(dbs[0].read_bytes())
          db=sqlite3.connect('test.sqlite'); db.execute('pragma foreign_keys=on')
          def count(t): return db.execute(f'select count(*) from {t}').fetchone()[0]
          baseline=(db.execute('pragma user_version').fetchone()[0],count('mems_knowledge_item'),count('mems_rave_illustration'),count('mems_procedure'),count('mems_specification'),db.execute("select count(*) from sqlite_master where type='table'").fetchone()[0])
          if baseline!=(20,1113,126,410,649,78): raise SystemExit(f'bad BUILD103 baseline {baseline}')
          if db.execute('pragma integrity_check').fetchone()[0].lower()!='ok': raise SystemExit('baseline integrity')
          db.executescript(sql.decode())
          after=(db.execute('pragma user_version').fetchone()[0],count('mems_knowledge_item'),count('mems_rave_illustration'),count('mems_procedure'),count('mems_specification'),db.execute("select count(*) from sqlite_master where type='table'").fetchone()[0])
          if after!=(21,1113,126,410,649,89): raise SystemExit(f'bad additive state {after}')
          if db.execute('pragma foreign_key_check').fetchall(): raise SystemExit('foundation fk')
          if db.execute('pragma integrity_check').fetchone()[0].lower()!='ok': raise SystemExit('foundation integrity')
          db.executemany("insert into mems_doc_locale(locale,display_name,fallback_locale,text_direction,enabled) values(?,?,?,?,?)",[('ja','Japanese','en','ltr',0),('zh-CN','Chinese','en','ltr',0),('hi','Hindi','en','ltr',0)])
          db.execute("insert into mems_doc_document(document_key,title_source,source_locale,source_kind,verification_level) values('P-DOC','Prototype','fr','manual','verifie_constructeur')")
          db.execute("insert into mems_doc_unit(unit_key,document_key,unit_kind,sequence_no,audit_status,integration_status) values('P-U','P-DOC','page',1,'useful','integrated')")
          entities=[('P-K','knowledge',None,1),('P-V','visual','P-K',2),('P-L','visual_label','P-V',3),('P-T','table',None,4),('P-C','table_cell','P-T',5),('P-P','procedure',None,6),('P-S','procedure_step','P-P',7),('P-N','specification_value','P-S',8)]
          for k,kind,parent,order in entities: db.execute("insert into mems_doc_entity(entity_key,document_key,unit_key,entity_kind,parent_entity_key,verification_level,source_locale,sort_order) values(?,?,?,?,?,'verifie_constructeur','fr',?)",(k,'P-DOC','P-U',kind,parent,order))
          sha=db.execute("select sha256 from mems_rave_illustration where relative_path='images/rave/AKM6348_FR_CH86_86_01.png'").fetchone()
          if not sha: raise SystemExit('BUILD103 visual missing')
          db.execute("insert into mems_doc_visual(entity_key,relative_path,sha256,visual_kind,original_intact) values('P-V','images/rave/AKM6348_FR_CH86_86_01.png',?,'service_view',1)",sha)
          db.execute("insert into mems_doc_visual_region(region_entity_key,visual_entity_key,region_kind,x_norm,y_norm,width_norm,height_norm) values('P-L','P-V','label',.1,.1,.3,.08)")
          for loc,text in [('fr','Alternateur'),('en','Alternator'),('es','Alternador'),('it','Alternatore'),('pt','Alternador'),('de','Lichtmaschine'),('ja','オルタネーター')]: db.execute("insert into mems_doc_text(entity_key,field_key,locale,text_value,translation_status,source_locale) values('P-K','title',?,?,?,'fr')",(loc,text,'source' if loc=='fr' else 'draft'))
          db.execute("insert into mems_doc_text(entity_key,field_key,locale,text_value,translation_status,source_locale) values('P-L','label','fr','Fixation','source','fr')")
          db.execute("insert into mems_doc_text(entity_key,field_key,locale,text_value,translation_status,source_locale) values('P-L','label','en','Fastener','draft','fr')")
          db.execute("insert into mems_doc_table(entity_key,row_count,column_count,header_rows) values('P-T',1,1,1)")
          db.execute("insert into mems_doc_table_cell(cell_entity_key,table_entity_key,row_no,column_no,value_numeric,unit_code) values('P-C','P-T',0,0,3.0,'bar')")
          db.execute("insert into mems_doc_value(entity_key,value_kind,value_numeric,unit_code) values('P-N','torque',6.0,'Nm')")
          db.executemany("insert into mems_doc_relation(from_entity_key,relation_type,to_entity_key) values(?,?,?)",[('P-K','illustrated_by','P-V'),('P-P','has_step','P-S'),('P-S','uses_value','P-N')])
          db.commit()
          locs=[r[0] for r in db.execute("select locale from mems_doc_text where entity_key='P-K' order by locale")]
          if locs!=['de','en','es','fr','it','ja','pt']: raise SystemExit(f'locale query failed {locs}')
          if db.execute("select count(distinct relative_path) from mems_doc_visual").fetchone()[0]!=1: raise SystemExit('visual duplication')
          if db.execute('pragma foreign_key_check').fetchall(): raise SystemExit('prototype fk')
          if db.execute('pragma integrity_check').fetchone()[0].lower()!='ok': raise SystemExit('prototype integrity')
          print('PASS BUILD103',baseline)
          print('PASS FOUNDATION',after)
          print('PASS LOCALES fr/en/es/it/pt/de + future ja/zh-CN/hi without ALTER TABLE')
          print('PASS ONE ORIGINAL VISUAL + TRANSLATABLE LABELS')
          print('PASS STRUCTURED TABLE + PROCEDURE/STEP + VALUE + RELATIONS')
          print('PASS MULTILINGUAL KNOWLEDGE FOUNDATION V1')
          PY
