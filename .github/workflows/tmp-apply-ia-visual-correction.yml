name: TEMP apply IA visual correction code only
on:
  push:
    branches: [tmp-ravemems-ia-visual-integration]
    paths: ['.github/workflows/tmp-apply-ia-visual-correction.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-ravemems-ia-visual-integration
          fetch-depth: 0
      - name: Apply exact code correction only
        env:
          MEMSX64_BASE: 1d6316bd1746d6f2b4cfb751cab88d18e27ef730
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/MEMSX64 | awk '{print $1}')" = "$MEMSX64_BASE"
          test -f tools/tmp_apply_ia_visual_correction.py
          python3 tools/tmp_apply_ia_visual_correction.py
          git checkout -- .github/workflows/tmp-ravemems-ia-visual-validation.yml
          python3 - <<'PY'
          import subprocess
          expected={
            'expert/IaMemsDiagramCatalog.cpp',
            'expert/IaMemsDiagramSelfTest.cpp',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed==expected,(changed,expected)
          print('CODE_ONLY_DIFF_PASS',sorted(changed))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add expert/IaMemsDiagramCatalog.cpp expert/IaMemsDiagramSelfTest.cpp
          git commit -m "Fix IA runtime visual selection priority"
          python3 - <<'PY'
          import subprocess
          expected={
            'expert/IaMemsDiagramCatalog.cpp',
            'expert/IaMemsDiagramSelfTest.cpp',
          }
          changed=set(subprocess.check_output(['git','diff-tree','--no-commit-id','--name-only','-r','HEAD'],text=True).splitlines())
          assert changed==expected,(changed,expected)
          print('CODE_ONLY_COMMIT_SCOPE_PASS',sorted(changed))
          PY
          git push origin HEAD:tmp-ravemems-ia-visual-integration
