name: IA MEMS compact database SQL validation

on:
  workflow_dispatch:
  push:
    branches: ["lab-expert-engine"]
    paths:
      - "database/reference/**"
      - ".github/workflows/expert-runtime-db-sql-smoke.yml"

permissions:
  contents: write

concurrency:
  group: expert-runtime-db-sql-smoke
  cancel-in-progress: true

jobs:
  validate-runtime-db:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build compact runtime database statement by statement
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python - <<'PY' > expert_runtime_sql_trace.txt 2>&1
          import base64, json, pathlib, re, sqlite3, struct, zlib
          root = pathlib.Path('database/reference')
          manifest = json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          revision = int(manifest.get('database_revision', 0))
          batches = manifest.get('research_enrichment_batches', [])
          db = sqlite3.connect(':memory:', isolation_level=None)
          report=[]

          def quncompress(encoded_bytes):
              packed=base64.b64decode(encoded_bytes)
              expected=struct.unpack('>I', packed[:4])[0]
              sql=zlib.decompress(packed[4:])
              if len(sql)!=expected:
                  raise RuntimeError(f'qCompress size mismatch expected={expected} got={len(sql)}')
              return sql

          def execute_script(label, sql):
              text=sql.decode('utf-8')
              buffer=''
              count=0
              for line_no, raw in enumerate(text.splitlines(),1):
                  stripped=raw.strip()
                  if not buffer and (not stripped or stripped.startswith('--')):
                      continue
                  buffer += raw + '\n'
                  if not sqlite3.complete_statement(buffer):
                      continue
                  statement=buffer.strip()
                  buffer=''
                  if not statement:
                      continue
                  try:
                      db.execute(statement)
                  except Exception as exc:
                      raise RuntimeError(f'{label}:{line_no}: {exc} | {statement[:320]}') from exc
                  count += 1
              if buffer.strip():
                  raise RuntimeError(f'{label}: incomplete trailing SQL | {buffer[:320]}')
              report.append({'lot':label,'statements':count,'bytes':len(sql)})

          def suffix(p):
              m=re.search(r'_(\d+)\.qz64$',p.name)
              return int(m.group(1)) if m else 0
          seeds=sorted(root.glob('mems_reference_seed_*.qz64'), key=lambda p:(suffix(p),p.name))
          if not seeds: raise RuntimeError('seed absent')
          execute_script('seed', quncompress(b''.join(p.read_bytes().strip() for p in seeds)))
          for batch in batches:
              if batch == 'research_enrichment_1600.qz64':
                  report.append({'lot':batch,'skipped':'archive-only raw preservation layer'})
                  continue
              path=root/batch
              if not path.exists(): raise RuntimeError(f'lot absent: {batch}')
              execute_script(batch, quncompress(path.read_bytes().strip()))

          tables={r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          required=['mems_expert_fact_external','mems_expert_rule','mems_expert_rule_condition','mems_expert_rule_recommendation','mems_scalar_definition','mems_variable_correlation']
          missing=[t for t in required if t not in tables]
          if missing: raise RuntimeError(f'required tables missing: {missing}')
          if 'mems_correlation_cell_external' in tables: raise RuntimeError('archive-only 1600 table materialized')
          rules=[dict(zip(['rule_key','family','firmware','title','severity','base_confidence','min_samples','verification'],r)) for r in db.execute("SELECT rule_key,family,firmware_code,title,severity,base_confidence,min_samples,verification_level FROM mems_expert_rule ORDER BY rule_key")]
          conditions=[dict(zip(['rule_key','parameter','metric','comparator','low','high','required','weight'],r)) for r in db.execute("SELECT rule_key,parameter,metric,comparator,threshold_low,threshold_high,required,weight FROM mems_expert_rule_condition ORDER BY rule_key,condition_order,id")]
          facts_13=db.execute("SELECT COUNT(*) FROM mems_expert_fact_external WHERE family='1.3' AND firmware_code='ABEMR002'").fetchone()[0]
          c8=db.execute("SELECT COUNT(*) FROM mems_expert_fact_external WHERE family='1.3' AND firmware_code='ABEMR002' AND fact_key='mems13_abem_c8_service5'").fetchone()[0]
          result={'revision':revision,'lots':report,'table_count':len(tables),'facts_ABEMR002':facts_13,'c8_fact':c8,'rules':rules,'conditions':conditions}
          print(json.dumps(result,indent=2,ensure_ascii=False))
          pathlib.Path('expert_runtime_sql_result.txt').write_text('IA MEMS compact database SQL validation: OK\n'+json.dumps(result,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          code=$?
          cat expert_runtime_sql_trace.txt
          exit $code
      - name: Record failure
        if: steps.smoke.outcome != 'success'
        shell: bash
        run: |
          { printf 'IA MEMS compact database SQL validation: FAILED\nsource_commit=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID"; cat expert_runtime_sql_trace.txt 2>/dev/null || true; } > expert_runtime_sql_result.txt
      - name: Publish result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- expert_runtime_sql_result.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record compact IA database SQL validation [skip ci]"
          git pull --rebase origin lab-expert-engine
          git push origin HEAD:lab-expert-engine
      - name: Fail if compact database invalid
        if: steps.smoke.outcome != 'success'
        shell: bash
        run: exit 1
