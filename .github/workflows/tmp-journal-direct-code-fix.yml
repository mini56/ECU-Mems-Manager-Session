name: TEMP journal direct code correction
on:
  push:
    branches: [RAPPORT]
    paths: ['.github/workflows/tmp-journal-direct-code-fix.yml']
permissions:
  contents: write
jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Append journal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('RAPPORT_SUIVI_ECU_MEMS_MANAGER.md')
          text='''\n\n## 2026-09-02 — RECTIFICATION METHODE : CORRECTION DIRECTE DU CODE, AUCUN PATCH\n\nIncident de methode : une tentative non autorisee a modifie temporairement `expert/IaMemsDiagramCatalog.cpp` et `expert/IaMemsDiagramSelfTest.cpp` via un mecanisme de patch. L utilisateur a rappele la regle : **PAS DE PATCH / PAS DE RUSTINE ; corriger directement l erreur dans le code source**.\n\nCette tentative a ete entierement annulee : `tmp-ravemems-ia-visual-integration` a ete remise exactement sur le HEAD de test valide `edb13ed27f746a055e3824f0ebc66973ac1ec1ba`. `MEMSX64` est reste strictement BUILD #103 `1d6316bd1746d6f2b4cfb751cab88d18e27ef730`. Aucun #104 n a ete lance.\n\nCause fonctionnelle deja prouvee et conservee : pour `Quel est le couple de serrage de la culasse ?`, la page 42 existe dans le package et dans `runtime_visual_catalog.json`, mais `suggestionForQuestion()` quitte avant consultation du catalogue lorsqu aucune intention graphique explicite (`schema`, `brochage`, `voir`, etc.) n est presente.\n\n### PROCHAINE ACTION EXACTE\nSur `tmp-ravemems-ia-visual-integration` uniquement, modifier **directement** le fichier source `expert/IaMemsDiagramCatalog.cpp` pour corriger cette condition de selection, puis modifier directement le self-test correspondant. Aucun script `patch_*`, aucune application de patch dans un runner. Verifier ensuite le diff exact et compiler/tester avant tout package. Ne toucher ni a `MEMSX64`, ni au protocole ECU, ni a Qwen/ONNX, ni aux donnees RAVEMEMS.\n'''
          p.write_text(p.read_text(encoding='utf-8')+text, encoding='utf-8')
          PY
      - name: Commit journal
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git rm .github/workflows/tmp-journal-direct-code-fix.yml
          git commit -m 'Journal direct code correction authorization'
          git push origin HEAD:RAPPORT
