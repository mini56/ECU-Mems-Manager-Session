name: TEMP update RAVEMEMS tightening sequence

on:
  push:
    branches: [RAPPORT]
    paths:
      - '.github/workflows/tmp-update-ravemems-tightening-sequence.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Update cahier and report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          cahier = Path('docs/CAHIER_DES_CHARGES_RAVEMEMS_BROUILLON_2026-09-02.md')
          text = cahier.read_text(encoding='utf-8')
          anchor = "L’IA doit également pouvoir effectuer **à la demande de l’utilisateur des conversions d’unités et des calculs simples**, même lorsque le résultat converti n’est pas écrit dans le manuel. Exemple : `3 pouces en mm ?` → **76,2 mm**. Lorsqu’une telle conversion concerne une valeur issue du manuel, la valeur constructeur d’origine reste explicitement distinguée du résultat calculé par l’IA."
          addition = anchor + "\n\nLes **serrages en plusieurs étapes** doivent être conservés comme une séquence technique complète et ordonnée, et non réduits à une valeur unique. RAVEMEMS doit préserver chaque passe de serrage, chaque couple, chaque angle, l’ordre des vis ou fixations, les éventuelles conditions intermédiaires et tout ordre constructeur imposé. Exemple : `20 N·m`, puis `60°`, puis encore `60°` doit rester une séquence de trois étapes distinctes. Si le manuel fournit un schéma d’ordre de serrage, ce visuel doit être relié à la séquence et l’IA doit pouvoir le proposer avec la procédure."
          if anchor not in text:
              raise SystemExit('anchor not found in cahier')
          text = text.replace(anchor, addition, 1)
          cahier.write_text(text, encoding='utf-8')

          report = Path('RAPPORT_SUIVI_ECU_MEMS_MANAGER.md')
          with report.open('a', encoding='utf-8') as f:
              f.write("\n\n## 2026-09-02 — RELECTURE CAHIER RAVEMEMS — SERRAGES SEQUENTIELS / ANGULAIRES\n\n")
              f.write("Décision utilisateur validée comme **très importante** : un serrage en plusieurs passes ne doit jamais être réduit à une valeur unique. RAVEMEMS doit conserver l'ordre exact des passes, couples, angles, ordre des vis/fixations, conditions et séquences constructeur. Exemple : 20 N·m puis 60° puis encore 60° reste une séquence ordonnée complète. Si un schéma d'ordre de serrage existe, il doit être relié à la séquence et proposé par l'IA avec la procédure concernée.\n\n")
              f.write("Aucun code applicatif, aucune extraction et aucun BUILD de production ne sont lancés dans cette étape de relecture.\n\n")
              f.write("PROCHAINE ACTION EXACTE : poursuivre la relecture du cahier des charges RAVEMEMS question par question avec l'utilisateur. Ne lancer aucune nouvelle extraction avant validation explicite du cahier.\n")
          PY
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name "mini56"
          git config user.email "48644212+mini56@users.noreply.github.com"
          git add docs/CAHIER_DES_CHARGES_RAVEMEMS_BROUILLON_2026-09-02.md RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git rm .github/workflows/tmp-update-ravemems-tightening-sequence.yml
          git commit -m "Journal RAVEMEMS tightening sequence rule"
          git push origin HEAD:RAPPORT
