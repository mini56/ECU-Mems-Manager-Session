          EOF
      - name: Verify report entry
        run: |
          grep -F "RCL0193 1760 - GENERATEUR REPRODUCTIBLE POUSSE" RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          grep -F "4fe8ea77bae5b1651b4ef9256a2090562531184b" RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
      - name: Commit report and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-report-rcl0193-1760-builder-pushed.yml
