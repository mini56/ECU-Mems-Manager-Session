name: SESSION 233 - Setup de test
run-name: SESSION 233 - Validation complete et Setup de test - ${{ github.sha }}
on:
  workflow_dispatch:
  push:
    branches: [fix-documentary-additive-session-161-20261118]
    paths:
      - '.github/workflows/session-233-test-setup.yml'
concurrency:
  group: session-233-private-test
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valider les tests autonomes, les six langues et les contrats IA et aides
        run: |
          c++ -std=c++11 -Wall -Wextra -Werror -pedantic -I. tools/mems16na_decoder_selftest.cpp -o decoder && ./decoder
          c++ -std=c++11 -Wall -Wextra -Werror -pedantic -I. tools/mems16na_session_selftest.cpp -o session && ./session tools/testdata/mems16na-session-206.txt
          c++ -std=c++11 -Wall -Wextra -Werror -pedantic -I. tools/mems16na_live_trace_selftest.cpp -o live && ./live tools/testdata/mems16na-session-206.txt
          c++ -std=c++11 -Wall -Wextra -Werror -pedantic -I. tools/mems16na_log_selftest.cpp -o logv2 && ./logv2 tools/testdata/mems16na-session-206.txt
          python tools/test_mems16na_translation_catalog.py
          python tools/test_mems16na_help.py
          python tools/test_injection_presentation.py
          python tools/test_session222_technical_contract.py
          python tools/test_actuator_reply_multiecu.py
          c++ -std=c++11 -Wall -Wextra -Werror -pedantic -I. tools/mems231_selftest.cpp -o session231 && ./session231
          python tools/test_mems231_rapid_profiles.py
          c++ -std=c++11 -Wall -Wextra -Werror -pedantic -I. tools/mems217_selftest.cpp -o session217 && ./session217
          c++ -std=c++11 -Wall -Wextra -Werror -pedantic -I. tools/mems218_selftest.cpp -o session218 && ./session218
          echo 'SESSION_233_INSTRUMENTS_56_PROFILE_SELFTEST_PASS'
          c++ -std=c++11 -Wall -Wextra -Werror -pedantic -I. tools/mems219_selftest.cpp -o session219 && ./session219
          c++ -std=c++11 -Wall -Wextra -Werror -pedantic -I. tools/mems220_selftest.cpp -o session220 && ./session220
          c++ -std=c++11 -Wall -Wextra -Werror -pedantic -I. tools/mems222_selftest.cpp -o session222 && ./session222
          c++ -std=c++11 -Wall -Wextra -Werror -pedantic -I. memsextendeddtc_test.cpp -o extendeddtc && ./extendeddtc
          python -c "import json; from pathlib import Path; langs=('fr','en','de','es','it','pt'); keys={str(i) for i in range(2971801,2971824)}; assert all(set(json.loads(Path(f'translations/{l}/{l}_session218.json').read_text(encoding='utf-8')))==keys for l in langs)"
          python -c "import json; from pathlib import Path; langs=('fr','en','de','es','it','pt'); keys=set(json.loads(Path('translations/fr/fr_session217.json').read_text(encoding='utf-8'))); assert len(keys)==18 and all(set(json.loads(Path(f'translations/{l}/{l}_session217.json').read_text(encoding='utf-8')))==keys for l in langs)"
          python -c "import json; from pathlib import Path; langs=('fr','en','de','es','it','pt'); assert all(set(json.loads(Path(f'translations/{l}/{l}_restart.json').read_text(encoding='utf-8')))=={'29100','29101','29102'} for l in langs)"
          python -c "from pathlib import Path; s=Path('aboutbox.cpp').read_text(encoding='utf-8'); p=[s.index(n) for n in ('Andrew Revill','Leopold Gunther','Colin Bourassa','haro78','James Portman')]; assert p==sorted(p), 'Incorrect acknowledgements order'; print('SESSION_233_ACKNOWLEDGEMENTS_ORDER_PASS')"
          python -c "import json; from pathlib import Path; langs=('fr','en','de','es','it','pt'); keys={str(i) for i in range(2971901,2971911)}; assert all(set(json.loads(Path(f'translations/{l}/{l}_session219.json').read_text(encoding='utf-8')))==keys for l in langs)"
          python -c "import json; from pathlib import Path; langs=('fr','en','de','es','it','pt'); keys={str(i) for i in range(2972001,2972005)}; assert all(set(json.loads(Path(f'translations/{l}/{l}_session220.json').read_text(encoding='utf-8')))==keys for l in langs)"
          python -c "import json; from pathlib import Path; langs=('fr','en','de','es','it','pt'); assert all(set(json.loads(Path(f'translations/{l}/{l}_session221.json').read_text(encoding='utf-8')))=={'2972101'} for l in langs)"
          python -c "import json; from pathlib import Path; langs=('fr','en','de','es','it','pt'); keys={str(i) for i in range(2972201,2972217)}; assert all(set(json.loads(Path(f'translations/{l}/{l}_session222.json').read_text(encoding='utf-8')))==keys for l in langs)"
          python -c "import json; from pathlib import Path; langs=('fr','en','de','es','it','pt'); keys={str(i) for i in range(2972301,2972314)}; assert all(set(json.loads(Path(f'translations/{l}/{l}_session223.json').read_text(encoding='utf-8')))==keys for l in langs)"
          python -c "import json; from pathlib import Path; langs=('fr','en','de','es','it','pt'); keys={str(i) for i in range(2972401,2972435)}; assert all(set(json.loads(Path(f'translations/{l}/{l}_session224.json').read_text(encoding='utf-8')))==keys for l in langs)"
          python tools/test_save81_source.py
          python tools/test_adjustment_buttons_source.py
  windows:
    permissions:
      contents: write
    needs: tests
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      MEMS_BUILD_NUMBER: '233'
      BASE_RELEASE_TAG: 'mems-build117-candidate-39395038798'
      BASE_ARCHIVE_NAME: 'ECU-MEMS-Manager-x64-BUILD117-CLEAN-V2.tar.gz'
      BASE_ARCHIVE_SHA256: '4f187bae49bfc134329b53eb4e455c2d125403fe510f2da08a8272b2dcb3cd3b'
      ORT_GENAI_VERSION: '0.14.0'
      ORT_GENAI_WIN_X64_SHA256: '8a303e52dc7be8fb2a5331939af451a25ac59774102d7fd09ef673adc85c5ebf'
    steps:
      - uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer Qt 5.15.2 MSVC x64
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check 'aqtinstall==3.3.0' pefile
          if($LASTEXITCODE -ne 0){throw 'QT_INSTALL_PREP_FAILED'}
          $sevenZip=(Get-Command 7z.exe -ErrorAction Stop).Source
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtcharts -O C:\Qt --external $sevenZip
          if($LASTEXITCODE -ne 0){throw 'QT_INSTALL_FAILED'}
      - name: Recuperer le SDK ONNX GenAI 0.14.0 sans changer l'IA
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $name="onnxruntime-genai-$env:ORT_GENAI_VERSION-win-x64.zip"
          $archive=Join-Path $env:RUNNER_TEMP $name
          $folder=Join-Path $env:RUNNER_TEMP 'onnx-genai'
          $url="https://github.com/microsoft/onnxruntime-genai/releases/download/v$env:ORT_GENAI_VERSION/$name"
          curl.exe -L --fail --retry 1 --retry-delay 1 -o $archive $url
          if($LASTEXITCODE -eq 0){
            if((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:ORT_GENAI_WIN_X64_SHA256){throw 'ONNX_GITHUB_SHA256_MISMATCH'}
            Expand-Archive $archive $folder -Force
            Write-Host 'ONNX_OFFICIAL_0140_VERIFIED'
          }else{
            if(Test-Path $archive){Remove-Item $archive -Force}
            $stem="microsoft.ml.onnxruntimegenai.$env:ORT_GENAI_VERSION"
            $root="https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntimegenai/$env:ORT_GENAI_VERSION"
            $package=Join-Path $env:RUNNER_TEMP "$stem.nupkg"
            curl.exe -L --fail --retry 2 --retry-delay 2 -o $package "$root/$stem.nupkg"
            if($LASTEXITCODE -ne 0){throw 'ONNX_NUGET_DOWNLOAD_FAILED'}
            dotnet nuget verify "$package" --all --verbosity normal
            if($LASTEXITCODE -ne 0){throw 'ONNX_NUGET_SIGNATURE_CHECK_FAILED'}
            # Verify Microsoft-signed package instead of the nonexistent NuGet .sha512 endpoint.
            Write-Host 'ONNX_NUGET_SIGNATURE_VERIFIED'
            $zip=Join-Path $env:RUNNER_TEMP 'onnx-genai-nuget-0140.zip'
            Copy-Item $package $zip -Force
            Expand-Archive $zip $folder -Force
            Write-Host 'ONNX_NUGET_0140_VERIFIED'
          }
          $header=Get-ChildItem $folder -Recurse -File -Filter ort_genai_c.h | Select-Object -First 1
          # Require x64 import library: the signed NuGet also contains ARM64.
          $lib=Get-ChildItem $folder -Recurse -File -Filter onnxruntime-genai.lib |
            Where-Object {$_.FullName.Contains('win-x64') -and -not $_.FullName.Contains('win-arm64')} |
            Select-Object -First 1
          if(-not $lib){throw 'ONNX_WIN_X64_IMPORT_LIBRARY_NOT_FOUND'}
          Write-Host "ONNX_GENAI_X64_LIBRARY=$($lib.FullName)"
          if(-not $header -or -not $lib){
            Get-ChildItem $folder -Recurse -File | Where-Object {$_.Name -match '(genai|ort_genai)'} | Select-Object -First 35 FullName | Format-Table
            throw 'ONNX_CPP_HEADER_OR_LIB_MISSING_DO_NOT_DISABLE_AI'
          }
          "ORT_GENAI_INCLUDE_DIR=$($header.Directory.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ORT_GENAI_LIBRARY=$($lib.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Tester le diagnostic Qt et les donnees IA sans ECU
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:PATH="C:\Qt\5.15.2\msvc2019_64\bin;$env:PATH"
          $env:QT_QPA_PLATFORM='offscreen'
          cmake -S tools/mems16na_diagnostic_test -B build-na-diagnostic -A x64 -DCMAKE_PREFIX_PATH='C:/Qt/5.15.2/msvc2019_64'
          if($LASTEXITCODE -ne 0){throw 'NA_DIAGNOSTIC_CONFIG_FAILED'}
          cmake --build build-na-diagnostic --config Release --parallel
          if($LASTEXITCODE -ne 0){throw 'NA_DIAGNOSTIC_COMPILE_FAILED'}
          & ./build-na-diagnostic/Release/mems16na_diagnostic_test.exe
          if($LASTEXITCODE -ne 0){throw 'NA_DIAGNOSTIC_QT_SELFTEST_FAILED'}
      - name: Tester la relecture et les voies MEMS 1.6 NA
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:PATH="C:\Qt\5.15.2\msvc2019_64\bin;$env:PATH"
          $env:QT_QPA_PLATFORM='offscreen'
          cmake -S tools/mems16na_analysis_test -B build-na-analysis -A x64 -DCMAKE_PREFIX_PATH='C:/Qt/5.15.2/msvc2019_64'
          if($LASTEXITCODE -ne 0){throw 'NA_ANALYSIS_CONFIG_FAILED'}
          cmake --build build-na-analysis --config Release --parallel
          if($LASTEXITCODE -ne 0){throw 'NA_ANALYSIS_COMPILE_FAILED'}
          & ./build-na-analysis/Release/mems16na_analysis_test.exe
          if($LASTEXITCODE -ne 0){throw 'NA_ANALYSIS_QT_SELFTEST_FAILED'}
      - name: Compiler SESSION et tests de mise a jour
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake -S . -B build-session-233 -A x64 -DCMAKE_PREFIX_PATH='C:/Qt/5.15.2/msvc2019_64' -DMEMS_USE_BUNDLED_LIBROSCO_X64=ON -DMEMS_RUN_REFERENCE_SELFTEST_POST_BUILD=OFF -DMEMS_USE_ONNX_GENAI=ON "-DORT_GENAI_INCLUDE_DIR=$env:ORT_GENAI_INCLUDE_DIR" "-DORT_GENAI_LIBRARY=$env:ORT_GENAI_LIBRARY"
          if($LASTEXITCODE -ne 0){throw 'CMAKE_SESSION_CONFIG_FAILED'}
          $helpQrc=Get-Content 'build-session-233/mems-help-illustrations.qrc' -Raw -Encoding utf8
          if(([regex]::Matches($helpQrc,'<file alias=')).Count -ne 12){throw 'SESSION_233_HELP_QRC_MISSING_IMAGES'}
          if($helpQrc -match '\(910\)\.png'){throw 'SESSION_233_OLD_INJECTION_IMAGE_EMBEDDED'}
          Write-Host 'SESSION_233_HELP_IMAGES_EMBEDDED_PASS'
          # mems19_protocol_selftest runs in the executable's CMake POST_BUILD.
          # Qt DLLs must already be resolvable at this stage on Windows.
          $env:PATH="C:\Qt\5.15.2\msvc2019_64\bin;$env:PATH"
          cmake --build build-session-233 --config Release --target ecu_mems_manager ecu_mems_uninstaller ecu_communication_log_selftest mems_documentary_update_selftest mems_documentary_selftest mems_documentary_multilingual_selftest mems_documentary_native_intent_selftest mems_documentary_encrypted_selftest mems_documentary_encrypted_install_selftest mems_ecu_reference_routing_selftest --parallel
          if($LASTEXITCODE -ne 0){throw 'CMAKE_SESSION_COMPILATION_FAILED'}
          if(-not(Test-Path build-session-233/Release/ecu_mems_manager.exe)){throw 'SESSION_EXE_MISSING'}
          $bin=(Resolve-Path build-session-233/Release).Path
          $env:PATH="C:\Qt\5.15.2\msvc2019_64\bin;$bin;$env:PATH"
          & "$bin/mems_ecu_reference_routing_selftest.exe"
          if($LASTEXITCODE -ne 0){throw 'ECU_REFERENCE_ROUTING_NON_REGRESSION_FAILED'}
          & "$bin/ecu_communication_log_selftest.exe"
          if($LASTEXITCODE -ne 0){throw 'ECU_COMMUNICATION_LOG_SELFTEST_FAILED'}
          Write-Host 'SESSION_233_ECU_COMMUNICATION_LOG_NO_OVERWRITE_PASS'
          & "$bin/mems19_protocol_selftest.exe"
          if($LASTEXITCODE -ne 0){throw 'MEMS19_PROTOCOL_SELFTEST_FAILED'}
          Write-Host 'SESSION_233_MEMS19_PROTOCOL_SELFTEST_PASS'
          & "$bin/mems2j_protocol_selftest.exe"
          if($LASTEXITCODE -ne 0){throw 'MEMS2J_PROTOCOL_SELFTEST_FAILED'}
          Write-Host 'SESSION_233_MEMS2J_PROTOCOL_SELFTEST_PASS'
          & "$bin/mems3_protocol_selftest.exe"
          if($LASTEXITCODE -ne 0){throw 'MEMS3_PROTOCOL_SELFTEST_FAILED'}
          Write-Host 'SESSION_233_MEMS3_PROTOCOL_SELFTEST_PASS'
          & "$bin/lucas5as_protocol_selftest.exe"
          if($LASTEXITCODE -ne 0){throw 'LUCAS5AS_PROTOCOL_SELFTEST_FAILED'}
          Write-Host 'SESSION_233_LUCAS_5AS_OUTPUT_PROTOCOL_SELFTEST_PASS'
          Write-Host 'SESSION_233_LUCAS_5AS_PLIP_MONITOR_SELFTEST_PASS'
          Write-Host 'SESSION_233_ECU_ROUTING_AND_EXISTING_IA_INTENT_NON_REGRESSION_PASS'
          $uiHeader=Get-ChildItem build-session-233 -Recurse -File -Filter ui_mainwindow.h | Select-Object -First 1
          if(-not $uiHeader){throw 'SESSION_233_GENERATED_UI_HEADER_MISSING'}
          $uiCode=Get-Content -LiteralPath $uiHeader.FullName -Raw
          if($uiCode -notmatch 'QMetaObject::connectSlotsByName\(MainWindow\)'){throw 'SESSION_233_QT_AUTO_CONNECT_MISSING'}
          Write-Host 'SESSION_233_QT_AUTOCONNECT_GENERATED_PASS'
          Write-Host 'SESSION_233_COMPILE_PASS'
      - name: Tester le catalogue de mises a jour sans connexion ni base Rover
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $qt='C:\Qt\5.15.2\msvc2019_64'
          $bin=(Resolve-Path build-session-233/Release).Path
          & "$qt/bin/windeployqt.exe" --release --compiler-runtime --no-translations --dir $bin "$bin/mems_documentary_update_selftest.exe"
          if($LASTEXITCODE -ne 0){throw 'UPDATE_QT_DEPLOY_FAILED'}
          & "$bin/mems_documentary_update_selftest.exe"
          if($LASTEXITCODE -ne 0){throw 'UPDATE_CATALOG_SELFTEST_FAILED'}
      - name: Recuperer la distribution existante avec IA et ECU inchanges
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force download-base,dist-session-233 | Out-Null
          gh release download $env:BASE_RELEASE_TAG --pattern $env:BASE_ARCHIVE_NAME --dir download-base
          if($LASTEXITCODE -ne 0){throw 'RUNTIME_DOWNLOAD_FAILED'}
          $archive=Join-Path download-base $env:BASE_ARCHIVE_NAME
          if((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:BASE_ARCHIVE_SHA256){throw 'RUNTIME_BASE_SHA_MISMATCH'}
          tar.exe -xzf $archive -C dist-session-233
          if($LASTEXITCODE -ne 0){throw 'RUNTIME_EXTRACT_FAILED'}
          if(-not(Test-Path dist-session-233/ecu_mems_manager.exe)){throw 'RUNTIME_LAYOUT_INVALID'}
      - name: Assembler sans nouvelle base documentaire, conserver les bases ECU et expertes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dist=(Resolve-Path dist-session-233).Path
          Copy-Item build-session-233/Release/ecu_mems_manager.exe "$dist/ecu_mems_manager.exe" -Force
          Copy-Item build-session-233/Release/ecu_mems_uninstaller.exe "$dist/ecu_mems_uninstaller.exe" -Force
          Copy-Item build-session-233/librosco-x64/Release/mems_manager_x64.dll "$dist/mems_manager_x64.dll" -Force
          # Do not reuse the obsolete language catalogues from the BUILD117 base distribution.
          # The final Setup must contain the six freshly built SESSION translation folders.
          $compiledTranslations=Join-Path (Resolve-Path build-session-233/Release).Path 'translations'
          if(-not(Test-Path $compiledTranslations)){throw 'SIX_LANGUAGE_BUILD_CATALOGUES_MISSING'}
          $distTranslations=Join-Path $dist 'translations'
          New-Item -ItemType Directory -Force $distTranslations | Out-Null
          Copy-Item -Path "$compiledTranslations/*" -Destination $distTranslations -Recurse -Force
          foreach($lang in @('fr','en','es','it','pt','de')){
            $name="${lang}_session162.json"
            $from=Join-Path $compiledTranslations "$lang/$name"
            $to=Join-Path $distTranslations "$lang/$name"
            if(-not(Test-Path $from) -or -not(Test-Path $to)){throw "TRANSLATION_NOT_DISTRIBUTED_$lang"}
            if((Get-FileHash -LiteralPath $from -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath $to -Algorithm SHA256).Hash){
              throw "TRANSLATION_DISTRIBUTION_SHA_MISMATCH_$lang"
            }
          }
          foreach($lang in @('fr','en','es','it','pt','de')){
            $module="${lang}_program_update.json"
            $a=Join-Path $compiledTranslations "$lang/$module"
            $b=Join-Path $distTranslations "$lang/$module"
            if(-not(Test-Path $a) -or -not(Test-Path $b)){throw "PROGRAM_UPDATE_TRANSLATION_MISSING_$lang"}
            if((Get-FileHash $a -Algorithm SHA256).Hash -ne (Get-FileHash $b -Algorithm SHA256).Hash){throw "PROGRAM_UPDATE_TRANSLATION_MISMATCH_$lang"}
          }
          foreach($lang in @('fr','en','es','it','pt','de')){
            $module="${lang}_analysis_table.json"
            $from=Join-Path $compiledTranslations "$lang/$module"
            $dest=Join-Path $distTranslations "$lang/$module"
            if(-not(Test-Path $from) -or -not(Test-Path $dest)){throw "ANALYSIS_TRANSLATION_NOT_DISTRIBUTED_$lang"}
            if((Get-FileHash $from -Algorithm SHA256).Hash -ne (Get-FileHash $dest -Algorithm SHA256).Hash){throw "ANALYSIS_TRANSLATION_SHA_MISMATCH_$lang"}
          }
          foreach($lang in @('fr','en','es','it','pt','de')){
            $module="${lang}_mems16na.json"
            $from=Join-Path $compiledTranslations "$lang/$module"
            $to=Join-Path $distTranslations "$lang/$module"
            if(-not(Test-Path $from) -or -not(Test-Path $to)){throw "MEMS16NA_TRANSLATION_NOT_DISTRIBUTED_$lang"}
            if((Get-FileHash $from -Algorithm SHA256).Hash -ne (Get-FileHash $to -Algorithm SHA256).Hash){throw "MEMS16NA_TRANSLATION_SHA_MISMATCH_$lang"}
          }
          Write-Host 'SESSION_233_ALL_SIX_TRANSLATION_PACKAGES_COPIED_AND_SHA_VERIFIED'
          $documentary=Join-Path $dist 'database/documentary'
          if(Test-Path $documentary){Remove-Item $documentary -Recurse -Force}
          foreach($suffix in @('','-wal','-shm','-journal')){
            $userDb=Join-Path $dist ('database/ecu_mems_manager.sqlite'+$suffix)
            if(Test-Path $userDb){Remove-Item $userDb -Force}
          }
          $qt='C:\Qt\5.15.2\msvc2019_64'
          & "$qt/bin/windeployqt.exe" --release --compiler-runtime --no-translations --dir $dist "$dist/ecu_mems_manager.exe"
          if($LASTEXITCODE -ne 0){throw 'QT_SESSION_DEPLOY_FAILED'}
          & "$qt/bin/windeployqt.exe" --release --compiler-runtime --no-translations --dir $dist "$dist/ecu_mems_uninstaller.exe"
          if($LASTEXITCODE -ne 0){throw 'QT_UNINSTALLER_DEPLOY_FAILED'}
          # The GitHub Windows runner has no interactive monitor. Include
          # Qt's authentic offscreen plugin in the SAME installed Setup.
          $platforms=Join-Path $dist 'platforms'
          New-Item -ItemType Directory -Force $platforms | Out-Null
          Copy-Item (Join-Path $qt 'plugins/platforms/qoffscreen.dll') (Join-Path $platforms 'qoffscreen.dll') -Force
          if(-not(Test-Path (Join-Path $platforms 'qoffscreen.dll'))){throw 'OFFSCREEN_QT_PLUGIN_NOT_DEPLOYED'}
          foreach($file in @('ecu_mems_manager.exe','MEMSLibrary.dll','MEMSLibrary_Pack_001/knowledge.sqlite','mems_manager_x64.dll','database/reference/runtime_visual_catalog.json')){
            if(-not(Test-Path (Join-Path $dist $file))){throw "DIAGNOSTIC_DEPENDENCY_MISSING $file"}
          }
          if(Test-Path $documentary){throw 'ROVER_SQLITE_SHIPPED'}
          if(Test-Path (Join-Path $dist 'database/ecu_mems_manager.sqlite')){throw 'USER_DB_SHIPPED'}
          Write-Host 'SESSION_233_NO_ROVER_DB_DIAGNOSTIC_DATA_PRESERVED'
      - name: Controler les fonctions ECU et base experte
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:DIST_ROOT=(Resolve-Path dist-session-233).Path
          @'
          import os,pefile,sqlite3
          from pathlib import Path
          root=Path(os.environ['DIST_ROOT'])
          for n in ('ecu_mems_manager.exe','mems_manager_x64.dll','MEMSLibrary.dll'):
              pe=pefile.PE(str(root/n),fast_load=True)
              assert pe.FILE_HEADER.Machine==0x8664,n
              pe.close()
          assert not (root/'database'/'documentary').exists()
          assert not (root/'database'/'ecu_mems_manager.sqlite').exists()
          with sqlite3.connect(root/'MEMSLibrary_Pack_001'/'knowledge.sqlite') as con:
              assert con.execute('pragma integrity_check').fetchone()[0]=='ok'
              assert con.execute('select count(*) from ravemems_document').fetchone()[0]==47
          print('SESSION_233_X64_ECU_AI_AND_DOCUMENTARY_SEPARATION_PASS')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'PACKAGE_ECU_REGRESSION'}
      - name: Preparer les bases et index de reference des six langues avant le Setup
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dist=(Resolve-Path dist-session-233).Path
          $prepared=Join-Path $dist 'database/prepared-reference'
          if(Test-Path $prepared){Remove-Item $prepared -Recurse -Force}
          New-Item -ItemType Directory -Force $prepared | Out-Null
          $env:QT_QPA_PLATFORM='offscreen'
          $env:QT_OPENGL='software'
          $env:PATH="$dist;$env:PATH"
          foreach($lang in @('fr','en','es','it','pt','de')){
            $timer=[Diagnostics.Stopwatch]::StartNew()
            $p=Start-Process -FilePath "$dist/ecu_mems_manager.exe" -WorkingDirectory $dist -ArgumentList @('--prepare-reference-cache',$lang,('"' + $prepared + '"')) -PassThru
            if(-not $p.WaitForExit(600000)){Stop-Process -Id $p.Id -Force;throw "REFERENCE_BUILD_TIMEOUT_$lang"}
            if($p.ExitCode -ne 0){throw "REFERENCE_BUILD_FAILED_${lang}_$($p.ExitCode)"}
            Write-Host "REFERENCE_BUILD_MS_${lang}=$($timer.ElapsedMilliseconds)"
          }
          $env:PREPARED_ROOT=$prepared
          @'
          import os,json,hashlib,sqlite3
          from pathlib import Path
          p=Path(os.environ['PREPARED_ROOT'])
          langs=('fr','en','es','it','pt','de')
          names=['ecu_mems_reference_r5.sqlite']
          for lang in langs:
              names.append(f'indexes/{lang}.sqlite')
              names.extend(f'fiches/{lang}/mems_1_{g}.xml' for g in (2,3,6,9))
          sizes={}
          for name in names:
              f=p/name
              assert f.is_file() and f.stat().st_size>0,name
              sizes[name]=f.stat().st_size
              if f.suffix=='.sqlite':
                  with sqlite3.connect(f.resolve().as_uri()+'?mode=ro',uri=True) as c:
                      assert c.execute('pragma integrity_check').fetchone()[0]=='ok',name
                      if name.startswith('indexes/'):
                          assert c.execute('select count(*) from search_documents').fetchone()[0]>0,name
                          assert c.execute('select count(*) from search_terms').fetchone()[0]>0,name
                          assert c.execute("select value from search_meta where key='schema_version'").fetchone()[0]=='5',name
          source=p.parent/'reference'/'manifest.json'
          (p/'manifest.json').write_text(json.dumps(dict(schema=1,source_manifest_sha256=hashlib.sha256(source.read_bytes()).hexdigest(),sizes=sizes)),encoding='utf-8')
          print('PREPARED_REFERENCE_BYTES',sum(sizes.values()))
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'PREPARED_REFERENCE_INTEGRITY_FAILED'}
      - name: Creer un vrai Setup Windows pour SESSION 233
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          choco install innosetup -y --no-progress --limit-output
          if($LASTEXITCODE -ne 0){throw 'INNO_INSTALL_FAILED'}
          $compiler=Get-ChildItem 'C:\Program Files (x86)' -Recurse -File -Filter ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $compiler){throw 'INNO_COMPILER_MISSING'}
          $iss=@'
          #define MyAppName "ECU MEMS Manager SESSION"
          #define MyAppVersion "1.2.33"
          [Setup]
          AppId={{BC7FAF73-5BCF-49FC-8513-9D9C7B08F133}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher=ECU MEMS Manager SESSION
          DefaultDirName={autopf}\ECU MEMS Manager SESSION
          DefaultGroupName=ECU MEMS Manager SESSION
          UsePreviousGroup=no
          OutputDir=setup-session-233
          OutputBaseFilename=ECU MEMS Manager SESSION 233 Setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ShowLanguageDialog=yes
          UsePreviousLanguage=no
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          PrivilegesRequired=admin
          UninstallDisplayIcon={app}\ecu_mems_manager.exe
          [Languages]
          Name: "french"; MessagesFile: "compiler:Languages\French.isl"
          Name: "english"; MessagesFile: "compiler:Default.isl"
          Name: "spanish"; MessagesFile: "compiler:Languages\Spanish.isl"
          Name: "italian"; MessagesFile: "compiler:Languages\Italian.isl"
          Name: "portuguese"; MessagesFile: "compiler:Languages\Portuguese.isl"
          Name: "german"; MessagesFile: "compiler:Languages\German.isl"
          [Files]
          Source: "dist-session-233\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [INI]
          Filename: "{app}\session-install-language.ini"; Section: "Installation"; Key: "Language"; String: "fr"; Languages: french
          Filename: "{app}\session-install-language.ini"; Section: "Installation"; Key: "Language"; String: "en"; Languages: english
          Filename: "{app}\session-install-language.ini"; Section: "Installation"; Key: "Language"; String: "es"; Languages: spanish
          Filename: "{app}\session-install-language.ini"; Section: "Installation"; Key: "Language"; String: "it"; Languages: italian
          Filename: "{app}\session-install-language.ini"; Section: "Installation"; Key: "Language"; String: "pt"; Languages: portuguese
          Filename: "{app}\session-install-language.ini"; Section: "Installation"; Key: "Language"; String: "de"; Languages: german
          [Icons]
          Name: "{group}\ECU MEMS Manager SESSION"; Filename: "{app}\ecu_mems_manager.exe"
          Name: "{autodesktop}\ECU MEMS Manager SESSION"; Filename: "{app}\ecu_mems_manager.exe"; IconFilename: "{app}\ecu_mems_manager.exe"
          '@
          $iss | Set-Content setup-session-233.iss -Encoding utf8
          & $compiler.FullName setup-session-233.iss
          if($LASTEXITCODE -ne 0){throw 'INNO_BUILD_FAILED'}
          $setup=Get-ChildItem setup-session-233 -File -Filter '*.exe' | Select-Object -First 1
          if(-not $setup -or $setup.Length -lt 100MB){throw 'SETUP_TOO_SMALL_OR_MISSING'}
          Write-Host "SESSION_233_SETUP_SHA256=$((Get-FileHash $setup.FullName -Algorithm SHA256).Hash)"
      - name: Sauvegarder le Setup fabrique avant les controles ulterieurs
        uses: actions/upload-artifact@v4
        with:
          name: SESSION-233-Setup
          path: setup-session-233/*.exe
          compression-level: 0
          if-no-files-found: error
      - name: Installer et demarrer reellement sous Windows sans base RAVE
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $setup=Get-ChildItem setup-session-233 -File -Filter '*.exe' | Select-Object -First 1
          $folder=Join-Path $env:RUNNER_TEMP 'SESSION_233_INSTALLED'
          if(Test-Path $folder){Remove-Item $folder -Recurse -Force}
          $install=Start-Process -FilePath $setup.FullName -ArgumentList '/LANG=french','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$folder" -Wait -PassThru
          if($install.ExitCode -ne 0){throw "SETUP_INSTALL_EXIT_$($install.ExitCode)"}
          if(-not(Test-Path "$folder/ecu_mems_manager.exe")){throw 'INSTALLED_EXE_MISSING'}
          foreach($lang in @('fr','en','es','it','pt','de')){
            $catalog=Join-Path $folder "translations/$lang/${lang}_session162.json"
            $origin=Join-Path (Resolve-Path build-session-233/Release).Path "translations/$lang/${lang}_session162.json"
            if(-not(Test-Path $catalog)){throw "INSTALLED_TRANSLATION_MISSING_$lang"}
            if((Get-FileHash $origin -Algorithm SHA256).Hash -ne (Get-FileHash $catalog -Algorithm SHA256).Hash){throw "INSTALLED_TRANSLATION_SHA_MISMATCH_$lang"}
          }
          # Ensure the new About translation keys reach the *installed* Setup.
          foreach($lang in @('fr','en','es','it','pt','de')){
            $module="${lang}_about.json"
            $from=Join-Path (Resolve-Path build-session-233/Release).Path "translations/$lang/$module"
            $to=Join-Path $folder "translations/$lang/$module"
            if(-not(Test-Path $from) -or -not(Test-Path $to)){throw "ABOUT_233_INSTALLED_MISSING_$lang"}
            if((Get-FileHash $from -Algorithm SHA256).Hash -ne (Get-FileHash $to -Algorithm SHA256).Hash){
              throw "ABOUT_233_INSTALLED_TRANSLATION_SHA_MISMATCH_$lang"
            }
            $translated=Get-Content $to -Raw -Encoding utf8 | ConvertFrom-Json
            if(-not $translated.'6207' -or $translated.'6207' -notmatch 'MEMS 3'){
              throw "ABOUT_233_MEMS3_KEY_NOT_INSTALLED_$lang"
            }
            if(-not $translated.'6208' -or $translated.'6208' -notmatch 'Lucas 5AS'){
              throw "ABOUT_233_LUCAS5AS_KEY_NOT_INSTALLED_$lang"
            }
          }
          Write-Host 'SESSION_233_SIX_ABOUT_TRANSLATIONS_INSTALLED_AND_SHA_VERIFIED'
          foreach($lang in @('fr','en','es','it','pt','de')){
            $module="${lang}_other_ecus.json"
            $build=Join-Path (Resolve-Path build-session-233/Release).Path "translations/$lang/$module"
            $installed=Join-Path $folder "translations/$lang/$module"
            if(-not(Test-Path $build) -or -not(Test-Path $installed)){throw "SESSION_233_NEW_PAGE_CATALOG_MISSING_$lang"}
            if((Get-FileHash $build -Algorithm SHA256).Hash -ne (Get-FileHash $installed -Algorithm SHA256).Hash){
              throw "SESSION_233_NEW_PAGE_CATALOG_SHA_MISMATCH_$lang"
            }
          }
          Write-Host 'SESSION_233_SIX_NEW_PAGE_CATALOGS_INSTALLED_AND_VERIFIED'
          foreach($lang in @('fr','en','es','it','pt','de')){
            $module="${lang}_mems16na.json"
            $from=Join-Path (Resolve-Path build-session-233/Release).Path "translations/$lang/$module"
            $to=Join-Path $folder "translations/$lang/$module"
            if(-not(Test-Path $from) -or -not(Test-Path $to)){throw "MEMS16NA_INSTALLED_TRANSLATION_MISSING_$lang"}
            if((Get-FileHash $from -Algorithm SHA256).Hash -ne (Get-FileHash $to -Algorithm SHA256).Hash){throw "MEMS16NA_INSTALLED_TRANSLATION_SHA_MISMATCH_$lang"}
          }
          foreach($file in @('ecu_mems_manager.exe','mems_manager_x64.dll')){
            $from=Join-Path (Resolve-Path dist-session-233).Path $file
            $to=Join-Path $folder $file
            if(-not(Test-Path $to)){throw "INSTALLED_BINARY_MISSING_$file"}
            if((Get-FileHash $from -Algorithm SHA256).Hash -ne (Get-FileHash $to -Algorithm SHA256).Hash){throw "INSTALLED_BINARY_SHA_MISMATCH_$file"}
          }
          Write-Host 'SESSION_233_SIX_LANGUAGE_INSTALLED_SETUP_CATALOGUES_VERIFIED'
          foreach($lang in @('fr','en','es','it','pt','de')){
            $module="${lang}_ecu_rosco_notes.json"
            $from=Join-Path (Resolve-Path build-session-233/Release).Path "translations/$lang/$module"
            $to=Join-Path $folder "translations/$lang/$module"
            if(-not(Test-Path $from) -or -not(Test-Path $to)){throw "SESSION_233_NOTES_CATALOG_MISSING_$lang"}
            if((Get-FileHash $from -Algorithm SHA256).Hash -ne (Get-FileHash $to -Algorithm SHA256).Hash){
              throw "SESSION_233_NOTES_CATALOG_SHA_MISMATCH_$lang"
            }
            $translation=Get-Content $to -Raw -Encoding utf8 | ConvertFrom-Json
            if([string]::IsNullOrWhiteSpace($translation.'18120')){throw "SESSION_233_NOTES_LABEL_MISSING_$lang"}
          }
          Write-Host 'SESSION_233_SIX_NOTES_TRANSLATIONS_INSTALLED_AND_VERIFIED'
          foreach($lang in @('fr','en','de','es','it','pt')){
            foreach($version in @('220','221','222','223','224')){
              $module="${lang}_session$version.json"
              $from=Join-Path (Resolve-Path build-session-233/Release).Path "translations/$lang/$module"
              $to=Join-Path $folder "translations/$lang/$module"
              if(-not(Test-Path $from) -or -not(Test-Path $to)){throw "SESSION_${version}_CATALOG_MISSING_$lang"}
              if((Get-FileHash $from -Algorithm SHA256).Hash -ne (Get-FileHash $to -Algorithm SHA256).Hash){throw "SESSION_${version}_CATALOG_SHA_MISMATCH_$lang"}
            }
          }
          if(Test-Path "$folder/database/documentary"){throw 'DOCUMENTARY_SQLITE_INSIDE_SETUP'}
          if(Test-Path "$folder/database/ecu_mems_manager.sqlite"){throw 'USER_DATABASE_IN_SETUP'}
          foreach($file in @('MEMSLibrary.dll','MEMSLibrary_Pack_001/knowledge.sqlite','database/reference/runtime_visual_catalog.json','mems_manager_x64.dll')){
            if(-not(Test-Path (Join-Path $folder $file))){throw "INSTALLED_DIAGNOSTIC_FILE_MISSING $file"}
          }
          $ini=Get-Content "$folder/session-install-language.ini" -Raw
          if($ini -notmatch '(?m)^Language=fr\s*$'){throw 'SETUP_LANGUAGE_MISSING'}
          foreach($attempt in 1,2){
            $ready=Join-Path $env:RUNNER_TEMP "session233-startup-$attempt.txt"
            if(Test-Path $ready){Remove-Item $ready -Force}
            $env:MEMS_STARTUP_READY_FILE=$ready
            $timer=[Diagnostics.Stopwatch]::StartNew()
            $instance=Start-Process -FilePath "$folder/ecu_mems_manager.exe" -WorkingDirectory $folder -ArgumentList '--session-startup-probe' -PassThru
            try{
              while(-not(Test-Path $ready)){
                $instance.Refresh()
                if($instance.HasExited){throw "INSTALLED_APP_EARLY_EXIT_$($instance.ExitCode)"}
                if($timer.ElapsedMilliseconds -gt 60000){throw "REAL_STARTUP_NOT_READY_60S_$attempt"}
                Start-Sleep -Milliseconds 100
              }
              $result=Get-Content $ready
              if($result.Count -ne 3 -or $result[1] -ne 'prepared' -or $result[2] -ne 'menu=16'){throw "PREPARED_STARTUP_NOT_USED_$attempt"}
              Write-Host "REAL_STARTUP_MS_$attempt=$($result[0])"
            } finally {
              if(-not $instance.HasExited){Stop-Process -Id $instance.Id -Force}
            }
          }
          Remove-Item Env:MEMS_STARTUP_READY_FILE -ErrorAction SilentlyContinue
          Write-Host 'SESSION_233_REAL_WINDOWS_READY_TWICE_16_VISIBLE_PAGES_NO_DOCUMENTARY_DB_OK'
      - name: Verifier les corrections de regression conservees
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $logger=Get-Content logger.cpp -Raw
          $actuators=Get-Content memsinterface_dispatch.cpp -Raw
          $analysis=Get-Content analysistab_impl_part3.inc -Raw
          if($logger -notmatch 'QStandardPaths::DocumentsLocation' -or $logger -notmatch 'QDir\(\)\.mkpath\(m_logDir\)'){throw 'LOGGER_NOT_WRITABLE_USER_DOCUMENTS'}
          if($analysis -notmatch 'ECU MEMS Manager/logs'){throw 'ANALYSIS_LOG_DIRECTORY_MISMATCH'}
          $actuatorBlock=$actuators -split 'bool MEMSInterface::guardedMemsTestActuator\('
          if($actuatorBlock.Count -ne 2){throw 'ACTUATOR_FUNCTION_NOT_FOUND'}
          $actuatorBlock=$actuatorBlock[1] -split 'bool MEMSInterface::guardedMemsMoveIac\('
          if($actuatorBlock.Count -ne 2 -or $actuatorBlock[0] -match 'allowsMutation\(' -or $actuatorBlock[0] -notmatch 'mems_is_connected'){throw 'ACTUATOR_CONNECTION_REGRESSION'}
          Write-Host 'SESSION_233_LOGGING_AND_ACTUATOR_SOURCE_NON_REGRESSION_PASS'
      - name: Verifier le transport HTTPS natif est dans la source et l'executable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $cmake=Get-Content CMakeLists.txt -Raw
          $dialog=Get-Content database/MemsDocumentaryUpdateDialog.cpp -Raw
          if($cmake -notmatch 'MemsDocumentaryWindowsTransport.cpp'){throw 'NATIVE_TRANSPORT_NOT_COMPILED'}
          if($dialog -notmatch 'checkManifestWindows\(' -or $dialog -notmatch 'downloadPackWindows\('){throw 'NATIVE_TRANSPORT_NOT_CONNECTED_TO_DIALOG'}
          if($env:MEMS_BUILD_NUMBER -ne '233'){throw 'WRONG_BUILD_NUMBER'}
          Write-Host 'SESSION_233_NATIVE_WINDOWS_HTTPS_TRANSPORT_INTEGRATED'
      - name: Mettre le Setup de test et son SHA256 dans une prerelease du depot principal uniquement
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -ne 'mini56/ECU-Mems-Manager-Session'){throw 'UNEXPECTED_REPOSITORY'}
          $tag="mems-session-build-233-test-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $setup=Get-ChildItem setup-session-233 -File -Filter '*.exe' | Select-Object -First 1
          if(-not $setup -or $setup.Length -lt 100MB){throw 'SESSION_233_SETUP_MISSING_OR_TOO_SMALL'}
          $asset='ECU-Mems-Manager-Session-233-Setup.exe'
          $final=Join-Path $setup.DirectoryName $asset
          Copy-Item -LiteralPath $setup.FullName -Destination $final -Force
          $hash=(Get-FileHash -LiteralPath $final -Algorithm SHA256).Hash.ToLowerInvariant()
          $hashFile=Join-Path $setup.DirectoryName 'SESSION-233-Setup.sha256'
          "$hash  $asset" | Set-Content -LiteralPath $hashFile -Encoding ascii
          gh release create $tag $final $hashFile --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'SESSION 233 - Essai' --notes 'Version de test. Validation sur vehicule requise.' --draft --prerelease --latest=false
          if($LASTEXITCODE -ne 0){throw 'PRIVATE_TEST_RELEASE_FAILED'}
          $releases=gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          $release=$releases | Where-Object {$_.tag_name -eq $tag} | Select-Object -First 1
          if($LASTEXITCODE -ne 0 -or -not $release -or -not $release.draft -or -not $release.prerelease){throw 'DRAFT_TEST_RELEASE_VERIFY_FAILED'}
          foreach($file in @($final,$hashFile)){
            $expected=(Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $name=Split-Path $file -Leaf
            $item=@($release.assets | Where-Object {$_.name -eq $name})
            if($item.Count -ne 1 -or $item[0].size -ne (Get-Item $file).Length -or $item[0].digest -ne "sha256:$expected"){throw "PRIVATE_ASSET_MISMATCH_$name"}
          }
          Write-Host "PRIVATE_SETUP_VERIFIED_SHA256=$hash"
          Write-Host $release.html_url
