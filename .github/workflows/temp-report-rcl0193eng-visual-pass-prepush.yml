          ref: RAPPORT
      - name: Append RCL0193ENG visual pass prepush
        shell: bash
        run: |
          cat >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md <<'EOF'

          ## 2026-08-31 - RCL0193ENG - AVANT VALIDATION VISUELLE DES PAGES BLANCHES ET EXTRACTION 1-50

