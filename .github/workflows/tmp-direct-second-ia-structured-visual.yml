name: TEMP direct second IA structured visual correction
on:
  push:
    branches: [tmp-ravemems-ia-visual-integration]
    paths:
      - '.github/workflows/tmp-direct-second-ia-structured-visual.yml'
permissions:
  contents: write
jobs:
  edit-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-ravemems-ia-visual-integration
          fetch-depth: 0
      - name: Edit source directly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'marker missing in {path}: {old[:100]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'marker not unique in {path}: count={text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # ExpertKnowledgeReader: structured read-only visual lookup by selected fact key.
          replace_once('expert/ExpertKnowledgeReader.h',
              '    QList<ExpertFact> facts(const ExpertContext &context) const;\n    QList<ExpertRule> rules(const ExpertContext &context) const;\n',
              '    QList<ExpertFact> facts(const ExpertContext &context) const;\n    QString visualReferenceForFact(const QString &factKey) const;\n    QList<ExpertRule> rules(const ExpertContext &context) const;\n')

          replace_once('expert/ExpertKnowledgeReader.cpp',
              'QString ExpertKnowledgeReader::lastError() const\n{\n    return m_lastError;\n}\n\n',
              '''QString ExpertKnowledgeReader::lastError() const
          {
              return m_lastError;
          }

          QString ExpertKnowledgeReader::visualReferenceForFact(const QString &factKey) const
          {
              const QString key = factKey.trimmed();
              if (!isOpen() || key.isEmpty())
                  return QString();

              const QString assetPrefix = QStringLiteral("asset:");
              if (key.startsWith(assetPrefix, Qt::CaseInsensitive))
                  return key.mid(assetPrefix.size()).trimmed();

              if (!tableExists(QStringLiteral("mems_knowledge_item")))
                  return QString();

              QSqlQuery query(m_database);
              query.prepare(QStringLiteral(
                  "SELECT image_ref FROM mems_knowledge_item WHERE knowledge_key=:key LIMIT 1"));
              query.bindValue(QStringLiteral(":key"), key);
              if (!query.exec() || !query.next())
                  return QString();
              return query.value(0).toString().trimmed();
          }

          ''')

          # IaMemsService API/state: visual reference travels separately from rendered answer text.
          replace_once('expert/IaMemsService.h',
              '    void responseReady(const QString &text);\n    void systemMessage(const QString &text);\n',
              '    void responseReady(const QString &text);\n    void responseVisualReferenceReady(const QString &reference);\n    void systemMessage(const QString &text);\n')
          replace_once('expert/IaMemsService.h',
              '    QString knowledgeAnswer(const QString &question) const;\n',
              '    QString knowledgeAnswer(const QString &question);\n')
          replace_once('expert/IaMemsService.h',
              '    QString m_pendingGrounding;\n',
              '    QString m_pendingGrounding;\n    QString m_pendingVisualReference;\n')

          # LocalAi completion/error and local fallback must preserve the selected structured visual.
          replace_once('expert/IaMemsService.cpp',
              '''    connect(m_localAi, &LocalAiClient::responseReady,
                      this, [this](const QString &text) {
                          m_pendingGrounding.clear();
                          emit responseReady(text);
                          emit statusChanged();
                      });
          ''',
              '''    connect(m_localAi, &LocalAiClient::responseReady,
                      this, [this](const QString &text) {
                          const QString visualReference = m_pendingVisualReference.trimmed();
                          m_pendingGrounding.clear();
                          m_pendingVisualReference.clear();
                          emit responseReady(text);
                          if (!visualReference.isEmpty())
                              emit responseVisualReferenceReady(visualReference);
                          emit statusChanged();
                      });
          ''')
          replace_once('expert/IaMemsService.cpp',
              '''    connect(m_localAi, &LocalAiClient::responseError,
                      this, [this](const QString &message) {
                          QString fallback;
                          if (I18n::language().trimmed().toLower() == QStringLiteral("fr"))
                              fallback = m_pendingGrounding.trimmed();
                          if (fallback.isEmpty())
                              fallback = I18n::text(99023);
                          m_pendingGrounding.clear();
                          emit responseReady(fallback);
                          emit systemMessage(I18n::text(99024).arg(message));
                          emit statusChanged();
                      });
          ''',
              '''    connect(m_localAi, &LocalAiClient::responseError,
                      this, [this](const QString &message) {
                          QString fallback;
                          if (I18n::language().trimmed().toLower() == QStringLiteral("fr"))
                              fallback = m_pendingGrounding.trimmed();
                          if (fallback.isEmpty())
                              fallback = I18n::text(99023);
                          const QString visualReference = m_pendingVisualReference.trimmed();
                          m_pendingGrounding.clear();
                          m_pendingVisualReference.clear();
                          emit responseReady(fallback);
                          if (!visualReference.isEmpty())
                              emit responseVisualReferenceReady(visualReference);
                          emit systemMessage(I18n::text(99024).arg(message));
                          emit statusChanged();
                      });
          ''')
          replace_once('expert/IaMemsService.cpp',
              '''    updateContextFromQuestion(trimmed);
              m_pendingGrounding = groundingFor(trimmed);
          ''',
              '''    updateContextFromQuestion(trimmed);
              m_pendingVisualReference.clear();
              m_pendingGrounding = groundingFor(trimmed);
          ''')
          replace_once('expert/IaMemsService.cpp',
              '''    if (fallback.isEmpty())
                  fallback = I18n::text(99022);
              m_pendingGrounding.clear();
              emit responseReady(fallback);
              emit statusChanged();
          ''',
              '''    if (fallback.isEmpty())
                  fallback = I18n::text(99022);
              const QString visualReference = m_pendingVisualReference.trimmed();
              m_pendingGrounding.clear();
              m_pendingVisualReference.clear();
              emit responseReady(fallback);
              if (!visualReference.isEmpty())
                  emit responseVisualReferenceReady(visualReference);
              emit statusChanged();
          ''')

          # Generic procedure evidence scoring: prefer a real structured procedure for remove/refit requests.
          replace_once('expert/IaMemsService.cpp',
              '''bool hasPinoutEvidence(const QString &text)
          {
              return hasDirectConnectorEvidence(text)
                  || text.contains(QStringLiteral("wiring"))
                  || containsWord(text, QStringLiteral("broche"))
                  || text.contains(QStringLiteral("pinout"))
                  || text.contains(QStringLiteral("connector"))
                  || text.contains(QStringLiteral("connecteur"))
                  || text.contains(QStringLiteral("socket"))
                  || text.contains(QStringLiteral("diagnostic_socket"))
                  || containsWord(text, QStringLiteral("obd"))
                  || text.contains(QStringLiteral("c159"))
                  || text.contains(QStringLiteral("c549"))
                  || containsWord(text, QStringLiteral("prise"));
          }

          ''',
              '''bool hasPinoutEvidence(const QString &text)
          {
              return hasDirectConnectorEvidence(text)
                  || text.contains(QStringLiteral("wiring"))
                  || containsWord(text, QStringLiteral("broche"))
                  || text.contains(QStringLiteral("pinout"))
                  || text.contains(QStringLiteral("connector"))
                  || text.contains(QStringLiteral("connecteur"))
                  || text.contains(QStringLiteral("socket"))
                  || text.contains(QStringLiteral("diagnostic_socket"))
                  || containsWord(text, QStringLiteral("obd"))
                  || text.contains(QStringLiteral("c159"))
                  || text.contains(QStringLiteral("c549"))
                  || containsWord(text, QStringLiteral("prise"));
          }

          bool hasStructuredProcedureEvidence(const ExpertFact &fact)
          {
              const QString text = normalized(fact.topic + QLatin1Char('\\n') + fact.statement);
              return containsAny(text, {
                  QStringLiteral("procedure "), QStringLiteral("procedure_"),
                  QStringLiteral("etape "), QStringLiteral("step "),
                  QStringLiteral("remove_refit"), QStringLiteral("remove refit"),
                  QStringLiteral("install "), QStringLiteral("refit ")
              });
          }

          int procedureOperationScore(const QString &questionText, const ExpertFact &fact)
          {
              const QString text = normalized(fact.topic + QLatin1Char('\\n') + fact.statement);
              int score = hasStructuredProcedureEvidence(fact) ? 28 : -10;
              const bool asksRemove = containsAny(questionText, {
                  QStringLiteral("depose"), QStringLiteral("deposer"), QStringLiteral("remove")
              });
              const bool asksRefit = containsAny(questionText, {
                  QStringLiteral("repose"), QStringLiteral("reposer"), QStringLiteral("refit"),
                  QStringLiteral("install")
              });
              if (asksRemove && containsAny(text, {
                      QStringLiteral("depose"), QStringLiteral("remove"), QStringLiteral("remove_refit")
                  }))
                  score += 12;
              if (asksRefit && containsAny(text, {
                      QStringLiteral("repose"), QStringLiteral("refit"), QStringLiteral("install"),
                      QStringLiteral("remove_refit")
                  }))
                  score += 12;
              return score;
          }

          ''')

          replace_once('expert/IaMemsService.cpp',
              'QString IaMemsService::knowledgeAnswer(const QString &question) const\n',
              'QString IaMemsService::knowledgeAnswer(const QString &question)\n')

          replace_once('expert/IaMemsService.cpp',
              '''        if (fact.statement.size() > 5000)
                      candidate.score -= 16;
                  else if (fact.statement.size() > 1800)
                      candidate.score -= 8;
          ''',
              '''        if (fact.statement.size() > 5000)
                      candidate.score -= 16;
                  else if (fact.statement.size() > 1800)
                      candidate.score -= 8;
                  if (procedureIntent)
                      candidate.score += procedureOperationScore(questionText, fact);
          ''')

          replace_once('expert/IaMemsService.cpp',
              '''    const int maximum = qMin(asksTorque ? 2
                                           : (queryKind == KnowledgeQueryKind::General ? 2 : 4),
                                       ranked.size());
              if (maximum == 1 && !lambdaWireColour) {
          ''',
              '''    const int maximum = qMin(asksTorque ? 2
                                           : (queryKind == KnowledgeQueryKind::General ? 2 : 4),
                                       ranked.size());
              for (int i = 0; i < maximum; ++i) {
                  const QString visualReference =
                      m_reader.visualReferenceForFact(ranked.at(i).fact.factKey).trimmed();
                  if (!visualReference.isEmpty()) {
                      m_pendingVisualReference = visualReference;
                      break;
                  }
              }
              if (maximum == 1 && !lambdaWireColour) {
          ''')

          # UI receives the structured reference after the answer and resolves it independently of displayed text.
          replace_once('iamemstab.cpp',
              '''        connect(m_service, &IaMemsService::responseReady,
                          this, &IaMemsTab::onServiceResponse);
                  connect(m_service, &IaMemsService::systemMessage,
          ''',
              '''        connect(m_service, &IaMemsService::responseReady,
                          this, &IaMemsTab::onServiceResponse);
                  connect(m_service, &IaMemsService::responseVisualReferenceReady,
                          this,
                          [this](const QString &reference) {
                              if (!m_diagramButton || reference.trimmed().isEmpty())
                                  return;
                              const IaMemsDiagramSuggestion suggestion =
                                  IaMemsDiagramCatalog::suggestionForQuestion(reference);
                              if (!suggestion.isValid())
                                  return;
                              m_diagramTitle = suggestion.key;
                              m_diagramQuestion = reference;
                              m_diagramButton->setText(I18n::text(99006));
                              m_diagramButton->setVisible(true);
                          });
                  connect(m_service, &IaMemsService::systemMessage,
          ''')

          # Dedicated deterministic reader self-test: mapping does not parse answer text.
          Path('expert/ExpertVisualReferenceSelfTest.cpp').write_text(r'''#include "ExpertKnowledgeReader.h"

          #include <QCoreApplication>
          #include <QSqlDatabase>
          #include <QSqlQuery>
          #include <QTemporaryDir>
          #include <QTextStream>
          #include <QUuid>

          int main(int argc, char **argv)
          {
              QCoreApplication app(argc, argv);
              QTemporaryDir temporary;
              if (!temporary.isValid())
                  return 1;

              const QString databasePath = temporary.filePath(QStringLiteral("fixture.sqlite"));
              const QString connection = QStringLiteral("VISUAL_REF_FIXTURE_%1")
                  .arg(QUuid::createUuid().toString(QUuid::WithoutBraces));
              QSqlDatabase database = QSqlDatabase::addDatabase(QStringLiteral("QSQLITE"), connection);
              database.setDatabaseName(databasePath);
              if (!database.open())
                  return 2;
              {
                  QSqlQuery query(database);
                  if (!query.exec(QStringLiteral(
                          "CREATE TABLE mems_knowledge_item (knowledge_key TEXT PRIMARY KEY, image_ref TEXT)")))
                      return 3;
                  query.prepare(QStringLiteral(
                      "INSERT INTO mems_knowledge_item(knowledge_key,image_ref) VALUES(:key,:image)"));
                  query.bindValue(QStringLiteral(":key"), QStringLiteral("TEST-PROCEDURE-FACT"));
                  query.bindValue(QStringLiteral(":image"),
                                  QStringLiteral("images/rave/AKM7169ENG_PDF_133.png"));
                  if (!query.exec())
                      return 4;
              }
              database.close();
              database = QSqlDatabase();
              QSqlDatabase::removeDatabase(connection);

              ExpertKnowledgeReader reader;
              if (!reader.openReadOnly(databasePath))
                  return 5;
              if (reader.visualReferenceForFact(QStringLiteral("TEST-PROCEDURE-FACT"))
                  != QStringLiteral("images/rave/AKM7169ENG_PDF_133.png"))
                  return 6;
              if (reader.visualReferenceForFact(
                      QStringLiteral("asset:images/rover_rosco_3pin_black.svg"))
                  != QStringLiteral("images/rover_rosco_3pin_black.svg"))
                  return 7;
              if (!reader.visualReferenceForFact(QStringLiteral("UNKNOWN-FACT")).isEmpty())
                  return 8;

              QTextStream(stdout) << "EXPERT_VISUAL_REFERENCE_PASS" << Qt::endl;
              return 0;
          }
          ''', encoding='utf-8')

          replace_once('CMakeLists.txt',
              '''add_executable(expert_runtime_selftest
              expert/ExpertRuntimeDatabaseSelfTest.cpp
              expert/ExpertRuntimeDatabase.cpp expert/ExpertRuntimeDatabase.h)
          target_link_libraries(expert_runtime_selftest PRIVATE Qt5::Core Qt5::Sql)
          add_dependencies(${PNAME} expert_runtime_selftest)
          ''',
              '''add_executable(expert_runtime_selftest
              expert/ExpertRuntimeDatabaseSelfTest.cpp
              expert/ExpertRuntimeDatabase.cpp expert/ExpertRuntimeDatabase.h)
          target_link_libraries(expert_runtime_selftest PRIVATE Qt5::Core Qt5::Sql)
          add_dependencies(${PNAME} expert_runtime_selftest)

          add_executable(expert_visual_reference_selftest
              expert/ExpertVisualReferenceSelfTest.cpp
              expert/ExpertKnowledgeReader.cpp expert/ExpertKnowledgeReader.h
              expert/ExpertTypes.h)
          target_link_libraries(expert_visual_reference_selftest PRIVATE Qt5::Core Qt5::Sql)
          add_dependencies(${PNAME} expert_visual_reference_selftest)
          ''')

          PY
          git diff --check
          git diff --stat
      - name: Commit direct source correction
        shell: bash
        run: |
          git config user.name "mini56"
          git config user.email "48644212+mini56@users.noreply.github.com"
          git add CMakeLists.txt expert/ExpertKnowledgeReader.h expert/ExpertKnowledgeReader.cpp expert/IaMemsService.h expert/IaMemsService.cpp expert/ExpertVisualReferenceSelfTest.cpp iamemstab.cpp
          git diff --cached --check
          git commit -m "Keep IA visual references attached to selected facts"
          git push origin tmp-ravemems-ia-visual-integration
