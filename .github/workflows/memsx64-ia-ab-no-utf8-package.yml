name: MEMSX64 IA A-B package without UTF-8 compile flag

on:
  workflow_dispatch:
  push:
    branches: [MEMSX64]
    paths:
      - '.github/workflows/memsx64-ia-ab-no-utf8-package.yml'

permissions:
  contents: read

jobs:
  build-ia-ab-no-utf8:
    runs-on: windows-latest

    steps:
      - name: Checkout MEMSX64
        uses: actions/checkout@v4
        with:
          ref: MEMSX64

      - name: Patch runner workspace only - remove MSVC UTF-8 flag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'CMakeLists.txt'
          $text = Get-Content $path -Raw
          $old = 'target_compile_options(${PNAME} PRIVATE /permissive /utf-8)'
          $new = 'target_compile_options(${PNAME} PRIVATE /permissive)'
          $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($count -ne 1) { throw "Expected exactly one UTF-8 compile option, found $count" }
          $text = $text.Replace($old, $new)
          Set-Content -Path $path -Value $text -Encoding UTF8
          Write-Host 'A/B diagnostic: MSVC /utf-8 removed in runner workspace only.'
          git diff -- CMakeLists.txt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall pefile

      - name: Install Qt 5.15.2 MSVC 2019 x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtcharts -O C:\Qt
          if (-not (Test-Path 'C:\Qt\5.15.2\msvc2019_64\lib\cmake\Qt5\Qt5Config.cmake')) {
            throw 'Qt 5.15.2 MSVC x64 installation incomplete'
          }

      - name: Configure native x64 diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build-ia-ab-no-utf8 -A x64 `
            -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/msvc2019_64" `
            -DMEMS_USE_BUNDLED_LIBROSCO_X64=ON `
            -DMEMS_RUN_REFERENCE_SELFTEST_POST_BUILD=OFF

      - name: Build native x64 diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build-ia-ab-no-utf8 --config Release --target ecu_mems_manager

      - name: Assemble small A-B portable package without local AI runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = 'C:\Qt\5.15.2\msvc2019_64'
          $qtBin = Join-Path $qtRoot 'bin'
          $qtPlugins = Join-Path $qtRoot 'plugins'
          $build = '${{ github.workspace }}\build-ia-ab-no-utf8'
          $dist = '${{ github.workspace }}\dist-ia-ab-no-utf8'
          $app = Join-Path $build 'Release\ecu_mems_manager.exe'
          $protocol = Join-Path $build 'librosco-x64\Release\mems_manager_x64.dll'

          if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
          New-Item -ItemType Directory -Path $dist | Out-Null

          foreach ($src in @($app, $protocol)) {
            if (-not (Test-Path $src)) { throw "Required x64 binary missing: $src" }
          }
          Copy-Item $app (Join-Path $dist 'ecu_mems_manager.exe') -Force
          Copy-Item $protocol (Join-Path $dist 'mems_manager_x64.dll') -Force

          & (Join-Path $qtBin 'windeployqt.exe') `
            --release `
            --compiler-runtime `
            --no-translations `
            --dir $dist `
            (Join-Path $dist 'ecu_mems_manager.exe')
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with code $LASTEXITCODE" }

          $translations = Join-Path $build 'Release\translations'
          Copy-Item $translations (Join-Path $dist 'translations') -Recurse -Force

          $database = Join-Path $build 'Release\database'
          if (-not (Test-Path (Join-Path $database 'reference'))) { throw 'Generated offline MEMS database is missing' }
          Copy-Item $database (Join-Path $dist 'database') -Recurse -Force

          $sqliteDst = Join-Path $dist 'sqldrivers\qsqlite.dll'
          if (-not (Test-Path $sqliteDst)) {
            New-Item -ItemType Directory -Path (Split-Path $sqliteDst) -Force | Out-Null
            Copy-Item (Join-Path $qtPlugins 'sqldrivers\qsqlite.dll') $sqliteDst -Force
          }

          # Deliberately omit the local llama.cpp/model bundle. The real-PC crash
          # already reproduces with ai renamed to ai_OFF, so this isolates the EXE.
          if (Test-Path (Join-Path $dist 'ai')) { Remove-Item (Join-Path $dist 'ai') -Recurse -Force }

          @(
            'ECU MEMS MANAGER X64 IA A-B DIAGNOSTIC',
            'Purpose: test the only persistent application-build delta after the first stable x64 package.',
            'MSVC /utf-8: REMOVED for this runner build only.',
            'Local llama.cpp/model: intentionally NOT packaged.',
            'Test: launch app, open IA MEMS, observe whether the application remains open.'
          ) | Set-Content -Path (Join-Path $dist 'IA_AB_NO_UTF8_README.txt') -Encoding UTF8

      - name: Validate diagnostic package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DIST = '${{ github.workspace }}\dist-ia-ab-no-utf8'
          @'
          import os
          import pathlib
          import pefile

          root = pathlib.Path(os.environ['DIST'])
          required = [
              root / 'ecu_mems_manager.exe',
              root / 'mems_manager_x64.dll',
              root / 'Qt5Core.dll',
              root / 'Qt5Gui.dll',
              root / 'Qt5Widgets.dll',
              root / 'Qt5Sql.dll',
              root / 'Qt5Network.dll',
              root / 'platforms' / 'qwindows.dll',
              root / 'sqldrivers' / 'qsqlite.dll',
              root / 'database' / 'reference' / 'manifest.json',
              root / 'IA_AB_NO_UTF8_README.txt',
          ]
          missing = [str(p.relative_to(root)) for p in required if not p.exists() or p.stat().st_size <= 0]
          if missing:
              raise SystemExit('Missing required files: ' + ', '.join(missing))
          if (root / 'ai' / 'llama-server.exe').exists() or (root / 'ai' / 'models' / 'ia-mems.gguf').exists():
              raise SystemExit('A/B package unexpectedly contains local AI runtime/model')
          for p in [root / 'ecu_mems_manager.exe', root / 'mems_manager_x64.dll']:
              pe = pefile.PE(str(p), fast_load=True)
              if pe.FILE_HEADER.Machine != 0x8664 or pe.OPTIONAL_HEADER.Magic != 0x20B:
                  raise SystemExit(f'{p.name} is not PE32+ AMD64')
          print('OK: A/B no-UTF8 x64 diagnostic package assembled')
          '@ | python -

      - name: Smoke launch diagnostic package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = '${{ github.workspace }}\dist-ia-ab-no-utf8'
          $exe = Join-Path $dist 'ecu_mems_manager.exe'
          $proc = Start-Process $exe -WorkingDirectory $dist -PassThru
          Start-Sleep -Seconds 6
          if ($proc.HasExited) {
            throw "A/B diagnostic application exited during basic smoke launch (code $($proc.ExitCode))"
          }
          Stop-Process -Id $proc.Id -Force
          Write-Host 'OK: basic x64 diagnostic launch remained alive'

      - name: Upload A-B diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECU-MEMS-Manager-x64-IA-AB-NO-UTF8
          path: dist-ia-ab-no-utf8/
          if-no-files-found: error
          compression-level: 0
