name: MEMSX64 IA UI-only crash isolation

on:
  workflow_dispatch:
  push:
    branches: [MEMSX64]
    paths:
      - '.github/workflows/memsx64-ia-ab-no-utf8-package.yml'

permissions:
  contents: write

concurrency:
  group: memsx64-ia-ui-only
  cancel-in-progress: true

jobs:
  build-ia-ui-only:
    name: BUILD #${{ github.run_number }} - IA UI ONLY
    runs-on: windows-latest

    steps:
      - name: Checkout MEMSX64
        uses: actions/checkout@v4
        with:
          ref: MEMSX64

      - name: Patch runner workspace - disable IA backends only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          p = Path('iamemstab.cpp')
          s = p.read_text(encoding='utf-8')
          old = r'''void IaMemsTab::showEvent(QShowEvent *event)
{
    QWidget::showEvent(event);

    // Keep the main ECU program light: the knowledge cache and the local
    // language model are started only when IA MEMS is actually opened.
    QTimer::singleShot(0, this, &IaMemsTab::startKnowledgeLoad);
    if (m_localAi)
        QTimer::singleShot(0, m_localAi, &LocalAiClient::initialize);
}
'''
          new = r'''void IaMemsTab::showEvent(QShowEvent *event)
{
    QWidget::showEvent(event);
}
'''
          if s.count(old) != 1:
              raise SystemExit('showEvent block mismatch')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          print('OK: IA knowledge load and LocalAiClient initialization disabled for runner build only')
          '@ | python -

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        shell: pwsh
        run: python -m pip install --disable-pip-version-check aqtinstall pefile

      - name: Install Qt 5.15.2 MSVC 2019 x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtcharts -O C:\Qt
          if (-not (Test-Path 'C:\Qt\5.15.2\msvc2019_64\lib\cmake\Qt5\Qt5Config.cmake')) {
            throw 'Qt 5.15.2 MSVC x64 installation incomplete'
          }

      - name: Configure native x64 diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build-ia-ui-only -A x64 `
            -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/msvc2019_64" `
            -DMEMS_USE_BUNDLED_LIBROSCO_X64=ON `
            -DMEMS_RUN_REFERENCE_SELFTEST_POST_BUILD=OFF

      - name: Build native x64 diagnostic
        shell: pwsh
        run: cmake --build build-ia-ui-only --config Release --target ecu_mems_manager

      - name: Assemble UI-only portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = 'C:\Qt\5.15.2\msvc2019_64'
          $qtBin = Join-Path $qtRoot 'bin'
          $qtPlugins = Join-Path $qtRoot 'plugins'
          $build = '${{ github.workspace }}\build-ia-ui-only'
          $dist = '${{ github.workspace }}\dist-ia-ui-only'
          $app = Join-Path $build 'Release\ecu_mems_manager.exe'
          $protocol = Join-Path $build 'librosco-x64\Release\mems_manager_x64.dll'

          if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
          New-Item -ItemType Directory -Path $dist | Out-Null

          foreach ($src in @($app, $protocol)) {
            if (-not (Test-Path $src)) { throw "Required x64 binary missing: $src" }
          }
          Copy-Item $app (Join-Path $dist 'ecu_mems_manager.exe') -Force
          Copy-Item $protocol (Join-Path $dist 'mems_manager_x64.dll') -Force

          & (Join-Path $qtBin 'windeployqt.exe') `
            --release `
            --compiler-runtime `
            --no-translations `
            --dir $dist `
            (Join-Path $dist 'ecu_mems_manager.exe')
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with code $LASTEXITCODE" }

          Copy-Item (Join-Path $build 'Release\translations') (Join-Path $dist 'translations') -Recurse -Force
          $database = Join-Path $build 'Release\database'
          if (-not (Test-Path (Join-Path $database 'reference'))) { throw 'Generated offline MEMS database is missing' }
          Copy-Item $database (Join-Path $dist 'database') -Recurse -Force

          $sqliteDst = Join-Path $dist 'sqldrivers\qsqlite.dll'
          if (-not (Test-Path $sqliteDst)) {
            New-Item -ItemType Directory -Path (Split-Path $sqliteDst) -Force | Out-Null
            Copy-Item (Join-Path $qtPlugins 'sqldrivers\qsqlite.dll') $sqliteDst -Force
          }

          if (Test-Path (Join-Path $dist 'ai')) { Remove-Item (Join-Path $dist 'ai') -Recurse -Force }

          @(
            'ECU MEMS MANAGER X64 - IA UI ONLY DIAGNOSTIC',
            'BUILD #${{ github.run_number }}',
            'RUN ID ${{ github.run_id }}',
            'Knowledge loading: DISABLED',
            'LocalAiClient initialization: DISABLED',
            'No llama.cpp runtime or model is included.',
            'Test: launch ecu_mems_manager.exe, open IA MEMS, wait at least 20 seconds.',
            'Expected diagnostic result: application remains open.'
          ) | Set-Content -Path (Join-Path $dist 'README_IA_UI_ONLY.txt') -Encoding UTF8

      - name: Validate UI-only diagnostic package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DIST = '${{ github.workspace }}\dist-ia-ui-only'
          @'
          import os
          import pathlib
          import pefile

          root = pathlib.Path(os.environ['DIST'])
          required = [
              root / 'ecu_mems_manager.exe',
              root / 'mems_manager_x64.dll',
              root / 'Qt5Core.dll',
              root / 'Qt5Gui.dll',
              root / 'Qt5Widgets.dll',
              root / 'Qt5Sql.dll',
              root / 'Qt5Network.dll',
              root / 'platforms' / 'qwindows.dll',
              root / 'sqldrivers' / 'qsqlite.dll',
              root / 'database' / 'reference' / 'manifest.json',
              root / 'README_IA_UI_ONLY.txt',
          ]
          missing = [str(p.relative_to(root)) for p in required if not p.exists() or p.stat().st_size <= 0]
          if missing:
              raise SystemExit('Missing required files: ' + ', '.join(missing))
          for p in [root / 'ecu_mems_manager.exe', root / 'mems_manager_x64.dll']:
              pe = pefile.PE(str(p), fast_load=True)
              if pe.FILE_HEADER.Machine != 0x8664 or pe.OPTIONAL_HEADER.Magic != 0x20B:
                  raise SystemExit(f'{p.name} is not PE32+ AMD64')
          print('OK: IA UI-only x64 package assembled')
          '@ | python -

      - name: Smoke launch diagnostic package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = '${{ github.workspace }}\dist-ia-ui-only'
          $exe = Join-Path $dist 'ecu_mems_manager.exe'
          $proc = Start-Process $exe -WorkingDirectory $dist -PassThru
          Start-Sleep -Seconds 6
          if ($proc.HasExited) {
            throw "UI-only diagnostic application exited during basic smoke launch (code $($proc.ExitCode))"
          }
          Stop-Process -Id $proc.Id -Force
          Write-Host 'OK: basic UI-only x64 launch remained alive'

      - name: Upload UI-only diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECU-MEMS-Manager-x64-IA-UI-ONLY-DIAG-BUILD-${{ github.run_number }}
          path: dist-ia-ui-only/
          if-no-files-found: error
          compression-level: 0

      - name: Persist readable result marker
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          git fetch origin MEMSX64
          git reset --hard origin/MEMSX64
          $state = '${{ job.status }}'.ToUpperInvariant()
          @(
            'IA UI-ONLY DIAGNOSTIC',
            'build_number=#${{ github.run_number }}',
            'run_id=${{ github.run_id }}',
            ('status=' + $state),
            'artifact=ECU-MEMS-Manager-x64-IA-UI-ONLY-DIAG-BUILD-${{ github.run_number }}',
            ('utc=' + [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))
          ) | Set-Content -Encoding UTF8 IA_UI_ONLY_RESULT.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IA_UI_ONLY_RESULT.txt
          git commit -m "Record IA UI-only build #${{ github.run_number }} result [skip ci]"
          git push origin HEAD:MEMSX64
