name: MEMSX64 IA staged crash isolation via proven workflow

on:
  workflow_dispatch:
  push:
    branches: [MEMSX64]
    paths:
      - '.github/workflows/memsx64-ia-ab-no-utf8-package.yml'

permissions:
  contents: write

jobs:
  build-ia-stage:
    runs-on: windows-latest

    steps:
      - name: Checkout MEMSX64
        uses: actions/checkout@v4
        with:
          ref: MEMSX64

      - name: Publish run id
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @(
            'MEMSX64 IA STAGE: STARTED',
            'run_id=${{ github.run_id }}',
            'run_number=${{ github.run_number }}',
            'workflow_sha=${{ github.sha }}',
            ('utc=' + [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))
          ) | Set-Content -Encoding UTF8 IA_STAGE_PROVEN_STARTED.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin MEMSX64
          git add IA_STAGE_PROVEN_STARTED.txt
          git commit -m "Record IA staged diagnostic run [skip ci]"
          git push origin HEAD:MEMSX64

      - name: Inject runner-only stage modes and trace
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          from pathlib import Path
          p=Path('iamemstab.cpp')
          s=p.read_text(encoding='utf-8')
          s=s.replace('#include <QEvent>\n','#include <QEvent>\n#include <QCoreApplication>\n#include <QFile>\n',1)
          anchor='static const int kTabPtrRole = Qt::UserRole + 60;\n\n'
          helper=r'''static const int kTabPtrRole = Qt::UserRole + 60;

QString iaDiagMode()
{
    return qEnvironmentVariable("MEMS_IA_DIAG_MODE").trimmed().toLower();
}

void iaDiagTrace(const QString &message)
{
    QFile file(QCoreApplication::applicationDirPath()+QStringLiteral("/IA_DIAG_TRACE.txt"));
    if (!file.open(QIODevice::WriteOnly|QIODevice::Append|QIODevice::Text)) return;
    file.write((QDateTime::currentDateTime().toString(QStringLiteral("yyyy-MM-dd HH:mm:ss.zzz"))+QStringLiteral(" | ")+message+QLatin1Char('\n')).toUtf8());
    file.flush();
}

'''
          if s.count(anchor)!=1: raise SystemExit('helper anchor mismatch')
          s=s.replace(anchor,helper,1)
          old=r'''void IaMemsTab::showEvent(QShowEvent *event)
{
    QWidget::showEvent(event);

    // Keep the main ECU program light: the knowledge cache and the local
    // language model are started only when IA MEMS is actually opened.
    QTimer::singleShot(0, this, &IaMemsTab::startKnowledgeLoad);
    if (m_localAi)
        QTimer::singleShot(0, m_localAi, &LocalAiClient::initialize);
}
'''
          new=r'''void IaMemsTab::showEvent(QShowEvent *event)
{
    const QString mode=iaDiagMode();
    iaDiagTrace(QStringLiteral("showEvent ENTER mode=%1").arg(mode.isEmpty()?QStringLiteral("original"):mode));
    QWidget::showEvent(event);
    iaDiagTrace(QStringLiteral("QWidget::showEvent returned"));
    if (mode==QStringLiteral("ui_only")) { iaDiagTrace(QStringLiteral("UI_ONLY return")); return; }
    if (mode!=QStringLiteral("local_only")) {
        iaDiagTrace(QStringLiteral("schedule KNOWLEDGE"));
        QTimer::singleShot(0,this,&IaMemsTab::startKnowledgeLoad);
    }
    if (mode!=QStringLiteral("knowledge_only") && m_localAi) {
        iaDiagTrace(QStringLiteral("schedule LOCAL_AI"));
        QTimer::singleShot(0,m_localAi,&LocalAiClient::initialize);
    }
    iaDiagTrace(QStringLiteral("showEvent EXIT"));
}
'''
          if s.count(old)!=1: raise SystemExit('showEvent mismatch')
          s=s.replace(old,new,1)
          a='void IaMemsTab::startKnowledgeLoad()\n{\n'
          if s.count(a)!=1: raise SystemExit('start anchor mismatch')
          s=s.replace(a,a+'    iaDiagTrace(QStringLiteral("startKnowledgeLoad ENTER"));\n',1)
          a='    QThread *thread = QThread::create([guard]() {\n'
          if s.count(a)!=1: raise SystemExit('thread create mismatch')
          s=s.replace(a,'    iaDiagTrace(QStringLiteral("before QThread::create"));\n'+a+'        iaDiagTrace(QStringLiteral("knowledge worker ENTER"));\n',1)
          a='        const bool ok = reference.buildOrOpen();\n'
          if s.count(a)!=1: raise SystemExit('buildOrOpen mismatch')
          s=s.replace(a,'        iaDiagTrace(QStringLiteral("before buildOrOpen"));\n'+a+'        iaDiagTrace(QStringLiteral("after buildOrOpen ok=%1 error=%2").arg(ok).arg(reference.lastError().left(300)));\n',1)
          a='    thread->start();\n'
          if s.count(a)!=1: raise SystemExit('thread start mismatch')
          s=s.replace(a,'    iaDiagTrace(QStringLiteral("before thread start"));\n'+a+'    iaDiagTrace(QStringLiteral("after thread start"));\n',1)
          a='void IaMemsTab::finishKnowledgeLoad(bool ok,\n                                    const QString &databasePath,\n                                    const QString &errorText)\n{\n'
          if s.count(a)!=1: raise SystemExit('finish anchor mismatch')
          s=s.replace(a,a+'    iaDiagTrace(QStringLiteral("finishKnowledgeLoad ENTER ok=%1 path=%2 error=%3").arg(ok).arg(databasePath).arg(errorText.left(300)));\n',1)
          p.write_text(s,encoding='utf-8')
          '@ | python -

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        shell: pwsh
        run: python -m pip install --disable-pip-version-check aqtinstall pefile

      - name: Install Qt x64
        shell: pwsh
        run: python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtcharts -O C:\Qt

      - name: Configure x64
        shell: pwsh
        run: |
          cmake -S . -B build-ia-stage -A x64 `
            -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/msvc2019_64" `
            -DMEMS_USE_BUNDLED_LIBROSCO_X64=ON `
            -DMEMS_RUN_REFERENCE_SELFTEST_POST_BUILD=OFF

      - name: Build x64
        shell: pwsh
        run: cmake --build build-ia-stage --config Release --target ecu_mems_manager

      - name: Assemble staged package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $build='${{ github.workspace }}\build-ia-stage'
          $dist='${{ github.workspace }}\dist-ia-stage'
          if(Test-Path $dist){Remove-Item $dist -Recurse -Force}
          New-Item -ItemType Directory $dist | Out-Null
          Copy-Item (Join-Path $build 'Release\ecu_mems_manager.exe') $dist
          Copy-Item (Join-Path $build 'librosco-x64\Release\mems_manager_x64.dll') $dist
          & 'C:\Qt\5.15.2\msvc2019_64\bin\windeployqt.exe' --release --compiler-runtime --no-translations --dir $dist (Join-Path $dist 'ecu_mems_manager.exe')
          if($LASTEXITCODE -ne 0){throw 'windeployqt failed'}
          Copy-Item (Join-Path $build 'Release\translations') (Join-Path $dist 'translations') -Recurse -Force
          Copy-Item (Join-Path $build 'Release\database') (Join-Path $dist 'database') -Recurse -Force
          if(-not(Test-Path (Join-Path $dist 'sqldrivers\qsqlite.dll'))){
            New-Item -ItemType Directory -Force (Join-Path $dist 'sqldrivers') | Out-Null
            Copy-Item 'C:\Qt\5.15.2\msvc2019_64\plugins\sqldrivers\qsqlite.dll' (Join-Path $dist 'sqldrivers\qsqlite.dll') -Force
          }
          if(Test-Path (Join-Path $dist 'ai')){Remove-Item (Join-Path $dist 'ai') -Recurse -Force}
          $m=@{'TEST_1_UI_ONLY.bat'='ui_only';'TEST_2_LOCAL_AI_ONLY.bat'='local_only';'TEST_3_KNOWLEDGE_ONLY.bat'='knowledge_only';'TEST_4_ORIGINAL_BOTH.bat'=''}
          foreach($n in $m.Keys){
            @('@echo off','cd /d "%~dp0"','del IA_DIAG_TRACE.txt 2>nul',('set MEMS_IA_DIAG_MODE='+$m[$n]),'start "" ecu_mems_manager.exe') | Set-Content -Encoding ASCII (Join-Path $dist $n)
          }
          @('1 UI only','2 LocalAiClient only','3 Knowledge DB only','4 Original both','Open IA MEMS after each launch and wait 15 seconds.','After any crash send IA_DIAG_TRACE.txt.','No llama/model is included.') | Set-Content -Encoding UTF8 (Join-Path $dist 'README_IA_STAGE.txt')

      - name: Upload staged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECU-MEMS-Manager-x64-IA-STAGE-DIAG
          path: dist-ia-stage/
          if-no-files-found: error
          compression-level: 0

      - name: Persist result
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          git reset --hard HEAD
          git pull --rebase origin MEMSX64
          $state='${{ job.status }}'
          @(
            ('MEMSX64 IA STAGE: '+$state.ToUpperInvariant()),
            'artifact=ECU-MEMS-Manager-x64-IA-STAGE-DIAG',
            'run_id=${{ github.run_id }}',
            'run_number=${{ github.run_number }}',
            'workflow_sha=${{ github.sha }}',
            ('utc='+[DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))
          ) | Set-Content -Encoding UTF8 IA_STAGE_PROVEN_RESULT.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f IA_STAGE_PROVEN_STARTED.txt 2>$null
          git add IA_STAGE_PROVEN_RESULT.txt
          git commit -m "Record IA staged diagnostic result [skip ci]"
          git push origin HEAD:MEMSX64
