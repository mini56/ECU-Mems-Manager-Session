name: SESSION - Controle du respect des dispositions BUILD117
on:
  push:
    branches: [dev-complete-build117-14-pages-20261109]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-layout-guard:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Verifier aucune refonte, menu complet et absence de zoom global
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $main=Get-Content main.cpp -Raw
          $ui=Get-Content uirebuild.cpp -Raw
          $strict=Get-Content strictvisualrebuild.cpp -Raw
          if($main -notmatch 'window\.showMaximized\(\)' -or $main -match 'CompleteZoom|QT_SCALE_FACTOR|window\.setFixedSize\(') {throw 'FORCED_GLOBAL_ZOOM'}
          $baseline=@{
            'mainwindow.cpp'='7de0f781bba8060e6940417c9beb696eb9b906e5'
            'navigationorderpatch.cpp'='799d5b0dc7be9a324dc32a37369746e72ad7d540'
            'navigationorderpatch.h'='da252d14b0ab000b78ba2684f61790f69eb56c30'
            'overviewrebuild.cpp'='e59e6b1ddd0f2d4f6c457672b91c7e8496a811a2'
            'visualcompletion.cpp'='b5542ac376718c786ec490e80cda89463ce359f4'
            'dedicatedpagesrebuild.cpp'='17d9364639c7a2a6891cd0364303e2cf625b8df0'
          }
          foreach($item in $baseline.GetEnumerator()){
            if((git hash-object $item.Key).Trim() -ne $item.Value){
              throw "DISPOSITION_MODIFIED: $($item.Key)"
            }
          }
          if($ui -notmatch 'applyReadablePageFonts\(tabs\)' -or $ui -notmatch 'if \(i==10\) continue'){throw 'REFERENCE_TEXT_PAGE_CHANGED'}
          if($strict -notmatch 's->setVerticalScrollBarPolicy\(Qt::ScrollBarAlwaysOff\)'){throw 'EXTERNAL_PAGE_SCROLL'}
          if(Test-Path settingsvisualpatch.cpp){throw 'OLD_SETTINGS_PATCH_REINTRODUCED'}
          if((Get-Content CMakeLists.txt -Raw) -match 'settingsvisualpatch.cpp'){throw 'OLD_SETTINGS_PATCH_COMPILED'}
          Write-Host 'SESSION_BUILD117_OTHER_LAYOUTS_PRESERVED'
