name: COMPLETE - Controle fenetre Windows native
on:
  push:
    branches: [dev-complete-build117-14-pages-20261109]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-window-guard:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Verifier suppression du zoom impose
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $main=Get-Content main.cpp -Raw
          $win=Get-Content mainwindow.cpp -Raw
          $nav=Get-Content navigationorderpatch.cpp -Raw
          if($main -notmatch 'window\.showMaximized\(\)' -or $main -notmatch 'AA_EnableHighDpiScaling') {throw 'NATIVE_WINDOW_NOT_RESTORED'}
          if($main -match 'CompleteZoom|QT_SCALE_FACTOR|window\.setFixedSize\(' -or $win -match 'CompleteZoom') {throw 'OLD_GLOBAL_ZOOM_STILL_PRESENT'}
          if($win -match 'setWidgetResizable\(false\)' -or $win -match 'Qt::ScrollBarAsNeeded') {throw 'PAGE_SCROLL_REGRESSION'}
          if($nav -notmatch 'kFinalTabCount = 14'){throw 'FULL_MENU_MISSING'}
          Write-Host 'NATIVE_WINDOWS_LAYOUT_GUARD_PASS'
