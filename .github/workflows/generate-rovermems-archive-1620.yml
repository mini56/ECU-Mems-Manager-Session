name: Generate RoverMEMS archive 1620

on:
  push:
    branches:
      - lab-andrew-revill-knowledge
    paths:
      - tools/build_rovermems_archive_1620.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rovermems-archive-1620-lab
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lab branch
        uses: actions/checkout@v4
        with:
          ref: lab-andrew-revill-knowledge
          fetch-depth: 0

      - name: Generate exact archive knowledge
        run: python tools/build_rovermems_archive_1620.py

      - name: Validate generated database batch
        run: |
          python - <<'PY'
          import sqlite3, struct, zlib
          from pathlib import Path
          p = Path('database/reference/research_enrichment_1620.qz64')
          b = p.read_bytes()
          n = struct.unpack('>I', b[:4])[0]
          sql = zlib.decompress(b[4:])
          assert len(sql) == n
          db = sqlite3.connect(':memory:')
          db.executescript(sql.decode('utf-8'))
          assert db.execute('select count(*) from rovermems_archive_snapshot').fetchone()[0] == 1
          assert db.execute('select count(*) from rovermems_archive_live_measurement').fetchone()[0] == 31
          assert db.execute('select count(*) from rovermems_archive_live_bitfield').fetchone()[0] == 24
          assert db.execute('select count(*) from rovermems_archive_unknown_byte').fetchone()[0] == 19
          print('RoverMEMS archive 1620 validation OK')
          PY

      - name: Commit generated knowledge
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            database/reference/research_enrichment_1620.qz64 \
            database/reference/audits/rovermems_archive_386_audit.md \
            database/reference/audits/rovermems_archive_386_audit.json \
            database/reference/manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Integrate exact RoverMEMS 386 archive measurements [skip ci]"
          git push origin HEAD:lab-andrew-revill-knowledge
