name: Build librosco x64 compatibility

on:
  push:
    branches: [MEMSX64]
    paths:
      - 'librosco-x64/**'
      - '.github/workflows/build-librosco-x64.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-librosco-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout MEMSX64
        uses: actions/checkout@v4
        with:
          ref: MEMSX64

      - name: Configure native AMD64 build
        shell: pwsh
        run: cmake -S librosco-x64 -B build-librosco-x64 -A x64

      - name: Build Release DLL and ABI self-test
        shell: pwsh
        run: cmake --build build-librosco-x64 --config Release

      - name: Run ABI self-test
        shell: pwsh
        run: ctest --test-dir build-librosco-x64 -C Release --output-on-failure

      - name: Install PE validator
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pefile

      - name: Validate PE32+ AMD64 and exact exports
        shell: pwsh
        run: |
          $env:ROSCO_DLL = "${{ github.workspace }}\build-librosco-x64\Release\librosco.dll"
          @'
          import hashlib
          import os
          import pathlib
          import pefile

          path = pathlib.Path(os.environ['ROSCO_DLL'])
          if not path.exists():
              raise SystemExit(f'DLL missing: {path}')

          data = path.read_bytes()
          pe = pefile.PE(str(path), fast_load=False)

          if pe.FILE_HEADER.Machine != 0x8664:
              raise SystemExit(f'Not AMD64: machine=0x{pe.FILE_HEADER.Machine:04X}')
          if pe.OPTIONAL_HEADER.Magic != 0x20B:
              raise SystemExit(f'Not PE32+: magic=0x{pe.OPTIONAL_HEADER.Magic:04X}')

          actual = sorted(
              s.name.decode('ascii')
              for s in pe.DIRECTORY_ENTRY_EXPORT.symbols
              if s.name
          )
          expected = sorted('''
          mems_cleanup
          mems_clear_faults
          mems_connect
          mems_disconnect
          mems_get_lib_version
          mems_heartbeat
          mems_init
          mems_init_link
          mems_is_connected
          mems_lock
          mems_move_iac
          mems_openserial
          mems_read
          mems_read_iac_position
          mems_read_raw
          mems_read_serial
          mems_reset_ECU
          mems_reset_adjustments
          mems_send_command
          mems_test_actuator
          mems_unlock
          mems_write_serial
          '''.split())

          if actual != expected:
              missing = sorted(set(expected) - set(actual))
              extra = sorted(set(actual) - set(expected))
              raise SystemExit(f'Export mismatch. Missing={missing} Extra={extra} Actual={actual}')

          sha256 = hashlib.sha256(data).hexdigest()
          print('PE32+ AMD64: OK')
          print('Exact 22-export contract: OK')
          print(f'Size: {len(data)} bytes')
          print(f'SHA256: {sha256}')

          report = pathlib.Path('build-librosco-x64/LIBROSCO_X64_VALIDATION.txt')
          report.write_text(
              'LIBROSCO X64 COMPATIBILITY: OK\n'
              'machine=IMAGE_FILE_MACHINE_AMD64\n'
              'format=PE32+\n'
              'abi_frame80=28\n'
              'abi_frame7d=32\n'
              'abi_mems_data=60\n'
              'compat_version=0.1.12\n'
              'exports=22 exact historical names\n'
              f'size={len(data)}\n'
              f'sha256={sha256}\n',
              encoding='utf-8'
          )
          '@ | python -

      - name: Stage validation package
        shell: pwsh
        run: |
          $dist = "${{ github.workspace }}\dist-librosco-x64"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "build-librosco-x64\Release\librosco.dll" "$dist\librosco.dll" -Force
          Copy-Item "build-librosco-x64\Release\librosco.lib" "$dist\librosco.lib" -Force
          Copy-Item "librosco-x64\rosco.h" "$dist\rosco.h" -Force
          Copy-Item "librosco-x64\README.md" "$dist\README.md" -Force
          Copy-Item "build-librosco-x64\LIBROSCO_X64_VALIDATION.txt" "$dist\LIBROSCO_X64_VALIDATION.txt" -Force

      - name: Upload validated x64 library
        uses: actions/upload-artifact@v4
        with:
          name: librosco-x64-compatibility
          path: dist-librosco-x64
          if-no-files-found: error

      - name: Persist green validation marker
        shell: pwsh
        run: |
          Copy-Item "build-librosco-x64\LIBROSCO_X64_VALIDATION.txt" "LIBROSCO_X64_VALIDATION.txt" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LIBROSCO_X64_VALIDATION.txt
          if (git diff --cached --quiet) {
            Write-Host "Validation marker already current"
          } else {
            git commit -m "Validate native librosco x64 compatibility [skip ci]"
            git push origin MEMSX64
          }
