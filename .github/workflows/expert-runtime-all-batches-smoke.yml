name: Expert compact runtime all-batches SQL diagnostic

on:
  workflow_dispatch:
  push:
    branches: ["lab-expert-engine"]
    paths:
      - ".github/workflows/expert-runtime-all-batches-smoke.yml"

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute compact runtime seed and every manifest batch
        id: diagnostic
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY' > expert_runtime_sql_trace.txt 2>&1
          import base64, json, pathlib, sqlite3, struct, zlib

          root = pathlib.Path('database/reference')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))

          def quncompress_qz64_bytes(encoded: bytes, label: str) -> bytes:
              try:
                  packed = base64.b64decode(encoded.strip())
              except Exception as exc:
                  raise RuntimeError(f'{label}: base64 decode failed: {exc}') from exc
              if len(packed) < 6:
                  raise RuntimeError(f'{label}: packed stream too short')
              expected = struct.unpack('>I', packed[:4])[0]
              try:
                  raw = zlib.decompress(packed[4:])
              except Exception as exc:
                  prefix = packed[:12].hex()
                  raise RuntimeError(f'{label}: zlib decompress failed: {exc}; packed_prefix={prefix}; expected={expected}') from exc
              if len(raw) != expected:
                  raise RuntimeError(f'{label}: qCompress size mismatch expected={expected} got={len(raw)}')
              return raw

          db = sqlite3.connect(':memory:', isolation_level=None)
          report = []

          parts = sorted(root.glob('mems_reference_seed_*.qz64'), key=lambda p: int(p.stem.rsplit('_', 1)[1]))
          if not parts:
              raise RuntimeError('seed parts missing')
          seed_encoded = b''.join(p.read_bytes().strip() for p in parts)
          seed_sql = quncompress_qz64_bytes(seed_encoded, 'seed').decode('utf-8')
          db.executescript(seed_sql)
          report.append({'item': 'seed', 'bytes': len(seed_sql.encode('utf-8'))})

          for batch in manifest['research_enrichment_batches']:
              if batch == 'research_enrichment_1600.qz64':
                  report.append({'item': batch, 'status': 'archive-only-skipped'})
                  continue
              path = root / batch
              if not path.exists():
                  raise RuntimeError(f'{batch}: file missing')
              sql_bytes = quncompress_qz64_bytes(path.read_bytes(), batch)
              try:
                  db.executescript(sql_bytes.decode('utf-8'))
              except Exception as exc:
                  raise RuntimeError(f'{batch}: SQL execution failed: {exc}') from exc
              report.append({'item': batch, 'bytes': len(sql_bytes), 'status': 'OK'})

          tables = db.execute("SELECT COUNT(*) FROM sqlite_master WHERE type='table'").fetchone()[0]
          rules = db.execute("SELECT COUNT(*) FROM mems_expert_rule").fetchone()[0]
          conditions = db.execute("SELECT COUNT(*) FROM mems_expert_rule_condition").fetchone()[0]
          seventy = db.execute("SELECT COUNT(*) FROM mems_expert_rule_condition WHERE parameter='coolant_c' AND metric='mean' AND comparator='ge' AND threshold_low=70.0").fetchone()[0]
          if seventy < 1:
              raise RuntimeError('70 C coolant guard missing after full compact runtime build')

          result = {
              'status': 'OK',
              'revision': manifest.get('database_revision'),
              'tables': tables,
              'rules': rules,
              'conditions': conditions,
              'coolant_70_guard': seventy,
              'loaded': report,
          }
          print(json.dumps(result, indent=2, ensure_ascii=False))
          pathlib.Path('expert/runtime_sql_diagnostic.txt').write_text(
              'Expert compact runtime SQL diagnostic: OK\n' + json.dumps(result, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8')
          PY
      - name: Record failure detail
        if: steps.diagnostic.outcome != 'success'
        shell: bash
        run: |
          {
            printf 'Expert compact runtime SQL diagnostic: FAILED\nsource_commit=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID"
            cat expert_runtime_sql_trace.txt 2>/dev/null || true
          } > expert/runtime_sql_diagnostic.txt
      - name: Publish diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- expert/runtime_sql_diagnostic.txt
          git commit -m "Record compact runtime SQL diagnostic [skip ci]" || exit 0
          git pull --rebase origin lab-expert-engine
          git push origin HEAD:lab-expert-engine
      - name: Fail if diagnostic failed
        if: steps.diagnostic.outcome != 'success'
        run: exit 1
