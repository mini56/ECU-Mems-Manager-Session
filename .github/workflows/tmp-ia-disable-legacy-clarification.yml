name: TMP IA legacy clarification disable

on:
  push:
    branches:
      - tmp-ia-architecture-prep

permissions:
  contents: write

jobs:
  disable-legacy-clarification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Disable the superseded text-only clarification installer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('database/MemsSearchCompletenessPatch.cpp')
          text=p.read_text(encoding='utf-8')
          old='Q_COREAPP_STARTUP_FUNCTION(installIaDocumentaryClarification)'
          new='// Superseded by IaDocumentaryLockPatch.cpp identity-based documentary pipeline.\n// Q_COREAPP_STARTUP_FUNCTION(installIaDocumentaryClarification)'
          if old not in text:
              raise SystemExit('legacy clarification startup hook not found')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
          git config user.name mini56
          git config user.email 48644212+mini56@users.noreply.github.com
          git add database/MemsSearchCompletenessPatch.cpp
          git rm .github/workflows/tmp-ia-disable-legacy-clarification.yml
          git commit -m "Disable superseded text-only IA clarification controller"
          git push origin HEAD:tmp-ia-architecture-prep
