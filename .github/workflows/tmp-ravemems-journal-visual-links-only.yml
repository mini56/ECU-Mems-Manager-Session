name: TEMP journal RAVEMEMS visual links only

on:
  push:
    paths:
      - .github/workflows/tmp-ravemems-journal-visual-links-only.yml

permissions:
  contents: write

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 1
      - name: Append visual-link rule and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' '' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          printf '%s\n' '## 2026-09-01 - RAVEMEMS - REGLE UTILISATEUR : LIENS UNIQUEMENT POUR LES VISUELS' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          printf '%s\n' '' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          printf '%s\n' 'Decision utilisateur : les liens vers les pages uniquement textuelles ne sont pas importants. Les relations de provenance explicites a ajouter dans la base doivent etre reservees aux pages contenant un visuel utile : schema electrique, illustration de procedure, dessin constructeur, photo technique ou autre visuel pertinent.' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          printf '%s\n' 'Les preuves textuelles et corrections de pagination RCL0193 restent conservees dans le rapport/audit et dans les sources existantes, mais ne justifient pas a elles seules la creation de nouvelles relations mems_doc_relation.' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          printf '%s\n' 'Pour les 10 faits cibles, les cinq cas RCL0194 de schemas p.17/p.19 restent prioritaires pour liaison visuelle. Les cinq cas RCL0193 ne recevront une relation supplementaire que si leurs pages contiennent une illustration visuelle directement utile au fait.' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          printf '%s\n' '' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          printf '%s\n' 'PROCHAINE ACTION EXACTE : auditer en lecture seule les visual_occurrence/visual_asset des pages RCL0193 99,102,119,124,135,136,170,171 et RCL0194 17,19. Identifier uniquement les visuels techniquement pertinents pour les 10 faits. Ensuite creer dans une copie de test seulement les liens historiques -> visuels RAVEMEMS pertinents, sans creer de liens vers les pages purement textuelles, sans supprimer/fusionner aucune donnee et sans toucher MEMSX64.' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          rm .github/workflows/tmp-ravemems-journal-visual-links-only.yml
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md .github/workflows/tmp-ravemems-journal-visual-links-only.yml
          git commit -m "Record RAVEMEMS visual-links-only rule"
          git push origin HEAD:RAPPORT
