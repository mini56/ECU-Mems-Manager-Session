name: "Annuler le workflow ECU en attente (runner Samsung non lie au depot)"
on:
  push:
    branches: [ops-archive-ecu-artifacts-samsung-20261107]
    paths: ['.github/workflows/cancel-unused-ecu-archive.yml']
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Annuler uniquement l'execution 42366302472, sans compilation"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/mini56/ECU-Mems-Manager-Session/actions/runs/42366302472/cancel"
          echo "WORKFLOW_INUTILE_ANNULE=42366302472"
