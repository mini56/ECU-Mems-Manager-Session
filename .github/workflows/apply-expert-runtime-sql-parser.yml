name: Apply robust IA runtime SQL parser

on:
  workflow_dispatch:
  push:
    branches: ["lab-expert-engine"]
    paths:
      - "tools/patch_expert_runtime_sql_parser.py"
      - ".github/workflows/apply-expert-runtime-sql-parser.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply parser patch
        run: python tools/patch_expert_runtime_sql_parser.py
      - name: Commit only if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- expert/ExpertRuntimeDatabase.cpp; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- expert/ExpertRuntimeDatabase.cpp
          git commit -m "Support multiline SQL in IA runtime cache [skip ci]"
          git pull --rebase origin lab-expert-engine
          git push origin HEAD:lab-expert-engine
