name: Build ECU MEMS Manager clean x64 milestone

on:
  workflow_dispatch:
  push:
    branches: [MEMSX64]
    paths:
      - '.github/workflows/build-ecu-mems-x64-clean.yml'
      - 'CMakeLists.txt'
      - 'navigationorderpatch.cpp'
      - 'navigationorderpatch.h'
      - 'iamemstab_clean.cpp'
      - 'translations/**'
      - 'librosco-x64/**'

permissions:
  contents: write

jobs:
  clean-x64-milestone:
    runs-on: windows-latest

    steps:
      - name: Checkout MEMSX64
        uses: actions/checkout@v4
        with:
          ref: MEMSX64

      - name: Publish build identity
        shell: pwsh
        run: |
          # This workflow was introduced after historical BUILD #15. The two
          # setup runs created while wiring the workflow are intentionally not
          # published; workflow run #3 is the first official clean x64 BUILD #16.
          $build = 13 + [int]'${{ github.run_number }}'
          $minor = [math]::Floor($build / 100)
          $patch = $build % 100
          $version = "1.$minor.$patch"
          "MEMS_BUILD=$build" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MEMS_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MEMS_BUILD_NUMBER=$build" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "BUILD #$build — v$version"

      - name: Mark clean x64 build running
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @(
            'status=RUNNING',
            "build=${{ env.MEMS_BUILD }}",
            "version=${{ env.MEMS_VERSION }}",
            "run_id=${{ github.run_id }}",
            "run_number=${{ github.run_number }}",
            "source_commit=${{ github.sha }}"
          ) | Set-Content -Encoding UTF8 ECU_MEMS_X64_CLEAN_STATUS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ECU_MEMS_X64_CLEAN_STATUS.txt
          git commit -m "Mark BUILD #${{ env.MEMS_BUILD }} clean x64 validation running [skip ci]"
          git push origin HEAD:MEMSX64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build validation tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall pefile

      - name: Install Qt 5.15.2 MSVC 2019 x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtcharts -O C:\Qt
          if (-not (Test-Path 'C:\Qt\5.15.2\msvc2019_64\lib\cmake\Qt5\Qt5Config.cmake')) {
            throw 'Qt 5.15.2 MSVC x64 installation incomplete'
          }

      - name: Validate deterministic 14-tab source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          nav = Path('navigationorderpatch.cpp').read_text(encoding='utf-8')
          cmake = Path('CMakeLists.txt').read_text(encoding='utf-8')
          wrapper = Path('iamemstab_clean.cpp').read_text(encoding='utf-8')
          required = [
              'overview_tab','injection_tab','emission_tab','actuators','errors',
              'DiagnosticPanel','ia_mems_tab','AnalysisTab','SummaryTab',
              'ecu_rosco_tab','raw','database_tab','ECU','mems19_test_tab'
          ]
          missing = [token for token in required if token not in nav]
          if missing:
              raise SystemExit('Missing deterministic tab identities: ' + ', '.join(missing))
          if 'kFinalTabCount = 14' not in nav:
              raise SystemExit('Navigation is not fixed to 14 tabs')
          if 'rankFromTitle' in nav or 'QTimer' in nav or 'singleShot' in nav:
              raise SystemExit('Legacy translated-title/timer navigation remains active')
          if 'taborderpatch.cpp' in cmake:
              raise SystemExit('Legacy taborderpatch.cpp is still compiled')
          if 'iamemstab_clean.cpp' not in cmake or 'iamemstab.cpp iamemstab.h' in cmake:
              raise SystemExit('IA MEMS clean wrapper is not the compiled implementation')
          if '#define Q_COREAPP_STARTUP_FUNCTION(AFUNC)' not in wrapper:
              raise SystemExit('IA legacy startup navigation hook is not suppressed')
          print('OK: deterministic 14-tab navigation source, no periodic navigation timers')
          '@ | python -

      - name: Validate protocol source guards
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python librosco-x64/validate_protocol_guards.py

      - name: Configure clean native x64 build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build-clean-x64 -A x64 `
            -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/msvc2019_64" `
            -DMEMS_USE_BUNDLED_LIBROSCO_X64=ON `
            -DMEMS_RUN_REFERENCE_SELFTEST_POST_BUILD=OFF

      - name: Build application and x64 protocol DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build-clean-x64 --config Release --target ecu_mems_manager rosco_abi_selftest

      - name: Run ABI structure and command self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ctest --test-dir build-clean-x64/librosco-x64 -C Release --output-on-failure -R rosco_abi_selftest

      - name: Run reference SQLite search self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $selftest = '${{ github.workspace }}\build-clean-x64\Release\mems_search_selftest.exe'
          if (-not (Test-Path $selftest)) { throw 'mems_search_selftest.exe missing' }
          & $selftest
          if ($LASTEXITCODE -ne 0) { throw "MEMS reference search self-test failed: $LASTEXITCODE" }

      - name: Assemble clean portable x64 package without local IA runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = 'C:\Qt\5.15.2\msvc2019_64'
          $qtBin = Join-Path $qtRoot 'bin'
          $build = '${{ github.workspace }}\build-clean-x64'
          $dist = '${{ github.workspace }}\dist-clean-x64'
          $app = Join-Path $build 'Release\ecu_mems_manager.exe'
          $protocol = Join-Path $build 'librosco-x64\Release\mems_manager_x64.dll'

          if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
          New-Item -ItemType Directory -Path $dist | Out-Null
          foreach ($src in @($app,$protocol)) {
            if (-not (Test-Path $src)) { throw "Required x64 binary missing: $src" }
          }
          Copy-Item $app (Join-Path $dist 'ecu_mems_manager.exe') -Force
          Copy-Item $protocol (Join-Path $dist 'mems_manager_x64.dll') -Force

          & (Join-Path $qtBin 'windeployqt.exe') `
            --release `
            --compiler-runtime `
            --no-translations `
            --dir $dist `
            (Join-Path $dist 'ecu_mems_manager.exe')
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed: $LASTEXITCODE" }

          $translations = Join-Path $build 'Release\translations'
          $database = Join-Path $build 'Release\database'
          if (-not (Test-Path $translations)) { throw 'Generated translations missing' }
          if (-not (Test-Path (Join-Path $database 'reference'))) { throw 'Generated MEMS reference database missing' }
          Copy-Item $translations (Join-Path $dist 'translations') -Recurse -Force
          Copy-Item $database (Join-Path $dist 'database') -Recurse -Force

          @(
            'ECU MEMS MANAGER CLEAN X64 MILESTONE',
            "BUILD #${{ env.MEMS_BUILD }} - v${{ env.MEMS_VERSION }}",
            'Application: native Windows x64',
            'Protocol DLL: mems_manager_x64.dll native x64',
            'Historical 32-bit librosco.dll: intentionally absent',
            'Local IA runtime/model: intentionally absent for this ECU-first validation milestone'
          ) | Set-Content -Path (Join-Path $dist 'README_X64_CLEAN_TEST.txt') -Encoding UTF8

          $forbidden = Get-ChildItem $dist -Recurse -File | Where-Object {
            $_.Name -ieq 'librosco.dll' -or $_.Name -ieq 'llama-server.exe' -or $_.Extension -ieq '.gguf'
          }
          if ($forbidden) { throw "Forbidden runtime found in clean package: $($forbidden.FullName -join ', ')" }

      - name: Validate controls 3-10 and 15 - PE architecture imports exports inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DIST = '${{ github.workspace }}\dist-clean-x64'
          @'
          import os
          from pathlib import Path
          import pefile

          root = Path(os.environ['DIST'])
          app = root / 'ecu_mems_manager.exe'
          dll = root / 'mems_manager_x64.dll'
          required = [
              app, dll,
              root/'Qt5Core.dll', root/'Qt5Gui.dll', root/'Qt5Widgets.dll',
              root/'Qt5Sql.dll', root/'Qt5SerialPort.dll',
              root/'platforms'/'qwindows.dll', root/'sqldrivers'/'qsqlite.dll',
          ]
          missing = [str(p.relative_to(root)) for p in required if not p.exists() or p.stat().st_size <= 0]
          if missing:
              raise SystemExit('Missing x64 package binaries: ' + ', '.join(missing))

          def pe(path): return pefile.PE(str(path), fast_load=False)
          app_pe, dll_pe = pe(app), pe(dll)
          for path,obj in [(app,app_pe),(dll,dll_pe)]:
              if obj.FILE_HEADER.Machine != 0x8664 or obj.OPTIONAL_HEADER.Magic != 0x20B:
                  raise SystemExit(f'{path.name} is not PE32+ AMD64')

          imports = [e.dll.decode('ascii',errors='replace').lower() for e in app_pe.DIRECTORY_ENTRY_IMPORT]
          if 'mems_manager_x64.dll' not in imports:
              raise SystemExit('Application does not import mems_manager_x64.dll')
          if 'librosco.dll' in imports:
              raise SystemExit('Application still imports historical librosco.dll')

          expected_exports = {
              'mems_cleanup','mems_clear_faults','mems_connect','mems_disconnect',
              'mems_get_lib_version','mems_heartbeat','mems_init','mems_init_link',
              'mems_is_connected','mems_lock','mems_move_iac','mems_openserial',
              'mems_read','mems_read_iac_position','mems_read_raw','mems_read_serial',
              'mems_reset_ECU','mems_reset_adjustments','mems_send_command',
              'mems_test_actuator','mems_unlock','mems_write_serial'
          }
          actual_exports = {
              symbol.name.decode('ascii') for symbol in dll_pe.DIRECTORY_ENTRY_EXPORT.symbols if symbol.name
          }
          if actual_exports != expected_exports:
              raise SystemExit(f'Protocol DLL exports mismatch: {sorted(actual_exports)}')

          wrong = []
          inventory = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path.suffix.lower() not in {'.exe','.dll'}:
                  continue
              try:
                  obj = pe(path)
              except pefile.PEFormatError:
                  continue
              machine = obj.FILE_HEADER.Machine
              inventory.append(f'{path.relative_to(root)} | machine=0x{machine:04X}')
              if machine != 0x8664:
                  wrong.append(str(path.relative_to(root)))
          if wrong:
              raise SystemExit('x86/x64 mixture detected: ' + ', '.join(wrong))
          (root/'PE_X64_INVENTORY.txt').write_text('\n'.join(inventory)+'\n',encoding='utf-8')
          print(f'OK: {len(inventory)} PE files inventoried, all AMD64; 22 exports verified')
          '@ | python -

      - name: Validate control 14 - SQLite and indispensable resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DIST = '${{ github.workspace }}\dist-clean-x64'
          @'
          import base64, os, sqlite3, tempfile, zlib
          from pathlib import Path

          root = Path(os.environ['DIST'])
          required = [
              root/'translations'/'fr'/'fr.json',
              root/'translations'/'en'/'en.json',
              root/'translations'/'fr'/'fr_navigation.json',
              root/'translations'/'en'/'en_navigation.json',
              root/'database'/'reference'/'manifest.json',
              root/'sqldrivers'/'qsqlite.dll',
          ]
          missing = [str(p.relative_to(root)) for p in required if not p.exists() or p.stat().st_size <= 0]
          if missing:
              raise SystemExit('Missing indispensable resources: ' + ', '.join(missing))

          ref = root/'database'/'reference'
          parts = [ref/f'mems_reference_seed_{i}.qz64' for i in range(1,5)]
          missing_parts = [p.name for p in parts if not p.exists()]
          if missing_parts:
              raise SystemExit('Missing MEMS reference seed parts: ' + ', '.join(missing_parts))
          encoded = b''.join(p.read_bytes().strip() for p in parts)
          packed = base64.b64decode(encoded)
          expected = int.from_bytes(packed[:4], 'big')
          sql_bytes = zlib.decompress(packed[4:])
          if len(sql_bytes) != expected:
              raise SystemExit(f'Invalid MEMS seed length: {len(sql_bytes)} != {expected}')
          smoke = Path(tempfile.gettempdir())/'ecu_mems_clean_x64_reference.sqlite'
          if smoke.exists(): smoke.unlink()
          con = sqlite3.connect(smoke)
          try:
              for statement in sql_bytes.decode('utf-8').splitlines():
                  statement = statement.strip()
                  if statement: con.execute(statement)
              con.commit()
              counts = [con.execute('SELECT COUNT(*) FROM ecu_target').fetchone()[0],
                        con.execute('SELECT COUNT(*) FROM ecu_fitment_target').fetchone()[0],
                        con.execute('SELECT COUNT(*) FROM protocol_commands').fetchone()[0]]
              if min(counts) <= 0:
                  raise SystemExit(f'Reconstructed MEMS reference DB is empty: {counts}')
              print(f'OK SQLite/reference resources: ECU={counts[0]}, fitments={counts[1]}, commands={counts[2]}')
          finally:
              con.close()
              if smoke.exists(): smoke.unlink()
          '@ | python -

      - name: Validate clean package has no local IA runtime or x86 librosco
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = '${{ github.workspace }}\dist-clean-x64'
          $forbidden = Get-ChildItem $dist -Recurse -File | Where-Object {
            $_.Name -ieq 'librosco.dll' -or $_.Name -ieq 'llama-server.exe' -or $_.Extension -ieq '.gguf'
          }
          if ($forbidden) { throw "Forbidden package files: $($forbidden.FullName -join ', ')" }
          Write-Host 'OK: no historical x86 librosco.dll, no llama-server.exe, no GGUF model'

      - name: Validate control 13 - smoke launch clean packaged application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = '${{ github.workspace }}\dist-clean-x64'
          $exe = Join-Path $dist 'ecu_mems_manager.exe'
          $proc = Start-Process $exe -WorkingDirectory $dist -PassThru
          Start-Sleep -Seconds 5
          $proc.Refresh()
          if ($proc.HasExited) {
            throw "Clean x64 application exited during smoke launch (code $($proc.ExitCode))"
          }
          Stop-Process -Id $proc.Id -Force
          Write-Host 'OK: clean x64 application remained running during smoke launch'

      - name: Write 15-control milestone report
        shell: pwsh
        run: |
          $dist = '${{ github.workspace }}\dist-clean-x64'
          @(
            "BUILD #${{ env.MEMS_BUILD }} — v${{ env.MEMS_VERSION }}",
            'ECU MEMS MANAGER CLEAN X64: 15/15 AUTOMATED CONTROLS PASSED',
            '01 PASS clean x64 application compile',
            '02 PASS clean mems_manager_x64.dll compile',
            '03 PASS ecu_mems_manager.exe PE32+ AMD64',
            '04 PASS mems_manager_x64.dll PE32+ AMD64',
            '05 PASS Qt/plugin DLL architecture x64',
            '06 PASS qsqlite + Qt SerialPort + essentials x64',
            '07 PASS application imports mems_manager_x64.dll',
            '08 PASS application does not import librosco.dll',
            '09 PASS historical x86 librosco.dll absent from package',
            '10 PASS exactly 22 historical DLL exports',
            '11 PASS ABI frame80=28 frame7d=32 mems_data=60 + command self-test',
            '12 PASS full/truncated frame guards + clear/reset/historical command guards',
            '13 PASS packaged application smoke launch',
            '14 PASS SQLite/reference resources and qsqlite',
            '15 PASS complete PE inventory contains AMD64 only',
            'NAV PASS deterministic 14-tab identity order; no translated-title ranking; no periodic navigation timers',
            'IA PACKAGE PASS no llama-server.exe and no GGUF model in this ECU-first milestone',
            "commit=${{ github.sha }}",
            "workflow_run_id=${{ github.run_id }}"
          ) | Set-Content -Path (Join-Path $dist 'ECU_MEMS_X64_15_CONTROLS.txt') -Encoding UTF8
          Get-Content (Join-Path $dist 'ECU_MEMS_X64_15_CONTROLS.txt')

      - name: Upload clean x64 milestone
        uses: actions/upload-artifact@v4
        with:
          name: ECU-MEMS-Manager-x64-CLEAN-BUILD-${{ env.MEMS_BUILD }}-v${{ env.MEMS_VERSION }}
          path: dist-clean-x64/
          if-no-files-found: error
          compression-level: 0

      - name: Mark clean x64 build passed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @(
            'status=PASSED',
            "build=${{ env.MEMS_BUILD }}",
            "version=${{ env.MEMS_VERSION }}",
            "run_id=${{ github.run_id }}",
            "run_number=${{ github.run_number }}",
            "source_commit=${{ github.sha }}",
            "artifact=ECU-MEMS-Manager-x64-CLEAN-BUILD-${{ env.MEMS_BUILD }}-v${{ env.MEMS_VERSION }}",
            'controls=15/15',
            'navigation=14/14 deterministic',
            'local_ai_runtime=absent',
            'historical_librosco_x86=absent'
          ) | Set-Content -Encoding UTF8 ECU_MEMS_X64_CLEAN_STATUS.txt
          git add ECU_MEMS_X64_CLEAN_STATUS.txt
          git commit -m "Validate BUILD #${{ env.MEMS_BUILD }} clean x64 milestone [skip ci]"
          git push origin HEAD:MEMSX64

      - name: Mark clean x64 build failed
        if: failure()
        shell: pwsh
        run: |
          @(
            'status=FAILED',
            "build=${{ env.MEMS_BUILD }}",
            "version=${{ env.MEMS_VERSION }}",
            "run_id=${{ github.run_id }}",
            "run_number=${{ github.run_number }}",
            "source_commit=${{ github.sha }}"
          ) | Set-Content -Encoding UTF8 ECU_MEMS_X64_CLEAN_STATUS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ECU_MEMS_X64_CLEAN_STATUS.txt
          git commit -m "Record BUILD #${{ env.MEMS_BUILD }} clean x64 failure [skip ci]"
          git push origin HEAD:MEMSX64
