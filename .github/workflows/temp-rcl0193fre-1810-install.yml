name: TEMP RCL0193FRE 1810 FINAL INSTALL
on:
  push:
    branches: [tmp-rave-visual-backfill]
    paths:
      - '.github/workflows/temp-rcl0193fre-1810-install.yml'
      - 'tools/install_rcl0193fre_1810.py'
permissions:
  contents: write
concurrency:
  group: rcl0193fre-1810-final
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-rave-visual-backfill
          fetch-depth: 0
      - name: Verify production remains BUILD 101
        shell: bash
        run: |
          test "$(git ls-remote origin refs/heads/MEMSX64 | cut -f1)" = "22dbe75ed14e0a61e694159d505ef72245116b48"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Fetch exact validated 1810 transport
        shell: bash
        env:
          G4_URL: 'https://tmpfiles.org/dl/1788032110.4adf503c321ae251/wqwhBrGdjVaB/rcl0193fre_1810_g4_150.tif.xz'
          QZ_URL: 'https://tmpfiles.org/dl/1788032111.65fbccac4534ff29/wEwoBeGsjBvb/research_enrichment_1810.qz64'
        run: |
          mkdir -p .rcl1810_transport
          curl -fL --retry 4 --retry-delay 2 "$G4_URL" -o .rcl1810_transport/rcl0193fre_1810_g4_150.tif.xz
          curl -fL --retry 4 --retry-delay 2 "$QZ_URL" -o .rcl1810_transport/research_enrichment_1810.qz64
          echo 'dd4c5171b38f39b68f4b18e5002ae23c9234bc7f5ff9e27f963ae3388174c329  .rcl1810_transport/rcl0193fre_1810_g4_150.tif.xz' | sha256sum -c -
          echo 'eb9e28913d2815b8a270ec4b3f4dd5fdfd69c23acf3a0cdbd3b07a1ab9365226  .rcl1810_transport/research_enrichment_1810.qz64' | sha256sum -c -
      - name: Install and validate 1810
        shell: bash
        run: |
          cp tools/install_rcl0193fre_1810.py /tmp/install_rcl0193fre_1810.py
          python /tmp/install_rcl0193fre_1810.py install "$GITHUB_WORKSPACE"
      - name: Commit complete 1810
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/temp-rcl0193fre-1810-install.yml tools/install_rcl0193fre_1810.py
          rm -rf .rcl1810_transport
          git add database/reference/research_enrichment_1810.qz64 database/reference/manifest.json database/reference/audits/rcl0193fre_1810_audit.md database/reference/images/rave/RCL0193FRE_PDF_*.png
          git status --short
          git commit -m 'Add RCL0193FRE cooling intake exhaust batch 1810'
          git push origin HEAD:tmp-rave-visual-backfill
      - name: Verify committed remote state
        shell: bash
        run: |
          git fetch origin tmp-rave-visual-backfill
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/tmp-rave-visual-backfill)"
          python /tmp/install_rcl0193fre_1810.py post "$GITHUB_WORKSPACE"
