name: TEMP REPORT AKM7169 1870 PREPUSH

on:
  push:
    branches: [RAPPORT]
    paths:
      - '.github/workflows/temp-report-akm7169-1870-prepush.yml'

permissions:
  contents: write

jobs:
  append-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Append checkpoint and remove helper
        env:
          PAYLOAD_B64: ''
        run: |
          python - <<'PY2'
          import base64, os
          path='RAPPORT_SUIVI_ECU_MEMS_MANAGER.md'
          payload=base64.b64decode(os.environ['PAYLOAD_B64'])
          with open(path,'ab') as f:
              f.write(payload)
          PY2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git rm .github/workflows/temp-report-akm7169-1870-prepush.yml
          git commit -m 'Journal AKM7169 1870 full reintegration pre-push'
          git push origin RAPPORT
