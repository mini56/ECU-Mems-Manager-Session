name: TEMP RAVEMEMS REPORT OCR HELPER DIAGNOSIS

on:
  push:
    branches:
      - RAPPORT
    paths:
      - .ravemems-report-ocr-helper-trigger

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - run: python tools/temp_append_ravemems_ocr_helper_diagnosis.py
      - run: |
          set -euo pipefail
          git config user.name github-actions-bot
          git config user.email github-actions@users.noreply.github.com
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git rm .github/workflows/temp-ravemems-report-ocr-helper-diagnosis.yml tools/temp_append_ravemems_ocr_helper_diagnosis.py .ravemems-report-ocr-helper-trigger
          git commit -m "Record TEST2 OCR helper diagnosis"
          git push origin RAPPORT
