name: Audit exhaustif occurrences AANMP002 SESSION 231
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: '4b465406cca3a3a619b0396bc8ca85c3af4c9dc0'
          path: manager_snapshot
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - run: python3 research/audit-occurrences-aanmp002-20261128/audit.py manager_snapshot research/audit-occurrences-aanmp002-20261128/results
      - name: Enregistrer le résultat avant publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/audit-occurrences-aanmp002-20261128/results
          if ! git diff --cached --quiet; then
            git commit -m "Audit exhaustif AANMP002 SESSION 231 : résultats [skip ci]"
            git pull --rebase origin research/mems-firmwares-20261126
            git push origin HEAD:research/mems-firmwares-20261126
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: audit-occurrences-AANMP002-session231
          path: research/audit-occurrences-aanmp002-20261128/results
