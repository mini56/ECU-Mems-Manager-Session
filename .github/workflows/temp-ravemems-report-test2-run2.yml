name: TEMP RAVEMEMS REPORT TEST2 RUN2
on: [push]
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - run: python tools/temp_append_ravemems_test2_run2.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions-bot
          git config user.email github-actions@users.noreply.github.com
          git rm .github/workflows/temp-ravemems-report-test2-run2.yml .ravemems-run2-report-trigger tools/temp_append_ravemems_test2_run2.py
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git commit -m "Record RAVEMEMS TEST2 run 2 pixel guard failure"
          git push origin HEAD:RAPPORT
