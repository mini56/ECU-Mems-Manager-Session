      - name: Validate complete clean BUILD package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:DIST_ROOT=$env:DIST
          @'
          import hashlib,json,os,sqlite3
          from pathlib import Path
          import pefile
          root=Path(os.environ['DIST_ROOT'])
          required=[root/'ecu_mems_manager.exe',root/'mems_manager_x64.dll',root/'MEMSLibrary.dll',root/'MEMSLibrary_Pack_001'/'knowledge.sqlite',root/'MEMSLibrary_Pack_001'/'manifest.json',root/'database'/'reference'/'runtime_visual_catalog.json']
          miss=[str(x) for x in required if not x.is_file()]
          assert not miss,miss
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          assert sha(root/'MEMSLibrary.dll')==os.environ['CORRECTED_DLL_SHA256']
          assert sha(root/'MEMSLibrary_Pack_001'/'knowledge.sqlite')==os.environ['PACK001_SQLITE_SHA256']
          ref=root/'database'/'reference'
          cat=json.loads((ref/'runtime_visual_catalog.json').read_text(encoding='utf-8'))
          assert cat['source_lineage']=='RAVEMEMS_V2_FINAL_33810202288' and cat['entry_count']==1667
          assert cat['legacy_entries']==0 and cat['pre_v2_images_included']==0
          assert not (ref/'images'/'rave').exists()
          db=sqlite3.connect(root/'MEMSLibrary_Pack_001'/'knowledge.sqlite')
          try:
              assert db.execute('pragma integrity_check').fetchone()[0]=='ok'
              assert db.execute('pragma foreign_key_check').fetchall()==[]
              assert db.execute('select count(*) from ravemems_document').fetchone()[0]==47
              assert db.execute('select count(*) from ravemems_page').fetchone()[0]==1359
              assert db.execute('select count(*) from memslibrary_search').fetchone()[0]==5453
          finally: db.close()
          for p in (root/'ecu_mems_manager.exe',root/'mems_manager_x64.dll',root/'MEMSLibrary.dll'):
              pe=pefile.PE(str(p),fast_load=True); assert pe.FILE_HEADER.Machine==0x8664,p; pe.close()
          print('CLEAN_BUILD_PACKAGE_PASS visuals=1667 legacy=0 docs=47 pages=1359 search=5453 corrected_dll=1')
          '@ | python -

      - name: Windows SQLite clean-install and existing-install regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe='${{ github.workspace }}\build-x64\Release\database_storage_selftest.exe'
          if(-not (Test-Path $exe)){throw 'SQLite test binary not compiled'}
          $qt='C:\Qt\5.15.2\msvc2019_64'
          $env:PATH="$qt\bin;$env:PATH"
          $env:QT_PLUGIN_PATH="$qt\plugins"
          $sandbox=Join-Path $env:RUNNER_TEMP "MEMS_SQLITE_TEST_$env:GITHUB_RUN_ID"
          $fresh=Join-Path $sandbox 'fresh'
          $upgrade=Join-Path $sandbox 'upgrade'
          New-Item -ItemType Directory $fresh,$upgrade -Force | Out-Null
          Copy-Item $exe (Join-Path $fresh 'storage-test.exe') -Force
          Copy-Item $exe (Join-Path $upgrade 'storage-test.exe') -Force
          & (Join-Path $upgrade 'storage-test.exe') prepare-upgrade
          if($LASTEXITCODE -ne 0){throw 'Existing PC fixture failed'}
          & (Join-Path $fresh 'storage-test.exe') fresh
          if($LASTEXITCODE -ne 0){throw 'Clean PC initial SQLite creation failed'}
          & (Join-Path $fresh 'storage-test.exe') reopen-fresh
          if($LASTEXITCODE -ne 0){throw 'Clean PC data persistence failed'}
          & (Join-Path $upgrade 'storage-test.exe') upgrade
          if($LASTEXITCODE -ne 0){throw 'Previously installed PC SQLite migration failed'}
          & (Join-Path $upgrade 'storage-test.exe') reopen-upgrade
          if($LASTEXITCODE -ne 0){throw 'Previously installed PC data persistence failed'}
          Write-Host 'WINDOWS_SQLITE_VIRGIN_INSTALL_PASS'
          Write-Host 'WINDOWS_SQLITE_EXISTING_INSTALL_PRESERVED_PASS'
          Write-Host 'WINDOWS_SQLITE_PERSONAL_DATA_OUTSIDE_PROGRAM_FILES_PASS'

      - name: Verify REAL Windows navigation after language selection and deferred sidebar build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $marker=Join-Path $env:RUNNER_TEMP "LIGHT_GUI_verified_$env:GITHUB_RUN_ID.txt"
          if(Test-Path $marker){Remove-Item $marker -Force}
          $env:MEMS_LIGHT_NAV_PROBE=$marker
          $p=Start-Process -FilePath "$env:DIST\ecu_mems_manager.exe" -WorkingDirectory $env:DIST -PassThru
          try {
            $result=$false
            for($attempt=0;$attempt -lt 122;$attempt++){
              if(Test-Path $marker){$result=$true;break}
              if($p.HasExited){throw "App exited before LIGHT GUI: $($p.ExitCode)"}
              if(($attempt%10) -eq 0){
                $p.Refresh()
                Write-Host "WAIT_LIGHT_REAL_GUI elapsed=$($attempt*2)s window=$($p.MainWindowTitle)"
              }
              Start-Sleep -Seconds 2
            }
            if(-not $result){
              $p.Refresh()
              throw "REAL LIGHT GUI not ready after 240s; window=$($p.MainWindowTitle)"
            }
            $proof=Get-Content $marker -Raw
            Write-Host "LIGHT_LAYOUT_REAL_GUI_DIAGNOSTIC=$proof"
            if(-not $proof.StartsWith('LIGHT_GUI_MENU_PROBE_PASS visible=11 hidden=3 pages=14')){
              throw "LIGHT GUI output invalid: $proof"
            }
            if(-not $proof.Contains('readable_fonts=11pt') -or -not $proof.Contains('protected_pages=2')) {
              throw "LIGHT font sizes and approved pages not verified: $proof"
            }
            if(-not $proof.Contains('layout=responsive') -or -not $proof.Contains('resolutions=4') -or -not $proof.Contains('menu_clicks=44')){
              throw "LIGHT responsive page viewport or font regression: $proof"
            }
            Write-Host 'LIGHT_REAL_WINDOWS_GUI_11_MENU_ITEMS_PASS'
            Write-Host 'LIGHT_ALL_11_MENU_LINKS_4_RESOLUTIONS_RESPONSIVE_PASS'
          } finally {
            $null=$p.CloseMainWindow()
            if(-not $p.WaitForExit(5000)){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
            Remove-Item Env:MEMS_LIGHT_NAV_PROBE -ErrorAction SilentlyContinue
          }
          Write-Host "BUILD_$env:MEMS_BUILD_SMOKE_PASS"

      - name: Generate package hashes
        shell: pwsh
        run: |
          $hashFile=Join-Path $env:DIST ("BUILD"+$env:MEMS_BUILD+"_SHA256.txt")
          $lines=foreach($f in Get-ChildItem $env:DIST -Recurse -File | Where-Object{$_.FullName-ne$hashFile} | Sort-Object FullName){$r=$f.FullName.Substring($env:DIST.Length+1).Replace('\','/'); "$((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $r"}
          $lines | Set-Content $hashFile -Encoding UTF8

      - name: Create Windows Setup installer from validated x64 package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          choco install innosetup -y --no-progress --limit-output
          if($LASTEXITCODE -ne 0){throw 'Inno Setup installation failed'}
          $compiler=Get-ChildItem "${env:ProgramFiles(x86)}" -Recurse -File -Filter ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $compiler){throw 'Inno Setup compiler missing'}
          $root=$env:DIST.Replace('\','\\')
          $iss=@'
          #define MyAppName "ECU MEMS Manager LIGHT"
          #define MyAppVersion "1.0.127"
          [Setup]
          AppId={{D2504AE1-8548-44B9-97AA-46E141868A01}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher=ECU MEMS Manager
          DefaultDirName={autopf}\ECU MEMS Manager LIGHT
          DefaultGroupName=ECU MEMS Manager LIGHT
          OutputDir=setup-output
          OutputBaseFilename=ECU-MEMS-Manager-Setup-v1.0.127-LIGHT
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          PrivilegesRequired=admin
          UninstallDisplayIcon={app}\ecu_mems_manager.exe
          [Languages]
          Name: "french"; MessagesFile: "compiler:Languages\French.isl"
          [Files]
          Source: "dist-x64\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\ECU MEMS Manager LIGHT"; Filename: "{app}\ecu_mems_manager.exe"; WorkingDir: "{app}"; IconFilename: "{app}\ecu_mems_manager.exe"
          Name: "{autodesktop}\ECU MEMS Manager LIGHT"; Filename: "{app}\ecu_mems_manager.exe"; WorkingDir: "{app}"; IconFilename: "{app}\ecu_mems_manager.exe"
          [Run]
          Filename: "{app}\ecu_mems_manager.exe"; Description: "Démarrer ECU MEMS Manager LIGHT"; Flags: nowait postinstall skipifsilent
          '@
          $iss | Set-Content setup.iss -Encoding UTF8
          & $compiler.FullName setup.iss
          if($LASTEXITCODE -ne 0){throw 'Inno Setup compilation failed'}
          $exe=Get-ChildItem setup-output -File -Filter *.exe | Select-Object -First 1
          if(-not $exe){throw 'Setup executable not generated'}
          Write-Host "SETUP_GENERATED size=$($exe.Length) sha256=$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash)"
      
      - name: ACTUALLY INSTALL LIGHT Setup and verify desktop shortcut
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $setup=Get-ChildItem setup-output -File -Filter *.exe | Select-Object -First 1
          if(-not $setup){throw 'Setup not available for installation test'}
          $process=Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if($process.ExitCode -ne 0){throw "Silent LIGHT Windows install failed: $($process.ExitCode)"}
          $installed=@(
            (Join-Path $env:ProgramFiles 'ECU MEMS Manager LIGHT\ecu_mems_manager.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'ECU MEMS Manager LIGHT\ecu_mems_manager.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if(-not $installed){throw 'Setup did not install LIGHT executable in Program Files'}
          $shortcuts=@(
            (Join-Path $env:PUBLIC 'Desktop\ECU MEMS Manager LIGHT.lnk'),
            (Join-Path $env:USERPROFILE 'Desktop\ECU MEMS Manager LIGHT.lnk')
          ) | Where-Object { Test-Path $_ }
          if(-not $shortcuts){throw 'LIGHT desktop shortcut missing after a real Setup install'}
          $shell=New-Object -ComObject WScript.Shell
          # PowerShell unwraps a single-item pipeline result to a scalar
          # string: $shortcuts[0] would then mean its FIRST CHARACTER. Force
          # an array and verify the complete .lnk path before COM opens it.
          $shortcutPath=[string](@($shortcuts)[0])
          if(-not $shortcutPath.EndsWith('.lnk',[StringComparison]::OrdinalIgnoreCase)){
            throw "Invalid shortcut pathname selected: $shortcutPath"
          }
          $link=$shell.CreateShortcut($shortcutPath)
          if($link.TargetPath -ne $installed){throw "Wrong desktop shortcut target: $($link.TargetPath) expected $installed"}
          if(-not(Test-Path $link.TargetPath)){throw 'Desktop shortcut executable missing'}
          Write-Host 'LIGHT_REAL_WINDOWS_SETUP_INSTALL_PASS'
          Write-Host "LIGHT_REAL_DESKTOP_SHORTCUT_PASS shortcut=$shortcutPath target=$($link.TargetPath)"
          Write-Host 'LIGHT_PROTECTED_PROGRAM_FILES_LOCATION_PASS'

