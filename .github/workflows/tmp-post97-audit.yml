name: TEMP POST97 AUDIT

on:
  push:
    branches: [tmp-ia-post97-audit-fix]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and inspect MEMS XML sheets
        shell: python
        run: |
          import base64, zlib, struct, pathlib, xml.etree.ElementTree as ET
          for name in ('mems_1_6.xml.qz64','mems_1_9.xml.qz64'):
              p=pathlib.Path('database/reference/fiches')/name
              packed=base64.b64decode(p.read_bytes().strip())
              expected=struct.unpack('>I', packed[:4])[0]
              xml_bytes=zlib.decompress(packed[4:])
              print(f'=== {name} bytes={len(xml_bytes)} expected={expected} ===')
              text=xml_bytes.decode('utf-8')
              root=ET.fromstring(text)
              tags={}
              attrs={}
              for e in root.iter():
                  tags[e.tag]=tags.get(e.tag,0)+1
                  for k in e.attrib:
                      attrs[k]=attrs.get(k,0)+1
              print('ROOT', root.tag, root.attrib)
              print('TAGS', sorted(tags.items()))
              print('ATTRS', sorted(attrs.items()))
              for i,line in enumerate(text.splitlines(),1):
                  low=line.lower()
                  if any(x in low for x in ('couleur','color','colour','wire','fil','broche','pin','style','background','rgb','#')):
                      print(f'L{i}: {line[:800]}')
              print('=== END ===')
