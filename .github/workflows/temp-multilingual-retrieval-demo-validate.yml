name: TEMP MULTILINGUAL RETRIEVAL DEMO VALIDATION

on:
  push:
    branches: [tmp-multilingual-knowledge-foundation]
    paths:
      - 'database/reference/prototypes/multilingual_knowledge_foundation_v1.sql'
      - 'database/reference/prototypes/multilingual_retrieval_demo_v1.sql'
      - 'database/reference/audits/MULTILINGUAL_RETRIEVAL_DEMO_V1.md'
      - '.github/workflows/temp-multilingual-retrieval-demo-validate.yml'

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Download BUILD 103
        shell: bash
        run: |
          set -euo pipefail
          mkdir build103
          gh run download 33334306835 -R mini56/ECU-Mems-Manager-Session \
            -n ECU-MEMS-Manager-x64-BUILD-103-v1.0.103 -D build103

      - name: Validate real multilingual retrieval demo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import shutil
          import sqlite3
          from pathlib import Path

          dbs=list(Path('build103').rglob('ia_mems_reference_r20.sqlite'))
          if len(dbs)!=1:
              raise SystemExit(f'unexpected BUILD103 expert DB count: {len(dbs)}')
          shutil.copy2(dbs[0], 'test.sqlite')

          db=sqlite3.connect('test.sqlite')
          db.execute('pragma foreign_keys=on')

          historical=[
              'mems_knowledge_item','mems_rave_fact','mems_rave_illustration',
              'mems_procedure','mems_procedure_step','mems_specification','mems_specification_value'
          ]

          def count(t):
              return db.execute(f'select count(*) from {t}').fetchone()[0]

          def digest_table(t):
              h=hashlib.sha256()
              cur=db.execute(f'select * from {t} order by rowid')
              for row in cur:
                  h.update(repr(row).encode('utf-8'))
                  h.update(b'\n')
              return h.hexdigest()

          baseline=(
              db.execute('pragma user_version').fetchone()[0],
              count('mems_knowledge_item'), count('mems_rave_illustration'),
              count('mems_procedure'), count('mems_specification'),
              db.execute("select count(*) from sqlite_master where type='table'").fetchone()[0]
          )
          if baseline!=(20,1113,126,410,649,78):
              raise SystemExit(f'bad BUILD103 baseline {baseline}')
          if db.execute('pragma integrity_check').fetchone()[0].lower()!='ok':
              raise SystemExit('BUILD103 integrity failed')

          historical_before={t:(count(t),digest_table(t)) for t in historical}

          foundation=Path('database/reference/prototypes/multilingual_knowledge_foundation_v1.sql').read_text(encoding='utf-8')
          demo_path=Path('database/reference/prototypes/multilingual_retrieval_demo_v1.sql')
          demo=demo_path.read_text(encoding='utf-8')
          print('DEMO_SQL_SHA256='+hashlib.sha256(demo_path.read_bytes()).hexdigest())

          db.executescript(foundation)
          after_foundation=(
              db.execute('pragma user_version').fetchone()[0],
              count('mems_knowledge_item'), count('mems_rave_illustration'),
              count('mems_procedure'), count('mems_specification'),
              db.execute("select count(*) from sqlite_master where type='table'").fetchone()[0]
          )
          if after_foundation!=(21,1113,126,410,649,89):
              raise SystemExit(f'bad foundation state {after_foundation}')

          db.executescript(demo)

          demo_counts=lambda: (
              db.execute("select count(*) from mems_doc_entity where entity_key like 'DEMO-%'").fetchone()[0],
              db.execute("select count(*) from mems_doc_text where entity_key like 'DEMO-%'").fetchone()[0],
              db.execute("select count(*) from mems_doc_relation where from_entity_key like 'DEMO-%'").fetchone()[0],
              db.execute("select count(*) from mems_doc_table_cell where cell_entity_key like 'DEMO-%'").fetchone()[0]
          )
          first=demo_counts()
          if first!=(16,30,6,6):
              raise SystemExit(f'unexpected demo counts {first}')

          # Idempotence: applying the same import twice must not add or alter records.
          db.executescript(demo)
          second=demo_counts()
          if second!=first:
              raise SystemExit(f'demo is not idempotent: first={first} second={second}')

          historical_after={t:(count(t),digest_table(t)) for t in historical}
          if historical_after!=historical_before:
              changed=[t for t in historical if historical_before[t]!=historical_after[t]]
              raise SystemExit('historical BUILD103 tables changed: '+','.join(changed))

          # Exact legacy source is preserved while display text may be normalized.
          legacy_step=db.execute("select instruction_source from mems_procedure_step where procedure_key='PROC-RCL0193FRE-18-30-10-remove-1' and step_no=3").fetchone()[0]
          source_exact=db.execute("select text_value from mems_doc_text where entity_key='DEMO-P-ECT-REMOVE-S3' and field_key='source_exact' and locale='fr'").fetchone()[0]
          display_fr=db.execute("select text_value from mems_doc_text where entity_key='DEMO-P-ECT-REMOVE-S3' and field_key='display' and locale='fr'").fetchone()[0]
          if source_exact!=legacy_step or 'SYSTEME DE GESTION MOTEUR - MEMS' not in source_exact:
              raise SystemExit('exact procedure source was not preserved')
          if 'SYSTEME DE GESTION MOTEUR - MEMS' in display_fr:
              raise SystemExit('legacy page-header residue leaked into clean display text')

          # One original image only, exact path/hash, immutable flag and verified dimensions.
          visual=db.execute("select relative_path,sha256,source_width,source_height,original_intact from mems_doc_visual where entity_key='DEMO-V-RCL0194ENG-20.4'").fetchone()
          expected_visual=('images/rave/RCL0194ENG_20_4.png','7a04d84ee0296ab41333650f369aa3624f3ac7988a528584237a7b8fb021bea0',1696,1190,1)
          if visual!=expected_visual:
              raise SystemExit(f'visual mismatch {visual}')
          legacy_visual=db.execute("select relative_path,sha256 from mems_rave_illustration where illustration_key='RAVE:RCL0194ENG:20.4'").fetchone()
          if legacy_visual!=expected_visual[:2]:
              raise SystemExit('visual no longer matches BUILD103 source')

          region=db.execute("select x_norm,y_norm,width_norm,height_norm,anchor_ref from mems_doc_visual_region where region_entity_key='DEMO-L-RCL0194ENG-20.4-ECT'").fetchone()
          if region[4]!='COOLANT TEMPERATURE SENSOR (094)' or not all(0.0<=v<=1.0 for v in region[:4]):
              raise SystemExit(f'bad visual label region {region}')
          label_en=db.execute("select text_value,translation_status from mems_doc_text where entity_key='DEMO-L-RCL0194ENG-20.4-ECT' and field_key='label' and locale='en'").fetchone()
          if label_en!=('COOLANT TEMPERATURE SENSOR (094)','source'):
              raise SystemExit('English visual source label mismatch')

          # Data-driven locale fallback. No language-specific columns are needed.
          def localized(entity,field,locale):
              seen=set(); loc=locale
              while loc and loc not in seen:
                  seen.add(loc)
                  row=db.execute("select text_value,translation_status from mems_doc_text where entity_key=? and field_key=? and locale=?",(entity,field,loc)).fetchone()
                  if row:
                      return loc,row[0],row[1]
                  f=db.execute("select fallback_locale from mems_doc_locale where locale=?",(loc,)).fetchone()
                  loc=f[0] if f else None
              return None

          direct_fr=localized('DEMO-K-RCL0194-ECT-WIRING','display','fr')
          direct_en=localized('DEMO-K-RCL0194-ECT-WIRING','display','en')
          fallback_de=localized('DEMO-K-RCL0194-ECT-WIRING','display','de')
          fallback_ja=localized('DEMO-K-RCL0194-ECT-WIRING','display','ja')
          fallback_zh=localized('DEMO-K-RCL0194-ECT-WIRING','display','zh-CN')
          if not direct_fr or direct_fr[0]!='fr': raise SystemExit('FR retrieval failed')
          if not direct_en or direct_en[0]!='en': raise SystemExit('EN retrieval failed')
          if not fallback_de or fallback_de[0]!='fr': raise SystemExit(f'DE fallback failed {fallback_de}')
          if not fallback_ja or fallback_ja[0]!='en': raise SystemExit(f'JA fallback failed {fallback_ja}')
          if not fallback_zh or fallback_zh[0]!='en': raise SystemExit(f'ZH fallback failed {fallback_zh}')

          current=db.execute("select locale,enabled from mems_doc_locale where locale in ('fr','en','es','it','pt','de') order by locale").fetchall()
          future=db.execute("select locale,enabled,fallback_locale from mems_doc_locale where locale in ('ja','zh-CN','hi') order by locale").fetchall()
          if len(current)!=6 or any(enabled!=1 for _,enabled in current):
              raise SystemExit(f'current locales invalid {current}')
          if len(future)!=3 or any(enabled!=0 or fallback!='en' for _,enabled,fallback in future):
              raise SystemExit(f'future locale prototype invalid {future}')

          # Numeric data stays language-independent.
          opening=db.execute("select value_numeric,unit_code from mems_doc_value where entity_key='DEMO-N-THERMOSTAT-OPEN'").fetchone()
          torque=db.execute("select value_numeric,unit_code from mems_doc_value where entity_key='DEMO-N-THERMOSTAT-HOUSING-TORQUE'").fetchone()
          if opening!=(88.0,'°C'):
              raise SystemExit(f'thermostat opening mismatch {opening}')
          if torque!=(11.0,'Nm'):
              raise SystemExit(f'thermostat torque mismatch {torque}')
          torque_source=db.execute("select text_value from mems_doc_text where entity_key='DEMO-N-THERMOSTAT-HOUSING-TORQUE' and field_key='source_exact' and locale='fr'").fetchone()[0]
          if '11 N.m.' not in torque_source:
              raise SystemExit('11 N.m source proof missing')
          table_values=db.execute("select row_no,column_no,value_numeric,unit_code from mems_doc_table_cell where table_entity_key='DEMO-T-THERMOSTAT' and value_numeric is not null order by row_no,column_no").fetchall()
          if table_values!=[(1,1,88.0,'°C'),(2,1,11.0,'Nm')]:
              raise SystemExit(f'structured table mismatch {table_values}')

          if db.execute('pragma foreign_key_check').fetchall():
              raise SystemExit('foreign key violations')
          if db.execute('pragma integrity_check').fetchone()[0].lower()!='ok':
              raise SystemExit('SQLite integrity failed')

          print('PASS BUILD103 BASELINE', baseline)
          print('PASS FOUNDATION', after_foundation)
          print('PASS HISTORICAL TABLES UNCHANGED', historical_before)
          print('PASS IDEMPOTENT DEMO', first)
          print('PASS SOURCE EXACT + CLEAN DISPLAY')
          print('PASS ONE ORIGINAL VISUAL + TRANSLATABLE REGION LABEL')
          print('PASS FALLBACK FR EN DE->FR JA/ZH->EN')
          print('PASS STRUCTURED VALUES 88C AND 11Nm')
          print('PASS MULTILINGUAL RETRIEVAL DEMO V1')
          PY
