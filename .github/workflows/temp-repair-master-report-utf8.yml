name: TEMP REPAIR MASTER REPORT UTF8

on:
  push:
    branches: [RAPPORT]
    paths: [tools/temp_repair_master_report_utf8.py]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Repair and validate master report
        run: python tools/temp_repair_master_report_utf8.py
      - name: Commit repaired report and remove temporary repair tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/temp_repair_master_report_utf8.py .github/workflows/temp-repair-master-report-utf8.yml
          git config user.name github-actions-bot
          git config user.email github-actions@users.noreply.github.com
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          expected="$(printf '%s\n' '.github/workflows/temp-repair-master-report-utf8.yml' 'RAPPORT_SUIVI_ECU_MEMS_MANAGER.md' 'tools/temp_repair_master_report_utf8.py' | sort)"
          actual="$(git diff --cached --name-only | sort)"
          printf 'EXPECTED STAGED FILES:\n%s\n' "$expected"
          printf 'ACTUAL STAGED FILES:\n%s\n' "$actual"
          test "$actual" = "$expected"
          git commit -m "Repair master report UTF-8 and record ravemems"
          git push origin HEAD:RAPPORT
