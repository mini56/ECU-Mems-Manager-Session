name: Annuler l'ancien Setup Rover bloque
on:
  push:
    branches: [integration-rover-482-session-20261111]
    paths:
      - '.github/workflows/_cancel_stale_rover_43095532796.yml'
permissions:
  actions: write
  contents: read
jobs:
  cancel-old-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Supprimer la fiche du run 43095532796 bloque
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "repos/${{ github.repository }}/actions/runs/43095532796"
