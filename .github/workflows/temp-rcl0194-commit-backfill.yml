name: TEMP RCL0194 COMMIT VALIDATED 1750

on:
  push:
    branches: [tmp-rave-visual-backfill]
    paths:
      - .github/workflows/temp-rcl0194-commit-backfill.yml

permissions:
  contents: write

jobs:
  commit_and_postvalidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-rave-visual-backfill
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned PDF renderer
        run: python -m pip install PyMuPDF==1.26.4

      - name: Verify production remains exact BUILD 101
        shell: bash
        run: |
          set -euo pipefail
          PROD=$(git ls-remote origin refs/heads/MEMSX64 | awk '{print $1}')
          test "$PROD" = "22dbe75ed14e0a61e694159d505ef72245116b48"
          echo "PRODUCTION_BUILD_101_UNCHANGED=$PROD"

      - name: Download exact Rover RCL0194ENG source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output RCL0194ENG.pdf \
            'https://www.goclassic.eu/upload/content/e68ce7_9c0fd6a5b3a14a3585ecddb02b3ceb9d.pdf'
          echo '64e64f8a7c24f362913e2661403bc474e4e7ef07f96db618ef661645e0d0f051  RCL0194ENG.pdf' | sha256sum -c -

      - name: Regenerate exact validated candidate from BUILD 101 reference data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-rcl0194-1750
          python tools/build_rcl0194_visual_backfill_1750.py \
            --root . \
            --pdf RCL0194ENG.pdf \
            --work .tmp-rcl0194-1750 | tee /tmp/precommit_validation.txt

      - name: Require exact run3 hashes before commit
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/RCL0194_EXPECTED_SHA256 <<'EOF'
          200b2d7ec0ba24d93d7192fdf63f86845c53f49ad4a28cb997ede9d39fb5f51d  database/reference/research_enrichment_1750.qz64
          70600d103365c652b2925a35158ae0963b123364befb3d3e346c3ad1015cb248  database/reference/manifest.json
          128685b609550d3babf0e43bb7bc24886d0d5afa2e5c17c4715a5f85d312dcad  database/reference/audits/rcl0194_visual_backfill_1750_audit.md
          718af9c48d7cc466b5c50278680ecb286de81a869d8e2293207796afe08833d3  database/reference/images/rave/RCL0194ENG_COLOUR_CODES.png
          fa3a9f7620b660dc1405adf5bb330f74b9cf627e6ebc7bf2e3ac1b7a42016eeb  database/reference/images/rave/RCL0194ENG_15_1.png
          334eea87abb0b9b5692c18ef157f51aa4a2edcc1580dd3d911ba7c3262bb9052  database/reference/images/rave/RCL0194ENG_20_1.png
          3736908a793e46a5e3bee32d1d51544caf52557475317a2a5f96ca3d16177c9e  database/reference/images/rave/RCL0194ENG_20_2.png
          2988614881aa2d713788eac084c97ae148595bbb19da21fd92b484041ef3e4c8  database/reference/images/rave/RCL0194ENG_20_3.png
          7a04d84ee0296ab41333650f369aa3624f3ac7988a528584237a7b8fb021bea0  database/reference/images/rave/RCL0194ENG_20_4.png
          e3e4c30e318aca2f9aeeb6984840397ec0bc5432d3c15034e2e68e6b2c0a6d22  database/reference/images/rave/RCL0194ENG_39_2.png
          b8da82236a56034cd3afde692752ae6ccdef2bc792f5dacfe14392ffc0f00188  database/reference/images/rave/RCL0194ENG_39_3.png
          EOF
          sha256sum -c /tmp/RCL0194_EXPECTED_SHA256
          grep -F 'RCL0194_1750_PASS' /tmp/precommit_validation.txt
          grep -F 'rcl0194_direct_visual_coverage=55' /tmp/precommit_validation.txt
          grep -F 'color_legend_links=26' /tmp/precommit_validation.txt
          grep -F 'source_corrections=3' /tmp/precommit_validation.txt

      - name: Guard generated scope before staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-rcl0194-1750
          rm -f RCL0194ENG.pdf
          python - <<'PY'
          import subprocess
          allowed = (
              'database/reference/research_enrichment_1750.qz64',
              'database/reference/manifest.json',
              'database/reference/audits/rcl0194_visual_backfill_1750_audit.md',
              'database/reference/images/rave/',
          )
          bad=[]
          for line in subprocess.check_output(['git','status','--porcelain'], text=True).splitlines():
              path=line[3:].strip()
              if ' -> ' in path:
                  path=path.split(' -> ',1)[1]
              if not any(path == a or path.startswith(a) for a in allowed):
                  bad.append(path)
          if bad:
              raise SystemExit('Unexpected generated paths before staging: '+', '.join(bad))
          print('PRECOMMIT_SCOPE_GUARD_PASS')
          PY

      - name: Stage exact documentary lot and remove obsolete RCL0194 helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-rcl0194-commit-backfill.yml
          git rm -f .github/workflows/temp-rcl0194-visual-extract.yml
          git rm -f .github/workflows/temp-rcl0194-deterministic-1750-validate.yml
          git add database/reference/research_enrichment_1750.qz64
          git add database/reference/manifest.json
          git add database/reference/audits/rcl0194_visual_backfill_1750_audit.md
          git add database/reference/images/rave/
          git diff --cached --name-status
          python - <<'PY'
          import subprocess
          allowed_exact={
              'database/reference/research_enrichment_1750.qz64',
              'database/reference/manifest.json',
              'database/reference/audits/rcl0194_visual_backfill_1750_audit.md',
              '.github/workflows/temp-rcl0194-commit-backfill.yml',
              '.github/workflows/temp-rcl0194-visual-extract.yml',
              '.github/workflows/temp-rcl0194-deterministic-1750-validate.yml',
          }
          allowed_prefix='database/reference/images/rave/'
          staged=subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          bad=[p for p in staged if p not in allowed_exact and not p.startswith(allowed_prefix)]
          if bad:
              raise SystemExit('Unexpected staged paths: '+', '.join(bad))
          print('STAGED_SCOPE_GUARD_PASS')
          PY

      - name: Commit and push validated RCL0194 1750 lot
        id: push
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "Add deterministic RCL0194 visual backfill 1750"
          NEW_SHA=$(git rev-parse HEAD)
          echo "sha=$NEW_SHA" >> "$GITHUB_OUTPUT"
          git push origin HEAD:tmp-rave-visual-backfill
          echo "PUSHED_SHA=$NEW_SHA"

      - name: Re-read exact remote commit after push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin tmp-rave-visual-backfill
          REMOTE_SHA=$(git rev-parse origin/tmp-rave-visual-backfill)
          test "$REMOTE_SHA" = "${{ steps.push.outputs.sha }}"
          git reset --hard "$REMOTE_SHA"
          echo "REMOTE_COMMIT_CONFIRMED=$REMOTE_SHA"
          test ! -e .github/workflows/temp-rcl0194-commit-backfill.yml
          test ! -e .github/workflows/temp-rcl0194-visual-extract.yml
          test ! -e .github/workflows/temp-rcl0194-deterministic-1750-validate.yml
          test -e tools/build_rcl0194_visual_backfill_1750.py
          PROD=$(git ls-remote origin refs/heads/MEMSX64 | awk '{print $1}')
          test "$PROD" = "22dbe75ed14e0a61e694159d505ef72245116b48"

      - name: Validate bytes actually committed on remote
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c /tmp/RCL0194_EXPECTED_SHA256
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('database/reference/manifest.json').read_text(encoding='utf-8'))
          assert m['database_revision']==20
          assert 'research_enrichment_1750.qz64' in m['research_enrichment_batches']
          assets={k:v for k,v in m.get('visual_assets',{}).items() if k.startswith('rave:RCL0194ENG:')}
          assert len(assets)==8, len(assets)
          for v in assets.values():
              assert Path('database/reference',v['path']).is_file(), v['path']
          print('REMOTE_BYTES_AND_MANIFEST_PASS')
          PY

      - name: Reproduce 1750 from exact remote commit and require zero diff
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output RCL0194ENG.pdf \
            'https://www.goclassic.eu/upload/content/e68ce7_9c0fd6a5b3a14a3585ecddb02b3ceb9d.pdf'
          echo '64e64f8a7c24f362913e2661403bc474e4e7ef07f96db618ef661645e0d0f051  RCL0194ENG.pdf' | sha256sum -c -
          rm -rf .postpush-rcl0194-1750
          python tools/build_rcl0194_visual_backfill_1750.py \
            --root . \
            --pdf RCL0194ENG.pdf \
            --work .postpush-rcl0194-1750 | tee /tmp/postpush_validation.txt
          git diff --exit-code -- \
            database/reference/research_enrichment_1750.qz64 \
            database/reference/manifest.json \
            database/reference/audits/rcl0194_visual_backfill_1750_audit.md \
            database/reference/images/rave/
          grep -F 'RCL0194_1750_PASS' /tmp/postpush_validation.txt
          grep -F 'integrity=ok' /tmp/postpush_validation.txt
          grep -F 'rave_facts=93' /tmp/postpush_validation.txt
          grep -F 'expert_facts=105' /tmp/postpush_validation.txt
          grep -F 'rcl0194_direct_visual_coverage=55' /tmp/postpush_validation.txt
          grep -F 'color_legend_links=26' /tmp/postpush_validation.txt
          grep -F 'source_corrections=3' /tmp/postpush_validation.txt
          rm -rf .postpush-rcl0194-1750 RCL0194ENG.pdf
          test -z "$(git status --porcelain)"
          echo 'REMOTE_POSTPUSH_REPRODUCIBILITY_PASS'
