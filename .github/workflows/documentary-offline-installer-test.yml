name: DOCUMENTARY - installer local code source
on:
  push:
    branches: [rave-fr-source-sqlite-20261112]
    paths:
      - 'database/MemsDocumentaryLocalInstaller.cpp'
      - 'database/MemsDocumentaryLocalInstaller.h'
      - 'database/MemsDocumentaryUpdateDialog.cpp'
      - 'database/MemsDocumentaryUpdateDialog.h'
      - 'database/MemsDocumentaryPackCatalog.cpp'
      - 'database/MemsDocumentaryPackCatalog.h'
      - 'tools/test_documentary_offline_installer.cpp'
      - '.github/workflows/documentary-offline-installer-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-and-verify-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Installer Qt5 pour compiler les vrais fichiers source
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            g++ pkg-config qtbase5-dev libqt5sql5-sqlite
      - name: Compiler le code exact de l'installation et du dialogue
        shell: bash
        run: |
          set -euo pipefail
          for source in \
            database/MemsDocumentaryLocalInstaller.cpp \
            database/MemsDocumentaryUpdateDialog.cpp \
            database/MemsDocumentaryPackCatalog.cpp; do
            echo "SOURCE: $source"
            g++ -std=c++17 -Wall -Wextra -fPIC -fsyntax-only -I. \
              $(pkg-config --cflags Qt5Core Qt5Widgets Qt5Sql Qt5Network) "$source"
          done
          echo DOCUMENTARY_INSTALLER_SOURCES_COMPILE_PASS
      - name: Construire une source reellement structuree puis un fixture synthetique
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/rave-fr
          python3 tools/build_rave_fr_documentary.py \
            --reference-root database/reference \
            --output output/rave-fr/mems_documentary_fr.sqlite
          # Fausse page de test uniquement, aucun document constructeur
          # non valide n'est publie ou livre aux utilisateurs.
          python3 tools/test_documentary_fixture.py --source output/rave-fr
      - name: Tester un mot de passe et le refus des mauvais paquets
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -fPIC -I. \
            -DMEMS_DOCUMENTARY_INSTALL_SELFTEST=1 \
            tools/test_documentary_offline_installer.cpp \
            database/MemsDocumentaryLocalInstaller.cpp \
            database/MemsDocumentaryEncryptedPack.cpp \
            database/MemsDocumentaryPackCatalog.cpp \
            -o /tmp/documentary_offline_installer_test \
            $(pkg-config --cflags --libs Qt5Core Qt5Sql Qt5Network)
          /tmp/documentary_offline_installer_test output/rave-fr
