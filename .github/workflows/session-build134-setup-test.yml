name: SESSION 134 - correction Reglages et nom officiel
run-name: SESSION BUILD 134 - Reglages et nom officiel - ${{ github.sha }}
on:
  push:
    branches:
      - dev-complete-build117-14-pages-20261109
    paths:
      - '.github/workflows/session-build134-setup-test.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: session-build134-test
  cancel-in-progress: false

env:
  MEMS_BUILD_NUMBER: '134'
  ORT_GENAI_VERSION: '0.14.0'
  ORT_GENAI_WIN_X64_SHA256: '8a303e52dc7be8fb2a5331929af451a25ac59774102d7fd09ef673adc85c5ebf'
  BASE_RELEASE_TAG: 'mems-build117-candidate-39395038798'
  BASE_ARCHIVE_NAME: 'ECU-MEMS-Manager-x64-BUILD117-CLEAN-V2.tar.gz'
  BASE_ARCHIVE_SHA256: '4f187bae49bfc134329b53eb4e455c2d125403fe510f2da08a8272b2dcb3cd3b'

jobs:
  complete-setup:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Recuperer les sources exactes de COMPLETE
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Controler dispositions originales BUILD117 et limites de changements
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $nav=Get-Content navigationorderpatch.cpp -Raw
          $main=Get-Content main.cpp -Raw
          $ui=Get-Content uirebuild.cpp -Raw
          $settings=Get-Content settingstabdark.cpp -Raw
          if($nav -notmatch 'kFinalTabCount = 14' -or $nav -match 'temporarilyHiddenMenuRank'){throw 'FULL_MENU_MISSING'}
          if((git hash-object 'mainwindow.cpp').Trim() -ne 'c0f89a30f8a26c2e971e5c1a998e03b4bce50010'){throw 'BUILD117_LAYOUT_CHANGED: mainwindow.cpp'}
          if((git hash-object 'navigationorderpatch.cpp').Trim() -ne '799d5b0dc7be9a324dc32a37369746e72ad7d540'){throw 'BUILD117_LAYOUT_CHANGED: navigationorderpatch.cpp'}
          if((git hash-object 'navigationorderpatch.h').Trim() -ne 'da252d14b0ab000b78ba2684f61790f69eb56c30'){throw 'BUILD117_LAYOUT_CHANGED: navigationorderpatch.h'}
          if((git hash-object 'overviewrebuild.cpp').Trim() -ne 'e59e6b1ddd0f2d4f6c457672b91c7e8496a811a2'){throw 'BUILD117_LAYOUT_CHANGED: overviewrebuild.cpp'}
          if((git hash-object 'visualcompletion.cpp').Trim() -ne '56e7cc3842119328bb4ea078d6dc44884ce3e6d2'){throw 'BUILD117_LAYOUT_CHANGED: visualcompletion.cpp'}
          if((git hash-object 'dedicatedpagesrebuild.cpp').Trim() -ne '17d9364639c7a2a6891cd0364303e2cf625b8df0'){throw 'BUILD117_LAYOUT_CHANGED: dedicatedpagesrebuild.cpp'}
          if($main -notmatch 'window\.showMaximized\(\)' -or $main -match 'CompleteZoom|QT_SCALE_FACTOR|window\.setFixedSize\('){throw 'FORCED_GLOBAL_ZOOM'}
          if($ui -notmatch 'applyReadablePageFonts\(tabs\)' -or $ui -notmatch 'if \(i==10\) continue'){throw 'READABILITY_NOT_SCOPED'}
          if($settings -notmatch 'metricsHeight=qMax\(250,height-adjustHeight-22\)' -or $settings -notmatch 'center\*\.62'){throw 'SETTINGS_SIZING_NOT_ADAPTIVE'}
          $inj=Get-Content mappedinjection_runtime_part1.inc -Raw
          $act=Get-Content majorpagesrebuild.cpp -Raw
          $errors=Get-Content errorsvisualpatch.cpp -Raw
          if($main -notmatch 'markerColor = QStringLiteral\("#ff9828"\)' -or
             $main -notmatch '"  background: #ff9828;"'){throw 'SPLASH_ORANGE_MISSING'}
          if($inj -notmatch 'fullGaugeTitle' -or $inj -notmatch 'horizontalAdvance\(fullGaugeTitle\)'){throw 'INJECTION_TITLES_NOT_FITTED'}
          if($act -notmatch 'list->setMaximumWidth\(QWIDGETSIZE_MAX\)'){throw 'ACTUATOR_LIST_STILL_NARROW'}
          if($errors -notmatch 'QPushButton:disabled\{background:#090e13;color:#ff9828' -or
             $errors -notmatch 'horizontalAdvance\(button->text\(\)\)'){throw 'ERROR_CLEAR_BUTTONS_NOT_FIXED'}
          if($settings -notmatch 'button->setMinimumHeight\(36\)'){throw 'SETTINGS_BUTTONS_TOO_SHORT'}
          $dark=Get-Content darkstyle.cpp -Raw
          if($dark -notmatch 'm_clearFaultsButton' -or
             $dark -notmatch 'm_clearRecordedAnomalies'){throw 'ERROR_CLEAR_BUTTONS_STYLE_OVERWRITTEN'}
          $late=Get-Content settingsvisualpatch.cpp -Raw
          $cmake=Get-Content CMakeLists.txt -Raw
          $mainWindow=Get-Content mainwindow.cpp -Raw
          $chrome=Get-Content uirebuild.cpp -Raw
          $shortcutSource=Get-Content desktopshortcut.cpp -Raw
          if($late -match 'button->setMinimumHeight\(21\)' -or
             $late -match 'button->setMaximumHeight\(22\)' -or
             $late -match 'qBound\(370,qMin\(centerByWidth,centerByHeight\),400\)' -or
             $late -match 'qBound\(138,qRound\(height\*\.23\),154\)'){
              throw 'SETTINGS_LATE_PATCH_REVERTS_DIMENSIONS'
          }
          if($late -notmatch 'button->setMinimumHeight\(36\)' -or
             $late -notmatch 'center\*\.62' -or
             $late -notmatch 'metricsHeight-20'){
              throw 'SETTINGS_LATE_PATCH_INCONSISTENT'
          }
          if($cmake -notmatch 'APP_NAME="ECU MEMS Manager SESSION"' -or
             $mainWindow -notmatch 'QStringLiteral\(APP_NAME\)' -or
             $main -notmatch 'setApplicationDisplayName\(QStringLiteral\("ECU MEMS Manager SESSION"\)\)' -or
             $chrome -notmatch 'MANAGER SESSION' -or
             $shortcutSource -notmatch 'ECU MEMS Manager SESSION.lnk'){
              throw 'OFFICIAL_SESSION_NAME_MISSING'
          }
          if($cmake -notmatch 'set\(PROJECTNAME "ECU_Mems_Manager"\)' -or
             $main -notmatch 'setApplicationName\("ECU Mems Manager"\)'){
              throw 'INTERNAL_DATA_ID_CHANGED'
          }
          Write-Host 'COMPLETE_134_BUILD117_LAYOUT_TEXT_ONLY_PASS'
      - name: Controle anti-pixellisation du splash haute definition
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $splash=Get-Content main.cpp -Raw
          $style=Get-Content splashtextfix.cpp -Raw
          if($splash -notmatch 'screen->devicePixelRatio\(\)' -or
             $splash -notmatch 'pixmap\.setDevicePixelRatio\(deviceScale\)' -or
             $splash -notmatch 'qRound\(splashWidth \* deviceScale\)' -or
             $splash -notmatch 'QPainter::TextAntialiasing'){
            throw 'SPLASH_HIGH_DPI_RENDER_GUARD_FAILED'
          }
          if($style -match 'progress->setStyleSheet\('){
            throw 'SPLASH_PROGRESS_STYLESHEET_RESET_REGRESSION'
          }
          Write-Host 'COMPLETE_134_SPLASH_HIGH_DPI_GUARD_PASS'
      - name: Preparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer Qt 5.15.2 MSVC x64 et outils de validation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0" pefile
          if($LASTEXITCODE -ne 0){throw 'pip install failed'}
          $sevenZip=(Get-Command 7z.exe -ErrorAction Stop).Source
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtcharts -O C:\Qt --external "$sevenZip"
          if($LASTEXITCODE -ne 0){throw 'Qt install failed'}
      - name: Recuperer les fichiers ONNX pour compilation de IA reelle
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $archive=Join-Path $env:RUNNER_TEMP "onnxruntime-genai-$env:ORT_GENAI_VERSION-win-x64.zip"
          $folder=Join-Path $env:RUNNER_TEMP 'onnx-genai'
          curl.exe -L --fail --retry 3 --retry-all-errors --retry-delay 2 -o $archive "https://github.com/microsoft/onnxruntime-genai/releases/download/v$env:ORT_GENAI_VERSION/onnxruntime-genai-$env:ORT_GENAI_VERSION-win-x64.zip"
          if($LASTEXITCODE -ne 0){throw 'ONNX download failed'}
          if((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:ORT_GENAI_WIN_X64_SHA256){throw 'ONNX archive SHA256 mismatch'}
          Expand-Archive $archive $folder -Force
          $header=Get-ChildItem $folder -Recurse -File -Filter ort_genai_c.h | Select-Object -First 1
          $lib=Get-ChildItem $folder -Recurse -File -Filter onnxruntime-genai.lib | Select-Object -First 1
          if(-not $header -or -not $lib){throw 'ONNX import files missing'}
          "ORT_GENAI_INCLUDE_DIR=$($header.Directory.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ORT_GENAI_LIBRARY=$($lib.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'COMPLETE_ONNX_SOURCE_VERIFIED'
      - name: Compiler le programme avec IA ONNX active et protocoles ROSCO
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake -S . -B build-complete-134 -A x64 `
            -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/msvc2019_64" `
            -DMEMS_USE_BUNDLED_LIBROSCO_X64=ON `
            -DMEMS_RUN_REFERENCE_SELFTEST_POST_BUILD=OFF `
            -DMEMS_USE_ONNX_GENAI=ON `
            "-DORT_GENAI_INCLUDE_DIR=$env:ORT_GENAI_INCLUDE_DIR" `
            "-DORT_GENAI_LIBRARY=$env:ORT_GENAI_LIBRARY"
          if($LASTEXITCODE -ne 0){throw 'CMake configuration failed'}
          cmake --build build-complete-134 --config Release --target ecu_mems_manager ecu_mems_uninstaller --parallel
          if($LASTEXITCODE -ne 0){throw 'COMPLETE source compilation failed'}
          if(-not(Test-Path 'build-complete-134\Release\ecu_mems_manager.exe')){throw 'COMPLETE exe missing'}
          if(-not(Test-Path 'build-complete-134\librosco-x64\Release\mems_manager_x64.dll')){throw 'ROSCO dll missing'}
          Write-Host 'COMPLETE_BUILD134_SOURCE_AND_ONNX_COMPILE_PASS'
      - name: Recuperer la distribution 117 complete deja validee
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $meta=gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:BASE_RELEASE_TAG" | ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw 'BASE_RELEASE_UNAVAILABLE'}
          $asset=$meta.assets | Where-Object {$_.name -eq $env:BASE_ARCHIVE_NAME} | Select-Object -First 1
          if(-not $asset -or $asset.digest -ne "sha256:$env:BASE_ARCHIVE_SHA256"){throw 'BASE_ARCHIVE_DIGEST_MISMATCH'}
          New-Item -ItemType Directory -Force base-117,download-117 | Out-Null
          gh release download $env:BASE_RELEASE_TAG --pattern $env:BASE_ARCHIVE_NAME --dir download-117
          if($LASTEXITCODE -ne 0){throw 'BASE_ARCHIVE_DOWNLOAD_FAILED'}
          $archive=Join-Path download-117 $env:BASE_ARCHIVE_NAME
          if((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:BASE_ARCHIVE_SHA256){throw 'BASE_DOWNLOAD_HASH_MISMATCH'}
          tar.exe -xzf $archive -C base-117
          if($LASTEXITCODE -ne 0){throw 'BASE_ARCHIVE_EXTRACT_FAILED'}
          if(-not(Test-Path base-117\ecu_mems_manager.exe)){throw 'BASE_STRUCTURE_UNEXPECTED'}
          Write-Host 'COMPLETE_VALIDATED_REFERENCE_RUNTIME_PRESERVED'
      - name: Construire le dossier de distribution COMPLETE 134
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(Test-Path dist-complete-134){Remove-Item dist-complete-134 -Recurse -Force}
          Copy-Item base-117 dist-complete-134 -Recurse -Force
          $dist=(Resolve-Path dist-complete-134).Path
          # Nouvelle compilation COMPLETE, IA ONNX active et ROSCO x64 :
          Copy-Item build-complete-134\Release\ecu_mems_manager.exe "$dist\ecu_mems_manager.exe" -Force
          Copy-Item build-complete-134\Release\ecu_mems_uninstaller.exe "$dist\ecu_mems_uninstaller.exe" -Force
          Copy-Item build-complete-134\librosco-x64\Release\mems_manager_x64.dll "$dist\mems_manager_x64.dll" -Force
          # Le runtime IA, ses modeles, SQLite documentaire et Pack001 restent identiques au BUILD117.
          # La base personnelle n'est JAMAIS incluse dans le Setup.
          foreach($suffix in @('','-wal','-shm','-journal')){
            $db=Join-Path $dist ('database\ecu_mems_manager.sqlite'+$suffix)
            if(Test-Path $db){Remove-Item $db -Force}
          }
          $qt='C:\Qt\5.15.2\msvc2019_64'
          & "$qt\bin\windeployqt.exe" --release --compiler-runtime --no-translations --dir $dist "$dist\ecu_mems_manager.exe"
          if($LASTEXITCODE -ne 0){throw 'windeployqt COMPLETE failed'}
          & "$qt\bin\windeployqt.exe" --release --compiler-runtime --no-translations --dir $dist "$dist\ecu_mems_uninstaller.exe"
          if($LASTEXITCODE -ne 0){throw 'windeployqt uninstaller failed'}
          $needed=@('ecu_mems_manager.exe','mems_manager_x64.dll','MEMSLibrary.dll','MEMSLibrary_Pack_001\knowledge.sqlite','database\reference\runtime_visual_catalog.json')
          foreach($n in $needed){if(-not(Test-Path (Join-Path $dist $n))){throw "MISSING_COMPLETE_RUNTIME $n"}}
          if(Test-Path "$dist\database\ecu_mems_manager.sqlite"){throw 'USER_DATABASE_MUST_NOT_SHIP'}
          $onnx=Get-ChildItem $dist -Recurse -File -Filter onnxruntime-genai.dll | Select-Object -First 1
          if(-not $onnx){throw 'IA_ONNX_RUNTIME_MISSING'}
          "DIST_COMPLETE=$dist" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'COMPLETE_134_RUNTIME_AND_SQLITE_PRESERVATION_PASS'
      - name: Tester architecture x64 et ressources RAVE / IA
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:DIST_ROOT=$env:DIST_COMPLETE
          @'
          import os, pefile, json, sqlite3
          from pathlib import Path
          r=Path(os.environ['DIST_ROOT'])
          for n in ('ecu_mems_manager.exe','mems_manager_x64.dll','MEMSLibrary.dll'):
              p=r/n
              pe=pefile.PE(str(p),fast_load=True)
              assert pe.FILE_HEADER.Machine==0x8664, n
              pe.close()
          db=r/'MEMSLibrary_Pack_001'/'knowledge.sqlite'
          conn=sqlite3.connect(db)
          assert conn.execute('pragma integrity_check').fetchone()[0]=='ok'
          assert not conn.execute('pragma foreign_key_check').fetchall()
          assert conn.execute('select count(*) from ravemems_document').fetchone()[0]==47
          assert conn.execute('select count(*) from ravemems_page').fetchone()[0]==1359
          conn.close()
          catalog=json.loads((r/'database'/'reference'/'runtime_visual_catalog.json').read_text(encoding='utf-8'))
          assert catalog['source_lineage']=='RAVEMEMS_V2_FINAL_33810202288'
          assert catalog['entry_count']==1667
          assert not (r/'database'/'ecu_mems_manager.sqlite').exists()
          print('COMPLETE_134_X64_IA_RAVE_SQLITE_PACKAGE_PASS')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'PACKAGE_INTEGRITY_FAILED'}
      - name: Creer le Setup distinct de LIGHT, sans suppression des donnees
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          choco install innosetup -y --no-progress --limit-output
          if($LASTEXITCODE -ne 0){throw 'INNO_INSTALL_FAILED'}
          $compiler=Get-ChildItem "${env:ProgramFiles(x86)}" -Recurse -File -Filter ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $compiler){throw 'ISCC_NOT_FOUND'}
          $iss=@'
          #define MyAppName "ECU MEMS Manager SESSION"
          #define MyAppVersion "1.1.34"
          [Setup]
          AppId={{BC7FAF73-5BCF-49FC-8513-9D9C7B08F133}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher=ECU MEMS Manager SESSION
          DefaultDirName={autopf}\ECU MEMS Manager SESSION
          DefaultGroupName=ECU MEMS Manager SESSION
          UsePreviousGroup=no
          OutputDir=setup-output-134
          OutputBaseFilename=ECU-MEMS-Manager-SESSION-Setup-v1.1.34-TEST
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          PrivilegesRequired=admin
          UninstallDisplayIcon={app}\ecu_mems_manager.exe
          [Languages]
          Name: "french"; MessagesFile: "compiler:Languages\French.isl"
          [Files]
          Source: "dist-complete-134\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [InstallDelete]
          Type: files; Name: "{autodesktop}\ECU MEMS Manager COMPLETE.lnk"
          Type: files; Name: "{commonprograms}\ECU MEMS Manager COMPLETE\ECU MEMS Manager COMPLETE.lnk"
          [Icons]
          Name: "{group}\ECU MEMS Manager SESSION"; Filename: "{app}\ecu_mems_manager.exe"
          Name: "{autodesktop}\ECU MEMS Manager SESSION"; Filename: "{app}\ecu_mems_manager.exe"; IconFilename: "{app}\ecu_mems_manager.exe"
          [Run]
          Filename: "{app}\ecu_mems_manager.exe"; Description: "Demarrer ECU MEMS Manager SESSION"; Flags: nowait postinstall skipifsilent
          '@
          $iss | Set-Content complete-134.iss -Encoding UTF8
          & $compiler.FullName complete-134.iss
          if($LASTEXITCODE -ne 0){throw 'INNO_BUILD_FAILED'}
          $exe=Get-ChildItem setup-output-134 -File -Filter '*.exe' | Select-Object -First 1
          if(-not $exe -or $exe.Length -lt 100MB){throw 'INNO_SETUP_INCOMPLETE'}
          Write-Host "COMPLETE_134_SETUP_BUILT size=$($exe.Length) sha256=$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash)"
      - name: Tester une vraie installation Windows et les fichiers installes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $setup=Get-ChildItem setup-output-134 -File -Filter '*.exe' | Select-Object -First 1
          $folder=Join-Path $env:RUNNER_TEMP 'MEMS_COMPLETE_134_INSTALL'
          if(Test-Path $folder){Remove-Item $folder -Recurse -Force}
          $proc=Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$folder" -Wait -PassThru
          if($proc.ExitCode -ne 0){throw "INNO_INSTALL_EXIT $($proc.ExitCode)"}
          foreach($relative in @('ecu_mems_manager.exe','MEMSLibrary.dll','mems_manager_x64.dll','MEMSLibrary_Pack_001\knowledge.sqlite','database\reference\runtime_visual_catalog.json')){
            if(-not(Test-Path (Join-Path $folder $relative))){throw "ACTUAL_INSTALL_MISSING $relative"}
          }
          if(Test-Path (Join-Path $folder 'database\ecu_mems_manager.sqlite')){throw 'PERSONAL_DATABASE_SHIPPED'}
          $shortcut=Join-Path $env:PUBLIC 'Desktop\ECU MEMS Manager SESSION.lnk'
          if(-not(Test-Path $shortcut)){throw 'COMPLETE_DESKTOP_SHORTCUT_MISSING'}
          $link=(New-Object -ComObject WScript.Shell).CreateShortcut([string]$shortcut)
          if($link.TargetPath -ne (Join-Path $folder 'ecu_mems_manager.exe')){throw 'SESSION_SHORTCUT_WRONG_TARGET'}
          if((Get-Content CMakeLists.txt -Raw) -notmatch 'APP_NAME="ECU MEMS Manager SESSION"'){throw 'SESSION_PRODUCT_NAME_NOT_COMPILED'}
          Write-Host 'COMPLETE_134_ACTUAL_WINDOWS_INSTALL_AND_SHORTCUT_PASS'
      - name: Verifier demarrage du programme installe sous Windows
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $folder=Join-Path $env:RUNNER_TEMP 'MEMS_COMPLETE_134_INSTALL'
          $exe=Join-Path $folder 'ecu_mems_manager.exe'
          if(-not(Test-Path $exe)){throw 'INSTALLED_EXE_MISSING'}
          $app=Start-Process -FilePath $exe -WorkingDirectory $folder -PassThru
          Start-Sleep -Seconds 8
          $app.Refresh()
          if($app.HasExited){throw "INSTALLED_APP_EXITED_AT_STARTUP code=$($app.ExitCode)"}
          $null=$app.CloseMainWindow()
          if(-not $app.WaitForExit(5000)){Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue}
          Write-Host 'COMPLETE_134_INSTALLED_GUI_STARTUP_PASS'
      - name: Conserver le Setup valide comme artefact telechargeable
        uses: actions/upload-artifact@v4
        with:
          name: ECU-MEMS-Manager-SESSION-134-Setup-TEST
          path: setup-output-134/ECU-MEMS-Manager-SESSION-Setup-v1.1.34-TEST.exe
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Publier uniquement le Setup verifie dans une prerelease privee
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag="mems-session-134-test-$env:GITHUB_RUN_ID"
          $setup=Get-ChildItem setup-output-134 -File -Filter '*.exe' | Select-Object -First 1
          if(-not $setup){throw 'NO_SETUP_TO_PUBLISH'}
          gh release create $tag --title "ECU MEMS Manager SESSION 134 - Reglages et nom officiel (TEST)" --target "$env:GITHUB_SHA" --prerelease --notes "Version SESSION Windows x64, 14 pages et IA ONNX active. Seule la page Reglages est corrigee visuellement. Le correctif empeche un traitement tardif de reduire les cadrans et les boutons. Le nom officiel SESSION est retabli. Identifiants techniques et donnees conserves. Aucun zoom global ni changement de resolution Windows. Splash titre et sous-titre rendus en haute resolution native. Setup de test pour validation visuelle sur PC utilisateur. Dossier distinct de LIGHT. Mise a jour de 133 en place grace au meme AppId. Base de donnees personnelle non embarquee."
          if($LASTEXITCODE -ne 0){
            Write-Warning 'RELEASE_PUBLICATION_DENIED: setup still available as a validated GitHub Actions artifact.'
            exit 0
          }
          gh release upload $tag $setup.FullName
          if($LASTEXITCODE -ne 0){
            Write-Warning 'RELEASE_UPLOAD_DENIED: setup still available as a validated GitHub Actions artifact.'
            exit 0
          }
          $digest=(Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "COMPLETE_134_SETUP_PUBLISHED tag=$tag file=$($setup.Name) sha256=$digest"
