name: IA MEMS local model smoke test

on:
  workflow_dispatch:
  push:
    branches: ["lab-expert-engine"]
    paths:
      - "ai/runtime_manifest.json"
      - ".github/workflows/ia-mems-local-model.yml"

permissions:
  contents: write

jobs:
  local-ai-windows:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Download, verify and exercise the real local model
        id: localai
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          try {
            $runtimeUrl = "https://github.com/ggml-org/llama.cpp/releases/download/b10516/llama-b10516-bin-win-cpu-x64.zip"
            $runtimeSha = "fbbbc55e0eb2e1b07f9dcb9488616c98ed47d9003b90e15e7c8c7812c4307cd3"
            $modelUrl = "https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf?download=true"
            $modelSha = "9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031"

            Remove-Item -Recurse -Force ai-runtime-download, ai/models -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force ai-runtime-download, ai/models | Out-Null

            curl.exe -L --fail --retry 4 --retry-delay 3 -o llama-runtime.zip $runtimeUrl
            if ($LASTEXITCODE -ne 0) { throw "llama.cpp runtime download failed" }
            $actualRuntimeSha = (Get-FileHash llama-runtime.zip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualRuntimeSha -ne $runtimeSha) { throw "llama.cpp SHA256 mismatch: $actualRuntimeSha" }
            Expand-Archive -Path llama-runtime.zip -DestinationPath ai-runtime-download -Force

            $server = Get-ChildItem ai-runtime-download -Recurse -Filter llama-server.exe | Select-Object -First 1
            if (-not $server) { throw "llama-server.exe not found in official archive" }
            Copy-Item -Path (Join-Path $server.Directory.FullName "*") -Destination ai -Recurse -Force

            curl.exe -L --fail --retry 4 --retry-delay 3 -o ai/models/ia-mems.gguf $modelUrl
            if ($LASTEXITCODE -ne 0) { throw "Qwen model download failed" }
            $actualModelSha = (Get-FileHash ai/models/ia-mems.gguf -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualModelSha -ne $modelSha) { throw "Qwen model SHA256 mismatch: $actualModelSha" }

            $serverPath = (Resolve-Path ai/llama-server.exe).Path
            $modelPath = (Resolve-Path ai/models/ia-mems.gguf).Path
            $arguments = @("-m", $modelPath, "--host", "127.0.0.1", "--port", "18089", "-c", "4096", "-np", "1")
            $process = Start-Process -FilePath $serverPath -ArgumentList $arguments -PassThru -WindowStyle Hidden
            $process.Id | Set-Content ai-local-server.pid

            $ready = $false
            for ($i = 0; $i -lt 180; $i++) {
              Start-Sleep -Milliseconds 750
              try {
                $health = Invoke-RestMethod -Method Get -Uri "http://127.0.0.1:18089/health" -TimeoutSec 3
                if ($health.status -eq "ok") { $ready = $true; break }
              } catch {
                if ($process.HasExited) { throw "llama-server exited during model load" }
              }
            }
            if (-not $ready) { throw "local model did not become ready" }

            $system = "Tu es IA MEMS, assistant courtois intégré à ECU MEMS Manager. Réponds en français. N'invente aucun fait technique. /no_think"
            $helloPayload = @{
              model = "ia-mems"
              stream = $false
              temperature = 0.7
              top_p = 0.8
              max_tokens = 160
              messages = @(
                @{ role = "system"; content = $system },
                @{ role = "user"; content = "Bonjour /no_think" }
              )
            } | ConvertTo-Json -Depth 8
            $hello = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:18089/v1/chat/completions" -ContentType "application/json" -Body $helloPayload -TimeoutSec 120
            $helloText = [string]$hello.choices[0].message.content
            if ([string]::IsNullOrWhiteSpace($helloText)) { throw "empty greeting response" }

            $analysisContext = "CONTEXTE FIABLE FOURNI PAR MEMS MANAGER : L'onglet Analyse sert à étudier des journaux de diagnostic enregistrés. Il peut lire les fichiers CSV/TXT pris en charge, laisser choisir les canaux de mesure et afficher ou superposer leurs courbes pour observer l'évolution des valeurs dans le temps."
            $analysisPayload = @{
              model = "ia-mems"
              stream = $false
              temperature = 0.7
              top_p = 0.8
              max_tokens = 220
              messages = @(
                @{ role = "system"; content = $system },
                @{ role = "user"; content = "C'est quoi l'onglet Analyse ? /no_think`n`n$analysisContext`nUtilise uniquement ce contexte pour expliquer la fonction." }
              )
            } | ConvertTo-Json -Depth 8
            $analysis = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:18089/v1/chat/completions" -ContentType "application/json" -Body $analysisPayload -TimeoutSec 120
            $analysisText = [string]$analysis.choices[0].message.content
            if ([string]::IsNullOrWhiteSpace($analysisText)) { throw "empty Analysis-tab response" }

            @"
            IA MEMS real local model smoke test: OK
            source_commit=${{ github.sha }}
            run=${{ github.run_id }}
            runtime=llama.cpp b10516 Windows x64 CPU
            model=Qwen3-0.6B-Q8_0

            GREETING:
            $helloText

            ANALYSIS TAB:
            $analysisText
            "@ | Set-Content -Encoding UTF8 ai/LOCAL_AI_SMOKETEST_OK.txt
            Remove-Item ai/LOCAL_AI_SMOKETEST_FAILED.txt -ErrorAction SilentlyContinue

            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }
          catch {
            $message = $_.Exception.Message
            @"
            IA MEMS real local model smoke test: FAILED
            source_commit=${{ github.sha }}
            run=${{ github.run_id }}
            error=$message
            "@ | Set-Content -Encoding UTF8 ai/LOCAL_AI_SMOKETEST_FAILED.txt
            if (Test-Path ai-local-server.pid) {
              $pidValue = Get-Content ai-local-server.pid -ErrorAction SilentlyContinue
              if ($pidValue) { Stop-Process -Id ([int]$pidValue) -Force -ErrorAction SilentlyContinue }
            }
            Write-Error $message
            exit 1
          }

      - name: Upload validated local AI runtime
        if: steps.localai.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ia-mems-local-runtime-qwen3-0.6b
          path: |
            ai/*.exe
            ai/*.dll
            ai/models/ia-mems.gguf
            ai/runtime_manifest.json
            ai/README.md
            ai/LOCAL_AI_SMOKETEST_OK.txt
          compression-level: 0
          retention-days: 7

      - name: Record local AI smoke-test result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin lab-expert-engine
          git rebase origin/lab-expert-engine
          git add -f -- ai/LOCAL_AI_SMOKETEST_OK.txt ai/LOCAL_AI_SMOKETEST_FAILED.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Record IA MEMS real local model smoke test [skip ci]"
            git push origin HEAD:lab-expert-engine
          fi

      - name: Fail if the real local model did not answer
        if: steps.localai.outcome != 'success'
        shell: bash
        run: exit 1
