name: TEMP fix IA scroll history

on:
  push:
    branches: [tmp-ravemems-ia-visual-integration]
    paths:
      - '.github/workflows/tmp-fix-ia-scroll-history.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-ravemems-ia-visual-integration
          fetch-depth: 0
      - name: Verify protected production and expected test base
        shell: bash
        run: |
          git fetch origin MEMSX64 tmp-ravemems-ia-visual-integration
          test "$(git rev-parse origin/MEMSX64)" = "1d6316bd1746d6f2b4cfb751cab88d18e27ef730"
          test "$(git rev-parse HEAD^)" = "a7fd59f41a162cd6f1c9120122fd7426a83231be"
      - name: Apply exact transcript scroll correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('iamemstab.cpp')
          text = path.read_text(encoding='utf-8')
          old = '''    const QString safeSpeaker = speaker.toHtmlEscaped();
              QString safeText = text.toHtmlEscaped();
              safeText.replace(QLatin1Char('\\n'), QStringLiteral("<br>"));
              m_transcript->append(QStringLiteral("<p><b>%1</b><br>%2</p>").arg(safeSpeaker, safeText));

              if (QScrollBar *bar = m_transcript->verticalScrollBar())
                  bar->setValue(bar->maximum());'''.replace('              ', '    ')
          new = '''    const QString safeSpeaker = speaker.toHtmlEscaped();
              QString safeText = text.toHtmlEscaped();
              safeText.replace(QLatin1Char('\\n'), QStringLiteral("<br>"));

              const QString messageAnchor = QStringLiteral("ia-message-%1")
                                                .arg(m_transcript->document()->characterCount());
              m_transcript->append(QStringLiteral("<a name=\"%1\"></a><p><b>%2</b><br>%3</p>")
                                       .arg(messageAnchor, safeSpeaker, safeText));

              if (QScrollBar *bar = m_transcript->verticalScrollBar()) {
                  if (speaker == QStringLiteral("IA MEMS"))
                      m_transcript->scrollToAnchor(messageAnchor);
                  else
                      bar->setValue(bar->maximum());
              }'''.replace('              ', '    ')
          if text.count(old) != 1:
              raise SystemExit(f'Expected appendMessage block exactly once, got {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          grep -F 'm_transcript->scrollToAnchor(messageAnchor);' iamemstab.cpp
          grep -F 'm_transcript->setVerticalScrollBarPolicy(Qt::ScrollBarAlwaysOn);' iamemstab.cpp
      - name: Commit code only and remove helper
        shell: bash
        run: |
          git rm .github/workflows/tmp-fix-ia-scroll-history.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iamemstab.cpp
          git commit -m 'Fix IA transcript scroll and history navigation'
          test "$(git diff --name-only a7fd59f41a162cd6f1c9120122fd7426a83231be..HEAD)" = "iamemstab.cpp"
          git push origin HEAD:tmp-ravemems-ia-visual-integration
