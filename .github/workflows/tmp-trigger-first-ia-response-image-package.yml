name: TEMP trigger first IA response image package
on:
  push:
    paths:
      - '.github/workflows/tmp-trigger-first-ia-response-image-package.yml'
jobs:
  trigger:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-ravemems-ia-visual-integration
          fetch-depth: 0
      - name: Verify package guard and trigger
        shell: bash
        run: |
          set -euo pipefail
          wf=.github/workflows/tmp-ravemems-visual-test-package-x64.yml
          for f in expert/IaMemsDiagramCatalog.cpp expert/IaMemsDiagramSelfTest.cpp expert/IaMemsService.cpp iamemstab.cpp; do
            grep -Fq "$f" "$wf" || { echo "guard missing $f"; exit 1; }
          done
          marker='# trigger 2026-09-02 first IA response-image correction a30267584c0951e99b88f83670452a3c9d5087d7'
          grep -Fq "$marker" "$wf" || printf '\n%s\n' "$marker" >> "$wf"
          git diff --check
      - name: Commit trigger and remove temporary workflow
        shell: bash
        run: |
          git config user.name "mini56"
          git config user.email "48644212+mini56@users.noreply.github.com"
          git add .github/workflows/tmp-ravemems-visual-test-package-x64.yml
          git rm .github/workflows/tmp-trigger-first-ia-response-image-package.yml
          git commit -m "Trigger first IA response image x64 package"
          git push origin tmp-ravemems-ia-visual-integration
