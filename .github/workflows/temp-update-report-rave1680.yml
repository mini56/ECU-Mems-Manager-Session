name: TEMP UPDATE REPORT RAVE1680

on:
  push:
    branches: [RAPPORT]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update_report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RAPPORT
        uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0

      - name: Update continuity report after real RAVE 1680 tests
        shell: bash
        env:
          RULE_B64: 
          SECTION_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path('RAPPORT_SUIVI_ECU_MEMS_MANAGER.md')
          text = path.read_text(encoding='utf-8')
          rule = base64.b64decode(os.environ['RULE_B64']).decode('utf-8')
          section = base64.b64decode(os.environ['SECTION_B64']).decode('utf-8')
          anchor = '> **SUIVI IMMÉDIAT** : avant chaque nouvelle étape, inscrire ici l’étape et son objectif ; après chaque résultat, l’inscrire avant la suite. **Toute modification, validation, échec, test réel et décision doit être ajouté au rapport au fur et à mesure afin de conserver l’historique complet entre les discussions.**\n>\n'
          if rule not in text:
              if anchor not in text:
                  raise SystemExit('SUIVI IMMÉDIAT anchor not found')
              text = text.replace(anchor, anchor + rule, 1)
          marker = '# PILOTE ILLUSTRATIONS RAVE 1680 — TESTS RÉELS — 29 AOÛT 2026'
          if marker not in text:
              text = text.rstrip() + section + '\n'
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit report and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-update-report-rave1680.yml
          git add -- RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git commit -m "Report RAVE 1680 real-test progression"
          git push origin RAPPORT
