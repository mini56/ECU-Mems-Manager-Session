name: TMP one-shot documentary grounding anchor fix

on:
  push:
    branches:
      - tmp-build108-memslibrary-relevance-integration
    paths:
      - .github/workflows/tmp-fix-documentary-anchor.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-build108-memslibrary-relevance-integration
          fetch-depth: 0

      - name: Patch source
        run: |
          set -euo pipefail
          python tools/tmp_fix_documentary_anchor.py
          git diff --check

      - name: Commit correction
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add expert/LocalAiClient.cpp
          git commit -m "Strengthen documentary evidence anchor"
          git push origin HEAD:tmp-build108-memslibrary-relevance-integration

      - name: Dispatch fresh validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run tmp-build108-memslibrary-relevance-integration.yml --repo "$GITHUB_REPOSITORY" --ref tmp-build108-memslibrary-relevance-integration
