name: TMP IA documentary generation mode alignment

on:
  push:
    branches:
      - tmp-ia-architecture-prep

permissions:
  contents: write

jobs:
  align-documentary-generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Give grounded documentary answers the long generation budget without diagnostic instructions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('expert/LocalAiClient.cpp')
          text=p.read_text(encoding='utf-8')
          old='''    const bool reasoning = requiresReasoning(trimmedQuestion, grounding);'''
          new='''    const bool reasoning = forcedGrounded || requiresReasoning(trimmedQuestion, grounding);'''
          if old not in text:
              raise SystemExit('reasoning assignment not found')
          text=text.replace(old,new,1)
          old='''    if (reasoning) {\n        userContent += QStringLiteral(\n            "\\n\\nRéponse attendue : diagnostic bref, hypothèses les plus probables dans l'ordre, puis contrôles prioritaires. Ne montre aucun raisonnement interne.");\n    }'''
          new='''    if (reasoning && !forcedGrounded) {\n        userContent += QStringLiteral(\n            "\\n\\nRéponse attendue : diagnostic bref, hypothèses les plus probables dans l'ordre, puis contrôles prioritaires. Ne montre aucun raisonnement interne.");\n    }'''
          if old not in text:
              raise SystemExit('diagnostic instruction block not found')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
          git config user.name mini56
          git config user.email 48644212+mini56@users.noreply.github.com
          git add expert/LocalAiClient.cpp
          git rm .github/workflows/tmp-ia-documentary-mode-alignment.yml
          git commit -m "Use long generation budget for grounded documentary answers"
          git push origin HEAD:tmp-ia-architecture-prep
