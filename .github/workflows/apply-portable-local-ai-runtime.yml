name: Apply portable local AI runtime packaging

on:
  push:
    branches: ["lab-expert-engine"]
    paths:
      - ".github/workflows/apply-portable-local-ai-runtime.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch IA MEMS final package workflow
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/ia-mems-final-package.yml')
          text = path.read_text(encoding='utf-8')

          old = '''          $server = Get-ChildItem ai-runtime-download -Recurse -Filter llama-server.exe | Select-Object -First 1\n          if (-not $server) { throw "llama-server.exe missing" }\n          Copy-Item -Path (Join-Path $server.Directory.FullName "*") -Destination ai -Recurse -Force\n\n          curl.exe -L --fail --retry 4 --retry-delay 3 -o ai/models/ia-mems.gguf $modelUrl\n'''
          new = '''          $server = Get-ChildItem ai-runtime-download -Recurse -Filter llama-server.exe | Select-Object -First 1\n          if (-not $server) { throw "llama-server.exe missing" }\n          Copy-Item -Path (Join-Path $server.Directory.FullName "*") -Destination ai -Recurse -Force\n\n          # App-local Visual C++ x64 runtime. The GitHub runner already has the\n          # redistributable files installed with Visual Studio; copy the official\n          # Microsoft.VC143.CRT payload next to llama-server so an end-user PC\n          # does not need a separately installed VC++ runtime.\n          $vcRoots = @(\n            "C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Redist\\MSVC",\n            "C:\\Program Files\\Microsoft Visual Studio\\2022\\Professional\\VC\\Redist\\MSVC",\n            "C:\\Program Files\\Microsoft Visual Studio\\2022\\Community\\VC\\Redist\\MSVC"\n          )\n          $vcCrt = $null\n          foreach ($root in $vcRoots) {\n            if (-not (Test-Path $root)) { continue }\n            $candidate = Get-ChildItem $root -Directory | Sort-Object Name -Descending | ForEach-Object {\n              Join-Path $_.FullName "x64\\Microsoft.VC143.CRT"\n            } | Where-Object { Test-Path $_ } | Select-Object -First 1\n            if ($candidate) { $vcCrt = $candidate; break }\n          }\n          if (-not $vcCrt) { throw "Microsoft.VC143.CRT x64 redistributable directory not found" }\n          Copy-Item (Join-Path $vcCrt "*.dll") ai -Force\n          foreach ($requiredCrt in @("vcruntime140.dll","msvcp140.dll")) {\n            if (-not (Test-Path (Join-Path "ai" $requiredCrt))) { throw "VC++ runtime file missing: $requiredCrt" }\n          }\n\n          curl.exe -L --fail --retry 4 --retry-delay 3 -o ai/models/ia-mems.gguf $modelUrl\n'''
          if old not in text:
              raise SystemExit('runtime copy insertion point not found')
          text = text.replace(old, new, 1)

          old = '''          $process = Start-Process -FilePath $server -ArgumentList @("-m",$model,"--alias","ia-mems","--host","127.0.0.1","--port","18089","-c","4096","-np","1") -PassThru -WindowStyle Hidden\n'''
          new = '''          $runtimeDirectory = Split-Path $server -Parent\n          $process = Start-Process -FilePath $server -WorkingDirectory $runtimeDirectory -ArgumentList @("-m",$model,"--alias","ia-mems","--host","127.0.0.1","--port","18089","-c","4096","-np","1") -PassThru -WindowStyle Hidden\n'''
          if old not in text:
              raise SystemExit('model exercise start-process line not found')
          text = text.replace(old, new, 1)

          old = '''            "database\\reference\\manifest.json","ai\\llama-server.exe","ai\\models\\ia-mems.gguf","ai\\runtime_manifest.json",\n            "ai\\LICENSE_llama.cpp.txt","ai\\LICENSE_Qwen3.txt","ai\\LOCAL_AI_VALIDATED_DIALOGUE.txt"\n'''
          new = '''            "database\\reference\\manifest.json","ai\\llama-server.exe","ai\\models\\ia-mems.gguf","ai\\runtime_manifest.json",\n            "ai\\vcruntime140.dll","ai\\msvcp140.dll",\n            "ai\\LICENSE_llama.cpp.txt","ai\\LICENSE_Qwen3.txt","ai\\LOCAL_AI_VALIDATED_DIALOGUE.txt"\n'''
          if old not in text:
              raise SystemExit('required package list insertion point not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8', newline='\n')

      - name: Commit package workflow update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/ia-mems-final-package.yml
          git commit -m "Bundle app-local VC++ runtime with IA MEMS"
          git pull --rebase origin lab-expert-engine
          git push origin HEAD:lab-expert-engine
