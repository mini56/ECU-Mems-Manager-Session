name: TEMP RAVEMEMS V2 third PDF unmodified engine

on:
  push:
    branches: [tmp-ravemems-v2-foundation]
    paths:
      - '.github/workflows/tmp-ravemems-v2-third-pdf-unmodified.yml'

permissions:
  contents: read

jobs:
  third-pdf-unmodified:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TEST_SHA: '7418419993af12d5d4c8a1e57673984dbedc4675'
      PROTECTED_MEMSX64: '1d6316bd1746d6f2b4cfb751cab88d18e27ef730'
      SOURCE_MAIN_COMMIT: '643de091b474f4e27917a065bdf46d5a0c764276'
      SOURCE_PATH: 'rave/xn/hr01795e.pdf'
      SOURCE_BLOB: '63569965a1b6d62a5dd00553b1831254a9f2feb8'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 0

      - name: Guard exact unmodified engine and production
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TEST_SHA"
          test "$(git ls-remote origin refs/heads/MEMSX64 | awk '{print $1}')" = "$PROTECTED_MEMSX64"
          test -f ravemems/v2/profiles/rcl0193eng.json
          test "$(find ravemems/v2/profiles -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 1
          test -f .github/pass2/ravemems_generic_precise_extract.py
          echo "THIRD_PDF_UNMODIFIED_ENGINE_SHA_PASS $TEST_SHA"
          echo "THIRD_PDF_PROFILE_FILE_UNCHANGED ravemems/v2/profiles/rcl0193eng.json"
          echo "PROTECTED_BUILD103_PASS $PROTECTED_MEMSX64"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile existing engine and install pinned renderer
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="ravemems/v2:.github/pass2" python -m py_compile \
            ravemems/v2/generic_document_rules.py \
            ravemems/v2/prototype_extract.py \
            .github/pass2/rcl0193eng_zero_defect_pass2.py \
            .github/pass2/rcl0193eng_precise_visual_extract.py \
            .github/pass2/ravemems_generic_precise_extract.py \
            .github/pass2/ravemems_generic_visual_replay_validate.py
          python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.4'

      - name: Fetch candidate and require at least 30 pages
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_MAIN_COMMIT"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_MAIN_COMMIT"
          test "$(git rev-parse "$SOURCE_MAIN_COMMIT:$SOURCE_PATH")" = "$SOURCE_BLOB"
          mkdir -p "$RUNNER_TEMP/ravemems-source"
          git show "$SOURCE_MAIN_COMMIT:$SOURCE_PATH" > "$RUNNER_TEMP/ravemems-source/hr01795e.pdf"
          test -s "$RUNNER_TEMP/ravemems-source/hr01795e.pdf"
          python - "$RUNNER_TEMP/ravemems-source/hr01795e.pdf" "$RUNNER_TEMP/source-probe.json" <<'PY'
          import json, re, sys
          from pathlib import Path
          import fitz
          pdf = Path(sys.argv[1]); target = Path(sys.argv[2])
          doc = fitz.open(pdf)
          texts = [doc[i].get_text('text') for i in range(min(12, doc.page_count))]
          joined = '\n'.join(texts)
          lines = [re.sub(r'\s+', ' ', line).strip() for line in joined.splitlines() if line.strip()]
          publication_candidates = []
          for pat in [r'\bRCL\s*\d{3,5}[A-Z]*\b', r'\bAKM\s*\d{3,5}[A-Z]*\b', r'\bLRL\s*\d{3,5}[A-Z]*\b']:
              publication_candidates.extend(re.findall(pat, joined, flags=re.I))
          probe = {
              'page_count': doc.page_count,
              'metadata': doc.metadata,
              'publication_candidates': publication_candidates[:20],
              'first_nonempty_lines': lines[:120],
          }
          target.write_text(json.dumps(probe, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('THIRD_PDF_PAGE_COUNT', doc.page_count)
          print('THIRD_PDF_METADATA', json.dumps(doc.metadata, ensure_ascii=False))
          print('THIRD_PDF_PUBLICATION_CANDIDATES', publication_candidates[:20])
          print('THIRD_PDF_FIRST_LINES_BEGIN')
          for line in lines[:60]: print(line)
          print('THIRD_PDF_FIRST_LINES_END')
          assert doc.page_count >= 30, doc.page_count
          doc.close()
          PY

      - name: Run existing engine with existing profile unchanged
        id: extract
        shell: bash
        run: |
          set +e
          out="$RUNNER_TEMP/third-pdf-result"
          rm -rf "$out"
          mkdir -p "$out"
          PYTHONPATH="ravemems/v2:.github/pass2" python .github/pass2/ravemems_generic_precise_extract.py \
            --pdf "$RUNNER_TEMP/ravemems-source/hr01795e.pdf" \
            --schema ravemems/v2/schema.sql \
            --profile ravemems/v2/profiles/rcl0193eng.json \
            --out "$out" \
            --source-relative-path "$SOURCE_PATH" \
            --source-commit "$SOURCE_MAIN_COMMIT" \
            --source-blob-sha "$SOURCE_BLOB" \
            2>&1 | tee "$RUNNER_TEMP/third-pdf-extract.log"
          rc=${PIPESTATUS[0]}
          echo "extract_rc=$rc" >> "$GITHUB_OUTPUT"
          echo "THIRD_PDF_EXTRACT_RETURN_CODE $rc"
          exit 0

      - name: Capture unmodified-engine verdict
        if: always()
        shell: bash
        env:
          EXTRACT_RC: ${{ steps.extract.outputs.extract_rc }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/third-pdf-result"
          python - "$RUNNER_TEMP/source-probe.json" "$RUNNER_TEMP/third-pdf-extract.log" "$out" "$RUNNER_TEMP/third-pdf-verdict.json" "${EXTRACT_RC:-999}" <<'PY'
          import json, sqlite3, sys
          from pathlib import Path
          probe = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          log = Path(sys.argv[2]).read_text(encoding='utf-8', errors='replace') if Path(sys.argv[2]).exists() else ''
          out = Path(sys.argv[3]); target = Path(sys.argv[4]); rc = int(sys.argv[5])
          data = {
              'source_probe': probe,
              'extract_return_code': rc,
              'extract_completed': False,
              'failure_tail': log.splitlines()[-100:],
          }
          manifest_path = out / 'manifest.json'
          db_path = out / 'ravemems_v2_rcl0193eng.sqlite'
          if manifest_path.exists() and db_path.exists():
              m = json.loads(manifest_path.read_text(encoding='utf-8'))
              db = sqlite3.connect(db_path)
              doc = db.execute('SELECT document_key,canonical_name,document_kind,title_source FROM ravemems_document').fetchone()
              rev = db.execute('SELECT revision_key,source_relative_path,page_count FROM ravemems_document_revision').fetchone()
              data.update({
                  'extract_completed': rc == 0,
                  'manifest': m,
                  'document_row': doc,
                  'revision_row': rev,
                  'sqlite_integrity': db.execute('PRAGMA integrity_check').fetchone()[0],
                  'foreign_key_issues': db.execute('PRAGMA foreign_key_check').fetchall(),
                  'open_review_count': db.execute("SELECT COUNT(*) FROM ravemems_review_flag WHERE status='open'").fetchone()[0],
              })
              db.close()
          target.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('THIRD_PDF_UNMODIFIED_VERDICT', json.dumps({k:v for k,v in data.items() if k not in {'failure_tail','manifest','source_probe'}}, ensure_ascii=False))
          PY

      - name: Replay visuals only if extraction completed
        if: always() && steps.extract.outputs.extract_rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/third-pdf-result"
          PYTHONPATH="ravemems/v2:.github/pass2" python - "$RUNNER_TEMP/ravemems-source/hr01795e.pdf" "$out" <<'PY'
          import json, sys
          from pathlib import Path
          import ravemems_generic_visual_replay_validate as replay
          pdf = Path(sys.argv[1]); out = Path(sys.argv[2])
          result = replay.replay_visuals(pdf, out)
          print('THIRD_PDF_REPLAY_RESULT', json.dumps({k:v for k,v in result.items() if k not in {'verified','failed','links_verified','links_failed'}}, ensure_ascii=False))
          assert result['visual_fidelity_failed_count'] == 0
          assert result['missing_replay_count'] == 0
          assert result['unexpected_replay_count'] == 0
          assert result['sqlite_integrity'] == 'ok'
          assert result['foreign_key_issue_count'] == 0
          PY

      - name: Upload raw third-PDF result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RAVEMEMS-V2-THIRD-PDF-UNMODIFIED-ENGINE
          path: |
            ${{ runner.temp }}/source-probe.json
            ${{ runner.temp }}/third-pdf-extract.log
            ${{ runner.temp }}/third-pdf-verdict.json
            ${{ runner.temp }}/third-pdf-result
          if-no-files-found: warn
          retention-days: 14

      - name: Strict no-modification verdict
        if: always()
        shell: bash
        env:
          EXTRACT_RC: ${{ steps.extract.outputs.extract_rc }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/MEMSX64 | awk '{print $1}')" = "$PROTECTED_MEMSX64"
          if [ "${EXTRACT_RC:-999}" != "0" ]; then
            echo "THIRD_PDF_UNMODIFIED_ENGINE_FAIL extract_rc=${EXTRACT_RC:-999}"
            exit 1
          fi
          python - "$RUNNER_TEMP/third-pdf-verdict.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding='utf-8'))
          assert d['source_probe']['page_count'] >= 30
          assert d['extract_completed'] is True
          assert d['sqlite_integrity'] == 'ok'
          assert d['foreign_key_issues'] == []
          print('THIRD_PDF_UNMODIFIED_ENGINE_PASS')
          PY
