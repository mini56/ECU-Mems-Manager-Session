# Exclusively the DLL verification workflow. No Session build, Setup or MAJ
# workflow is changed by this file. The application is built only in a
# disposable worktree pinned to the real Session 197 commit.
name: DLL MEMS Manager x64 - validation isolee Session 197
run-name: Test DLL / Session 197 / ${{ github.sha }}
on:
  # An edit to THIS workflow starts ONE CI validation on dll-manager.
  # Ordinary program development on the Session branch never triggers it.
  push:
    branches: [dll-manager]
    paths:
      - '.github/workflows/rosco-45-exports-x64-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dll-session197-isolated-validation
  cancel-in-progress: true

jobs:
  session197_dll_validation:
    name: Compiler la DLL et verifier la liaison avec Session 197
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - name: Recuperer uniquement la branche DLL
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: S'assurer que la copie de Session 197 est accessible en lecture seule
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 origin 9105d9838e3fd5f81feeb99c0481c454d5d6a5e4
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch Session 197 read-only reference' }
          git cat-file -e 9105d9838e3fd5f81feeb99c0481c454d5d6a5e4^{commit}
          if ($LASTEXITCODE -ne 0) { throw 'Session 197 commit not present' }

      - name: Python pour les controles binaires
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer Qt 5.15.2 MSVC x64 pour compiler la copie jetable de Session 197
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          if ($LASTEXITCODE -ne 0) { throw 'aqtinstall installation failed' }
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtcharts -O C:\Qt --external $sevenZip
          if ($LASTEXITCODE -ne 0) { throw 'Qt 5.15.2 installation failed' }

      - name: Compiler / tester DLL x64 et vraie copie Session 197 (aucune installation)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\librosco-x64\verify_session197_windows.ps1' -QtPrefix 'C:/Qt/5.15.2/msvc2019_64'
          if ($LASTEXITCODE -ne 0) { throw 'Session 197 DLL compatibility validation failed' }

      - name: Resultat de verification
        shell: pwsh
        run: |
          Write-Host 'CI_SESSION197_DLL_CHECK_FINISHED: no Setup, no release, no ECU commands, no Session source modifications'
          Write-Host 'DLL compatibility for installed programs and physical ECUs requires separate runtime validation.'
