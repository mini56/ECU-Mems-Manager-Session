name: TEMP AKM7169 1870 FINAL VISUAL BACKFILL
on:
  push:
    branches: [tmp-rave-visual-backfill]
    paths: [.github/workflows/temp-akm7169-1870.yml]
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-rave-visual-backfill
          fetch-depth: 0
      - name: Guard BUILD 101 and exact documentary scope
        shell: bash
        run: |
          set -euo pipefail
          BASE='d1a69ede53d671972c3755152d83f31f4eae094b'
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git ls-remote origin refs/heads/MEMSX64 | awk '{print $1}')" = "22dbe75ed14e0a61e694159d505ef72245116b48"
          test "$(git diff --name-only "$BASE"...HEAD | sort)" = ".github/workflows/temp-akm7169-1870.yml"
          echo GUARD_PASS
      - name: Journal previous red run before retry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin RAPPORT
          git worktree add -B report1870-pre /tmp/report-pre origin/RAPPORT
          cd /tmp/report-pre
          if ! grep -q '33323299271' RAPPORT_SUIVI_ECU_MEMS_MANAGER.md; then
            printf '\n## 2026-08-30 - AKM7169ENG 1870 - TROISIEME RUN ROUGE / SOURCE REPRODUCTIBLE TROUVEE\n\nRun `33323299271`: les gardes passent, mais aucun miroir ne restitue le binaire PDFCoffee de 43906518 octets / SHA c8bbb30d... PDFCoffee renvoie toujours de l HTML. En revanche le miroir direct `benoit.dc.free.fr` restitue un vrai PDF AKM7169 de 11240232 octets, SHA-256 `37cd0434347fe4009963d075e4b91b0b21ebc905bae5657519a8080c3026d4f5`. Ce binaire devient la source reproductible candidate; le run suivant doit exiger ce hash et 482 pages avant toute capture. Aucune image/qz64 AKM n a ete committee par le run rouge. `MEMSX64` reste #101 `22dbe75ed14e0a61e694159d505ef72245116b48`.\n' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
            git commit -m 'Record AKM7169 reproducible source discovery'
            git push origin HEAD:RAPPORT
          fi
      - name: Fetch and validate reproducible AKM7169ENG source
        shell: bash
        run: |
          set -euo pipefail
          URL='http://benoit.dc.free.fr/technique/AKM7169%20-%20Manuel%20de%20Reparation%20Rover%20SPI.pdf'
          EXPECTED_SIZE='11240232'
          EXPECTED_SHA='37cd0434347fe4009963d075e4b91b0b21ebc905bae5657519a8080c3026d4f5'
          curl --fail --location --retry 4 --connect-timeout 20 --max-time 240 --user-agent 'Mozilla/5.0' --output /tmp/AKM7169ENG.pdf "$URL"
          test "$(stat -c%s /tmp/AKM7169ENG.pdf)" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA  /tmp/AKM7169ENG.pdf" | sha256sum -c -
          python -m pip install --disable-pip-version-check PyMuPDF==1.26.7 Pillow==12.3.0
          python - <<'PY'
          import fitz
          p='/tmp/AKM7169ENG.pdf'
          d=fitz.open(p)
          assert d.page_count == 482, d.page_count
          for n in (2,7,24,25,26):
              page=d[n-1]
              assert page.rect.width > 0 and page.rect.height > 0
          print('AKM_SOURCE_PASS pages=482 indexes=2,7,24,25,26')
          d.close()
          PY
      - name: Build five original pages and batch 1870
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,re,sqlite3,struct,zlib
          import fitz
          from PIL import Image
          R=Path('database/reference'); OUT=R/'images/rave'; OUT.mkdir(parents=True,exist_ok=True)
          PDF=Path('/tmp/AKM7169ENG.pdf'); SOURCE='37cd0434347fe4009963d075e4b91b0b21ebc905bae5657519a8080c3026d4f5'
          pages={2:('document_scope_page','Publication scope Mini Repair Manual AKM7169ENG'),7:('identification_page','VIN identification 049349'),24:('table_page','Engine Tuning Data 3 SPi manual MNE101040 speed density TPS fuel pressure'),25:('table_page','Engine Tuning Data 4 SPi automatic MNE101060 speed density TPS fuel pressure'),26:('table_page','Engine Tuning Data 5 SPi high compression MNE101070 speed density TPS fuel pressure')}
          links={'RAVE-SPI93-SCOPE-001':[2,7],'RAVE-SPI93-ECU-MANUAL-001':[24],'RAVE-SPI93-ECU-AUTO-001':[25],'RAVE-SPI93-ECU-HICOMP-001':[26],'RAVE-SPI93-SPEEDDENSITY-001':[24,25,26],'RAVE-SPI93-TPS-001':[24,25,26],'RAVE-SPI93-FUELPRESS-001':[24,25,26]}
          def sh(b): return hashlib.sha256(b).hexdigest()
          doc=fitz.open(PDF); assert doc.page_count==482
          assets={}
          for p,(kind,title) in pages.items():
              pix=doc[p-1].get_pixmap(dpi=150,colorspace=fitz.csGRAY,alpha=False)
              im=Image.frombytes('L',(pix.width,pix.height),pix.samples).convert('1')
              fn=f'AKM7169ENG_PDF_{p:03d}.png'; target=OUT/fn; im.save(target,format='PNG',optimize=True)
              assert target.stat().st_size > 1000
              assets[p]=(fn,kind,title,sh(target.read_bytes()))
          doc.close()
          lines=['-- AKM7169ENG visual backfill batch 1870',"CREATE TABLE IF NOT EXISTS mems_rave_illustration(illustration_key TEXT PRIMARY KEY,document TEXT NOT NULL,source_page TEXT NOT NULL,pdf_index INTEGER,asset_kind TEXT NOT NULL,relative_path TEXT NOT NULL UNIQUE,sha256 TEXT NOT NULL,notes TEXT);","CREATE TABLE IF NOT EXISTS mems_rave_illustration_link(fact_key TEXT NOT NULL,illustration_key TEXT NOT NULL,link_role TEXT NOT NULL DEFAULT 'source',notes TEXT,PRIMARY KEY(fact_key,illustration_key,link_role));","CREATE INDEX IF NOT EXISTS idx_rave_illustration_document_page ON mems_rave_illustration(document,source_page);","CREATE INDEX IF NOT EXISTS idx_rave_illustration_link_fact ON mems_rave_illustration_link(fact_key);","CREATE INDEX IF NOT EXISTS idx_rave_illustration_link_asset ON mems_rave_illustration_link(illustration_key);"]
          q=lambda s:"'"+s.replace("'","''")+"'"
          for p,(fn,kind,title,digest) in assets.items():
              vals=[q(f'RAVE:AKM7169ENG:PDF:{p}'),q('AKM7169ENG'),q(f'PDF p.{p}'),str(p),q(kind),q('images/rave/'+fn),q(digest),q('Original Rover AKM7169ENG factory scan page; reproducible 482-page source SHA-256 '+SOURCE+'; documentary only.')]
              lines.append('INSERT OR REPLACE INTO mems_rave_illustration(illustration_key,document,source_page,pdf_index,asset_kind,relative_path,sha256,notes) VALUES('+','.join(vals)+');')
          for fact,ps in links.items():
              for p in ps: lines.append('INSERT OR IGNORE INTO mems_rave_illustration_link(fact_key,illustration_key,link_role,notes) VALUES('+','.join([q(fact),q(f'RAVE:AKM7169ENG:PDF:{p}'),q('source'),q('Exact manufacturer source page from reproducible 482-page AKM7169 scan; historical fact preserved unchanged.')])+');')
          assert sum(len(v) for v in links.values())==14
          sql=('\n'.join(lines)+'\n').encode(); payload=struct.pack('>I',len(sql))+zlib.compress(sql,9); (R/'research_enrichment_1870.qz64').write_bytes(base64.b64encode(payload)+b'\n')
          m=json.loads((R/'manifest.json').read_text(encoding='utf-8-sig')); batches=m.setdefault('research_enrichment_batches',[]); assert 'research_enrichment_1870.qz64' not in batches; batches.append('research_enrichment_1870.qz64'); diagrams=m.setdefault('diagrams',{}); visual=m.setdefault('visual_assets',{})
          for p,(fn,kind,title,digest) in assets.items():
              path='images/rave/'+fn; diagrams[f'RAVE AKM7169ENG PDF {p} {title}']=path; visual[f'rave:AKM7169ENG:PDF:{p}']={'path':path,'asset_kind':kind,'document':'AKM7169ENG','source_page':f'PDF p.{p}','pdf_index':p,'sha256':digest}
          (R/'manifest.json').write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          def num(p):
              x=re.search(r'_(\d+)\.qz64$',p.name); return int(x.group(1)) if x else 0
          def dec(p):
              d=base64.b64decode(p.read_bytes().strip()); n=struct.unpack('>I',d[:4])[0]; raw=zlib.decompress(d[4:]); assert len(raw)==n; return raw.decode()
          db=sqlite3.connect('/tmp/akm1870.sqlite'); seeds=sorted(R.glob('mems_reference_seed_*.qz64'),key=lambda p:(num(p),p.name)); enc=b''.join(p.read_bytes().strip() for p in seeds); d=base64.b64decode(enc); n=struct.unpack('>I',d[:4])[0]; raw=zlib.decompress(d[4:]); assert len(raw)==n; db.executescript(raw.decode())
          for name in m['research_enrichment_batches']:
              p=R/name
              if p.is_file() and p.name!='research_enrichment_1600.qz64': db.executescript('\n'.join(x for x in dec(p).splitlines() if not x.strip().startswith('--'))+'\n')
          db.execute('PRAGMA user_version=20'); db.commit()
          assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'; assert db.execute('select count(*) from mems_rave_fact').fetchone()[0]==93; assert db.execute('select count(*) from mems_expert_fact_external').fetchone()[0]==105
          assert db.execute("select count(*) from mems_rave_illustration where document='AKM7169ENG'").fetchone()[0]==5
          assert db.execute("select count(*) from mems_rave_illustration_link l join mems_rave_illustration i on i.illustration_key=l.illustration_key where i.document='AKM7169ENG' and l.link_role='source'").fetchone()[0]==14
          assert db.execute("select count(distinct l.fact_key) from mems_rave_illustration_link l join mems_rave_illustration i on i.illustration_key=l.illustration_key where i.document='AKM7169ENG' and l.link_role='source'").fetchone()[0]==7
          assert db.execute("select count(distinct l.fact_key) from mems_rave_illustration_link l where l.link_role='source'").fetchone()[0]==93
          db.close()
          audit=R/'audits/akm7169_1870_visual_backfill_audit.md'; audit.write_text(f'''# AKM7169ENG visual backfill - batch 1870\n\nReproducible source: Rover AKM7169ENG direct PDF mirror, 482 pages, 11240232 bytes, SHA-256 `{SOURCE}`. Source URL: `http://benoit.dc.free.fr/technique/AKM7169%20-%20Manuel%20de%20Reparation%20Rover%20SPI.pdf`.\n\nOriginal retained pages: 2, 7, 24, 25, 26. Exactly 5 manufacturer pages cover the 7 existing AKM7169 historical facts through 14 additive source links. Historical facts are not rewritten.\n\nValidation: source page count 482; integrity `ok`; user_version 20; mems_rave_fact 93; mems_expert_fact_external 105; AKM assets 5; AKM links 14; AKM facts covered 7/7; global historical RAVE visual coverage **93/93 = 100%**.\n\nProduction `MEMSX64` remains BUILD #101 `22dbe75ed14e0a61e694159d505ef72245116b48`. Base/RAVE remains consultative only.\n''',encoding='utf-8')
          print('AKM7169_1870_PASS assets=5 links=14 facts=7 global=93/93')
          PY
      - name: Commit exact documentary lot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-akm7169-1870.yml
          git add database/reference/manifest.json database/reference/research_enrichment_1870.qz64 database/reference/audits/akm7169_1870_visual_backfill_audit.md database/reference/images/rave/AKM7169ENG_PDF_*.png
          git diff --cached --check
          git commit -m 'Add AKM7169ENG visual backfill 1870'
          git push origin HEAD:tmp-rave-visual-backfill
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Remote proof and master report
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin tmp-rave-visual-backfill RAPPORT
          test "$(git rev-parse origin/tmp-rave-visual-backfill)" = "$FINAL_SHA"
          test "$(git ls-remote origin refs/heads/MEMSX64 | awk '{print $1}')" = "22dbe75ed14e0a61e694159d505ef72245116b48"
          git worktree add -B report1870-post /tmp/report-post origin/RAPPORT
          cd /tmp/report-post
          printf '\n## 2026-08-30 - AKM7169ENG 1870 - VISUAL BACKFILL TERMINE\n\nSource constructeur AKM7169ENG reproductible acquise et hashee: 482 pages, 11240232 octets, SHA-256 `37cd0434347fe4009963d075e4b91b0b21ebc905bae5657519a8080c3026d4f5`. Pages originales 2, 7, 24, 25, 26 integrees. Lot 1870: 5 assets, 14 liens, 7/7 faits AKM couverts; couverture visuelle historique RAVE finale **93/93 = 100%%**. Commit documentaire `%s`, run `%s`. `MEMSX64` reste strictement #101 `22dbe75ed14e0a61e694159d505ef72245116b48`; aucun #102.\n' "$FINAL_SHA" "$GITHUB_RUN_ID" >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git commit -m 'Record AKM7169ENG 1870 completion'
          git push origin HEAD:RAPPORT
          echo 'AKM7169_1870_REMOTE_PASS 93/93'
