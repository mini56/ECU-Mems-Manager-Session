name: RAVEMEMS legacy treatment matrix

on:
  push:
    branches: [tmp-rave-new-extraction-pilot]
    paths:
      - '.github/workflows/ravemems-legacy-treatment-matrix.yml'

permissions:
  contents: read
  actions: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_COMMIT: '1d6316bd1746d6f2b4cfb751cab88d18e27ef730'
      MAP_RUN_ID: '33515878966'
      MAP_ARTIFACT_ID: '9803548521'
      MAP_ARTIFACT_NAME: 'ravemems-exhaustive-legacy-visual-mapping'
      MAP_DIGEST: 'sha256:bee37602bfdb3e4d17b8e99d65ef3884b0ae08a80ef00ac529f3598d463c4fa3'
      RAW_RUN_ID: '33518815657'
      RAW_ARTIFACT_ID: '9804755424'
      RAW_ARTIFACT_NAME: 'ravemems-rcl0194-eight-raw-evidence'
      RAW_DIGEST: 'sha256:b7bb84c45f6442a537419d2622ee4900dbed2cb1fc42ea88e6f450cceb99f8e4'
      FINAL2_RUN_ID: '33519213621'
      FINAL2_ARTIFACT_ID: '9804917692'
      FINAL2_ARTIFACT_NAME: 'ravemems-final-rcl0194-two-case-review'
      FINAL2_DIGEST: 'sha256:af43e108225518ef12dc57e18adcb94df51534331e5db83491194e37f35c0e72'
      NORM_RUN_ID: '33522920813'
      NORM_ARTIFACT_ID: '9806441719'
      NORM_ARTIFACT_NAME: 'ravemems-colour-codes-normalized-comparison'
      NORM_DIGEST: 'sha256:97ad40772a7bea16fb42ccde38c688dd88f760dbe68f10c23eb84863bfe4cdce'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-rave-new-extraction-pilot
          fetch-depth: 0

      - name: Verify protected production and exact authoritative artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/MEMSX64 | awk '{print $1}')" = "$BASE_COMMIT"
          for spec in \
            "$MAP_ARTIFACT_ID|$MAP_ARTIFACT_NAME|$MAP_DIGEST" \
            "$RAW_ARTIFACT_ID|$RAW_ARTIFACT_NAME|$RAW_DIGEST" \
            "$FINAL2_ARTIFACT_ID|$FINAL2_ARTIFACT_NAME|$FINAL2_DIGEST" \
            "$NORM_ARTIFACT_ID|$NORM_ARTIFACT_NAME|$NORM_DIGEST"
          do
            IFS='|' read -r aid aname adigest <<< "$spec"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}" > "$RUNNER_TEMP/artifact_${aid}.json"
            python3 - "$RUNNER_TEMP/artifact_${aid}.json" "$aname" "$adigest" <<'PY'
          import json,sys
          p,name,digest=sys.argv[1:]
          a=json.load(open(p,encoding='utf-8'))
          assert a['name']==name,(a['name'],name)
          assert a.get('digest')==digest,(a.get('digest'),digest)
          print('ARTIFACT_EXACT_PASS',a['id'],a['name'],a.get('digest'))
          PY
          done
          echo EXACT_AUTHORITATIVE_INPUTS_PASS

      - name: Download authoritative evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/map" "$RUNNER_TEMP/raw" "$RUNNER_TEMP/final2" "$RUNNER_TEMP/norm"
          gh run download "$MAP_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$MAP_ARTIFACT_NAME" --dir "$RUNNER_TEMP/map"
          gh run download "$RAW_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$RAW_ARTIFACT_NAME" --dir "$RUNNER_TEMP/raw"
          gh run download "$FINAL2_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$FINAL2_ARTIFACT_NAME" --dir "$RUNNER_TEMP/final2"
          gh run download "$NORM_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$NORM_ARTIFACT_NAME" --dir "$RUNNER_TEMP/norm"
          test -f "$RUNNER_TEMP/map/mapping/legacy_visual_mapping_427.json"
          test -f "$RUNNER_TEMP/map/mapping/legacy_illustration_mapping_126.json"
          test -f "$RUNNER_TEMP/map/mapping/legacy_link_mapping_329.json"
          test -f "$RUNNER_TEMP/raw/rcl0194_eight_raw.json"
          test -f "$RUNNER_TEMP/final2/rcl0194_39_3.json"
          test -f "$RUNNER_TEMP/norm/normalized_comparison.json"
          echo AUTHORITATIVE_EVIDENCE_DOWNLOAD_PASS

      - name: Build final non-destructive treatment matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/matrix"
          python3 - <<'PY' | tee "$RUNNER_TEMP/matrix_stdout.txt"
          import collections,json,os
          from pathlib import Path

          root=Path(os.environ['RUNNER_TEMP'])
          mapping=json.load(open(root/'map/mapping/legacy_visual_mapping_427.json',encoding='utf-8'))
          illustrations=json.load(open(root/'map/mapping/legacy_illustration_mapping_126.json',encoding='utf-8'))
          links=json.load(open(root/'map/mapping/legacy_link_mapping_329.json',encoding='utf-8'))
          raw=json.load(open(root/'raw/rcl0194_eight_raw.json',encoding='utf-8'))
          final39=json.load(open(root/'final2/rcl0194_39_3.json',encoding='utf-8'))
          norm=json.load(open(root/'norm/normalized_comparison.json',encoding='utf-8'))
          assert len(mapping)==427 and len(illustrations)==126 and len(links)==329
          assert len(raw)==8

          rraw={x['target']:x for x in raw}
          first6={'15.1','20.1','20.2','20.3','20.4','39.2'}
          for t in first6:
              x=rraw[t]
              assert x['visual_count']==0,(t,x['visual_count'])
              assert t in x['exact_hits'],(t,x['exact_hits'])
          assert rraw['COLOUR CODES']['visual_count']==1
          technical=final39.get('technical_hits') or []
          assert len(technical)==1,technical
          assert technical[0]['physical_page']==27 and technical[0]['visual_count']==0,technical[0]
          assert norm['pass'] is True and norm['read_only'] is True
          assert norm['equivalence_proved_by_gate'] is False
          assert norm['classification']=='conserver_migrer_legacy'

          authoritative_rcl={
            '15.1':{'physical_page':rraw['15.1']['physical_page'],'visual_count':0,'action':'conserver_migrer_legacy'},
            '20.1':{'physical_page':rraw['20.1']['physical_page'],'visual_count':0,'action':'conserver_migrer_legacy'},
            '20.2':{'physical_page':rraw['20.2']['physical_page'],'visual_count':0,'action':'conserver_migrer_legacy'},
            '20.3':{'physical_page':rraw['20.3']['physical_page'],'visual_count':0,'action':'conserver_migrer_legacy'},
            '20.4':{'physical_page':rraw['20.4']['physical_page'],'visual_count':0,'action':'conserver_migrer_legacy'},
            '39.2':{'physical_page':rraw['39.2']['physical_page'],'visual_count':0,'action':'conserver_migrer_legacy'},
            '39.3':{'physical_page':27,'visual_count':0,'action':'conserver_migrer_legacy'},
            'COLOUR CODES':{'physical_page':rraw['COLOUR CODES']['physical_page'],'visual_count':1,'action':'conserver_migrer_legacy','normalized_comparison':norm},
          }

          def rcl_target(old_key):
              u=(old_key or '').upper()
              if 'COLOUR CODES' in u:
                  return 'COLOUR CODES'
              for x in ('15.1','20.1','20.2','20.3','20.4','39.2','39.3'):
                  if x in u:
                      return x
              return None

          final_manifest=[]
          for m in mapping:
              old=m['classification']
              roots=set(m.get('source_roots') or [])
              is_rcl0194=('RCL0194' in roots) or ('RCL0194ENG' in (m.get('old_key') or '').upper())
              target=rcl_target(m.get('old_key')) if is_rcl0194 else None
              evidence={'previous_classification':old}
              if target in authoritative_rcl:
                  action='conserver_migrer_legacy'
                  evidence['rcl0194_target']=target
                  evidence['authoritative']=authoritative_rcl[target]
                  evidence['reason']='authoritative RCL0194 review: legacy visual has no proven RAVEMEMS visual replacement'
              elif roots.intersection({'AKM6348','AKM7169'}):
                  action='conserver_migrer_legacy'
                  evidence['reason']='legacy source family absent from all 47 RAVEMEMS documents'
              elif old=='remplacement_ravemems_prouve':
                  action='remplacer_par_ravemems'
                  evidence['ravemems_visual_occurrences']=m.get('ravemems_visual_occurrences') or []
              elif old=='ancienne_capture_page_texte_sans_visuel_ravemems':
                  action='retirer_de_ui_conserver_provenance'
                  evidence['reason']='pure-text legacy capture: keep provenance, no user-facing visual link'
              elif old=='ancienne_entree_source_resolue_sans_contenu_visuel':
                  action='conserver_migrer_legacy'
                  evidence['reason']='source resolved but RAVEMEMS provides no replacement visual content'
              else:
                  action='a_revoir'
                  evidence['reason']='no deterministic safe treatment from authoritative evidence'
              final_manifest.append({**m,'final_action':action,'final_evidence':evidence})

          mc=collections.Counter(x['final_action'] for x in final_manifest)
          assert sum(mc.values())==427
          assert mc.get('a_revoir',0)==0,[x['old_key'] for x in final_manifest if x['final_action']=='a_revoir']
          rcl_keep=[x for x in final_manifest if x['final_evidence'].get('rcl0194_target') in authoritative_rcl]
          assert len(rcl_keep)==8,[(x['old_key'],x['final_evidence'].get('rcl0194_target')) for x in rcl_keep]
          akm_keep=[x for x in final_manifest if set(x.get('source_roots') or []).intersection({'AKM6348','AKM7169'}) and x['final_action']=='conserver_migrer_legacy']
          assert len(akm_keep)==92,len(akm_keep)
          path_action={x['old_path']:x['final_action'] for x in final_manifest}

          # Object-level treatment is deliberately conservative: any keep requirement wins.
          def aggregate(actions):
              s=set(actions)
              if not s: return 'conserver_migrer_legacy'
              if 'conserver_migrer_legacy' in s: return 'conserver_migrer_legacy'
              if 'a_revoir' in s: return 'a_revoir'
              if 'remplacer_par_ravemems' in s: return 'remplacer_par_ravemems'
              if s=={'retirer_de_ui_conserver_provenance'}: return 'retirer_de_ui_conserver_provenance'
              return 'conserver_migrer_legacy'

          final_ill=[]
          for x in illustrations:
              acts=[path_action[p] for p in x.get('manifest_paths',[]) if p in path_action]
              final_ill.append({**x,'manifest_final_actions':acts,'final_action':aggregate(acts)})
          assert len(final_ill)==126
          ic=collections.Counter(x['final_action'] for x in final_ill)
          assert ic.get('a_revoir',0)==0

          ill_action={x['index']:x['final_action'] for x in final_ill}
          final_links=[]
          for x in links:
              acts=[ill_action[i] for i in x.get('legacy_illustration_indexes',[]) if i in ill_action]
              final_links.append({**x,'illustration_final_actions':acts,'final_action':aggregate(acts)})
          assert len(final_links)==329
          lc=collections.Counter(x['final_action'] for x in final_links)
          assert lc.get('a_revoir',0)==0

          summary={
              'pass':True,'read_only':True,'database_modifications':0,'automatic_deletions':0,
              'protected_memsx64':os.environ['BASE_COMMIT'],
              'manifest_total':427,'manifest_actions':dict(sorted(mc.items())),
              'illustration_total':126,'illustration_actions':dict(sorted(ic.items())),
              'link_total':329,'link_actions':dict(sorted(lc.items())),
              'structured_legacy_rave_facts':177,'structured_fact_action':'conserver_migrer_legacy',
              'rcl0194_authoritative':authoritative_rcl,
              'unresolved_manifest_items':0,
              'destructive_cleanup_authorized':False,
              'next_gate':'apply this treatment plan to a copy, migrate/relink first, then prove no useful legacy knowledge or visual is lost before any deletion',
          }
          out=root/'matrix'
          for name,obj in [
              ('legacy_manifest_treatment_427.json',final_manifest),
              ('legacy_illustration_treatment_126.json',final_ill),
              ('legacy_link_treatment_329.json',final_links),
              ('legacy_treatment_summary.json',summary),
          ]:
              (out/name).write_text(json.dumps(obj,ensure_ascii=False,indent=2,sort_keys=True),encoding='utf-8')

          md=['# RAVEMEMS authoritative legacy treatment matrix','',
              '- Read-only: **yes**','- Database modifications: **0**','- Automatic deletions: **0**','',
              '## Manifest 427']
          md += [f'- {k}: {v}' for k,v in sorted(mc.items())]
          md += ['','## Illustrations 126']+[f'- {k}: {v}' for k,v in sorted(ic.items())]
          md += ['','## Links 329']+[f'- {k}: {v}' for k,v in sorted(lc.items())]
          md += ['','## Structured legacy facts','- conserver_migrer_legacy: 177','',
                 '## RCL0194 authoritative legacy visuals']
          for k,v in authoritative_rcl.items():
              md.append(f"- {k}: page {v['physical_page']}, RAVEMEMS visual_count={v['visual_count']} -> {v['action']}")
          md += ['','- unresolved manifest items: **0**','- destructive cleanup authorized: **NO**','',summary['next_gate']]
          (out/'legacy_treatment_report.md').write_text('\n'.join(md)+'\n',encoding='utf-8')
          print('MATRIX_PASS')
          print(json.dumps(summary,ensure_ascii=False,sort_keys=True))
          PY

      - name: Verify matrix completeness and checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/matrix"
          python3 - <<'PY'
          import json
          s=json.load(open('legacy_treatment_summary.json',encoding='utf-8'))
          assert s['pass'] is True and s['read_only'] is True
          assert s['manifest_total']==427 and s['illustration_total']==126 and s['link_total']==329
          assert s['database_modifications']==0 and s['automatic_deletions']==0
          assert s['unresolved_manifest_items']==0
          assert s['destructive_cleanup_authorized'] is False
          assert sum(s['manifest_actions'].values())==427
          assert sum(s['illustration_actions'].values())==126
          assert sum(s['link_actions'].values())==329
          assert len(s['rcl0194_authoritative'])==8
          print('TREATMENT_MATRIX_COMPLETENESS_PASS')
          PY
          sha256sum *.json *.md > matrix_sha256.txt
          cat legacy_treatment_report.md
          cat matrix_sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ravemems-authoritative-legacy-treatment-matrix
          path: |
            ${{ runner.temp }}/matrix/**
            ${{ runner.temp }}/matrix_stdout.txt
          if-no-files-found: error
          retention-days: 14
