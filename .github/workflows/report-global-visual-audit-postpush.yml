name: REPORT GLOBAL VISUAL AUDIT POSTPUSH

on:
  push:
    branches:
      - RAPPORT
    paths:
      - '.github/workflows/report-global-visual-audit-postpush.yml'

permissions:
  contents: write

jobs:
  append-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Append visual audit postpush result
        env:
          REPORT_APPEND_B64: ' bZXZvbHV0aW9uIHByb2dyYW1tZSBkaXN0aW5jdGU6IGxlIGNvZGUgY29tbWl0ZSBkdSBiYWNrZmlsbCBnYXJkZSBsJ29yZHJlICMxMDEgYGN '
        run: |
          python -c "import os,base64; open('RAPPORT_SUIVI_ECU_MEMS_MANAGER.md','ab').write(base64.b64decode(os.environ['REPORT_APPEND_B64']))"
      - name: Commit report update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git diff --cached --quiet && exit 1
          git commit -m "Report global visual audit post-push validation"
          git push origin HEAD:RAPPORT
