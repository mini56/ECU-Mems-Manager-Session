name: TEMP RAVEMEMS REPORT CORRECTION COUNT FAILURE

on:
  push:
    branches:
      - RAPPORT
    paths:
      - .ravemems-report-count-failure-trigger

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Append exact TEST2 correction failure
        run: python tools/temp_append_ravemems_count_failure.py
      - name: Commit report and remove temporary files
        run: |
          set -euo pipefail
          git config user.name github-actions-bot
          git config user.email github-actions@users.noreply.github.com
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git rm .github/workflows/temp-ravemems-report-count-failure.yml tools/temp_append_ravemems_count_failure.py .ravemems-report-count-failure-trigger
          git commit -m "Record TEST2 completeness correction count failure"
          git push origin RAPPORT
