name: TEMP Journal RAVEMEMS V2 GO

on:
  push:
    branches: [RAPPORT]
    paths:
      - '.github/workflows/tmp-journal-ravemems-v2-go.yml'

permissions:
  contents: write

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0

      - name: Journal cleanup before branch deletion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          report = Path('RAPPORT_SUIVI_ECU_MEMS_MANAGER.md')
          raw = report.read_bytes()
          marker = '## 2026-09-03 — NETTOYAGE BRANCHES TEMPORAIRES RAVEMEMS V2'.encode('utf-8')
          if marker not in raw:
              entry = '''\n\n## 2026-09-03 — NETTOYAGE BRANCHES TEMPORAIRES RAVEMEMS V2\n\nLe canal de journalisation est rétabli : run `33718721277` = SUCCESS. La modification du cahier généralisant le contexte aux véhicules à carburateur / gestion mécanique / absence d’ECU et l’entrée GO RAVEMEMS V2 ont été poussées sur `RAPPORT` au commit `6c1063d6d36ff8c8746630b727f4ca7e07117baf`.\n\nAvant toute pousse technique, suppression prévue des trois branches créées par erreur pendant le chargement d’outils : `tmp-ravemems-v2-report-go`, `tmp-ravemems-v2-report-go-unused`, `tmp-ravemems-v2-report-go-2-unused`. Elles ne contiennent aucune modification et ne sont pas des bases de travail. La seule branche technique autorisée reste `tmp-ravemems-v2-foundation`, dérivée de BUILD #103.\n\nPROCHAINE ACTION EXACTE : supprimer les trois branches inutilisées, puis commencer la fondation additive RAVEMEMS V2 sur `tmp-ravemems-v2-foundation`, sans toucher à `MEMSX64`, au protocole, au 32 bits ni au corpus complet.\n'''.encode('utf-8')
              with report.open('ab') as f:
                  if raw and not raw.endswith(b'\n'):
                      f.write(b'\n')
                  f.write(entry)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git diff --cached --check
          git commit -m 'Journal cleanup before RAVEMEMS V2 implementation'
          git push origin HEAD:RAPPORT

      - name: Delete unused temporary branches
        shell: bash
        run: |
          set -euo pipefail
          protected="$(git ls-remote origin refs/heads/MEMSX64 | awk '{print $1}')"
          test "$protected" = '1d6316bd1746d6f2b4cfb751cab88d18e27ef730'
          foundation="$(git ls-remote origin refs/heads/tmp-ravemems-v2-foundation | awk '{print $1}')"
          test "$foundation" = '1d6316bd1746d6f2b4cfb751cab88d18e27ef730'
          git push origin --delete tmp-ravemems-v2-report-go tmp-ravemems-v2-report-go-unused tmp-ravemems-v2-report-go-2-unused
          echo 'RAVEMEMS_V2_UNUSED_BRANCH_CLEANUP_PASS'
