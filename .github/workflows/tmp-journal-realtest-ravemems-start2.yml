name: TEMP repair journal real RAVEMEMS user test
on:
  push:
    branches:
      - RAPPORT
    paths:
      - ".github/workflows/tmp-journal-realtest-ravemems-start2.yml"
permissions:
  contents: write
jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Record checkpoint and clean temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          {
            echo
            echo "## 2026-09-01 — TEST REEL PACKAGE RAVEMEMS VISUEL x64 : DEMARRAGE UTILISATEUR OK"
            echo
            echo 'Package testé : `ECU-MEMS-Manager-x64-RAVEMEMS-VISUAL-TEST-from-BUILD-103`, artefact `9811065597`, run `33533678990` SUCCESS.'
            echo
            echo 'Premier retour utilisateur réel :'
            echo '- téléchargement : OK ;'
            echo '- extraction du ZIP : OK ;'
            echo "- démarrage de l'application : OK ;"
            echo '- fonction `Vue instantanée` / capture : OK, plusieurs captures enregistrées dans `captures/...png` ;'
            echo '- navigation sur les premiers onglets visible sans anomalie bloquante signalée ;'
            echo '- onglet `IA MEMS` ouvert : statut utilisateur visible `IA locale : prête`, zone de question active et bouton Envoyer disponible ;'
            echo '- prochaine vérification réelle : réponses IA et bouton `Voir le schéma`, avec un cas historique MEMS 1.3 puis un cas RAVEMEMS.'
            echo
            echo 'INCIDENT JOURNAL : le premier workflow temporaire de journalisation run `33536844486` a échoué avant exécution de job ; aucune progression technique n a été effectuée entre cet échec et la présente réparation.'
            echo
            echo 'Aucune modification technique autorisée sur la base de ce checkpoint. Attendre les réponses du test IA réel et journaliser immédiatement tout défaut ou validation.'
            echo '`MEMSX64` doit rester strictement sur BUILD #103 `1d6316bd1746d6f2b4cfb751cab88d18e27ef730`.'
          } >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          rm -f .github/workflows/tmp-journal-realtest-ravemems-start.yml
          rm -f .github/workflows/tmp-journal-realtest-ravemems-start2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md .github/workflows/tmp-journal-realtest-ravemems-start.yml .github/workflows/tmp-journal-realtest-ravemems-start2.yml
          git commit -m "Record real RAVEMEMS user test start"
          git push HEAD:RAPPORT
