name: TEMP RAVEMEMS REPORT TEST2 GREEN REVIEW

on:
  push:
    branches:
      - RAPPORT
    paths:
      - .ravemems-report-test2-green-trigger

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - run: python tools/temp_append_ravemems_test2_green_review.py
      - run: |
          set -euo pipefail
          git config user.name github-actions-bot
          git config user.email github-actions@users.noreply.github.com
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git rm .github/workflows/temp-ravemems-report-test2-green-review.yml tools/temp_append_ravemems_test2_green_review.py .ravemems-report-test2-green-trigger
          git commit -m "Record TEST2 green run and visual review"
          git push origin RAPPORT
