name: TEMP update RAVEMEMS units policy

on:
  push:
    branches: [RAPPORT]
    paths:
      - '.github/workflows/tmp-update-ravemems-units.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0

      - name: Update cahier and report
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          cahier = Path('docs/CAHIER_DES_CHARGES_RAVEMEMS_BROUILLON_2026-09-02.md')
          text = cahier.read_text(encoding='utf-8')
          old = "Le texte constructeur original reste conservé dans l’élément source correspondant.\n"
          new = old + "\nLa **valeur et l’unité constructeur doivent toujours être conservées exactement comme référence**. L’IA peut ajouter une conversion utile pour faciliter la lecture, mais cette conversion reste un complément et ne doit jamais remplacer, masquer ou modifier la valeur d’origine. Exemple : `3,5 bar` peut être présenté comme **3,5 bar (≈ 350 kPa)**, tout en conservant `3,5 bar` comme valeur constructeur de référence.\n"
          if text.count(old) < 1:
              raise SystemExit('specification anchor not found')
          marker = '## 26. VALEURS ET SPÉCIFICATIONS'
          start = text.index(marker)
          pos = text.index(old, start)
          text = text[:pos] + new + text[pos + len(old):]
          cahier.write_text(text, encoding='utf-8')

          report = Path('RAPPORT_SUIVI_ECU_MEMS_MANAGER.md')
          with report.open('a', encoding='utf-8') as f:
              f.write('\n\n## 2026-09-02 — RELECTURE CAHIER RAVEMEMS — VALEURS ET UNITÉS\n\n')
              f.write('Décision utilisateur validée : la valeur et l’unité constructeur restent toujours la référence exacte. Une conversion utile peut être ajoutée par l’IA comme complément, mais elle ne remplace jamais la valeur source et ne doit ni la masquer ni la modifier.\n\n')
              f.write('Aucun code applicatif, aucune extraction et aucun BUILD de production ne sont lancés dans cette étape de relecture.\n\n')
              f.write('PROCHAINE ACTION EXACTE : poursuivre la relecture du cahier des charges RAVEMEMS question par question avec l’utilisateur. Ne lancer aucune nouvelle extraction avant validation explicite du cahier.\n')
          PY

      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-update-ravemems-units.yml
          git add docs/CAHIER_DES_CHARGES_RAVEMEMS_BROUILLON_2026-09-02.md RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git diff --cached --check
          git commit -m "Record RAVEMEMS value and unit policy"
          git push origin HEAD:RAPPORT
