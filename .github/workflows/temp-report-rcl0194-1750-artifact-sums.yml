name: TEMP REPORT RCL0194 1750 ARTIFACT SUMS

on:
  push:
    branches: [RAPPORT]
    paths:
      - .github/workflows/temp-report-rcl0194-1750-artifact-sums.yml

permissions:
  contents: write

jobs:
  update_report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Append artifact checksum defect
        shell: bash
        env:
          REPORT_APPEND_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p=Path('RAPPORT_SUIVI_ECU_MEMS_MANAGER.md')
          with p.open('ab') as f:
              f.write(base64.b64decode(os.environ['REPORT_APPEND_B64']))
          PY
      - name: Commit report and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-report-rcl0194-1750-artifact-sums.yml
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git commit -m "Record RCL0194 1750 artifact checksum defect"
          git push origin RAPPORT
