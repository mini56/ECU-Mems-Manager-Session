name: TEMP direct first IA response image correction v2
on:
  push:
    paths:
      - '.github/workflows/tmp-direct-first-ia-response-image-correction-v2.yml'
jobs:
  edit-source:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-ravemems-ia-visual-integration
          fetch-depth: 0
      - name: Edit source directly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match for {old[:60]!r}, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # IA knowledge: generic bounded typo tolerance.
          path = 'expert/IaMemsService.cpp'
          old = '''bool knowledgeTermMatches(const QString &text, const QString &term)\n{\n'''
          new = '''int boundedKnowledgeEditDistance(const QString &left, const QString &right, int maximum)\n{\n    if (qAbs(left.size() - right.size()) > maximum)\n        return maximum + 1;\n    QVector<int> previous(right.size() + 1);\n    QVector<int> current(right.size() + 1);\n    for (int j = 0; j <= right.size(); ++j)\n        previous[j] = j;\n    for (int i = 1; i <= left.size(); ++i) {\n        current[0] = i;\n        int rowMinimum = current[0];\n        for (int j = 1; j <= right.size(); ++j) {\n            const int substitution = previous[j - 1]\n                + (left.at(i - 1) == right.at(j - 1) ? 0 : 1);\n            current[j] = qMin(qMin(previous[j] + 1, current[j - 1] + 1), substitution);\n            rowMinimum = qMin(rowMinimum, current[j]);\n        }\n        if (rowMinimum > maximum)\n            return maximum + 1;\n        previous.swap(current);\n    }\n    return previous[right.size()];\n}\n\nbool fuzzyKnowledgeTermMatches(const QString &text, const QString &term)\n{\n    if (term.size() < 5 || term.contains(QRegularExpression(QStringLiteral("[^a-z]"))))\n        return false;\n    const int maximum = term.size() >= 9 ? 2 : 1;\n    QRegularExpressionMatchIterator it =\n        QRegularExpression(QStringLiteral("[a-z]+")) .globalMatch(text);\n    while (it.hasNext()) {\n        const QString candidate = it.next().captured(0);\n        if (qAbs(candidate.size() - term.size()) <= maximum\n            && boundedKnowledgeEditDistance(candidate, term, maximum) <= maximum)\n            return true;\n    }\n    return false;\n}\n\nbool knowledgeTermMatches(const QString &text, const QString &term)\n{\n'''
          replace_once(path, old, new)

          old = '''    if (tokenTerms.contains(term) || term.size() <= 3)\n        return containsWord(text, term);\n    return text.contains(term);\n}\n'''
          new = '''    if (tokenTerms.contains(term) || term.size() <= 3)\n        return containsWord(text, term);\n    if (text.contains(term))\n        return true;\n    return fuzzyKnowledgeTermMatches(text, term);\n}\n'''
          replace_once(path, old, new)

          old = '''bool hasPinoutEvidence(const QString &text)\n{\n    return text.contains(QStringLiteral("wiring"))\n'''
          new = '''bool hasDirectConnectorEvidence(const QString &text)\n{\n    static const QRegularExpression connectorRx(\n        QStringLiteral("\\\\bC[0-9]{2,4}-[0-9]{1,3}\\\\b"),\n        QRegularExpression::CaseInsensitiveOption);\n    return connectorRx.match(text).hasMatch();\n}\n\nbool hasPinoutEvidence(const QString &text)\n{\n    return hasDirectConnectorEvidence(text)\n        || text.contains(QStringLiteral("wiring"))\n'''
          replace_once(path, old, new)

          marker = '''int verificationScore(const QString &level)\n'''
          helper = '''QString firstVisualReferenceLine(const QString &statement)\n{\n    const QStringList lines = statement.split(\n        QRegularExpression(QStringLiteral("[\\\\r\\\\n]+")), Qt::SkipEmptyParts);\n    for (const QString &raw : lines) {\n        QString probe = raw.trimmed();\n        probe.replace(QStringLiteral("\\\\:"), QStringLiteral(":"));\n        probe.replace(QStringLiteral("\\\\_"), QStringLiteral("_"));\n        if (probe.contains(QRegularExpression(\n                QStringLiteral("(?:rave\\\\s*:|images[\\\\\\\\/])"),\n                QRegularExpression::CaseInsensitiveOption)))\n            return raw.trimmed();\n    }\n    return QString();\n}\n\nint focusedKnowledgeLineScore(const QString &line,\n                              const QStringList &specificTerms,\n                              KnowledgeQueryKind queryKind,\n                              bool asksTorque)\n{\n    const QString text = normalized(line);\n    int score = 0;\n    for (const QString &term : specificTerms) {\n        if (knowledgeTermMatches(text, term))\n            score += term.size() >= 5 ? 8 : 5;\n    }\n    if (queryKind == KnowledgeQueryKind::Pinout && hasDirectConnectorEvidence(line))\n        score += 30;\n    if (asksTorque && IaMemsConversationRouting::hasTorqueEvidence(text))\n        score += 24;\n    if (line.size() <= 260)\n        score += 3;\n    return score;\n}\n\nQString focusedKnowledgeStatement(const QString &statement,\n                                  const QStringList &specificTerms,\n                                  KnowledgeQueryKind queryKind,\n                                  bool asksTorque,\n                                  bool procedureIntent)\n{\n    const QString trimmed = statement.trimmed();\n    if (trimmed.size() <= 420 || procedureIntent)\n        return trimmed;\n\n    const QStringList lines = trimmed.split(\n        QRegularExpression(QStringLiteral("[\\\\r\\\\n]+")), Qt::SkipEmptyParts);\n    QString best;\n    int bestScore = -1;\n    for (int i = 0; i < lines.size(); ++i) {\n        const QString line = lines.at(i).trimmed();\n        const int score = focusedKnowledgeLineScore(line, specificTerms, queryKind, asksTorque);\n        if (score > bestScore) {\n            bestScore = score;\n            best = line;\n        }\n        if (i + 1 < lines.size()\n            && line.size() + lines.at(i + 1).trimmed().size() <= 420) {\n            const QString pair = line + QLatin1Char(' ') + lines.at(i + 1).trimmed();\n            const int pairScore = focusedKnowledgeLineScore(pair, specificTerms, queryKind, asksTorque);\n            if (pairScore > bestScore) {\n                bestScore = pairScore;\n                best = pair;\n            }\n        }\n    }\n    if (bestScore < 8 || best.isEmpty())\n        return trimmed;\n    const QString visual = firstVisualReferenceLine(trimmed);\n    if (!visual.isEmpty() && !best.contains(visual))\n        best += QLatin1Char('\\n') + visual;\n    return best;\n}\n\n''' + marker
          replace_once(path, marker, helper)

          old = '''    const bool asksTorque = containsAny(questionText, {\n        QStringLiteral("couple"), QStringLiteral("serrage"), QStringLiteral("torque")\n    });\n    const QStringList terms = knowledgeTerms(question);\n'''
          new = '''    const bool asksTorque = containsAny(questionText, {\n        QStringLiteral("couple"), QStringLiteral("serrage"), QStringLiteral("torque")\n    });\n    const bool procedureIntent = containsAny(questionText, {\n        QStringLiteral("depose"), QStringLiteral("repose"), QStringLiteral("procedure"),\n        QStringLiteral("remove"), QStringLiteral("refit"), QStringLiteral("remplacement")\n    });\n    const QStringList terms = knowledgeTerms(question);\n'''
          replace_once(path, old, new)

          old = '''        if (queryKind == KnowledgeQueryKind::WireColor)\n            candidate.score += 24;\n        else if (queryKind == KnowledgeQueryKind::Pinout)\n            candidate.score += 16;\n'''
          new = '''        if (queryKind == KnowledgeQueryKind::WireColor)\n            candidate.score += 24;\n        else if (queryKind == KnowledgeQueryKind::Pinout) {\n            candidate.score += 16;\n            candidate.score += hasDirectConnectorEvidence(fact.statement) ? 30 : -6;\n        }\n        if (fact.statement.size() > 5000)\n            candidate.score -= 16;\n        else if (fact.statement.size() > 1800)\n            candidate.score -= 8;\n'''
          replace_once(path, old, new)

          old = '''    const int maximum = qMin(queryKind == KnowledgeQueryKind::General ? 3 : 4, ranked.size());\n'''
          new = '''    const int maximum = qMin(asksTorque ? 2\n                                 : (queryKind == KnowledgeQueryKind::General ? 2 : 4),\n                             ranked.size());\n'''
          replace_once(path, old, new)

          old = '''        QString answer = fact.statement.trimmed();\n'''
          new = '''        QString answer = focusedKnowledgeStatement(\n            fact.statement, specificTerms, queryKind, asksTorque, procedureIntent);\n'''
          replace_once(path, old, new)

          old = '''        QString line = QStringLiteral("• %1").arg(fact.statement.trimmed());\n'''
          new = '''        const QString focused = focusedKnowledgeStatement(\n            fact.statement, specificTerms, queryKind, asksTorque, procedureIntent);\n        QString line = QStringLiteral("• %1").arg(focused);\n'''
          replace_once(path, old, new)
          old = '''                line = QStringLiteral("• %1 — %2").arg(role, fact.statement.trimmed());\n'''
          new = '''                line = QStringLiteral("• %1 — %2").arg(role, focused);\n'''
          replace_once(path, old, new)

          # Response-linked image resolver: unescape Markdown underscore and consult manifest diagrams.
          path = 'expert/IaMemsDiagramCatalog.cpp'
          old = '''    referenceText.replace(QStringLiteral("\\\\:"), QStringLiteral(":"));\n    referenceText.replace(QLatin1Char('\\\\'), QLatin1Char('/'));\n'''
          new = '''    referenceText.replace(QStringLiteral("\\\\:"), QStringLiteral(":"));\n    referenceText.replace(QStringLiteral("\\\\_"), QStringLiteral("_"));\n    referenceText.replace(QLatin1Char('\\\\'), QLatin1Char('/'));\n'''
          replace_once(path, old, new)

          old = '''    return none;\n}\n\nIaMemsDiagramSuggestion runtimeSuggestion(const QString &question,\n'''
          new = '''    QFile manifest(QDir(root).filePath(QStringLiteral("manifest.json")));\n    if (manifest.open(QIODevice::ReadOnly)) {\n        QJsonParseError manifestError;\n        const QJsonDocument manifestDocument =\n            QJsonDocument::fromJson(manifest.readAll(), &manifestError);\n        if (manifestError.error == QJsonParseError::NoError && manifestDocument.isObject()) {\n            const QJsonObject diagrams =\n                manifestDocument.object().value(QStringLiteral("diagrams")).toObject();\n\n            QStringList requestedPaths;\n            const QRegularExpression pathRx(\n                QStringLiteral("(images/[A-Za-z0-9_./-]+\\\\.(?:png|svg|jpe?g|webp))"),\n                QRegularExpression::CaseInsensitiveOption);\n            QRegularExpressionMatchIterator pathMatches = pathRx.globalMatch(referenceText);\n            while (pathMatches.hasNext())\n                requestedPaths.append(QDir::cleanPath(pathMatches.next().captured(1)));\n\n            const QRegularExpression structuredRx(\n                QStringLiteral("(?:^|[^A-Za-z0-9_])rave\\\\s*:\\\\s*([A-Za-z0-9_-]+)\\\\s*:\\\\s*pdf\\\\s*:\\\\s*([0-9]+)"),\n                QRegularExpression::CaseInsensitiveOption);\n            QRegularExpressionMatchIterator structuredMatches = structuredRx.globalMatch(referenceText);\n            while (structuredMatches.hasNext()) {\n                const QRegularExpressionMatch match = structuredMatches.next();\n                requestedPaths.append(QStringLiteral("images/rave/%1_PDF_%2.png")\n                    .arg(match.captured(1))\n                    .arg(match.captured(2).toInt(), 3, 10, QLatin1Char('0')));\n            }\n\n            for (const QString &requestedPath : requestedPaths) {\n                for (auto it = diagrams.constBegin(); it != diagrams.constEnd(); ++it) {\n                    const QString declaredPath = QDir::cleanPath(it.value().toString().trimmed());\n                    if (declaredPath.compare(requestedPath, Qt::CaseInsensitive) != 0)\n                        continue;\n                    const IaMemsDiagramSuggestion candidate =\n                        resolvePath(root, it.key().trimmed(), declaredPath, true);\n                    if (candidate.isValid())\n                        return candidate;\n                }\n            }\n        }\n    }\n\n    return none;\n}\n\nIaMemsDiagramSuggestion runtimeSuggestion(const QString &question,\n'''
          replace_once(path, old, new)

          # Self-tests for Markdown-escaped path + manifest structured fallback.
          path = 'expert/IaMemsDiagramSelfTest.cpp'
          old = '''    const QByteArray traversalBytes("PNG-OUTSIDE-ROOT\\n");\n'''
          new = '''    const QByteArray traversalBytes("PNG-OUTSIDE-ROOT\\n");\n    const QByteArray manifestBytes("PNG-AKM7169-INJECTOR\\n");\n'''
          replace_once(path, old, new)
          old = '''        || !writeFile(QDir(temporary.path()).filePath(QStringLiteral("../outside.png")), traversalBytes)) {\n'''
          new = '''        || !writeFile(QDir(temporary.path()).filePath(QStringLiteral("../outside.png")), traversalBytes)\n        || !writeFile(QDir(temporary.path()).filePath(\n                          QStringLiteral("images/rave/AKM7169ENG_PDF_133.png")), manifestBytes)) {\n'''
          replace_once(path, old, new)

          old = '''    bool ok = true;\n    ok = requireSuggestion(\n'''
          new = '''    QJsonObject manifestDiagrams;\n    manifestDiagrams.insert(QStringLiteral("RAVE AKM7169ENG PDF 133"),\n                            QStringLiteral("images/rave/AKM7169ENG_PDF_133.png"));\n    QJsonObject manifestRoot;\n    manifestRoot.insert(QStringLiteral("diagrams"), manifestDiagrams);\n    if (!writeFile(QDir(temporary.path()).filePath(QStringLiteral("manifest.json")),\n                   QJsonDocument(manifestRoot).toJson(QJsonDocument::Indented))) {\n        printLine(QStringLiteral("FAIL cannot write response manifest fixture"));\n        return false;\n    }\n\n    bool ok = true;\n    ok = requireSuggestion(\n'''
          replace_once(path, old, new)

          old = '''    ok = requireNoResponseSuggestion(\n             temporary.path(),\n             QStringLiteral("A response without any packaged image reference."),\n             QStringLiteral("response without visual reference")) && ok;\n'''
          new = '''    ok = requireResponseSuggestion(\n             temporary.path(),\n             QStringLiteral("Illustration locale: images/rave/AKM7169ENG\\\\_PDF\\\\_133.PNG"),\n             QStringLiteral("RAVE AKM7169ENG PDF 133"),\n             QStringLiteral("images/rave/AKM7169ENG_PDF_133.png"),\n             QStringLiteral("manifest path Markdown escapes")) && ok;\n    ok = requireResponseSuggestion(\n             temporary.path(),\n             QStringLiteral("Illustration locale: rave:AKM7169ENG:PDF:133"),\n             QStringLiteral("RAVE AKM7169ENG PDF 133"),\n             QStringLiteral("images/rave/AKM7169ENG_PDF_133.png"),\n             QStringLiteral("manifest structured response fallback")) && ok;\n    ok = requireNoResponseSuggestion(\n             temporary.path(),\n             QStringLiteral("Illustration locale: images/rave/UNDECLARED.PNG"),\n             QStringLiteral("undeclared explicit response image")) && ok;\n    ok = requireNoResponseSuggestion(\n             temporary.path(),\n             QStringLiteral("A response without any packaged image reference."),\n             QStringLiteral("response without visual reference")) && ok;\n'''
          replace_once(path, old, new)

          # UI: stale response image must not survive; fit large raster/SVG to dialog initially.
          path = 'iamemstab.cpp'
          old = '''#include <QHBoxLayout>\n'''
          new = '''#include <QHBoxLayout>\n#include <QImageReader>\n'''
          replace_once(path, old, new)

          marker = '''} // namespace\n\nIaMemsTab::IaMemsTab(MainWindow *mainWindow, QWidget *parent)\n'''
          helper = '''bool responseMentionsLocalVisualReference(QString text)\n{\n    text.replace(QStringLiteral("\\\\:"), QStringLiteral(":"));\n    text.replace(QStringLiteral("\\\\_"), QStringLiteral("_"));\n    static const QRegularExpression rx(\n        QStringLiteral("(?:rave\\\\s*:[A-Za-z0-9_-]+\\\\s*:\\\\s*pdf\\\\s*:\\\\s*[0-9]+|images[\\\\\\\\/][^\\\\s]+\\\\.(?:png|svg|jpe?g|webp))"),\n        QRegularExpression::CaseInsensitiveOption);\n    return rx.match(text).hasMatch();\n}\n\n} // namespace\n\nIaMemsTab::IaMemsTab(MainWindow *mainWindow, QWidget *parent)\n'''
          replace_once(path, marker, helper)

          old = '''    const QString localUrl = QUrl::fromLocalFile(fileInfo.canonicalFilePath())\n                                 .toString()\n                                 .toHtmlEscaped();\n    const QString title = suggestion.key.toHtmlEscaped();\n    browser->setHtml(QStringLiteral(\n        "<style>body{background:#0a1015;color:#dce3e8;font-family:'Segoe UI',Arial,sans-serif;}"\n        "h1{color:#ff9828;font-size:16pt;margin:0 0 10px 0;}"\n        ".diagram{background:#0d151b;border:1px solid #34414b;padding:10px;text-align:center;}"\n        ".diagram img{max-width:100%;height:auto;}</style>"\n        "<h1>%1</h1><div class='diagram'><img src='%2'></div>")\n        .arg(title, localUrl));\n'''
          new = '''    const QString localUrl = QUrl::fromLocalFile(fileInfo.canonicalFilePath())\n                                 .toString()\n                                 .toHtmlEscaped();\n    const QString title = suggestion.key.toHtmlEscaped();\n    QImageReader imageReader(fileInfo.canonicalFilePath());\n    const QSize sourceSize = imageReader.size();\n    const QSize available(qMax(120, viewer.width() - 60),\n                          qMax(120, viewer.height() - 150));\n    const QSize fitted = sourceSize.isValid()\n        ? sourceSize.scaled(available, Qt::KeepAspectRatio)\n        : QSize();\n    const QString imageTag = fitted.isValid()\n        ? QStringLiteral("<img src='%1' width='%2' height='%3'>")\n              .arg(localUrl).arg(fitted.width()).arg(fitted.height())\n        : QStringLiteral("<img src='%1' style='max-width:100%;height:auto;'>").arg(localUrl);\n    browser->setHtml(QStringLiteral(\n        "<style>body{background:#0a1015;color:#dce3e8;font-family:'Segoe UI',Arial,sans-serif;}"\n        "h1{color:#ff9828;font-size:16pt;margin:0 0 10px 0;}"\n        ".diagram{background:#0d151b;border:1px solid #34414b;padding:10px;text-align:center;}</style>"\n        "<h1>%1</h1><div class='diagram'>%2</div>")\n        .arg(title, imageTag));\n'''
          replace_once(path, old, new)

          old = '''    if (responseSuggestion.isValid() && m_diagramButton) {\n        m_diagramTitle = responseSuggestion.key;\n        m_diagramQuestion = text;\n        m_diagramButton->setText(I18n::text(99006));\n        m_diagramButton->setVisible(true);\n    }\n'''
          new = '''    if (responseSuggestion.isValid() && m_diagramButton) {\n        m_diagramTitle = responseSuggestion.key;\n        m_diagramQuestion = text;\n        m_diagramButton->setText(I18n::text(99006));\n        m_diagramButton->setVisible(true);\n    } else if (m_diagramButton && responseMentionsLocalVisualReference(text)) {\n        m_diagramTitle.clear();\n        m_diagramQuestion.clear();\n        m_diagramButton->setText(QString());\n        m_diagramButton->setVisible(false);\n    }\n'''
          replace_once(path, old, new)
          PY

          git diff --check
          git diff --stat
          grep -F 'fuzzyKnowledgeTermMatches' expert/IaMemsService.cpp
          grep -F 'AKM7169ENG\\_PDF\\_133.PNG' expert/IaMemsDiagramSelfTest.cpp
          grep -F 'responseMentionsLocalVisualReference' iamemstab.cpp
      - name: Commit direct source correction
        shell: bash
        run: |
          git config user.name "mini56"
          git config user.email "48644212+mini56@users.noreply.github.com"
          git add expert/IaMemsService.cpp expert/IaMemsDiagramCatalog.cpp expert/IaMemsDiagramSelfTest.cpp iamemstab.cpp
          git commit -m "Improve IA answer focus and response-linked images"
          git push origin tmp-ravemems-ia-visual-integration
