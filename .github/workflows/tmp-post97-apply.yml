name: TEMP POST97 APPLY

on:
  push:
    branches: [tmp-ia-post97-audit-fix]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'TEMP apply post97 fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-ia-post97-audit-fix
      - name: Apply targeted fixes
        run: python tools/apply_tmp_post97_fix.py
      - name: Commit candidate changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/MemsReferenceSheetRenderer.h database/MemsDatabaseBrowser.cpp iamemstab.cpp iamemstab.h expert/IaMemsConversationRouting.h expert/IaMemsService.cpp expert/LocalAiClient.cpp expert/IaResponseLogicTest.cpp expert/LocalAiOnnxSelfTest.cpp
          git commit -m "TEMP apply post97 fixes"
          git push origin HEAD:tmp-ia-post97-audit-fix
