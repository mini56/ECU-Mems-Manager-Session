name: AUDIT - MEMS documentaire SQLite unifiee

on:
  push:
    branches: [audit-ia-mems-acces-sqlite-20261111]
    paths:
      - '.github/workflows/audit-documentary-sqlite.yml'
      - 'database/MemsDocumentaryRepository.cpp'
      - 'database/MemsDocumentaryRepository.h'
      - 'database/MemsDocumentaryRepositorySelfTest.cpp'
      - 'database/MemsDatabaseExplorerV2.cpp'
      - 'expert/IaMemsLibraryIntegration.cpp'
      - 'expert/IaMemsDocumentaryPipeline.cpp'
      - 'expert/LocalAiClient.cpp'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-query-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compiler le vrai lecteur documentaire Qt en C++ sans Setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ pkg-config qtbase5-dev libqt5sql5-sqlite libqt5charts5-dev libqt5serialport5-dev
          g++ -std=c++17 -Wall -Wextra -Werror -fPIC -DMEMS_DOCUMENTARY_SELFTEST=1 \
            database/MemsDocumentaryRepository.cpp \
            database/MemsDocumentaryRepositorySelfTest.cpp \
            -o /tmp/mems_documentary_selftest \
            $(pkg-config --cflags --libs Qt5Core Qt5Sql)
          /tmp/mems_documentary_selftest
          echo 'Native SQLite source-validation selftest passed'
      - name: Verifier la compilation des vrais fichiers consommateurs sans executable Windows
        run: |
          for source in \
            database/MemsDatabaseExplorerV2.cpp \
            expert/IaMemsDocumentaryPipeline.cpp \
            expert/IaMemsLibraryIntegration.cpp \
            expert/LocalAiClient.cpp; do
            echo "C++: $source"
            g++ -std=c++17 -fPIC -fsyntax-only -I. \
              $(pkg-config --cflags Qt5Core Qt5Widgets Qt5Sql Qt5Network Qt5Charts Qt5SerialPort) \
              "$source"
          done
      - name: Controler les deux usages et le routage IA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          reader = Path('database/MemsDocumentaryRepository.cpp').read_text()
          ui = Path('database/MemsDatabaseExplorerV2.cpp').read_text()
          ai = Path('expert/IaMemsLibraryIntegration.cpp').read_text()
          router = Path('expert/IaMemsDocumentaryPipeline.cpp').read_text()
          local = Path('expert/LocalAiClient.cpp').read_text()
          cmake = Path('CMakeLists.txt').read_text()
          checks = {
              'same_repository_read_by_both': (
                  'MemsDocumentaryRepository corpus;' in ui
                  and 'MemsDocumentaryRepository documentary;' in ai
                  and 'MemsDocumentaryRepository::isPackInstalled()' in router
              ),
              'old_documentary_no_longer_mixed': (
                  'row.value(QStringLiteral("category")).toString()==QStringLiteral("documentation")' in ui
                  and 'return rows;' in ui
              ),
              'no_silent_fallback_on_missing_document': (
                  'Aucune autre base ne sera utilisée comme remplacement silencieux.' in ai
                  and 'Aucune information correspondante' in ai
              ),
              'ocr_never_implicitly_approved': (
                  'approved_for_ai' in reader
                  and 'TECHNICAL_REVIEW_PENDING' in reader
              ),
              'hardcoded_responses_do_not_override_grounding': (
                  'forcedGrounded || hasDocumentaryEvidence' in local
              ),
              'diagnostic_still_uses_expert_path': (
                  'explicitDocumentaryRequest || !diagnosticRequest' in ai
              ),
              'production_file_location_is_fixed': (
                  '#ifdef MEMS_DOCUMENTARY_SELFTEST' in reader
                  and 'database/documentary/rover_482.sqlite' in reader
              ),
              'real_cpp_is_compiled': (
                  'database/MemsDocumentaryRepository.cpp' in cmake
                  and 'database/MemsDocumentaryRepositorySelfTest.cpp' in cmake
              ),
          }
          for name, ok in checks.items():
              print(name, 'PASS' if ok else 'FAIL')
          if not all(checks.values()):
              raise SystemExit('UNIFIED_DOCUMENTARY_RUNTIME_WIRING_INCOMPLETE')
          print('MEMS_DOCUMENTARY_STATIC_CONTRACT_OK')
          PY
