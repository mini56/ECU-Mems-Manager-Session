name: TEMP POST98 FIX DRIVER

on:
  push:
    branches: [tmp-post98-realtest-fixes]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'TEMP fix post98 driver matching'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-post98-realtest-fixes
          fetch-depth: 0
      - name: Apply focused post98 fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit('TARGET MISSING ' + path + ' :: ' + old[:120].replace('\n',' '))
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          def regex_once(path, pattern, repl):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              out, count = re.subn(pattern, repl, s, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit('REGEX TARGET count=' + str(count) + ' ' + path + ' :: ' + pattern[:120])
              p.write_text(out, encoding='utf-8')

          # Shared, directly testable routing helpers.
          replace_once('expert/IaMemsConversationRouting.h',
                       '#include <QRegularExpression>\n',
                       '#include <QRegularExpression>\n#include <QSet>\n')
          marker = 'inline bool needsInductionClarification(const QString &question)\n{\n'
          helpers = r'''inline bool explicitVariantLabelsCompatible(const QString &question, const QString &factScopeText)
          {
              const QString requestedInduction = explicitInduction(question);
              const QString fact = normalize(factScopeText);
              const bool factSpi = containsWord(fact, QStringLiteral("spi"));
              const bool factMpi = containsWord(fact, QStringLiteral("mpi"));
              if (requestedInduction == QStringLiteral("SPi") && factMpi && !factSpi)
                  return false;
              if (requestedInduction == QStringLiteral("MPi") && factSpi && !factMpi)
                  return false;

              const QString requested = normalize(question);
              const bool wantsJapan = requested.contains(QStringLiteral("japan"))
                  || requested.contains(QStringLiteral("japon"));
              const bool wantsEurope = requested.contains(QStringLiteral("europe"));
              const bool wantsUk = containsWord(requested, QStringLiteral("uk"))
                  || requested.contains(QStringLiteral("royaume uni"))
                  || requested.contains(QStringLiteral("britannique"));
              const bool factJapan = fact.contains(QStringLiteral("japan"))
                  || fact.contains(QStringLiteral("japon"));
              const bool factEurope = fact.contains(QStringLiteral("europe"));
              const bool factUk = containsWord(fact, QStringLiteral("uk"))
                  || fact.contains(QStringLiteral("royaume uni"));
              if (wantsJapan && (factEurope || factUk) && !factJapan)
                  return false;
              if ((wantsEurope || wantsUk) && factJapan && !factEurope && !factUk)
                  return false;
              return true;
          }

          inline bool isKnowledgeContextQualifier(const QString &term)
          {
              const QString value = normalize(term);
              static const QSet<QString> qualifiers = {
                  QStringLiteral("spi"), QStringLiteral("mpi"), QStringLiteral("monopoint"),
                  QStringLiteral("multipoint"), QStringLiteral("japan"), QStringLiteral("japon"),
                  QStringLiteral("europe"), QStringLiteral("europeen"), QStringLiteral("uk"),
                  QStringLiteral("automatic"), QStringLiteral("automatique"), QStringLiteral("manual"),
                  QStringLiteral("manuelle"), QStringLiteral("mini"), QStringLiteral("97my"),
                  QStringLiteral("1993"), QStringLiteral("1994"), QStringLiteral("1995"),
                  QStringLiteral("1996"), QStringLiteral("1997"), QStringLiteral("1998"),
                  QStringLiteral("1999"), QStringLiteral("2000")
              };
              return qualifiers.contains(value);
          }

          inline bool hasDirectWireColourEvidence(const QString &factText)
          {
              const QString text = normalize(factText);
              if (containsAny(text, {
                      QStringLiteral("wire_color"), QStringLiteral("wire color"),
                      QStringLiteral("wire colour"), QStringLiteral("couleur de fil"),
                      QStringLiteral("couleur du fil"), QStringLiteral("couleur des fils"),
                      QStringLiteral("couleur fil"), QStringLiteral("code couleur")
                  }))
                  return true;
              const bool mentionsWire = containsWord(text, QStringLiteral("fil"))
                  || containsWord(text, QStringLiteral("fils"))
                  || containsWord(text, QStringLiteral("wire"));
              const bool mentionsColour = containsAny(text, {
                  QStringLiteral("noir"), QStringLiteral("blanc"), QStringLiteral("vert"),
                  QStringLiteral("bleu"), QStringLiteral("rouge"), QStringLiteral("jaune"),
                  QStringLiteral("rose"), QStringLiteral("violet"), QStringLiteral("gris"),
                  QStringLiteral("orange"), QStringLiteral("marron"), QStringLiteral("black"),
                  QStringLiteral("white"), QStringLiteral("green"), QStringLiteral("blue"),
                  QStringLiteral("red"), QStringLiteral("yellow"), QStringLiteral("pink"),
                  QStringLiteral("purple"), QStringLiteral("grey"), QStringLiteral("gray"),
                  QStringLiteral("brown")
              });
              return mentionsWire && mentionsColour;
          }

          inline bool hasTorqueEvidence(const QString &factText)
          {
              const QString text = normalize(factText);
              return text.contains(QStringLiteral(" nm"))
                  || text.contains(QStringLiteral("serrer"))
                  || text.contains(QStringLiteral("serrage"))
                  || text.contains(QStringLiteral("torque"));
          }

          inline QString knowledgeStatementSignature(const QString &statement)
          {
              return normalize(statement);
          }

          '''
          replace_once('expert/IaMemsConversationRouting.h', marker, helpers + marker)

          # Service: reject incompatible explicit primary scope before legacy notes can dilute it.
          regex_once('expert/IaMemsService.cpp',
                     r'bool hasWireColorEvidence\(const QString &text\)\n\{.*?\n\}',
                     'bool hasWireColorEvidence(const QString &text)\n{\n    return IaMemsConversationRouting::hasDirectWireColourEvidence(text);\n}')
          replace_once('expert/IaMemsService.cpp',
                       'bool factMatchesScopeRequest(const ExpertFact &fact, const KnowledgeScopeRequest &request)\n{\n    const QString structuredScope = normalized(fact.notes);\n    const QString explicitScope = normalized(QStringLiteral("%1 %2 %3 %4 %5")\n        .arg(fact.factKey, fact.topic, fact.statement, fact.notes, fact.family));\n',
                       'bool factMatchesScopeRequest(const ExpertFact &fact,\n                             const KnowledgeScopeRequest &request,\n                             const QString &questionText)\n{\n    const QString structuredScope = normalized(fact.notes);\n    const QString primaryScope = normalized(QStringLiteral("%1 %2 %3 %4")\n        .arg(fact.factKey, fact.topic, fact.statement, fact.firmware));\n    if (!IaMemsConversationRouting::explicitVariantLabelsCompatible(questionText, primaryScope))\n        return false;\n\n    const QString explicitScope = normalized(QStringLiteral("%1 %2 %3 %4 %5")\n        .arg(fact.factKey, fact.topic, fact.statement, fact.notes, fact.family));\n')
          regex_once('expert/IaMemsService.cpp',
                     r'bool scopeQualifierTerm\(const QString &term\)\n\{.*?\n\}',
                     'bool scopeQualifierTerm(const QString &term)\n{\n    return IaMemsConversationRouting::isKnowledgeContextQualifier(term);\n}')
          regex_once('expert/IaMemsService.cpp',
                     r'if \(kind == KnowledgeQueryKind::WireColor\) \{\n\s*return term == QStringLiteral\("couleur"\).*?;\n\s*\}',
                     'if (kind == KnowledgeQueryKind::WireColor) {\n        return term == QStringLiteral("couleur") || term == QStringLiteral("color")\n            || term == QStringLiteral("colour") || term == QStringLiteral("wire")\n            || term == QStringLiteral("wiring") || term == QStringLiteral("fil")\n            || term == QStringLiteral("fils") || term == QStringLiteral("sonde")\n            || term == QStringLiteral("capteur");\n    }')
          replace_once('expert/IaMemsService.cpp',
                       '    const bool explicitEct = containsWord(questionText, QStringLiteral("ect"));\n    const bool explicitIat = containsWord(questionText, QStringLiteral("iat"));\n    const QStringList terms = knowledgeTerms(question);\n',
                       '    const bool explicitEct = containsWord(questionText, QStringLiteral("ect"));\n    const bool explicitIat = containsWord(questionText, QStringLiteral("iat"));\n    const bool asksTorque = containsAny(questionText, {\n        QStringLiteral("couple"), QStringLiteral("serrage"), QStringLiteral("torque")\n    });\n    const QStringList terms = knowledgeTerms(question);\n')
          replace_once('expert/IaMemsService.cpp',
                       '        if (!factMatchesScopeRequest(fact, requestedScope))\n            continue;\n',
                       '        if (!factMatchesScopeRequest(fact, requestedScope, questionText))\n            continue;\n')
          replace_once('expert/IaMemsService.cpp',
                       "        const QString searchable = identity + QLatin1Char(' ') + body;\n\n        if (explicitEct && !knowledgeTermMatches(searchable, QStringLiteral(\"ect\")))\n",
                       "        const QString searchable = identity + QLatin1Char(' ') + body;\n        const QString directEvidence = normalized(QStringLiteral(\"%1 %2 %3\")\n                                                   .arg(fact.factKey, fact.topic, fact.statement));\n\n        if (explicitEct && !knowledgeTermMatches(searchable, QStringLiteral(\"ect\")))\n")
          replace_once('expert/IaMemsService.cpp',
                       '        if (queryKind == KnowledgeQueryKind::WireColor && !hasWireColorEvidence(searchable))\n            continue;\n        if (queryKind == KnowledgeQueryKind::Pinout && !hasPinoutEvidence(searchable))\n            continue;\n',
                       '        if (queryKind == KnowledgeQueryKind::WireColor && !hasWireColorEvidence(directEvidence))\n            continue;\n        if (queryKind == KnowledgeQueryKind::Pinout && !hasPinoutEvidence(searchable))\n            continue;\n        if (asksTorque && !IaMemsConversationRouting::hasTorqueEvidence(directEvidence))\n            continue;\n')
          replace_once('expert/IaMemsService.cpp',
                       "        const QString signature = normalized(candidate.fact.statement)\n            + QLatin1Char('|') + normalized(candidate.fact.family);\n",
                       '        const QString signature =\n            IaMemsConversationRouting::knowledgeStatementSignature(candidate.fact.statement);\n')

          # Make the lambda relay-only limitation explicit even if only one fact survives.
          replace_once('expert/IaMemsService.cpp',
                       '        QString answer = fact.statement.trimmed();\n        if (!fact.verificationLevel.trimmed().isEmpty())\n',
                       '        QString answer = fact.statement.trimmed();\n        if (queryKind == KnowledgeQueryKind::WireColor\n            && (questionText.contains(QStringLiteral("lambda")) || questionText.contains(QStringLiteral("oxygen")))\n            && normalized(fact.statement).contains(QStringLiteral("relais"))) {\n            answer.prepend(QStringLiteral("La base ne donne pas directement les couleurs des fils de la sonde lambda pour ce contexte. Fait de câblage vérifié le plus proche :\\n"));\n        }\n        if (!fact.verificationLevel.trimmed().isEmpty())\n')
          replace_once('expert/IaMemsService.cpp',
                       '    QStringList answers;\n    if (queryKind == KnowledgeQueryKind::WireColor)\n        answers << QStringLiteral("Couleurs de fil vérifiées les plus pertinentes :");\n    else if (queryKind == KnowledgeQueryKind::Pinout)\n',
                       '    QStringList answers;\n    bool relayOnlyLambdaWiring = queryKind == KnowledgeQueryKind::WireColor\n        && (questionText.contains(QStringLiteral("lambda")) || questionText.contains(QStringLiteral("oxygen")));\n    if (relayOnlyLambdaWiring) {\n        const int checked = qMin(4, ranked.size());\n        for (int i = 0; i < checked; ++i) {\n            if (!normalized(ranked.at(i).fact.statement).contains(QStringLiteral("relais"))) {\n                relayOnlyLambdaWiring = false;\n                break;\n            }\n        }\n    }\n    if (relayOnlyLambdaWiring)\n        answers << QStringLiteral("La base ne donne pas directement les couleurs des fils de la sonde lambda pour ce contexte. Fait de câblage vérifié le plus proche :");\n    else if (queryKind == KnowledgeQueryKind::WireColor)\n        answers << QStringLiteral("Couleurs de fil vérifiées les plus pertinentes :");\n    else if (queryKind == KnowledgeQueryKind::Pinout)\n')

          # XML: one grey enclosure around the one/two colour squares.
          replace_once('database/MemsReferenceSheetRenderer.h',
                       '"td{border-bottom:1px solid #26323b;padding:5px;vertical-align:top}.wire{font-size:14pt;line-height:10px;margin-right:2px}</style>");',
                       '"td{border-bottom:1px solid #26323b;padding:5px;vertical-align:top}.wirebox{display:inline-block;background:#555d64;border:1px solid #7a838b;padding:1px 2px;margin-right:4px;line-height:10px}.wire{font-size:14pt;line-height:10px;margin-right:1px}</style>");')
          replace_once('database/MemsReferenceSheetRenderer.h',
                       '    QString html;\n    for (const QString &fill : content.fills) {\n        html += QStringLiteral("<span class=\'wire\' style=\'color:%1\'>&#9632;</span>")\n                    .arg(fill.toHtmlEscaped());\n    }\n    QString text = content.text.simplified().toHtmlEscaped();\n',
                       '    QString html;\n    if (!content.fills.isEmpty())\n        html += QStringLiteral("<span class=\'wirebox\'>");\n    for (const QString &fill : content.fills) {\n        html += QStringLiteral("<span class=\'wire\' style=\'color:%1\'>&#9632;</span>")\n                    .arg(fill.toHtmlEscaped());\n    }\n    if (!content.fills.isEmpty())\n        html += QStringLiteral("</span>");\n    QString text = content.text.simplified().toHtmlEscaped();\n')

          # Deterministic regression tests copied from the exact real failures.
          test_marker = '    ok &= require(IaMemsConversationRouting::inductionEvidenceProbes(\n                      QStringLiteral("Broche MAP Mini"), false, QString()).isEmpty(),\n'
          tests = r'''    ok &= require(!IaMemsConversationRouting::explicitVariantLabelsCompatible(
                                QStringLiteral("Broche MAP Mini MPi 1997"),
                                QStringLiteral("RCL0194ENG gestion moteur MEMS SPi Japon 97MY")),
                            "explicit MPi rejects primary SPi Japan fact");
              ok &= require(IaMemsConversationRouting::explicitVariantLabelsCompatible(
                                QStringLiteral("Broche MAP Mini MPi 1997"),
                                QStringLiteral("RCL0194ENG capteur MAP MPi C159-8")),
                            "explicit MPi accepts primary MPi MAP fact");
              ok &= require(!IaMemsConversationRouting::explicitVariantLabelsCompatible(
                                QStringLiteral("Broche MAP Mini SPi Japan 1997"),
                                QStringLiteral("RCL0194ENG gestion moteur MEMS MPi Mini 97MY")),
                            "explicit SPi Japan rejects primary MPi fact");
              ok &= require(IaMemsConversationRouting::explicitVariantLabelsCompatible(
                                QStringLiteral("Broche MAP Mini SPi Japan 1997"),
                                QStringLiteral("RCL0194ENG gestion moteur MEMS SPi Japon 97MY")),
                            "explicit SPi Japan accepts matching primary fact");
              ok &= require(IaMemsConversationRouting::isKnowledgeContextQualifier(QStringLiteral("mini")),
                            "Mini is context and cannot make CKP/bobine relevant to MAP");
              ok &= require(!IaMemsConversationRouting::isKnowledgeContextQualifier(QStringLiteral("map")),
                            "MAP remains a required subject term");
              ok &= require(!IaMemsConversationRouting::hasDirectWireColourEvidence(
                                QStringLiteral("La sonde HO2S mesure l'oxygène et son chauffage est commandé par le relais HO2S.")),
                            "generic HO2S description is not wire-colour evidence");
              ok &= require(IaMemsConversationRouting::hasDirectWireColourEvidence(
                                QStringLiteral("Couleur de fil SPi Japon : fil BG noir/vert vers C159-36.")),
                            "actual relay wire colour is direct wire evidence");
              ok &= require(IaMemsConversationRouting::hasTorqueEvidence(
                                QStringLiteral("Serrer la sonde ECT à 15 Nm.")),
                            "ECT 15 Nm procedure is torque evidence");
              ok &= require(!IaMemsConversationRouting::hasTorqueEvidence(
                                QStringLiteral("L'ECT est une thermistance surveillée par l'ECM.")),
                            "generic ECT description is not torque evidence");
              ok &= require(IaMemsConversationRouting::knowledgeStatementSignature(QStringLiteral("  Même fait ECT. "))
                                == IaMemsConversationRouting::knowledgeStatementSignature(QStringLiteral("Même fait ECT.")),
                            "identical statements dedupe across family/source mirrors");

          '''
          replace_once('expert/IaResponseLogicTest.cpp', test_marker, tests + test_marker)
          replace_once('expert/IaResponseLogicTest.cpp',
                       '        ok &= require(rendered.contains(QStringLiteral("MAP")) && rendered.contains(QStringLiteral("Rose / Noir"))\n                      && rendered.contains(QStringLiteral("#f2a5bc")) && rendered.contains(QStringLiteral("#050505")),\n                      "custom broche/fonction/couleur XML keeps data and visual colours");\n',
                       '        ok &= require(rendered.contains(QStringLiteral("MAP")) && rendered.contains(QStringLiteral("Rose / Noir"))\n                      && rendered.contains(QStringLiteral("#f2a5bc")) && rendered.contains(QStringLiteral("#050505"))\n                      && rendered.contains(QStringLiteral("class=\'wirebox\'"))\n                      && rendered.contains(QStringLiteral("background:#555d64")),\n                      "custom XML keeps colours inside grey wire enclosure");\n')

          print('POST98_PATCH_APPLIED')
      - name: Commit focused fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add expert/IaMemsConversationRouting.h expert/IaMemsService.cpp expert/IaResponseLogicTest.cpp database/MemsReferenceSheetRenderer.h
          git commit -m "Fix post98 knowledge filtering and wire rendering"
          git push origin HEAD:tmp-post98-realtest-fixes
