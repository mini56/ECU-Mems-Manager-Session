name: Generate Andrew Revill MEMSTools knowledge

on:
  workflow_dispatch:
  push:
    branches: ["lab-andrew-revill-knowledge"]
    paths:
      - "tools/build_memstools_enrichment.py"
      - "tools/validate_memstools_enrichment.py"
      - ".github/workflows/generate-andrew-revill-knowledge.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout laboratory branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download audited MEMSTools source archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://andrewrevill.co.uk/Downloads/MEMSTools.zip" \
            --output "$RUNNER_TEMP/MEMSTools.zip"
          echo "f652c214641c0c5ffb3d379fe8062dae818e99e5a3c2e47f31165f7ea76d5f6d  $RUNNER_TEMP/MEMSTools.zip" | sha256sum --check -

      - name: Generate reference database enrichments
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_memstools_enrichment.py \
            "$RUNNER_TEMP/MEMSTools.zip" \
            --output-dir database/reference

      - name: Validate generated knowledge
        run: python tools/validate_memstools_enrichment.py database/reference

      - name: Upload generated knowledge package
        uses: actions/upload-artifact@v4
        with:
          name: Andrew-Revill-MEMSTools-Knowledge
          path: |
            database/reference/research_enrichment_1500.qz64
            database/reference/research_enrichment_1510.qz64
            database/reference/research_enrichment_1520.qz64
            database/reference/research_enrichment_1530.qz64
            database/reference/research_enrichment_1540.qz64

      - name: Commit generated knowledge to laboratory branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            database/reference/research_enrichment_1500.qz64 \
            database/reference/research_enrichment_1510.qz64 \
            database/reference/research_enrichment_1520.qz64 \
            database/reference/research_enrichment_1530.qz64 \
            database/reference/research_enrichment_1540.qz64
          if git diff --cached --quiet; then
            echo "Knowledge package already identical; no commit required."
            exit 0
          fi
          git commit -m "Generate audited Andrew Revill knowledge [skip ci]"
          git push origin HEAD:lab-andrew-revill-knowledge

# Triggered intentionally after workflow installation so generation occurs only on the laboratory branch.
