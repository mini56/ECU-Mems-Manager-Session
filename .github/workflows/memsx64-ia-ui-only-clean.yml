name: MEMSX64 IA UI-only clean diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - MEMSX64
    paths:
      - '.github/workflows/memsx64-ia-ui-only-clean.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout MEMSX64
        uses: actions/checkout@v4
        with:
          ref: MEMSX64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        shell: pwsh
        run: python -m pip install --disable-pip-version-check aqtinstall pefile

      - name: Install Qt 5.15.2 MSVC x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtcharts -O C:\Qt
          if (-not (Test-Path 'C:\Qt\5.15.2\msvc2019_64\lib\cmake\Qt5\Qt5Config.cmake')) {
            throw 'Qt installation incomplete'
          }

      - name: Disable IA async startup only in runner workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          p = Path('iamemstab.cpp')
          s = p.read_text(encoding='utf-8')
          old = '''void IaMemsTab::showEvent(QShowEvent *event)\n{\n    QWidget::showEvent(event);\n\n    // Keep the main ECU program light: the knowledge cache and the local\n    // language model are started only when IA MEMS is actually opened.\n    QTimer::singleShot(0, this, &IaMemsTab::startKnowledgeLoad);\n    if (m_localAi)\n        QTimer::singleShot(0, m_localAi, &LocalAiClient::initialize);\n}\n'''
          new = '''void IaMemsTab::showEvent(QShowEvent *event)\n{\n    QWidget::showEvent(event);\n}\n'''
          if s.count(old) != 1:
              raise SystemExit('showEvent block not found exactly once')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('IA UI-only patch applied')
          '@ | python -

      - name: Configure x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build-ia-ui-clean -A x64 `
            -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/msvc2019_64" `
            -DMEMS_USE_BUNDLED_LIBROSCO_X64=ON `
            -DMEMS_RUN_REFERENCE_SELFTEST_POST_BUILD=OFF

      - name: Build x64
        shell: pwsh
        run: cmake --build build-ia-ui-clean --config Release --target ecu_mems_manager

      - name: Assemble portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qt = 'C:\Qt\5.15.2\msvc2019_64'
          $build = '${{ github.workspace }}\build-ia-ui-clean'
          $dist = '${{ github.workspace }}\dist-ia-ui-clean'
          if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
          New-Item -ItemType Directory -Path $dist | Out-Null

          Copy-Item (Join-Path $build 'Release\ecu_mems_manager.exe') (Join-Path $dist 'ecu_mems_manager.exe') -Force
          Copy-Item (Join-Path $build 'librosco-x64\Release\mems_manager_x64.dll') (Join-Path $dist 'mems_manager_x64.dll') -Force

          & (Join-Path $qt 'bin\windeployqt.exe') --release --compiler-runtime --no-translations --dir $dist (Join-Path $dist 'ecu_mems_manager.exe')
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed' }

          Copy-Item (Join-Path $build 'Release\translations') (Join-Path $dist 'translations') -Recurse -Force
          Copy-Item (Join-Path $build 'Release\database') (Join-Path $dist 'database') -Recurse -Force

          $sqlite = Join-Path $dist 'sqldrivers\qsqlite.dll'
          if (-not (Test-Path $sqlite)) {
            New-Item -ItemType Directory -Force (Split-Path $sqlite) | Out-Null
            Copy-Item (Join-Path $qt 'plugins\sqldrivers\qsqlite.dll') $sqlite -Force
          }

          if (Test-Path (Join-Path $dist 'ai')) { Remove-Item (Join-Path $dist 'ai') -Recurse -Force }

          @(
            'ECU MEMS MANAGER x64 - IA UI ONLY',
            'BUILD #${{ github.run_number }}',
            'Run ID: ${{ github.run_id }}',
            'Knowledge loading disabled.',
            'Local AI initialization disabled.',
            'Open IA MEMS and wait 20 seconds.',
            'Expected diagnostic result: application remains open.'
          ) | Set-Content -Encoding UTF8 (Join-Path $dist 'BUILD_INFO.txt')

      - name: Validate package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DIST = '${{ github.workspace }}\dist-ia-ui-clean'
          @'
          import os
          import pathlib
          import pefile
          root = pathlib.Path(os.environ['DIST'])
          required = [
              root/'ecu_mems_manager.exe',
              root/'mems_manager_x64.dll',
              root/'Qt5Core.dll',
              root/'Qt5Gui.dll',
              root/'Qt5Widgets.dll',
              root/'Qt5Sql.dll',
              root/'Qt5Network.dll',
              root/'platforms'/'qwindows.dll',
              root/'sqldrivers'/'qsqlite.dll',
              root/'database'/'reference'/'manifest.json',
              root/'BUILD_INFO.txt',
          ]
          missing = [str(x.relative_to(root)) for x in required if not x.exists() or x.stat().st_size == 0]
          if missing:
              raise SystemExit('Missing: ' + ', '.join(missing))
          for x in (root/'ecu_mems_manager.exe', root/'mems_manager_x64.dll'):
              pe = pefile.PE(str(x), fast_load=True)
              if pe.FILE_HEADER.Machine != 0x8664 or pe.OPTIONAL_HEADER.Magic != 0x20B:
                  raise SystemExit(x.name + ' is not AMD64')
          print('Clean IA UI-only package validated')
          '@ | python -

      - name: Smoke launch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = '${{ github.workspace }}\dist-ia-ui-clean'
          $p = Start-Process (Join-Path $dist 'ecu_mems_manager.exe') -WorkingDirectory $dist -PassThru
          Start-Sleep -Seconds 6
          if ($p.HasExited) { throw "Application exited during smoke launch: $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ECU-MEMS-Manager-x64-IA-UI-ONLY-BUILD-${{ github.run_number }}
          path: dist-ia-ui-clean/
          if-no-files-found: error
          compression-level: 0
