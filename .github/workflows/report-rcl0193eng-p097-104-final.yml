name: REPORT RCL0193ENG P097-104 FINAL

on:
  push:
    branches:
      - RAPPORT
    paths:
      - '.github/workflows/report-rcl0193eng-p097-104-final.yml'

permissions:
  contents: write

jobs:
  append-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Append final checkpoint
        env:
          REPORT_APPEND_B64: ''
        run: |
          python -c "import os,base64; open('RAPPORT_SUIVI_ECU_MEMS_MANAGER.md','ab').write(base64.b64decode(os.environ['REPORT_APPEND_B64']))"
      - name: Remove helper and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/report-rcl0193eng-p097-104-final.yml'
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git commit -m 'Checkpoint RCL0193ENG pages 97-104 final'
          git push origin HEAD:RAPPORT
