name: REPORT RCL0193ENG P147-160 BEFORE SQUASH

on:
  push:
    branches: [RAPPORT]
    paths:
      - '.github/workflows/report-rcl0193eng-p147-160-before-squash.yml'

permissions:
  contents: write

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
      - name: Append pre-squash checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cat '.github/report-transfer/rcl0193eng-p147-160-before-squash.txt' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          rm '.github/report-transfer/rcl0193eng-p147-160-before-squash.txt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md '.github/report-transfer/rcl0193eng-p147-160-before-squash.txt'
          git commit -m 'Journal RCL0193ENG p147-160 validation before squash'
          git push origin HEAD:RAPPORT
