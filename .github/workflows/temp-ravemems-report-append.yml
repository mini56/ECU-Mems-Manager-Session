name: TEMP RAVEMEMS REPORT APPEND V2

on: [push]

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Append report entry
        run: python tools/temp_append_ravemems_test2_report.py
      - name: Commit report and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions-bot
          git config user.email github-actions@users.noreply.github.com
          git rm .github/workflows/temp-ravemems-report-append.yml .ravemems-report-trigger tools/temp_append_ravemems_test2_report.py
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          expected="$(printf '%s\n' '.github/workflows/temp-ravemems-report-append.yml' '.ravemems-report-trigger' 'RAPPORT_SUIVI_ECU_MEMS_MANAGER.md' 'tools/temp_append_ravemems_test2_report.py' | sort)"
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$expected"
          git commit -m "Record RAVEMEMS TEST2 run 1 failure"
          git push origin HEAD:RAPPORT
