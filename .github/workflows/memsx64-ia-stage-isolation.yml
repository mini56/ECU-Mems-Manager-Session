name: MEMSX64 IA staged crash isolation

on:
  workflow_dispatch:
  push:
    branches: [MEMSX64]
    paths:
      - '.github/workflows/memsx64-ia-stage-isolation.yml'

permissions:
  contents: write

jobs:
  build-ia-stage-isolation:
    runs-on: windows-latest

    steps:
      - name: Checkout MEMSX64
        uses: actions/checkout@v4
        with:
          ref: MEMSX64

      - name: Inject diagnostic modes and persistent trace in runner workspace only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          p = Path('iamemstab.cpp')
          s = p.read_text(encoding='utf-8')

          include_anchor = '#include <QEvent>\n'
          include_block = '#include <QEvent>\n#include <QCoreApplication>\n#include <QFile>\n'
          if s.count(include_anchor) != 1:
              raise SystemExit('QEvent include anchor not unique')
          s = s.replace(include_anchor, include_block, 1)

          namespace_anchor = 'static const int kTabPtrRole = Qt::UserRole + 60;\n\n'
          helper = r'''static const int kTabPtrRole = Qt::UserRole + 60;

QString iaDiagMode()
{
    return qEnvironmentVariable("MEMS_IA_DIAG_MODE").trimmed().toLower();
}

void iaDiagTrace(const QString &message)
{
    QFile file(QCoreApplication::applicationDirPath() + QStringLiteral("/IA_DIAG_TRACE.txt"));
    if (!file.open(QIODevice::WriteOnly | QIODevice::Append | QIODevice::Text))
        return;
    const QByteArray line = (QDateTime::currentDateTime().toString(QStringLiteral("yyyy-MM-dd HH:mm:ss.zzz"))
                             + QStringLiteral(" | ") + message + QLatin1Char('\n')).toUtf8();
    file.write(line);
    file.flush();
}

'''
          if s.count(namespace_anchor) != 1:
              raise SystemExit('namespace diagnostic anchor not unique')
          s = s.replace(namespace_anchor, helper, 1)

          ctor_anchor = '    setObjectName(QStringLiteral("ia_mems_tab"));\n'
          ctor_new = '    iaDiagTrace(QStringLiteral("IaMemsTab constructor entered"));\n    setObjectName(QStringLiteral("ia_mems_tab"));\n'
          if s.count(ctor_anchor) != 1:
              raise SystemExit('constructor anchor not unique')
          s = s.replace(ctor_anchor, ctor_new, 1)

          show_old = r'''void IaMemsTab::showEvent(QShowEvent *event)
{
    QWidget::showEvent(event);

    // Keep the main ECU program light: the knowledge cache and the local
    // language model are started only when IA MEMS is actually opened.
    QTimer::singleShot(0, this, &IaMemsTab::startKnowledgeLoad);
    if (m_localAi)
        QTimer::singleShot(0, m_localAi, &LocalAiClient::initialize);
}
'''
          show_new = r'''void IaMemsTab::showEvent(QShowEvent *event)
{
    const QString mode = iaDiagMode();
    iaDiagTrace(QStringLiteral("showEvent entered; mode=%1").arg(mode.isEmpty() ? QStringLiteral("original") : mode));
    QWidget::showEvent(event);
    iaDiagTrace(QStringLiteral("QWidget::showEvent returned"));

    // Diagnostic modes are runner-only and do not alter MEMSX64 production source.
    if (mode == QStringLiteral("ui_only")) {
        iaDiagTrace(QStringLiteral("ui_only: no knowledge load, no local AI init"));
        return;
    }

    if (mode != QStringLiteral("local_only")) {
        iaDiagTrace(QStringLiteral("scheduling knowledge load"));
        QTimer::singleShot(0, this, &IaMemsTab::startKnowledgeLoad);
    } else {
        iaDiagTrace(QStringLiteral("local_only: knowledge load disabled"));
    }

    if (mode != QStringLiteral("knowledge_only") && m_localAi) {
        iaDiagTrace(QStringLiteral("scheduling LocalAiClient::initialize"));
        QTimer::singleShot(0, m_localAi, &LocalAiClient::initialize);
    } else if (mode == QStringLiteral("knowledge_only")) {
        iaDiagTrace(QStringLiteral("knowledge_only: local AI init disabled"));
    }
    iaDiagTrace(QStringLiteral("showEvent scheduling complete"));
}
'''
          if s.count(show_old) != 1:
              raise SystemExit('showEvent block not found exactly once')
          s = s.replace(show_old, show_new, 1)

          start_old = r'''void IaMemsTab::startKnowledgeLoad()
{
    if (m_knowledgeLoading || m_knowledgeReady)
        return;

    m_knowledgeLoading = true;
    m_knowledgeError.clear();
    updateStatus();

    QPointer<IaMemsTab> guard(this);
    QThread *thread = QThread::create([guard]() {
        ExpertRuntimeDatabase reference;
        const bool ok = reference.buildOrOpen();
        const QString path = ok ? reference.databasePath() : QString();
        const QString error = ok ? QString() : reference.lastError();

        if (!guard)
            return;
        QMetaObject::invokeMethod(guard.data(), [guard, ok, path, error]() {
            if (guard)
                guard->finishKnowledgeLoad(ok, path, error);
        }, Qt::QueuedConnection);
    });
    connect(thread, &QThread::finished, thread, &QObject::deleteLater);
    thread->start();
}
'''
          start_new = r'''void IaMemsTab::startKnowledgeLoad()
{
    iaDiagTrace(QStringLiteral("startKnowledgeLoad entered; loading=%1 ready=%2")
                    .arg(m_knowledgeLoading).arg(m_knowledgeReady));
    if (m_knowledgeLoading || m_knowledgeReady) {
        iaDiagTrace(QStringLiteral("startKnowledgeLoad returned early"));
        return;
    }

    m_knowledgeLoading = true;
    m_knowledgeError.clear();
    iaDiagTrace(QStringLiteral("startKnowledgeLoad before updateStatus"));
    updateStatus();
    iaDiagTrace(QStringLiteral("startKnowledgeLoad after updateStatus"));

    QPointer<IaMemsTab> guard(this);
    iaDiagTrace(QStringLiteral("before QThread::create"));
    QThread *thread = QThread::create([guard]() {
        iaDiagTrace(QStringLiteral("knowledge worker entered"));
        ExpertRuntimeDatabase reference;
        iaDiagTrace(QStringLiteral("before ExpertRuntimeDatabase::buildOrOpen"));
        const bool ok = reference.buildOrOpen();
        iaDiagTrace(QStringLiteral("after ExpertRuntimeDatabase::buildOrOpen ok=%1 error=%2")
                        .arg(ok).arg(reference.lastError().left(300)));
        const QString path = ok ? reference.databasePath() : QString();
        const QString error = ok ? QString() : reference.lastError();

        if (!guard) {
            iaDiagTrace(QStringLiteral("knowledge worker guard lost"));
            return;
        }
        iaDiagTrace(QStringLiteral("before queued finishKnowledgeLoad invoke"));
        QMetaObject::invokeMethod(guard.data(), [guard, ok, path, error]() {
            iaDiagTrace(QStringLiteral("finishKnowledgeLoad queued lambda entered"));
            if (guard)
                guard->finishKnowledgeLoad(ok, path, error);
        }, Qt::QueuedConnection);
        iaDiagTrace(QStringLiteral("knowledge worker leaving"));
    });
    iaDiagTrace(QStringLiteral("QThread::create returned"));
    connect(thread, &QThread::finished, thread, &QObject::deleteLater);
    iaDiagTrace(QStringLiteral("before knowledge thread start"));
    thread->start();
    iaDiagTrace(QStringLiteral("after knowledge thread start"));
}
'''
          if s.count(start_old) != 1:
              raise SystemExit('startKnowledgeLoad block not found exactly once')
          s = s.replace(start_old, start_new, 1)

          finish_anchor = r'''void IaMemsTab::finishKnowledgeLoad(bool ok,
                                    const QString &databasePath,
                                    const QString &errorText)
{
'''
          finish_new = finish_anchor + r'''    iaDiagTrace(QStringLiteral("finishKnowledgeLoad entered ok=%1 path=%2 error=%3")
                    .arg(ok).arg(databasePath).arg(errorText.left(300)));
'''
          if s.count(finish_anchor) != 1:
              raise SystemExit('finishKnowledgeLoad anchor not unique')
          s = s.replace(finish_anchor, finish_new, 1)

          p.write_text(s, encoding='utf-8')
          print('runner-only IA staged diagnostics injected')
          '@ | python -

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall pefile

      - name: Install Qt 5.15.2 MSVC 2019 x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtcharts -O C:\Qt

      - name: Configure native x64 diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build-ia-stage-isolation -A x64 `
            -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/msvc2019_64" `
            -DMEMS_USE_BUNDLED_LIBROSCO_X64=ON `
            -DMEMS_RUN_REFERENCE_SELFTEST_POST_BUILD=OFF

      - name: Build native x64 diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build-ia-stage-isolation --config Release --target ecu_mems_manager

      - name: Assemble staged portable diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = 'C:\Qt\5.15.2\msvc2019_64'
          $build = '${{ github.workspace }}\build-ia-stage-isolation'
          $dist = '${{ github.workspace }}\dist-ia-stage-isolation'
          if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
          New-Item -ItemType Directory -Path $dist | Out-Null

          Copy-Item (Join-Path $build 'Release\ecu_mems_manager.exe') (Join-Path $dist 'ecu_mems_manager.exe') -Force
          Copy-Item (Join-Path $build 'librosco-x64\Release\mems_manager_x64.dll') (Join-Path $dist 'mems_manager_x64.dll') -Force
          & 'C:\Qt\5.15.2\msvc2019_64\bin\windeployqt.exe' --release --compiler-runtime --no-translations --dir $dist (Join-Path $dist 'ecu_mems_manager.exe')
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed' }

          Copy-Item (Join-Path $build 'Release\translations') (Join-Path $dist 'translations') -Recurse -Force
          Copy-Item (Join-Path $build 'Release\database') (Join-Path $dist 'database') -Recurse -Force
          if (-not (Test-Path (Join-Path $dist 'sqldrivers\qsqlite.dll'))) {
            New-Item -ItemType Directory -Force (Join-Path $dist 'sqldrivers') | Out-Null
            Copy-Item 'C:\Qt\5.15.2\msvc2019_64\plugins\sqldrivers\qsqlite.dll' (Join-Path $dist 'sqldrivers\qsqlite.dll') -Force
          }
          if (Test-Path (Join-Path $dist 'ai')) { Remove-Item (Join-Path $dist 'ai') -Recurse -Force }

          @'
          @echo off
          cd /d "%~dp0"
          del IA_DIAG_TRACE.txt 2>nul
          set MEMS_IA_DIAG_MODE=ui_only
          start "" ecu_mems_manager.exe
          '@ | Set-Content -Encoding ASCII (Join-Path $dist 'TEST_1_UI_ONLY.bat')

          @'
          @echo off
          cd /d "%~dp0"
          del IA_DIAG_TRACE.txt 2>nul
          set MEMS_IA_DIAG_MODE=local_only
          start "" ecu_mems_manager.exe
          '@ | Set-Content -Encoding ASCII (Join-Path $dist 'TEST_2_LOCAL_AI_ONLY.bat')

          @'
          @echo off
          cd /d "%~dp0"
          del IA_DIAG_TRACE.txt 2>nul
          set MEMS_IA_DIAG_MODE=knowledge_only
          start "" ecu_mems_manager.exe
          '@ | Set-Content -Encoding ASCII (Join-Path $dist 'TEST_3_KNOWLEDGE_ONLY.bat')

          @'
          @echo off
          cd /d "%~dp0"
          del IA_DIAG_TRACE.txt 2>nul
          set MEMS_IA_DIAG_MODE=
          start "" ecu_mems_manager.exe
          '@ | Set-Content -Encoding ASCII (Join-Path $dist 'TEST_4_ORIGINAL_BOTH.bat')

          @(
            'IA MEMS STAGED CRASH ISOLATION',
            'No llama runtime/model is included.',
            'Run TEST_1, open IA MEMS, wait 15 seconds, close app if stable.',
            'Then TEST_2, then TEST_3, then TEST_4.',
            'After any crash, keep IA_DIAG_TRACE.txt and send it back.',
            '1=UI only; 2=LocalAiClient only; 3=knowledge DB only; 4=original both.'
          ) | Set-Content -Encoding UTF8 (Join-Path $dist 'README_IA_DIAG.txt')

      - name: Validate staged diagnostic package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = '${{ github.workspace }}\dist-ia-stage-isolation'
          foreach ($p in @('ecu_mems_manager.exe','mems_manager_x64.dll','TEST_1_UI_ONLY.bat','TEST_2_LOCAL_AI_ONLY.bat','TEST_3_KNOWLEDGE_ONLY.bat','TEST_4_ORIGINAL_BOTH.bat','README_IA_DIAG.txt','sqldrivers\qsqlite.dll','database\reference\manifest.json')) {
            if (-not (Test-Path (Join-Path $dist $p))) { throw "missing diagnostic file: $p" }
          }
          if (Test-Path (Join-Path $dist 'ai\llama-server.exe')) { throw 'diagnostic unexpectedly contains llama runtime' }

      - name: Smoke launch UI-only mode
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = '${{ github.workspace }}\dist-ia-stage-isolation'
          $env:MEMS_IA_DIAG_MODE = 'ui_only'
          $proc = Start-Process (Join-Path $dist 'ecu_mems_manager.exe') -WorkingDirectory $dist -PassThru
          Start-Sleep -Seconds 6
          if ($proc.HasExited) { throw "UI-only diagnostic exited during basic launch: $($proc.ExitCode)" }
          Stop-Process -Id $proc.Id -Force

      - name: Upload staged IA diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECU-MEMS-Manager-x64-IA-STAGE-DIAG
          path: dist-ia-stage-isolation/
          if-no-files-found: error
          compression-level: 0

      - name: Persist staged diagnostic success marker
        shell: pwsh
        run: |
          @(
            'MEMSX64 IA STAGED DIAGNOSTIC: SUCCESS',
            'artifact=ECU-MEMS-Manager-x64-IA-STAGE-DIAG',
            'run_id=${{ github.run_id }}',
            'run_number=${{ github.run_number }}',
            'workflow_sha=${{ github.sha }}',
            ('utc=' + [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))
          ) | Set-Content -Encoding UTF8 IA_STAGE_DIAG_RESULT.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin MEMSX64
          git add IA_STAGE_DIAG_RESULT.txt
          git commit -m "Record IA staged diagnostic package [skip ci]"
          git push origin HEAD:MEMSX64
