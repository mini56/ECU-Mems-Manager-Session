name: TEMP RCL1860 PROBE
on:
  push:
    branches: [tmp-rave-visual-backfill]
    paths: ['.github/workflows/temp-rcl1860-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe historical TIFF prefix
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          import base64,lzma,hashlib,io
          from pathlib import Path
          from PIL import Image,ImageFile
          b64=Path('.rcl1860_transport/rcl0193fre_1860_g4_150.tif.xz.b64').read_bytes()
          xz=base64.b64decode(b''.join(b64.split()))
          d=lzma.LZMADecompressor()
          try:
              tif=d.decompress(xz)
          except EOFError:
              tif=b''
          print('B64_BYTES',len(b64),'XZ_PREFIX_BYTES',len(xz),'TIFF_PREFIX_BYTES',len(tif))
          print('TIFF_PREFIX_SHA',hashlib.sha256(tif).hexdigest())
          print('TIFF_HEAD_HEX',tif[:128].hex())
          Path('/tmp/hist-prefix.tif').write_bytes(tif)
          ImageFile.LOAD_TRUNCATED_IMAGES=True
          try:
              im=Image.open('/tmp/hist-prefix.tif')
              print('TIFF_OPEN',im.size,im.mode,getattr(im,'n_frames',None))
              im.seek(0)
              out=io.BytesIO(); im.copy().save(out,'PNG',optimize=True)
              print('FIRST_FRAME_PNG_SHA',hashlib.sha256(out.getvalue()).hexdigest(),'PNG_BYTES',len(out.getvalue()))
              print('FIRST_FRAME_RAW_SHA',hashlib.sha256(im.copy().tobytes()).hexdigest())
          except Exception as e:
              print('TIFF_OPEN_FAIL',type(e).__name__,repr(str(e)))
          PY
