name: TEMP finalize RAVEMEMS specification review

on:
  push:
    branches: [RAPPORT]
    paths:
      - .github/workflows/tmp-finalize-ravemems-spec-review.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
      - name: Update cahier and report
        run: python3 tools/tmp_finalize_ravemems_spec.py
      - name: Remove temporary files
        run: |
          rm tools/tmp_finalize_ravemems_spec.py
          rm .github/workflows/tmp-finalize-ravemems-spec-review.yml
      - name: Commit journal update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Validate and freeze RAVEMEMS specification
