name: TMP Restore responding LocalAiClient

on:
  push:
    branches: [tmp-build108-memslibrary-relevance-integration]
    paths:
      - '.github/workflows/tmp-restore-working-localai.yml'

permissions:
  contents: write
  actions: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-build108-memslibrary-relevance-integration
          fetch-depth: 0

      - name: Restore only LocalAiClient.cpp from last responding revision
        run: |
          set -euo pipefail
          git checkout 233854ac786777a405e55f38ddfda55b59ee2022 -- expert/LocalAiClient.cpp
          git diff --exit-code -- expert/LocalAiClient.cpp && { echo 'No LocalAiClient change to restore'; exit 1; } || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add expert/LocalAiClient.cpp
          git commit -m 'Restore last responding LocalAiClient'
          git push origin HEAD:tmp-build108-memslibrary-relevance-integration
