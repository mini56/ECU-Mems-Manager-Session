name: Apply IA MEMS deterministic source patches

on:
  push:
    branches: ["lab-expert-engine"]
    paths:
      - "tools/patch_reference_cache_revision.py"
      - "tools/patch_ia_runtime_wiring.py"
      - "tools/patch_ia_conversation_routing.py"
      - ".github/workflows/patch-ia-reference-cache.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply deterministic IA MEMS patches
        run: |
          python tools/patch_reference_cache_revision.py
          python tools/patch_ia_runtime_wiring.py
          python tools/patch_ia_conversation_routing.py

      - name: Commit patched IA MEMS sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- database/MemsReferenceDatabase.cpp iamemstab.cpp CMakeLists.txt; then
            echo "Patches already applied"
            exit 0
          fi
          git diff --check -- database/MemsReferenceDatabase.cpp iamemstab.cpp CMakeLists.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push -- database/MemsReferenceDatabase.cpp iamemstab.cpp CMakeLists.txt
          git pull --rebase origin lab-expert-engine
          git stash pop
          git add -- database/MemsReferenceDatabase.cpp iamemstab.cpp CMakeLists.txt
          git commit -m "Refine IA MEMS conversational routing [skip ci]"
          git push origin HEAD:lab-expert-engine
