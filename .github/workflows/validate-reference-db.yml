name: Validate MEMS Reference Database

on:
  push:
    branches: ["main", "master", "ui-rebuild"]
  pull_request:
    branches: ["main", "master", "ui-rebuild"]

permissions:
  contents: read

jobs:
  validate-reference-database:
    name: Validate MEMS reference database
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate qz64 packages, SQLite, resources and language coverage
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import pathlib
          import re
          import sqlite3
          import tempfile
          import xml.etree.ElementTree as ET
          import zlib

          root = pathlib.Path("database/reference")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))

          def unpack_qz64_bytes(encoded: bytes, label: str) -> bytes:
              packed = base64.b64decode(encoded.strip(), validate=True)
              if len(packed) < 5:
                  raise SystemExit(f"{label}: qz64 trop court")
              expected = int.from_bytes(packed[:4], "big")
              try:
                  raw = zlib.decompress(packed[4:])
              except zlib.error as exc:
                  raise SystemExit(f"{label}: flux zlib invalide: {exc}") from exc
              if len(raw) != expected:
                  raise SystemExit(f"{label}: {len(raw)} octets reconstruits, {expected} attendus")
              return raw

          def numeric_suffix(path: pathlib.Path) -> int:
              match = re.search(r"_(\d+)\.qz64$", path.name, re.I)
              return int(match.group(1)) if match else 0

          def execute_sql_lines(con: sqlite3.Connection, raw: bytes, label: str) -> None:
              try:
                  text = raw.decode("utf-8")
              except UnicodeDecodeError as exc:
                  raise SystemExit(f"{label}: SQL non UTF-8: {exc}") from exc
              for line_no, statement in enumerate(text.splitlines(), 1):
                  statement = statement.strip()
                  if not statement or statement.startswith("--"):
                      continue
                  try:
                      con.execute(statement)
                  except sqlite3.Error as exc:
                      raise SystemExit(f"{label}:{line_no}: SQL invalide: {exc}\n{statement}") from exc

          # Seeds: no fixed part count. Any future seed fragment is included automatically.
          seed_parts = sorted(root.glob("mems_reference_seed_*.qz64"), key=lambda p: (numeric_suffix(p), p.name))
          if not seed_parts:
              raise SystemExit("Aucun seed MEMS")
          seed_encoded = b"".join(path.read_bytes().strip() for path in seed_parts)
          seed_sql = unpack_qz64_bytes(seed_encoded, "seeds MEMS")

          # Enrichments: discover every batch recursively. The manifest is informative,
          # never a reason to silently ignore a new research_enrichment_*.qz64 file.
          enrichment_paths = sorted(root.rglob("research_enrichment*.qz64"), key=lambda p: (numeric_suffix(p), p.as_posix()))
          if not enrichment_paths:
              raise SystemExit("Aucun lot d'enrichissement MEMS")
          declared = {str(x).replace("\\", "/") for x in manifest.get("research_enrichment_batches", [])}
          discovered_names = {p.relative_to(root).as_posix() for p in enrichment_paths}
          missing_declared = declared - discovered_names
          if missing_declared:
              raise SystemExit(f"Lots déclarés mais absents: {sorted(missing_declared)}")
          enrichment_sql = [(p.relative_to(root).as_posix(), unpack_qz64_bytes(p.read_bytes(), p.as_posix())) for p in enrichment_paths]
          print("LOTS ENRICHISSEMENT:", ", ".join(label for label, _ in enrichment_sql))

          # Reference sheets: validate every qz64 XML automatically, including MEMS 1.2.
          sheet_paths = sorted((root / "fiches").glob("*.xml.qz64"))
          if not sheet_paths:
              raise SystemExit("Aucune fiche XML MEMS")
          for path in sheet_paths:
              raw = unpack_qz64_bytes(path.read_bytes(), path.as_posix())
              try:
                  ET.fromstring(raw.decode("utf-8"))
              except Exception as exc:
                  raise SystemExit(f"{path}: XML invalide: {exc}") from exc
          print("FICHES XML:", ", ".join(p.name for p in sheet_paths))

          # Assets: every supported technical resource must be non-empty. No filename list.
          supported_assets = {".svg", ".png", ".jpg", ".jpeg", ".webp", ".gif", ".pdf", ".html", ".htm", ".md", ".txt", ".csv", ".xml"}
          assets = [p for p in root.rglob("*") if p.is_file() and p.suffix.lower() in supported_assets and not p.name.endswith(".qz64")]
          for asset in assets:
              if asset.stat().st_size <= 0:
                  raise SystemExit(f"Ressource vide: {asset}")
          print(f"RESSOURCES TECHNIQUES: {len(assets)} fichier(s)")

          smoke = pathlib.Path(tempfile.gettempdir()) / "ecu_mems_reference_ci.sqlite"
          if smoke.exists():
              smoke.unlink()
          con = sqlite3.connect(smoke)
          try:
              execute_sql_lines(con, seed_sql, "seeds MEMS")
              for label, raw in enrichment_sql:
                  execute_sql_lines(con, raw, label)
              con.commit()

              integrity = con.execute("PRAGMA integrity_check").fetchone()[0]
              if integrity != "ok":
                  raise SystemExit(f"SQLite integrity_check: {integrity}")

              # Minimums instead of exact values: adding knowledge must not require editing CI.
              minimum_counts = {
                  "ecu_target": 85,
                  "ecu_fitment_target": 140,
                  "protocol_commands": 91,
                  "research_fact": 13,
                  "protocol_command_observation": 103,
                  "protocol_data_observation": 60,
                  "fault_knowledge": 11,
                  "firmware_reference": 30,
              }
              for table, minimum in minimum_counts.items():
                  actual = con.execute(f'SELECT COUNT(*) FROM "{table}"').fetchone()[0]
                  if actual < minimum:
                      raise SystemExit(f"{table}: {actual} lignes, minimum {minimum}")

              tables = [r[0] for r in con.execute(
                  "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'"
              )]
              total_rows = sum(con.execute(f'SELECT COUNT(*) FROM "{t}"').fetchone()[0] for t in tables)
              if total_rows < 813:
                  raise SystemExit(f"Base MEMS incomplète: {total_rows} lignes structurées, minimum 813")

              print("OK SQLite MEMS: integrity_check=ok")
              print(f"OK base: {con.execute('SELECT COUNT(*) FROM ecu_target').fetchone()[0]} ECU, "
                    f"{con.execute('SELECT COUNT(*) FROM ecu_fitment_target').fetchone()[0]} affectations, "
                    f"{con.execute('SELECT COUNT(*) FROM protocol_commands').fetchone()[0]} commandes")
              print(f"OK total structuré: {total_rows} lignes")

              # Language audit. Technical tokens/identifiers are intentionally ignored;
              # prose that still looks English is reported so it can be translated at source.
              english_markers = re.compile(
                  r"\b(the|and|with|without|from|into|when|where|should|must|read|write|reset|"
                  r"engine|sensor|fault|diagnostic|command|response|available|unknown|supported|"
                  r"vehicle|ignition|coolant|temperature|voltage|warning|source|confirmed|"
                  r"requires|possible|causes|testing|notes|used|uses|only|value|values)\b", re.I)
              prose_hints = ("description", "note", "cause", "solution", "function", "capability", "availability",
                             "access_method", "testing", "subject", "topic", "summary", "meaning", "behavior", "behaviour")
              samples = []
              suspicious_count = 0
              for table in tables:
                  columns = [r[1] for r in con.execute(f'PRAGMA table_info("{table}")')]
                  lower_columns = {c.lower() for c in columns}
                  for column in columns:
                      lc = column.lower()
                      if lc.endswith(("_fr", "_en", "_es", "_it", "_pt", "_de")):
                          continue
                      if not any(hint in lc for hint in prose_hints):
                          continue
                      # If a dedicated French sibling exists, the UI can select it correctly.
                      if f"{lc}_fr" in lower_columns:
                          continue
                      try:
                          rows = con.execute(f'SELECT rowid, "{column}" FROM "{table}" WHERE "{column}" IS NOT NULL').fetchall()
                      except sqlite3.Error:
                          continue
                      for rowid, value in rows:
                          text = str(value).strip()
                          if len(text) < 4 or not english_markers.search(text):
                              continue
                          suspicious_count += 1
                          if len(samples) < 120:
                              samples.append((table, column, rowid, text.replace("\n", " ")[:260]))

              print(f"LANGUAGE_AUDIT untranslated_english_candidates={suspicious_count}")
              for table, column, rowid, text in samples:
                  print(f"LANGUAGE_ENGLISH {table}.{column} rowid={rowid}: {text}")
          finally:
              con.close()
              if smoke.exists():
                  smoke.unlink()
          PY
