name: COMPLETE - verification compilation Qt Windows
# Retrigger after Win32 min/max macro isolation in zoom maths.
on:
  push:
    branches:
      - dev-complete-build117-14-pages-20261109
    paths:
      - .github/workflows/complete-qt-build-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-full-14-page-ui:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Installer outils Qt valides par BUILD117
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer Qt 5.15.2 et Charts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0"
          if($LASTEXITCODE -ne 0){throw 'aqtinstall failed'}
          $sevenZip=(Get-Command 7z.exe -ErrorAction Stop).Source
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtcharts -O C:\Qt --external "$sevenZip"
          if($LASTEXITCODE -ne 0){throw 'Qt installation failed'}
      - name: Compiler version COMPLETE x64 depuis les sources directes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake -S . -B build-complete -A x64 `
            -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/msvc2019_64" `
            -DMEMS_USE_BUNDLED_LIBROSCO_X64=ON `
            -DMEMS_USE_ONNX_GENAI=OFF `
            -DMEMS_RUN_REFERENCE_SELFTEST_POST_BUILD=OFF
          if($LASTEXITCODE -ne 0){throw "CMake configure failed $LASTEXITCODE"}
          cmake --build build-complete --config Release --target ecu_mems_manager --parallel
          if($LASTEXITCODE -ne 0){throw "Compilation COMPLETE failed $LASTEXITCODE"}
          $exe='build-complete\Release\ecu_mems_manager.exe'
          if(-not(Test-Path $exe)){throw 'Executable absent'}
          Write-Host 'COMPLETE_14_PAGES_QT_WINDOWS_COMPILE_PASS'
      - name: Verifier perimetre modifications
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((Get-Content navigationorderpatch.cpp -Raw) -notmatch 'kFinalTabCount = 14'){throw '14 pages not preserved'}
          if((Get-Content main.cpp -Raw) -match 'showMaximized\(\)'){throw 'Fixed viewport overridden'}
          Write-Host 'COMPLETE_NON_LIGHT_MENU_GUARD_PASS'
