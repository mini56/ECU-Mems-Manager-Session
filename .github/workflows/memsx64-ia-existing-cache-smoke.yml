name: TEMP apply complete IA bundle to MEMSX64 package

on:
  push:
    branches: [MEMSX64]
    paths:
      - '.github/workflows/memsx64-ia-existing-cache-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-x64-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MEMSX64
        uses: actions/checkout@v4
        with:
          ref: MEMSX64
          fetch-depth: 0

      - name: Publish package patch run id
        shell: bash
        run: |
          printf 'MEMSX64 IA PACKAGE PATCH: STARTED\nrun_id=%s\nrun_number=%s\nworkflow_commit=%s\nutc=%s\n' \
            '${{ github.run_id }}' '${{ github.run_number }}' '${{ github.sha }}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > IA_X64_PACKAGE_PATCH_STARTED.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IA_X64_PACKAGE_PATCH_STARTED.txt
          git commit -m 'Record MEMSX64 IA package patch run [skip ci]'
          git push origin HEAD:MEMSX64

      - name: Apply deterministic IA package patch
        run: python tools/temp_patch_memsx64_ai_package.py

      - name: Commit corrected package workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-ecu-mems-x64-package.yml
          if git diff --cached --quiet; then
            echo 'No package workflow change required'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'Bundle validated local IA runtime in x64 package'
          git pull --rebase origin MEMSX64
          git push origin HEAD:MEMSX64
