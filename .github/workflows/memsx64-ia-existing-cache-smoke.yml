name: TEMP MEMSX64 IA runtime database x64 diagnostic

on:
  push:
    branches: [MEMSX64]
    paths:
      - '.github/workflows/memsx64-ia-existing-cache-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ia-runtime-db-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout MEMSX64
        uses: actions/checkout@v4
        with:
          ref: MEMSX64

      - name: Publish diagnostic run id
        shell: pwsh
        run: |
          @(
            'MEMSX64 IA RUNTIME DB X64 DIAGNOSTIC: STARTED',
            'run_id=${{ github.run_id }}',
            'run_number=${{ github.run_number }}',
            'workflow_commit=${{ github.sha }}',
            ('utc=' + [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))
          ) | Set-Content -Encoding UTF8 IA_X64_CACHE_WORKFLOW_STARTED.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IA_X64_CACHE_WORKFLOW_STARTED.txt
          git commit -m "Record IA x64 runtime DB diagnostic run [skip ci]"
          git push origin HEAD:MEMSX64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt x64
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -O C:\Qt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Use deterministic self-test cache identity
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p = Path('expert/ExpertReferenceIntegrationSelfTest.cpp')
          s = p.read_text(encoding='utf-8')
          old = 'QCoreApplication::setApplicationName(QStringLiteral("runtime-selftest-%1").arg(QUuid::createUuid().toString()));'
          new = 'QCoreApplication::setApplicationName(QStringLiteral("runtime-selftest-memsx64-x64"));'
          if s.count(old) != 1:
              raise SystemExit(f'Expected one self-test application-name anchor, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          '@ | python -

      - name: Configure and build ExpertRuntimeDatabase x64 self-test
        shell: pwsh
        run: |
          cmake -S expert -B expert-build-x64 -A x64 `
            -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/msvc2019_64" `
            -DCMAKE_CXX_FLAGS="/utf-8"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build expert-build-x64 --config Release --target mems_expert_reference_selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build cache then reuse same cache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $env:PATH = "C:\Qt\5.15.2\msvc2019_64\bin;$env:PATH"
          $exe = '${{ github.workspace }}\expert-build-x64\Release\mems_expert_reference_selftest.exe'
          $result = '${{ github.workspace }}\IA_X64_RUNTIME_DB_RESULT.txt'
          $firstLog = '${{ github.workspace }}\IA_X64_RUNTIME_DB_FIRST.txt'
          $secondLog = '${{ github.workspace }}\IA_X64_RUNTIME_DB_SECOND.txt'

          'IA_X64_RUNTIME_DB=STARTED' | Set-Content -Encoding UTF8 $result
          $start = Get-Date
          $firstOutput = & $exe 2>&1
          $firstCode = $LASTEXITCODE
          $firstOutput | Tee-Object -FilePath $firstLog | ForEach-Object { Write-Host $_ }
          ('first_exit_code=' + $firstCode) | Add-Content -Encoding UTF8 $result
          ('first_elapsed_seconds=' + [math]::Round(((Get-Date) - $start).TotalSeconds, 2)) | Add-Content -Encoding UTF8 $result

          if ($firstCode -eq 0) {
            'FIRST_BUILD=PASS' | Add-Content -Encoding UTF8 $result
            $start2 = Get-Date
            $secondOutput = & $exe 2>&1
            $secondCode = $LASTEXITCODE
            $secondOutput | Tee-Object -FilePath $secondLog | ForEach-Object { Write-Host $_ }
            ('second_exit_code=' + $secondCode) | Add-Content -Encoding UTF8 $result
            ('second_elapsed_seconds=' + [math]::Round(((Get-Date) - $start2).TotalSeconds, 2)) | Add-Content -Encoding UTF8 $result
            if ($secondCode -eq 0) {
              'REUSE_CACHE=PASS' | Add-Content -Encoding UTF8 $result
            } else {
              'REUSE_CACHE=FAIL' | Add-Content -Encoding UTF8 $result
            }
          } else {
            'FIRST_BUILD=FAIL' | Add-Content -Encoding UTF8 $result
            $secondCode = 999
          }

          Get-Content $result
          if ($firstCode -ne 0 -or $secondCode -ne 0) { exit 1 }

      - name: Upload runtime database diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memsx64-ia-runtime-db-diagnostic
          path: |
            IA_X64_RUNTIME_DB_RESULT.txt
            IA_X64_RUNTIME_DB_FIRST.txt
            IA_X64_RUNTIME_DB_SECOND.txt
          if-no-files-found: warn
