name: TEMP MEMSX64 IA existing cache diagnostic

on:
  push:
    branches: [MEMSX64]
    paths:
      - '.github/workflows/memsx64-ia-existing-cache-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ia-existing-cache-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout MEMSX64
        uses: actions/checkout@v4
        with:
          ref: MEMSX64

      - name: Publish cache diagnostic run id
        shell: pwsh
        run: |
          @(
            'MEMSX64 IA EXISTING CACHE DIAGNOSTIC: STARTED',
            'run_id=${{ github.run_id }}',
            'run_number=${{ github.run_number }}',
            'workflow_commit=${{ github.sha }}',
            ('utc=' + [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))
          ) | Set-Content -Encoding UTF8 IA_X64_CACHE_WORKFLOW_STARTED.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IA_X64_CACHE_WORKFLOW_STARTED.txt
          git commit -m "Record IA x64 cache diagnostic run [skip ci]"
          git push origin HEAD:MEMSX64

      - name: Inject test-only automatic IA opening
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p = Path('iamemstab.cpp')
          s = p.read_text(encoding='utf-8')
          old = '''    tabs->addTab(tab, iaMemsIcon(), QStringLiteral("IA MEMS"));
              return tab;'''
          new = '''    tabs->addTab(tab, iaMemsIcon(), QStringLiteral("IA MEMS"));
              if (qEnvironmentVariableIsSet("MEMS_SMOKE_OPEN_IA"))
                  tabs->setCurrentWidget(tab);
              return tab;'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected one IA insertion point, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          '@ | python -

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        shell: pwsh
        run: python -m pip install --disable-pip-version-check aqtinstall

      - name: Install Qt x64
        shell: pwsh
        run: |
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtcharts -O C:\Qt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure and build x64
        shell: pwsh
        run: |
          cmake -S . -B build-ia-cache-x64 -A x64 `
            -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/msvc2019_64" `
            -DMEMS_USE_BUNDLED_LIBROSCO_X64=ON `
            -DMEMS_RUN_REFERENCE_SELFTEST_POST_BUILD=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-ia-cache-x64 --config Release --target ecu_mems_manager
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = '${{ github.workspace }}\build-ia-cache-x64'
          $dist = '${{ github.workspace }}\dist-ia-cache-x64'
          if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
          New-Item -ItemType Directory -Path $dist | Out-Null
          Copy-Item (Join-Path $build 'Release\ecu_mems_manager.exe') (Join-Path $dist 'ecu_mems_manager.exe') -Force
          Copy-Item (Join-Path $build 'librosco-x64\Release\mems_manager_x64.dll') (Join-Path $dist 'mems_manager_x64.dll') -Force
          & 'C:\Qt\5.15.2\msvc2019_64\bin\windeployqt.exe' --release --compiler-runtime --no-translations --dir $dist (Join-Path $dist 'ecu_mems_manager.exe')
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed: $LASTEXITCODE" }
          Copy-Item (Join-Path $build 'Release\translations') (Join-Path $dist 'translations') -Recurse -Force
          Copy-Item (Join-Path $build 'Release\database') (Join-Path $dist 'database') -Recurse -Force

      - name: First IA opening - build local cache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = '${{ github.workspace }}\dist-ia-cache-x64'
          $env:MEMS_SMOKE_OPEN_IA = '1'
          $proc = Start-Process (Join-Path $dist 'ecu_mems_manager.exe') -WorkingDirectory $dist -PassThru
          $deadline = (Get-Date).AddSeconds(150)
          $cache = $null
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 3
            $proc.Refresh()
            if ($proc.HasExited) { throw "First IA opening crashed with code $($proc.ExitCode)" }
            $cache = Get-ChildItem $env:LOCALAPPDATA -Recurse -File -Filter 'ia_mems_reference_r*.sqlite' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($cache -and $cache.Length -gt 0) { break }
          }
          if (-not $cache) { throw 'IA MEMS cache was not created within 150 seconds' }
          "cache_path=$($cache.FullName)" | Set-Content -Encoding UTF8 (Join-Path $dist 'IA_X64_CACHE_RESULT.txt')
          "cache_size=$($cache.Length)" | Add-Content -Encoding UTF8 (Join-Path $dist 'IA_X64_CACHE_RESULT.txt')
          Stop-Process -Id $proc.Id -Force
          Start-Sleep -Seconds 2

      - name: Second IA opening - reuse existing cache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $dist = '${{ github.workspace }}\dist-ia-cache-x64'
          $result = Join-Path $dist 'IA_X64_CACHE_RESULT.txt'
          $events = Join-Path $dist 'IA_X64_CACHE_EVENTS.txt'
          $env:MEMS_SMOKE_OPEN_IA = '1'
          $start = Get-Date
          $proc = Start-Process (Join-Path $dist 'ecu_mems_manager.exe') -WorkingDirectory $dist -PassThru
          Start-Sleep -Seconds 30
          $proc.Refresh()
          if ($proc.HasExited) {
            $hex = ('0x{0:X8}' -f ([uint32]$proc.ExitCode))
            'IA_X64_EXISTING_CACHE=CRASH' | Add-Content -Encoding UTF8 $result
            ('exit_code=' + $proc.ExitCode) | Add-Content -Encoding UTF8 $result
            ('exit_code_hex=' + $hex) | Add-Content -Encoding UTF8 $result
          } else {
            'IA_X64_EXISTING_CACHE=PASS' | Add-Content -Encoding UTF8 $result
            'alive_after_seconds=30' | Add-Content -Encoding UTF8 $result
            Stop-Process -Id $proc.Id -Force
          }
          try {
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$start} -ErrorAction Stop |
              Where-Object { $_.ProviderName -in @('Application Error','Windows Error Reporting','.NET Runtime') -or $_.Message -match 'ecu_mems_manager|llama-server' } |
              Select-Object TimeCreated, ProviderName, Id, LevelDisplayName, Message |
              Format-List | Out-String -Width 240 | Set-Content -Encoding UTF8 $events
          } catch {
            ('Event log read failed: ' + $_.Exception.Message) | Set-Content -Encoding UTF8 $events
          }
          Get-Content $result
          if (Test-Path $events) { Get-Content $events }

      - name: Upload cache diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memsx64-ia-existing-cache-diagnostic
          path: |
            dist-ia-cache-x64/IA_X64_CACHE_RESULT.txt
            dist-ia-cache-x64/IA_X64_CACHE_EVENTS.txt
          if-no-files-found: warn
