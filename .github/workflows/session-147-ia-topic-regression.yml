name: "SESSION 147 - IA MEMS - pertinence des sujets documentaires"
on:
  push:
    branches: [fix-ia-mems-topic-discovery-session-147-20261115]
    paths:
      - 'expert/IaMemsLibraryIntegration.cpp'
      - 'database/MemsDocumentaryRepository.cpp'
      - 'database/MemsDocumentaryRepository.h'
      - 'database/MemsDocumentaryNativeIntentSelfTest.cpp'
      - '.github/workflows/session-147-ia-topic-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-topic-relevance:
    name: Vérifier PISTON, INJECTEUR et les en-têtes PDF
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Installer Qt 5.15.2 MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check 'aqtinstall==3.3.0'
          if($LASTEXITCODE -ne 0){throw 'QT_INSTALLER_FAILED'}
          $sevenZip=(Get-Command 7z.exe -ErrorAction Stop).Source
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtcharts -O C:\Qt --external $sevenZip
          if($LASTEXITCODE -ne 0){throw 'QT_INSTALL_FAILED'}
      - name: Compiler le lecteur documentaire source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake -S . -B build-ia-147 -A x64 -DCMAKE_PREFIX_PATH='C:/Qt/5.15.2/msvc2019_64' -DMEMS_USE_BUNDLED_LIBROSCO_X64=ON -DMEMS_RUN_REFERENCE_SELFTEST_POST_BUILD=OFF
          if($LASTEXITCODE -ne 0){throw 'CMAKE_FAILED'}
          cmake --build build-ia-147 --config Release --target mems_documentary_native_intent_selftest --parallel
          if($LASTEXITCODE -ne 0){throw 'SELFTEST_COMPILE_FAILED'}
      - name: Tester recherches et provenance de bout en bout
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $bin=(Resolve-Path build-ia-147/Release).Path
          $qt='C:\Qt\5.15.2\msvc2019_64'
          & "$qt/bin/windeployqt.exe" --release --no-translations --dir $bin "$bin/mems_documentary_native_intent_selftest.exe"
          if($LASTEXITCODE -ne 0){throw 'QT_DEPLOY_FAILED'}
          & "$bin/mems_documentary_native_intent_selftest.exe"
          if($LASTEXITCODE -ne 0){throw 'DOCUMENTARY_TOPIC_REGRESSION'}
          Write-Host 'SESSION_147_PISTON_INJECTEUR_PDF_TOPIC_PASS'
