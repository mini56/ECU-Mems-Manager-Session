name: IA CONVERSATION TEMP VALIDATION

on:
  push:
    branches: [tmp-ia-conversation-routing]

permissions:
  contents: write

jobs:
  patch_and_validate:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply targeted IA conversation patch once
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $alreadyPatched = Select-String -Path 'expert/IaResponseLogic.h' -SimpleMatch 'technical-document request has priority' -Quiet
          if (-not $alreadyPatched) {
            python tools/apply_tmp_ia_conversation_patch.py
            if ($LASTEXITCODE -ne 0) { throw "IA patch failed: $LASTEXITCODE" }
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add expert/IaResponseLogic.h expert/IaResponseLogicTest.cpp expert/IaMemsService.cpp iamemstab.cpp iamemstab.h
            if (-not (git diff --cached --quiet)) {
              git commit -m 'Improve IA documentary routing and clarification'
              git push origin HEAD:tmp-ia-conversation-routing
            }
          } else {
            Write-Host 'Targeted IA patch already present.'
          }

      - name: Validate intended source invariants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          checks = {
              'expert/IaResponseLogic.h': [
                  'isDocumentationQuestion(question)',
                  'technical-document request has priority',
              ],
              'expert/IaMemsService.cpp': [
                  'documentaryKnowledge = knowledgeAnswer(question)',
                  'explicitEct',
                  'seenStatements',
              ],
              'iamemstab.cpp': [
                  'Ouvrir la fiche XML MEMS %1',
                  'm_pendingClarificationQuestion',
                  'resolveInductionFromKnownContext',
                  'isSearchDirective(question)',
              ],
              'iamemstab.h': [
                  'openSuggestedDocument',
                  'm_documentButton',
                  'm_firmwareIdentifier',
              ],
          }
          for path, needles in checks.items():
              text = Path(path).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'MISSING {needle!r} in {path}')
          print('IA_CONVERSATION_SOURCE_PASS')
          '@ | python -

      - name: Install Qt 5.15.2 MSVC 2019 x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check 'aqtinstall==3.3.0'
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          if (Test-Path 'C:\Qt') { Remove-Item 'C:\Qt' -Recurse -Force -ErrorAction SilentlyContinue }
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtcharts -O C:\Qt --external "$sevenZip"
          if ($LASTEXITCODE -ne 0) { throw "aqtinstall failed: $LASTEXITCODE" }

      - name: Configure candidate x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build-x64 -A x64 `
            -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/msvc2019_64" `
            -DMEMS_USE_BUNDLED_LIBROSCO_X64=ON `
            -DMEMS_RUN_REFERENCE_SELFTEST_POST_BUILD=OFF `
            -DMEMS_USE_ONNX_GENAI=OFF
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed: $LASTEXITCODE" }

      - name: Compile IA touched x64 paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build-x64 --config Release --target `
            ecu_mems_manager ia_response_selftest ia_mems_diagram_selftest mems_search_selftest
          if ($LASTEXITCODE -ne 0) { throw "Candidate x64 build failed: $LASTEXITCODE" }

      - name: Run deterministic regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = 'C:\Qt\5.15.2\msvc2019_64'
          $env:PATH = "$qtRoot\bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "$qtRoot\plugins"

          & '${{ github.workspace }}\build-x64\Release\ia_response_selftest.exe'
          if ($LASTEXITCODE -ne 0) { throw "IA response self-test failed: $LASTEXITCODE" }

          & '${{ github.workspace }}\build-x64\Release\ia_mems_diagram_selftest.exe'
          if ($LASTEXITCODE -ne 0) { throw "IA diagram self-test failed: $LASTEXITCODE" }

          & '${{ github.workspace }}\build-x64\Release\mems_search_selftest.exe'
          if ($LASTEXITCODE -ne 0) { throw "MEMS reference search self-test failed: $LASTEXITCODE" }

          Write-Host 'IA_CONVERSATION_VALIDATION_PASS'
