name: TEMP update RAVEMEMS cahier review 1

on:
  push:
    branches:
      - RAPPORT
    paths:
      - '.github/workflows/tmp-update-ravemems-cahier-review-1.yml'

permissions:
  contents: write

jobs:
  update-cahier-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0

      - name: Apply reviewed cahier corrections
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/CAHIER_DES_CHARGES_RAVEMEMS_BROUILLON_2026-09-02.md')
          text = path.read_text(encoding='utf-8')

          old14 = '''Si MEMS Manager connaît déjà le véhicule / ECU courant, l’IA doit utiliser ce contexte. Si plusieurs réponses incompatibles restent possibles, l’IA doit demander la variante nécessaire.'''
          new14 = '''Si un véhicule / ECU est actuellement connecté, l’IA ne doit pas supposer automatiquement que la question concerne ce véhicule. Elle doit demander à l’utilisateur si sa question concerne le véhicule actuellement connecté. L’utilisateur peut très bien demander une information sur un autre véhicule.\n\nSi aucun véhicule / ECU n’est connecté, l’IA ne connaît pas le véhicule concerné et ne doit pas en inventer un. Elle doit utiliser les informations données dans la question ou demander le véhicule / ECU / variante nécessaire.\n\nSi plusieurs réponses incompatibles restent possibles, l’IA doit demander la variante nécessaire avant de répondre.'''
          if old14 not in text:
              raise SystemExit('Section 14 target text not found')
          text = text.replace(old14, new14, 1)

          old36 = '''Les comportements ne doivent pas dépendre de mots français codés en dur.'''
          new36 = '''Les comportements ne doivent pas dépendre de mots français ou de mots d’une autre langue codés en dur.'''
          if old36 not in text:
              raise SystemExit('Section 36 target text not found')
          text = text.replace(old36, new36, 1)

          path.write_text(text, encoding='utf-8')

      - name: Append decision to master report
        shell: bash
        run: |
          cat >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md <<'EOF'

          ## 2026-09-02 — RELECTURE CAHIER RAVEMEMS — CORRECTIONS UTILISATEUR 14 ET 36

          Deux règles du brouillon RAVEMEMS sont corrigées à la demande explicite de l'utilisateur :

          1. CONTEXTE VEHICULE / ECU : un véhicule connecté ne doit jamais être supposé comme cible automatique de la question. Si un véhicule / ECU est connecté, IA MEMS doit demander si la question concerne le véhicule actuellement connecté. L'utilisateur peut demander une information sur un autre véhicule. Si aucun véhicule n'est connecté, l'IA ne connaît pas le véhicule concerné et doit utiliser les informations de la question ou demander le véhicule / ECU / variante nécessaire. Si plusieurs réponses incompatibles restent possibles, la variante nécessaire doit être demandée avant réponse.

          2. LANGUE : aucune logique comportementale ne doit dépendre de mots codés en dur dans une langue particulière. La règle vaut pour le français comme pour toute autre langue.

          Aucun code applicatif, aucune extraction et aucun BUILD ne sont lancés. MEMSX64 reste BUILD #103 `1d6316bd1746d6f2b4cfb751cab88d18e27ef730`.

          PROCHAINE ACTION EXACTE : poursuivre la relecture du cahier des charges avec l'utilisateur et intégrer ses corrections. Ne lancer aucune extraction ni implémentation avant validation explicite du cahier.
          EOF

      - name: Commit cahier and report, remove temporary workflow
        shell: bash
        run: |
          git config user.name "mini56"
          git config user.email "48644212+mini56@users.noreply.github.com"
          git add docs/CAHIER_DES_CHARGES_RAVEMEMS_BROUILLON_2026-09-02.md RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git rm .github/workflows/tmp-update-ravemems-cahier-review-1.yml
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "Apply RAVEMEMS cahier review corrections 14 and 36"
          git push origin HEAD:RAPPORT
