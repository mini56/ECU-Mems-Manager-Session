name: Build ECU MEMS Manager x64 BUILD 22

on:
  workflow_dispatch:
  push:
    branches: [MEMSX64]
    paths:
      - '.github/workflows/build-ecu-mems-x64-build22.yml'

permissions:
  contents: write

jobs:
  build22:
    runs-on: windows-latest
    env:
      MEMS_BUILD: '22'
      MEMS_VERSION: '1.0.22'
      MEMS_BUILD_NUMBER: '22'

    steps:
      - name: Checkout MEMSX64
        uses: actions/checkout@v4
        with:
          ref: MEMSX64

      - name: Mark BUILD 22 running
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @(
            'status=RUNNING',
            'build=22',
            'version=1.0.22',
            "run_id=${{ github.run_id }}",
            "run_number=${{ github.run_number }}",
            "source_commit=${{ github.sha }}"
          ) | Set-Content -Encoding UTF8 ECU_MEMS_X64_BUILD22_STATUS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ECU_MEMS_X64_BUILD22_STATUS.txt
          git commit -m "Mark BUILD #22 x64 validation running [skip ci]"
          git push origin HEAD:MEMSX64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check aqtinstall pefile

      - name: Install Qt 5.15.2 MSVC x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtConfig = 'C:\Qt\5.15.2\msvc2019_64\lib\cmake\Qt5\Qt5Config.cmake'
          for ($attempt=1; $attempt -le 3; $attempt++) {
            try {
              if (Test-Path 'C:\Qt') { Remove-Item 'C:\Qt' -Recurse -Force -ErrorAction SilentlyContinue }
              python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtcharts -O C:\Qt
              if (Test-Path $qtConfig) { break }
            } catch {
              Write-Host "Qt install attempt $attempt failed: $($_.Exception.Message)"
            }
            if ($attempt -eq 3) { throw 'Qt 5.15.2 MSVC x64 installation failed after 3 attempts' }
            Start-Sleep -Seconds 3
          }
          if (-not (Test-Path $qtConfig)) { throw 'Qt 5.15.2 MSVC x64 installation incomplete' }
          if (-not (Test-Path 'C:\Qt\5.15.2\msvc2019_64\plugins\sqldrivers\qsqlite.dll')) { throw 'Qt QSQLITE x64 plugin missing' }

      - name: Validate deterministic 14-tab navigation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          nav = Path('navigationorderpatch.cpp').read_text(encoding='utf-8')
          cmake = Path('CMakeLists.txt').read_text(encoding='utf-8')
          wrapper = Path('iamemstab_clean.cpp').read_text(encoding='utf-8')
          required = [
              'overview_tab','injection_tab','emission_tab','actuators','errors',
              'DiagnosticPanel','ia_mems_tab','AnalysisTab','SummaryTab',
              'ecu_rosco_tab','raw','database_tab','ECU','mems19_test_tab'
          ]
          missing = [x for x in required if x not in nav]
          if missing: raise SystemExit('Missing tab identities: ' + ', '.join(missing))
          if 'kFinalTabCount = 14' not in nav: raise SystemExit('Navigation is not fixed to 14 tabs')
          if 'rankFromTitle' in nav or 'QTimer' in nav or 'singleShot' in nav:
              raise SystemExit('Legacy title/timer navigation still active')
          if 'taborderpatch.cpp' in cmake: raise SystemExit('Legacy taborderpatch.cpp still compiled')
          if 'iamemstab_clean.cpp' not in cmake: raise SystemExit('Clean IA wrapper not compiled')
          if '#define Q_COREAPP_STARTUP_FUNCTION(AFUNC)' not in wrapper:
              raise SystemExit('Legacy IA startup navigation hook not suppressed')
          print('PASS navigation 14/14 deterministic')
          '@ | python -

      - name: Control 12 - protocol source guards
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python librosco-x64/validate_protocol_guards.py

      - name: Configure clean native x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build-clean-x64 -A x64 `
            -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/msvc2019_64" `
            -DMEMS_USE_BUNDLED_LIBROSCO_X64=ON `
            -DMEMS_RUN_REFERENCE_SELFTEST_POST_BUILD=OFF

      - name: Controls 1-2 - compile application and x64 protocol DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build-clean-x64 --config Release --target ecu_mems_manager rosco_abi_selftest
          if (-not (Test-Path 'build-clean-x64\Release\ecu_mems_manager.exe')) { throw 'ecu_mems_manager.exe missing' }
          if (-not (Test-Path 'build-clean-x64\librosco-x64\Release\mems_manager_x64.dll')) { throw 'mems_manager_x64.dll missing' }

      - name: Control 11 - ABI self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ctest --test-dir build-clean-x64/librosco-x64 -C Release --output-on-failure -R rosco_abi_selftest

      - name: Control 14A - reference SQLite semantic self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = 'C:\Qt\5.15.2\msvc2019_64'
          $env:PATH = "$qtRoot\bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "$qtRoot\plugins"
          $selftest = '${{ github.workspace }}\build-clean-x64\Release\mems_search_selftest.exe'
          $reference = '${{ github.workspace }}\build-clean-x64\Release\database\reference\manifest.json'
          if (-not (Test-Path $selftest)) { throw 'mems_search_selftest.exe missing' }
          if (-not (Test-Path $reference)) { throw 'reference database resources missing beside self-test' }
          if (-not (Test-Path "$qtRoot\plugins\sqldrivers\qsqlite.dll")) { throw 'QSQLITE plugin missing before self-test' }
          & $selftest
          if ($LASTEXITCODE -ne 0) { throw "MEMS reference search self-test failed: $LASTEXITCODE" }

      - name: Assemble clean portable x64 package without local IA runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = 'C:\Qt\5.15.2\msvc2019_64'
          $qtBin = Join-Path $qtRoot 'bin'
          $build = '${{ github.workspace }}\build-clean-x64'
          $dist = '${{ github.workspace }}\dist-clean-x64'
          $app = Join-Path $build 'Release\ecu_mems_manager.exe'
          $protocol = Join-Path $build 'librosco-x64\Release\mems_manager_x64.dll'
          if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
          New-Item -ItemType Directory -Path $dist | Out-Null
          Copy-Item $app (Join-Path $dist 'ecu_mems_manager.exe') -Force
          Copy-Item $protocol (Join-Path $dist 'mems_manager_x64.dll') -Force
          & (Join-Path $qtBin 'windeployqt.exe') --release --compiler-runtime --no-translations --dir $dist (Join-Path $dist 'ecu_mems_manager.exe')
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed: $LASTEXITCODE" }
          Copy-Item (Join-Path $build 'Release\translations') (Join-Path $dist 'translations') -Recurse -Force
          Copy-Item (Join-Path $build 'Release\database') (Join-Path $dist 'database') -Recurse -Force
          @(
            'ECU MEMS MANAGER CLEAN X64 BUILD #22',
            'Version 1.0.22',
            'Application: native Windows x64',
            'Protocol: mems_manager_x64.dll native x64',
            'Local IA runtime/model intentionally absent for ECU-first validation',
            'Historical 32-bit librosco.dll intentionally absent'
          ) | Set-Content -Path (Join-Path $dist 'README_X64_CLEAN_TEST.txt') -Encoding UTF8

      - name: Controls 3-10 and 15 - PE architecture imports exports inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DIST = '${{ github.workspace }}\dist-clean-x64'
          @'
          import os
          from pathlib import Path
          import pefile
          root = Path(os.environ['DIST'])
          app = root/'ecu_mems_manager.exe'
          dll = root/'mems_manager_x64.dll'
          required = [app,dll,root/'Qt5Core.dll',root/'Qt5Gui.dll',root/'Qt5Widgets.dll',root/'Qt5Sql.dll',root/'Qt5SerialPort.dll',root/'platforms'/'qwindows.dll',root/'sqldrivers'/'qsqlite.dll']
          missing = [str(p.relative_to(root)) for p in required if not p.exists() or p.stat().st_size <= 0]
          if missing: raise SystemExit('Missing x64 package binaries: ' + ', '.join(missing))
          def load(p): return pefile.PE(str(p), fast_load=False)
          app_pe, dll_pe = load(app), load(dll)
          for p,obj in ((app,app_pe),(dll,dll_pe)):
              if obj.FILE_HEADER.Machine != 0x8664 or obj.OPTIONAL_HEADER.Magic != 0x20B:
                  raise SystemExit(f'{p.name} is not PE32+ AMD64')
          imports = [e.dll.decode('ascii',errors='replace').lower() for e in app_pe.DIRECTORY_ENTRY_IMPORT]
          if 'mems_manager_x64.dll' not in imports: raise SystemExit('Application does not import mems_manager_x64.dll')
          if 'librosco.dll' in imports: raise SystemExit('Application still imports historical librosco.dll')
          expected = {'mems_cleanup','mems_clear_faults','mems_connect','mems_disconnect','mems_get_lib_version','mems_heartbeat','mems_init','mems_init_link','mems_is_connected','mems_lock','mems_move_iac','mems_openserial','mems_read','mems_read_iac_position','mems_read_raw','mems_read_serial','mems_reset_ECU','mems_reset_adjustments','mems_send_command','mems_test_actuator','mems_unlock','mems_write_serial'}
          actual = {s.name.decode('ascii') for s in dll_pe.DIRECTORY_ENTRY_EXPORT.symbols if s.name}
          if actual != expected: raise SystemExit('Protocol DLL exports mismatch: ' + repr(sorted(actual)))
          wrong=[]; inventory=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file() or p.suffix.lower() not in {'.exe','.dll'}: continue
              try: obj=load(p)
              except pefile.PEFormatError: continue
              machine=obj.FILE_HEADER.Machine
              inventory.append(f'{p.relative_to(root)} | machine=0x{machine:04X}')
              if machine != 0x8664: wrong.append(str(p.relative_to(root)))
          if wrong: raise SystemExit('x86/x64 mixture detected: ' + ', '.join(wrong))
          (root/'PE_X64_INVENTORY.txt').write_text('\n'.join(inventory)+'\n',encoding='utf-8')
          print(f'PASS PE inventory: {len(inventory)} AMD64 files; 22 exports exact')
          '@ | python -
          $forbidden = Get-ChildItem $env:DIST -Recurse -File | Where-Object { $_.Name -ieq 'librosco.dll' -or $_.Name -ieq 'llama-server.exe' -or $_.Extension -ieq '.gguf' }
          if ($forbidden) { throw "Forbidden package files: $($forbidden.FullName -join ', ')" }

      - name: Control 14B - SQLite package resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DIST = '${{ github.workspace }}\dist-clean-x64'
          @'
          import base64, os, sqlite3, tempfile, zlib
          from pathlib import Path
          root=Path(os.environ['DIST'])
          required=[root/'translations'/'fr'/'fr.json',root/'translations'/'en'/'en.json',root/'translations'/'fr'/'fr_navigation.json',root/'translations'/'en'/'en_navigation.json',root/'database'/'reference'/'manifest.json',root/'sqldrivers'/'qsqlite.dll']
          missing=[str(p.relative_to(root)) for p in required if not p.exists() or p.stat().st_size<=0]
          if missing: raise SystemExit('Missing resources: '+', '.join(missing))
          ref=root/'database'/'reference'
          parts=[ref/f'mems_reference_seed_{i}.qz64' for i in range(1,5)]
          if any(not p.exists() for p in parts): raise SystemExit('Missing MEMS reference seed parts')
          packed=base64.b64decode(b''.join(p.read_bytes().strip() for p in parts))
          expected=int.from_bytes(packed[:4],'big')
          sql_bytes=zlib.decompress(packed[4:])
          if len(sql_bytes)!=expected: raise SystemExit('Invalid MEMS seed length')
          smoke=Path(tempfile.gettempdir())/'ecu_mems_build22_reference.sqlite'
          if smoke.exists(): smoke.unlink()
          con=sqlite3.connect(smoke)
          try:
              for line in sql_bytes.decode('utf-8').splitlines():
                  line=line.strip()
                  if line: con.execute(line)
              con.commit()
              counts=[con.execute('SELECT COUNT(*) FROM ecu_target').fetchone()[0],con.execute('SELECT COUNT(*) FROM ecu_fitment_target').fetchone()[0],con.execute('SELECT COUNT(*) FROM protocol_commands').fetchone()[0]]
              if min(counts)<=0: raise SystemExit(f'Reconstructed reference DB empty: {counts}')
              print(f'PASS SQLite resources: ECU={counts[0]} fitments={counts[1]} commands={counts[2]}')
          finally:
              con.close()
              if smoke.exists(): smoke.unlink()
          '@ | python -

      - name: Control 13 - smoke launch packaged application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist='${{ github.workspace }}\dist-clean-x64'
          $exe=Join-Path $dist 'ecu_mems_manager.exe'
          $proc=Start-Process $exe -WorkingDirectory $dist -PassThru
          Start-Sleep -Seconds 5
          $proc.Refresh()
          if ($proc.HasExited) { throw "Clean x64 application exited during smoke launch (code $($proc.ExitCode))" }
          Stop-Process -Id $proc.Id -Force
          Write-Host 'PASS smoke launch'

      - name: Write BUILD 22 validation report
        shell: pwsh
        run: |
          $dist='${{ github.workspace }}\dist-clean-x64'
          @(
            'BUILD #22 — v1.0.22',
            'ECU MEMS MANAGER CLEAN X64: 15/15 AUTOMATED CONTROLS PASSED',
            '01 PASS clean x64 application compile',
            '02 PASS clean mems_manager_x64.dll compile',
            '03 PASS ecu_mems_manager.exe PE32+ AMD64',
            '04 PASS mems_manager_x64.dll PE32+ AMD64',
            '05 PASS Qt/plugin DLL architecture x64',
            '06 PASS qsqlite + Qt SerialPort + essentials x64',
            '07 PASS application imports mems_manager_x64.dll',
            '08 PASS application does not import librosco.dll',
            '09 PASS historical x86 librosco.dll absent',
            '10 PASS exactly 22 historical DLL exports',
            '11 PASS ABI frame80=28 frame7d=32 mems_data=60',
            '12 PASS protocol source guards',
            '13 PASS packaged application smoke launch',
            '14 PASS Qt SQLite semantic self-test + reference resources',
            '15 PASS complete PE inventory AMD64 only',
            'NAV PASS 14/14 deterministic',
            'LOCAL IA RUNTIME intentionally absent'
          ) | Set-Content -Path (Join-Path $dist 'ECU_MEMS_X64_15_CONTROLS.txt') -Encoding UTF8

      - name: Upload BUILD 22 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECU-MEMS-Manager-x64-CLEAN-BUILD-22-v1.0.22
          path: dist-clean-x64/
          if-no-files-found: error
          compression-level: 0

      - name: Mark BUILD 22 passed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @(
            'status=PASSED',
            'build=22',
            'version=1.0.22',
            "run_id=${{ github.run_id }}",
            "run_number=${{ github.run_number }}",
            "source_commit=${{ github.sha }}",
            'artifact=ECU-MEMS-Manager-x64-CLEAN-BUILD-22-v1.0.22',
            'controls=15/15',
            'navigation=14/14 deterministic',
            'local_ai_runtime=absent',
            'historical_librosco_x86=absent'
          ) | Set-Content -Encoding UTF8 ECU_MEMS_X64_BUILD22_STATUS.txt
          git add ECU_MEMS_X64_BUILD22_STATUS.txt
          git commit -m "Validate BUILD #22 clean x64 milestone [skip ci]"
          git push origin HEAD:MEMSX64

      - name: Mark BUILD 22 failed
        if: failure()
        shell: pwsh
        run: |
          @(
            'status=FAILED',
            'build=22',
            'version=1.0.22',
            "run_id=${{ github.run_id }}",
            "run_number=${{ github.run_number }}",
            "source_commit=${{ github.sha }}"
          ) | Set-Content -Encoding UTF8 ECU_MEMS_X64_BUILD22_STATUS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ECU_MEMS_X64_BUILD22_STATUS.txt
          git commit -m "Record BUILD #22 x64 failure [skip ci]"
          git push origin HEAD:MEMSX64
