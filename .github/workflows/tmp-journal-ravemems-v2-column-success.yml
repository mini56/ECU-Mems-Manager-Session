name: TEMP Journal RAVEMEMS column correction success

on:
  push:
    branches: [RAPPORT]
    paths:
      - '.github/workflows/tmp-journal-ravemems-v2-column-success.yml'

permissions:
  contents: write

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Append correction push result
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/MEMSX64 | awk '{print $1}')" = '1d6316bd1746d6f2b4cfb751cab88d18e27ef730'
          test "$(git ls-remote origin refs/heads/tmp-ravemems-v2-foundation | awk '{print $1}')" = '6d119858dfd728c7d344db7a6ad0a48e01f38dd0'
          marker='## 2026-09-03 — CORRECTION GENERIQUE ORDRE DE LECTURE DEUX COLONNES POUSSEE'
          if ! grep -Fq "$marker" RAPPORT_SUIVI_ECU_MEMS_MANAGER.md; then
            printf '%s' '' | base64 -d >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          fi
          rm -f .github/workflows/tmp-journal-ravemems-v2-column-success.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md .github/workflows/tmp-journal-ravemems-v2-column-success.yml
          git diff --cached --check
          git commit -m 'Journal RAVEMEMS column correction push'
          git push origin HEAD:RAPPORT
