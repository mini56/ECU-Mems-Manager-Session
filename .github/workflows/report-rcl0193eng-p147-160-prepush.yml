name: REPORT RCL0193ENG P147-160 PREPUSH

on:
  push:
    branches: [RAPPORT]
    paths:
      - '.github/workflows/report-rcl0193eng-p147-160-prepush.yml'

permissions:
  contents: write

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
      - name: Append pre-push checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cat '.github/report-transfer/rcl0193eng-p147-160-prepush.txt' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          rm '.github/report-transfer/rcl0193eng-p147-160-prepush.txt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md '.github/report-transfer/rcl0193eng-p147-160-prepush.txt'
          git commit -m 'Journal RCL0193ENG pages 147-160 before technical push'
          git push origin HEAD:RAPPORT
