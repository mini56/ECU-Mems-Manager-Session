name: REPORT ROUTING V2 RUNTIME CORRECTION

on:
  push:
    branches:
      - RAPPORT
    paths:
      - '.github/workflows/report-routing-v2-runtime-correction.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Append corrected diagnosis
        shell: bash
        run: |
          set -e
          git pull --rebase origin RAPPORT
          {
            echo ''
            echo '## 2026-08-29 - RECTIFICATION RUN V2 33254169110 - DLL RUNTIME QT'
            echo ''
            echo 'Le log reel fourni par l utilisateur corrige la conclusion precedente sur ce run.'
            echo '- Le programme principal compile et linke correctement.'
            echo '- Le self-test protocole affiche PASS protocol context safety policy.'
            echo '- L echec arrive au lancement de ia_mems_diagram_selftest.exe pendant le POST_BUILD.'
            echo '- Code Windows: -1073741515 = 0xC0000135 = DLL_NOT_FOUND.'
            echo '- Cause: le patch temporaire tools/patch_rave_visual_routing_auto.py ajoute un POST_BUILD pour ia_mems_diagram_selftest alors que ce test depend de Qt5::Core et que le PATH Qt n est ajoute que dans l etape GitHub suivante Run deterministic regression tests.'
            echo '- La precedente mention de deux erreurs logiques du self-test n est donc pas demontree par ce run et ne doit pas etre retenue comme resultat de 33254169110.'
            echo '- Les warnings C4828 d encodage ne sont pas la cause de l arret.'
            echo ''
            echo 'Correction generale prevue avant prochaine pousse technique:'
            echo '1. ne plus lancer le self-test Qt en POST_BUILD; conserver uniquement sa compilation comme dependance;'
            echo '2. executer ia_mems_diagram_selftest dans l etape deterministe ou le PATH et QT_PLUGIN_PATH sont deja prepares;'
            echo '3. garder le garde automatique: un echec logique du self-test devra toujours faire echouer le workflow, mais seulement apres demarrage correct du runtime Qt;'
            echo '4. relancer le V2 et ne conclure sur les erreurs de logique de routage qu a partir de la sortie reelle du self-test;'
            echo '5. production MEMSX64 reste strictement BUILD #101, aucun #102.'
            echo ''
            echo 'Incident connecteur pendant cette reprise: une branche tmp-do-not-use a ete creee par erreur depuis RAPPORT. Aucun fichier ni commit n y a ete modifie. Le connecteur disponible ne propose pas de suppression de branche; cette branche parasite doit rester ignoree et ne constitue aucune source de verite du projet.'
          } >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          rm .github/workflows/report-routing-v2-runtime-correction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md .github/workflows/report-routing-v2-runtime-correction.yml
          git commit -m 'Correct routing V2 runtime failure diagnosis'
          git push origin RAPPORT
