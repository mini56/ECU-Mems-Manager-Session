name: REPORT RCL0193ENG P097-104 PREPUSH

on:
  push:
    branches:
      - RAPPORT
    paths:
      - '.github/workflows/report-rcl0193eng-p097-104-prepush.yml'

permissions:
  contents: write

jobs:
  append-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Append pre-push journal
        env:
          REPORT_APPEND_B64: ''
        run: |
          python -c "import os,base64; open('RAPPORT_SUIVI_ECU_MEMS_MANAGER.md','ab').write(base64.b64decode(os.environ['REPORT_APPEND_B64']))"
      - name: Remove helper and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm '.github/workflows/report-rcl0193eng-p097-104-prepush.yml'
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git diff --cached --quiet && exit 1
          git commit -m "Journal RCL0193ENG pages 97-104 before push"
          git push origin HEAD:RAPPORT
