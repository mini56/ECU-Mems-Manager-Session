name: RAPPORT master journal writer

on:
  push:
    branches:
      - RAPPORT
    paths:
      - '.journal_queue/**'

permissions:
  contents: write

concurrency:
  group: rapport-master-journal
  cancel-in-progress: false

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0

      - name: Append queued entries safely
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/append_master_report.py
          python3 -m py_compile tools/append_master_report.py

          if git diff --quiet; then
            echo MASTER_REPORT_NO_CHANGE
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Append master project journal'
          git push origin HEAD:RAPPORT

          git fetch origin RAPPORT
          local_blob="$(git hash-object RAPPORT_SUIVI_ECU_MEMS_MANAGER.md)"
          remote_blob="$(git ls-tree origin/RAPPORT RAPPORT_SUIVI_ECU_MEMS_MANAGER.md | awk '{print $3}')"
          test "$local_blob" = "$remote_blob"
          if git ls-tree -r --name-only origin/RAPPORT .journal_queue | grep -q .; then
            echo MASTER_REPORT_QUEUE_NOT_EMPTY >&2
            exit 1
          fi
          echo MASTER_REPORT_REMOTE_VERIFY_PASS "$remote_blob"
