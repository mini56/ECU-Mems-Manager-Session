name: REPORT AKM FINAL AND VISUAL AUDIT PLAN

on:
  push:
    branches:
      - RAPPORT
    paths:
      - '.github/workflows/report-akm-final-and-visual-audit-plan.yml'

permissions:
  contents: write

jobs:
  append-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Append verified AKM conclusion and next audit
        env:
          REPORT_APPEND_B64: ''
        run: |
          python -c "import os,base64; open('RAPPORT_SUIVI_ECU_MEMS_MANAGER.md','ab').write(base64.b64decode(os.environ['REPORT_APPEND_B64']))"
      - name: Commit report update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git diff --cached --quiet && exit 1
          git commit -m "Report AKM final source status and visual audit plan"
          git push origin HEAD:RAPPORT
