name: Apply robust Visual C++ runtime discovery

on:
  push:
    branches: ["lab-expert-engine"]
    paths:
      - ".github/workflows/apply-vs-runtime-discovery.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch runtime discovery
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/ia-mems-final-package.yml')
          text = p.read_text(encoding='utf-8')
          old = '''          $vcRoots = @(\n            "C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Redist\\MSVC",\n            "C:\\Program Files\\Microsoft Visual Studio\\2022\\Professional\\VC\\Redist\\MSVC",\n            "C:\\Program Files\\Microsoft Visual Studio\\2022\\Community\\VC\\Redist\\MSVC"\n          )\n          $vcCrt = $null\n          foreach ($root in $vcRoots) {\n            if (-not (Test-Path $root)) { continue }\n            $candidate = Get-ChildItem $root -Directory | Sort-Object Name -Descending | ForEach-Object {\n              Join-Path $_.FullName "x64\\Microsoft.VC143.CRT"\n            } | Where-Object { Test-Path $_ } | Select-Object -First 1\n            if ($candidate) { $vcCrt = $candidate; break }\n          }\n          if (-not $vcCrt) { throw "Microsoft.VC143.CRT x64 redistributable directory not found" }\n'''
          new = '''          $visualStudioRoots = @(\n            "C:\\Program Files\\Microsoft Visual Studio",\n            "C:\\Program Files (x86)\\Microsoft Visual Studio"\n          )\n          $vcCrt = $null\n          foreach ($vsRoot in $visualStudioRoots) {\n            if (-not (Test-Path $vsRoot)) { continue }\n            $candidate = Get-ChildItem $vsRoot -Directory -Recurse -ErrorAction SilentlyContinue |\n              Where-Object {\n                $_.Name -like "Microsoft.VC*.CRT" -and\n                $_.Parent -and $_.Parent.Name -eq "x64"\n              } | Sort-Object FullName -Descending | Select-Object -First 1\n            if ($candidate) { $vcCrt = $candidate.FullName; break }\n          }\n          if (-not $vcCrt) {\n            throw "Microsoft Visual C++ x64 app-local redistributable directory not found"\n          }\n          Write-Host "Using app-local VC++ runtime from: $vcCrt"\n'''
          if old not in text:
              raise SystemExit('old Visual C++ discovery block not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8', newline='\n')

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/ia-mems-final-package.yml
          git commit -m "Discover app-local VC++ runtime across Visual Studio versions"
          git pull --rebase origin lab-expert-engine
          git push origin HEAD:lab-expert-engine
