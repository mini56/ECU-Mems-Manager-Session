name: Recherche V167 - inventaire signatures essence
on:
  push:
    branches: [research/mems-firmwares-20261126]
    paths: ['research/diagnostic-integral-20261128/audit_signatures_v167.py','.github/workflows/research-signatures-v167.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 research/diagnostic-integral-20261128/audit_signatures_v167.py
      - uses: actions/upload-artifact@v4
        with:
          name: signatures-essence-V167
          path: research/diagnostic-integral-20261128/results_v167
      - name: Enregistrer les preuves
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/diagnostic-integral-20261128/results_v167
          if ! git diff --cached --quiet; then
            git commit -m "V167 : qualification des champs 68K [skip ci]"
            git pull --rebase origin research/mems-firmwares-20261126
            git push origin HEAD:research/mems-firmwares-20261126
          fi
