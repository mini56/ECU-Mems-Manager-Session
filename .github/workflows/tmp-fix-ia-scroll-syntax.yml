name: TEMP fix IA scroll syntax

on:
  push:
    branches: [tmp-ravemems-ia-visual-integration]
    paths:
      - '.github/workflows/tmp-fix-ia-scroll-syntax.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-ravemems-ia-visual-integration
          fetch-depth: 0
      - name: Verify protected production and current broken head
        shell: bash
        run: |
          git fetch origin MEMSX64 tmp-ravemems-ia-visual-integration
          test "$(git rev-parse origin/MEMSX64)" = "1d6316bd1746d6f2b4cfb751cab88d18e27ef730"
          test "$(git rev-parse HEAD^)" = "897d0202dc11d462a6d5ba82857b1f17ec355bbf"
      - name: Fix only HTML anchor quoting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('iamemstab.cpp')
          text = p.read_text(encoding='utf-8')
          bad = 'm_transcript->append(QStringLiteral("<a name="%1"></a><p><b>%2</b><br>%3</p>")'
          good = 'm_transcript->append(QStringLiteral("<a name=\'%1\'></a><p><b>%2</b><br>%3</p>")'
          if text.count(bad) != 1:
              raise SystemExit(f'Expected broken literal exactly once, got {text.count(bad)}')
          p.write_text(text.replace(bad, good, 1), encoding='utf-8')
          PY
          grep -F "<a name='%1'></a><p><b>%2</b><br>%3</p>" iamemstab.cpp
      - name: Commit correction and remove helper
        shell: bash
        run: |
          git rm .github/workflows/tmp-fix-ia-scroll-syntax.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iamemstab.cpp
          git commit -m 'Fix IA transcript anchor literal syntax'
          test "$(git diff --name-only a7fd59f41a162cd6f1c9120122fd7426a83231be..HEAD)" = "iamemstab.cpp"
          git push origin HEAD:tmp-ravemems-ia-visual-integration
