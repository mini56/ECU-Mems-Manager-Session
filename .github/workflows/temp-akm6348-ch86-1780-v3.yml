name: TEMP AKM6348 CH86 1780 V3
on:
  push:
    branches: [tmp-rave-visual-backfill]
    paths:
      - '.github/workflows/temp-akm6348-ch86-1780-v3.yml'
permissions:
  contents: write
jobs:
  build_validate_commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-rave-visual-backfill
          fetch-depth: 0
      - name: Verify production remains BUILD 101
        shell: bash
        run: |
          git fetch origin MEMSX64
          test "$(git rev-parse origin/MEMSX64)" = "22dbe75ed14e0a61e694159d505ef72245116b48"
      - name: Align 1780 builder with real committed 1770 keys and mixed qz encodings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/build_akm6348_ch86_1780.py')
          text=p.read_text(encoding='utf-8')
          old="""def decode_qz64(path:Path)->bytes:\n    compact=b''.join(path.read_bytes().split())\n    return qt_uncompress(base64.b64decode(compact))\n"""
          new="""def decode_qz64(path:Path)->bytes:\n    raw=path.read_bytes()\n    # Historical enrichment files use both raw Qt qCompress bytes and\n    # Base64-wrapped qCompress. Preserve both historical encodings.\n    try:\n        return qt_uncompress(raw)\n    except Exception:\n        compact=b''.join(raw.split())\n        return qt_uncompress(base64.b64decode(compact))\n"""
          assert old in text
          text=text.replace(old,new)
          text=text.replace("GENERAL_SCOPE='SCOPE-MINI-AKM6348-FR-1976-ON'","GENERAL_SCOPE='SCOPE-AKM6348-FR-MINI-1976-03-PLUS'")
          text=text.replace("SOURCE_KEY='AKM6348-FR'","SOURCE_KEY='SRC-AKM6348-FR-WEB-20260829'")
          text=text.replace('KNOW-AKM6348-FR-DOC-SCOPE','KNOW-DOC-AKM6348-FR')
          p.write_text(text,encoding='utf-8',newline='\n')
          PY
      - name: Install PDF dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check --quiet PyMuPDF==1.26.4
      - name: Download and verify exact CH86 source
        shell: bash
        run: |
          curl -L --fail --retry 3 --retry-delay 2 -A 'Mozilla/5.0' \
            'http://virgyl.f.free.fr/Download/Manuel/CH86.pdf' -o /tmp/CH86.pdf
          test "$(stat -c '%s' /tmp/CH86.pdf)" = "7626962"
          test "$(sha256sum /tmp/CH86.pdf | awk '{print $1}')" = "14fcb88e3f450cab47129b2acc8df948e1d4002418deef63a95ce45157be0594"
          head -c 5 /tmp/CH86.pdf | grep -q '%PDF-'
      - name: Build and validate complete CH86 batch 1780
        shell: bash
        run: |
          python -m py_compile tools/build_akm6348_ch86_1780.py
          python tools/build_akm6348_ch86_1780.py --root . --pdf /tmp/CH86.pdf --work /tmp/akm6348-ch86-1780
      - name: Guard exact documentary scope
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          expected={'tools/build_akm6348_ch86_1780.py','database/reference/manifest.json','database/reference/research_enrichment_1780.qz64','database/reference/audits/akm6348_ch86_1780_audit.md'}
          for p in range(1,45): expected.add(f'database/reference/images/rave/AKM6348_FR_CH86_86_{p:02d}.png')
          for seg in range(1,5): expected.add(f'database/reference/images/rave/AKM6348_FR_CH86_86_45_SEG{seg}.png')
          for p in range(46,50): expected.add(f'database/reference/images/rave/AKM6348_FR_CH86_86_{p:02d}.png')
          out=subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True)
          actual={line[3:] for line in out.splitlines() if line.strip()}
          print('CHANGED_COUNT='+str(len(actual)))
          if actual!=expected:
              print('UNEXPECTED',sorted(actual-expected));print('MISSING',sorted(expected-actual))
          assert actual==expected
          assert len(actual)==56
          PY
      - name: Commit complete CH86 batch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/build_akm6348_ch86_1780.py database/reference/manifest.json database/reference/research_enrichment_1780.qz64 database/reference/audits/akm6348_ch86_1780_audit.md database/reference/images/rave/AKM6348_FR_CH86_*.png
          git commit -m 'Complete AKM6348 French CH86 batch 1780'
          git push origin HEAD:tmp-rave-visual-backfill
      - name: Verify committed batch from repository bytes
        shell: bash
        run: |
          git fetch origin tmp-rave-visual-backfill
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/tmp-rave-visual-backfill)"
          test -z "$(git status --porcelain --untracked-files=all)"
          python - <<'PY'
          import importlib.util, json, sqlite3, tempfile
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('akm','tools/build_akm6348_ch86_1780.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          ref=Path('database/reference');dbp=Path(tempfile.mkdtemp())/'verify.sqlite';m.rebuild_reference_database(ref,dbp)
          db=sqlite3.connect(str(dbp))
          try:
            m.execute_project_sql(db,m.decode_qz64(ref/'research_enrichment_1780.qz64'));db.execute('PRAGMA user_version=20');db.commit()
            assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
            assert db.execute('SELECT COUNT(*) FROM mems_rave_fact').fetchone()[0]==93
            assert db.execute('SELECT COUNT(*) FROM mems_expert_fact_external').fetchone()[0]==105
            assert db.execute("SELECT COUNT(*) FROM mems_knowledge_item WHERE knowledge_key='KNOW-DOC-AKM6348-FR'").fetchone()[0]==1
            assert db.execute("SELECT COUNT(*) FROM mems_rave_illustration WHERE document='AKM6348-FR-CH86'").fetchone()[0]==52
            assert db.execute("SELECT COUNT(DISTINCT source_page) FROM mems_rave_illustration WHERE document='AKM6348-FR-CH86'").fetchone()[0]==49
            assert db.execute("SELECT COUNT(*) FROM mems_rave_illustration WHERE document='AKM6348-FR-CH86' AND source_page='86-45'").fetchone()[0]==4
            assert db.execute("SELECT COUNT(*) FROM mems_knowledge_item WHERE document='AKM6348-FR-CH86'").fetchone()[0]==34
          finally:db.close()
          manifest=json.loads((ref/'manifest.json').read_text(encoding='utf-8'));assert 'research_enrichment_1780.qz64' in manifest['research_enrichment_batches']
          vals={k:v for k,v in manifest.get('visual_assets',{}).items() if k.startswith('rave:AKM6348-FR-CH86:PDF:')};assert len(vals)==52
          for v in vals.values():
              p=ref/v['path'];assert p.is_file() and m.sha256_file(p)==v['sha256']
          print('AKM6348_CH86_1780_REMOTE_VERIFY_PASS')
          PY
      - name: Remove downloaded copyrighted source
        if: always()
        shell: bash
        run: rm -f /tmp/CH86.pdf
