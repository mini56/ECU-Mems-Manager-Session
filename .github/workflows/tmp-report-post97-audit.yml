name: TEMP REPORT POST97 AUDIT

on:
  push:
    branches: [RAPPORT]

permissions:
  contents: write

env:
  REPORT_BLOCK_B64: 

jobs:
  append_report:
    if: github.event.head_commit.message != 'REPORT append post97 audit validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          persist-credentials: true
      - name: Append post97 audit history
        shell: bash
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path('RAPPORT_SUIVI_ECU_MEMS_MANAGER.md')
          text = path.read_text(encoding='utf-8')
          marker = '# AUDIT ET CORRECTION APRÈS TEST RÉEL #97 — CANDIDAT VALIDÉ AVANT PRODUCTION'
          if marker not in text:
              block = base64.b64decode(os.environ['REPORT_BLOCK_B64']).decode('utf-8')
              path.write_text(text.rstrip() + '\n\n' + block.strip() + '\n', encoding='utf-8')
          PY
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "REPORT append post97 audit validation"
          git push origin HEAD:RAPPORT
