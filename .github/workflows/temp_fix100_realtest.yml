name: TEMP FIX100 REALTEST VALIDATION

on:
  push:
    branches: [tmp-fix100-realtest-final]

permissions:
  contents: write

jobs:
  validate_fix100:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      BASE100: 'cd6e52c714ee35a3fffb405797f14a58c2da4fa5'

    steps:
      - name: Checkout exact temporary branch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply idempotent real-test patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/temp_fix100_realtest.py
          if ($LASTEXITCODE -ne 0) { throw "fix100 patch driver failed: $LASTEXITCODE" }

      - name: Guard exact source scope and invariants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import os, subprocess
          from pathlib import Path

          base=os.environ['BASE100']
          allowed={
              'iamemstab.cpp',
              'expert/IaMemsConversationRouting.h',
              'expert/IaMemsService.cpp',
              'expert/IaResponseLogicTest.cpp',
              '.github/workflows/temp_fix100_realtest.yml',
              'tools/temp_fix100_realtest.py',
          }
          committed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'], text=True).splitlines())
          working=set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          changed=committed|working
          unexpected=sorted(changed-allowed)
          if unexpected:
              raise SystemExit('Unexpected changed files: '+', '.join(unexpected))
          expected_source={
              'iamemstab.cpp',
              'expert/IaMemsConversationRouting.h',
              'expert/IaMemsService.cpp',
              'expert/IaResponseLogicTest.cpp',
          }
          source={p for p in changed if p in expected_source}
          if source != expected_source:
              raise SystemExit(f'Expected exact source scope {sorted(expected_source)}, got {sorted(source)}')

          tab=Path('iamemstab.cpp').read_text(encoding='utf-8')
          pending='const QString pending = m_pendingClarificationQuestion;\n        m_pendingClarificationQuestion.clear();'
          if pending not in tab:
              raise SystemExit('Pending clarification is not consumed before early returns')

          routing=Path('expert/IaMemsConversationRouting.h').read_text(encoding='utf-8')
          if 'isWireColourQuestion' not in routing or 'QStringLiteral("fils")' not in routing:
              raise SystemExit('Plural fils wire-colour routing fix missing')
          if 'isReferenceSheetRequest' not in routing:
              raise SystemExit('Reference-sheet routing helper missing')

          service=Path('expert/IaMemsService.cpp').read_text(encoding='utf-8')
          if 'IaMemsConversationRouting::isWireColourQuestion(questionText)' not in service:
              raise SystemExit('Service does not use shared wire-colour classifier')
          if 'La fiche XML MEMS %1 est disponible dans le package local.' not in service:
              raise SystemExit('Single fiche response missing')

          tests=Path('expert/IaResponseLogicTest.cpp').read_text(encoding='utf-8')
          for token in ('plural French fils', 'single reference-sheet request', 'standalone MAP value request'):
              if token not in tests:
                  raise SystemExit('Missing regression test: '+token)

          header=Path('memsinterface.h').read_text(encoding='utf-8')
          if 'void onProtocolCommandRequested(quint8 command);' not in header:
              raise SystemExit('Required protocol declaration missing')
          print('PASS exact fix100 source scope and invariants')
          '@ | python -

      - name: Validate existing protocol guards
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python librosco-x64/validate_protocol_guards.py
          if ($LASTEXITCODE -ne 0) { throw "protocol guard validation failed: $LASTEXITCODE" }

      - name: Install Qt 5.15.2 MSVC 2019 x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0"
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          if (Test-Path 'C:\Qt') { Remove-Item 'C:\Qt' -Recurse -Force -ErrorAction SilentlyContinue }
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtcharts -O C:\Qt --external "$sevenZip"
          if ($LASTEXITCODE -ne 0) { throw "aqtinstall failed: $LASTEXITCODE" }

      - name: Configure x64 without ONNX packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qt='C:\Qt\5.15.2\msvc2019_64'
          cmake -S . -B build-fix100 -A x64 `
            -DCMAKE_PREFIX_PATH="$qt" `
            -DMEMS_USE_BUNDLED_LIBROSCO_X64=ON `
            -DMEMS_USE_ONNX_GENAI=OFF `
            -DMEMS_RUN_REFERENCE_SELFTEST_POST_BUILD=OFF
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed: $LASTEXITCODE" }

      - name: Compile application and deterministic IA self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build-fix100 --config Release --target ecu_mems_manager ia_response_selftest --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "x64 build failed: $LASTEXITCODE" }

      - name: Run deterministic IA response tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtBin='C:\Qt\5.15.2\msvc2019_64\bin'
          if (-not (Test-Path "$qtBin\Qt5Core.dll")) { throw "Qt5Core.dll missing from $qtBin" }
          $env:PATH = "$qtBin;$env:PATH"
          & .\build-fix100\Release\ia_response_selftest.exe
          if ($LASTEXITCODE -ne 0) { throw "IA response self-test failed: $LASTEXITCODE" }

      - name: Commit validated source patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths=@('iamemstab.cpp','expert/IaMemsConversationRouting.h','expert/IaMemsService.cpp','expert/IaResponseLogicTest.cpp')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $paths
          git commit -m 'Fix #100 real-test IA regressions'
          if ($LASTEXITCODE -ne 0) { throw "source commit failed: $LASTEXITCODE" }
          git push origin HEAD:tmp-fix100-realtest-final
          if ($LASTEXITCODE -ne 0) { throw "source push failed: $LASTEXITCODE" }

      - name: Remove temporary validation files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm -- .github/workflows/temp_fix100_realtest.yml tools/temp_fix100_realtest.py
          git commit -m 'Remove temporary fix100 validation files'
          if ($LASTEXITCODE -ne 0) { throw "cleanup commit failed: $LASTEXITCODE" }
          git push origin HEAD:tmp-fix100-realtest-final
          if ($LASTEXITCODE -ne 0) { throw "cleanup push failed: $LASTEXITCODE" }
