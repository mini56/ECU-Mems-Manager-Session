name: TEMP RCL0193FRE 1830 FINAL INSTALL
on:
  push:
    branches: [tmp-rave-visual-backfill]
    paths:
      - '.github/workflows/temp-rcl0193fre-1830-install.yml'
      - 'tools/install_rcl0193fre_1830.py'
permissions:
  contents: write
concurrency:
  group: rcl0193fre-1830-final
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-rave-visual-backfill
          fetch-depth: 0
      - name: Verify production remains BUILD 101
        shell: bash
        run: |
          test "$(git ls-remote origin refs/heads/MEMSX64 | cut -f1)" = "22dbe75ed14e0a61e694159d505ef72245116b48"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Fetch exact validated 1830 transport
        shell: bash
        env:
          G4_URL: 'https://tmpfiles.org/dl/1788033437.d1484c8f6a8c214b/wSwVB8G1PaC5/rcl0193fre_1830_g4_150.tif.xz'
          QZ_URL: 'https://tmpfiles.org/dl/1788033437.f6eb8a011df63ffd/wrwKBrG5PJ2z/research_enrichment_1830.qz64'
        run: |
          mkdir -p .rcl1830_transport
          curl -fL --retry 4 --retry-delay 2 "$G4_URL" -o .rcl1830_transport/rcl0193fre_1830_g4_150.tif.xz
          curl -fL --retry 4 --retry-delay 2 "$QZ_URL" -o .rcl1830_transport/research_enrichment_1830.qz64
          echo '0528cb3bf3bdf7c67c8312729de2d822e63c439f5178899d4c0055ffefb21d2f  .rcl1830_transport/rcl0193fre_1830_g4_150.tif.xz' | sha256sum -c -
          echo 'e22d16708d23ac0cedaad6ad7e2811115025a218f6101ce9551a5c19917851c7  .rcl1830_transport/research_enrichment_1830.qz64' | sha256sum -c -
      - name: Install and validate 1830
        shell: bash
        run: |
          cp tools/install_rcl0193fre_1830.py /tmp/install_rcl0193fre_1830.py
          python /tmp/install_rcl0193fre_1830.py install "$GITHUB_WORKSPACE"
      - name: Commit complete 1830
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/temp-rcl0193fre-1830-install.yml tools/install_rcl0193fre_1830.py
          rm -rf .rcl1830_transport
          git add database/reference/research_enrichment_1830.qz64 database/reference/manifest.json database/reference/audits/rcl0193fre_1830_audit.md database/reference/images/rave/RCL0193FRE_PDF_*.png
          python -c "import re,subprocess; lines=subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).splitlines(); pats=[re.compile(r'^database/reference/research_enrichment_1830\\.qz64$'),re.compile(r'^database/reference/manifest\\.json$'),re.compile(r'^database/reference/audits/rcl0193fre_1830_audit\\.md$'),re.compile(r'^database/reference/images/rave/RCL0193FRE_PDF_\\d{3}\\.png$'),re.compile(r'^\\.github/workflows/temp-rcl0193fre-1830-install\\.yml$'),re.compile(r'^tools/install_rcl0193fre_1830\\.py$')]; bad=[x for x in lines if not any(p.fullmatch(x[3:]) for p in pats)]; assert not bad,bad"
          git commit -m 'Add RCL0193FRE suspension brakes batch 1830'
          git push origin HEAD:tmp-rave-visual-backfill
      - name: Verify committed remote state
        shell: bash
        run: |
          git fetch origin tmp-rave-visual-backfill
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/tmp-rave-visual-backfill)"
          python /tmp/install_rcl0193fre_1830.py post "$GITHUB_WORKSPACE"
