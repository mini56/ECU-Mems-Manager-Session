name: TEMP journal full RAVEMEMS visual linking

on:
  push:
    branches: [RAPPORT]
    paths: ['.github/workflows/tmp-ravemems-journal-full-visual-linking.yml']

permissions:
  contents: write

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 1
      - name: Append action and self-delete
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '' '## 1 SEPTEMBRE 2026 — ACTION AUTORISEE — TOUS LES VISUELS RAVEMEMS POUR IA' '- Validation utilisateur : les 1 070 assets visuels RAVEMEMS et les 1 794 occurrences visuelles doivent etre disponibles pour l interface IA lorsqu une reponse correspond a un schema, une illustration, une photo technique ou un dessin constructeur.' '- UI : un seul libelle suffit pour tous les cas : « Voir le schema ».' '- Pages purement texte : pas de lien UI necessaire ; elles restent seulement source interne/audit.' '- Action : import total et conservation de tous les visuels RAVEMEMS dans la base enrichie, puis liaison additive vers la couche documentaire afin que l IA puisse retrouver un visuel associe. Aucune suppression/fusion historique.' '- Regle de securite : aucune table historique modifiee ; MEMSX64 reste strictement BUILD #103.' '- PROCHAINE ACTION EXACTE : produire et tester sur tmp-rave-new-extraction-pilot une couche de liaison visuelle additive couvrant 1 070 assets / 1 794 occurrences, verifier integralite, idempotence, preservation bit-a-bit logique des tables historiques et disponibilite de chaque occurrence depuis son contexte documentaire ; ne pas integrer MEMSX64.' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          rm -f .github/workflows/tmp-ravemems-journal-full-visual-linking.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md .github/workflows/tmp-ravemems-journal-full-visual-linking.yml
          git commit -m 'Journal full RAVEMEMS visual linking action'
          git push origin RAPPORT
