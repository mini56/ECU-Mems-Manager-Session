name: TEMP journal implicit visual diagnosis
on:
  push:
    branches: [RAPPORT]
    paths:
      - '.github/workflows/tmp-journal-visual-implicit-diagnosis.yml'
permissions:
  contents: write
jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Append diagnosis
        shell: bash
        run: |
          {
            printf '%s\n' '' '## 2026-09-02 — DIAGNOSTIC CAUSE REELLE — VISUEL NON PROPOSE SUR COUPLE CULASSE'
            printf '%s\n' '' 'Verification du package exact artefact 9815810470 : `database/reference/images/rave/RCL0193FRE_PDF_042.png` et `database/reference/images/rave/RCL0193FRE_PDF_174.png` sont bien presents. La page 42 est en plus declaree dans `runtime_visual_catalog.json` avec `ui_visible=true`, `ui_label=Voir le schéma`, contexte `RAVE RCL0193FRE PDF 042 Couples de serrage généraux moteur`, et chemin runtime `legacy/database/reference/images/rave/RCL0193FRE_PDF_042.png`. La page 174 existe comme fichier mais nest pas une entree du catalogue de proposition.'
            printf '%s\n' '' 'Cause code prouvee dans `expert/IaMemsDiagramCatalog.cpp` : `suggestionForQuestion()` exige actuellement un `diagramIntent` explicite contenant des termes tels que schema/brochage/connecteur/cablage/voir AVANT de consulter `runtime_visual_catalog.json`. La question reelle `Quel est le couple de serrage de la culasse ?` ne contient aucun de ces termes ; la fonction retourne donc immediatement aucune suggestion, bien que la page 42 soit disponible et pertinente.'
            printf '%s\n' '' 'Conception de correction autorisee sur branche de test uniquement : conserver le chemin actuel des demandes explicites de schema ; pour une question sans intention graphique explicite, consulter uniquement le catalogue runtime avec un seuil de pertinence renforce, au moins deux termes techniques significatifs / score minimal 16, sans fallback vers les anciens schemas generiques. Completer les stop-words du matcher afin deviter les faux positifs sur des mots grammaticaux. Ajouter un self-test exact pour `Quel est le couple de serrage de la culasse ?` -> page 42, tout en conservant le test `Mon moteur chauffe-t-il trop au ralenti ?` -> aucune suggestion.'
            printf '%s\n' '' 'PROCHAINE ACTION EXACTE : modifier uniquement `expert/IaMemsDiagramCatalog.cpp` et `expert/IaMemsDiagramSelfTest.cpp` sur `tmp-ravemems-ia-visual-integration`, lancer les self-tests et reconstruire le package x64 de test. `MEMSX64` reste BUILD #103 et le protocole ECU reste intouche.'
          } >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
      - name: Commit journal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-journal-visual-implicit-diagnosis.yml
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git commit -m "Journal implicit visual suggestion diagnosis"
          git push origin HEAD:RAPPORT
