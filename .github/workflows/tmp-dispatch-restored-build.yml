name: TMP Dispatch restored IA package

on:
  push:
    branches: [tmp-build108-memslibrary-relevance-integration]
    paths:
      - '.github/workflows/tmp-dispatch-restored-build.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch restored package build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run tmp-build108-memslibrary-relevance-integration.yml --repo "$GITHUB_REPOSITORY" --ref tmp-build108-memslibrary-relevance-integration
