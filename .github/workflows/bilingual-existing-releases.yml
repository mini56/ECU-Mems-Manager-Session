name: Traduire les descriptions des Releases SESSION en anglais après le français
on:
  push:
    branches: [fix-documentary-additive-session-161-20261118]
    paths: ['.github/workflows/bilingual-existing-releases.yml']
permissions:
  contents: write
jobs:
  bilingual-release-notes-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ajouter uniquement la version anglaise aux descriptions existantes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          translations=json.loads(r'''{"mems-session-build-170":"ECU MEMS Manager SESSION 170 — vehicle years in documentary search results\n\n- The Generation column displays manufacturer-verified model-year periods from the French documentary pack.\n- Original AKM7169FRE: 429 entries marked 92+; RCL0193FRE: 5,694 entries marked 96+.\n- The updated French pack is available separately under Documentary Database Updates.\n- Other ECU functions, MEMS AI and page layouts are unchanged.\n- Windows x64 installer built, installed and tested in GitHub Actions before publication.","mems-session-build-169":"ECU MEMS Manager SESSION 169 — MEMS AI and Database corrections\n\n- Type column reduced to 82 px; Generation set to 114 px; the remaining width is allocated to Result.\n- Generation shows vehicle-year periods from available manufacturer years and applicability information.\n- Result shows readable manufacturer technical descriptions instead of internal PROC and torque identifiers.\n- Database page tested; MEMS AI, databases and other pages unchanged.\n- The installer contains neither personal databases nor manufacturer document packs; those are installed separately.\n- Windows x64 installer built, installed and tested in GitHub Actions before publication.","mems-session-build-167":"ECU MEMS Manager SESSION 167 — MEMS AI and Database corrections\n\n- The Type column is narrower to provide more room for result titles.\n- Documentary entry names and record titles are shown instead of internal identifiers.\n- MEMS generations are retrieved from explicit database metadata.\n- Orange scrollbars throughout dark mode; light mode preserved.\n- Database contents and MEMS AI behavior unchanged.\n- Personal databases and manufacturer packs are not included in the installer; packs are installed separately.\n- Windows x64 installer built, installed and tested in GitHub Actions before publication.","mems-session-build-166":"ECU MEMS Manager SESSION 166 — MEMS AI and Database corrections\n\n- Automatically added warnings and comments have been removed from MEMS AI answers.\n- Original documentary transcriptions and steps are shown, including excerpts previously hidden by documentary status.\n- Manufacturer images are displayed in additional documentary databases.\n- Manufacturer provenance and pack-integrity checks are preserved.\n- No changes to installed databases or the Analysis page fixes.\n- The installer contains no personal or manufacturer databases; documentary packs are installed separately.\n- Windows x64 installer built, installed and tested in GitHub Actions before publication.","mems-session-build-165":"ECU MEMS Manager SESSION 165 — MEMS AI and Database corrections\n\n- French database text is displayed without discarding indexed notices.\n- Authenticated images can be displayed and opened from additional packs.\n- SQLite provenance, revisions and source pages remain visible in the Database page.\n- Expired menu numbers are rejected to avoid opening an unrelated section.\n- Installed databases and Analysis page scrolling fixes are preserved.\n- Personal databases and manufacturer packs are not bundled with the installer.\n- Windows x64 installer built, installed and tested in GitHub Actions before publication.","mems-session-build-164":"ECU MEMS Manager SESSION 164 — Analysis channel-list scrolling fix\n\n- Analysis: a visible vertical scrollbar allows access to all channels, including those beyond the panel height.\n- Selection and overlay buttons stay fixed. Scrolling is recalculated when a CSV is loaded or the source changes.\n- Windows checks confirm that the final channel remains accessible without moving command buttons.\n- All 15 pages checked in six languages, retaining SESSION 162 improvements.\n- MEMS AI tab, engine status indicators, USB cable test, manufacturer viewer and documentary database manager translated.\n- Integrated offline help includes 24 sections in each of the six languages.\n- All documentary and ECU databases are preserved, with no migration of user data.\n- Reader and search support multiple documentary databases in one language, with images resolved using verified metadata.\n- Builds on SESSION 162 while retaining ECU functions, AI and documentary databases.\n- The installer contains neither personal databases nor manufacturer packs; documentary packs use a separate secure update.\n- Windows x64 installer built, installed and tested in GitHub Actions before publication.","mems-session-build-160":"ECU MEMS Manager SESSION 160 — Windows x64 installer.\n\nCI-validated version (run #44144170646, commit bcf8cce96bf52d9d59d92f3398babb847ad8094f).\n\nChanges:\n- New independent “USB Cable Test” tab: detection of FTDI FT232, CH340/CH341 and other serial adapters; COM-port list; 15-second connection detection; optional port-opening test.\n\nFiles: Windows installer and SHA-256 checksum.","session-140-admin-encrypted-documentary-TEST":"Windows test prerelease built, installed and launched on GitHub CI. The update button verifies the pack's SHA-256, requires the administrator-defined encryption secret and validates AES-GCM before installing the documentary SQLite with a backup. Users cannot define their own password. Windows installation tests and rejection of an incorrect secret were performed. No manufacturer database or manual is included. At this stage the documentary packs were not yet published on the update site.","mems-session-build-136":"ECU MEMS Manager SESSION BUILD 136 (Windows x64, version 1.1.36). Approved page styles are frozen with blocking Git SHA checks and Qt visual-invariant tests. Includes 14 pages, ONNX AI, ROSCO and RAVE/MEMSLibrary. Build, regression, startup and Windows installation tests passed. The visual source code of approved pages is unchanged from the reference build. Personal SQLite database is not bundled. Commit: 2e242a14bffff7cb6f7020c4e4fd97880271166c. Release for PC testing.","mems-session-build-135":"ECU MEMS Manager SESSION BUILD 135 (Windows x64, version 1.1.35). Approved page styles are frozen with blocking Git SHA checks and Qt visual-invariant tests. Includes 14 pages, ONNX AI, ROSCO and RAVE/MEMSLibrary. Build, regression, startup and Windows installation tests passed. The visual source code of approved pages is unchanged from the reference build. Personal SQLite database is not bundled. Commit: 2f79d5c283fa3f131563837334631cb6e635240c. Release for PC testing.","mems-session-cleanup-test-42841467162":"Test Windows x64 installer from the consolidated source code. Includes 14 pages, ONNX AI, ROSCO and RAVE/MEMSLibrary. AI/MEMS build and tests, GUI smoke test and real Windows installation verified in CI. Personal SQLite database not included. Reference BUILD 134 branch preserved. Commit: 0d061294d90c8273f9d5ce0dbb08d6731d6cc4a8.","mems-session-cleanup-test-42838213990":"Test Windows x64 installer from the consolidated source code. Includes 14 pages, ONNX AI, ROSCO and RAVE/MEMSLibrary. AI/MEMS build and tests, GUI smoke test and real Windows installation verified in CI. Personal SQLite database not included. Reference BUILD 134 branch preserved. Commit: 57f3c395b80cb66fcd406297daba2710ed0e9dce.","mems-session-cleanup-test-42832473017":"Test Windows x64 installer from the consolidated source code. Includes 14 pages, ONNX AI, ROSCO and RAVE/MEMSLibrary. AI/MEMS build and tests, GUI smoke test and real Windows installation verified in CI. Personal SQLite database not included. Reference BUILD 134 branch preserved. Commit: b12928630b8b79ff1be739ef6fb34a95b971fddd.","mems-session-cleanup-test-42828262335":"Test Windows x64 installer from the consolidated source code. Includes 14 pages, ONNX AI, ROSCO and RAVE/MEMSLibrary. AI/MEMS build and tests, GUI smoke test and real Windows installation verified in CI. Personal SQLite database not included. Reference BUILD 134 branch preserved. Commit: 8e2e2e4bf0b737a09f105df33a5b0caabc9f8756.","mems-session-134-test-42667329231":"SESSION test version for Windows x64, with 14 pages and active ONNX AI. Only the Settings page was visually corrected, directly in the original source. Competing legacy implementations were removed. The official SESSION name was restored. Technical identifiers and data were preserved. No global zoom or Windows resolution change. Splash title and subtitle rendered at native high resolution. Test installer for visual validation on the user's PC. An upgrade from build 133 remains possible thanks to the unchanged AppId. Separate from LIGHT. Personal database not included.","mems-build127-candidate-39574920211":"BUILD 127 LIGHT x64: page font size raised to at least 11 pt; “All Measurements” and “All Data” preserved; horizontal scrolling available for dense tables on smaller screens; 44 navigation checks across four resolutions; SQLite installation and desktop shortcut validated.","mems-build124-candidate-39554630987":"LIGHT v1.0.124: designed pages kept at a minimum width of 1,300 pixels; stable fonts after all 11 menu clicks; three links hidden; all 14 pages preserved; SQLite tests and Windows installation with a desktop icon verified.","mems-build117-candidate-39395038798":"Test candidate: SQLite stored in AppLocalData; migration preserved; installation supported on a fresh PC or an already configured one. Existing builds unchanged.","session-139-documentary-offline-TEST":"Test Windows installer, installed and launched on the Windows CI runner. Supports local import of password-protected documentary ZIP databases, SQLite verification and backup. No Rover database, personal data or manufacturer archive is bundled. Import only documentary ZIP files whose provenance has been verified. This is NOT a publication of documentary databases."}''')
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          prefix="https://api.github.com/repos/"+repo+"/releases"
          updated=0
          for tag,english in translations.items():
              req=urllib.request.Request(prefix+"/tags/"+tag,headers=headers)
              with urllib.request.urlopen(req) as response:
                  release=json.load(response)
              original=release.get("body") or ""
              if "\n### English\n" in original:
                  print("ALREADY_BILINGUAL",tag)
                  continue
              assert original.strip(), "EMPTY_ORIGINAL_FRENCH_NOT_ALLOWED_"+tag
              bilingual=original.rstrip()+"\n\n---\n\n### English\n\n"+english.strip()+"\n"
              payload=json.dumps({"body":bilingual},ensure_ascii=False).encode("utf-8")
              patch=urllib.request.Request(prefix+"/"+str(release["id"]),data=payload,
                  headers={**headers,"Content-Type":"application/json"},method="PATCH")
              with urllib.request.urlopen(patch) as response:
                  changed=json.load(response)
              assert (changed.get("body") or "")==bilingual, "RELEASE_NOTE_UPDATE_NOT_VERIFIED_"+tag
              print("BILINGUAL_OK",tag)
              updated+=1
          print("UPDATED_RELEASES",updated)
          PY
