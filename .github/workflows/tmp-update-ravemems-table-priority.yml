name: TEMP update RAVEMEMS table priority

on:
  push:
    branches:
      - RAPPORT
    paths:
      - '.github/workflows/tmp-update-ravemems-table-priority.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Update cahier and report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/CAHIER_DES_CHARGES_RAVEMEMS_BROUILLON_2026-09-02.md')
          s = p.read_text(encoding='utf-8')
          old = "Extraire autant que possible colonnes, lignes, libellés, valeurs, unités et conditions, particulièrement pour les couples de serrage, résistances, tensions, jeux, pressions, températures, valeurs de contrôle et caractéristiques."
          new = "RAVEMEMS doit extraire **tous les tableaux techniques qu’il sait reconnaître**, en conservant autant que possible colonnes, lignes, libellés, valeurs, unités et conditions. La validation prioritaire porte toutefois sur les tableaux contenant des valeurs techniques directement exploitables par l’IA : couples de serrage, résistances, tensions, jeux, pressions, températures, valeurs de contrôle, diagnostic et caractéristiques techniques."
          if old not in s:
              raise SystemExit('target text not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          r = Path('RAPPORT_SUIVI_ECU_MEMS_MANAGER.md')
          with r.open('a', encoding='utf-8') as f:
              f.write("\n\n## 2026-09-02 — REVUE CAHIER RAVEMEMS : TABLEAUX\n\nDécision utilisateur validée : RAVEMEMS extrait tous les tableaux techniques qu’il sait reconnaître. La validation prioritaire du prototype porte sur les tableaux contenant des valeurs directement exploitables par l’IA : couples de serrage, résistances, tensions, jeux, pressions, températures, valeurs de contrôle, diagnostic et caractéristiques techniques. Aucun code applicatif ni extraction lancé.\n")
          PY
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CAHIER_DES_CHARGES_RAVEMEMS_BROUILLON_2026-09-02.md RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git commit -m "Record RAVEMEMS table extraction priority"
          git rm .github/workflows/tmp-update-ravemems-table-priority.yml
          git commit -m "Remove temporary RAVEMEMS table priority workflow"
          git push origin HEAD:RAPPORT
