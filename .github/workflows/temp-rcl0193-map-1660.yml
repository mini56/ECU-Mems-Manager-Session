name: TEMP RCL0193 MAP 1660

on:
  push:
    branches: [tmp-rave-visual-backfill]
    paths:
      - .github/workflows/temp-rcl0193-map-1660.yml

permissions:
  contents: write

jobs:
  map_sources:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-rave-visual-backfill
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned PDF renderer
        run: python -m pip install PyMuPDF==1.26.4

      - name: Verify immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          PROD=$(git ls-remote origin refs/heads/MEMSX64 | awk '{print $1}')
          test "$PROD" = "22dbe75ed14e0a61e694159d505ef72245116b48"
          echo '5d56f198a6f5ccaf36d7f94646e3b9af4efd465e7f80da0ebea3d74f3d894093  database/reference/research_enrichment_1660.qz64' | sha256sum -c -
          curl --fail --location --retry 3 --output /tmp/RCL0193ENG.pdf 'https://www.uscars.biz/uscars/mini-documents/Rave_CD_wmxn990e.pdf'
          echo 'c050a3eebe50c5a85bf8a69b7722bd2052079944e09d58578a498984ecf06715  /tmp/RCL0193ENG.pdf' | sha256sum -c -

      - name: Parse 31 facts and map exact source pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, re, zlib
          from pathlib import Path
          import fitz

          qz = Path('database/reference/research_enrichment_1660.qz64')
          packed = base64.b64decode(''.join(qz.read_text(encoding='ascii').split()))
          expected_len = int.from_bytes(packed[:4], 'big')
          sql_bytes = zlib.decompress(packed[4:])
          assert len(sql_bytes) == expected_len == 41443, (len(sql_bytes), expected_len)
          assert hashlib.sha256(sql_bytes).hexdigest() == 'b978f7e73487c6243c8a6c355b4e5dedd90cf449bee223e9c1eb81e08eb0a7cd'
          sql = sql_bytes.decode('utf-8')

          marker = 'INSERT OR REPLACE INTO mems_rave_fact'
          rows=[]
          pos=0
          while True:
              start=sql.find(marker,pos)
              if start < 0: break
              values=sql.find('VALUES',start)
              if values < 0: raise SystemExit('VALUES missing')
              lp=sql.find('(',values)
              if lp < 0: raise SystemExit('VALUES ( missing')
              i=lp+1; in_quote=False
              while i < len(sql)-1:
                  c=sql[i]
                  if c=="'":
                      if in_quote and i+1 < len(sql) and sql[i+1]=="'":
                          i += 2; continue
                      in_quote = not in_quote
                      i += 1; continue
                  if not in_quote and sql[i:i+2] == ');':
                      expr=sql[lp+1:i]
                      pos=i+2
                      break
                  i += 1
              else: raise SystemExit('unterminated INSERT')

              fields=[]; token=[]; j=0; in_quote=False
              while j < len(expr):
                  c=expr[j]
                  if c=="'":
                      if in_quote and j+1 < len(expr) and expr[j+1]=="'":
                          token.append("'"); j += 2; continue
                      in_quote=not in_quote; j += 1; continue
                  if c==',' and not in_quote:
                      fields.append(''.join(token).strip()); token=[]; j += 1; continue
                  token.append(c); j += 1
              fields.append(''.join(token).strip())
              if len(fields) != 10:
                  raise SystemExit(f'bad field count {len(fields)} for {fields[:2]}')
              fact_key,source_key,document,variant,topic,statement,source_section,verification_level,image_ref,notes=fields
              if 'RCL0193ENG' in document:
                  rows.append(dict(fact_key=fact_key,source_key=source_key,document=document,variant=variant,topic=topic,
                                   statement=statement,source_section=source_section,verification_level=verification_level,
                                   image_ref=image_ref,notes=notes))

          keys=[r['fact_key'] for r in rows]
          assert len(rows)==31, len(rows)
          assert len(set(keys))==31
          assert all(r['verification_level']=='verifie_constructeur' for r in rows)
          assert all(r['image_ref']=='' for r in rows)

          page_re=re.compile(r'PDF\s+p\.(\d+)(?:-(\d+))?',re.I)
          cited=[]
          for r in rows:
              m=page_re.search(r['source_section'])
              if not m: raise SystemExit('No PDF page in '+r['fact_key']+': '+r['source_section'])
              a=int(m.group(1)); b=int(m.group(2) or a)
              if b<a: raise SystemExit('reverse range '+r['fact_key'])
              r['pages']=list(range(a,b+1)); cited.extend(r['pages'])

          unique_pages=sorted(set(cited))
          expected_pages=[38,39,40,98,101,107,108,109,112,113,114,117,118,120,121,122,123,125,126,127,128,129,130,131,135,170]
          assert unique_pages==expected_pages, (unique_pages, expected_pages)

          doc=fitz.open('/tmp/RCL0193ENG.pdf')
          assert doc.page_count==372

          stop={'pdf','engine','management','system','mems','repairs','repair','adjustments','adjustment','description','operation','sensor','model','data','page'}
          def anchors(section):
              tail=section.split('/',1)[1] if '/' in section else section
              words=re.findall(r'[A-Za-z][A-Za-z0-9]+',tail.lower())
              return [w for w in words if len(w)>=3 and w not in stop and not w.isdigit()]

          page_meta={}
          unresolved=[]
          for r in rows:
              ans=anchors(r['source_section'])
              texts=[]
              for p in r['pages']:
                  if p<0 or p>=doc.page_count: raise SystemExit(f'page out of range {p}')
                  texts.append(' '.join(doc.load_page(p).get_text('text').lower().split()))
              combined=' '.join(texts)
              hits=sorted({a for a in ans if a in combined})
              # Direct numeric PDF references are accepted only when at least one section anchor is visible.
              # Generic source sections with no useful anchor are still required to contain substantial source text.
              if ans and not hits:
                  unresolved.append((r['fact_key'],r['source_section'],ans,r['pages']))
              if not combined or len(combined)<80:
                  unresolved.append((r['fact_key'],'EMPTY_OR_TINY_PAGE',[],r['pages']))
              r['anchors']=ans; r['hits']=hits

          # Additional hard checks on representative pages prove the historical PDF p.N uses the exact physical PDF index,
          # not N-1 or another guessed offset.
          hard={
              38:['engine tuning data','fuel pressure','lost motion gap','throttle closed'],
              40:['engine tuning data','model: mpi','fuel pressure'],
              109:['map sensor'],
              118:['throttle cable'],
              127:['iacv'],
              128:['iat sensor'],
              129:['ckp sensor'],
          }
          hard_results={}
          for p,tokens in hard.items():
              text=' '.join(doc.load_page(p).get_text('text').lower().split())
              missing=[t for t in tokens if t not in text]
              hard_results[p]=(tokens,missing)
              if missing: raise SystemExit(f'Physical page verification failed p.{p}: missing {missing}')

          if unresolved:
              print('UNRESOLVED_ROWS')
              for x in unresolved: print(x)
              raise SystemExit(f'{len(unresolved)} RCL0193 source mappings unresolved')

          for p in unique_pages:
              page=doc.load_page(p)
              text=' '.join(page.get_text('text').split())
              page_meta[p]={
                  'images':len(page.get_images(full=True)),
                  'drawings':len(page.get_drawings()),
                  'text_chars':len(text),
                  'preview':text[:180].replace('|','/'),
              }
          doc.close()

          def asset_kind(r):
              s=r['source_section'].lower()
              if 'tuning data' in s: return 'table_page'
              if any(x in s for x in ['repairs','adjustments','18.','19.']): return 'procedure_page'
              if any(x in s for x in ['description','sensor','ecm','injector','evap','purge']): return 'technical_description_page'
              return 'reference_page'

          out=Path('database/reference/audits/rcl0193_1660_source_map.md')
          lines=[]
          lines += ['# RCL0193ENG — mapping source vérifié des 31 faits historiques 1660','',
                    'Date: 2026-08-29','',
                    'Cette étape est un audit uniquement : aucun fait historique, qz64 de données ou asset visuel n’est modifié.','',
                    '- qz64 1660 SHA-256: `5d56f198a6f5ccaf36d7f94646e3b9af4efd465e7f80da0ebea3d74f3d894093`',
                    '- SQL décodé: 41443 octets, SHA-256 `b978f7e73487c6243c8a6c355b4e5dedd90cf449bee223e9c1eb81e08eb0a7cd`',
                    '- PDF constructeur RCL0193ENG: 372 pages, SHA-256 `c050a3eebe50c5a85bf8a69b7722bd2052079944e09d58578a498984ecf06715`',
                    '- faits RCL0193 parsés proprement: **31/31**; clés uniques: **31/31**; `image_ref` historique vide: **31/31**',
                    '- pages physiques uniques nécessaires: **26**',
                    '- références composites/plages conservées comme relations un-fait-vers-plusieurs-assets.','',
                    '## Preuve de l’index physique PDF','',
                    'Les références historiques `PDF p.N` correspondent directement à l’index physique `N` du PDF constructeur retenu. Aucun décalage n’est appliqué ni deviné. Contrôles durs passés notamment sur p.38 (Engine Tuning Data SPi), p.40 (Engine Tuning Data MPi), p.109 (MAP), p.118 (Throttle cable), p.127 (IACV), p.128 (IAT) et p.129 (CKP).','',
                    '## Mapping 31/31','',
                    '| Fact key | Variante | Source section historique | Pages PDF | Type visuel à conserver | Ancres vérifiées |',
                    '|---|---|---|---|---|---|']
          for r in rows:
              pp=', '.join(str(x) for x in r['pages'])
              hits=', '.join(r['hits']) if r['hits'] else 'contenu de section vérifié'
              lines.append(f"| `{r['fact_key']}` | `{r['variant']}` | {r['source_section'].replace('|','/')} | `{pp}` | `{asset_kind(r)}` | {hits.replace('|','/')} |")

          lines += ['', '## Pages physiques uniques à capturer', '',
                    '| PDF index | Image(s) embarquée(s) | Dessins vectoriels | Texte | Aperçu source |',
                    '|---:|---:|---:|---:|---|']
          for p in unique_pages:
              m=page_meta[p]
              lines.append(f"| {p} | {m['images']} | {m['drawings']} | {m['text_chars']} caractères | {m['preview']} |")

          lines += ['', 'Liste exacte:', '', '`'+', '.join(map(str,unique_pages))+'`', '',
                    '## Règles pour le futur lot visuel', '',
                    '1. Une seule capture physique par page source unique; aucune duplication par fait.',
                    '2. Les plages (ex. p.38-39, p.125-126, p.129-130) doivent relier le fait à toutes les pages requises.',
                    '3. Les pages de tableau, procédure et description restent distinguées par métadonnées; la capture de page complète conserve aussi les illustrations, avertissements et vues présentes.',
                    '4. Les 31 faits historiques restent inchangés; seuls les assets et liens additifs seront ajoutés.',
                    '5. Si une inspection visuelle ultérieure révèle une divergence, elle doit être journalisée avant correction.',
                    '6. Base/IA/RAVE restent consultatives et ne prennent jamais la main sur la communication ECU.','',
                    '## Prochaine action exacte', '',
                    'Vérifier cet audit, puis préparer un lot additif RCL0193 qui extrait les 26 pages physiques du PDF constructeur exact, calcule leurs SHA-256, les déclare dans le manifeste et les relie aux 31 faits via les tables additives d’illustrations. Aucun changement production avant validation complète.','']
          out.write_text('\n'.join(lines),encoding='utf-8')
          print('RCL0193_MAP_PASS facts=31 pages=26')
          print('PAGES='+','.join(map(str,unique_pages)))
          PY

      - name: Guard audit-only scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed={'database/reference/audits/rcl0193_1660_source_map.md','.github/workflows/temp-rcl0193-map-1660.yml'}
          paths=[]
          for line in subprocess.check_output(['git','status','--porcelain'],text=True).splitlines():
              p=line[3:].strip()
              if ' -> ' in p: p=p.split(' -> ',1)[1]
              paths.append(p)
          bad=[p for p in paths if p not in allowed]
          if bad: raise SystemExit('Unexpected paths: '+', '.join(bad))
          if 'database/reference/audits/rcl0193_1660_source_map.md' not in paths:
              raise SystemExit('Expected source-map audit not created')
          print('AUDIT_SCOPE_PASS')
          PY

      - name: Commit verified audit and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-rcl0193-map-1660.yml
          git add database/reference/audits/rcl0193_1660_source_map.md
          git commit -m "Map all 31 RCL0193 facts to verified source pages"
          git push origin tmp-rave-visual-backfill
