name: Apply isolated MEMSX64 MSVC DTC or fix

on:
  push:
    branches: [MEMSX64]
    paths:
      - '.github/workflows/memsx64-msvc-or-dtc-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MEMSX64
        uses: actions/checkout@v4
        with:
          ref: MEMSX64

      - name: Replace only the recorded failing DTC or operators
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('mainwindow.cpp')
          text = path.read_text(encoding='utf-8')
          old = 'if (((data->dtc0)!= 0) or ((data->dtc1)!= 0) or ((data->dtc2)!= 0))'
          new = 'if (((data->dtc0)!= 0) || ((data->dtc1)!= 0) || ((data->dtc2)!= 0))'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one recorded expression, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='')
          PY
          git diff --check
          test "$(git diff --numstat -- mainwindow.cpp)" = $'1\t1\tmainwindow.cpp'

      - name: Commit only the one-line program fix and remove this helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/memsx64-msvc-or-dtc-fix.yml
          git add -- mainwindow.cpp
          git diff --cached --check
          git commit -m "Fix next MSVC logical or operators in mainwindow"
          git push origin HEAD:MEMSX64
