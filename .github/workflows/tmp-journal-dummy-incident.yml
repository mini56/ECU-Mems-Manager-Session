name: TEMP journal dummy incident
on:
  push:
    branches: [RAPPORT]
    paths: ['.github/workflows/tmp-journal-dummy-incident.yml']
permissions:
  contents: write
jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Append journal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('RAPPORT_SUIVI_ECU_MEMS_MANAGER.md')
          text='''\n\n## 2026-09-02 — INCIDENT OUTIL : COMMIT PARASITE `dummy` SUR BRANCHE TEMPORAIRE\n\nPendant la preparation du commit consolide de correction visuelle, une operation destinee a deplacer le ref de branche a ete envoyee par erreur a l endpoint de remplacement de fichier. GitHub a cree le commit parasite `0ece5d125e2a146446fe5e7573df086b56937a37` message `dummy`, parent direct `898509ce5fc16d9540a229094ec54621d85b7248`, sur `tmp-ravemems-ia-visual-integration`.\n\nCet incident ne touche pas `MEMSX64`, le protocole, la base, Qwen/ONNX ni la production. Aucun build n a ete lance depuis ce commit parasite.\n\nLe commit consolide propre a deja ete prepare hors ref Git sous SHA `d22a0bb790d6615d7af5dc8d2b1e59b11125cabc`, parent direct `898509ce5fc16d9540a229094ec54621d85b7248`, avec arbre consolide : header `IaMemsDiagramCatalog.h` revenu exactement a son blob initial ; seuls `IaMemsDiagramCatalog.cpp`, `IaMemsDiagramSelfTest.cpp` et `iamemstab.cpp` restent modifies.\n\nPROCHAINE ACTION EXACTE : retirer le commit parasite en repositionnant uniquement `tmp-ravemems-ia-visual-integration` sur `d22a0bb790d6615d7af5dc8d2b1e59b11125cabc` avec force necessaire car les deux commits sont freres. Verifier immediatement le HEAD et le diff. Ne pas toucher a `MEMSX64`.\n'''
          p.write_text(p.read_text(encoding='utf-8')+text, encoding='utf-8')
          PY
      - name: Commit journal
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git rm .github/workflows/tmp-journal-dummy-incident.yml
          git commit -m 'Journal accidental dummy commit before temp branch repair'
          git push origin HEAD:RAPPORT
