name: Apply main reference binary qz64 compatibility

on:
  workflow_dispatch:
  push:
    branches: ["lab-expert-engine"]
    paths:
      - "tools/patch_reference_qz64_binary.py"
      - ".github/workflows/patch-reference-qz64-binary.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply binary qz64 compatibility
        run: python tools/patch_reference_qz64_binary.py

      - name: Commit patched reference loader
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- database/MemsReferenceDatabase.cpp; then
            echo "Binary qz64 compatibility already present"
            exit 0
          fi
          git diff --check -- database/MemsReferenceDatabase.cpp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- database/MemsReferenceDatabase.cpp
          git commit -m "Support binary Rover qz64 in main reference loader [skip ci]"
          git pull --rebase origin lab-expert-engine
          git push origin HEAD:lab-expert-engine
