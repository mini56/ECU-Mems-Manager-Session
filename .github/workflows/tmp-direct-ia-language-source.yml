              "          if ($source -notmatch 'm_diagramButton->setText\\(QStringLiteral\\(\"Voir le schéma\"\\)\\);') { throw 'Voir le schéma button label missing' }\n          if ($source -match 'Ouvrir le schéma %1') { throw 'Old dynamic diagram button label still present' }\n          Write-Host 'VIEW_BUTTON_LABEL_PASS Voir le schéma'",
              "          if ($source -notmatch 'm_diagramButton->setText\\(I18n::text\\(99006\\)\\);') { throw 'Localized diagram button label missing' }\n          if ($source -match 'm_diagramButton->setText\\(QStringLiteral\\(\"Voir le schéma\"\\)\\);') { throw 'Hard-coded French diagram button label still present' }\n          Write-Host 'VIEW_BUTTON_LABEL_I18N_PASS key=99006'\n          $env:TRANSLATION_ROOT='${{ github.workspace }}\\translations'\n          @'\n          import json,os\n          from pathlib import Path\n          root=Path(os.environ['TRANSLATION_ROOT'])\n          required={str(k) for k in range(99001,99032)} | {str(k) for k in range(99033,99051)}\n          required.discard('99032')\n          for code in ('fr','en','es','it','pt','de'):\n              p=root/code/f'{code}_ia_mems.json'\n              data=json.load(open(p,encoding='utf-8'))\n              missing=sorted(required-set(data))\n              if missing: raise SystemExit(f'{code} IA translation keys missing: {missing}')\n              if any(not str(data[k]).strip() for k in required): raise SystemExit(f'{code} IA translation contains empty value')\n          print('IA_MULTILINGUAL_RESOURCES_PASS languages=fr,en,es,it,pt,de')\n          '@ | python -")

          # Add a fresh trigger marker without changing application behaviour.
          p = root / wf
          text = p.read_text(encoding='utf-8')
          text = text.rstrip() + '\n\n# trigger IA multilingual direct source correction 2026-09-02\n'
          p.write_text(text, encoding='utf-8', newline='\n')

          # Ensure no patch/helper artifact is introduced in the application tree.
          forbidden = [p for p in root.rglob('*') if p.is_file() and ('patch_' in p.name.lower() or p.suffix.lower() in {'.patch','.diff'}) and '.git' not in p.parts]
          if forbidden:
              raise SystemExit('Forbidden patch artifact(s): ' + ', '.join(str(p) for p in forbidden))

          print('DIRECT_IA_MULTILINGUAL_SOURCE_EDIT_READY')
          PY

      - name: Verify direct source scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          echo 'Changed files:'
          git status --short
          test -n "$(git status --porcelain)"
          test ! -e tools/patch_ia_language.py
          test ! -e .github/workflows/patch-ia-language.yml

      - name: Commit direct source correction and self-delete editor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-direct-ia-language-source.yml
          git add expert/LocalAiClient.cpp expert/IaMemsService.cpp expert/LocalAiOnnxSelfTest.cpp iamemstab.cpp \
                  translations/fr/fr_ia_mems.json translations/en/en_ia_mems.json translations/es/es_ia_mems.json \
                  translations/it/it_ia_mems.json translations/pt/pt_ia_mems.json translations/de/de_ia_mems.json \
                  .github/workflows/tmp-ravemems-visual-test-package-x64.yml
          git diff --cached --check
          git commit -m 'Fix IA MEMS active-language rendering directly in source'
          git push origin HEAD:tmp-ravemems-ia-visual-integration
