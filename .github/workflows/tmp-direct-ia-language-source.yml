name: TEMP direct IA multilingual source correction

on:
  push:
    branches:
      - tmp-ravemems-ia-visual-integration
    paths:
      - .github/workflows/tmp-direct-ia-language-source.yml

permissions:
  contents: write

jobs:
  direct_source_edit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: tmp-ravemems-ia-visual-integration
          fetch-depth: 0

      - name: Edit IA MEMS source and multilingual resources directly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          def replace_once(path, old, new):
              p = root / path
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          def replace_all_checked(path, old, new, expected):
              p = root / path
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          # LocalAiClient: the active MEMS Manager language governs response rendering.
          replace_once(
              'expert/LocalAiClient.cpp',
              '    if (m_state != Ready) {\n        emit responseError(QStringLiteral("L\'IA conversationnelle locale n\'est pas prête."));\n        return;\n    }',
              '    if (m_state != Ready) {\n        emit responseError(I18n::text(99022));\n        return;\n    }')

          replace_once(
              'expert/LocalAiClient.cpp',
              '    const bool reasoning = requiresReasoning(trimmedQuestion, grounding);\n    if (!reasoning && !grounding.isEmpty()) {\n        rememberTurn(m_conversation, trimmedQuestion, grounding);\n        emit responseReady(grounding);\n        return;\n    }\n\n    QString userContent = trimmedQuestion;\n    if (!grounding.isEmpty()) {\n        userContent += QStringLiteral(\n            "\\n\\nFaits fournis par MEMS Manager, à utiliser seulement s\'ils répondent à la question :\\n%1")\n                           .arg(grounding);\n    }\n    if (reasoning) {\n        userContent += QStringLiteral(\n            "\\n\\nRéponse attendue : diagnostic bref, hypothèses les plus probables dans l\'ordre, puis contrôles prioritaires. Ne montre aucun raisonnement interne.");\n    }',
              '    const bool reasoning = requiresReasoning(trimmedQuestion, grounding);\n    const QString responseLanguageCode = activeLanguageCode();\n    const QString responseLanguageName = activeLanguageName(responseLanguageCode);\n\n    // A grounding can be returned verbatim only when it already matches the\n    // application language.  The expert service currently builds its neutral\n    // evidence text in French; every other UI language therefore goes through\n    // Qwen for faithful language rendering instead of leaking the source text.\n    if (responseLanguageCode == QStringLiteral("fr") && !reasoning && !grounding.isEmpty()) {\n        rememberTurn(m_conversation, trimmedQuestion, grounding);\n        emit responseReady(grounding);\n        return;\n    }\n\n    QString userContent = trimmedQuestion;\n    if (!grounding.isEmpty()) {\n        userContent += QStringLiteral(\n            "\\n\\nVerified facts supplied by MEMS Manager. Use only facts relevant to the question. "\n            "These facts can be written in a different language. Answer in %1 (%2), translating and synthesizing "\n            "the facts without changing technical values, units, identifiers, references or evidence:\\n%3")\n                           .arg(responseLanguageName, responseLanguageCode, grounding);\n    }\n    if (reasoning) {\n        userContent += QStringLiteral(\n            "\\n\\nExpected answer: concise diagnosis, most likely hypotheses in order, then priority checks. "\n            "Do not reveal internal reasoning.");\n    }')

          replace_once(
              'expert/LocalAiClient.cpp',
              '                emit responseError(QStringLiteral("Erreur du moteur d\'IA locale ONNX : %1").arg(generationError));',
              '                emit responseError(I18n::text(99026).arg(generationError));')

          replace_once(
              'expert/LocalAiClient.cpp',
              '            if (answer.isEmpty() || isQuestionEcho(trimmedQuestion, answer))\n                answer = grounding;\n            if (answer.isEmpty()) {\n                emit responseError(QStringLiteral("Le modèle local n\'a pas produit de réponse exploitable dans la langue active."));\n                return;\n            }',
              '            if (answer.isEmpty() || isQuestionEcho(trimmedQuestion, answer)) {\n                // Never leak source-language grounding into another UI language.\n                answer = activeLanguageCode() == QStringLiteral("fr") ? grounding : QString();\n            }\n            if (answer.isEmpty()) {\n                emit responseError(I18n::text(99025));\n                return;\n            }')

          replace_once('expert/LocalAiClient.cpp',
                       '    setState(MissingRuntime, QStringLiteral("Cette compilation ne contient pas ONNX Runtime GenAI."));',
                       '    setState(MissingRuntime, I18n::text(99027));')
          replace_once('expert/LocalAiClient.cpp',
                       '        setState(MissingRuntime, QStringLiteral("Runtime ONNX Runtime GenAI absent du package."));',
                       '        setState(MissingRuntime, I18n::text(99028));')
          replace_once('expert/LocalAiClient.cpp',
                       '        setState(MissingModel, QStringLiteral("Modèle Qwen ONNX IA MEMS absent du dossier IA."));',
                       '        setState(MissingModel, I18n::text(99029));')
          replace_once('expert/LocalAiClient.cpp',
                       '        setState(Error, QStringLiteral("Thread du moteur IA local indisponible."));',
                       '        setState(Error, I18n::text(99030));')
          replace_once('expert/LocalAiClient.cpp',
                       '                setState(Error, QStringLiteral("Chargement ONNX impossible : %1").arg(error));',
                       '                setState(Error, I18n::text(99031).arg(error));')

          replace_once(
              'expert/LocalAiClient.cpp',
              'QString LocalAiClient::statusText() const\n{\n    switch (m_state) {\n    case NotStarted: return QStringLiteral("IA locale non démarrée");\n    case MissingRuntime: return QStringLiteral("moteur IA local absent");\n    case MissingModel: return QStringLiteral("modèle IA local absent");\n    case Starting: return QStringLiteral("IA locale en démarrage");\n    case Ready: return QStringLiteral("IA locale prête");\n    case Busy: return QStringLiteral("IA locale en réponse");\n    case Error:\n        if (m_lastError.isEmpty()) return QStringLiteral("erreur IA locale");\n        return QStringLiteral("erreur IA locale : %1").arg(m_lastError.simplified().left(140));\n    }\n    return QStringLiteral("IA locale");\n}',
              'QString LocalAiClient::statusText() const\n{\n    switch (m_state) {\n    case NotStarted: return I18n::text(99012);\n    case MissingRuntime: return I18n::text(99013);\n    case MissingModel: return I18n::text(99014);\n    case Starting: return I18n::text(99015);\n    case Ready: return I18n::text(99016);\n    case Busy: return I18n::text(99017);\n    case Error:\n        if (m_lastError.isEmpty()) return I18n::text(99018);\n        return I18n::text(99019).arg(m_lastError.simplified().left(140));\n    }\n    return I18n::text(99020);\n}')

          # IaMemsService: local status/fallback strings use the existing I18n dictionaries.
          replace_once('expert/IaMemsService.cpp',
                       '#include "LocalAiClient.h"\n',
                       '#include "LocalAiClient.h"\n#include "i18n.h"\n')

          replace_once(
              'expert/IaMemsService.cpp',
              '            this, [this](const QString &message) {\n                QString fallback = m_pendingGrounding.trimmed();\n                if (fallback.isEmpty())\n                    fallback = QStringLiteral("Je ne peux pas répondre avec le moteur conversationnel local pour le moment.");\n                m_pendingGrounding.clear();\n                emit responseReady(fallback);\n                emit systemMessage(QStringLiteral("Moteur conversationnel local indisponible : %1").arg(message));\n                emit statusChanged();\n            });',
              '            this, [this](const QString &message) {\n                QString fallback;\n                if (I18n::language().trimmed().toLower() == QStringLiteral("fr"))\n                    fallback = m_pendingGrounding.trimmed();\n                if (fallback.isEmpty())\n                    fallback = I18n::text(99023);\n                m_pendingGrounding.clear();\n                emit responseReady(fallback);\n                emit systemMessage(I18n::text(99024).arg(message));\n                emit statusChanged();\n            });')

          replace_once('expert/IaMemsService.cpp',
                       '        m_knowledgeError = QStringLiteral("Base experte r20 absente du package.");',
                       '        m_knowledgeError = I18n::text(99033);')
          replace_once('expert/IaMemsService.cpp',
                       '        emit systemMessage(QStringLiteral(\n            "La base experte MEMS préconstruite n\'est pas disponible. Le dialogue local reste utilisable sans cette base."));',
                       '        emit systemMessage(I18n::text(99034));')
          replace_once('expert/IaMemsService.cpp',
                       '        emit systemMessage(QStringLiteral(\n            "La base experte MEMS n\'a pas pu être ouverte en lecture seule. Le dialogue local reste utilisable."));',
                       '        emit systemMessage(I18n::text(99035));')
          replace_once('expert/IaMemsService.cpp',
                       '    emit systemMessage(QStringLiteral("Base de connaissances MEMS prête en lecture seule."));',
                       '    emit systemMessage(I18n::text(99021));')

          replace_once(
              'expert/IaMemsService.cpp',
              '    const QString fallback = m_pendingGrounding.trimmed().isEmpty()\n        ? QStringLiteral("L\'IA locale n\'est pas encore prête.")\n        : m_pendingGrounding;\n    m_pendingGrounding.clear();',
              '    QString fallback;\n    if (I18n::language().trimmed().toLower() == QStringLiteral("fr"))\n        fallback = m_pendingGrounding.trimmed();\n    if (fallback.isEmpty())\n        fallback = I18n::text(99022);\n    m_pendingGrounding.clear();')

          replace_once(
              'expert/IaMemsService.cpp',
              '    if (m_knowledgeReady)\n        parts << QStringLiteral("base prête");\n    else if (m_knowledgeAttempted)\n        parts << QStringLiteral("base indisponible");\n    else\n        parts << QStringLiteral("base non chargée");',
              '    if (m_knowledgeReady)\n        parts << I18n::text(99009);\n    else if (m_knowledgeAttempted)\n        parts << I18n::text(99010);\n    else\n        parts << I18n::text(99011);')

          # IA tab: all user-visible local strings use the same application language dictionaries.
          replace_once('iamemstab.cpp',
                       '#include "database/MemsReferenceSheetRenderer.h"\n',
                       '#include "database/MemsReferenceSheetRenderer.h"\n#include "i18n.h"\n')
          replace_once('iamemstab.cpp',
                       '        path, QStringLiteral("Impossible d\'ouvrir ou de lire la fiche XML locale."));',
                       '        path, I18n::text(99041));')
          replace_once('iamemstab.cpp',
                       '        return QStringLiteral(\n            "MPi signifie « Multi Point Injection », c\'est-à-dire injection multipoint. "\n            "Sur les montages Rover/Mini concernés, plusieurs injecteurs distribuent le carburant, typiquement un injecteur par cylindre.");',
                       '        return I18n::text(99049);')
          replace_once('iamemstab.cpp',
                       '        return QStringLiteral(\n            "Sur un système MPi Rover/Mini MEMS, l\'injection est multipoint : plusieurs injecteurs distribuent le carburant, typiquement un par cylindre. "\n            "L\'ECU commande leur ouverture pour doser le carburant dans l\'admission. Si tu cherches le brochage, le câblage, un contrôle ou une procédure précise, indique simplement ce point et je chercherai la donnée correspondante.");',
                       '        return I18n::text(99050);')
          replace_once('iamemstab.cpp',
                       '    QLabel *subtitle = new QLabel(\n        QStringLiteral("Dialogue local avec le moteur expert et la base de connaissances MEMS. "\n                       "Les réponses distinguent mesures, hypothèses et niveau de preuve."),\n        this);',
                       '    QLabel *subtitle = new QLabel(I18n::text(99001), this);')
          replace_once('iamemstab.cpp',
                       '    m_question->setPlaceholderText(QStringLiteral(\n        "Posez une question : Qu\'est-ce que tu vois d\'anormal ? Mon avance est-elle normale ? Que sait-on sur AANMP002 ?"));',
                       '    m_question->setPlaceholderText(I18n::text(99002));')
          replace_once('iamemstab.cpp',
                       '    m_sendButton = new QPushButton(QStringLiteral("Envoyer"), this);',
                       '    m_sendButton = new QPushButton(I18n::text(99003), this);')
          replace_once('iamemstab.cpp',
                       '    appendSystemMessage(QStringLiteral(\n        "Bonjour, je suis IA MEMS, l\'assistant intégré à ECU MEMS Manager. "\n        "Je peux expliquer le logiciel, les systèmes MEMS et les mesures déjà acquises par le programme. "\n        "Je n\'envoie aucune commande ECU et je n\'invente pas une mesure absente."));',
                       '    appendSystemMessage(I18n::text(99004));')
          replace_all_checked('iamemstab.cpp',
                              'm_diagramButton->setText(QStringLiteral("Voir le schéma"));',
                              'm_diagramButton->setText(I18n::text(99006));', 2)
          replace_once('iamemstab.cpp',
                       '        appendSystemMessage(QStringLiteral(\n            "Le schéma local proposé n\'est plus disponible ou déclaré dans le package."));',
                       '        appendSystemMessage(I18n::text(99036));')
          replace_once('iamemstab.cpp',
                       '    m_documentButton->setText(QStringLiteral("Ouvrir la fiche XML MEMS %1").arg(generation));',
                       '    m_documentButton->setText(I18n::text(99037).arg(generation));')
          replace_once('iamemstab.cpp',
                       '        appendSystemMessage(QStringLiteral("La base documentaire locale n\'a pas pu être ouverte."));',
                       '        appendSystemMessage(I18n::text(99038));')
          replace_once('iamemstab.cpp',
                       '        appendSystemMessage(QStringLiteral("La fiche XML MEMS %1 n\'est pas disponible dans le package.").arg(m_documentGeneration));',
                       '        appendSystemMessage(I18n::text(99039).arg(m_documentGeneration));')
          replace_once('iamemstab.cpp',
                       '    viewer.setWindowTitle(QStringLiteral("IA MEMS — Fiche XML MEMS %1").arg(m_documentGeneration));',
                       '    viewer.setWindowTitle(I18n::text(99040).arg(m_documentGeneration));')
          replace_once('iamemstab.cpp',
                       '        return QStringLiteral("Pour éviter de mélanger les brochages Mini, est-ce une SPi ou une MPi ? Si tu ne sais pas, réponds « cherche » : j\'utiliserai l\'ECU connecté et la base avant de te redemander une information.");',
                       '        return I18n::text(99042);')
          replace_once('iamemstab.cpp',
                       '        return QStringLiteral("Quelle génération MEMS faut-il utiliser : 1.2, 1.3, 1.6 ou 1.9 ? Si tu ne sais pas, réponds « cherche » et j\'utiliserai d\'abord le contexte ECU disponible.");',
                       '        return I18n::text(99043);')
          replace_once('iamemstab.cpp',
                       '    appendMessage(QStringLiteral("Vous"), question);',
                       '    appendMessage(I18n::text(99005), question);')
          replace_once('iamemstab.cpp',
                       '                          QStringLiteral("Correction prise en compte : %1. Je reprends la demande précédente avec cette variante.")\n                              .arg(explicitSelection));',
                       '                          I18n::text(99044).arg(explicitSelection));')
          replace_once('iamemstab.cpp',
                       '                    answerLocally(QStringLiteral("J\'ai cherché dans les références ECU réellement disponibles, mais je ne peux pas trancher SPi/MPi sans preuve suffisante. Donne-moi la référence inscrite sur le calculateur, ou l\'année et le marché du véhicule."));',
                       '                    answerLocally(I18n::text(99045));')
          replace_once('iamemstab.cpp',
                       '                answerLocally(QStringLiteral("J\'ai identifié %1 à partir de la référence ECU/firmware %2 retrouvée dans la base. Je poursuis la recherche initiale.").arg(resolved, evidence));',
                       '                answerLocally(I18n::text(99046).arg(resolved, evidence));')
          replace_once('iamemstab.cpp',
                       '                    answerLocally(QStringLiteral("J\'ai cherché dans le contexte disponible, mais la génération MEMS n\'est pas déterminée. Donne-moi l\'année, la référence ECU ou connecte l\'ECU pour que je puisse continuer sans deviner."));',
                       '                    answerLocally(I18n::text(99047));')
          replace_once('iamemstab.cpp',
                       '                answerLocally(QStringLiteral("L\'ECU connecté indique MEMS %1. Je poursuis donc avec cette documentation.").arg(m_detectedFamily));',
                       '                answerLocally(I18n::text(99048).arg(m_detectedFamily));')
          replace_once('iamemstab.cpp',
                       '    parts << (m_connected ? QStringLiteral("ECU connecté") : QStringLiteral("ECU non connecté"));',
                       '    parts << (m_connected ? I18n::text(99007) : I18n::text(99008));')

          # Deterministic/native ONNX test: verify all six dictionaries and prove
          # that non-French documentary grounding is rendered by Qwen, not leaked raw.
          selftest = r'''#include "LocalAiClient.h"
          #include "i18n.h"

          #include <QCoreApplication>
          #include <QDate>
          #include <QTextStream>
          #include <QTimer>

          namespace {
          bool containsInternalLeak(const QString &text)
          {
              const QString lower = text.toLower();
              const QStringList markers = {
                  QStringLiteral("<think>"),
                  QStringLiteral("</think>"),
                  QStringLiteral("<|im_"),
                  QStringLiteral("langage obligatoire"),
                  QStringLiteral("mandatory language"),
                  QStringLiteral("domaine obligatoire"),
                  QStringLiteral("contexte candidat fourni par mems manager"),
                  QStringLiteral("mode diagnostic rapide"),
                  QStringLiteral("you are ia mems, the local assistant"),
                  QStringLiteral("réponse attendue"),
                  QStringLiteral("reponse attendue"),
                  QStringLiteral("diagnostic bref"),
                  QStringLiteral("ne montre aucun raisonnement interne"),
                  QStringLiteral("faits fournis par mems manager")
              };
              for (const QString &marker : markers) {
                  if (lower.contains(marker))
                      return true;
              }
              return false;
          }
          }

          int main(int argc, char *argv[])
          {
              QCoreApplication app(argc, argv);
              I18n::load(QStringLiteral("fr"));

              QTextStream out(stdout);
              QTextStream err(stderr);
              out.setCodec("UTF-8");
              err.setCodec("UTF-8");

              LocalAiClient client;
              bool started = false;
              bool finished = false;
              int stage = 0;
              int languageIndex = -1;
              const QStringList languageCodes = {
                  QStringLiteral("fr"), QStringLiteral("en"), QStringLiteral("es"),
                  QStringLiteral("it"), QStringLiteral("pt"), QStringLiteral("de")
              };
              const QStringList generatedCodes = {
                  QStringLiteral("it"), QStringLiteral("en"), QStringLiteral("es"),
                  QStringLiteral("pt"), QStringLiteral("de")
              };
              const QStringList generatedMarkers = {
                  QStringLiteral("IT_OK"), QStringLiteral("EN_OK"), QStringLiteral("ES_OK"),
                  QStringLiteral("PT_OK"), QStringLiteral("DE_OK")
              };
              const QStringList generatedQuestions = {
                  QStringLiteral("Rispondi iniziando esattamente con IT_OK. Qual è la coppia di serraggio?"),
                  QStringLiteral("Answer starting exactly with EN_OK. What is the tightening torque?"),
                  QStringLiteral("Responde empezando exactamente con ES_OK. ¿Cuál es el par de apriete?"),
                  QStringLiteral("Responde começando exatamente com PT_OK. Qual é o binário de aperto?"),
                  QStringLiteral("Antworte exakt beginnend mit DE_OK. Wie hoch ist das Anzugsdrehmoment?")
              };
              const QString foreignGrounding = QStringLiteral(
                  "Couple de serrage vérifié : 68 Nm. Niveau de preuve : constructeur.");

              const auto fail = [&](const QString &message) {
                  if (finished)
                      return;
                  finished = true;
                  err << "FAIL LocalAiClient ONNX: " << message << Qt::endl;
                  app.exit(1);
              };

              for (const QString &code : languageCodes) {
                  if (!I18n::load(code)) {
                      fail(QStringLiteral("Dictionnaire IA MEMS non charge pour %1").arg(code));
                      return 1;
                  }
                  const QString ready = I18n::text(99016);
                  if (ready.startsWith(QLatin1Char('[')) || ready.trimmed().isEmpty()) {
                      fail(QStringLiteral("Cle IA MEMS 99016 absente pour %1").arg(code));
                      return 1;
                  }
              }
              I18n::load(QStringLiteral("fr"));

              const auto rejectLeak = [&](const QString &answer) -> bool {
                  if (!containsInternalLeak(answer))
                      return false;
                  fail(QStringLiteral("Une directive interne ou une balise Qwen a fui dans la réponse : %1")
                           .arg(answer.left(180)));
                  return true;
              };

              const auto askLanguageCase = [&]() {
                  I18n::load(generatedCodes.at(languageIndex));
                  client.clearConversation();
                  client.ask(generatedQuestions.at(languageIndex), foreignGrounding);
              };

              QObject::connect(&client, &LocalAiClient::stateChanged, &app, [&]() {
                  out << "STATE=" << client.statusText() << Qt::endl;
                  switch (client.state()) {
                  case LocalAiClient::Ready:
                      if (!started) {
                          started = true;
                          stage = 0;
                          I18n::load(QStringLiteral("fr"));
                          client.ask(QStringLiteral("C4EST QUOI LA BOBINE ?"), QString());
                      }
                      break;
                  case LocalAiClient::MissingRuntime:
                  case LocalAiClient::MissingModel:
                  case LocalAiClient::Error:
                      fail(client.statusText());
                      break;
                  default:
                      break;
                  }
              });

              QObject::connect(&client, &LocalAiClient::responseError, &app,
                               [&](const QString &message) { fail(message); });

              QObject::connect(&client, &LocalAiClient::responseReady, &app,
                               [&](const QString &text) {
                  if (finished)
                      return;
                  const QString answer = text.trimmed();
                  out << "ANSWER_STAGE_" << stage << "=" << answer << Qt::endl;
                  if (answer.isEmpty()) {
                      fail(QStringLiteral("Réponse vide à l'étape %1.").arg(stage));
                      return;
                  }
                  if (rejectLeak(answer))
                      return;

                  if (stage == 0) {
                      if (!answer.contains(QStringLiteral("bobine"), Qt::CaseInsensitive)
                          || !answer.contains(QStringLiteral("haute tension"), Qt::CaseInsensitive)
                          || !answer.contains(QStringLiteral("bougie"), Qt::CaseInsensitive)) {
                          fail(QStringLiteral("La définition déterministe de la bobine avec C4EST n'est pas exploitable."));
                          return;
                      }
                      stage = 1;
                      client.ask(QStringLiteral("QUELLE JOURS SOMME NOUS ?"), QString());
                      return;
                  }

                  if (stage == 1) {
                      if (!answer.contains(QString::number(QDate::currentDate().year()))
                          || !answer.contains(QStringLiteral("Nous sommes"), Qt::CaseInsensitive)) {
                          fail(QStringLiteral("La question de date avec faute de frappe n'est pas reconnue."));
                          return;
                      }
                      stage = 2;
                      client.ask(QStringLiteral("BROCHE ECU 1.3"),
                                 QStringLiteral("BROCHAGE_TEST_ECU_13 : information de brochage vérifiée fournie par la base."));
                      return;
                  }

                  if (stage == 2) {
                      if (!answer.contains(QStringLiteral("BROCHAGE_TEST_ECU_13"))
                          || answer.contains(QStringLiteral("Micro-Electro-Mechanical"), Qt::CaseInsensitive)) {
                          fail(QStringLiteral("BROCHE ECU 1.3 est encore détourné par la définition générique MEMS."));
                          return;
                      }
                      stage = 3;
                      client.ask(QStringLiteral("BROCHE OBD 1.9 ?"),
                                 QStringLiteral("BROCHAGE_TEST_OBD_19 : information OBD vérifiée fournie par la base."));
                      return;
                  }

                  if (stage == 3) {
                      if (!answer.contains(QStringLiteral("BROCHAGE_TEST_OBD_19"))
                          || answer.contains(QStringLiteral("Micro-Electro-Mechanical"), Qt::CaseInsensitive)) {
                          fail(QStringLiteral("BROCHE OBD 1.9 est encore détourné par la définition générique MEMS."));
                          return;
                      }
                      stage = 4;
                      client.ask(QStringLiteral("Couple de serrage sonde température ECT"),
                                 QStringLiteral("Couple ECT vérifié : 15 Nm.\nNiveau de preuve : constructeur."));
                      return;
                  }

                  if (stage == 4) {
                      if (!answer.contains(QStringLiteral("15 Nm"), Qt::CaseInsensitive)) {
                          fail(QStringLiteral("Le fait documentaire ECT a été remplacé au lieu d'être rendu directement."));
                          return;
                      }
                      stage = 5;
                      client.ask(QStringLiteral("Couleur des fils sonde lambda"),
                                 QStringLiteral("Fils sonde lambda : gris et vert clair/gris — preuve : constructeur."));
                      return;
                  }

                  if (stage == 5) {
                      if (!answer.contains(QStringLiteral("gris"), Qt::CaseInsensitive)
                          || answer.contains(QStringLiteral("réponse attendue"), Qt::CaseInsensitive)
                          || answer.contains(QStringLiteral("diagnostic bref"), Qt::CaseInsensitive)) {
                          fail(QStringLiteral("La réponse documentaire lambda fuit encore une consigne interne."));
                          return;
                      }
                      stage = 6;
                      client.ask(QStringLiteral("Réponds uniquement par OK."), QString());
                      return;
                  }

                  if (stage == 6) {
                      if (!answer.contains(QStringLiteral("OK"), Qt::CaseInsensitive)) {
                          fail(QStringLiteral("La génération native ne contient pas le marqueur OK attendu."));
                          return;
                      }
                      stage = 7;
                      languageIndex = 0;
                      askLanguageCase();
                      return;
                  }

                  if (stage == 7) {
                      const QString marker = generatedMarkers.at(languageIndex);
                      const QString code = generatedCodes.at(languageIndex);
                      if (!answer.contains(marker, Qt::CaseInsensitive)
                          || !answer.contains(QStringLiteral("68 Nm"), Qt::CaseInsensitive)) {
                          fail(QStringLiteral("Restitution multilingue %1 invalide : %2")
                                   .arg(code, answer.left(180)));
                          return;
                      }
                      if (answer == foreignGrounding
