name: TEMP RAVEMEMS REPORT PIXEL MEASUREMENT
on: [push]
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - run: python tools/temp_append_ravemems_pixel_measurement.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions-bot
          git config user.email github-actions@users.noreply.github.com
          git rm .github/workflows/temp-ravemems-report-pixel-measurement.yml .ravemems-pixel-measurement-trigger tools/temp_append_ravemems_pixel_measurement.py
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git commit -m "Record exact RAVEMEMS TEST2 pixel measurement"
          git push origin HEAD:RAPPORT
