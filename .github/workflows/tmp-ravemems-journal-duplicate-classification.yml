          set -euo pipefail
          printf '\n%s\n' "$REPORT_ENTRY" >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git rm .github/workflows/tmp-ravemems-journal-duplicate-classification.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git commit -m "Record RAVEMEMS duplicate candidate classifications"
          git push origin HEAD:RAPPORT
