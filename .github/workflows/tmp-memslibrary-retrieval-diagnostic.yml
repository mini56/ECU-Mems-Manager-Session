name: MEMSLibrary retrieval diagnostic

on:
  push:
    branches:
      - tmp-memslibrary-retrieval-diagnostic
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: windows-2022
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify protected production base ancestry
        shell: pwsh
        run: |
          $expected = "1d6316bd1746d6f2b4cfb751cab88d18e27ef730"
          git merge-base --is-ancestor $expected HEAD
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic branch is not based on protected MEMSX64 #103" }
          Write-Host "PROTECTED_BASE_OK $expected"

      - name: Download validated MEMSLibrary Pack001 artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33847448261 --repo mini56/ECU-Mems-Manager-Session --name MEMSLibrary-Pack001-33847448261 --dir pack001
          Get-ChildItem pack001 -Recurse

      - name: Diagnose exact MEMSLibrary query semantics
        shell: pwsh
        run: |
          @'
          import sqlite3, pathlib, json

          dbs=list(pathlib.Path('pack001').rglob('knowledge.sqlite'))
          if len(dbs)!=1:
              raise SystemExit(f'Expected exactly one knowledge.sqlite, found {len(dbs)}')
          db=dbs[0]
          cx=sqlite3.connect(db)

          def terms(q):
              # Mirrors MEMSLibrary.cpp: alnum / - / _, lower, drop <2 chars, cap 8.
              out=[]
              cur=''
              for ch in q:
                  if ch.isalnum() or ch in '-_':
                      cur += ch.lower()
                  elif cur:
                      out.append(cur); cur=''
              if cur: out.append(cur)
              out=[x for x in out if len(x)>=2][:8]
              return out

          def search(q, limit=20):
              ts=terms(q)
              sql='SELECT document_key,page_number,entity_kind,entity_key,title,body FROM memslibrary_search WHERE 1=1'
              args=[]
              for t in ts:
                  sql += ' AND search_text LIKE ?'
                  args.append('%'+t+'%')
              sql += " ORDER BY CASE entity_kind WHEN 'step' THEN 0 WHEN 'requirement' THEN 1 WHEN 'notice' THEN 2 WHEN 'operation' THEN 3 WHEN 'section' THEN 4 ELSE 5 END, document_key, COALESCE(page_number,2147483647), entity_key LIMIT ?"
              args.append(limit)
              rows=cx.execute(sql,args).fetchall()
              return ts, rows

          cases=[
              ('baseline_primary_en','primary gear end float'),
              ('natural_primary_en','How do I check the primary gear end float?'),
              ('natural_primary_fr','Comment contrôler le jeu axial du pignon primaire ?'),
              ('baseline_battery_en','battery restoration procedure'),
              ('natural_battery_en','How do I carry out the battery restoration procedure?'),
              ('natural_battery_fr','Comment effectuer la procédure de remise en état de la batterie ?'),
          ]

          summary={}
          all_rows={}
          for name,q in cases:
              ts,rows=search(q)
              all_rows[name]=rows
              summary[name]={'query':q,'terms':ts,'count':len(rows),'rows':[]}
              print(f'CASE {name}')
              print(f'QUERY={q}')
              print('TERMS='+json.dumps(ts,ensure_ascii=False))
              print(f'COUNT={len(rows)}')
              for r in rows[:10]:
                  doc,page,kind,key,title,body=r
                  body=(body or '').replace('\r',' ').replace('\n',' ')
                  if len(body)>220: body=body[:220]+'...'
                  print(f'ROW doc={doc} page={page} kind={kind} key={key} title={title!r} body={body!r}')
                  summary[name]['rows'].append({'document_key':doc,'page_number':page,'entity_kind':kind,'entity_key':key,'title':title,'body':body})
              print('---')

          def has(rows, doc, page):
              return any(r[0]==doc and r[1]==page for r in rows)

          print('DIAGNOSTIC_PRIMARY_EN baseline_target=', has(all_rows['baseline_primary_en'],'DOC_RCL0193ENG',53), 'natural_target=', has(all_rows['natural_primary_en'],'DOC_RCL0193ENG',53), 'baseline_count=',len(all_rows['baseline_primary_en']),'natural_count=',len(all_rows['natural_primary_en']))
          print('DIAGNOSTIC_PRIMARY_FR target=', has(all_rows['natural_primary_fr'],'DOC_RCL0193ENG',53), 'count=',len(all_rows['natural_primary_fr']))
          print('DIAGNOSTIC_BATTERY_EN baseline_target=', has(all_rows['baseline_battery_en'],'DOC_RCL0221ENG',20), 'natural_target=', has(all_rows['natural_battery_en'],'DOC_RCL0221ENG',20), 'baseline_count=',len(all_rows['baseline_battery_en']),'natural_count=',len(all_rows['natural_battery_en']))
          print('DIAGNOSTIC_BATTERY_FR target=', has(all_rows['natural_battery_fr'],'DOC_RCL0221ENG',20), 'count=',len(all_rows['natural_battery_fr']))

          pathlib.Path('retrieval-diagnostic.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          cx.close()
          '@ | python -

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: MEMSLibrary-Retrieval-Diagnostic-${{ github.run_id }}
          path: retrieval-diagnostic.json
          if-no-files-found: error
