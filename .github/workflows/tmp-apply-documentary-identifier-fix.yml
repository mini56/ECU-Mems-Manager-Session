name: TMP APPLY documentary identifier guard

on:
  push:
    branches: [tmp-build108-memslibrary-relevance-integration]
    paths:
      - '.github/workflows/tmp-apply-documentary-identifier-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-build108-memslibrary-relevance-integration
          fetch-depth: 0

      - name: Require exact technical identifiers from documentary evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('expert/LocalAiClient.cpp')
          text = path.read_text(encoding='utf-8')
          anchor = '''    if (answerPlain.isEmpty())
              return false;

              const QStringList ignored = {'''.replace('              return false;', '        return false;').replace('              const QStringList', '    const QStringList')
          replacement = '''    if (answerPlain.isEmpty())
              return false;

              const QRegularExpression identifierRx(QStringLiteral("[A-Z0-9]+(?:_[A-Z0-9]+)+"));
              QRegularExpressionMatchIterator identifierIt = identifierRx.globalMatch(grounding);
              bool hasExactIdentifier = false;
              while (identifierIt.hasNext()) {
                  const QString identifier = identifierIt.next().captured(0);
                  if (identifier.isEmpty())
                      continue;
                  hasExactIdentifier = true;
                  if (answer.contains(identifier, Qt::CaseInsensitive))
                      return true;
              }
              if (hasExactIdentifier)
                  return false;

              const QStringList ignored = {'''
          replacement = replacement.replace('              return false;', '        return false;', 1)
          replacement = replacement.replace('              const QRegularExpression', '    const QRegularExpression')
          replacement = replacement.replace('              QRegularExpressionMatchIterator', '    QRegularExpressionMatchIterator')
          replacement = replacement.replace('              bool hasExactIdentifier', '    bool hasExactIdentifier')
          replacement = replacement.replace('              while', '    while')
          replacement = replacement.replace('                  const QString identifier', '        const QString identifier')
          replacement = replacement.replace('                  if (identifier.isEmpty())', '        if (identifier.isEmpty())')
          replacement = replacement.replace('                      continue;', '            continue;')
          replacement = replacement.replace('                  hasExactIdentifier', '        hasExactIdentifier')
          replacement = replacement.replace('                  if (answer.contains', '        if (answer.contains')
          replacement = replacement.replace('                      return true;', '            return true;')
          replacement = replacement.replace('              }', '    }', 1)
          replacement = replacement.replace('              if (hasExactIdentifier)', '    if (hasExactIdentifier)')
          replacement = replacement.replace('                  return false;', '        return false;')
          replacement = replacement.replace('              const QStringList ignored', '    const QStringList ignored')
          if text.count(anchor) != 1:
              raise SystemExit('Identifier guard insertion anchor mismatch')
          path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add expert/LocalAiClient.cpp
          git commit -m 'Require exact documentary evidence identifiers'
          git push origin HEAD:tmp-build108-memslibrary-relevance-integration
