name: TMP IA MEMSLibrary Windows Package

on:
  push:
    branches:
      - tmp-ai-memslibrary-bridge
    paths:
      - '.github/workflows/tmp-ai-memslibrary-package.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      MEMS_BUILD: '103'
      MEMS_VERSION: '1.0.103'
      MEMS_BUILD_NUMBER: '103'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      ORT_GENAI_VERSION: '0.14.0'
      ORT_GENAI_WIN_X64_SHA256: '8a303e52dc7be8fb2a5331929af451a25ac59774102d7fd09ef673adc85c5ebf'
      ORT_VERSION: '1.24.4'
      ORT_WIN_X64_SHA256: 'd2319fddfb6ea4db99ccc4b60c85c517bcd855721f5daa6a06d40d7cb2ee2357'
      ONNX_MODEL_REPO: 'xiaoyao9184/Qwen3-0.6B-onnx-genai'
      ONNX_MODEL_REVISION: 'e6bf97818c142808967a48cbab4f0aef18b64621'
      ONNX_MODEL_SUBDIR: 'cpu_and_mobile/cpu-int4-rtn-block-32-acc-level-4'
      ONNX_MODEL_ONNX_SHA256: 'b52cfcd91e6ed3caa34c670d4831d96cda3da5eb07ef95bc8ba06547b4f3b86f'
      ONNX_MODEL_DATA_SHA256: '8539cf4fbc3b5b331fd78ca8cd5b025ce537dfc2f993451f5c474b2f9fb7cd6c'
      ONNX_TOKENIZER_SHA256: 'be75606093db2094d7cd20f3c2f385c212750648bd6ea4fb2bf507a6a4c55506'

    steps:
      - name: Checkout isolated IA bridge branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify protected production and Pack001 ancestry
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $protected = '1d6316bd1746d6f2b4cfb751cab88d18e27ef730'
          $pack001 = '9cf3d00840cec1749ef9358f708d3e68a2c8bc4d'
          git merge-base --is-ancestor $protected HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Temporary package branch is not based on protected MEMSX64 BUILD #103' }
          git merge-base --is-ancestor $pack001 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Temporary package branch is not based on validated MEMSLibrary Pack001 checkpoint' }
          Write-Host "TMP_PACKAGE_ANCESTRY_OK protected=$protected pack001=$pack001"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0" pefile "huggingface_hub>=0.34,<1" hf_xet
          if ($LASTEXITCODE -ne 0) { throw "Validation tools install failed: $LASTEXITCODE" }

      - name: Install Qt 5.15.2 MSVC 2019 x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          if (Test-Path 'C:\Qt') { Remove-Item 'C:\Qt' -Recurse -Force -ErrorAction SilentlyContinue }
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtcharts -O C:\Qt --external "$sevenZip"
          if ($LASTEXITCODE -ne 0) { throw "aqtinstall failed: $LASTEXITCODE" }

      - name: Download validated RAVEMEMS V2 47-PDF source artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download 33810202288 --repo mini56/ECU-Mems-Manager-Session --name RAVEMEMS-V2-FULL-CORPUS-GENERIC-33810202288 --dir source47
          if ($LASTEXITCODE -ne 0) { throw "RAVEMEMS artifact download failed: $LASTEXITCODE" }
          $dbs = Get-ChildItem source47 -Recurse -Filter ravemems_v2.sqlite
          if ($dbs.Count -ne 47) { throw "Expected 47 RAVEMEMS source databases, found $($dbs.Count)" }
          Write-Host "SOURCE47_OK databases=$($dbs.Count)"

      - name: Rebuild and validate MEMSLibrary Pack001
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/build_memslibrary_pack.py source47 pack001 --pack-id MEMSLibrary_Pack_001
          if ($LASTEXITCODE -ne 0) { throw "Pack001 rebuild failed: $LASTEXITCODE" }
          @'
          import json,sqlite3
          from pathlib import Path
          root=Path('pack001')
          db=root/'knowledge.sqlite'
          manifest=root/'manifest.json'
          cx=sqlite3.connect(db)
          try:
              assert cx.execute('pragma integrity_check').fetchone()[0]=='ok'
              assert cx.execute('pragma foreign_key_check').fetchall()==[]
              assert cx.execute('select count(*) from ravemems_document').fetchone()[0]==47
          finally:
              cx.close()
          data=json.loads(manifest.read_text(encoding='utf-8'))
          assert data.get('pack_id')=='MEMSLibrary_Pack_001'
          assert int(data.get('document_count',0))==47
          print('PACK001_PACKAGE_FIXTURE_OK docs=47')
          '@ | python -

      - name: Build MEMSLibrary ABI2 x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S memslibrary -B build-memslibrary -A x64
          if ($LASTEXITCODE -ne 0) { throw "MEMSLibrary configure failed: $LASTEXITCODE" }
          cmake --build build-memslibrary --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "MEMSLibrary build failed: $LASTEXITCODE" }

      - name: Stage exact BUILD 103 ONNX Runtime and VC++ dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $genaiArchive = Join-Path $env:RUNNER_TEMP "onnxruntime-genai-$env:ORT_GENAI_VERSION-win-x64.zip"
          $ortArchive = Join-Path $env:RUNNER_TEMP "onnxruntime-win-x64-$env:ORT_VERSION.zip"
          $genaiExtract = '${{ github.workspace }}\onnx-genai-package'
          $ortExtract = '${{ github.workspace }}\onnxruntime-package'
          $stage = '${{ github.workspace }}\onnx-runtime-package-stage'
          $genaiUrl = "https://github.com/microsoft/onnxruntime-genai/releases/download/v$env:ORT_GENAI_VERSION/onnxruntime-genai-$env:ORT_GENAI_VERSION-win-x64.zip"
          $ortUrl = "https://github.com/microsoft/onnxruntime/releases/download/v$env:ORT_VERSION/onnxruntime-win-x64-$env:ORT_VERSION.zip"

          foreach ($dir in @($genaiExtract,$ortExtract,$stage)) {
            if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
          }

          & curl.exe -L --fail --retry 3 --retry-delay 3 -o $genaiArchive $genaiUrl
          if ($LASTEXITCODE -ne 0) { throw "ONNX Runtime GenAI download failed: $LASTEXITCODE" }
          $genaiHash = (Get-FileHash $genaiArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($genaiHash -ne $env:ORT_GENAI_WIN_X64_SHA256) { throw "ONNX Runtime GenAI SHA256 mismatch: $genaiHash" }
          Expand-Archive -LiteralPath $genaiArchive -DestinationPath $genaiExtract -Force

          & curl.exe -L --fail --retry 3 --retry-delay 3 -o $ortArchive $ortUrl
          if ($LASTEXITCODE -ne 0) { throw "ONNX Runtime download failed: $LASTEXITCODE" }
          $ortHash = (Get-FileHash $ortArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ortHash -ne $env:ORT_WIN_X64_SHA256) { throw "ONNX Runtime SHA256 mismatch: $ortHash" }
          Expand-Archive -LiteralPath $ortArchive -DestinationPath $ortExtract -Force

          $header = Get-ChildItem $genaiExtract -Recurse -File -Filter 'ort_genai_c.h' | Select-Object -First 1
          $import = Get-ChildItem $genaiExtract -Recurse -File -Filter 'onnxruntime-genai.lib' | Select-Object -First 1
          $genaiDll = Get-ChildItem $genaiExtract -Recurse -File -Filter 'onnxruntime-genai.dll' | Select-Object -First 1
          $ortDll = Get-ChildItem $ortExtract -Recurse -File -Filter 'onnxruntime.dll' | Select-Object -First 1
          if (-not $header -or -not $import -or -not $genaiDll -or -not $ortDll) {
            throw 'Official ONNX Runtime GenAI / ONNX Runtime package layout is incomplete'
          }

          $seen = @{}
          foreach ($root in @($genaiExtract,$ortExtract)) {
            foreach ($dll in Get-ChildItem $root -Recurse -File -Filter '*.dll') {
              $key = $dll.Name.ToLowerInvariant()
              $hash = (Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($seen.ContainsKey($key)) {
                if ($seen[$key] -ne $hash) { throw "Conflicting duplicate ONNX DLL: $($dll.Name)" }
                continue
              }
              Copy-Item $dll.FullName (Join-Path $stage $dll.Name) -Force
              $seen[$key] = $hash
            }
          }
          foreach ($required in @('onnxruntime-genai.dll','onnxruntime.dll')) {
            if (-not (Test-Path (Join-Path $stage $required) -PathType Leaf)) { throw "$required was not staged" }
          }

          $env:ORT_STAGE = $stage
          @'
          import os,re,shutil
          from pathlib import Path
          import pefile
          stage=Path(os.environ['ORT_STAGE'])
          system32=Path(os.environ['WINDIR'])/'System32'
          redistributable=re.compile(r'^(?:msvcp|vcruntime|concrt)\d.*\.dll$', re.I)
          queue=[p for p in stage.glob('*.dll')]
          scanned=set()
          copied=set()
          def imports(path):
              pe=pefile.PE(str(path), fast_load=True)
              pe.parse_data_directories(directories=[
                  pefile.DIRECTORY_ENTRY['IMAGE_DIRECTORY_ENTRY_IMPORT'],
                  pefile.DIRECTORY_ENTRY['IMAGE_DIRECTORY_ENTRY_DELAY_IMPORT'],
              ])
              names=[]
              for attr in ('DIRECTORY_ENTRY_IMPORT','DIRECTORY_ENTRY_DELAY_IMPORT'):
                  for entry in getattr(pe,attr,[]):
                      try: names.append(entry.dll.decode('ascii'))
                      except Exception: pass
              pe.close()
              return names
          while queue:
              binary=queue.pop()
              key=binary.name.lower()
              if key in scanned: continue
              scanned.add(key)
              for name in imports(binary):
                  if not redistributable.match(name): continue
                  dst=stage/name
                  if not dst.is_file():
                      src=system32/name
                      if not src.is_file():
                          raise SystemExit('Required Microsoft VC++ runtime DLL unavailable: '+name)
                      shutil.copy2(src,dst)
                      copied.add(name.lower())
                  queue.append(dst)
          for p in stage.glob('*.dll'):
              pe=pefile.PE(str(p), fast_load=True)
              if pe.FILE_HEADER.Machine != 0x8664:
                  raise SystemExit('Runtime is not AMD64: '+p.name)
              pe.close()
          print(f'PASS BUILD103-compatible ONNX runtime stage: DLLs={len(list(stage.glob("*.dll")))} app_local_vc={len(copied)}')
          '@ | python -

          "ORT_GENAI_INCLUDE_DIR=$($header.DirectoryName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ORT_GENAI_LIBRARY=$($import.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ORT_GENAI_RUNTIME_STAGE=$stage" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PASS pinned ONNX runtime genai=$genaiHash ort=$ortHash"

      - name: Configure and build full x64 application with MEMSLibrary bridge and ONNX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inject = '${{ github.workspace }}\cmake\IaMemsLibraryBridgeInject.cmake'
          cmake -S . -B build-package -A x64 `
            -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/msvc2019_64" `
            -DMEMS_USE_BUNDLED_LIBROSCO_X64=ON `
            -DMEMS_RUN_REFERENCE_SELFTEST_POST_BUILD=OFF `
            -DMEMS_USE_ONNX_GENAI=ON `
            "-DORT_GENAI_INCLUDE_DIR=$env:ORT_GENAI_INCLUDE_DIR" `
            "-DORT_GENAI_LIBRARY=$env:ORT_GENAI_LIBRARY" `
            "-DCMAKE_PROJECT_INCLUDE=$inject"
          if ($LASTEXITCODE -ne 0) { throw "Temporary IA package CMake configure failed: $LASTEXITCODE" }

          cmake --build build-package --config Release --target `
            ecu_mems_manager ecu_mems_uninstaller rosco_abi_selftest `
            ia_response_selftest ia_mems_diagram_selftest mems_search_selftest `
            expert_runtime_selftest local_ai_onnx_selftest --parallel
          if ($LASTEXITCODE -ne 0) { throw "Temporary IA package build failed: $LASTEXITCODE" }
          Write-Host 'TMP_IA_FULL_APP_BUILD_PASS'

      - name: Run deterministic application checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = 'C:\Qt\5.15.2\msvc2019_64'
          $env:PATH = "$qtRoot\bin;$env:ORT_GENAI_RUNTIME_STAGE;$env:PATH"
          $env:QT_PLUGIN_PATH = "$qtRoot\plugins"
          & '${{ github.workspace }}\build-package\Release\ia_response_selftest.exe'
          if ($LASTEXITCODE -ne 0) { throw "IA response self-test failed: $LASTEXITCODE" }
          & '${{ github.workspace }}\build-package\Release\ia_mems_diagram_selftest.exe'
          if ($LASTEXITCODE -ne 0) { throw "IA diagram self-test failed: $LASTEXITCODE" }
          & '${{ github.workspace }}\build-package\Release\mems_search_selftest.exe'
          if ($LASTEXITCODE -ne 0) { throw "Reference search self-test failed: $LASTEXITCODE" }
          ctest --test-dir build-package/librosco-x64 -C Release --output-on-failure -R rosco_abi_selftest
          if ($LASTEXITCODE -ne 0) { throw "Protocol ABI self-test failed: $LASTEXITCODE" }

      - name: Generate and validate expert database r20
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = 'C:\Qt\5.15.2\msvc2019_64'
          $releaseRoot = '${{ github.workspace }}\build-package\Release'
          $referenceSource = '${{ github.workspace }}\database\reference'
          $referenceRuntime = Join-Path $releaseRoot 'database\reference'
          $expertRuntime = Join-Path $releaseRoot 'database\expert'
          $cacheRoot = '${{ github.workspace }}\expert-runtime-package-cache'
          if (Test-Path $referenceRuntime) { Remove-Item $referenceRuntime -Recurse -Force }
          New-Item -ItemType Directory -Path (Split-Path $referenceRuntime -Parent) -Force | Out-Null
          Copy-Item $referenceSource $referenceRuntime -Recurse -Force
          if (Test-Path $expertRuntime) { Remove-Item $expertRuntime -Recurse -Force }
          if (Test-Path $cacheRoot) { Remove-Item $cacheRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $cacheRoot -Force | Out-Null
          $env:PATH = "$qtRoot\bin;$env:ORT_GENAI_RUNTIME_STAGE;$env:PATH"
          $env:QT_PLUGIN_PATH = "$qtRoot\plugins"
          $savedLocalAppData = $env:LOCALAPPDATA
          $savedAppData = $env:APPDATA
          $generatorOutput = @()
          try {
            $env:LOCALAPPDATA = $cacheRoot
            $env:APPDATA = $cacheRoot
            & (Join-Path $releaseRoot 'expert_runtime_selftest.exe') 2>&1 | Tee-Object -Variable generatorOutput
            if ($LASTEXITCODE -ne 0) { throw "Expert runtime DB generator failed: $LASTEXITCODE" }
          } finally {
            $env:LOCALAPPDATA = $savedLocalAppData
            $env:APPDATA = $savedAppData
          }
          $databaseLine = $generatorOutput | ForEach-Object { [string]$_ } | Where-Object { $_ -like 'EXPERT_RUNTIME_DATABASE=*' } | Select-Object -Last 1
          if (-not $databaseLine) { throw 'Expert runtime generator did not report EXPERT_RUNTIME_DATABASE' }
          $expertDbPath = $databaseLine.Substring('EXPERT_RUNTIME_DATABASE='.Length).Trim()
          if (-not (Test-Path -LiteralPath $expertDbPath -PathType Leaf)) { throw "Expert DB missing: $expertDbPath" }
          $env:EXPERT_DB = $expertDbPath
          @'
          import os,sqlite3
          p=os.environ['EXPERT_DB']
          db=sqlite3.connect(p)
          try:
              ok=db.execute('PRAGMA integrity_check').fetchone()[0]
              rev=db.execute('PRAGMA user_version').fetchone()[0]
          finally:
              db.close()
          if str(ok).lower()!='ok' or rev!=20:
              raise SystemExit(f'Invalid expert DB: integrity={ok} revision={rev}')
          print('PASS expert SQLite r20')
          '@ | python -
          "AI_EXPERT_DB=$expertDbPath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download pinned BUILD 103 Qwen3 ONNX INT4 model
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $modelRoot = '${{ github.workspace }}\onnx-model-package'
          if (Test-Path $modelRoot) { Remove-Item $modelRoot -Recurse -Force }
          $env:MODEL_ROOT = $modelRoot
          @'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id=os.environ['ONNX_MODEL_REPO'],
              revision=os.environ['ONNX_MODEL_REVISION'],
              allow_patterns=[os.environ['ONNX_MODEL_SUBDIR'] + '/*'],
              local_dir=os.environ['MODEL_ROOT'],
          )
          '@ | python -
          $modelDir = Join-Path $modelRoot $env:ONNX_MODEL_SUBDIR
          foreach ($name in @('genai_config.json','model.onnx','model.onnx.data','tokenizer.json','tokenizer_config.json','chat_template.jinja')) {
            if (-not (Test-Path (Join-Path $modelDir $name) -PathType Leaf)) { throw "Qwen model file missing: $name" }
          }
          $modelHash = (Get-FileHash (Join-Path $modelDir 'model.onnx') -Algorithm SHA256).Hash.ToLowerInvariant()
          $dataHash = (Get-FileHash (Join-Path $modelDir 'model.onnx.data') -Algorithm SHA256).Hash.ToLowerInvariant()
          $tokenizerHash = (Get-FileHash (Join-Path $modelDir 'tokenizer.json') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($modelHash -ne $env:ONNX_MODEL_ONNX_SHA256) { throw "model.onnx hash mismatch: $modelHash" }
          if ($dataHash -ne $env:ONNX_MODEL_DATA_SHA256) { throw "model.onnx.data hash mismatch: $dataHash" }
          if ($tokenizerHash -ne $env:ONNX_TOKENIZER_SHA256) { throw "tokenizer.json hash mismatch: $tokenizerHash" }
          "ONNX_MODEL_DIR=$modelDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'PASS pinned BUILD 103 Qwen model hashes'

      - name: Validate native LocalAiClient before packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = 'C:\Qt\5.15.2\msvc2019_64'
          $selftest = Join-Path $env:ORT_GENAI_RUNTIME_STAGE 'local_ai_onnx_selftest.exe'
          Copy-Item '${{ github.workspace }}\build-package\Release\local_ai_onnx_selftest.exe' $selftest -Force
          $env:PATH = "$qtRoot\bin;$env:ORT_GENAI_RUNTIME_STAGE;$env:PATH"
          $env:QT_PLUGIN_PATH = "$qtRoot\plugins"
          $env:MEMS_AI_RUNTIME = Join-Path $env:ORT_GENAI_RUNTIME_STAGE 'onnxruntime-genai.dll'
          $env:MEMS_AI_MODEL = $env:ONNX_MODEL_DIR
          Push-Location $env:ORT_GENAI_RUNTIME_STAGE
          try {
            & $selftest
            if ($LASTEXITCODE -ne 0) { throw "Native LocalAiClient ONNX self-test failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
            Remove-Item $selftest -Force -ErrorAction SilentlyContinue
          }
          Write-Host 'PASS native LocalAiClient Qwen before packaging'

      - name: Build packaged Qwen plus MEMSLibrary validator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S bridge-qwen-test -B build-package-qwen -A x64 `
            -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/msvc2019_64" `
            "-DORT_GENAI_INCLUDE_DIR=$env:ORT_GENAI_INCLUDE_DIR" `
            "-DORT_GENAI_LIBRARY=$env:ORT_GENAI_LIBRARY"
          if ($LASTEXITCODE -ne 0) { throw "Packaged Qwen validator configure failed: $LASTEXITCODE" }
          cmake --build build-package-qwen --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Packaged Qwen validator build failed: $LASTEXITCODE" }

      - name: Assemble temporary portable IA MEMSLibrary package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = 'C:\Qt\5.15.2\msvc2019_64'
          $releaseRoot = '${{ github.workspace }}\build-package\Release'
          $dist = '${{ github.workspace }}\dist-tmp-ia'
          if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          Copy-Item "$releaseRoot\ecu_mems_manager.exe" $dist -Force
          Copy-Item "$releaseRoot\ecu_mems_uninstaller.exe" $dist -Force
          Copy-Item '${{ github.workspace }}\build-package\librosco-x64\Release\mems_manager_x64.dll' $dist -Force
          & "$qtRoot\bin\windeployqt.exe" --release --compiler-runtime --no-translations --dir $dist "$dist\ecu_mems_manager.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt app failed: $LASTEXITCODE" }
          & "$qtRoot\bin\windeployqt.exe" --release --compiler-runtime --no-translations --dir $dist "$dist\ecu_mems_uninstaller.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt uninstaller failed: $LASTEXITCODE" }

          foreach ($folder in @('translations','database')) {
            if (Test-Path "$releaseRoot\$folder") { Copy-Item "$releaseRoot\$folder" "$dist\$folder" -Recurse -Force }
          }
          New-Item -ItemType Directory -Path "$dist\database\expert" -Force | Out-Null
          Copy-Item $env:AI_EXPERT_DB "$dist\database\expert\ia_mems_reference_r20.sqlite" -Force

          foreach ($dll in Get-ChildItem $env:ORT_GENAI_RUNTIME_STAGE -File -Filter '*.dll') {
            Copy-Item $dll.FullName (Join-Path $dist $dll.Name) -Force
          }

          New-Item -ItemType Directory -Path "$dist\ai\models\qwen3-0.6b-int4" -Force | Out-Null
          Copy-Item '${{ github.workspace }}\ai\README.md' "$dist\ai\README.md" -Force
          Copy-Item '${{ github.workspace }}\ai\runtime_manifest.json' "$dist\ai\runtime_manifest.json" -Force
          Copy-Item "$env:ONNX_MODEL_DIR\*" "$dist\ai\models\qwen3-0.6b-int4" -Recurse -Force

          Copy-Item '${{ github.workspace }}\build-memslibrary\Release\MEMSLibrary.dll' "$dist\MEMSLibrary.dll" -Force
          New-Item -ItemType Directory -Path "$dist\MEMSLibrary_Pack_001" -Force | Out-Null
          Copy-Item '${{ github.workspace }}\pack001\knowledge.sqlite' "$dist\MEMSLibrary_Pack_001\knowledge.sqlite" -Force
          Copy-Item '${{ github.workspace }}\pack001\manifest.json' "$dist\MEMSLibrary_Pack_001\manifest.json" -Force

          & curl.exe -L --fail --retry 3 --retry-delay 3 -o "$dist\ai\ONNX_RUNTIME_GENAI_LICENSE.txt" "https://raw.githubusercontent.com/microsoft/onnxruntime-genai/v0.14.0/LICENSE"
          if ($LASTEXITCODE -ne 0) { throw "ONNX Runtime GenAI LICENSE download failed: $LASTEXITCODE" }
          & curl.exe -L --fail --retry 3 --retry-delay 3 -o "$dist\ai\ONNX_RUNTIME_LICENSE.txt" "https://raw.githubusercontent.com/microsoft/onnxruntime/v$env:ORT_VERSION/LICENSE"
          if ($LASTEXITCODE -ne 0) { throw "ONNX Runtime LICENSE download failed: $LASTEXITCODE" }

          @(
            'TEMPORARY IA TEST PACKAGE - NOT BUILD #104',
            'Production base protected: MEMSX64 BUILD #103 1d6316bd1746d6f2b4cfb751cab88d18e27ef730',
            "Temporary bridge commit: $env:GITHUB_SHA",
            'IA: native ONNX Runtime GenAI 0.14.0 + ONNX Runtime 1.24.4 + Qwen3-0.6B INT4',
            'Knowledge: MEMSLibrary ABI2 + MEMSLibrary_Pack_001 (47 RAVEMEMS documents)',
            'This package is for IA validation only; production MEMSX64 was not modified.'
          ) | Set-Content "$dist\README_TMP_IA_MEMSLIBRARY.txt" -Encoding UTF8

          @(
            "Repository: $env:ONNX_MODEL_REPO",
            "Revision: $env:ONNX_MODEL_REVISION",
            "Subdir: $env:ONNX_MODEL_SUBDIR",
            "model.onnx SHA-256: $env:ONNX_MODEL_ONNX_SHA256",
            "model.onnx.data SHA-256: $env:ONNX_MODEL_DATA_SHA256",
            "tokenizer.json SHA-256: $env:ONNX_TOKENIZER_SHA256"
          ) | Set-Content "$dist\ai\MODEL_SOURCE.txt" -Encoding UTF8

          "DIST=$dist" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate complete temporary IA package structure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DIST_ROOT = $env:DIST
          $env:ORT_STAGE_VALIDATE = $env:ORT_GENAI_RUNTIME_STAGE
          @'
          import hashlib,json,os,sqlite3
          from pathlib import Path
          import pefile
          root=Path(os.environ['DIST_ROOT'])
          ai=root/'ai'
          model=ai/'models'/'qwen3-0.6b-int4'
          ort=Path(os.environ['ORT_STAGE_VALIDATE'])
          pack=root/'MEMSLibrary_Pack_001'
          required=[
              root/'ecu_mems_manager.exe', root/'ecu_mems_uninstaller.exe', root/'mems_manager_x64.dll',
              root/'MEMSLibrary.dll', pack/'knowledge.sqlite', pack/'manifest.json',
              root/'onnxruntime-genai.dll', root/'onnxruntime.dll', root/'Qt5Svg.dll', root/'imageformats'/'qsvg.dll',
              model/'genai_config.json', model/'model.onnx', model/'model.onnx.data', model/'tokenizer.json',
              model/'tokenizer_config.json', model/'chat_template.jinja',
              root/'database'/'expert'/'ia_mems_reference_r20.sqlite', ai/'runtime_manifest.json', ai/'README.md',
              root/'database'/'reference'/'manifest.json'
          ]
          missing=[str(p.relative_to(root)) for p in required if not p.is_file()]
          if missing: raise SystemExit('Missing temporary IA package files: '+', '.join(missing))
          def h(p):
              x=hashlib.sha256()
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(1048576),b''): x.update(b)
              return x.hexdigest()
          for p in ort.glob('*.dll'):
              q=root/p.name
              if not q.is_file() or h(p)!=h(q):
                  raise SystemExit('ONNX runtime file changed/missing: '+p.name)
          expected={
              'model.onnx':os.environ['ONNX_MODEL_ONNX_SHA256'],
              'model.onnx.data':os.environ['ONNX_MODEL_DATA_SHA256'],
              'tokenizer.json':os.environ['ONNX_TOKENIZER_SHA256'],
          }
          for name,want in expected.items():
              got=h(model/name)
              if got.lower()!=want.lower(): raise SystemExit(f'{name} hash mismatch in package: {got}')
          for p in [root/'ecu_mems_manager.exe',root/'ecu_mems_uninstaller.exe',root/'mems_manager_x64.dll',root/'MEMSLibrary.dll']+list(ort.glob('*.dll')):
              target=p if p.parent==root else root/p.name
              pe=pefile.PE(str(target), fast_load=True)
              if pe.FILE_HEADER.Machine != 0x8664: raise SystemExit(target.name+' is not AMD64')
              pe.close()
          app=pefile.PE(str(root/'ecu_mems_manager.exe'), fast_load=True)
          app.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY['IMAGE_DIRECTORY_ENTRY_IMPORT']])
          imports={e.dll.decode('ascii').lower() for e in getattr(app,'DIRECTORY_ENTRY_IMPORT',[])}
          app.close()
          if 'onnxruntime-genai.dll' not in imports:
              raise SystemExit('ECU MEMS Manager is not linked to onnxruntime-genai.dll')
          db=sqlite3.connect(pack/'knowledge.sqlite')
          try:
              ok=db.execute('pragma integrity_check').fetchone()[0]
              fk=db.execute('pragma foreign_key_check').fetchall()
              docs=db.execute('select count(*) from ravemems_document').fetchone()[0]
          finally: db.close()
          if str(ok).lower()!='ok' or fk or docs!=47:
              raise SystemExit(f'Invalid packaged Pack001: integrity={ok} fk={len(fk)} docs={docs}')
          manifest=json.loads((pack/'manifest.json').read_text(encoding='utf-8'))
          if manifest.get('pack_id')!='MEMSLibrary_Pack_001' or int(manifest.get('document_count',0))!=47:
              raise SystemExit('Invalid Pack001 manifest in package')
          expert=root/'database'/'expert'/'ia_mems_reference_r20.sqlite'
          db=sqlite3.connect(expert)
          try:
              ok2=db.execute('pragma integrity_check').fetchone()[0]
              rev=db.execute('pragma user_version').fetchone()[0]
          finally: db.close()
          if str(ok2).lower()!='ok' or rev!=20:
              raise SystemExit(f'Invalid expert database: {ok2} r{rev}')
          print(f'TMP_IA_PACKAGE_STRUCTURE_PASS runtime_dlls={len(list(ort.glob("*.dll")))} pack_docs={docs} expert=r{rev}')
          '@ | python -

      - name: Run packaged Qwen with packaged RAVEMEMS grounding
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = $env:DIST
          $selftest = Join-Path $dist 'ia_memslibrary_qwen_selftest.exe'
          Copy-Item '${{ github.workspace }}\build-package-qwen\Release\ia_memslibrary_qwen_selftest.exe' $selftest -Force
          $env:PATH = "$dist;$env:PATH"
          $env:QT_PLUGIN_PATH = "$dist\plugins"
          $env:MEMS_AI_RUNTIME = Join-Path $dist 'onnxruntime-genai.dll'
          $env:MEMS_AI_MODEL = Join-Path $dist 'ai\models\qwen3-0.6b-int4'
          $env:MEMS_LIBRARY_DLL = Join-Path $dist 'MEMSLibrary.dll'
          $env:MEMS_LIBRARY_PACK = Join-Path $dist 'MEMSLibrary_Pack_001'
          Push-Location $dist
          try {
            & $selftest 2>&1 | Tee-Object -FilePath (Join-Path $dist 'TMP_IA_PACKAGE_QWEN_PROOF.txt')
            if ($LASTEXITCODE -ne 0) { throw "Packaged Qwen + RAVEMEMS test failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
            Remove-Item $selftest -Force -ErrorAction SilentlyContinue
          }
          Write-Host 'TMP_IA_PACKAGE_QWEN_PASS'

      - name: Smoke launch packaged ECU MEMS Manager
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p=Start-Process -FilePath "$env:DIST\ecu_mems_manager.exe" -WorkingDirectory $env:DIST -PassThru
          Start-Sleep -Seconds 8
          if($p.HasExited){ throw "Packaged ECU MEMS Manager exited during smoke launch: $($p.ExitCode)" }
          $null=$p.CloseMainWindow()
          if(-not $p.WaitForExit(5000)){ Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          Write-Host 'TMP_IA_PACKAGE_APP_SMOKE_PASS'

      - name: Generate temporary package manifest and hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest="$env:DIST\install_manifest.txt"
          $hashName='TMP_IA_MEMSLIBRARY_SHA256.txt'
          $files=Get-ChildItem $env:DIST -Recurse -File | ForEach-Object { $_.FullName.Substring($env:DIST.Length+1).Replace('\','/') } | Sort-Object -Unique
          ($files + 'install_manifest.txt' + $hashName) | Sort-Object -Unique | Set-Content $manifest -Encoding UTF8
          $hashFile=Join-Path $env:DIST $hashName
          $lines=foreach($f in Get-ChildItem $env:DIST -Recurse -File | Where-Object{$_.FullName-ne$hashFile} | Sort-Object FullName){
            $r=$f.FullName.Substring($env:DIST.Length+1).Replace('\','/')
            "$((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $r"
          }
          $lines | Set-Content $hashFile -Encoding UTF8
          Write-Host "TMP_IA_PACKAGE_FILES=$($files.Count)"

      - name: Upload temporary ECU MEMS Manager x64 IA MEMSLibrary package
        uses: actions/upload-artifact@v4
        with:
          name: TMP-ECU-MEMS-Manager-x64-IA-MEMSLibrary-${{ github.run_id }}
          path: dist-tmp-ia/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
