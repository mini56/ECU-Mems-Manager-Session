name: REPORT POST98 REAL TEST

on:
  push:
    branches:
      - RAPPORT

permissions:
  contents: write

jobs:
  append_report:
    if: github.event.head_commit.message == 'REPORT fix post98 report append workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Append post98 history
        shell: python
        run: |
          import base64
          from pathlib import Path
          data = base64.b64decode("").decode('utf-8')
          path = Path('RAPPORT_SUIVI_ECU_MEMS_MANAGER.md')
          with path.open('a', encoding='utf-8', newline='\n') as f:
              f.write(data)
      - name: Commit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git commit -m "Document BUILD 98 real clean-PC tests"
          git push origin RAPPORT
