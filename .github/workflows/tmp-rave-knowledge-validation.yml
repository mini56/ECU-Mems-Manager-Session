name: RAVE TEMP VALIDATION
run-name: RAVE candidate validation - ${{ github.sha }}

on:
  push:
    branches: [tmp-rave-knowledge-foundation]

permissions:
  contents: read

jobs:
  validate_x64:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'

    steps:
      - name: Checkout exact temporary candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0"
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          if (Test-Path 'C:\Qt') { Remove-Item 'C:\Qt' -Recurse -Force -ErrorAction SilentlyContinue }
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtcharts -O C:\Qt --external "$sevenZip"
          if ($LASTEXITCODE -ne 0) { throw "aqtinstall failed: $LASTEXITCODE" }

      - name: Configure x64 candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build-rave-validation -A x64 `
            -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/msvc2019_64" `
            -DMEMS_USE_BUNDLED_LIBROSCO_X64=ON `
            -DMEMS_RUN_REFERENCE_SELFTEST_POST_BUILD=OFF `
            -DMEMS_USE_ONNX_GENAI=OFF
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed: $LASTEXITCODE" }

      - name: Compile touched x64 paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build-rave-validation --config Release --target `
            ecu_mems_manager ia_mems_diagram_selftest expert_runtime_selftest
          if ($LASTEXITCODE -ne 0) { throw "x64 candidate compile failed: $LASTEXITCODE" }

      - name: Run diagram regression self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = 'C:\Qt\5.15.2\msvc2019_64'
          $env:PATH = "$qtRoot\bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "$qtRoot\plugins"
          & '${{ github.workspace }}\build-rave-validation\Release\ia_mems_diagram_selftest.exe'
          if ($LASTEXITCODE -ne 0) { throw "IA MEMS diagram self-test failed: $LASTEXITCODE" }

      - name: Rebuild expert r20 and validate unified knowledge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = 'C:\Qt\5.15.2\msvc2019_64'
          $releaseRoot = '${{ github.workspace }}\build-rave-validation\Release'
          $referenceSource = '${{ github.workspace }}\database\reference'
          $referenceRuntime = Join-Path $releaseRoot 'database\reference'
          $cacheRoot = '${{ github.workspace }}\rave-validation-cache'

          if (Test-Path $referenceRuntime) { Remove-Item $referenceRuntime -Recurse -Force }
          New-Item -ItemType Directory -Path (Split-Path $referenceRuntime -Parent) -Force | Out-Null
          Copy-Item $referenceSource $referenceRuntime -Recurse -Force
          if (Test-Path $cacheRoot) { Remove-Item $cacheRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $cacheRoot -Force | Out-Null

          $env:PATH = "$qtRoot\bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "$qtRoot\plugins"
          $savedLocalAppData = $env:LOCALAPPDATA
          $savedAppData = $env:APPDATA
          $generatorOutput = @()
          try {
            $env:LOCALAPPDATA = $cacheRoot
            $env:APPDATA = $cacheRoot
            & (Join-Path $releaseRoot 'expert_runtime_selftest.exe') 2>&1 | Tee-Object -Variable generatorOutput
            if ($LASTEXITCODE -ne 0) { throw "Expert runtime generator failed: $LASTEXITCODE" }
          } finally {
            $env:LOCALAPPDATA = $savedLocalAppData
            $env:APPDATA = $savedAppData
          }

          $databaseLine = $generatorOutput | ForEach-Object { [string]$_ } |
            Where-Object { $_ -like 'EXPERT_RUNTIME_DATABASE=*' } | Select-Object -Last 1
          if (-not $databaseLine) { throw 'Expert runtime generator did not report EXPERT_RUNTIME_DATABASE' }
          $expertDbPath = $databaseLine.Substring('EXPERT_RUNTIME_DATABASE='.Length).Trim()
          if (-not (Test-Path -LiteralPath $expertDbPath -PathType Leaf)) { throw "Expert DB missing: $expertDbPath" }

          python '${{ github.workspace }}\tools\validate_rave_knowledge_foundation.py' $expertDbPath
          if ($LASTEXITCODE -ne 0) { throw "RAVE foundation validation failed: $LASTEXITCODE" }

          python '${{ github.workspace }}\tools\validate_unified_ia_knowledge.py' $expertDbPath $referenceRuntime
          if ($LASTEXITCODE -ne 0) { throw "Unified IA knowledge validation failed: $LASTEXITCODE" }

          Write-Host 'PASS temporary RAVE x64 candidate validation'
