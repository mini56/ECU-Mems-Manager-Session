name: ECU MEMS Manager x64 COMPAT IA
run-name: BUILD #29 COMPAT IA - v1.0.29 - ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [MEMSX64]
    paths:
      - '.github/workflows/memsx64_compat_ai.yml'

concurrency:
  group: memsx64-build-29-compat-ai
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_compat_ai:
    runs-on: windows-latest
    env:
      MEMS_BUILD: '29'
      MEMS_VERSION: '1.0.29'
      MEMS_BUILD_NUMBER: '29'
      LLAMA_RELEASE: 'b10516'
      LLAMA_COMMIT: 'b95502ba9aa0eb73a2f4fc8878d7fbe6a847a0b9'

    steps:
      - name: Checkout exact MEMS source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build validation tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0" pefile

      - name: Install Qt 5.15.2 MSVC 2019 x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          if (Test-Path 'C:\Qt') { Remove-Item 'C:\Qt' -Recurse -Force -ErrorAction SilentlyContinue }
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtcharts -O C:\Qt --external "$sevenZip"
          if ($LASTEXITCODE -ne 0) { throw "aqtinstall failed: $LASTEXITCODE" }
          $qtRoot = 'C:\Qt\5.15.2\msvc2019_64'
          if (-not (Test-Path "$qtRoot\lib\cmake\Qt5\Qt5Config.cmake")) { throw 'Qt x64 CMake configuration missing' }

      - name: Validate MEMS protocol guards
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python librosco-x64/validate_protocol_guards.py

      - name: Configure MEMS Manager x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build-x64 -A x64 `
            -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/msvc2019_64" `
            -DMEMS_USE_BUNDLED_LIBROSCO_X64=ON `
            -DMEMS_RUN_REFERENCE_SELFTEST_POST_BUILD=OFF

      - name: Build MEMS Manager and protocol ABI test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build-x64 --config Release --target ecu_mems_manager rosco_abi_selftest
          if (-not (Test-Path 'build-x64\Release\ecu_mems_manager.exe')) { throw 'ecu_mems_manager.exe missing' }
          if (-not (Test-Path 'build-x64\librosco-x64\Release\mems_manager_x64.dll')) { throw 'mems_manager_x64.dll missing' }

      - name: Run IA deterministic response self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = 'C:\Qt\5.15.2\msvc2019_64'
          $env:PATH = "$qtRoot\bin;$env:PATH"
          & '${{ github.workspace }}\build-x64\Release\ia_response_selftest.exe'
          if ($LASTEXITCODE -ne 0) { throw "IA response self-test failed: $LASTEXITCODE" }

      - name: Run protocol ABI self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ctest --test-dir build-x64/librosco-x64 -C Release --output-on-failure -R rosco_abi_selftest

      - name: Run reference database self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = 'C:\Qt\5.15.2\msvc2019_64'
          $env:PATH = "$qtRoot\bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "$qtRoot\plugins"
          & '${{ github.workspace }}\build-x64\Release\mems_search_selftest.exe'
          if ($LASTEXITCODE -ne 0) { throw "MEMS reference semantic self-test failed: $LASTEXITCODE" }

      - name: Build conservative static llama.cpp b10516 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = '${{ github.workspace }}\llama-b10516-src'
          $build = '${{ github.workspace }}\llama-b10516-build'
          if (Test-Path $src) { Remove-Item $src -Recurse -Force }
          if (Test-Path $build) { Remove-Item $build -Recurse -Force }
          git clone --depth 1 --branch $env:LLAMA_RELEASE https://github.com/ggml-org/llama.cpp.git $src
          if ($LASTEXITCODE -ne 0) { throw "llama.cpp clone failed: $LASTEXITCODE" }
          $actualCommit = (git -C $src rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actualCommit -ne $env:LLAMA_COMMIT.ToLowerInvariant()) { throw "llama.cpp commit mismatch: $actualCommit" }

          cmake -S $src -B $build -A x64 `
            -DBUILD_SHARED_LIBS=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DGGML_NATIVE=OFF `
            -DGGML_BACKEND_DL=OFF `
            -DGGML_CPU_ALL_VARIANTS=OFF `
            -DGGML_OPENMP=OFF `
            -DGGML_RPC=OFF `
            -DGGML_SSE42=OFF `
            -DGGML_AVX=OFF `
            -DGGML_AVX2=OFF `
            -DGGML_AVX_VNNI=OFF `
            -DGGML_BMI2=OFF `
            -DGGML_AVX512=OFF `
            -DGGML_AVX512_VBMI=OFF `
            -DGGML_AVX512_VNNI=OFF `
            -DGGML_AVX512_BF16=OFF `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_BUILD_EXAMPLES=OFF `
            -DLLAMA_BUILD_TESTS=OFF `
            -DLLAMA_BUILD_TOOLS=ON `
            -DLLAMA_BUILD_APP=OFF `
            -DLLAMA_OPENSSL=OFF
          if ($LASTEXITCODE -ne 0) { throw "conservative llama configure failed: $LASTEXITCODE" }
          cmake --build $build --config Release --target llama-server --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "conservative llama build failed: $LASTEXITCODE" }

          $server = Get-ChildItem $build -Recurse -File -Filter 'llama-server.exe' | Where-Object { $_.FullName -match '\\Release\\' } | Select-Object -First 1
          if (-not $server) { $server = Get-ChildItem $build -Recurse -File -Filter 'llama-server.exe' | Select-Object -First 1 }
          if (-not $server) { throw 'conservative llama-server.exe missing' }

          $cache = Get-Content (Join-Path $build 'CMakeCache.txt') -Raw
          foreach ($required in @('BUILD_SHARED_LIBS:BOOL=OFF','GGML_NATIVE:BOOL=OFF','GGML_BACKEND_DL:BOOL=OFF','GGML_CPU_ALL_VARIANTS:BOOL=OFF','GGML_OPENMP:BOOL=OFF','GGML_SSE42:BOOL=OFF','GGML_AVX:BOOL=OFF','GGML_AVX2:BOOL=OFF','GGML_BMI2:BOOL=OFF','LLAMA_BUILD_TOOLS:BOOL=ON','LLAMA_BUILD_APP:BOOL=OFF','LLAMA_OPENSSL:BOOL=OFF')) {
            if (-not $cache.Contains($required)) { throw "Conservative llama build flag missing: $required" }
          }
          $ggmlDlls = @(Get-ChildItem $server.Directory.FullName -File -Filter 'ggml-*.dll' -ErrorAction SilentlyContinue)
          if ($ggmlDlls.Count -ne 0) { throw "Static llama runtime unexpectedly contains dynamic ggml backend DLLs: $($ggmlDlls.Name -join ', ')" }
          & $server.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "conservative llama-server --version failed: $LASTEXITCODE" }
          "AI_COMPAT_SERVER=$($server.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PASS llama.cpp $env:LLAMA_RELEASE conservative static x64 runtime at exact commit $actualCommit"

      - name: Download and verify Qwen3-0.6B-Q8_0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = '${{ github.workspace }}\ai-compat-stage'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          $modelUrl = 'https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf?download=true'
          $modelSha = '9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031'
          $modelPath = Join-Path $stage 'ia-mems.gguf'
          & curl.exe -L --fail --retry 3 --retry-delay 3 -o $modelPath $modelUrl
          if ($LASTEXITCODE -ne 0) { throw "Qwen model download failed: $LASTEXITCODE" }
          $modelActual = (Get-FileHash $modelPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($modelActual -ne $modelSha) { throw "Qwen model SHA256 mismatch: $modelActual" }
          "AI_COMPAT_MODEL=$modelPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'PASS verified Qwen3-0.6B-Q8_0'

      - name: Assemble BUILD 29 portable package with conservative IA runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = 'C:\Qt\5.15.2\msvc2019_64'
          $build = '${{ github.workspace }}\build-x64'
          $dist = '${{ github.workspace }}\dist-x64-compat'
          if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
          New-Item -ItemType Directory -Path $dist | Out-Null
          Copy-Item "$build\Release\ecu_mems_manager.exe" "$dist\ecu_mems_manager.exe" -Force
          Copy-Item "$build\librosco-x64\Release\mems_manager_x64.dll" "$dist\mems_manager_x64.dll" -Force
          & "$qtRoot\bin\windeployqt.exe" --release --compiler-runtime --no-translations --dir $dist "$dist\ecu_mems_manager.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed: $LASTEXITCODE" }

          Copy-Item "$build\Release\translations" "$dist\translations" -Recurse -Force
          Copy-Item "$build\Release\database" "$dist\database" -Recurse -Force

          $aiDir = Join-Path $dist 'ai'
          $aiModels = Join-Path $aiDir 'models'
          New-Item -ItemType Directory -Path $aiModels -Force | Out-Null
          Copy-Item $env:AI_COMPAT_SERVER (Join-Path $aiDir 'llama-server.exe') -Force
          Copy-Item $env:AI_COMPAT_MODEL (Join-Path $aiModels 'ia-mems.gguf') -Force
          Copy-Item '${{ github.workspace }}\llama-b10516-src\LICENSE' (Join-Path $aiDir 'LLAMA_CPP_LICENSE.txt') -Force

          @'
          {
            "schema_version": 1,
            "mode": "offline_local_only",
            "listen_address": "127.0.0.1",
            "listen_port": 18089,
            "runtime": {
              "name": "llama.cpp",
              "release": "b10516",
              "source_commit": "b95502ba9aa0eb73a2f4fc8878d7fbe6a847a0b9",
              "build_profile": "MEMS static CPU x64 compatibility: no dynamic backends, no OpenMP, no OpenSSL/HTTPS, SSE4.2/AVX/AVX2/BMI2 disabled",
              "license": "MIT"
            },
            "model": {
              "name": "Qwen3-0.6B-Q8_0",
              "repository": "Qwen/Qwen3-0.6B-GGUF",
              "filename": "Qwen3-0.6B-Q8_0.gguf",
              "runtime_filename": "ia-mems.gguf",
              "sha256": "9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031",
              "license": "Apache-2.0"
            },
            "conversation": {
              "context_tokens": 4096,
              "max_output_tokens": 520,
              "temperature": 0.7,
              "top_p": 0.8,
              "thinking": false,
              "maximum_retained_turns": 8
            }
          }
          '@ | Set-Content (Join-Path $aiDir 'runtime_manifest.json') -Encoding UTF8

          @(
            'ECU MEMS MANAGER - BUILD #29 v1.0.29',
            'Compatibility IA runtime test package',
            'llama.cpp b10516 exact source commit b95502ba9aa0eb73a2f4fc8878d7fbe6a847a0b9',
            'Static CPU x64 runtime, no dynamic ggml CPU backend selection',
            'Local HTTP only: OpenSSL/HTTPS disabled so no external OpenSSL DLL is required',
            'SSE4.2 / AVX / AVX2 / BMI2 disabled for broad CPU compatibility',
            'Qwen3-0.6B-Q8_0 unchanged'
          ) | Set-Content "$dist\README_IA_COMPAT.txt" -Encoding UTF8

      - name: Validate conservative IA package architecture and imports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DIST = '${{ github.workspace }}\dist-x64-compat'
          @'
          import os
          from pathlib import Path
          import pefile
          root=Path(os.environ['DIST'])
          app=root/'ecu_mems_manager.exe'
          protocol=root/'mems_manager_x64.dll'
          server=root/'ai'/'llama-server.exe'
          for p in (app, protocol, server):
              if not p.exists(): raise SystemExit(f'Missing binary: {p}')
              pe=pefile.PE(str(p), fast_load=False)
              if pe.FILE_HEADER.Machine != 0x8664 or pe.OPTIONAL_HEADER.Magic != 0x20B:
                  raise SystemExit(f'Not AMD64 PE32+: {p}')
          spe=pefile.PE(str(server), fast_load=False)
          imports=[e.dll.decode('ascii',errors='replace').lower() for e in spe.DIRECTORY_ENTRY_IMPORT]
          print('llama-server direct imports: '+', '.join(imports))
          bad=[x for x in imports if x.startswith('ggml-') or 'libomp' in x or 'vcomp' in x or 'libssl' in x or 'libcrypto' in x or x.startswith('vcruntime') or x.startswith('msvcp')]
          if bad: raise SystemExit('Conservative llama-server still imports unpackaged native runtime DLLs: '+', '.join(bad))
          model=root/'ai'/'models'/'ia-mems.gguf'
          if not model.exists() or model.stat().st_size < 500_000_000: raise SystemExit('Qwen model missing or unexpectedly small')
          print('PASS conservative static llama-server AMD64 with no ggml/OpenMP/OpenSSL/VC runtime DLL imports')
          '@ | python -

          $portableServer = Join-Path $env:DIST 'ai\llama-server.exe'
          $savedPath = $env:PATH
          $savedLocation = Get-Location
          $portableExit = $null
          try {
            Set-Location (Split-Path $portableServer -Parent)
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            & $portableServer --version
            $portableExit = $LASTEXITCODE
          }
          finally {
            $env:PATH = $savedPath
            Set-Location $savedLocation
          }
          if ($portableExit -ne 0) { throw "Packaged llama-server --version failed with isolated PATH: $portableExit" }
          Write-Host 'PASS packaged llama-server --version with isolated PATH'

      - name: Control IA - start conservative llama Qwen and answer locally
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = '${{ github.workspace }}\dist-x64-compat'
          $server = "$dist\ai\llama-server.exe"
          $model = "$dist\ai\models\ia-mems.gguf"
          $stdout = "$dist\IA_LLAMA_STDOUT.txt"
          $stderr = "$dist\IA_LLAMA_STDERR.txt"
          $args = @('-m', $model, '--alias', 'ia-mems', '--host', '127.0.0.1', '--port', '18089', '-c', '4096', '-np', '1')
          $proc = Start-Process -FilePath $server -ArgumentList $args -WorkingDirectory "$dist\ai" -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 180; $i++) {
              $proc.Refresh()
              if ($proc.HasExited) { break }
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:18089/health' -Method Get -TimeoutSec 2
                if ($health.status -eq 'ok') { $ready = $true; break }
              } catch { }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) {
              $outText = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { '' }
              $errText = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { '' }
              $proc.Refresh()
              $exit = if ($proc.HasExited) { $proc.ExitCode } else { 'still-running' }
              throw "Conservative local IA did not become healthy. Exit=$exit STDOUT=$outText STDERR=$errText"
            }
            $payload = @{
              model = 'ia-mems'
              messages = @(
                @{ role = 'system'; content = 'Answer briefly in English. Do not think aloud. /no_think' },
                @{ role = 'user'; content = 'Reply with a short confirmation that the MEMS29 compatibility AI test works. /no_think' }
              )
              stream = $false
              temperature = 0.0
              max_tokens = 30
            } | ConvertTo-Json -Depth 8
            $response = Invoke-RestMethod -Uri 'http://127.0.0.1:18089/v1/chat/completions' -Method Post -ContentType 'application/json' -Body $payload -TimeoutSec 120
            $answer = [string]$response.choices[0].message.content
            if ([string]::IsNullOrWhiteSpace($answer)) { throw 'Conservative local Qwen returned an empty answer' }
            Write-Host "PASS conservative local IA response: $answer"
          }
          finally {
            $proc.Refresh()
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Smoke launch packaged MEMS Manager
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = '${{ github.workspace }}\dist-x64-compat'
          $proc = Start-Process "$dist\ecu_mems_manager.exe" -WorkingDirectory $dist -PassThru
          Start-Sleep -Seconds 5
          $proc.Refresh()
          if ($proc.HasExited) { throw "x64 application exited during smoke launch (code $($proc.ExitCode))" }
          Stop-Process -Id $proc.Id -Force
          Write-Host 'PASS full application smoke launch'

      - name: Upload BUILD 29 compatibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECU-MEMS-Manager-x64-BUILD-29-v1.0.29-COMPAT-IA
          path: dist-x64-compat/
          if-no-files-found: error
          compression-level: 0