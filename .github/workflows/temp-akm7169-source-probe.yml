name: TEMP AKM7169 exact-source probe
on:
  push:
    branches: [tmp-akm7169-1870-transport]
    paths: ['.github/workflows/temp-akm7169-source-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe PDFCoffee exact binary
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, re, hashlib, sys
          bases = [
            'https://pdfcoffee.com/mini-repair-manual-92-96-2-pdf-free.html',
            'https://pdfcoffee.com/mini-repair-manual-92-96-pdf-pdf-free.html',
          ]
          ua={'User-Agent':'Mozilla/5.0'}
          candidates=[]
          for base in bases:
            for u in [base, base.replace('/mini-','/download/mini-')]:
              if u not in candidates: candidates.append(u)
            try:
              req=urllib.request.Request(base,headers=ua)
              data=urllib.request.urlopen(req,timeout=30).read()
              print('PAGE',base,'bytes',len(data),'sha256',hashlib.sha256(data).hexdigest(),'prefix',data[:12])
              text=data.decode('utf-8','ignore')
              vals=[]
              for pat in [r'''(?:href|src|action|data-href|data-src)=["']([^"']+)["']''', r'''https?://[^\s"'<>]+''']:
                vals += re.findall(pat,text,re.I)
              for v in vals:
                v=v.replace('&amp;','&')
                a=urllib.parse.urljoin(base,v)
                if ('pdfcoffee' in a or '.pdf' in a.lower() or 'download' in a.lower()) and a not in candidates:
                  candidates.append(a)
            except Exception as e:
              print('PAGE_ERROR',base,repr(e))
          print('CANDIDATES',len(candidates))
          for i,u in enumerate(candidates[:120]): print('URL',i,u)
          exact='c8bbb30d7d5a52932e7f92723ba5dc70520012ac3ceac21d19ab0a39b4d4c4e0'
          found=False
          for i,u in enumerate(candidates[:120]):
            try:
              req=urllib.request.Request(u,headers=ua)
              with urllib.request.urlopen(req,timeout=45) as r:
                ct=r.headers.get('content-type','')
                data=r.read(50000000)
              sha=hashlib.sha256(data).hexdigest()
              print('FETCH',i,'bytes',len(data),'ct',ct,'sha256',sha,'prefix',data[:8])
              if data.startswith(b'%PDF'):
                open(f'candidate_{i}.pdf','wb').write(data)
                if sha==exact and len(data)==43906518:
                  print('EXACT_SOURCE_FOUND',i,u)
                  found=True
                  break
            except Exception as e:
              print('FETCH_ERROR',i,repr(e))
          if not found:
            print('EXACT_SOURCE_NOT_FOUND')
          PY
