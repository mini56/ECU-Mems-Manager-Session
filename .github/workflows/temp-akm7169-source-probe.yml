name: TEMP AKM7169 direct min.pdf probe
on:
  push:
    branches: [tmp-akm7169-1870-transport]
    paths: ['.github/workflows/temp-akm7169-source-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify direct viewer PDF target
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, hashlib
          url='https://pdfcoffee.com/pdfcoffee/assets/pdf/min.pdf'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=45) as r:
              data=r.read(50000000)
              print('CONTENT_TYPE',r.headers.get('content-type',''))
          print('BYTES',len(data))
          print('SHA256',hashlib.sha256(data).hexdigest())
          print('PREFIX',data[:16])
          open('min.pdf','wb').write(data)
          exact=(data.startswith(b'%PDF') and len(data)==43906518 and hashlib.sha256(data).hexdigest()=='c8bbb30d7d5a52932e7f92723ba5dc70520012ac3ceac21d19ab0a39b4d4c4e0')
          print('EXACT_BINARY',exact)
          if data.startswith(b'%PDF'):
              try:
                  import fitz
              except Exception:
                  raise SystemExit('PDF_RECEIVED_PYMUPDF_NOT_INSTALLED')
              d=fitz.open('min.pdf')
              print('PAGES',d.page_count)
              print('EXACT_ALL', exact and d.page_count==482)
          PY
