name: TEMP AKM7169 download-page probe
on:
  push:
    branches: [tmp-akm7169-1870-transport]
    paths: ['.github/workflows/temp-akm7169-source-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect PDFCoffee download page only
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,re,urllib.parse,hashlib
          u='https://pdfcoffee.com/download/mini-repair-manual-92-96-2-pdf-free.html'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Referer':'https://pdfcoffee.com/mini-repair-manual-92-96-2-pdf-free.html'})
          with urllib.request.urlopen(req,timeout=45) as r:
              b=r.read()
              print('PAGE_BYTES',len(b),'CT',r.headers.get('content-type',''),'FINAL',r.geturl())
          print('PAGE_SHA256',hashlib.sha256(b).hexdigest())
          t=b.decode('utf-8','ignore')
          pats=[r'''(?:href|src|action|data-href|data-src)=["']([^"']+)["']''',r'''https?://[^\s"'<>]+''',r'''(?:window\.location|location\.href)\s*=\s*["']([^"']+)["']''']
          out=[]
          for p in pats:
              for x in re.findall(p,t,re.I):
                  x=x.replace('&amp;','&')
                  x=urllib.parse.urljoin(u,x)
                  if x not in out: out.append(x)
          print('URL_COUNT',len(out))
          for i,x in enumerate(out):
              if any(k in x.lower() for k in ['pdf','download','file','asset','cdn']): print('CAND',i,x)
          for line in t.splitlines():
              lo=line.lower()
              if any(k in lo for k in ['download','assets/pdf','.pdf','window.location','location.href','data-href','data-url']):
                  print('HTML',line[:1200])
          PY
