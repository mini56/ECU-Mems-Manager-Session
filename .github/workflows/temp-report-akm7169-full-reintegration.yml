name: TEMP REPORT AKM7169 FULL REINTEGRATION

on:
  push:
    branches: [ RAPPORT ]
    paths:
      - '.github/workflows/temp-report-akm7169-full-reintegration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Append master report and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '\n' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          echo '' | base64 -d >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git commit -m "Journal AKM7169 full reintegration checkpoint"
          git rm .github/workflows/temp-report-akm7169-full-reintegration.yml
          git commit -m "Remove temporary AKM7169 report helper"
          git push origin HEAD:RAPPORT
