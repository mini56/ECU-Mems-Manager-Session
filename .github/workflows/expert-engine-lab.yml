name: Expert engine laboratory self-test

on:
  workflow_dispatch:
  push:
    branches: ["lab-expert-engine"]
    paths:
      - "expert/**"
      - "iamemstab.cpp"
      - "iamemstab.h"
      - "CMakeLists.txt"
      - ".github/workflows/expert-engine-lab.yml"

permissions:
  contents: write

concurrency:
  group: expert-engine-lab
  cancel-in-progress: true

jobs:
  expert-selftest-windows:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout expert laboratory branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install aqtinstall
        run: pip install aqtinstall

      - name: Install Qt 5.15.2 MinGW 32-bit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & aqt install-qt windows desktop 5.15.2 win32_mingw81 -O C:\Qt
          if ($LASTEXITCODE -ne 0) { throw "Qt installation failed" }
          & aqt install-tool windows desktop tools_mingw qt.tools.win32_mingw810 -O C:\Qt
          if ($LASTEXITCODE -ne 0) { throw "MinGW installation failed" }

      - name: Add Qt and MinGW to PATH
        shell: pwsh
        run: |
          "C:\Qt\Tools\mingw810_32\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Qt\5.15.2\mingw81_32\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure expert engine self-test
        run: cmake -S expert -B expert-build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/mingw81_32"

      - name: Build expert engine self-test
        run: cmake --build expert-build

      - name: Run expert engine self-test
        run: ctest --test-dir expert-build --output-on-failure

      - name: Record failed laboratory self-test
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          printf 'Expert engine self-test: FAILED\nValidated source commit: %s\nWorkflow run: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > expert/SELFTEST_FAILED.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- expert/SELFTEST_FAILED.txt
          git commit -m "Record expert engine self-test failure [skip ci]"
          git push origin HEAD:lab-expert-engine

      - name: Record successful laboratory self-test
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          printf 'Expert engine self-test: OK\nValidated source commit: %s\nWorkflow run: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > expert/SELFTEST_OK.txt
          git rm -f --ignore-unmatch expert/SELFTEST_FAILED.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- expert/SELFTEST_OK.txt
          git commit -m "Validate expert engine self-test [skip ci]"
          git push origin HEAD:lab-expert-engine

  ia-mems-app-build:
    needs: expert-selftest-windows
    if: always() && github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout IA MEMS source commit
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt 5.15.2, Charts and MinGW 32-bit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pip install aqtinstall
          & aqt install-qt windows desktop 5.15.2 win32_mingw81 -m qtcharts -O C:\Qt
          if ($LASTEXITCODE -ne 0) { throw "Qt installation failed" }
          & aqt install-tool windows desktop tools_mingw qt.tools.win32_mingw810 -O C:\Qt
          if ($LASTEXITCODE -ne 0) { throw "MinGW installation failed" }
          "C:\Qt\Tools\mingw810_32\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Qt\5.15.2\mingw81_32\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate librosco import library
        shell: pwsh
        run: |
          Set-Location prebuilt-librosco
          gendef librosco.dll
          if ($LASTEXITCODE -ne 0) { throw "gendef failed" }
          dlltool -d librosco.def -l librosco.dll.a
          if ($LASTEXITCODE -ne 0) { throw "dlltool failed" }

      - name: Configure main application
        shell: pwsh
        run: |
          cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/mingw81_32;${{ github.workspace }}/prebuilt-librosco"
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }

      - name: Compile main application with IA MEMS
        id: iamemsbuild
        continue-on-error: true
        shell: pwsh
        run: |
          cmake --build build --target ecu_mems_manager
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "build\ecu_mems_manager.exe")) {
            "IA MEMS application build: FAILED`nsource_commit=${{ github.sha }}`nrun=${{ github.run_id }}" | Set-Content -Encoding UTF8 iamems_build_status.txt
            exit 1
          }
          "IA MEMS application build: OK`nsource_commit=${{ github.sha }}`nrun=${{ github.run_id }}" | Set-Content -Encoding UTF8 iamems_build_status.txt

      - name: Record IA MEMS application build
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f iamems_build_status.txt ]; then
            printf 'IA MEMS application build: FAILED before compile\nsource_commit=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > iamems_build_status.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin lab-expert-engine
          git rebase origin/lab-expert-engine
          git add -- iamems_build_status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record IA MEMS application build [skip ci]"
            git push origin HEAD:lab-expert-engine
          fi

      - name: Fail if IA MEMS application did not compile
        if: steps.iamemsbuild.outcome != 'success'
        shell: bash
        run: exit 1
