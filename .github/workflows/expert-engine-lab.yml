name: Expert engine laboratory self-test

on:
  workflow_dispatch:
  push:
    branches: ["lab-expert-engine"]
    paths:
      - "expert/**"
      - "iamemstab.cpp"
      - "iamemstab.h"
      - "database/reference/manifest.json"
      - "database/reference/research_enrichment_1640.qz64"
      - "database/reference/research_enrichment_1650.qz64"
      - "CMakeLists.txt"
      - ".github/workflows/expert-engine-lab.yml"

permissions:
  contents: write

concurrency:
  group: expert-engine-lab
  cancel-in-progress: true

jobs:
  expert-selftest-windows:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout expert laboratory branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt 5.15.2 MinGW 32-bit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pip install aqtinstall
          & aqt install-qt windows desktop 5.15.2 win32_mingw81 -O C:\Qt
          if ($LASTEXITCODE -ne 0) { throw "Qt installation failed" }
          & aqt install-tool windows desktop tools_mingw qt.tools.win32_mingw810 -O C:\Qt
          if ($LASTEXITCODE -ne 0) { throw "MinGW installation failed" }
          "C:\Qt\Tools\mingw810_32\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Qt\5.15.2\mingw81_32\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure expert engine self-test
        run: cmake -S expert -B expert-build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/mingw81_32"

      - name: Build expert engine self-test
        run: cmake --build expert-build

      - name: Run expert engine self-test
        id: ctest
        continue-on-error: true
        run: ctest --test-dir expert-build --output-on-failure -V

      - name: Diagnose reference self-test exit
        if: steps.ctest.outcome != 'success'
        shell: pwsh
        run: |
          & .\expert-build\mems_expert_reference_selftest.exe
          $code = $LASTEXITCODE
          Write-Host "REFERENCE_SELFTEST_EXIT=$code"
          exit 0

      - name: Fail if expert tests failed
        if: steps.ctest.outcome != 'success'
        shell: bash
        run: exit 1

  ia-mems-app-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout IA MEMS source commit
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt 5.15.2, Charts and MinGW 32-bit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pip install aqtinstall
          & aqt install-qt windows desktop 5.15.2 win32_mingw81 -m qtcharts -O C:\Qt
          if ($LASTEXITCODE -ne 0) { throw "Qt installation failed" }
          & aqt install-tool windows desktop tools_mingw qt.tools.win32_mingw810 -O C:\Qt
          if ($LASTEXITCODE -ne 0) { throw "MinGW installation failed" }
          "C:\Qt\Tools\mingw810_32\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Qt\5.15.2\mingw81_32\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate librosco import library
        shell: pwsh
        run: |
          Set-Location prebuilt-librosco
          gendef librosco.dll
          if ($LASTEXITCODE -ne 0) { throw "gendef failed" }
          dlltool -d librosco.def -l librosco.dll.a
          if ($LASTEXITCODE -ne 0) { throw "dlltool failed" }

      - name: Configure main application
        shell: pwsh
        run: |
          cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DMEMS_RUN_REFERENCE_SELFTEST_POST_BUILD=OFF -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/mingw81_32;${{ github.workspace }}/prebuilt-librosco"
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }

      - name: Compile main application with IA MEMS
        shell: pwsh
        run: |
          cmake --build build --target ecu_mems_manager
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "build\ecu_mems_manager.exe")) {
            throw "IA MEMS application build failed"
          }
          Write-Host "IA_MEMS_APPLICATION_BUILD=OK"

  record-validation:
    if: always() && github.actor != 'github-actions[bot]'
    needs: [expert-selftest-windows, ia-mems-app-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record combined validation result
        shell: bash
        env:
          EXPERT_RESULT: ${{ needs.expert-selftest-windows.result }}
          APP_RESULT: ${{ needs.ia-mems-app-build.result }}
        run: |
          set -euo pipefail
          if [ "$EXPERT_RESULT" = "success" ] && [ "$APP_RESULT" = "success" ]; then
            status="OK"
          else
            status="FAILED"
          fi
          tmp=$(mktemp)
          printf 'IA MEMS laboratory validation: %s\nsource_commit=%s\nrun=%s\nexpert_selftest=%s\napplication_build=%s\n' \
            "$status" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$EXPERT_RESULT" "$APP_RESULT" > "$tmp"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin lab-expert-engine
          git checkout -B lab-expert-engine origin/lab-expert-engine
          cp "$tmp" expert/LAB_VALIDATION_STATUS.txt
          if [ "$status" = "OK" ]; then
            git rm -f --ignore-unmatch expert/SELFTEST_FAILED.txt
          fi
          git add -- expert/LAB_VALIDATION_STATUS.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record IA MEMS laboratory validation [skip ci]"
          git push origin HEAD:lab-expert-engine
