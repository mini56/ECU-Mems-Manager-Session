name: Record V2 routing and report failures

on:
  push:
    branches:
      - RAPPORT
    paths:
      - .github/workflows/report-v2-routing-failure-repair.yml

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout report branch
        uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0

      - name: Append incident record
        shell: bash
        run: |
          FILE=RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          if ! grep -q "INCIDENT ROUTAGE VISUEL V2 - RUN 33254169110" "$FILE"; then
            printf '%s\n' '' >> "$FILE"
            printf '%s\n' '## INCIDENT ROUTAGE VISUEL V2 - RUN 33254169110' >> "$FILE"
            printf '%s\n' '' >> "$FILE"
            printf '%s\n' 'Verdict : ECHEC DU GARDE AUTOMATIQUE, PAS DU COMPILATEUR NI DU LINKER.' >> "$FILE"
            printf '%s\n' '- Branche temporaire : tmp-rave-visual-backfill.' >> "$FILE"
            printf '%s\n' '- Commit teste : 2de3d17347be86fbfd0377bf1b21c6779169019e.' >> "$FILE"
            printf '%s\n' '- Run : 33254169110. Job : 99104882089.' >> "$FILE"
            printf '%s\n' '- Checkout, base officielle #101, patch visuel, audit mecanique RCL0193, Qt, CMake configure/generate, compilation et link du self-test : OK.' >> "$FILE"
            printf '%s\n' '- POST_BUILD self-test : ECHEC avec exactement 2 erreurs logiques.' >> "$FILE"
            printf '%s\n' '- Erreur 1 : la requete illustration injecteur IAC TPS Mini SPi Japon 1997 ne resout pas correctement RCL0194ENG:20.4.' >> "$FILE"
            printf '%s\n' '- Erreur 2 : schema Mini 1997 est ambigu et doit demander une clarification, mais V2 le laisse actuellement contourner cette clarification.' >> "$FILE"
            printf '%s\n' '- Message final : IaMemsDiagramCatalog self-test failed with 2 error(s).' >> "$FILE"
            printf '%s\n' '- Aucun fait mecanique, aucune image nouvelle et aucune modification de MEMSX64 ne sont issus de ce run.' >> "$FILE"
            printf '%s\n' '- Conclusion : distinguer suggestion valide et correspondance a haute confiance avant de contourner une clarification ; correction generale, pas codee pour deux phrases.' >> "$FILE"
            printf '%s\n' '' >> "$FILE"
            printf '%s\n' '## INCIDENT DE TRACABILITE DISTINCT - RUN 33254853871' >> "$FILE"
            printf '%s\n' '' >> "$FILE"
            printf '%s\n' '- Workflow report-routing-mechanical-workflow-failure.yml invalide en YAML ligne 25.' >> "$FILE"
            printf '%s\n' '- Aucun job demarre. Cet incident est distinct du run V2 33254169110 et ne le cause pas.' >> "$FILE"
            printf '%s\n' '' >> "$FILE"
            printf '%s\n' '## INCIDENT DE REPARATION DU RAPPORT - RUN 33256380157' >> "$FILE"
            printf '%s\n' '' >> "$FILE"
            printf '%s\n' '- Premier helper report-v2-routing-failure-repair.yml rejete avant job ; jobs vide.' >> "$FILE"
            printf '%s\n' '- Cause : texte Python multilignes sorti de indentation du bloc YAML run, donc workflow invalide avant execution.' >> "$FILE"
            printf '%s\n' '- Aucun contenu du rapport, code, base, image ou production modifie par cette tentative.' >> "$FILE"
            printf '%s\n' '- Reparation : helper minimal avec lignes printf, auto-suppression, puis relecture obligatoire du rapport.' >> "$FILE"
            printf '%s\n' '- Toute progression technique reste suspendue jusqu a verification du rapport.' >> "$FILE"
          fi

      - name: Remove temporary helper
        shell: bash
        run: rm -f .github/workflows/report-v2-routing-failure-repair.yml

      - name: Commit report repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md .github/workflows/report-v2-routing-failure-repair.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Record routing V2 and report failures"
          git push origin HEAD:RAPPORT
