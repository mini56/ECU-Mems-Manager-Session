name: TEMP REPORT AKM7169 TRANSPORT
on:
  push:
    branches: [RAPPORT]
    paths: ['.github/workflows/temp-report-akm7169-transport.yml']
permissions:
  contents: write
jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
      - name: Append checkpoint
        shell: bash
        run: |
          echo '' | base64 -d >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git commit -m 'Journal AKM7169 transport decision'
          git push
      - name: Remove helper
        shell: bash
        run: |
          git pull --rebase
          git rm .github/workflows/temp-report-akm7169-transport.yml
          git commit -m 'Remove temporary AKM7169 transport report helper'
          git push
