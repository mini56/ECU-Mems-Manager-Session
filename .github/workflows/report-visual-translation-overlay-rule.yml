name: REPORT VISUAL TRANSLATION OVERLAY RULE

on:
  push:
    branches: [RAPPORT]
    paths: ['.github/workflows/report-visual-translation-overlay-rule.yml']

permissions:
  contents: write

jobs:
  append-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Append permanent translation-overlay rule
        env:
          REPORT_APPEND_B64: ''
        run: |
          python - <<'PY'
          import os, base64
          with open('RAPPORT_SUIVI_ECU_MEMS_MANAGER.md','ab') as f:
              f.write(base64.b64decode(os.environ['REPORT_APPEND_B64'], validate=True))
          PY
      - name: Commit report and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/report-visual-translation-overlay-rule.yml
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git commit -m "Record permanent visual translation overlay rule"
          git pull --rebase origin RAPPORT
          git push origin HEAD:RAPPORT
