name: TEMP journal second RAVEMEMS visual transport incident

on:
  push:
    branches: [RAPPORT]
    paths: ['.github/workflows/tmp-journal-ravemems-visual-second-incident.yml']

permissions:
  contents: write

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 1
      - name: Append incident and self-delete
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '' '## 1 SEPTEMBRE 2026 — SECOND INCIDENT TRANSPORT VISUAL BUNDLE — AVANT CORRECTION' '- Le commit 965cd971712d0b60265a543233b4a8303c13976d a ajoute le workflow ravemems-visual-bundle-audit.yml mais le script tools/ravemems_visual_bundle_link.py est reste vide depuis le commit incident 71659779.' '- Tout run declenche sur 965cd971 ne doit pas etre considere comme validation du visual bundle.' '- Aucune base SQLite ni MEMSX64 n a ete modifiee.' '- PROCHAINE ACTION EXACTE : restaurer uniquement le contenu complet du script sur tmp-rave-new-extraction-pilot, puis utiliser le run declenche par ce commit de restauration comme premier test reel du bundle visuel.' >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          rm -f .github/workflows/tmp-journal-ravemems-visual-second-incident.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md .github/workflows/tmp-journal-ravemems-visual-second-incident.yml
          git commit -m 'Journal second RAVEMEMS visual transport incident'
          git push origin RAPPORT
