name: ECU MEMS Manager x64 BUILD 30
run-name: BUILD #30 - v1.0.30 - ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [MEMSX64]

concurrency:
  group: memsx64-build-30
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_x64:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      MEMS_BUILD: '30'
      MEMS_VERSION: '1.0.30'
      MEMS_BUILD_NUMBER: '30'
      LLAMA_RELEASE: 'b10516'
      LLAMA_COMMIT: 'b95502ba9aa0eb73a2f4fc8878d7fbe6a847a0b9'
      QWEN_SHA256: '9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031'

    steps:
      - name: Checkout exact BUILD 30 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0" pefile

      - name: Install Qt 5.15.2 MSVC 2019 x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          if (Test-Path 'C:\Qt') { Remove-Item 'C:\Qt' -Recurse -Force -ErrorAction SilentlyContinue }
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtcharts -O C:\Qt --external "$sevenZip"
          if ($LASTEXITCODE -ne 0) { throw "aqtinstall failed: $LASTEXITCODE" }
          $qtRoot = 'C:\Qt\5.15.2\msvc2019_64'
          if (-not (Test-Path "$qtRoot\lib\cmake\Qt5\Qt5Config.cmake")) { throw 'Qt x64 CMake configuration missing' }

      - name: Validate protocol guards before build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python librosco-x64/validate_protocol_guards.py

      - name: Configure ECU MEMS Manager x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build-x64 -A x64 `
            -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/msvc2019_64" `
            -DMEMS_USE_BUNDLED_LIBROSCO_X64=ON `
            -DMEMS_RUN_REFERENCE_SELFTEST_POST_BUILD=OFF
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed: $LASTEXITCODE" }

      - name: Build application uninstaller and self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build-x64 --config Release --target `
            ecu_mems_manager `
            ecu_mems_uninstaller `
            rosco_abi_selftest `
            ia_response_selftest `
            mems_search_selftest `
            expert_runtime_selftest
          if ($LASTEXITCODE -ne 0) { throw "MEMS x64 build failed: $LASTEXITCODE" }
          $required = @(
            'build-x64\Release\ecu_mems_manager.exe',
            'build-x64\Release\ecu_mems_uninstaller.exe',
            'build-x64\Release\ia_response_selftest.exe',
            'build-x64\Release\mems_search_selftest.exe',
            'build-x64\Release\expert_runtime_selftest.exe',
            'build-x64\librosco-x64\Release\mems_manager_x64.dll'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Required BUILD 30 output missing: $path" }
          }

      - name: Run deterministic IA response self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = 'C:\Qt\5.15.2\msvc2019_64'
          $env:PATH = "$qtRoot\bin;$env:PATH"
          & '${{ github.workspace }}\build-x64\Release\ia_response_selftest.exe'
          if ($LASTEXITCODE -ne 0) { throw "IA response self-test failed: $LASTEXITCODE" }

      - name: Run protocol ABI self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ctest --test-dir build-x64/librosco-x64 -C Release --output-on-failure -R rosco_abi_selftest
          if ($LASTEXITCODE -ne 0) { throw "Protocol ABI self-test failed: $LASTEXITCODE" }

      - name: Run reference database semantic self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = 'C:\Qt\5.15.2\msvc2019_64'
          $env:PATH = "$qtRoot\bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "$qtRoot\plugins"
          & '${{ github.workspace }}\build-x64\Release\mems_search_selftest.exe'
          if ($LASTEXITCODE -ne 0) { throw "MEMS reference semantic self-test failed: $LASTEXITCODE" }

      - name: Generate and validate packaged expert database r20
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = 'C:\Qt\5.15.2\msvc2019_64'
          $releaseRoot = '${{ github.workspace }}\build-x64\Release'
          $referenceSource = '${{ github.workspace }}\database\reference'
          $referenceRuntime = Join-Path $releaseRoot 'database\reference'
          $expertRuntime = Join-Path $releaseRoot 'database\expert'
          $cacheRoot = '${{ github.workspace }}\expert-runtime-cache'

          if (-not (Test-Path (Join-Path $referenceSource 'manifest.json'))) {
            throw 'database/reference/manifest.json missing from source checkout'
          }
          if (Test-Path $referenceRuntime) { Remove-Item $referenceRuntime -Recurse -Force }
          New-Item -ItemType Directory -Path (Split-Path $referenceRuntime -Parent) -Force | Out-Null
          Copy-Item $referenceSource $referenceRuntime -Recurse -Force
          if (Test-Path $expertRuntime) { Remove-Item $expertRuntime -Recurse -Force }
          if (Test-Path $cacheRoot) { Remove-Item $cacheRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $cacheRoot -Force | Out-Null

          $env:PATH = "$qtRoot\bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "$qtRoot\plugins"
          $savedLocalAppData = $env:LOCALAPPDATA
          $savedAppData = $env:APPDATA
          $generatorOutput = @()
          try {
            $env:LOCALAPPDATA = $cacheRoot
            $env:APPDATA = $cacheRoot
            & (Join-Path $releaseRoot 'expert_runtime_selftest.exe') 2>&1 | Tee-Object -Variable generatorOutput
            $generatorExitCode = $LASTEXITCODE
            if ($generatorExitCode -ne 0) { throw "Expert runtime database generator failed: $generatorExitCode" }
          }
          finally {
            $env:LOCALAPPDATA = $savedLocalAppData
            $env:APPDATA = $savedAppData
          }

          $databaseLine = $generatorOutput | ForEach-Object { [string]$_ } | Where-Object { $_ -like 'EXPERT_RUNTIME_DATABASE=*' } | Select-Object -Last 1
          if (-not $databaseLine) { throw 'Expert runtime generator did not report EXPERT_RUNTIME_DATABASE' }
          $expertDbPath = $databaseLine.Substring('EXPERT_RUNTIME_DATABASE='.Length).Trim()
          if (-not (Test-Path -LiteralPath $expertDbPath -PathType Leaf)) {
            throw "Generated ia_mems_reference_r20.sqlite not found at reported path: $expertDbPath"
          }
          $expertDb = Get-Item -LiteralPath $expertDbPath
          if ($expertDb.Length -le 0) { throw 'Generated expert database is empty' }
          "AI_EXPERT_DB=$($expertDb.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $env:EXPERT_DB = $expertDb.FullName
          @'
          import os, sqlite3
          path=os.environ['EXPERT_DB']
          db=sqlite3.connect(path)
          try:
              integrity=db.execute('PRAGMA integrity_check').fetchone()[0]
              revision=db.execute('PRAGMA user_version').fetchone()[0]
              tables=db.execute("SELECT COUNT(*) FROM sqlite_master WHERE type='table'").fetchone()[0]
          finally:
              db.close()
          if integrity.lower() != 'ok': raise SystemExit('SQLite integrity_check failed: '+str(integrity))
          if revision != 20: raise SystemExit(f'Expert DB revision mismatch: {revision}')
          if tables <= 0: raise SystemExit('Expert DB contains no tables')
          print(f'PASS expert SQLite r{revision}: tables={tables}')
          '@ | python -

      - name: Build conservative static llama.cpp b10516 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = '${{ github.workspace }}\llama-b10516-src'
          $build = '${{ github.workspace }}\llama-b10516-build'
          if (Test-Path $src) { Remove-Item $src -Recurse -Force }
          if (Test-Path $build) { Remove-Item $build -Recurse -Force }

          git clone --depth 1 --branch $env:LLAMA_RELEASE https://github.com/ggml-org/llama.cpp.git $src
          if ($LASTEXITCODE -ne 0) { throw "llama.cpp clone failed: $LASTEXITCODE" }
          $actualCommit = (git -C $src rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actualCommit -ne $env:LLAMA_COMMIT.ToLowerInvariant()) { throw "llama.cpp commit mismatch: $actualCommit" }

          cmake -S $src -B $build -A x64 `
            -DBUILD_SHARED_LIBS=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DGGML_NATIVE=OFF `
            -DGGML_BACKEND_DL=OFF `
            -DGGML_CPU_ALL_VARIANTS=OFF `
            -DGGML_OPENMP=OFF `
            -DGGML_RPC=OFF `
            -DGGML_SSE42=OFF `
            -DGGML_AVX=OFF `
            -DGGML_AVX2=OFF `
            -DGGML_AVX_VNNI=OFF `
            -DGGML_BMI2=OFF `
            -DGGML_AVX512=OFF `
            -DGGML_AVX512_VBMI=OFF `
            -DGGML_AVX512_VNNI=OFF `
            -DGGML_AVX512_BF16=OFF `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_BUILD_EXAMPLES=OFF `
            -DLLAMA_BUILD_TESTS=OFF `
            -DLLAMA_BUILD_TOOLS=ON `
            -DLLAMA_BUILD_APP=OFF `
            -DLLAMA_OPENSSL=OFF
          if ($LASTEXITCODE -ne 0) { throw "llama.cpp configure failed: $LASTEXITCODE" }

          cmake --build $build --config Release --target llama-server --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "llama-server build failed: $LASTEXITCODE" }

          $server = Get-ChildItem $build -Recurse -File -Filter 'llama-server.exe' | Where-Object { $_.FullName -match '\\Release\\' } | Select-Object -First 1
          if (-not $server) { $server = Get-ChildItem $build -Recurse -File -Filter 'llama-server.exe' | Select-Object -First 1 }
          if (-not $server) { throw 'llama-server.exe missing after build' }

          $cache = Get-Content (Join-Path $build 'CMakeCache.txt') -Raw
          foreach ($required in @(
            'BUILD_SHARED_LIBS:BOOL=OFF',
            'GGML_NATIVE:BOOL=OFF',
            'GGML_BACKEND_DL:BOOL=OFF',
            'GGML_CPU_ALL_VARIANTS:BOOL=OFF',
            'GGML_OPENMP:BOOL=OFF',
            'GGML_SSE42:BOOL=OFF',
            'GGML_AVX:BOOL=OFF',
            'GGML_AVX2:BOOL=OFF',
            'GGML_BMI2:BOOL=OFF',
            'LLAMA_OPENSSL:BOOL=OFF')) {
              if (-not $cache.Contains($required)) { throw "Required llama build flag missing: $required" }
          }

          & $server.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "llama-server --version failed: $LASTEXITCODE" }
          "AI_SERVER=$($server.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download and verify Qwen3-0.6B-Q8_0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = '${{ github.workspace }}\ai-model-stage'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $modelPath = Join-Path $stage 'ia-mems.gguf'
          $modelUrl = 'https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf?download=true'
          & curl.exe -L --fail --retry 3 --retry-delay 3 -o $modelPath $modelUrl
          if ($LASTEXITCODE -ne 0) { throw "Qwen model download failed: $LASTEXITCODE" }
          $actual = (Get-FileHash $modelPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:QWEN_SHA256.ToLowerInvariant()) { throw "Qwen SHA256 mismatch: $actual" }
          "AI_MODEL=$modelPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Assemble BUILD 30 portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = 'C:\Qt\5.15.2\msvc2019_64'
          $releaseRoot = '${{ github.workspace }}\build-x64\Release'
          $dist = '${{ github.workspace }}\dist-x64'
          if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          Copy-Item (Join-Path $releaseRoot 'ecu_mems_manager.exe') (Join-Path $dist 'ecu_mems_manager.exe') -Force
          Copy-Item (Join-Path $releaseRoot 'ecu_mems_uninstaller.exe') (Join-Path $dist 'ecu_mems_uninstaller.exe') -Force
          Copy-Item '${{ github.workspace }}\build-x64\librosco-x64\Release\mems_manager_x64.dll' (Join-Path $dist 'mems_manager_x64.dll') -Force

          & "$qtRoot\bin\windeployqt.exe" --release --compiler-runtime --no-translations --dir $dist (Join-Path $dist 'ecu_mems_manager.exe')
          if ($LASTEXITCODE -ne 0) { throw "windeployqt application failed: $LASTEXITCODE" }
          & "$qtRoot\bin\windeployqt.exe" --release --compiler-runtime --no-translations --dir $dist (Join-Path $dist 'ecu_mems_uninstaller.exe')
          if ($LASTEXITCODE -ne 0) { throw "windeployqt uninstaller failed: $LASTEXITCODE" }

          if (Test-Path (Join-Path $releaseRoot 'translations')) {
            Copy-Item (Join-Path $releaseRoot 'translations') (Join-Path $dist 'translations') -Recurse -Force
          }
          if (Test-Path (Join-Path $releaseRoot 'database')) {
            Copy-Item (Join-Path $releaseRoot 'database') (Join-Path $dist 'database') -Recurse -Force
          }

          $expertDir = Join-Path $dist 'database\expert'
          New-Item -ItemType Directory -Path $expertDir -Force | Out-Null
          Copy-Item $env:AI_EXPERT_DB (Join-Path $expertDir 'ia_mems_reference_r20.sqlite') -Force

          $aiDir = Join-Path $dist 'ai'
          $aiModels = Join-Path $aiDir 'models'
          New-Item -ItemType Directory -Path $aiModels -Force | Out-Null
          Copy-Item $env:AI_SERVER (Join-Path $aiDir 'llama-server.exe') -Force
          Copy-Item $env:AI_MODEL (Join-Path $aiModels 'ia-mems.gguf') -Force
          Copy-Item '${{ github.workspace }}\llama-b10516-src\LICENSE' (Join-Path $aiDir 'LLAMA_CPP_LICENSE.txt') -Force
          if (Test-Path '${{ github.workspace }}\LICENSE') { Copy-Item '${{ github.workspace }}\LICENSE' (Join-Path $dist 'LICENSE.txt') -Force }

          @'
          {
            "schema_version": 2,
            "build": 30,
            "version": "1.0.30",
            "mode": "offline_local_only",
            "listen_address": "127.0.0.1",
            "runtime": {
              "name": "llama.cpp",
              "release": "b10516",
              "source_commit": "b95502ba9aa0eb73a2f4fc8878d7fbe6a847a0b9",
              "profile": "static conservative x64; no OpenSSL; no OpenMP; no dynamic ggml backends; AVX/AVX2/BMI2 disabled"
            },
            "model": {
              "name": "Qwen3-0.6B-Q8_0",
              "runtime_filename": "models/ia-mems.gguf",
              "sha256": "9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031"
            },
            "expert_database": {
              "filename": "../database/expert/ia_mems_reference_r20.sqlite",
              "revision": 20,
              "runtime_mode": "read_only_prebuilt"
            }
          }
          '@ | Set-Content (Join-Path $aiDir 'runtime_manifest.json') -Encoding UTF8

          @(
            'ECU MEMS Manager BUILD #30 / v1.0.30',
            'IA locale: Qwen3-0.6B-Q8_0 + llama.cpp b10516',
            'Runtime x64 statique conservateur validé, LLAMA_OPENSSL=OFF',
            'Base experte r20 préconstruite par CI et emballée sous database/expert',
            'Le désinstalleur ecu_mems_uninstaller.exe est inclus.',
            'Le profil utilisateur est conservé par défaut pendant la désinstallation.'
          ) | Set-Content (Join-Path $dist 'README_BUILD30.txt') -Encoding UTF8

          $manifestPath = Join-Path $dist 'install_manifest.txt'
          $files = Get-ChildItem $dist -Recurse -File | ForEach-Object {
            $_.FullName.Substring($dist.Length + 1).Replace('\','/')
          } | Sort-Object -Unique
          $files += 'install_manifest.txt'
          $files | Sort-Object -Unique | Set-Content $manifestPath -Encoding UTF8

          "DIST=$dist" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate BUILD 30 package architecture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DIST_ROOT = $env:DIST
          @'
          import os, sqlite3
          from pathlib import Path
          import pefile

          root=Path(os.environ['DIST_ROOT'])
          required=[
              root/'ecu_mems_manager.exe',
              root/'ecu_mems_uninstaller.exe',
              root/'mems_manager_x64.dll',
              root/'sqldrivers'/'qsqlite.dll',
              root/'ai'/'llama-server.exe',
              root/'ai'/'models'/'ia-mems.gguf',
              root/'ai'/'runtime_manifest.json',
              root/'database'/'reference'/'manifest.json',
              root/'database'/'expert'/'ia_mems_reference_r20.sqlite',
              root/'install_manifest.txt',
          ]
          missing=[str(p.relative_to(root)) for p in required if not p.exists()]
          if missing: raise SystemExit('Missing BUILD 30 package files: '+', '.join(missing))

          for name in ('ecu_mems_manager.exe','ecu_mems_uninstaller.exe','mems_manager_x64.dll','ai/llama-server.exe'):
              pe=pefile.PE(str(root/name))
              if pe.FILE_HEADER.Machine != 0x8664:
                  raise SystemExit(f'{name} is not AMD64: 0x{pe.FILE_HEADER.Machine:04X}')

          server=pefile.PE(str(root/'ai'/'llama-server.exe'))
          imports=[]
          for entry in getattr(server, 'DIRECTORY_ENTRY_IMPORT', []):
              imports.append(entry.dll.decode(errors='replace').lower())
          forbidden=[dll for dll in imports if dll.startswith('ggml-') or 'libomp' in dll or dll.startswith('libssl') or dll.startswith('libcrypto')]
          if forbidden: raise SystemExit('Unexpected llama runtime dependencies: '+', '.join(forbidden))

          expert=root/'database'/'expert'/'ia_mems_reference_r20.sqlite'
          db=sqlite3.connect(str(expert))
          try:
              integrity=db.execute('PRAGMA integrity_check').fetchone()[0]
              revision=db.execute('PRAGMA user_version').fetchone()[0]
              tables=db.execute("SELECT COUNT(*) FROM sqlite_master WHERE type='table'").fetchone()[0]
          finally:
              db.close()
          if str(integrity).lower() != 'ok' or revision != 20 or tables <= 0:
              raise SystemExit(f'Invalid packaged expert DB: integrity={integrity} revision={revision} tables={tables}')

          manifest=(root/'install_manifest.txt').read_text(encoding='utf-8-sig').splitlines()
          normalized={line.strip().replace('\\','/') for line in manifest if line.strip()}
          required_manifest={
              'ecu_mems_manager.exe','ecu_mems_uninstaller.exe','mems_manager_x64.dll',
              'ai/llama-server.exe','ai/models/ia-mems.gguf',
              'database/expert/ia_mems_reference_r20.sqlite','install_manifest.txt'
          }
          absent=sorted(required_manifest-normalized)
          if absent: raise SystemExit('install_manifest missing: '+', '.join(absent))
          print(f'PASS BUILD 30 package: expert r{revision}, tables={tables}, manifest files={len(normalized)}')
          '@ | python -

      - name: Validate packaged llama server model and API
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $server = Join-Path $env:DIST 'ai\llama-server.exe'
          $model = Join-Path $env:DIST 'ai\models\ia-mems.gguf'
          & $server --version
          if ($LASTEXITCODE -ne 0) { throw "Packaged llama-server --version failed: $LASTEXITCODE" }

          $arguments = @('-m', $model, '--alias', 'ia-mems', '--host', '127.0.0.1', '--port', '18089', '-c', '4096', '-np', '1', '--no-webui', '--offline', '--reasoning', 'off')
          $process = Start-Process -FilePath $server -ArgumentList $arguments -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 180; $i++) {
              Start-Sleep -Milliseconds 500
              if ($process.HasExited) { throw "llama-server exited during Qwen load: $($process.ExitCode)" }
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:18089/health' -TimeoutSec 2
                if ($health.status -eq 'ok') { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) { throw 'llama-server did not become ready' }

            $models = Invoke-RestMethod -Uri 'http://127.0.0.1:18089/v1/models' -TimeoutSec 10
            $ids = @($models.data | ForEach-Object { $_.id })
            if ($ids -notcontains 'ia-mems') { throw "Unexpected /v1/models response: $($ids -join ', ')" }

            $payload = @{
              model = 'ia-mems'
              messages = @(@{ role = 'user'; content = 'Reponds uniquement: OK' })
              stream = $false
              max_tokens = 24
              temperature = 0.2
            } | ConvertTo-Json -Depth 8
            $reply = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:18089/v1/chat/completions' -ContentType 'application/json' -Body $payload -TimeoutSec 60
            $text = [string]$reply.choices[0].message.content
            if ([string]::IsNullOrWhiteSpace($text)) { throw 'Empty chat completion from packaged Qwen' }
            Write-Host "PASS packaged IA API: $text"
          }
          finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              $process.WaitForExit()
            }
          }

      - name: Smoke launch ECU MEMS Manager
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:DIST 'ecu_mems_manager.exe'
          $process = Start-Process -FilePath $exe -WorkingDirectory $env:DIST -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "ECU MEMS Manager exited during smoke launch: $($process.ExitCode)" }
          $null = $process.CloseMainWindow()
          if (-not $process.WaitForExit(5000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
          Write-Host 'PASS ECU MEMS Manager BUILD 30 smoke launch'

      - name: Generate BUILD 30 file hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = @(
            'ecu_mems_manager.exe',
            'ecu_mems_uninstaller.exe',
            'mems_manager_x64.dll',
            'ai\llama-server.exe',
            'ai\models\ia-mems.gguf',
            'database\expert\ia_mems_reference_r20.sqlite'
          )
          $lines = foreach ($relative in $targets) {
            $full = Join-Path $env:DIST $relative
            $hash = (Get-FileHash $full -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($relative.Replace('\','/'))"
          }
          $lines | Set-Content (Join-Path $env:DIST 'BUILD30_SHA256.txt') -Encoding UTF8
          Add-Content (Join-Path $env:DIST 'install_manifest.txt') 'BUILD30_SHA256.txt' -Encoding UTF8

      - name: Upload ECU MEMS Manager BUILD 30
        uses: actions/upload-artifact@v4
        with:
          name: ECU-MEMS-Manager-x64-BUILD-30-v1.0.30
          path: dist-x64/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
