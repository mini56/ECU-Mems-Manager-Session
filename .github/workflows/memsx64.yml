name: ECU MEMS Manager x64
run-name: BUILD #29 - v1.0.29 - ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [MEMSX64]
    paths:
      - '.github/workflows/memsx64.yml'
      - 'CMakeLists.txt'
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.ui'
      - '**/*.qrc'
      - 'database/**'
      - 'librosco-x64/**'
      - 'translations/**'
      - 'ai/**'

concurrency:
  group: memsx64-build-29
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_x64:
    runs-on: windows-latest
    env:
      MEMS_BUILD: '29'
      MEMS_VERSION: '1.0.29'
      MEMS_BUILD_NUMBER: '29'

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build validation tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0" pefile

      - name: Install Qt 5.15.2 MSVC 2019 x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          Write-Host "7-Zip extraction backend: $sevenZip"
          if (Test-Path 'C:\Qt') { Remove-Item 'C:\Qt' -Recurse -Force -ErrorAction SilentlyContinue }
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtcharts -O C:\Qt --external "$sevenZip"
          if ($LASTEXITCODE -ne 0) { throw "aqtinstall failed: $LASTEXITCODE" }
          $qtRoot = 'C:\Qt\5.15.2\msvc2019_64'
          if (-not (Test-Path "$qtRoot\lib\cmake\Qt5\Qt5Config.cmake")) { throw 'Qt x64 CMake configuration missing' }
          if (-not (Test-Path "$qtRoot\plugins\sqldrivers\qsqlite.dll")) { throw 'Qt QSQLITE x64 plugin missing' }
          if (-not (Test-Path "$qtRoot\bin\Qt5SerialPort.dll")) { throw 'Qt SerialPort x64 runtime missing' }

      - name: Validate navigation BUILD 28 and BUILD 29 IA regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          nav=Path('navigationorderpatch.cpp').read_text(encoding='utf-8')
          cmake=Path('CMakeLists.txt').read_text(encoding='utf-8')
          wrapper=Path('iamemstab_clean.cpp').read_text(encoding='utf-8')
          visual=Path('visualcompletion.cpp').read_text(encoding='utf-8')
          dispatch=Path('memsinterface_dispatch.cpp').read_text(encoding='utf-8')
          local_ai=Path('expert/LocalAiClient.cpp').read_text(encoding='utf-8')
          ia_logic=Path('expert/IaResponseLogic.h').read_text(encoding='utf-8')
          ia_test=Path('expert/IaResponseLogicTest.cpp').read_text(encoding='utf-8')
          context_patch=Path('iaresponsecontextpatch.cpp').read_text(encoding='utf-8')
          manifest=Path('ai/runtime_manifest.json').read_text(encoding='utf-8')
          required=['overview_tab','injection_tab','emission_tab','actuators','errors','DiagnosticPanel','ia_mems_tab','AnalysisTab','SummaryTab','ecu_rosco_tab','raw','database_tab','ECU','mems19_test_tab']
          missing=[x for x in required if x not in nav]
          if missing: raise SystemExit('Missing deterministic tab identities: '+', '.join(missing))
          if 'kFinalTabCount = 14' not in nav: raise SystemExit('Navigation is not fixed to 14 tabs')
          if 'rankFromTitle' in nav or 'QTimer' in nav or 'singleShot' in nav: raise SystemExit('Legacy translated-title/timer navigation remains active')
          if 'taborderpatch.cpp' in cmake: raise SystemExit('Legacy taborderpatch.cpp is still compiled')
          if 'iamemstab_clean.cpp' not in cmake: raise SystemExit('IA MEMS clean wrapper is not compiled')
          if '#define Q_COREAPP_STARTUP_FUNCTION(AFUNC)' not in wrapper: raise SystemExit('IA legacy startup navigation hook is not suppressed')
          if 'nav->viewport()->height()' not in visual or 'Qt::ScrollBarAlwaysOff' not in visual:
              raise SystemExit('BUILD 28 sidebar is not fitted from the real window viewport')
          if '(raw7d1415-32768)-hotIdleCorrection' not in visual:
              raise SystemExit('BUILD 28 hot-idle sign correction is missing')
          if 'disconnect-requested' not in dispatch or 'm_disconnectRequested.loadAcquire()!=0' not in dispatch:
              raise SystemExit('BUILD 28 disconnect cancellation guard is missing')
          if 'I18n::language()' not in local_ai:
              raise SystemExit('BUILD 29 local IA is not bound to the active MEMS Manager language')
          for token in ['fr','en','es','it','pt','de']:
              if f'QStringLiteral("{token}")' not in local_ai:
                  raise SystemExit('Missing local IA language: '+token)
          for phrase in ['TENSION DE LA BATTERIE?','ETAT MOTEUR?','DIAGNOSTIQUE?','QUE PEUX-TU ME DIRE SUR LES CAPTURES?']:
              if phrase not in ia_test:
                  raise SystemExit('Missing IA regression phrase: '+phrase)
          if 'noteMeasurementTimestamp' not in ia_logic or 'noteMeasurementTimestamp' not in context_patch:
              raise SystemExit('BUILD 29 last ECU measurement timestamp tracking missing')
          if 'iaresponsecontextpatch.cpp' not in cmake or 'IaResponseLogicTest.cpp' not in cmake:
              raise SystemExit('BUILD 29 IA response code/self-test is not compiled')
          if 'Qwen3-0.6B-Q8_0' not in manifest or 'b10516' not in manifest:
              raise SystemExit('Pinned BUILD 29 local IA manifest mismatch')
          print('PASS navigation 14/14 + BUILD 28 guards + BUILD 29 IA static guards')
          '@ | python -

      - name: Validate historical MEMS protocol guards
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python librosco-x64/validate_protocol_guards.py

      - name: Configure full native x64 application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build-x64 -A x64 `
            -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/msvc2019_64" `
            -DMEMS_USE_BUNDLED_LIBROSCO_X64=ON `
            -DMEMS_RUN_REFERENCE_SELFTEST_POST_BUILD=OFF

      - name: Controls 01-02 - compile application and native protocol DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build-x64 --config Release --target ecu_mems_manager rosco_abi_selftest
          if (-not (Test-Path 'build-x64\Release\ecu_mems_manager.exe')) { throw 'ecu_mems_manager.exe missing' }
          if (-not (Test-Path 'build-x64\librosco-x64\Release\mems_manager_x64.dll')) { throw 'mems_manager_x64.dll missing' }

      - name: Control IA response self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = 'C:\Qt\5.15.2\msvc2019_64'
          $env:PATH = "$qtRoot\bin;$env:PATH"
          $selftest = '${{ github.workspace }}\build-x64\Release\ia_response_selftest.exe'
          if (-not (Test-Path $selftest)) { throw 'ia_response_selftest.exe missing' }
          & $selftest
          if ($LASTEXITCODE -ne 0) { throw "IA response self-test failed: $LASTEXITCODE" }

      - name: Control 11 - protocol ABI self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ctest --test-dir build-x64/librosco-x64 -C Release --output-on-failure -R rosco_abi_selftest

      - name: Control 14A - MEMS reference SQLite semantic self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = 'C:\Qt\5.15.2\msvc2019_64'
          $env:PATH = "$qtRoot\bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "$qtRoot\plugins"
          $selftest = '${{ github.workspace }}\build-x64\Release\mems_search_selftest.exe'
          $reference = '${{ github.workspace }}\build-x64\Release\database\reference\manifest.json'
          if (-not (Test-Path $selftest)) { throw 'mems_search_selftest.exe missing' }
          if (-not (Test-Path $reference)) { throw 'MEMS reference resources missing beside self-test' }
          & $selftest
          if ($LASTEXITCODE -ne 0) { throw "MEMS reference semantic self-test failed: $LASTEXITCODE" }

      - name: Download and verify local IA runtime and model
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = '${{ github.workspace }}\ai-stage'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null

          $runtimeUrl = 'https://github.com/ggml-org/llama.cpp/releases/download/b10516/llama-b10516-bin-win-cpu-x64.zip'
          $runtimeSha = 'fbbbc55e0eb2e1b07f9dcb9488616c98ed47d9003b90e15e7c8c7812c4307cd3'
          $runtimeZip = Join-Path $stage 'llama-b10516-bin-win-cpu-x64.zip'
          & curl.exe -L --fail --retry 3 --retry-delay 2 -o $runtimeZip $runtimeUrl
          if ($LASTEXITCODE -ne 0) { throw "llama.cpp runtime download failed: $LASTEXITCODE" }
          $runtimeActual = (Get-FileHash $runtimeZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($runtimeActual -ne $runtimeSha) { throw "llama.cpp SHA256 mismatch: $runtimeActual" }

          $runtimeExtract = Join-Path $stage 'runtime'
          Expand-Archive -Path $runtimeZip -DestinationPath $runtimeExtract -Force
          $server = Get-ChildItem $runtimeExtract -Recurse -File -Filter 'llama-server.exe' | Select-Object -First 1
          if (-not $server) { throw 'llama-server.exe missing from verified runtime archive' }
          $safeCpu = Get-ChildItem $server.Directory.FullName -File -Filter 'ggml-cpu-x64.dll' | Select-Object -First 1
          if (-not $safeCpu) { throw 'Generic llama.cpp CPU backend ggml-cpu-x64.dll missing from verified runtime archive' }

          $modelUrl = 'https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf?download=true'
          $modelSha = '9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031'
          $modelPath = Join-Path $stage 'ia-mems.gguf'
          & curl.exe -L --fail --retry 3 --retry-delay 3 -o $modelPath $modelUrl
          if ($LASTEXITCODE -ne 0) { throw "Qwen model download failed: $LASTEXITCODE" }
          $modelActual = (Get-FileHash $modelPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($modelActual -ne $modelSha) { throw "Qwen model SHA256 mismatch: $modelActual" }

          "AI_RUNTIME_DIR=$($server.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AI_MODEL_PATH=$modelPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PASS verified llama.cpp b10516 CPU x64 + generic ggml-cpu-x64 backend + Qwen3-0.6B-Q8_0"

      - name: Assemble full portable x64 package with local IA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = 'C:\Qt\5.15.2\msvc2019_64'
          $build = '${{ github.workspace }}\build-x64'
          $dist = '${{ github.workspace }}\dist-x64'
          if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
          New-Item -ItemType Directory -Path $dist | Out-Null
          Copy-Item "$build\Release\ecu_mems_manager.exe" "$dist\ecu_mems_manager.exe" -Force
          Copy-Item "$build\librosco-x64\Release\mems_manager_x64.dll" "$dist\mems_manager_x64.dll" -Force
          & "$qtRoot\bin\windeployqt.exe" --release --compiler-runtime --no-translations --dir $dist "$dist\ecu_mems_manager.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed: $LASTEXITCODE" }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe missing: $vswhere" }
          $vsRoot = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1).Trim()
          if (-not $vsRoot) { throw 'Visual Studio C++ toolchain installation not found' }
          $redistRoot = Join-Path $vsRoot 'VC\Redist\MSVC'
          $crtDir = Get-ChildItem $redistRoot -Directory -ErrorAction Stop |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64\Microsoft.VC143.CRT' } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $crtDir) { throw "Microsoft.VC143.CRT x64 redistributable directory not found below $redistRoot" }
          Write-Host "Deploying MSVC x64 runtime from: $crtDir"
          Copy-Item (Join-Path $crtDir '*.dll') $dist -Force
          foreach ($runtimeDll in @('MSVCP140.dll','VCRUNTIME140.dll','VCRUNTIME140_1.dll')) {
            if (-not (Test-Path (Join-Path $dist $runtimeDll))) { throw "Required MSVC x64 runtime missing from package: $runtimeDll" }
          }

          Copy-Item "$build\Release\translations" "$dist\translations" -Recurse -Force
          Copy-Item "$build\Release\database" "$dist\database" -Recurse -Force

          $aiDir = Join-Path $dist 'ai'
          $aiModels = Join-Path $aiDir 'models'
          New-Item -ItemType Directory -Path $aiModels -Force | Out-Null
          Copy-Item '${{ github.workspace }}\ai\*' $aiDir -Recurse -Force
          Copy-Item "$env:AI_RUNTIME_DIR\*" $aiDir -Recurse -Force
          $safeCpu = Join-Path $aiDir 'ggml-cpu-x64.dll'
          if (-not (Test-Path $safeCpu)) { throw 'Packaged generic llama.cpp CPU backend ggml-cpu-x64.dll missing' }
          Get-ChildItem $aiDir -File -Filter 'ggml-cpu-*.dll' |
            Where-Object { $_.Name -ine 'ggml-cpu-x64.dll' } |
            Remove-Item -Force
          $cpuBackends = @(Get-ChildItem $aiDir -File -Filter 'ggml-cpu-*.dll')
          if ($cpuBackends.Count -ne 1 -or $cpuBackends[0].Name -ine 'ggml-cpu-x64.dll') {
            throw "Unsafe llama.cpp optimized CPU backend remains in package: $($cpuBackends.Name -join ', ')"
          }
          Copy-Item $env:AI_MODEL_PATH (Join-Path $aiModels 'ia-mems.gguf') -Force
          if (-not (Test-Path (Join-Path $aiDir 'llama-server.exe'))) { throw 'Packaged llama-server.exe missing' }
          if (-not (Test-Path (Join-Path $aiModels 'ia-mems.gguf'))) { throw 'Packaged Qwen model missing' }

          $forbidden = Get-ChildItem $dist -Recurse -File | Where-Object { $_.Name -ieq 'librosco.dll' }
          if ($forbidden) { throw "Historical x86 runtime found: $($forbidden.FullName -join ', ')" }
          @(
            'ECU MEMS MANAGER - NATIVE X64 VALIDATION BUILD',
            'BUILD #29 - v1.0.29',
            'Full MEMS Manager application compiled native x64',
            'Protocol DLL: mems_manager_x64.dll native x64',
            'MSVC x64 runtime deployed locally with application',
            '14-tab application retained',
            'Local IA INCLUDED: llama.cpp b10516 Windows CPU x64 with generic ggml-cpu-x64 backend only',
            'Local model INCLUDED: Qwen3-0.6B-Q8_0 as ai/models/ia-mems.gguf',
            'IA languages: fr, en, es, it, pt, de',
            'Historical 32-bit librosco.dll intentionally absent'
          ) | Set-Content "$dist\README_X64.txt" -Encoding UTF8

      - name: Controls 03-10 and 15 - PE architecture imports exports inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DIST = '${{ github.workspace }}\dist-x64'
          @'
          import os
          from pathlib import Path
          import pefile
          root=Path(os.environ['DIST']); app=root/'ecu_mems_manager.exe'; dll=root/'mems_manager_x64.dll'
          required=[app,dll,root/'Qt5Core.dll',root/'Qt5Gui.dll',root/'Qt5Widgets.dll',root/'Qt5Sql.dll',root/'Qt5SerialPort.dll',root/'MSVCP140.dll',root/'VCRUNTIME140.dll',root/'VCRUNTIME140_1.dll',root/'platforms'/'qwindows.dll',root/'sqldrivers'/'qsqlite.dll',root/'ai'/'llama-server.exe',root/'ai'/'ggml-cpu-x64.dll']
          missing=[str(p.relative_to(root)) for p in required if not p.exists() or p.stat().st_size<=0]
          if missing: raise SystemExit('Missing x64 package binaries: '+', '.join(missing))
          def load(p): return pefile.PE(str(p),fast_load=False)
          app_pe,dll_pe=load(app),load(dll)
          for p,obj in ((app,app_pe),(dll,dll_pe)):
              if obj.FILE_HEADER.Machine!=0x8664 or obj.OPTIONAL_HEADER.Magic!=0x20B: raise SystemExit(f'{p.name} is not PE32+ AMD64')
          imports=[e.dll.decode('ascii',errors='replace').lower() for e in app_pe.DIRECTORY_ENTRY_IMPORT]
          if 'mems_manager_x64.dll' not in imports: raise SystemExit('Application does not import mems_manager_x64.dll')
          if 'librosco.dll' in imports: raise SystemExit('Application still imports historical librosco.dll')
          expected={'mems_cleanup','mems_clear_faults','mems_connect','mems_disconnect','mems_get_lib_version','mems_heartbeat','mems_init','mems_init_link','mems_is_connected','mems_lock','mems_move_iac','mems_openserial','mems_read','mems_read_iac_position','mems_read_raw','mems_read_serial','mems_reset_ECU','mems_reset_adjustments','mems_send_command','mems_test_actuator','mems_unlock','mems_write_serial'}
          actual={s.name.decode('ascii') for s in dll_pe.DIRECTORY_ENTRY_EXPORT.symbols if s.name}
          if actual!=expected: raise SystemExit('Protocol DLL exports mismatch: '+repr(sorted(actual)))
          wrong=[]; inventory=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file() or p.suffix.lower() not in {'.exe','.dll'}: continue
              try: obj=load(p)
              except pefile.PEFormatError: continue
              inventory.append(f'{p.relative_to(root)} | machine=0x{obj.FILE_HEADER.Machine:04X}')
              if obj.FILE_HEADER.Machine!=0x8664: wrong.append(str(p.relative_to(root)))
          if wrong: raise SystemExit('x86/x64 mixture detected: '+', '.join(wrong))
          (root/'PE_X64_INVENTORY.txt').write_text('\n'.join(inventory)+'\n',encoding='utf-8')
          print(f'PASS {len(inventory)} PE files AMD64; 22 protocol exports exact')
          '@ | python -

      - name: Control 14B - packaged SQLite IA and indispensable resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = '${{ github.workspace }}\dist-x64'
          $required = @(
            "$dist\database\reference\manifest.json",
            "$dist\translations\fr\fr.json",
            "$dist\translations\en\en.json",
            "$dist\translations\fr\fr_navigation.json",
            "$dist\translations\en\en_navigation.json",
            "$dist\sqldrivers\qsqlite.dll",
            "$dist\MSVCP140.dll",
            "$dist\VCRUNTIME140.dll",
            "$dist\VCRUNTIME140_1.dll",
            "$dist\ai\runtime_manifest.json",
            "$dist\ai\llama-server.exe",
            "$dist\ai\ggml-cpu-x64.dll",
            "$dist\ai\models\ia-mems.gguf"
          )
          foreach ($path in $required) { if (-not (Test-Path $path)) { throw "Missing indispensable resource: $path" } }
          $runtimeHash = (Get-FileHash '${{ github.workspace }}\ai-stage\llama-b10516-bin-win-cpu-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          $modelHash = (Get-FileHash "$dist\ai\models\ia-mems.gguf" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($runtimeHash -ne 'fbbbc55e0eb2e1b07f9dcb9488616c98ed47d9003b90e15e7c8c7812c4307cd3') { throw 'Packaged IA runtime source hash mismatch' }
          if ($modelHash -ne '9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031') { throw 'Packaged IA model hash mismatch' }
          $cpuBackends = @(Get-ChildItem "$dist\ai" -File -Filter 'ggml-cpu-*.dll')
          if ($cpuBackends.Count -ne 1 -or $cpuBackends[0].Name -ine 'ggml-cpu-x64.dll') { throw 'Packaged IA CPU backend is not generic-only' }
          Write-Host 'PASS packaged SQLite/reference/translation/MSVC runtime + verified generic-only local IA resources'

      - name: Control IA - start llama Qwen and answer locally
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = '${{ github.workspace }}\dist-x64'
          $server = "$dist\ai\llama-server.exe"
          $model = "$dist\ai\models\ia-mems.gguf"
          $stdout = "$dist\IA_LLAMA_STDOUT.txt"
          $stderr = "$dist\IA_LLAMA_STDERR.txt"
          $args = @('-m', $model, '--alias', 'ia-mems', '--host', '127.0.0.1', '--port', '18089', '-c', '4096', '-np', '1')
          $proc = Start-Process -FilePath $server -ArgumentList $args -WorkingDirectory "$dist\ai" -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 120; $i++) {
              $proc.Refresh()
              if ($proc.HasExited) { break }
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:18089/health' -Method Get -TimeoutSec 2
                if ($health.status -eq 'ok') { $ready = $true; break }
              } catch { }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) {
              $outText = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { '' }
              $errText = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { '' }
              throw "Local IA did not become healthy. STDOUT=$outText STDERR=$errText"
            }

            $payload = @{
              model = 'ia-mems'
              messages = @(
                @{ role = 'system'; content = 'Answer briefly in English. Do not think aloud. /no_think' },
                @{ role = 'user'; content = 'Reply with a short confirmation that the MEMS29 local AI test works. /no_think' }
              )
              stream = $false
              temperature = 0.0
              max_tokens = 30
            } | ConvertTo-Json -Depth 8
            $response = Invoke-RestMethod -Uri 'http://127.0.0.1:18089/v1/chat/completions' -Method Post -ContentType 'application/json' -Body $payload -TimeoutSec 90
            $answer = [string]$response.choices[0].message.content
            if ([string]::IsNullOrWhiteSpace($answer)) { throw 'Local Qwen returned an empty answer' }
            Write-Host "PASS local IA response: $answer"
          }
          finally {
            $proc.Refresh()
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Control 13 - smoke launch packaged application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = '${{ github.workspace }}\dist-x64'
          $proc = Start-Process "$dist\ecu_mems_manager.exe" -WorkingDirectory $dist -PassThru
          Start-Sleep -Seconds 5
          $proc.Refresh()
          if ($proc.HasExited) { throw "x64 application exited during smoke launch (code $($proc.ExitCode))" }
          Stop-Process -Id $proc.Id -Force
          Write-Host 'PASS full application smoke launch'

      - name: Write 15-control report
        shell: pwsh
        run: |
          $dist = '${{ github.workspace }}\dist-x64'
          @(
            'BUILD #29 - v1.0.29',
            'ECU MEMS MANAGER NATIVE X64: 15/15 AUTOMATED CONTROLS PASSED + LOCAL IA SMOKE PASSED',
            '01 PASS full x64 application compile',
            '02 PASS mems_manager_x64.dll compile',
            '03 PASS ecu_mems_manager.exe PE32+ AMD64',
            '04 PASS mems_manager_x64.dll PE32+ AMD64',
            '05 PASS Qt/plugin/llama DLL architecture x64',
            '06 PASS QSQLITE + Qt SerialPort essentials',
            '07 PASS application imports mems_manager_x64.dll',
            '08 PASS application does not import librosco.dll',
            '09 PASS historical x86 librosco.dll absent',
            '10 PASS exactly 22 historical DLL exports',
            '11 PASS ABI frame80=28 frame7d=32 mems_data=60',
            '12 PASS protocol source guards',
            '13 PASS packaged full application smoke launch',
            '14 PASS SQLite semantic self-test + packaged reference resources + local MSVC x64 runtime',
            '15 PASS complete PE inventory AMD64 only',
            'NAV PASS deterministic 14/14 + BUILD 28 regression guards',
            'IA PASS targeted response self-test + six-language routing + last-measurement timestamp',
            'LOCAL IA PASS llama.cpp b10516 generic ggml-cpu-x64 + Qwen3-0.6B-Q8_0 health and chat completion'
          ) | Set-Content "$dist\ECU_MEMS_X64_15_CONTROLS.txt" -Encoding UTF8

      - name: Upload BUILD 29 artifact
        uses: actions/upload-artifact@v4
        with:
