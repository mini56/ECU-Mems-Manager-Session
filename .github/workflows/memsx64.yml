name: ECU MEMS Manager x64 BUILD 30
run-name: BUILD #30 - v1.0.30 - ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [MEMSX64]

concurrency:
  group: memsx64-build-30
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_x64:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      MEMS_BUILD: '30'
      MEMS_VERSION: '1.0.30'
      MEMS_BUILD_NUMBER: '30'
      LLAMA_RELEASE: 'b10516'
      LLAMA_COMMIT: 'b95502ba9aa0eb73a2f4fc8878d7fbe6a847a0b9'
      LLAMA_WIN_CPU_SHA256: 'fbbbc55e0eb2e1b07f9dcb9488616c98ed47d9003b90e15e7c8c7812c4307cd3'
      QWEN_SHA256: '9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031'
      VC_REDIST_URL: 'https://aka.ms/vc14/vc_redist.x64.exe'

    steps:
      - name: Checkout exact BUILD 30 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0" pefile

      - name: Install Qt 5.15.2 MSVC 2019 x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          if (Test-Path 'C:\Qt') { Remove-Item 'C:\Qt' -Recurse -Force -ErrorAction SilentlyContinue }
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtcharts -O C:\Qt --external "$sevenZip"
          if ($LASTEXITCODE -ne 0) { throw "aqtinstall failed: $LASTEXITCODE" }

      - name: Validate protocol guards before build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python librosco-x64/validate_protocol_guards.py

      - name: Configure and build ECU MEMS Manager x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build-x64 -A x64 `
            -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/msvc2019_64" `
            -DMEMS_USE_BUNDLED_LIBROSCO_X64=ON `
            -DMEMS_RUN_REFERENCE_SELFTEST_POST_BUILD=OFF
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed: $LASTEXITCODE" }

          cmake --build build-x64 --config Release --target `
            ecu_mems_manager ecu_mems_uninstaller rosco_abi_selftest `
            ia_response_selftest mems_search_selftest expert_runtime_selftest
          if ($LASTEXITCODE -ne 0) { throw "MEMS x64 build failed: $LASTEXITCODE" }

      - name: Run BUILD 30 self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = 'C:\Qt\5.15.2\msvc2019_64'
          $env:PATH = "$qtRoot\bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "$qtRoot\plugins"

          & '${{ github.workspace }}\build-x64\Release\ia_response_selftest.exe'
          if ($LASTEXITCODE -ne 0) { throw "IA response self-test failed: $LASTEXITCODE" }

          ctest --test-dir build-x64/librosco-x64 -C Release --output-on-failure -R rosco_abi_selftest
          if ($LASTEXITCODE -ne 0) { throw "Protocol ABI self-test failed: $LASTEXITCODE" }

          & '${{ github.workspace }}\build-x64\Release\mems_search_selftest.exe'
          if ($LASTEXITCODE -ne 0) { throw "MEMS reference semantic self-test failed: $LASTEXITCODE" }

      - name: Generate and validate packaged expert database r20
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = 'C:\Qt\5.15.2\msvc2019_64'
          $releaseRoot = '${{ github.workspace }}\build-x64\Release'
          $referenceSource = '${{ github.workspace }}\database\reference'
          $referenceRuntime = Join-Path $releaseRoot 'database\reference'
          $expertRuntime = Join-Path $releaseRoot 'database\expert'
          $cacheRoot = '${{ github.workspace }}\expert-runtime-cache'

          if (Test-Path $referenceRuntime) { Remove-Item $referenceRuntime -Recurse -Force }
          New-Item -ItemType Directory -Path (Split-Path $referenceRuntime -Parent) -Force | Out-Null
          Copy-Item $referenceSource $referenceRuntime -Recurse -Force
          if (Test-Path $expertRuntime) { Remove-Item $expertRuntime -Recurse -Force }
          if (Test-Path $cacheRoot) { Remove-Item $cacheRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $cacheRoot -Force | Out-Null

          $env:PATH = "$qtRoot\bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "$qtRoot\plugins"
          $savedLocalAppData = $env:LOCALAPPDATA
          $savedAppData = $env:APPDATA
          $generatorOutput = @()
          try {
            $env:LOCALAPPDATA = $cacheRoot
            $env:APPDATA = $cacheRoot
            & (Join-Path $releaseRoot 'expert_runtime_selftest.exe') 2>&1 | Tee-Object -Variable generatorOutput
            if ($LASTEXITCODE -ne 0) { throw "Expert runtime database generator failed: $LASTEXITCODE" }
          } finally {
            $env:LOCALAPPDATA = $savedLocalAppData
            $env:APPDATA = $savedAppData
          }

          $databaseLine = $generatorOutput | ForEach-Object { [string]$_ } |
            Where-Object { $_ -like 'EXPERT_RUNTIME_DATABASE=*' } | Select-Object -Last 1
          if (-not $databaseLine) { throw 'Expert runtime generator did not report EXPERT_RUNTIME_DATABASE' }
          $expertDbPath = $databaseLine.Substring('EXPERT_RUNTIME_DATABASE='.Length).Trim()
          if (-not (Test-Path -LiteralPath $expertDbPath -PathType Leaf)) { throw "Expert DB missing: $expertDbPath" }

          $env:EXPERT_DB = $expertDbPath
          @'
          import os,sqlite3
          p=os.environ["EXPERT_DB"]; db=sqlite3.connect(p)
          try:
              ok=db.execute("PRAGMA integrity_check").fetchone()[0]
              rev=db.execute("PRAGMA user_version").fetchone()[0]
          finally: db.close()
          if str(ok).lower()!="ok" or rev!=20: raise SystemExit(f"Invalid expert DB: integrity={ok} revision={rev}")
          print("PASS expert SQLite r20")
          '@ | python -
          "AI_EXPERT_DB=$expertDbPath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download official llama.cpp and stage required Microsoft VC++ v14 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP "llama-$env:LLAMA_RELEASE-bin-win-cpu-x64.zip"
          $runtime = '${{ github.workspace }}\llama-runtime-official-b10516'
          $msvcRuntime = '${{ github.workspace }}\llama-msvc-v14-app-local'
          $url = "https://github.com/ggml-org/llama.cpp/releases/download/$env:LLAMA_RELEASE/llama-$env:LLAMA_RELEASE-bin-win-cpu-x64.zip"

          if (Test-Path $runtime) { Remove-Item $runtime -Recurse -Force }
          if (Test-Path $msvcRuntime) { Remove-Item $msvcRuntime -Recurse -Force }
          New-Item -ItemType Directory -Path $runtime -Force | Out-Null
          New-Item -ItemType Directory -Path $msvcRuntime -Force | Out-Null
          & curl.exe -L --fail --retry 3 --retry-delay 3 -o $archive $url
          if ($LASTEXITCODE -ne 0) { throw "Official llama.cpp runtime download failed: $LASTEXITCODE" }

          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:LLAMA_WIN_CPU_SHA256) { throw "Official llama.cpp SHA256 mismatch: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $runtime -Force

          foreach ($name in @('llama-server.exe','llama.dll','ggml.dll','ggml-base.dll','ggml-cpu-x64.dll')) {
            if (-not (Test-Path (Join-Path $runtime $name) -PathType Leaf)) { throw "Official runtime missing: $name" }
          }
          $backends = @(Get-ChildItem $runtime -File -Filter 'ggml-cpu-*.dll')
          if ($backends.Count -lt 3) { throw "Official multi-variant backend set incomplete: $($backends.Count)" }

          # llama.cpp b10516 Windows x64 is built with the MSVC v14 toolchain.
          # Install Microsoft's current supported v14 x64 Redistributable on the CI host,
          # then stage only the VC++ DLLs actually imported by the official llama binaries.
          $vcRedist = Join-Path $env:RUNNER_TEMP 'vc_redist.x64.exe'
          & curl.exe -L --fail --retry 3 --retry-delay 3 -o $vcRedist $env:VC_REDIST_URL
          if ($LASTEXITCODE -ne 0) { throw "Microsoft VC++ v14 Redistributable download failed: $LASTEXITCODE" }
          $vcSha = (Get-FileHash $vcRedist -Algorithm SHA256).Hash.ToLowerInvariant()
          $vcFileVersion = (Get-Item $vcRedist).VersionInfo.FileVersion
          $vcInstall = Start-Process -FilePath $vcRedist -ArgumentList '/install','/quiet','/norestart' -Wait -PassThru
          if (@(0,1638,3010) -notcontains $vcInstall.ExitCode) {
            throw "Microsoft VC++ v14 Redistributable install failed: $($vcInstall.ExitCode)"
          }

          $env:LLAMA_RUNTIME_STAGE = $runtime
          $env:MSVC_RUNTIME_STAGE = $msvcRuntime
          @'
          import os,re,shutil
          from pathlib import Path
          import pefile

          runtime=Path(os.environ["LLAMA_RUNTIME_STAGE"])
          stage=Path(os.environ["MSVC_RUNTIME_STAGE"])
          system32=Path(os.environ["WINDIR"])/"System32"
          stage.mkdir(parents=True, exist_ok=True)
          redistributable=re.compile(r"^(?:msvcp|vcruntime|concrt)\d.*\.dll$", re.I)

          queue=[p for p in runtime.rglob("*") if p.is_file() and p.suffix.lower() in (".exe",".dll")]
          scanned=set()
          copied={}

          def imports(path):
              try:
                  pe=pefile.PE(str(path), fast_load=True)
                  pe.parse_data_directories(
                      directories=[
                          pefile.DIRECTORY_ENTRY["IMAGE_DIRECTORY_ENTRY_IMPORT"],
                          pefile.DIRECTORY_ENTRY["IMAGE_DIRECTORY_ENTRY_DELAY_IMPORT"],
                      ]
                  )
              except Exception as exc:
                  raise SystemExit(f"PE import scan failed for {path}: {exc}")
              names=[]
              for attr in ("DIRECTORY_ENTRY_IMPORT","DIRECTORY_ENTRY_DELAY_IMPORT"):
                  for entry in getattr(pe, attr, []):
                      try:
                          names.append(entry.dll.decode("ascii"))
                      except Exception:
                          pass
              pe.close()
              return names

          while queue:
              binary=queue.pop()
              key=str(binary).lower()
              if key in scanned:
                  continue
              scanned.add(key)
              for name in imports(binary):
                  if not redistributable.match(name):
                      continue
                  lower=name.lower()
                  if lower in copied:
                      continue
                  src=system32/name
                  if not src.is_file():
                      raise SystemExit(f"Required Microsoft VC++ runtime DLL not found after vc_redist install: {name}")
                  dst=stage/name
                  shutil.copy2(src,dst)
                  copied[lower]=dst
                  queue.append(dst)

          if not copied:
              raise SystemExit("No Microsoft VC++ v14 imports detected in official llama.cpp runtime")

          for name,path in sorted(copied.items()):
              pe=pefile.PE(str(path), fast_load=True)
              if pe.FILE_HEADER.Machine != 0x8664:
                  raise SystemExit(f"Microsoft runtime is not AMD64: {path.name}")
              pe.close()
              print(f"MSVC_APP_LOCAL={path.name}")
          print(f"PASS Microsoft VC++ app-local closure: {len(copied)} DLL(s)")
          '@ | python -

          $vcruntime = Join-Path $msvcRuntime 'vcruntime140.dll'
          if (-not (Test-Path $vcruntime -PathType Leaf)) { throw 'vcruntime140.dll was not staged for llama-server' }
          $runtimeVersion = (Get-Item $vcruntime).VersionInfo.FileVersion
          Write-Host "Microsoft VC++ source installer: version=$vcFileVersion sha256=$vcSha"
          Write-Host "Microsoft VC++ staged vcruntime140.dll: version=$runtimeVersion"

          $savedPath=$env:PATH; $env:PATH="$runtime;$msvcRuntime;$savedPath"
          Push-Location $runtime
          try {
            & (Join-Path $runtime 'llama-server.exe') --version
            if ($LASTEXITCODE -ne 0) { throw "Official llama-server --version failed with staged Microsoft runtime: $LASTEXITCODE" }
          } finally { Pop-Location; $env:PATH=$savedPath }

          Write-Host "PASS official llama.cpp b10516 runtime: SHA256=$actual; CPU backends=$($backends.Count)"
          "AI_RUNTIME_DIR=$runtime" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "AI_MSVC_RUNTIME_DIR=$msvcRuntime" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "VC_REDIST_SHA256=$vcSha" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "VC_REDIST_FILE_VERSION=$vcFileVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "VC_RUNTIME_FILE_VERSION=$runtimeVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download and verify Qwen3-0.6B-Q8_0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage='${{ github.workspace }}\ai-model-stage'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $model=Join-Path $stage 'ia-mems.gguf'
          & curl.exe -L --fail --retry 3 --retry-delay 3 -o $model 'https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf?download=true'
          if ($LASTEXITCODE -ne 0) { throw "Qwen model download failed: $LASTEXITCODE" }
          $actual=(Get-FileHash $model -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:QWEN_SHA256) { throw "Qwen SHA256 mismatch: $actual" }
          "AI_MODEL=$model" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Assemble BUILD 30 portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot='C:\Qt\5.15.2\msvc2019_64'
          $releaseRoot='${{ github.workspace }}\build-x64\Release'
          $dist='${{ github.workspace }}\dist-x64'
          if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          Copy-Item "$releaseRoot\ecu_mems_manager.exe" $dist -Force
          Copy-Item "$releaseRoot\ecu_mems_uninstaller.exe" $dist -Force
          Copy-Item '${{ github.workspace }}\build-x64\librosco-x64\Release\mems_manager_x64.dll' $dist -Force
          & "$qtRoot\bin\windeployqt.exe" --release --compiler-runtime --no-translations --dir $dist "$dist\ecu_mems_manager.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt app failed: $LASTEXITCODE" }
          & "$qtRoot\bin\windeployqt.exe" --release --compiler-runtime --no-translations --dir $dist "$dist\ecu_mems_uninstaller.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt uninstaller failed: $LASTEXITCODE" }

          foreach ($folder in @('translations','database')) {
            if (Test-Path "$releaseRoot\$folder") { Copy-Item "$releaseRoot\$folder" "$dist\$folder" -Recurse -Force }
          }

          New-Item -ItemType Directory -Path "$dist\database\expert" -Force | Out-Null
          Copy-Item $env:AI_EXPERT_DB "$dist\database\expert\ia_mems_reference_r20.sqlite" -Force

          New-Item -ItemType Directory -Path "$dist\ai\models" -Force | Out-Null
          Copy-Item "$env:AI_RUNTIME_DIR\*" "$dist\ai" -Recurse -Force
          Copy-Item "$env:AI_MSVC_RUNTIME_DIR\*" "$dist\ai" -Force
          Copy-Item $env:AI_MODEL "$dist\ai\models\ia-mems.gguf" -Force

          & curl.exe -L --fail --retry 3 --retry-delay 3 -o "$dist\ai\LLAMA_CPP_LICENSE.txt" "https://raw.githubusercontent.com/ggml-org/llama.cpp/$env:LLAMA_COMMIT/LICENSE"
          if ($LASTEXITCODE -ne 0) { throw "llama.cpp LICENSE download failed: $LASTEXITCODE" }

          @'
          {
            "schema_version": 4,
            "build": 30,
            "version": "1.0.30",
            "mode": "offline_local_only",
            "listen_address": "127.0.0.1",
            "runtime": {
              "name": "llama.cpp",
              "release": "b10516",
              "source_commit": "b95502ba9aa0eb73a2f4fc8878d7fbe6a847a0b9",
              "distribution": "official llama-b10516-bin-win-cpu-x64.zip",
              "archive_sha256": "fbbbc55e0eb2e1b07f9dcb9488616c98ed47d9003b90e15e7c8c7812c4307cd3",
              "profile": "official Windows x64 CPU multi-variant runtime kept intact; automatic compatible CPU backend selection",
              "msvc_deployment": "Microsoft Visual C++ v14 runtime dependencies required by llama-server are deployed app-local beside llama-server.exe"
            },
            "model": {
              "name": "Qwen3-0.6B-Q8_0",
              "runtime_filename": "models/ia-mems.gguf",
              "sha256": "9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031"
            },
            "expert_database": {
              "filename": "../database/expert/ia_mems_reference_r20.sqlite",
              "revision": 20,
              "runtime_mode": "read_only_prebuilt"
            }
          }
          '@ | Set-Content "$dist\ai\runtime_manifest.json" -Encoding UTF8

          @(
            'Source: Microsoft Visual C++ v14 x64 Redistributable',
            "URL: $env:VC_REDIST_URL",
            "Installer file version: $env:VC_REDIST_FILE_VERSION",
            "Installer SHA-256 used by this build: $env:VC_REDIST_SHA256",
            "Staged vcruntime140.dll file version: $env:VC_RUNTIME_FILE_VERSION",
            'Deployment: app-local DLL closure derived from PE imports of the official llama.cpp b10516 runtime'
          ) | Set-Content "$dist\ai\MSVC_RUNTIME_SOURCE.txt" -Encoding UTF8

          @(
            'ECU MEMS Manager BUILD #30 / v1.0.30',
            'IA locale: Qwen3-0.6B-Q8_0 + llama.cpp b10516',
            'Runtime: archive officielle Windows x64 CPU b10516, SHA-256 vérifié, contenu conservé intact',
            'CPU: sélection multi-variantes officielle llama.cpp pour PC x64 Intel/AMD',
            'MSVC: dépendances Visual C++ v14 requises par llama-server déployées localement dans ai/',
            '32 bits et protocole ECU inchangés'
          ) | Set-Content "$dist\README_BUILD30.txt" -Encoding UTF8

          $manifest="$dist\install_manifest.txt"
          $files=Get-ChildItem $dist -Recurse -File | ForEach-Object { $_.FullName.Substring($dist.Length+1).Replace('\','/') } | Sort-Object -Unique
          ($files + 'install_manifest.txt') | Sort-Object -Unique | Set-Content $manifest -Encoding UTF8
          "DIST=$dist" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate package and official llama runtime integrity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DIST_ROOT=$env:DIST
          @'
          import hashlib,os,re,sqlite3
          from pathlib import Path
          import pefile

          root=Path(os.environ["DIST_ROOT"]); ai=root/"ai"; src=Path(os.environ["AI_RUNTIME_DIR"])
          must=[root/"ecu_mems_manager.exe",root/"ecu_mems_uninstaller.exe",root/"mems_manager_x64.dll",
                ai/"llama-server.exe",ai/"llama.dll",ai/"ggml.dll",ai/"ggml-base.dll",ai/"ggml-cpu-x64.dll",
                ai/"vcruntime140.dll",ai/"MSVC_RUNTIME_SOURCE.txt",
                ai/"models"/"ia-mems.gguf",root/"database"/"expert"/"ia_mems_reference_r20.sqlite",root/"install_manifest.txt"]
          missing=[str(p.relative_to(root)) for p in must if not p.is_file()]
          if missing: raise SystemExit("Missing BUILD 30 files: "+", ".join(missing))

          def h(p):
              x=hashlib.sha256()
              with open(p,"rb") as f:
                  for b in iter(lambda:f.read(1048576),b""): x.update(b)
              return x.hexdigest()

          official=[p for p in src.rglob("*") if p.is_file()]
          if not official: raise SystemExit("Official llama runtime stage empty")
          for p in official:
              q=ai/p.relative_to(src)
              if not q.is_file() or h(p)!=h(q): raise SystemExit("Official llama runtime changed/missing: "+p.relative_to(src).as_posix())

          official_pe=[p for p in official if p.suffix.lower() in (".exe",".dll")]
          for p in [root/"ecu_mems_manager.exe",root/"ecu_mems_uninstaller.exe",root/"mems_manager_x64.dll"]+[ai/p.relative_to(src) for p in official_pe]:
              pe=pefile.PE(str(p), fast_load=True)
              if pe.FILE_HEADER.Machine != 0x8664: raise SystemExit(p.name+" is not AMD64")
              pe.close()

          redistributable=re.compile(r"^(?:msvcp|vcruntime|concrt)\d.*\.dll$", re.I)
          required=set()
          queue=[ai/p.relative_to(src) for p in official_pe]
          scanned=set()
          while queue:
              p=queue.pop()
              key=str(p).lower()
              if key in scanned: continue
              scanned.add(key)
              pe=pefile.PE(str(p), fast_load=True)
              pe.parse_data_directories(
                  directories=[
                      pefile.DIRECTORY_ENTRY["IMAGE_DIRECTORY_ENTRY_IMPORT"],
                      pefile.DIRECTORY_ENTRY["IMAGE_DIRECTORY_ENTRY_DELAY_IMPORT"],
                  ]
              )
              names=[]
              for attr in ("DIRECTORY_ENTRY_IMPORT","DIRECTORY_ENTRY_DELAY_IMPORT"):
                  for entry in getattr(pe,attr,[]):
                      try: names.append(entry.dll.decode("ascii"))
                      except Exception: pass
              pe.close()
              for name in names:
                  if not redistributable.match(name): continue
                  required.add(name.lower())
                  local=ai/name
                  if not local.is_file(): raise SystemExit("Missing app-local Microsoft VC++ dependency: "+name)
                  queue.append(local)

          if not required: raise SystemExit("No Microsoft VC++ app-local dependency closure found")
          for name in sorted(required):
              p=ai/name
              pe=pefile.PE(str(p), fast_load=True)
              if pe.FILE_HEADER.Machine != 0x8664: raise SystemExit(p.name+" is not AMD64")
              pe.close()

          backends=list(ai.glob("ggml-cpu-*.dll"))
          if len(backends)<3 or "ggml-cpu-x64.dll" not in {p.name.lower() for p in backends}: raise SystemExit("Official CPU backend set invalid")

          db=sqlite3.connect(str(root/"database"/"expert"/"ia_mems_reference_r20.sqlite"))
          try: ok=db.execute("PRAGMA integrity_check").fetchone()[0]; rev=db.execute("PRAGMA user_version").fetchone()[0]
          finally: db.close()
          if str(ok).lower()!="ok" or rev!=20: raise SystemExit(f"Invalid expert DB: {ok} r{rev}")

          print(f"PASS package: official llama files={len(official)}, CPU backends={len(backends)}, MSVC app-local={len(required)}, expert r{rev}")
          '@ | python -

      - name: Validate packaged official llama server model and API
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ai="$env:DIST\ai"; $server="$ai\llama-server.exe"; $model="$ai\models\ia-mems.gguf"
          $backends=@(Get-ChildItem $ai -File -Filter 'ggml-cpu-*.dll')
          if ($backends.Count -lt 3) { throw "Official multi-variant backend set incomplete: $($backends.Count)" }

          $savedPath=$env:PATH; $env:PATH="$ai;$savedPath"
          Push-Location $ai
          try {
            & $server --version
            if ($LASTEXITCODE -ne 0) { throw "Official llama-server --version failed: $LASTEXITCODE" }
          } finally { Pop-Location }

          $out="$env:RUNNER_TEMP\llama-official-out.log"; $err="$env:RUNNER_TEMP\llama-official-err.log"
          Remove-Item $out,$err -Force -ErrorAction SilentlyContinue
          $args=@('-m',$model,'--alias','ia-mems','--host','127.0.0.1','--port','18089','-c','4096','-np','1','--no-webui','--offline','--reasoning','off')
          $p=Start-Process -FilePath $server -WorkingDirectory $ai -ArgumentList $args -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -WindowStyle Hidden
          try {
            $ready=$false
            for($i=0;$i-lt180;$i++){
              Start-Sleep -Milliseconds 500
              if($p.HasExited){ throw "Official llama-server exited during Qwen load: $($p.ExitCode)" }
              try { $health=Invoke-RestMethod 'http://127.0.0.1:18089/health' -TimeoutSec 2; if($health.status-eq'ok'){$ready=$true;break} } catch {}
            }
            if(-not $ready){ throw 'Official llama-server did not become ready' }

            $models=Invoke-RestMethod 'http://127.0.0.1:18089/v1/models' -TimeoutSec 10
            if(@($models.data|ForEach-Object{$_.id}) -notcontains 'ia-mems'){ throw 'Unexpected /v1/models response' }

            $body=@{model='ia-mems';messages=@(@{role='user';content='Reponds uniquement: OK'});stream=$false;max_tokens=24;temperature=0.2}|ConvertTo-Json -Depth 8
            $reply=Invoke-RestMethod -Method Post 'http://127.0.0.1:18089/v1/chat/completions' -ContentType 'application/json' -Body $body -TimeoutSec 60
            if([string]::IsNullOrWhiteSpace([string]$reply.choices[0].message.content)){ throw 'Empty Qwen chat completion' }
            Write-Host "PASS official llama.cpp API"
          } finally {
            if($p -and -not $p.HasExited){ Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; $p.WaitForExit() }
            $env:PATH=$savedPath
          }

      - name: Smoke launch ECU MEMS Manager
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p=Start-Process -FilePath "$env:DIST\ecu_mems_manager.exe" -WorkingDirectory $env:DIST -PassThru
          Start-Sleep -Seconds 8
          if($p.HasExited){ throw "ECU MEMS Manager exited during smoke launch: $($p.ExitCode)" }
          $null=$p.CloseMainWindow()
          if(-not $p.WaitForExit(5000)){ Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          Write-Host 'PASS ECU MEMS Manager BUILD 30 smoke launch'

      - name: Generate BUILD 30 file hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hashFile="$env:DIST\BUILD30_SHA256.txt"; $manifest="$env:DIST\install_manifest.txt"
          if(-not((Get-Content $manifest)-contains'BUILD30_SHA256.txt')){ Add-Content $manifest 'BUILD30_SHA256.txt' -Encoding UTF8 }
          $lines=foreach($f in Get-ChildItem $env:DIST -Recurse -File | Where-Object{$_.FullName-ne$hashFile} | Sort-Object FullName){
            $r=$f.FullName.Substring($env:DIST.Length+1).Replace('\','/')
            "$((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $r"
          }
          $lines | Set-Content $hashFile -Encoding UTF8

      - name: Upload ECU MEMS Manager BUILD 30
        uses: actions/upload-artifact@v4
        with:
          name: ECU-MEMS-Manager-x64-BUILD-30-v1.0.30
          path: dist-x64/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
