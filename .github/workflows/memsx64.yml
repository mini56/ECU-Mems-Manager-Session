name: ECU MEMS Manager x64 BUILD 30
run-name: BUILD #30 - v1.0.30 - ONNX Windows probe - ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [MEMSX64]

concurrency:
  group: memsx64-build-30
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_x64:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      MEMS_BUILD: '30'
      MEMS_VERSION: '1.0.30'
      MEMS_BUILD_NUMBER: '30'
      ORT_GENAI_VERSION: '0.14.0'
      ORT_GENAI_WIN_X64_SHA256: '8a303e52dc7be8fb2a5331929af451a25ac59774102d7fd09ef673adc85c5ebf'
      ONNX_MODEL_REPO: 'xiaoyao9184/Qwen3-0.6B-onnx-genai'
      ONNX_MODEL_REVISION: 'e6bf97818c142808967a48cbab4f0aef18b64621'
      ONNX_MODEL_SUBDIR: 'cpu_and_mobile/cpu-int4-rtn-block-32-acc-level-4'
      ONNX_MODEL_ONNX_SHA256: 'b52cfcd91e6ed3caa34c670d4831d96cda3da5eb07ef95bc8ba06547b4f3b86f'
      ONNX_MODEL_DATA_SHA256: '8539cf4fbc3b5b331fd78ca8cd5b025ce537dfc2f993451f5c474b2f9fb7cd6c'
      ONNX_TOKENIZER_SHA256: 'be75606093db2094d7cd20f3c2f385c212750648bd6ea4fb2bf507a6a4c55506'

    steps:
      - name: Checkout exact BUILD 30 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0" pefile

      - name: Install Qt 5.15.2 MSVC 2019 x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          if (Test-Path 'C:\Qt') { Remove-Item 'C:\Qt' -Recurse -Force -ErrorAction SilentlyContinue }
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtcharts -O C:\Qt --external "$sevenZip"
          if ($LASTEXITCODE -ne 0) { throw "aqtinstall failed: $LASTEXITCODE" }

      - name: Validate protocol guards before build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python librosco-x64/validate_protocol_guards.py

      - name: Configure and build ECU MEMS Manager x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build-x64 -A x64 `
            -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/msvc2019_64" `
            -DMEMS_USE_BUNDLED_LIBROSCO_X64=ON `
            -DMEMS_RUN_REFERENCE_SELFTEST_POST_BUILD=OFF
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed: $LASTEXITCODE" }

          cmake --build build-x64 --config Release --target `
            ecu_mems_manager ecu_mems_uninstaller rosco_abi_selftest `
            ia_response_selftest mems_search_selftest expert_runtime_selftest
          if ($LASTEXITCODE -ne 0) { throw "MEMS x64 build failed: $LASTEXITCODE" }

      - name: Run BUILD 30 self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = 'C:\Qt\5.15.2\msvc2019_64'
          $env:PATH = "$qtRoot\bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "$qtRoot\plugins"

          & '${{ github.workspace }}\build-x64\Release\ia_response_selftest.exe'
          if ($LASTEXITCODE -ne 0) { throw "IA response self-test failed: $LASTEXITCODE" }

          ctest --test-dir build-x64/librosco-x64 -C Release --output-on-failure -R rosco_abi_selftest
          if ($LASTEXITCODE -ne 0) { throw "Protocol ABI self-test failed: $LASTEXITCODE" }

          & '${{ github.workspace }}\build-x64\Release\mems_search_selftest.exe'
          if ($LASTEXITCODE -ne 0) { throw "MEMS reference semantic self-test failed: $LASTEXITCODE" }

      - name: Generate and validate packaged expert database r20
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = 'C:\Qt\5.15.2\msvc2019_64'
          $releaseRoot = '${{ github.workspace }}\build-x64\Release'
          $referenceSource = '${{ github.workspace }}\database\reference'
          $referenceRuntime = Join-Path $releaseRoot 'database\reference'
          $cacheRoot = '${{ github.workspace }}\expert-runtime-cache'

          if (Test-Path $referenceRuntime) { Remove-Item $referenceRuntime -Recurse -Force }
          New-Item -ItemType Directory -Path (Split-Path $referenceRuntime -Parent) -Force | Out-Null
          Copy-Item $referenceSource $referenceRuntime -Recurse -Force
          if (Test-Path $cacheRoot) { Remove-Item $cacheRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $cacheRoot -Force | Out-Null

          $env:PATH = "$qtRoot\bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "$qtRoot\plugins"
          $savedLocalAppData = $env:LOCALAPPDATA
          $savedAppData = $env:APPDATA
          $generatorOutput = @()
          try {
            $env:LOCALAPPDATA = $cacheRoot
            $env:APPDATA = $cacheRoot
            & (Join-Path $releaseRoot 'expert_runtime_selftest.exe') 2>&1 | Tee-Object -Variable generatorOutput
            if ($LASTEXITCODE -ne 0) { throw "Expert runtime database generator failed: $LASTEXITCODE" }
          } finally {
            $env:LOCALAPPDATA = $savedLocalAppData
            $env:APPDATA = $savedAppData
          }

          $databaseLine = $generatorOutput | ForEach-Object { [string]$_ } |
            Where-Object { $_ -like 'EXPERT_RUNTIME_DATABASE=*' } | Select-Object -Last 1
          if (-not $databaseLine) { throw 'Expert runtime generator did not report EXPERT_RUNTIME_DATABASE' }
          $expertDbPath = $databaseLine.Substring('EXPERT_RUNTIME_DATABASE='.Length).Trim()
          if (-not (Test-Path -LiteralPath $expertDbPath -PathType Leaf)) { throw "Expert DB missing: $expertDbPath" }

          $env:EXPERT_DB = $expertDbPath
          @'
          import os, sqlite3
          p=os.environ['EXPERT_DB']
          db=sqlite3.connect(p)
          try:
              ok=db.execute('PRAGMA integrity_check').fetchone()[0]
              rev=db.execute('PRAGMA user_version').fetchone()[0]
          finally:
              db.close()
          if str(ok).lower()!='ok' or rev!=20:
              raise SystemExit(f'Invalid expert DB: integrity={ok} revision={rev}')
          print('PASS expert SQLite r20')
          '@ | python -

      - name: Verify official ONNX Runtime GenAI Windows x64 package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP "onnxruntime-genai-$env:ORT_GENAI_VERSION-win-x64.zip"
          $url = "https://github.com/microsoft/onnxruntime-genai/releases/download/v$env:ORT_GENAI_VERSION/onnxruntime-genai-$env:ORT_GENAI_VERSION-win-x64.zip"
          & curl.exe -L --fail --retry 3 --retry-delay 3 -o $archive $url
          if ($LASTEXITCODE -ne 0) { throw "ONNX Runtime GenAI package download failed: $LASTEXITCODE" }
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:ORT_GENAI_WIN_X64_SHA256) { throw "ONNX Runtime GenAI SHA256 mismatch: $actual" }
          $extract = '${{ github.workspace }}\onnx-genai-release'
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $headers = @(Get-ChildItem $extract -Recurse -File -Filter 'ort_genai*.h')
          $libs = @(Get-ChildItem $extract -Recurse -File | Where-Object { $_.Extension -in @('.dll','.lib') })
          if ($headers.Count -eq 0 -or $libs.Count -eq 0) { throw 'Official ONNX Runtime GenAI C/C++ package layout is incomplete' }
          Write-Host "PASS official ONNX Runtime GenAI $env:ORT_GENAI_VERSION Windows x64 package SHA256=$actual"
          Write-Host "Headers=$($headers.Count) native libraries=$($libs.Count)"

      - name: Install ONNX Runtime GenAI CPU Python runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check "onnxruntime-genai==$env:ORT_GENAI_VERSION" "huggingface_hub>=0.34,<1" hf_xet
          @'
          import platform, onnxruntime_genai as og
          print('Python:', platform.python_version())
          print('Platform:', platform.platform())
          print('Machine:', platform.machine())
          print('ONNX Runtime GenAI:', getattr(og, '__version__', 'unknown'))
          if platform.machine().lower() not in ('amd64','x86_64'):
              raise SystemExit('Windows probe is not running on x64')
          '@ | python -

      - name: Download pinned Qwen3-0.6B ONNX INT4 CPU model and verify hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $modelRoot = '${{ github.workspace }}\onnx-model-probe'
          if (Test-Path $modelRoot) { Remove-Item $modelRoot -Recurse -Force }
          $env:MODEL_ROOT = $modelRoot
          @'
          import os
          from huggingface_hub import snapshot_download
          root = snapshot_download(
              repo_id=os.environ['ONNX_MODEL_REPO'],
              revision=os.environ['ONNX_MODEL_REVISION'],
              allow_patterns=[os.environ['ONNX_MODEL_SUBDIR'] + '/*'],
              local_dir=os.environ['MODEL_ROOT'],
          )
          print('MODEL_SNAPSHOT=' + root)
          '@ | python -

          $modelDir = Join-Path $modelRoot $env:ONNX_MODEL_SUBDIR
          foreach ($name in @('genai_config.json','model.onnx','model.onnx.data','tokenizer.json','tokenizer_config.json','chat_template.jinja')) {
            if (-not (Test-Path (Join-Path $modelDir $name) -PathType Leaf)) { throw "ONNX model file missing: $name" }
          }
          $modelHash = (Get-FileHash (Join-Path $modelDir 'model.onnx') -Algorithm SHA256).Hash.ToLowerInvariant()
          $dataHash = (Get-FileHash (Join-Path $modelDir 'model.onnx.data') -Algorithm SHA256).Hash.ToLowerInvariant()
          $tokenizerHash = (Get-FileHash (Join-Path $modelDir 'tokenizer.json') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($modelHash -ne $env:ONNX_MODEL_ONNX_SHA256) { throw "model.onnx hash mismatch: $modelHash" }
          if ($dataHash -ne $env:ONNX_MODEL_DATA_SHA256) { throw "model.onnx.data hash mismatch: $dataHash" }
          if ($tokenizerHash -ne $env:ONNX_TOKENIZER_SHA256) { throw "tokenizer.json hash mismatch: $tokenizerHash" }
          "ONNX_MODEL_DIR=$modelDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'PASS pinned Qwen3-0.6B ONNX INT4 CPU model hashes'

      - name: Windows x64 ONNX Runtime GenAI Qwen generation probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PROBE_REPORT = '${{ github.workspace }}\onnx_probe_report.txt'
          @'
          import os, platform, time
          import onnxruntime_genai as og

          model_dir = os.environ['ONNX_MODEL_DIR']
          report = []
          report.append('ECU MEMS Manager BUILD #30 - ONNX Windows x64 probe')
          report.append('platform=' + platform.platform())
          report.append('machine=' + platform.machine())
          report.append('ort_genai=' + str(getattr(og, '__version__', 'unknown')))
          report.append('model_dir=' + model_dir)

          started = time.perf_counter()
          model = og.Model(model_dir)
          load_seconds = time.perf_counter() - started
          tokenizer = og.Tokenizer(model)
          stream = tokenizer.create_stream()

          prompt = (
              '<|im_start|>system\n'
              'Tu es un moteur de test local. Reponds sans raisonnement visible.<|im_end|>\n'
              '<|im_start|>user\n'
              'Reponds uniquement par OK. /no_think<|im_end|>\n'
              '<|im_start|>assistant\n'
          )
          input_tokens = tokenizer.encode(prompt)
          params = og.GeneratorParams(model)
          params.set_search_options(max_length=len(input_tokens) + 48, do_sample=False)
          generator = og.Generator(model, params)
          generator.append_tokens(input_tokens)

          generated = []
          generation_started = time.perf_counter()
          while not generator.is_done() and len(generated) < 48:
              generator.generate_next_token()
              token = generator.get_next_tokens()[0]
              generated.append(token)
          generation_seconds = time.perf_counter() - generation_started
          text = ''.join(stream.decode(t) for t in generated).strip()

          report.append(f'load_seconds={load_seconds:.3f}')
          report.append(f'generation_seconds={generation_seconds:.3f}')
          report.append(f'new_tokens={len(generated)}')
          report.append('output=' + text.replace('\r',' ').replace('\n','\\n'))
          with open(os.environ['PROBE_REPORT'], 'w', encoding='utf-8') as f:
              f.write('\n'.join(report) + '\n')

          print('\n'.join(report))
          if not text:
              raise SystemExit('ONNX Runtime GenAI returned an empty response')
          if 'OK' not in text.upper():
              raise SystemExit('ONNX Runtime GenAI did not produce the expected OK marker')
          print('PASS Windows x64 ONNX Runtime GenAI model load and generation')
          '@ | python -

      - name: Upload ONNX Windows probe report
        uses: actions/upload-artifact@v4
        with:
          name: ONNX-Windows-x64-Probe-BUILD-30
          path: onnx_probe_report.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
