name: Main MEMS reference database self-test

# Validates the exact database loader used by the Windows application.
on:
  workflow_dispatch:
  push:
    branches: ["lab-expert-engine"]
    paths:
      - "database/MemsReferenceDatabase.cpp"
      - "database/MemsGlobalSearchIndex.cpp"
      - "database/MemsSearchSelfTest.cpp"
      - "database/reference/manifest.json"
      - "database/reference/research_enrichment_1620.qz64"
      - "database/reference/research_enrichment_1640.qz64"
      - "database/reference/research_enrichment_1650.qz64"
      - ".github/workflows/main-reference-db-selftest.yml"

permissions:
  contents: write

jobs:
  reference-selftest-windows:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt 5.15.2, Charts and MinGW 32-bit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pip install aqtinstall
          & aqt install-qt windows desktop 5.15.2 win32_mingw81 -m qtcharts -O C:\Qt
          if ($LASTEXITCODE -ne 0) { throw "Qt installation failed" }
          & aqt install-tool windows desktop tools_mingw qt.tools.win32_mingw810 -O C:\Qt
          if ($LASTEXITCODE -ne 0) { throw "MinGW installation failed" }
          "C:\Qt\Tools\mingw810_32\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Qt\5.15.2\mingw81_32\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure and build main reference self-test
        shell: pwsh
        run: |
          cmake -B build-reference-test -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DMEMS_RUN_REFERENCE_SELFTEST_POST_BUILD=OFF -DCMAKE_PREFIX_PATH="C:/Qt/5.15.2/mingw81_32"
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
          cmake --build build-reference-test --target mems_search_selftest
          if ($LASTEXITCODE -ne 0) { throw "mems_search_selftest build failed" }
          New-Item -ItemType Directory -Force build-reference-test/database | Out-Null
          Copy-Item database/reference build-reference-test/database/reference -Recurse -Force

      - name: Run main reference database self-test
        id: selftest
        continue-on-error: true
        shell: pwsh
        run: |
          $env:QT_PLUGIN_PATH = "C:\Qt\5.15.2\mingw81_32\plugins"
          & .\build-reference-test\mems_search_selftest.exe
          exit $LASTEXITCODE

      - name: Record result
        if: always()
        shell: bash
        env:
          RESULT: ${{ steps.selftest.outcome }}
        run: |
          set -euo pipefail
          if [ "$RESULT" = "success" ]; then status="OK"; else status="FAILED"; fi
          printf 'Main MEMS reference database self-test: %s\nsource_commit=%s\nrun=%s\nresult=%s\n' \
            "$status" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$RESULT" > MAIN_REFERENCE_DB_SELFTEST.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f MAIN_REFERENCE_DB_SELFTEST.txt
          git commit -m "Record main reference database self-test [skip ci]" || exit 0
          git pull --rebase origin lab-expert-engine
          git push origin HEAD:lab-expert-engine

      - name: Fail if main reference database failed
        if: steps.selftest.outcome != 'success'
        shell: bash
        run: exit 1
