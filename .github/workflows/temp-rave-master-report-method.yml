name: TEMP RAVE MASTER REPORT METHOD

on:
  push:
    branches: [RAPPORT]
    paths:
      - '.github/workflows/temp-rave-master-report-method.yml'

permissions:
  contents: write

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0

      - name: Append canonical complete RAVE method
        run: python3 .github/scripts/temp_append_complete_rave_method.py

      - name: Commit report and remove temporary helpers
        shell: bash
        run: |
          rm -f .github/workflows/temp-rave-master-report-method.yml
          rm -f .github/scripts/temp_append_complete_rave_method.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          git add -u .github/workflows/temp-rave-master-report-method.yml
          git add -u .github/scripts/temp_append_complete_rave_method.py
          git commit -m "Record canonical complete RAVE extraction method"
          git push origin RAPPORT
