name: TEMP RAVE MASTER REPORT METHOD

on:
  push:
    branches:
      - RAPPORT
    paths:
      - .github/workflows/temp-rave-master-report-method.yml

permissions:
  contents: write

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RAPPORT
          fetch-depth: 0
      - name: Append report and clean helper
        run: |
          echo '' | base64 -d >> RAPPORT_SUIVI_ECU_MEMS_MANAGER.md
          rm -f .github/workflows/temp-rave-master-report-method.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add RAPPORT_SUIVI_ECU_MEMS_MANAGER.md .github/workflows/temp-rave-master-report-method.yml
          git commit -m 'Record canonical complete RAVE extraction method'
          git push origin RAPPORT
