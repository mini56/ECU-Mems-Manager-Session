## 2026-08-31 - METHODE RAVE COMPLETE UTILISATEUR FINAL - REGLE CANONIQUE

Constat : les lots RCL0193ENG p193-234 generes par la methode directe GitHub ont conserve le texte source integral et les principales donnees techniques, mais `visual_candidate` ne garantit pas un asset image local reel. Ces lots doivent etre repris avant de poursuivre p235 BRAKES afin de satisfaire completement le cahier des charges.

### Contenu obligatoire pour qu'une page RAVE soit consideree complete
Pour chaque page utile, conserver tous les elements applicables :
- texte source integral et provenance exacte document/page/figure ;
- faits, valeurs, couples, reglages, warnings, cautions, notes, outils, consommables et remplacements ;
- procedures entierement structurees dans l'ordre constructeur, avec etapes, prerequis, warnings, outils, pieces a remplacer, post-controles et specifications liees ;
- tableaux structures en lignes/colonnes/cellules, tout en conservant leur preuve visuelle ;
- portee explicite vehicule/moteur/variante/marche/annee/transmission/induction/VIN lorsqu'elle est presente ; une portee absente reste inconnue et ne doit jamais etre inventee ;
- tous supports visuels utiles (schema, figure, vue, illustration, tableau graphique) comme assets locaux reels avec chemin, SHA-256, dimensions et liaison a la connaissance.

Si le schema courant ne sait pas representer une information utile, ajouter de maniere additive la table/relation/champ/index necessaire. Il est interdit d'abandonner une information uniquement pour faire passer le lot.

### Regle unique de traduction des textes presents dans les images
Une seule methode d'affichage est autorisee : IMAGE CONSTRUCTEUR CONSERVEE + MASQUE NUMEROTE + LEGENDE TRADUITE DANS LE MEME RENDU IMAGE.
- conserver l'image constructeur originale intacte comme preuve ;
- detecter les zones de texte humain a traduire a partir des coordonnees PDF lorsque disponibles ;
- ne jamais masquer/modifier les ancres techniques immuables : reperes constructeur, references Rover/outils, valeurs, unites, dimensions, connecteurs, numeros de procedure, fleches et geometrie ;
- attribuer a chaque texte humain une cle stable, par exemple `RCL0193ENG_P193_T01`, et un numero visuel stable 1, 2, 3... ;
- dans le rendu utilisateur, masquer le texte humain original dans sa zone et le remplacer par son numero ;
- integrer dans CE MEME RENDU IMAGE une zone de legende indiquant `1. texte traduit`, `2. texte traduit`, etc. selon la langue active ; la legende ne doit pas etre une liste separee hors image ;
- stocker une seule image source et des zones/masques/cles de traduction, pas une copie raster par langue ;
- stockage Unicode et architecture extensible sans refonte.

Locales actuelles/presentees : `fr`, `en`, `es`, `it`, `pt`, `de`. L'architecture doit accepter ensuite notamment `ja` (japonais), `zh` (chinois) et les langues de l'Inde telles que `hi` (hindi), ainsi que d'autres scripts Unicode.

### Automatisation GitHub cible
Le traitement doit etre automatise autant que possible directement depuis le corpus canonique `main/rave/` :
1. verifier SHA/taille/page-count du PDF source ;
2. extraire texte + coordonnees PDF ;
3. rendre pages et assets visuels ;
4. classifier page : blank/text/visual/table/procedure/mixed ;
5. detecter zones de texte humain et produire masques numerotes + cles de traduction ;
6. extraire et structurer tableaux ;
7. extraire et structurer procedures completes et etapes ;
8. extraire les portees explicites ;
9. generer SQL/QZ64/audit/assets ;
10. appliquer un garde de completude par page ;
11. appliquer deux fois le SQL et verifier idempotence, `integrity_check`, `foreign_key_check` et roundtrip QZ64->SQL ;
12. verifier le perimetre et que MEMSX64 reste strictement BUILD #103 `1d6316bd1746d6f2b4cfb751cab88d18e27ef730`.

Toute extraction incertaine passe en `needs_review` et doit etre verifiee page par page. Aucune information difficile a automatiser ne doit etre supprimee silencieusement.

