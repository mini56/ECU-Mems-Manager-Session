name: Expert rule lots SQL smoke test

on:
  workflow_dispatch:
  push:
    branches: ["lab-expert-engine"]
    paths:
      - "database/reference/research_enrichment_1640.qz64"
      - "database/reference/research_enrichment_1650.qz64"
      - ".github/workflows/expert-rules-sql-smoke.yml"

permissions:
  contents: write

concurrency:
  group: expert-rule-sql-smoke
  cancel-in-progress: true

jobs:
  validate-rules:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Decode and execute expert rule lots
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python - <<'PY' > expert_rules_sql_trace.txt 2>&1
          import base64, pathlib, sqlite3, struct, zlib, json
          root = pathlib.Path('database/reference')
          db = sqlite3.connect(':memory:', isolation_level=None)
          report = []
          for name in ('research_enrichment_1640.qz64', 'research_enrichment_1650.qz64'):
              encoded = root.joinpath(name).read_bytes().strip()
              packed = base64.b64decode(encoded)
              if len(packed) < 6:
                  raise RuntimeError(f'{name}: packed stream too short')
              expected = struct.unpack('>I', packed[:4])[0]
              sql = zlib.decompress(packed[4:])
              if len(sql) != expected:
                  raise RuntimeError(f'{name}: qCompress size mismatch expected={expected} got={len(sql)}')
              text = sql.decode('utf-8')
              try:
                  db.executescript(text)
              except Exception as exc:
                  raise RuntimeError(f'{name}: SQL execution failed: {exc}') from exc
              report.append({'file': name, 'bytes': len(sql)})

          def scalar(sql):
              return db.execute(sql).fetchone()[0]

          counts = {
              'rules': scalar('SELECT COUNT(*) FROM mems_expert_rule'),
              'conditions': scalar('SELECT COUNT(*) FROM mems_expert_rule_condition'),
              'recommendations': scalar('SELECT COUNT(*) FROM mems_expert_rule_recommendation'),
              'active_dtc': scalar("SELECT COUNT(*) FROM mems_expert_rule WHERE rule_key='active_ecu_faults'"),
              'dwell': scalar("SELECT COUNT(*) FROM mems_expert_rule WHERE rule_key='coil_dwell_outside_near14v'"),
          }
          if counts['active_dtc'] != 1 or counts['dwell'] != 1:
              raise RuntimeError(f'expected initial rules missing: {counts}')

          condition_columns = [row[1] for row in db.execute('PRAGMA table_info(mems_expert_rule_condition)')]
          condition_rows = [dict(zip(condition_columns, row)) for row in db.execute('SELECT * FROM mems_expert_rule_condition ORDER BY rule_key, condition_order')]
          coolant_rows = [row for row in condition_rows if str(row.get('parameter', '')).strip().lower() == 'coolant_c']

          def is_seventy(value):
              if isinstance(value, (int, float)):
                  return float(value) == 70.0
              if isinstance(value, str):
                  try:
                      return float(value.strip()) == 70.0
                  except ValueError:
                      return False
              return False

          seventy_rows = [row for row in coolant_rows if any(is_seventy(value) for value in row.values())]
          if not seventy_rows:
              raise RuntimeError(f'70 C coolant threshold missing from expert rule conditions; coolant rows={coolant_rows}')

          condition_keys = [f'{r[0]}:{r[1]}' for r in db.execute('SELECT DISTINCT parameter,metric FROM mems_expert_rule_condition ORDER BY parameter,metric')]
          result = {
              'lots': report,
              'counts': counts,
              'condition_keys': condition_keys,
              'coolant_70_guard': seventy_rows,
          }
          print(json.dumps(result, indent=2, ensure_ascii=False))
          pathlib.Path('expert_rules_sql_result.txt').write_text(
              'Expert rule lots SQL smoke test: OK\n' +
              f'source_commit=${{ github.sha }}\nrun=${{ github.run_id }}\n' +
              json.dumps(result, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          code=$?
          cat expert_rules_sql_trace.txt
          exit $code
      - name: Record failure details
        if: steps.smoke.outcome != 'success'
        shell: bash
        run: |
          {
            printf 'Expert rule lots SQL smoke test: FAILED\nsource_commit=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID"
            cat expert_rules_sql_trace.txt 2>/dev/null || true
          } > expert_rules_sql_result.txt
      - name: Publish smoke-test result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- expert_rules_sql_result.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record expert rule SQL smoke test [skip ci]"
          git pull --rebase origin lab-expert-engine
          git push origin HEAD:lab-expert-engine
      - name: Fail workflow if SQL smoke test failed
        if: steps.smoke.outcome != 'success'
        shell: bash
        run: exit 1
