name: TEMP PATCH RAVEMEMS TEST2 COMPLETENESS
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-rave-new-extraction-pilot
          fetch-depth: 0
      - name: Fix TEST2 translation fixture
        run: python tools/temp_fix_ravemems_test2_fixture.py
      - name: Add TEST2 completeness gates
        run: python tools/temp_patch_ravemems_test2_completeness_gate.py
      - name: Compile patched TEST2
        run: python -m py_compile tools/ravemems_test2_raster_text.py
      - name: Commit corrected TEST2 and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'rerun TEST2 after linguistic completeness correction' > .ravemems-test2-trigger
          git config user.name github-actions-bot
          git config user.email github-actions@users.noreply.github.com
          git rm .github/workflows/temp-patch-ravemems-test2-completeness.yml tools/temp_fix_ravemems_test2_fixture.py tools/temp_patch_ravemems_test2_completeness_gate.py
          git add .github/ravemems_test2_page7_fr.json tools/ravemems_test2_raster_text.py .ravemems-test2-trigger
          expected="$(printf '%s\n' '.github/ravemems_test2_page7_fr.json' '.github/workflows/temp-patch-ravemems-test2-completeness.yml' '.ravemems-test2-trigger' 'tools/ravemems_test2_raster_text.py' 'tools/temp_fix_ravemems_test2_fixture.py' 'tools/temp_patch_ravemems_test2_completeness_gate.py' | sort)"
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$expected"
          git commit -m "Complete TEST2 raster language replacement guards"
          git push origin HEAD:tmp-rave-new-extraction-pilot
